<title>摩登家庭片語本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sitcom "episode guide" + daily study desk — nav row, today's dashboard, flashcard review, challenges, sentence notebook, progress calendar; each episode is its own page (#s01e02) */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#dde3ea;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --mark:#ffd95a; --done:#2e7d5b; --warn:#a15c00; --bad:#b3261e;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2b343e;
  --accent:#7fb6dc; --accent-soft:#1d2d3a; --mark:#b8932a; --done:#5cc196; --warn:#e0a24a; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2b343e;
  --accent:#7fb6dc; --accent-soft:#1d2d3a; --mark:#b8932a; --done:#5cc196; --warn:#e0a24a; --bad:#f08a80; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:860px;margin:0 auto}
a{color:var(--accent)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);display:flex;align-items:center;gap:4px 16px;padding-block:13px;border-bottom:1px solid var(--line);font-size:15px}
.nav .links{display:flex;flex-wrap:wrap;gap:4px 16px;min-width:0}
.nav a{text-decoration:none;color:var(--muted);padding-block:2px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.cur{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.sync{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
@media (max-width:560px){.nav{gap:4px 12px}.nav .links{gap:4px 13px}.sync .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.localnote{font-size:13.5px;color:var(--warn);margin:0}
.chunknote{font-size:14.5px}
.w{cursor:pointer;border-radius:3px;transition:background .1s}
.w:hover{background:var(--accent-soft)}
.w.sel{background:var(--mark);color:#1b2430}
#pickbar{position:fixed;left:12px;right:12px;bottom:12px;max-width:620px;margin:0 auto;z-index:60;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#pickbar[hidden]{display:none}
#pickbar p{margin:0}
.pk-h{font-size:15px}.pk-h .muted{display:block;font-size:12.5px}
.pk-h .zh{color:var(--muted)}
.pk-n{font-size:14px;color:var(--muted)}
.pk-ex{font-size:14.5px;border-left:3px solid var(--mark);padding-left:10px}
.pk-in,#addword{font:inherit;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.pk-src{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0}
.exhint summary{cursor:pointer;font-size:14px;color:var(--accent)}
.exhint .ex{margin-top:8px}
.chunknote b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--warn);letter-spacing:.06em;margin-right:6px}
.colbox .en b{font-weight:700}
@media (min-width:561px){.localnote{display:none}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.sg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:12px 4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.sg:hover{border-color:var(--accent)}
.sg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--done) 0 var(--m),var(--accent) 0 var(--l),var(--line) 0);display:grid;place-items:center}
.ring b{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 14px var(--f-display)}
.sg .sn{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sg-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:6px 0 12px}
.sg-leg span{display:inline-flex;align-items:center;gap:5px}
.sg-leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sg-leg i.m{background:var(--done)}.sg-leg i.l{background:var(--accent)}
.sync.ok{color:var(--done)} .sync.warn,.sync.local{color:var(--warn)}

header{padding-block:28px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,3.1rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 .ep{display:inline-block;font-family:var(--f-mono);font-size:.42em;font-weight:500;vertical-align:middle;border:1.5px solid var(--ink);padding:2px 8px;border-radius:4px;margin-left:6px;letter-spacing:0}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0}
.lede{color:var(--muted);max-width:62ch;margin:0}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:6px 0 0;max-width:62ch}

/* buttons */
.primary{font:500 15px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;cursor:pointer;white-space:nowrap}
.primary:hover{opacity:.88}
.primary:disabled{opacity:.45;cursor:default}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.done{border-color:var(--done);color:var(--done)}
.chip-btn{background:transparent;cursor:pointer;border-color:var(--done);color:var(--done);display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{background:var(--accent-soft)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:5px 16px}
.btn.go:hover{opacity:.88;color:var(--bg)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.confirm{border:1px solid var(--bad);border-radius:8px;padding:10px 14px;display:grid;gap:8px;font-size:14.5px}
.confirm p{margin:0}

/* dashboard */
.streak-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px 6px}
.streak{display:grid;gap:8px;min-width:0}
.sline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mini-link{display:grid;gap:6px;justify-items:end;text-decoration:none;color:var(--muted);flex:none;border-radius:8px;padding:4px}
.mini-link:hover{background:var(--accent-soft)}
.mini-cap{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.cal.mini{grid-template-columns:repeat(7,clamp(15px,4.4vw,22px));gap:3px;max-width:none}
.cal.mini .wd{font-size:10px;line-height:1.2}
.cal.mini .c{border-radius:4px}
.cal.mini .today{outline-width:1.5px}
.streak .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.streak .unit{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.streak .prot{font-size:14px;color:var(--muted)}
.dash{display:grid;gap:10px;margin-top:14px}
.task{display:grid;grid-template-columns:4.2rem 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.task.lead{border:1.5px solid var(--ink)}
.task .n{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.task .n.ok{color:var(--done)}
.task .what{min-width:0}
.task .what>b{display:block;font-weight:700}
.task .what>span{display:block;font-size:13.5px;color:var(--muted)}
.task .what>span b{color:var(--ink)}
.task-edit{grid-column:1 / -1;display:grid;gap:10px;margin-top:8px}
@media (max-width:480px){.task{grid-template-columns:3.2rem 1fr}.task>.act{grid-column:1 / -1}.task>.act .primary,.task>.act .btn{width:100%}}
.duo{display:grid;gap:12px;margin-top:22px}
@media (min-width:720px){.duo{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel .sec{font-size:1.2rem}
.panel p{margin:0}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px;border-bottom:1px dashed var(--line)}
.tlist li:last-child{border-bottom:0}
.tlist li>div{min-width:0}
.tlist .phrase{font-size:1.05rem}
.tlist .sent{font-size:15px}
.quote{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.35rem;line-height:1.4;text-wrap:balance;padding-left:14px;border-left:3px solid var(--mark)}
.recap .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pause{display:grid;gap:8px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;font-size:14.5px}
.pause select{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pause.on{border-style:solid;border-color:var(--warn)}

/* home episode list */
.list-head{display:grid;gap:12px}
.eplink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;border:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.eplink:hover{border-color:var(--accent);background:var(--accent-soft)}
.eplink span:last-child{color:var(--accent);font-weight:500;white-space:nowrap}
.tr-line{font-size:14.5px;color:var(--muted)}
.seasons{display:flex;flex-wrap:wrap;gap:8px;padding-block:4px 16px;border-bottom:1px solid var(--line)}
.eps{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.epi a,.epi .soon{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:14px 16px;border-radius:10px;text-decoration:none;color:var(--ink);height:100%;box-sizing:border-box}
.epi a{background:var(--surface);border:1.5px solid var(--ink)}
.epi a:hover{background:var(--accent-soft)}
.epi .soon{border:1px dashed var(--line);color:var(--muted)}
.epi .num{font-family:var(--f-mono);font-size:13px;grid-row:span 2}
.epi .t{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.3}
.epi .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.epi a .s{color:var(--done)}
.legend{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.epi a.watched{border-color:var(--done)}
.epi a.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.nextbadge{display:inline-block;font:600 11px var(--f-mono);color:var(--surface);background:var(--accent);padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.nowwatch{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:center}
.nw-slate{align-self:stretch;background:var(--ink);color:var(--bg);border-radius:8px;width:4.8rem;padding:10px 0;display:grid;align-content:center;justify-items:center;gap:6px;line-height:1}
.nw-slate .s{font:500 12px var(--f-mono);letter-spacing:.1em;opacity:.7}
.nw-slate .e{font:800 1.85rem var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nw-body{min-width:0;display:grid;gap:4px}
.nw-k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);margin:0}
.nw-t{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
.nw-strip{display:flex;gap:2px;margin-top:6px;max-width:22rem}
.nw-strip i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.nw-strip i.w{background:var(--done)}
.nw-strip i.n{background:var(--accent)}
.nw-sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:2px 0 0;font-variant-numeric:tabular-nums}
.nw-act{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.nw-act .primary{text-decoration:none;flex:1;text-align:center}
.nw-act .btn{padding:9px 14px;font-size:14px}
.nowwatch.done .nw-slate{background:var(--done)}
@media (min-width:600px){.nowwatch{grid-template-columns:auto 1fr auto}.nw-act{grid-column:auto;flex-direction:column}}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0}
.adv-btn{border-radius:10px;padding:0 14px;font-size:14px;border-width:1.5px}
.adv-btn.on{border-color:var(--accent);color:var(--accent)}
.advbox{display:grid;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* finder */
.finder{display:grid;gap:10px;margin:4px 0 14px}
.finder input[type=search]{font:inherit;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.finder input[type=search]:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .tab{font-size:13px;padding:4px 11px}
.chips .lab{font-size:12.5px;color:var(--muted);margin-right:2px}
.hitcount{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.hits{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hit{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hit.learned{border-color:var(--done)}
.hit-main{all:unset;cursor:pointer;display:grid;gap:3px;min-width:0;flex:1 1 220px}
.hit-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.hit-main .zh{color:var(--muted);font-size:14px}
.hit .phrase{font-size:1.05rem}
.hit .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hit-act{display:flex;gap:6px;flex-shrink:0;align-items:center}
.lvl{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
.lvl.b{border-color:var(--warn);color:var(--warn)}
/* spoiler guard */
.spoil{filter:blur(5px);cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:4px;transition:filter .15s}
.spoil:hover{filter:blur(3.5px)}
.spoil:focus-visible{outline:2px solid var(--accent);outline-offset:3px;filter:blur(3.5px)}
.spnote{font-size:13.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0 0;max-width:62ch}
.watchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.card.focus{animation:focusglow 2s ease-out}
@keyframes focusglow{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.card.focus{animation:none;box-shadow:0 0 0 3px var(--accent)}}

/* episode */
.toolbar{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{font:500 14px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.progress{font-family:var(--f-mono);font-size:13px;color:var(--done);font-variant-numeric:tabular-nums}
.story{margin-top:36px}
.story h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0 0 4px}
.story .who{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:0 0 6px}
.story .plot{margin:0 0 16px;max-width:62ch;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:10px;min-width:0}
.card.learned{border-color:var(--done)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.phrase{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;line-height:1.3;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:.24em;text-decoration-skip-ink:auto}
.zh{font-weight:500}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scene{font-size:14.5px;color:var(--muted);margin:0}
.scene b,.try b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--accent);letter-spacing:.06em;margin-right:6px}
.ex{background:var(--accent-soft);border-radius:8px;padding:10px 14px;display:grid;gap:2px;min-width:0}
.ex .en{font-size:1.05rem;margin:0}
.ex .tr{font-size:14px;color:var(--muted);margin:0}
.tip{font-size:14px;margin:0}
.tip b{color:var(--accent)}
body.hide-zh .zh,body.hide-zh .tr{filter:blur(6px);cursor:pointer;transition:filter .15s}
body.hide-zh .zh:hover,body.hide-zh .tr:hover{filter:none}
.practice{margin-top:44px;border-top:2px solid var(--ink);padding-top:20px;display:grid;gap:14px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;margin-top:2px}
.steps p{margin:0}
.steps .time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.prompts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.prompt{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px}
.prompt span{display:block;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-bottom:2px}

/* stats */

 background:linear-gradient(90deg,transparent calc(50% - 15px),var(--mark) calc(50% - 15px),var(--mark) calc(50% + 15px),transparent calc(50% + 15px)),linear-gradient(0deg,transparent calc(50% - 15px),var(--mark) calc(50% - 15px),var(--mark) calc(50% + 15px),transparent calc(50% + 15px)),var(--accent-soft);
 transition:transform .18s ease}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.reveal{animation:none}}

<script>
/* ---------- content ---------- */
const COUNTS=[24,24,24,24,24,24,22,22,22,22,18];
const S1_TITLES=["Pilot","The Bicycle Thief","Come Fly with Me","The Incident","Coal Digger","Run for Your Wife","En Garde","Great Expectations","Fizbo","Undeck the Halls","Up All Night","Not in My House","Fifteen Percent","Moon Landing","My Funky Valentine","Fears","Truth Be Told","Starry Night","Game Changer","Benched","Travels with Scout","Airport 2010","Hawaii","Family Portrait"];

const EPISODES=__EPISODES__;

/* ---------- helpers ---------- */
const LADDER=[1,3,7,14,30,60,120,240], CAP=10, NEW_BATCH=5, DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const key=(s,e)=>`s${pad(s)}e${pad(e)}`;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $=s=>document.querySelector(s);
const epLabel=k=>k.slice(0,3).toUpperCase()+" "+k.slice(3).toUpperCase();
function dayNum(dt=new Date()){return Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/DAY)}
const today=()=>dayNum();
const dkey=n=>new Date(n*DAY).toISOString().slice(0,10);
const fromKey=k=>Math.floor(Date.parse(k+"T00:00:00Z")/DAY);
const md=n=>{const d=new Date(n*DAY);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
const weekStart=d=>d-((d+3)%7);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function whenText(n){return n<=1?"明天":`${n} 天後`}

const ITEMS=[],IDX={};
Object.keys(EPISODES).sort().forEach(k=>EPISODES[k].stories.forEach(st=>st.items.forEach(it=>{const o={k,p:it.p,it,st};ITEMS.push(o);IDX[k+"|"+it.p]=o})));
/* custom phrases: saved from Claude's 「多學一個搭配」 suggestion, stored in S.eps.custom.cards[phrase] with .custom={zh,ex,from} */
const normP=p=>String(p||"").toLowerCase().replace(/[’]/g,"'").replace(/[?!.,]/g,"").replace(/\b(someone|something|somebody|one's|someone's)\b/g,"").trim().replace(/^(be|to|get) /,"").replace(/\s+/g," ").trim();
const NIDX={};ITEMS.forEach(o=>{NIDX[normP(o.p)]=o});
function itemOf(k,p){const o=IDX[k+"|"+p];if(o)return o;if(k!=="custom")return null;const c=S.eps.custom&&S.eps.custom.cards&&S.eps.custom.cards[p];if(!c||!c.custom)return null;
 const cu=c.custom,tip=[cu.note?`<b>用法：</b>${esc(cu.note)}`:"",cu.src?`<b>出處：</b>${esc(cu.src)}`:"",cu.from?`<b>來源：</b>用「${esc(cu.from)}」造句時推薦的`:""].filter(Boolean).join("<br>");
 return{k,p,custom:true,st:{id:"custom",name:"自己收的"},it:{zh:esc(cu.zh||""),scene:cu.src?"從例句裡收藏的字詞":cu.from?"造句審核時 Claude 推薦的搭配":"自己加的字詞",en:cu.ex||p,tr:"",tip}}}
const srcLabel=k=>k==="custom"?"自己收的":epLabel(k);
const srcFull=k=>k==="custom"?"我收藏的字詞":`${epLabel(k)} · ${esc(EPISODES[k].title)}`;
/* tap words in example sentences to collect them */
function tapText(en){return `<span class="tapzone" data-src="${esc(en)}">${String(en).split(/(\s+)/).map(t=>/^\s+$/.test(t)||!t?t:`<span class="w" data-act="tapw">${esc(t)}</span>`).join("")}</span>`}
const pick={zone:null,phrase:"",sentence:"",state:"idle",res:null};
const cleanSel=t=>t.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,"");
function addCustom(phrase,data){const t=today(),en=phrase.trim().slice(0,80);if(!en)return null;
 const o=NIDX[normP(en)];
 if(o){if(!card(o.k,o.p)){epDoc(o.k).cards[o.p]=newCard(t);bump("n");touch(o.k);touch("profile")}return `✓ 已搞定 · 這是 ${epLabel(o.k)} 的片語`}
 if(!card("custom",en)){epDoc("custom").cards[en]=Object.assign(newCard(t),{custom:Object.assign({zh:"",ex:"",note:"",src:"",from:""},data)});bump("n");touch("custom");touch("profile")}
 return "✓ 已收進片語本 · 明天開始複習"}

/* ---------- watch progress, spoiler guard, tags ---------- */
const EKEYS=Object.keys(EPISODES).sort();
const STORY_NAMES={dunphy:"Dunphy 家",jay:"Jay 家",mitch:"Mitchell 家",kids:"孩子們",family:"全家",gloria:"Gloria"};
const THEMES=["","感情","家人朋友","工作學校","情緒","衝突","安慰鼓勵","聊天反應","生活日常","形容人事","計畫行動"];
const LEVELS=["","基礎","進階"];
const watchedMap=()=>S.profile.watched||{};
function frontier(){const w=Object.keys(watchedMap()).filter(k=>EPISODES[k]).sort();return w.length?w[w.length-1]:""}
function nextEp(){const f=frontier(),w=watchedMap();return EKEYS.find(k=>k>f&&!w[k])||null}
const guardOn=()=>S.profile.spoil!==false;
const isSpoil=k=>guardOn()&&k>frontier();
const peeked=new Set();
function sp(k,id,html){if(!isSpoil(k)||peeked.has(id))return html;return `<span class="spoil" data-act="peek" data-id="${esc(id)}" role="button" tabindex="0" title="可能有雷，點一下顯示" aria-label="劇情先遮住了，點一下顯示">${html}</span>`}
const storyName=(k,st,i)=>isSpoil(k)?(STORY_NAMES[st.id]||`故事 ${i+1}`):st.name;
const plain=s=>String(s||"").replace(/<[^>]+>/g,"");
let pendingFocus=null;

/* ---------- state ---------- */
const LS="mf-v2";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function normProfile(p){const o=Object.assign({days:{},pause:null,pauses:[],migrated:false,watched:{},spoil:true},p||{});if(!o.watched||typeof o.watched!=="object")o.watched={};return o}
function load(){let s=null;try{s=JSON.parse(lsGet(LS)||"null")}catch(e){}if(!s||typeof s!=="object")s={};s.profile=normProfile(s.profile);s.eps=s.eps||{};return s}
let S=load();
const saveLocal=()=>lsSet(LS,JSON.stringify(S));
const epDoc=k=>S.eps[k]||(S.eps[k]={cards:{}});
const card=(k,p)=>S.eps[k]&&S.eps[k].cards&&S.eps[k].cards[p];
function allCards(){const out=[];for(const k in S.eps){const cs=(S.eps[k]&&S.eps[k].cards)||{};for(const p in cs){const o=itemOf(k,p);if(o)out.push({k,p,c:cs[p],it:o.it})}}return out}
const dayGet=n=>S.profile.days[dkey(n)]||{};
function dayLog(n=today()){const k=dkey(n);return S.profile.days[k]||(S.profile.days[k]={})}
function bump(f){const d=dayLog();d[f]=(d[f]||0)+1}
const actCount=g=>(g.r||0)+(g.n||0)+(g.x||0)+(g.w||0)+(g.ch?Object.keys(g.ch).length:0);
const active=d=>actCount(dayGet(d))>0;
const newCard=t=>({s:0,due:t+1,last:null,reps:0,lapses:0,added:t});
const isMastered=c=>c.s>=3;
const isWeak=c=>c.s<3&&(c.lapses||0)>=2;

function migrateOld(){
 if(S.profile.migrated)return;
 let old={};
 try{old=JSON.parse(lsGet("mf-learned")||"{}")||{}}catch(e){}
 try{const o1=JSON.parse(lsGet("mf-s1e1")||"null");if(o1&&!old.s01e01)old.s01e01=o1}catch(e){}
 const t=today();
 for(const k in old){if(!EPISODES[k]||!old[k])continue;for(const p in old[k]){if(old[k][p]&&IDX[k+"|"+p]&&!card(k,p))epDoc(k).cards[p]=newCard(t)}}
 S.profile.migrated=true;saveLocal();
}

/* ---------- scheduling ---------- */
function schedule(c,g,t){
 const elapsed=c.last==null?t-c.added:t-c.last;
 let s=c.s||0,interval;
 if(g===0){s=0;interval=1}
 else if(g===1){interval=Math.max(2,LADDER[s])}
 else{s=Math.min(s+1,LADDER.length-1);if(elapsed>=LADDER[s]&&s<LADDER.length-1)s++;interval=LADDER[s]}
 return {s,interval};
}
function dueList(t=today()){if(S.profile.pause)return[];return allCards().filter(x=>x.c.due<=t).sort((a,b)=>a.c.due-b.c.due||a.c.s-b.c.s)}
const todayQuota=()=>Math.max(0,CAP-(dayGet(today()).r||0));
function isPaused(d){const P=S.profile;if(P.pauses.some(p=>d>=p.from&&d<p.to))return true;return !!(P.pause&&d>=P.pause.from&&d<P.pause.from+P.pause.days)}
function streakInfo(){
 const t=today(),keys=Object.keys(S.profile.days).filter(k=>actCount(S.profile.days[k])>0);
 const prot=new Set();
 if(!keys.length)return{streak:0,protLeft:1,prot};
 const first=Math.min(...keys.map(fromKey));
 let d=active(t)?t:t-1,streak=0;const used=new Set();
 while(d>=first){
  if(active(d))streak++;
  else if(!isPaused(d)){const w=weekStart(d);if(used.has(w))break;used.add(w);prot.add(d)}
  d--;
 }
 return{streak,protLeft:used.has(weekStart(t))?0:1,prot};
}
function endPause(endDay){
 const p=S.profile.pause;if(!p)return;
 const shift=Math.max(0,Math.min(endDay,p.from+p.days)-p.from);
 if(shift>0){for(const k in S.eps){const cs=S.eps[k].cards||{};let ch=false;for(const ph in cs){cs[ph].due+=shift;ch=true}if(ch)touch(k)}S.profile.pauses.push({from:p.from,to:p.from+shift})}
 S.profile.pause=null;touch("profile");
}
function maintain(){const p=S.profile.pause;if(p&&today()>=p.from+p.days)endPause(p.from+p.days)}

/* ---------- cloud sync ---------- */
let mode="local",db=null,uid=null,syncState="connecting",syncMsg="";
const dirty=new Set(),inflight=new Set();let flushing=false,flushTimer=null,failCount=0;
const col=()=>db.collection("data/users/"+uid);
const bodyOf=id=>id==="profile"?S.profile:(S.eps[id]||{cards:{}});
function touch(id){saveLocal();if(mode!=="cloud")return;dirty.add(id);clearTimeout(flushTimer);flushTimer=setTimeout(flush,500)}
async function flush(){
 if(flushing||mode!=="cloud")return;flushing=true;setSync("saving");let ok=true;
 while(dirty.size&&mode==="cloud"){
  const id=dirty.values().next().value;dirty.delete(id);inflight.add(id);
  try{await col().doc(id).set(JSON.parse(JSON.stringify(bodyOf(id))));failCount=0}
  catch(e){ok=false;inflight.delete(id);onWriteError(e,id);break}
  inflight.delete(id);
 }
 flushing=false;if(ok&&mode==="cloud")setSync("ok");
}
function onWriteError(e,id){
 const code=e&&e.code;
 if(!code||code==="unavailable"||code==="resource_exhausted"){dirty.add(id);failCount++;if(failCount<=2)setTimeout(flush,1500+Math.random()*1500);else setSync("warn","暫時無法同步，進度先存在這台裝置")}
 else if(code==="quota_exceeded")setSync("warn","雲端空間已滿，新進度只存在這台裝置");
 else goLocal("無法寫入雲端，進度只存在這台裝置");
}
function goLocal(msg){mode="local";dirty.clear();setSync("local",msg);maintain();refresh()}
function setSync(st,msg){syncState=st;if(msg!==undefined)syncMsg=msg;const el=$("#sync");if(el){el.className="sync "+syncClass();el.title=syncText();el.innerHTML=`<span class="txt">${esc(syncText())}</span>`}const ln=$("#localnote");if(ln){const show=syncState==="local"||syncState==="warn";ln.hidden=!show;ln.textContent=show?syncText():""}}
const syncClass=()=>({ok:"ok",warn:"warn",local:"local"})[syncState]||"";
const syncText=()=>({connecting:"連線中…",saving:"同步中…",ok:"已同步到你的帳號"})[syncState]||syncMsg;

function mergeFirst(snap){
 const cloud={};snap.docs.forEach(d=>{if(d.exists)cloud[d.id]=JSON.parse(JSON.stringify(d.data()))});
 const lp=S.profile,cp=cloud.profile;
 if(cp){
  const m=normProfile(cp);
  for(const dk in lp.days){const a=lp.days[dk],b=m.days[dk]||{},o=Object.assign({},b);
   for(const f in a){if(f==="ch")o.ch=Object.assign({},a.ch||{},b.ch||{});else o[f]=Math.max(a[f]||0,b[f]||0)}
   m.days[dk]=o}
  m.migrated=!!(cp.migrated||lp.migrated);
  m.watched=Object.assign({},lp.watched||{},cp.watched||{});
  if(cp.spoil===undefined&&lp.spoil!==undefined)m.spoil=lp.spoil;
  if(JSON.stringify(m)!==JSON.stringify(cp))dirty.add("profile");
  S.profile=m;
 }else dirty.add("profile");
 const ids=new Set([...Object.keys(cloud).filter(x=>x!=="profile"),...Object.keys(S.eps)]);
 for(const id of ids){
  const c=cloud[id],l=S.eps[id];
  if(!c){if(l&&Object.keys(l.cards||{}).length)dirty.add(id);continue}
  const m={cards:Object.assign({},c.cards||{})};
  if(l)for(const p in (l.cards||{}))if(!m.cards[p])m.cards[p]=l.cards[p];
  if(JSON.stringify(m)!==JSON.stringify(c))dirty.add(id);
  S.eps[id]=m;
 }
}
function applySnap(snap){
 snap.docs.forEach(d=>{
  if(!d.exists||dirty.has(d.id)||inflight.has(d.id))return;
  const data=JSON.parse(JSON.stringify(d.data()));
  if(d.id==="profile")S.profile=normProfile(data);else S.eps[d.id]={cards:data.cards||{}};
 });
}
async function connect(){
 const cl=window.claude;
 if(!cl||typeof cl.use!=="function"){goLocal("未登入 Claude，進度只存在這台裝置");return}
 let u=null;
 try{[db,u]=await Promise.all([cl.use("db"),cl.use("user")])}catch(e){}
 if(!db||!u){goLocal("未登入 Claude，進度只存在這台裝置");return}
 try{uid=await u.id()}catch(e){}
 if(!uid){goLocal("未登入 Claude，進度只存在這台裝置");return}
 let first=true;
 try{
  col().onSnapshot(snap=>{
   if(first&&snap.metadata.fromCache)return;
   const before=JSON.stringify(S),wasFirst=first;
   if(first){first=false;mergeFirst(snap);mode="cloud";setSync("ok");if(dirty.size)flush()}
   else applySnap(snap);
   maintain();
   if(wasFirst||JSON.stringify(S)!==before){saveLocal();refresh()}
  },()=>{goLocal("雲端連線中斷，進度先存在這台裝置")});
 }catch(e){goLocal("無法連上雲端，進度只存在這台裝置")}
}

function lookupPrompt(sel,sentence){
 return `A Taiwanese learner of everyday spoken American English wants to save "${sel}"${sentence?` from this sentence:\n"""${sentence}"""`:"."}
Reply with only a JSON object in this shape:
{"base":"what to save, in dictionary form. If the selection is part of a common chunk or collocation, expand it to that natural chunk (e.g. 'progress' in 'we made progress' → 'make progress'; 'gave up' → 'give up'); otherwise the word itself. Keep it short.","zh":"簡短的繁體中文意思（台灣用語）","note":"一句繁體中文用法說明，提到常見搭配","ex":"one new short everyday example sentence using it"}`;
}
function reviewPrompt(o,text){
 return `You are a friendly English-speaking coach for a Taiwanese learner practicing everyday spoken American English.
Target phrase: "${o.p}" (meaning in Chinese: ${o.it.zh}).
The learner wrote this sentence to practice the phrase:
"""${text}"""

Check four things: (1) is the target phrase used with the correct meaning and form; (2) grammar or spelling errors; (3) would an American say it this way in casual conversation; (4) word chunks: is the target phrase kept as one intact chunk (not split, reordered, or with a fixed word swapped — e.g. "do progress" instead of "make progress"), and are the other verb–noun / adjective–noun collocations in the sentence natural.
Reply with only a JSON object in this shape:
{"verdict":"good"|"minor"|"wrong","phraseOk":true|false,"chunkOk":true|false,"chunkNote":"一句繁體中文，說明語塊被拆開或搭配詞不自然的地方；完全沒問題就給空字串","fixes":[{"from":"original words","to":"corrected words","why":"一句繁體中文說明"}],"natural":"the whole sentence rewritten the way a native speaker would naturally say it","comment":"一句繁體中文總評，具體、鼓勵","collocation":{"en":"one extra common chunk or collocation worth learning that goes naturally with the target phrase or the learner's topic (not the target phrase itself)","zh":"中文意思","ex":"a short everyday example sentence using it"}}
A broken chunk or unnatural collocation counts as at least "minor" (and goes into fixes). Use "good" when it is correct and natural (fixes may be empty and natural may equal the original), "minor" for small grammar or naturalness fixes, "wrong" when the target phrase is misused or the meaning is off. Keep the learner's own idea and content in "natural". At most 4 fixes.`;
}
function errCopy(e){
 const c=e&&e.code;
 if(c==="not_granted")return"你沒有允許這個網站使用 Claude，所以無法審核。可以先直接存起來。";
 if(c==="rate_limited")return"Claude 額度暫時用完或送出太頻繁，晚點再試，或先直接存起來。";
 if(c==="session_expired")return"請重新登入 Claude 後再試。";
 if(c==="refused")return"Claude 沒辦法審核這句，換個寫法再試試。";
 if(["sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))return"這裡無法使用 Claude 審核，可以先直接存起來。";
 return"審核沒有成功，再按一次「送出審核」試試。";
}

const PASS=v=>v==="good"||v==="fixed";
function dailySentence(){
 const t=today(),cs=allCards();
 if(!cs.length)return{state:"none"};
 const todays=cs.filter(x=>x.c.sent&&x.c.sent.at===t);
 const done=todays.find(x=>x.c.sent.v);
 if(done)return{state:"done",x:done};
 if(todays.length)return{state:"todo",x:todays[0],unreviewed:true};
 const seed=dkey(t),pick=l=>l.sort((a,b)=>hash(seed+a.k+a.p)-hash(seed+b.k+b.p))[0];
 let c=cs.filter(x=>!x.c.sent&&x.c.added<t);if(c.length)return{state:"todo",x:pick(c)};
 c=cs.filter(x=>!x.c.sent);if(c.length)return{state:"todo",x:pick(c)};
 c=cs.filter(x=>!PASS(x.c.sent.v));if(c.length)return{state:"todo",x:pick(c),improve:true};
 return{state:"all"};
}

function findHits(){
 const term=q.trim().toLowerCase(),res=[];
 for(const o of ITEMS){
  const it=o.it;
  if(thF&&it.th!==thF)continue;
  if(lvF&&it.lv!==lvF)continue;
  if(newOnly&&card(o.k,o.p))continue;
  let score=0;
  if(term){const P=o.p.toLowerCase();
   if(P===term)score=0;else if(P.startsWith(term))score=1;else if(P.includes(term))score=2;
   else if(plain(it.zh).toLowerCase().includes(term))score=3;
   else if(it.en.toLowerCase().includes(term)||plain(it.tr).includes(term))score=4;
   else continue}
  res.push([score,o]);
 }

async function pickClick(e){

 if(b.dataset.act==="say"){speak(b.dataset.say);return}

  const sfn=await samplePromise;
  if(!sfn||sampleOff){pick.state="manual";drawPick();const i=$("#pk-zh");if(i)i.focus();return}
  pick.state="loading";drawPick();
  try{const r=await sfn.json(lookupPrompt(pick.phrase,pick.sentence),{modelTier:"quick"});pick.res=r&&typeof r==="object"?r:{base:pick.phrase};pick.state="result"}
  catch(err){pick.state="manual"}
  drawPick();return}
 if(a==="save"){
  let msg;
  if(pick.state==="manual")msg=addCustom(pick.phrase,{zh:(($("#pk-zh")||{}).value||"").trim().slice(0,60),src:pick.sentence});
  else{const r=pick.res||{};msg=addCustom(String(r.base||pick.phrase),{zh:String(r.zh||"").slice(0,60),note:String(r.note||"").slice(0,120),ex:String(r.ex||"").slice(0,200),src:pick.sentence})}
  if(pick.zone)pick.zone.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"));

 }

app.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,t=today();
 const ed=b.closest(".editor"),ek=ed&&ed.dataset.k,ep=ed&&ed.dataset.p;
 switch(a){
  case"say":speak(b.dataset.say);break;
  case"go":location.hash="#"+b.dataset.to;break;
  case"season":curSeason=+b.dataset.season;render(false);break;
  case"filter":epFilter=b.dataset.f;render(false);break;
  case"add":{const k=b.dataset.k,p=b.dataset.p;if(!card(k,p)){epDoc(k).cards[p]=newCard(t);bump("n");touch(k);touch("profile")}render(false);break}
  case"unadd":{const k=b.dataset.k,p=b.dataset.p,c=card(k,p);if(!c)break;
   if(!c.reps&&!c.sent)removeCard(k,p);else confirmRemove=k+"|"+p;
   render(false);break}
  case"unadd-yes":removeCard(b.dataset.k,b.dataset.p);render(false);break;
  case"unadd-no":confirmRemove=null;render(false);break;
  case"say-all":{const t=today(),cs=allCards();speakAll(cs.filter(x=>x.c.added===t).map(x=>x.it.en));break}
  case"recap-next":recapOffset++;render(false);break;
  case"ex-next":exOffset++;render(false);break;
  case"box-open":drawBox();box.state="open";box.anim=true;render(true);break;
  case"box-skip":if(box.pick)box.skipped.add(box.pick);drawBox();box.anim=true;render(false);break;
  case"box-again":drawBox();box.state="open";box.anim=true;render(true);break;
  case"box-undo":{const o=box.pick&&IDX[box.pick];if(o)removeCard(o.k,o.p);box.state="open";render(false);break}
  case"start-review":startReview();location.hash==="#review"?render(true):location.hash="#review";break;
  case"start-extra":startExtra();location.hash==="#review"?render(true):location.hash="#review";break;
  case"flip":session.flipped=true;render(false);break;
  case"rate":{
   const s=session,{k,p}=s.items[s.i],c=card(k,p);if(!c)break;
   const g=+b.dataset.g,r=schedule(c,g,t);
   c.s=r.s;c.due=t+r.interval;c.last=t;c.reps=(c.reps||0)+1;if(g===0)c.lapses=(c.lapses||0)+1;
   bump(s.type==="review"?"r":"x");s.res[g]++;s.i++;s.flipped=false;editing=null;
   touch(k);touch("profile");render(true);break}
  case"write":editing=b.dataset.k+"|"+b.dataset.p;render(false);break;
  case"cancel-edit":editing=null;lastReview=null;render(false);break;
  case"check":checkSentence(ek,ep);break;
  case"save-own":{const ta=$("#sent-input");if(ta&&ta.value.trim())saveSentence(ek,ep,ta.value,null);else{const rv=$("#rev");if(rv)rv.innerHTML=`<p class="err">先寫一句再存。</p>`}break}
  case"save-orig":if(lastReview)saveSentence(ek,ep,lastReview.text,["good","minor","wrong"].includes(lastReview.r&&lastReview.r.verdict)?lastReview.r.verdict:"minor");break;
  case"save-fixed":if(lastReview){const r=lastReview.r;saveSentence(ek,ep,(r&&r.natural)||lastReview.text,"fixed")}break;
  case"save-col":saveCol();break;
  case"tapw":tapWord(b);break;
  case"add-word":{const i=$("#addword");const v=i&&cleanSel(i.value.trim());if(!v)break;clearPick();pick.phrase=v;pick.sentence="";pick.state="sel";drawPick();break}
  case"retry-edit":{const ta=$("#sent-input");if(ta)ta.focus();break}
  case"ch-reveal":revealed[b.dataset.id]=true;render(false);break;
  case"ch-res":{
   const id=b.dataset.id,ok=b.dataset.ok==="1",d=dayLog();d.ch=d.ch||{};d.ch[id]=ok?1:0;
   if(!ok){const c=todaysChallenges().find(x=>x.id===id);if(c){c.uses.forEach(p=>{const cd=card(c.k,p);if(cd){cd.due=Math.min(cd.due,t+1);touch(c.k)}})}}
   touch("profile");render(false);break}
  case"pause-toggle":pauseOpen=!pauseOpen;render(false);break;
  case"pause-start":{const n=+($("#pause-days")||{}).value||3;S.profile.pause={from:t,days:n};pauseOpen=false;touch("profile");render(false);break}
  case"pause-end":endPause(t);render(false);break;
  case"peek":peeked.add(b.dataset.id);render(false);break;
  case"watch":S.profile.watched=Object.assign({},watchedMap(),{[b.dataset.k]:t});touch("profile");render(false);break;
  case"unwatch":{const w=Object.assign({},watchedMap());delete w[b.dataset.k];S.profile.watched=w;touch("profile");render(false);break}
  case"th":thF=+b.dataset.v;hitN=15;render(false);break;
  case"lv":lvF=+b.dataset.v;hitN=15;render(false);break;
  case"newonly":newOnly=!newOnly;hitN=15;render(false);break;
  case"adv":showAdv=!showAdv;render(false);break;
  case"clear-f":thF=0;lvF=0;newOnly=false;hitN=15;render(false);break;
  case"go-season":curSeason=+b.dataset.season;keepSeason=true;q="";thF=0;lvF=0;newOnly=false;location.hash="#episodes";break;
  case"more":hitN+=15;{const o=$("#finder-out");if(o)o.innerHTML=finderOut()}break;
  case"open-phrase":{const k=b.dataset.k;pendingFocus=k+"|"+b.dataset.p;if(location.hash==="#"+k)render(false);else location.hash="#"+k;break}
 }
});
app.addEventListener("input",e=>{
 if(e.target.id==="sent-input"&&editing)drafts[editing]=e.target.value;
 if(e.target.id==="q"){q=e.target.value;hitN=15;const o=$("#finder-out");if(o)o.innerHTML=finderOut()}
});
app.addEventListener("change",e=>{
 if(e.target.id==="hidezh"){hideZh=e.target.checked;document.body.classList.toggle("hide-zh",hideZh)}
 if(e.target.id==="spoilguard"){S.profile.spoil=e.target.checked;touch("profile");render(false)}
});
document.addEventListener("keydown",e=>{
 if(e.target&&e.target.classList&&e.target.classList.contains("spoil")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();return}
 if(view!=="review"||!session||e.metaKey||e.ctrlKey||e.altKey)return;
 const tag=(e.target.tagName||"").toLowerCase();if(tag==="textarea"||tag==="input"||tag==="select")return;
 if(session.i>=session.items.length)return;
 if(!session.flipped&&(e.key===" "||e.key==="Enter")&&app.querySelector('[data-act="flip"]')){e.preventDefault();session.flipped=true;render(false)}
 else if(["1","2","3"].includes(e.key)&&app.querySelector('[data-act="rate"]')){const btn=app.querySelector(`[data-act="rate"][data-g="${+e.key-1}"]`);if(btn)btn.click()}
});
window.addEventListener("hashchange",route);

/* ---------- boot ---------- */
migrateOld();
route();
if(window.claude&&typeof window.claude.use==="function")samplePromise=window.claude.use("sample").catch(()=>null);
connect();
</script>
