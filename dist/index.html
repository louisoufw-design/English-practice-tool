e his weight.","tr":"他女朋友超棒，他真的高攀了。","tip":"<b>來源：</b>拳擊挑戰比自己重的對手。","th":1,"lv":2},{"p":"upperclassman","zh":"高年級學生、學長姊","scene":"女生是學姊。","en":"The upperclassmen gave us a campus tour.","tr":"學長姊帶我們參觀校園。","tip":"<b>對比：</b>underclassman 低年級生。","th":3,"lv":1}]},{"id":"mitch","name":"Cam 的球隊","who":"Cameron · Mitchell","plot":"Cam 迷信 Mitchell 一來球隊就會輸。","items":[{"p":"winning streak","zh":"連勝","scene":"球隊正在連勝中。","en":"The team is on a ten-game winning streak.","tr":"球隊正在十連勝。","tip":"<b>反義：</b>losing streak 連敗。","th":8,"lv":1},{"p":"jinx","zh":"觸霉頭、帶衰","scene":"Cam 怕 Mitchell 帶衰。","en":"Don't say we'll win. You'll jinx it!","tr":"別說我們會贏，你會觸霉頭的！","tip":"<b>用法：</b>說了反而不靈的事。","th":7,"lv":2},{"p":"superstitious","zh":"迷信的","scene":"Cam 很迷信。","en":"Baseball players are very superstitious.","tr":"棒球員都很迷信。","tip":"<b>名詞：</b>superstition 迷信。","th":9,"lv":1},{"p":"lucky charm","zh":"幸運物","scene":"每個人都有自己的幸運符。","en":"This bracelet is my lucky charm.","tr":"這條手環是我的幸運物。","tip":"<b>用法：</b>帶來好運的東西或人。","th":8,"lv":1}]}],"prompts":["你住過飯店最久的經驗（用 check in、room service、live out of a suitcase）","你很迷信嗎（用 superstitious、jinx、lucky charm）","你曾經被困在家裡很悶嗎（用 cabin fever、winning streak、punch above one's weight）"],"challenges":[{"id":"c1","sit":"你說你有一個從高中帶到現在的幸運物。","uses":["lucky charm"],"ans":"This is my lucky charm."},{"id":"c2","sit":"朋友說明天去爬山一定不會下雨，你叫他別觸霉頭。","uses":["jinx"],"ans":"Don't jinx it!"},{"id":"c3","sit":"颱風天連續三天都待在家，你快悶壞了。","uses":["cabin fever"],"ans":"I've got cabin fever."},{"id":"c4","sit":"朋友的女朋友超優秀，你說他高攀了。","uses":["punch above one's weight"],"ans":"He's punching above his weight."}]},"s06e05":{"title":"Won't You Be Our Neighbor","lede":"Phil 和 Claire 對新搬來的討人厭鄰居很感冒；Jay 發現 Manny 的新女友是他以前事業夥伴的孫女；Mitchell 和 Cam 發現 Lily 那位冷淡老師的秘密。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 新鄰居","plot":"新鄰居又吵又沒禮貌，讓 Phil 和 Claire 受不了。","items":[{"p":"neighbors from hell","zh":"惡鄰居","scene":"新鄰居簡直是惡夢。","en":"They play loud music every night. Neighbors from hell!","tr":"他們每晚都放很大聲的音樂，惡鄰居！","tip":"<b>用法：</b>形容很糟糕的鄰居。","th":9,"lv":2},{"p":"obnoxious","zh":"討人厭的、令人反感的","scene":"新鄰居的行為很誇張。","en":"That guy is so loud and obnoxious.","tr":"那個人又吵又討人厭。","tip":"<b>用法：</b>形容很惹人厭的行為。","th":9,"lv":2},{"p":"welcome to the neighborhood","zh":"歡迎搬來這個社區","scene":"本來想熱情歡迎新鄰居。","en":"We brought them cookies and said, \"Welcome to the neighborhood!\"","tr":"我們帶餅乾過去說：「歡迎搬來！」","tip":"<b>文化：</b>美國鄰居搬來時常送點心。","th":2,"lv":1},{"p":"keep the noise down","zh":"小聲一點","scene":"鄰居太吵了。","en":"Can you keep the noise down? It's midnight.","tr":"可以小聲一點嗎？已經半夜了。","tip":"<b>用法：</b>請別人安靜的禮貌說法。","th":7,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Manny 的新女友，竟然是 Jay 以前生意夥伴的孫女。","items":[{"p":"go into business with","zh":"跟某人合夥做生意","scene":"Jay 以前跟她爺爺合夥。","en":"I'd never go into business with a friend.","tr":"我絕對不會跟朋友合夥做生意。","tip":"<b>用法：</b>合夥開公司。","th":3,"lv":1},{"p":"have a falling-out","zh":"鬧翻","scene":"Jay 和老夥伴以前鬧得不愉快。","en":"They had a falling-out over money.","tr":"他們因為錢鬧翻了。","tip":"<b>用法：</b>朋友、家人、合夥人之間。","th":5,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人發現 Lily 那位對學生很冷淡的老師，私下竟然有另一面。","items":[{"p":"parent-teacher conference","zh":"親師會","scene":"兩人去學校見老師。","en":"My parents went to the parent-teacher conference.","tr":"我爸媽去參加了親師會。","tip":"<b>文化：</b>家長與老師面談的會議。","th":3,"lv":1},{"p":"cold-hearted","zh":"冷漠的、無情的","scene":"老師對孩子們很冷淡。","en":"He seemed cold-hearted, but he was just shy.","tr":"他看起來很冷漠，其實只是害羞。","tip":"<b>反義：</b>warm-hearted 熱心的。","th":9,"lv":1},{"p":"get dirt on someone","zh":"抓到某人的把柄","scene":"兩人挖到老師的秘密。","en":"He's trying to get dirt on his rival.","tr":"他想抓到對手的把柄。","tip":"<b>延伸：</b>dirt 是醜聞、黑料。","th":5,"lv":2},{"p":"lead a double life","zh":"過著雙面人生","scene":"老師好像有另一個身分。","en":"He was leading a double life as a singer at night.","tr":"他晚上偷偷當歌手，過著雙面人生。","tip":"<b>用法：</b>表面和私下完全不同。","th":10,"lv":2}]}],"prompts":["你遇過惡鄰居嗎（用 neighbors from hell、obnoxious、keep the noise down）","你會想跟朋友合夥做生意嗎（用 go into business with、have a falling-out、welcome to the neighborhood）","你認識過著雙面人生的人嗎（用 lead a double life、cold-hearted、get dirt on someone）"],"challenges":[{"id":"c1","sit":"寢室半夜有人講電話，你請他小聲一點。","uses":["keep the noise down"],"ans":"Can you keep the noise down?"},{"id":"c2","sit":"你說你絕對不會跟好朋友合夥開店。","uses":["go into business with"],"ans":"I'd never go into business with a friend."},{"id":"c3","sit":"兩個大學同學因為借錢鬧翻了。","uses":["have a falling-out"],"ans":"They had a falling-out over money."},{"id":"c4","sit":"新室友很吵又沒禮貌，你跟朋友抱怨。","uses":["obnoxious"],"ans":"He's so obnoxious."}]},"s06e06":{"title":"Halloween 3: AwesomeLand","lede":"Phil 接手了 Claire 的萬聖節，打造他自己的「超讚樂園」；Gloria 買了史瑞克裝給 Jay，Jay 卻堅持要當白馬王子；Cam 被一整天的事情壓得喘不過氣，Mitchell 則在準備案子的結辯。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"今年萬聖節換 Phil 主導，他要辦一場自己的主題慶典。","items":[{"p":"run with it","zh":"放手去做、順勢發揮","scene":"Phil 一拿到主導權就大展身手。","en":"It's a great idea. Run with it!","tr":"這點子很棒，放手去做吧！","tip":"<b>用法：</b>鼓勵別人發揮創意。","th":10,"lv":2},{"p":"theme park","zh":"主題樂園","scene":"Phil 想把家變成主題樂園。","en":"We spent the whole day at a theme park.","tr":"我們在主題樂園玩了一整天。","tip":"<b>延伸：</b>amusement park 遊樂園。","th":8,"lv":1},{"p":"spooky","zh":"陰森、有點嚇人的","scene":"萬聖節的氣氛就是要毛毛的。","en":"The old house looks spooky at night.","tr":"那間老房子晚上看起來很陰森。","tip":"<b>對比：</b>spooky 偏可愛的嚇人；creepy 比較讓人不舒服。","th":9,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Gloria 想跟 Jay 穿情侶裝，Jay 卻不想扮史瑞克。","items":[{"p":"couples costume","zh":"情侶裝扮","scene":"Gloria 想要情侶裝。","en":"We went as Mario and Princess Peach — a couples costume.","tr":"我們扮成瑪利歐和碧姬公主，情侶裝扮。","tip":"<b>用法：</b>萬聖節、派對常見。","th":8,"lv":1},{"p":"Prince Charming","zh":"白馬王子","scene":"Jay 想當白馬王子。","en":"She's still waiting for her Prince Charming.","tr":"她還在等她的白馬王子。","tip":"<b>用法：</b>理想中的完美男人。","th":1,"lv":2},{"p":"dress the part","zh":"打扮得符合角色","scene":"要扮就要扮得像。","en":"If you want the job, dress the part.","tr":"想要這份工作，就打扮得像那個樣子。","tip":"<b>用法：</b>外表符合身份或場合。","th":10,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 一整天事情太多快崩潰；Mitchell 忙著準備法庭結辯。","items":[{"p":"overwhelmed","zh":"不知所措、被壓垮","scene":"Cam 被一堆事壓得喘不過氣。","en":"I feel overwhelmed by all this work.","tr":"這麼多工作讓我不知所措。","tip":"<b>用法：</b>情緒、工作量太大。","th":4,"lv":1},{"p":"too much on one's plate","zh":"事情太多","scene":"Cam 手上的事太多了。","en":"I'd love to help, but I have too much on my plate.","tr":"我很想幫忙，但我手上事情太多了。","tip":"<b>畫面：</b>盤子裡的東西太多吃不完。","th":4,"lv":2},{"p":"closing argument","zh":"結辯","scene":"Mitchell 在準備法庭結辯。","en":"The lawyer's closing argument convinced the jury.","tr":"律師的結辯說服了陪審團。","tip":"<b>用法：</b>法庭用語。","th":3,"lv":2},{"p":"I rest my case","zh":"我說完了（證明了我的論點）","scene":"Mitchell 的律師口頭禪。","en":"He's late again. I rest my case.","tr":"他又遲到了，我不用多說了。","tip":"<b>用法：</b>日常中證明自己說對了。","th":7,"lv":2}]}],"prompts":["你最喜歡的萬聖節或變裝經驗（用 couples costume、dress the part、spooky）","你最近事情太多的時候（用 overwhelmed、too much on one's plate、run with it）","你心中的白馬王子或理想型（用 Prince Charming、theme park、I rest my case）"],"challenges":[{"id":"c1","sit":"主管說同事的點子不錯，叫他放手去做。","uses":["run with it"],"ans":"Great idea. Run with it."},{"id":"c2","sit":"你一次要準備三個報告，覺得被壓垮了。","uses":["overwhelmed"],"ans":"I feel so overwhelmed."},{"id":"c3","sit":"朋友說他不會遲到，結果又遲到了，你說不用多說了。","uses":["I rest my case"],"ans":"I rest my case."},{"id":"c4","sit":"面試要穿正式一點，朋友叫你打扮得像樣。","uses":["dress the part"],"ans":"You have to dress the part."}]},"s06e07":{"title":"Queer Eyes, Full Hearts","lede":"Phil 和 Claire 不知道該不該擔心 Haley 和 Andy 走得這麼近；Gloria 請了一位很帥的家教 Diego 教 Manny 西班牙文，Manny 和 Jay 都很不爽；Mitchell 和 Cam 遇到一位新聞記者，對方似乎對他們其中一人有意思。","stories":[{"id":"dunphy","name":"Haley 和 Andy","who":"Haley · Andy · Phil · Claire","plot":"兩人說只是朋友，但爸媽看得出來好像不只。","items":[{"p":"just friends","zh":"只是朋友","scene":"Haley 說兩人只是朋友。","en":"We're just friends. Nothing more.","tr":"我們只是朋友，沒別的。","tip":"<b>用法：</b>否認戀愛關係的經典句。","th":1,"lv":1},{"p":"friend zone","zh":"好朋友區（被當成朋友）","scene":"Andy 是不是被放在朋友區？","en":"I liked her, but she put me in the friend zone.","tr":"我喜歡她，但她只把我當朋友。","tip":"<b>用法：</b>單戀被當成好朋友。","th":1,"lv":2},{"p":"more than friends","zh":"超越朋友","scene":"爸媽懷疑他們不只是朋友。","en":"I think they're more than friends.","tr":"我覺得他們不只是朋友。","tip":"<b>用法：</b>曖昧關係。","th":1,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Gloria · Manny · Jay · Diego","plot":"Gloria 請了一位帥氣家教，Jay 和 Manny 心裡都不是滋味。","items":[{"p":"eye candy","zh":"養眼的人","scene":"新家教長得很帥。","en":"The new trainer at the gym is total eye candy.","tr":"健身房的新教練超養眼。","tip":"<b>用法：</b>外表好看的人，略帶輕浮。","th":1,"lv":2},{"p":"fluent in","zh":"精通（語言）","scene":"Diego 西班牙文很流利。","en":"She's fluent in English, Japanese, and Korean.","tr":"她精通英文、日文和韓文。","tip":"<b>用法：</b>fluent in + 語言。","th":3,"lv":1},{"p":"brush up on","zh":"複習、加強","scene":"Manny 要加強西班牙文。","en":"I need to brush up on my English before the trip.","tr":"出國前我得加強一下英文。","tip":"<b>用法：</b>重新練習生疏的技能。","th":3,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · 記者","plot":"一位記者對兩人中的某一個人很感興趣。","items":[{"p":"news anchor","zh":"新聞主播","scene":"兩人認識了一位新聞主播。","en":"She's a news anchor on a TV station.","tr":"她是電視台的新聞主播。","tip":"<b>用法：</b>anchor 是主播。","th":3,"lv":1},{"p":"have a thing for","zh":"對某人有意思、偏好","scene":"記者好像對其中一人有意思。","en":"I think he has a thing for you.","tr":"我覺得他對你有意思。","tip":"<b>用法：</b>也可以說喜好，have a thing for spicy food。","th":1,"lv":2},{"p":"take it as a compliment","zh":"當作讚美","scene":"被人欣賞，就當作稱讚吧。","en":"He said I look like a cartoon character. I'll take it as a compliment.","tr":"他說我像卡通人物，我就當作稱讚吧。","tip":"<b>用法：</b>模稜兩可的話往好處想。","th":7,"lv":1},{"p":"steal glances","zh":"偷看、偷瞄","scene":"有人忍不住一直偷看。","en":"He kept stealing glances at her during class.","tr":"他上課時一直偷瞄她。","tip":"<b>用法：</b>暗戀的經典動作。","th":1,"lv":2}]}],"prompts":["你有被放在好朋友區過嗎（用 friend zone、just friends、more than friends）","你想加強哪種語言（用 brush up on、fluent in、eye candy）","你曾經偷偷喜歡誰嗎（用 have a thing for、steal glances、take it as a compliment）"],"challenges":[{"id":"c1","sit":"朋友問你和那個女生是不是在交往，你說只是朋友。","uses":["just friends"],"ans":"We're just friends."},{"id":"c2","sit":"你說出國前要加強一下英文。","uses":["brush up on"],"ans":"I need to brush up on my English."},{"id":"c3","sit":"同事說你長得像某個藝人，你說當作稱讚。","uses":["take it as a compliment"],"ans":"I'll take it as a compliment."},{"id":"c4","sit":"你覺得室友對樓下咖啡店的店員有意思。","uses":["have a thing for"],"ans":"I think he has a thing for her."}]},"s06e08":{"title":"Three Turkeys","lede":"Phil 第一次負責感恩節大餐，Luke 當他的助手，Claire 卻偷偷準備了一隻備用火雞；Jay 和 Gloria 取消了旅行卻沒告訴大家；Mitchell 受夠了老是當黑臉，叫 Cam 自己處理 Lily 不肯穿漂亮洋裝的問題。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Claire","plot":"Phil 掌廚感恩節，Claire 對他沒信心，偷偷備了一隻火雞以防萬一。","items":[{"p":"just in case","zh":"以防萬一","scene":"Claire 準備了備用火雞。","en":"Take an umbrella, just in case.","tr":"帶把傘以防萬一。","tip":"<b>用法：</b>預防意外情況。","th":10,"lv":1},{"p":"burnt to a crisp","zh":"烤焦了","scene":"火雞差點烤成焦炭。","en":"I forgot the toast and it got burnt to a crisp.","tr":"我忘了吐司，結果烤焦了。","tip":"<b>用法：</b>食物焦黑。","th":8,"lv":2},{"p":"carve the turkey","zh":"切火雞","scene":"感恩節的經典時刻。","en":"Grandpa always carves the turkey.","tr":"每年都是爺爺切火雞。","tip":"<b>文化：</b>感恩節由一家之主切火雞。","th":8,"lv":2},{"p":"food coma","zh":"吃太飽昏睡","scene":"大餐後大家都撐到不行。","en":"After that buffet, I'm in a food coma.","tr":"吃完那個吃到飽，我撐到想睡。","tip":"<b>用法：</b>吃太飽之後的昏沉。","th":8,"lv":2},{"p":"leftovers","zh":"剩菜","scene":"感恩節後總有吃不完的剩菜。","en":"We ate Thanksgiving leftovers for a week.","tr":"我們吃感恩節剩菜吃了一個禮拜。","tip":"<b>用法：</b>通常用複數。","th":8,"lv":1},{"p":"Turkey Day","zh":"感恩節（口語）","scene":"美國人對感恩節的暱稱。","en":"What are you doing for Turkey Day?","tr":"你感恩節要做什麼？","tip":"<b>用法：</b>Thanksgiving 的口語說法。","th":8,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"兩人取消了旅行，乾脆躲在家不告訴任何人。","items":[{"p":"lie low","zh":"低調、躲起來","scene":"兩人假裝不在家。","en":"I'm lying low this weekend. I don't want to see anyone.","tr":"我這週末要低調一點，不想見任何人。","tip":"<b>用法：</b>暫時不露面。","th":10,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 不想再當壞人，這次換 Cam 面對 Lily 的倔脾氣。","items":[{"p":"fed up with","zh":"受夠了","scene":"Mitchell 受夠當黑臉了。","en":"I'm fed up with his excuses.","tr":"我受夠他的藉口了。","tip":"<b>用法：</b>be fed up with + 人或事。","th":4,"lv":1},{"p":"pick your battles","zh":"選擇要爭什麼","scene":"不是每件事都值得吵。","en":"It's just a dress. Pick your battles.","tr":"只是一件洋裝，挑重要的事情吵吧。","tip":"<b>用法：</b>育兒、感情中的智慧。","th":6,"lv":2},{"p":"dig in one's heels","zh":"堅持不讓步","scene":"Lily 怎樣都不肯穿。","en":"When I told him to apologize, he dug in his heels.","tr":"我叫他道歉，他死都不肯。","tip":"<b>畫面：</b>用腳跟抵住地面不動。","th":5,"lv":2}]}],"prompts":["你家過年或過節吃什麼（用 leftovers、food coma、carve the turkey）","你最近受夠了什麼事（用 fed up with、pick your battles、dig in one's heels）","你做事會準備備案嗎（用 just in case、burnt to a crisp、lie low）"],"challenges":[{"id":"c1","sit":"出門前你多帶了一件外套以防萬一。","uses":["just in case"],"ans":"I brought a jacket, just in case."},{"id":"c2","sit":"年夜飯吃完你說吃太飽想睡。","uses":["food coma"],"ans":"I'm in a food coma."},{"id":"c3","sit":"樓上鄰居每天半夜拖椅子，你說你受夠了。","uses":["fed up with"],"ans":"I'm fed up with it."},{"id":"c4","sit":"你勸朋友別為了小事跟女朋友吵。","uses":["pick your battles"],"ans":"Pick your battles, man."}]},"s06e09":{"title":"Strangers in the Night","lede":"Alex 說她交了男朋友，Phil 和 Claire 卻擔心是不是被逼到自己編了一個；Jay 和 Gloria 互相想拖對方去自己的派對，Jay 還計畫好要偷偷溜走，Manny 卻威脅要破壞；Mitchell 和 Cam 的新白色沙發，被來作客的 Brenda 弄得岌岌可危。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Alex · Phil · Claire","plot":"Alex 說自己在跟人交往，爸媽懷疑是不是他們逼太緊了。","items":[{"p":"seeing someone","zh":"在跟某人交往","scene":"Alex 說她有對象了。","en":"Are you seeing someone?","tr":"你有在跟誰交往嗎？","tip":"<b>用法：</b>比 dating 更含蓄的說法。","th":1,"lv":1},{"p":"push someone too hard","zh":"逼某人太緊","scene":"爸媽擔心給 Alex 太大壓力。","en":"Don't push yourself too hard. Take a break.","tr":"別逼自己太緊，休息一下。","tip":"<b>用法：</b>對自己或別人都可以用。","th":6,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"兩人各有派對要參加，Jay 想偷偷溜走。","items":[{"p":"social butterfly","zh":"社交達人","scene":"Gloria 很愛參加派對。","en":"My sister is a social butterfly. She knows everyone.","tr":"我姊是社交達人，誰都認識。","tip":"<b>畫面：</b>在人群中飛來飛去的蝴蝶。","th":9,"lv":2},{"p":"party pooper","zh":"掃興的人","scene":"Jay 不想去派對，被當成掃興鬼。","en":"Don't be a party pooper. Stay a little longer!","tr":"別掃興嘛，再待一下！","tip":"<b>用法：</b>很口語的調侃。","th":9,"lv":2},{"p":"Irish goodbye","zh":"不告而別","scene":"Jay 想偷偷離開派對。","en":"I did an Irish goodbye and left the party early.","tr":"我沒打招呼就提早離開派對了。","tip":"<b>用法：</b>派對中悄悄離開。","th":8,"lv":2},{"p":"BYOB","zh":"自備酒水","scene":"派對要自己帶飲料。","en":"It's a BYOB party, so bring your own drinks.","tr":"這是自備酒水的派對，記得帶飲料。","tip":"<b>全稱：</b>bring your own bottle/beer。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Brenda","plot":"兩人買了新的白沙發，偏偏來了一個笨手笨腳的客人。","items":[{"p":"spill on","zh":"灑到…上","scene":"兩人很怕有人把東西灑在沙發上。","en":"I spilled coffee on my shirt.","tr":"我把咖啡灑到襯衫上了。","tip":"<b>用法：</b>spill + 東西 + on + 地方。","th":8,"lv":1},{"p":"leave a stain","zh":"留下污漬","scene":"白沙發最怕被弄髒。","en":"Red wine will leave a stain.","tr":"紅酒會留下污漬。","tip":"<b>延伸：</b>stain remover 去漬劑。","th":8,"lv":1},{"p":"a bull in a china shop","zh":"莽撞的人","scene":"Brenda 動作很大，讓人提心吊膽。","en":"My dog is like a bull in a china shop. He breaks everything.","tr":"我的狗像闖進瓷器店的牛，什麼都撞壞。","tip":"<b>畫面：</b>公牛闖進瓷器店。","th":9,"lv":2},{"p":"handle with care","zh":"小心輕放","scene":"新沙發要小心對待。","en":"The box says \"handle with care.\"","tr":"箱子上寫著「小心輕放」。","tip":"<b>用法：</b>包裹、易碎品的標示。","th":8,"lv":1}]}],"prompts":["你是社交達人還是派對掃興鬼（用 social butterfly、party pooper、Irish goodbye）","你最近在跟誰交往嗎（用 seeing someone、push someone too hard、BYOB）","你有很笨手笨腳的朋友嗎（用 a bull in a china shop、spill on、leave a stain）"],"challenges":[{"id":"c1","sit":"聚會大家都還在玩，朋友想先走，你叫他別掃興。","uses":["party pooper"],"ans":"Don't be a party pooper."},{"id":"c2","sit":"你吃飯把醬油灑到制服上。","uses":["spill on"],"ans":"I spilled soy sauce on my uniform."},{"id":"c3","sit":"你媽問你最近有沒有在跟誰交往。","uses":["seeing someone"],"ans":"Are you seeing someone?"},{"id":"c4","sit":"你說你跟朋友聚會時都偷偷先走。","uses":["Irish goodbye"],"ans":"I usually do an Irish goodbye."}]},"s06e10":{"title":"Haley's 21st Birthday","lede":"Haley 滿 21 歲，跟大人們一起去酒吧；Claire 太想當女兒的朋友，忘了自己是媽媽；Mitchell 和 Cam 發現自己沒有想像中那麼酷；Jay 和 Phil 為了送新車這份禮物傷腦筋；Alex、Luke 和 Manny 顧 Lily，Lily 卻問起寶寶是從哪裡來的。","stories":[{"id":"dunphy","name":"Haley 的生日","who":"Haley · Claire · Phil","plot":"Haley 滿 21 歲，可以合法喝酒了，Claire 想當個酷媽媽陪她。","items":[{"p":"legal drinking age","zh":"法定飲酒年齡","scene":"Haley 終於到了可以喝酒的年紀。","en":"The legal drinking age in the US is 21.","tr":"美國的法定飲酒年齡是 21 歲。","tip":"<b>文化：</b>台灣是 18 歲。","th":8,"lv":1},{"p":"get carded","zh":"被查證件","scene":"進酒吧要被檢查年齡。","en":"I'm 30, but I still get carded.","tr":"我 30 歲了，還是會被查證件。","tip":"<b>用法：</b>酒吧、買酒時被要求出示 ID。","th":8,"lv":2},{"p":"take shots","zh":"喝一口杯的酒","scene":"生日就是要喝 shot。","en":"Let's take shots for her birthday!","tr":"我們為她的生日乾一杯吧！","tip":"<b>延伸：</b>a shot 一小杯烈酒。","th":8,"lv":2},{"p":"bar hopping","zh":"一家接一家喝酒","scene":"大家去續攤。","en":"We went bar hopping in Ximending.","tr":"我們在西門町一家接一家喝。","tip":"<b>用法：</b>一個晚上去好幾家酒吧。","th":8,"lv":2},{"p":"cool mom","zh":"酷媽媽","scene":"Claire 很想當個酷媽媽。","en":"My friend's mom is a cool mom. She lets us play games all night.","tr":"我朋友的媽媽很酷，讓我們打整晚電動。","tip":"<b>延伸：</b>電影《辣妹過招》的經典台詞。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人以為自己很潮，結果發現跟不上年輕人。","items":[{"p":"out of touch","zh":"跟不上時代、脫節","scene":"兩人發現自己有點落伍了。","en":"I've been in the army so long, I'm out of touch with the news.","tr":"我當兵太久了，跟時事脫節。","tip":"<b>反義：</b>in touch 跟得上。","th":9,"lv":2},{"p":"past one's prime","zh":"過了巔峰期","scene":"他們不想承認自己老了。","en":"That singer is past her prime.","tr":"那個歌手已經過了巔峰期。","tip":"<b>用法：</b>體能、事業的高峰已過。","th":9,"lv":2}]},{"id":"jay","name":"Jay 和 Phil","who":"Jay · Phil","plot":"兩人想送車當禮物，卻不知道該怎麼交出鑰匙。","items":[{"p":"hand over the keys","zh":"交出鑰匙","scene":"送車就要交出車鑰匙。","en":"My dad finally handed over the keys to his car.","tr":"我爸終於把他的車鑰匙交給我了。","tip":"<b>用法：</b>也比喻交出主導權。","th":10,"lv":1}]},{"id":"kids","name":"孩子們顧 Lily","who":"Alex · Luke · Manny · Lily","plot":"Lily 問出一個讓三個人都很尷尬的問題。","items":[{"p":"where do babies come from","zh":"寶寶是從哪裡來的","scene":"Lily 的問題讓大家傻眼。","en":"My niece asked me where babies come from. I didn't know what to say.","tr":"我姪女問我寶寶是從哪來的，我不知道怎麼回答。","tip":"<b>用法：</b>小孩的經典難題。","th":2,"lv":1},{"p":"have the talk","zh":"談性教育","scene":"誰該跟 Lily 解釋？","en":"My parents never had the talk with me.","tr":"我爸媽從沒跟我談過性教育。","tip":"<b>對比：</b>the birds and the bees 比較委婉。","th":2,"lv":2}]}],"prompts":["你第一次喝酒的經驗（用 legal drinking age、get carded、take shots）","你覺得自己跟得上潮流嗎（用 out of touch、past one's prime、cool mom）","你小時候問過讓大人尷尬的問題嗎（用 where do babies come from、have the talk、hand over the keys）"],"challenges":[{"id":"c1","sit":"你都 24 歲了，買酒還被查證件。","uses":["get carded"],"ans":"I still get carded."},{"id":"c2","sit":"你很久沒滑社群，不知道最近流行什麼，說你跟不上時代。","uses":["out of touch"],"ans":"I'm so out of touch."},{"id":"c3","sit":"朋友生日聚餐吃完，大家要續攤。","uses":["bar hopping"],"ans":"Let's go bar hopping!"},{"id":"c4","sit":"朋友說他媽媽很酷，都讓他晚歸。","uses":["cool mom"],"ans":"His mom is a cool mom."}]},"s06e11":{"title":"The Day We Almost Died","lede":"Dunphy 一家和 Manny 在去吃早餐的路上差點出車禍，大家驚魂未定，開始重新思考人生：Claire 決定活得更有趣，Haley 和 Alex 約好不再吵架，Manny 發誓不坐車了，Luke 列了一張人生清單，Phil 則決定採取行動。","stories":[{"id":"dunphy","name":"死裡逃生","who":"Phil · Claire · Haley · Alex · Luke · Manny","plot":"一場驚險的意外讓每個人都想改變自己的人生。","items":[{"p":"close call","zh":"千鈞一髮、險些出事","scene":"差一點就撞上了。","en":"That was a close call. The truck almost hit us.","tr":"好險，那台卡車差點撞到我們。","tip":"<b>同義：</b>a near miss。","th":9,"lv":2},{"p":"near-death experience","zh":"瀕死經驗","scene":"全家經歷了一次死裡逃生。","en":"After his near-death experience, he started living differently.","tr":"經歷瀕死經驗後，他開始換一種方式生活。","tip":"<b>用法：</b>生死關頭的經歷。","th":8,"lv":1},{"p":"my life flashed before my eyes","zh":"人生跑馬燈","scene":"那一瞬間大家都想起自己的一生。","en":"When the car skidded, my life flashed before my eyes.","tr":"車子打滑的時候，我的人生跑馬燈都出來了。","tip":"<b>用法：</b>極度驚嚇的那一刻。","th":4,"lv":2},{"p":"lucky to be alive","zh":"能活著真幸運","scene":"大家都很慶幸自己沒事。","en":"After the crash, we were lucky to be alive.","tr":"車禍之後，我們能活著真是幸運。","tip":"<b>用法：</b>大難不死時。","th":4,"lv":1},{"p":"wake-up call","zh":"警鐘、當頭棒喝","scene":"這次意外讓大家驚醒。","en":"Failing that test was a wake-up call for me.","tr":"那次考試不及格對我是個警鐘。","tip":"<b>用法：</b>讓人醒悟的事件。","th":9,"lv":2},{"p":"a new lease on life","zh":"重獲新生","scene":"大家都想重新開始。","en":"After surgery, my grandpa has a new lease on life.","tr":"手術後，我爺爺好像重獲新生。","tip":"<b>用法：</b>重新振作、有新活力。","th":9,"lv":2},{"p":"YOLO","zh":"人生只有一次","scene":"Luke 決定及時行樂。","en":"I'm going skydiving. YOLO!","tr":"我要去高空跳傘，人生只有一次！","tip":"<b>全稱：</b>you only live once。","th":7,"lv":2},{"p":"turn over a new leaf","zh":"改過自新、重新開始","scene":"每個人都想改變自己。","en":"I'm turning over a new leaf. No more junk food.","tr":"我要重新開始，不再吃垃圾食物。","tip":"<b>畫面：</b>翻開書的新一頁。","th":10,"lv":2},{"p":"swear off","zh":"發誓戒掉","scene":"Manny 發誓再也不坐車。","en":"He swore off sugar for a month.","tr":"他發誓一個月不吃糖。","tip":"<b>用法：</b>發誓不再做某事。","th":10,"lv":2},{"p":"call a truce","zh":"休戰","scene":"兩姊妹決定停戰。","en":"My brother and I called a truce for Mom's birthday.","tr":"我和我哥為了媽媽生日休戰。","tip":"<b>延伸：</b>truce 休戰協議。","th":5,"lv":2}]}],"prompts":["你經歷過最驚險的事（用 close call、my life flashed before my eyes、lucky to be alive）","一件讓你醒悟的事（用 wake-up call、turn over a new leaf、a new lease on life）","你想發誓戒掉什麼（用 swear off、YOLO、call a truce）"],"challenges":[{"id":"c1","sit":"你騎車差點被撞，跟朋友說好險。","uses":["close call"],"ans":"That was a close call."},{"id":"c2","sit":"你說被長官罵是一個警鐘。","uses":["wake-up call"],"ans":"It was a wake-up call."},{"id":"c3","sit":"你和弟弟一直吵架，為了過年決定休戰。","uses":["call a truce"],"ans":"We called a truce."},{"id":"c4","sit":"朋友猶豫要不要去高空彈跳，你說人生只有一次。","uses":["YOLO"],"ans":"Just do it. YOLO!"}]},"s06e12":{"title":"The Big Guns","lede":"新鄰居把船停在草坪上，Claire 氣炸了，Phil 找來爸爸 Frank 和他的退休老友們幫忙報復；Jay 想訓練 Joe 自己上廁所，Gloria 卻覺得他還沒準備好；Cam 瞞著 Mitchell 偷偷帶 Lily 去上小丑學校。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Frank","plot":"鄰居的船擋在草坪上，Phil 搬出救兵來對付他們。","items":[{"p":"eyesore","zh":"礙眼的東西","scene":"那艘船實在太礙眼。","en":"That old billboard is an eyesore.","tr":"那個舊看板很礙眼。","tip":"<b>用法：</b>難看的建築或物品。","th":9,"lv":2},{"p":"call in the big guns","zh":"請出高手、搬救兵","scene":"Phil 找來爸爸和老友們。","en":"I can't fix this. Time to call in the big guns.","tr":"我修不好，該搬救兵了。","tip":"<b>畫面：</b>派出大砲。","th":10,"lv":2},{"p":"an eye for an eye","zh":"以眼還眼","scene":"兩家人開始互相報復。","en":"An eye for an eye only makes the whole world blind.","tr":"以眼還眼只會讓全世界都瞎了。","tip":"<b>用法：</b>以牙還牙的報復。","th":5,"lv":2},{"p":"revenge is a dish best served cold","zh":"君子報仇，十年不晚","scene":"報復要慢慢來。","en":"Don't get mad now. Revenge is a dish best served cold.","tr":"別現在生氣，君子報仇十年不晚。","tip":"<b>用法：</b>報復要冷靜計畫。","th":5,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"Jay 想教 Joe 用馬桶，Gloria 覺得太早了。","items":[{"p":"potty training","zh":"如廁訓練","scene":"Jay 開始訓練 Joe 上廁所。","en":"Potty training my son took three months.","tr":"訓練我兒子自己上廁所花了三個月。","tip":"<b>延伸：</b>potty 小孩的便盆。","th":2,"lv":1},{"p":"in one's own time","zh":"照自己的步調","scene":"Gloria 覺得 Joe 會自己準備好。","en":"Don't rush him. He'll learn in his own time.","tr":"別催他，他會照自己的步調學會的。","tip":"<b>用法：</b>不急、慢慢來。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Lily · Mitchell","plot":"Cam 偷偷帶 Lily 去小丑學校，怕 Mitchell 不高興。","items":[{"p":"keep it on the down-low","zh":"低調、保密","scene":"Cam 想把這件事低調處理。","en":"Keep it on the down-low. I don't want my boss to know.","tr":"低調一點，我不想讓老闆知道。","tip":"<b>用法：</b>簡寫 DL。","th":10,"lv":2},{"p":"class clown","zh":"班上的開心果","scene":"Lily 好像有當小丑的天分。","en":"He was the class clown in high school.","tr":"他高中是班上的開心果。","tip":"<b>用法：</b>愛搞笑的同學。","th":9,"lv":2},{"p":"follow one's dreams","zh":"追隨夢想","scene":"Cam 想讓 Lily 追隨她的夢想。","en":"It's never too late to follow your dreams.","tr":"追夢永遠不嫌晚。","tip":"<b>用法：</b>鼓勵人的常用句。","th":6,"lv":1},{"p":"the cat's out of the bag","zh":"秘密洩漏了","scene":"Cam 偷偷帶 Lily 去小丑學校的事遲早會曝光。","en":"Well, the cat's out of the bag. Everyone knows.","tr":"好吧，秘密洩漏了，大家都知道了。","tip":"<b>對比：</b>spill the beans 是把秘密說出去；the cat's out of the bag 是秘密已經公開。","th":10,"lv":2}]}],"prompts":["你遇過讓你想報復的人嗎（用 an eye for an eye、revenge is a dish best served cold、call in the big guns）","你學一件事是照自己的步調嗎（用 in one's own time、potty training、follow one's dreams）","你小時候是班上的開心果嗎（用 class clown、keep it on the down-low、eyesore）"],"challenges":[{"id":"c1","sit":"你修不好電腦，說要找專業的來了。","uses":["call in the big guns"],"ans":"Time to call in the big guns."},{"id":"c2","sit":"你跟朋友說要低調一點，別讓老闆知道你在找新工作。","uses":["keep it on the down-low"],"ans":"Keep it on the down-low. I don't want my boss to know."},{"id":"c3","sit":"你說你高中是班上的開心果。","uses":["class clown"],"ans":"I was the class clown."},{"id":"c4","sit":"你說追夢永遠不嫌晚。","uses":["follow one's dreams"],"ans":"It's never too late to follow your dreams."}]},"s06e13":{"title":"Rash Decisions","lede":"Luke 越來越疏遠 Phil，Phil 只好讓 Andy 當他的得力助手；Gloria 發現 Joe 可能對狗狗 Stella 過敏；Mitchell 開始在 Jay 的公司接自由法律案件；Alex 參加普林斯頓大學的面試。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Andy · Alex","plot":"Luke 不再黏爸爸，Phil 只好找 Andy 填補空缺；Alex 要去名校面試。","items":[{"p":"pull away","zh":"疏遠、拉開距離","scene":"Luke 開始跟 Phil 保持距離。","en":"Teenagers often pull away from their parents.","tr":"青少年常會跟父母疏遠。","tip":"<b>用法：</b>情感上的距離。","th":2,"lv":1},{"p":"right-hand man","zh":"得力助手","scene":"Andy 成了 Phil 的左右手。","en":"He's been the boss's right-hand man for ten years.","tr":"他當老闆的得力助手十年了。","tip":"<b>用法：</b>最信任的助手。","th":3,"lv":2},{"p":"fill the void","zh":"填補空虛","scene":"Phil 想找人填補兒子的位置。","en":"He got a dog to fill the void after his kids moved out.","tr":"孩子搬出去後，他養狗來填補空虛。","tip":"<b>用法：</b>失去某人某物後的替代。","th":4,"lv":2},{"p":"Ivy League","zh":"常春藤名校","scene":"Alex 想進頂尖名校。","en":"She got into an Ivy League school.","tr":"她考上了常春藤名校。","tip":"<b>文化：</b>美國東北部八所頂尖大學。","th":3,"lv":2},{"p":"sell yourself","zh":"推銷自己","scene":"面試要懂得表現自己。","en":"In an interview, you have to sell yourself.","tr":"面試時你要懂得推銷自己。","tip":"<b>用法：</b>展現自己的優點。","th":3,"lv":1},{"p":"a long shot","zh":"希望渺茫的事","scene":"考上普林斯頓不容易。","en":"It's a long shot, but I'll apply anyway.","tr":"雖然希望渺茫，但我還是要申請。","tip":"<b>用法：</b>機會不大但值得一試。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Joe · Stella","plot":"Joe 身上起疹子，Gloria 懷疑是狗狗害的。","items":[{"p":"allergic to","zh":"對某物過敏","scene":"Joe 可能對狗過敏。","en":"I'm allergic to cats.","tr":"我對貓過敏。","tip":"<b>用法：</b>也可以開玩笑說 I'm allergic to Mondays.","th":8,"lv":1},{"p":"break out in a rash","zh":"起疹子","scene":"Joe 身上冒出疹子。","en":"I broke out in a rash after eating shrimp.","tr":"我吃了蝦子之後起疹子。","tip":"<b>延伸：</b>break out in a sweat 冒汗。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 的新工作","who":"Mitchell · Jay","plot":"Mitchell 在 Jay 的公司當自由接案的律師。","items":[{"p":"freelance","zh":"自由接案","scene":"Mitchell 不再是正職。","en":"She works freelance as a designer.","tr":"她是自由接案的設計師。","tip":"<b>延伸：</b>freelancer 自由工作者。","th":3,"lv":1},{"p":"on the clock","zh":"上班時間中","scene":"在爸爸公司上班要分清楚公私。","en":"I can't chat now. I'm on the clock.","tr":"我現在不能聊，我在上班。","tip":"<b>反義：</b>off the clock 下班時間。","th":3,"lv":2}]}],"prompts":["你跟家人曾經疏遠過嗎（用 pull away、fill the void、right-hand man）","你面試時怎麼推銷自己（用 sell yourself、a long shot、Ivy League）","你對什麼東西過敏（用 allergic to、break out in a rash、freelance）"],"challenges":[{"id":"c1","sit":"你說你對花生過敏。","uses":["allergic to"],"ans":"I'm allergic to peanuts."},{"id":"c2","sit":"你想申請很難的研究所，說雖然希望渺茫但會試試。","uses":["a long shot"],"ans":"It's a long shot, but I'll try."},{"id":"c3","sit":"朋友傳訊息給你聊天，你說你在值班。","uses":["on the clock"],"ans":"I can't talk. I'm on the clock."},{"id":"c4","sit":"同事說副理是經理的得力助手。","uses":["right-hand man"],"ans":"He's the manager's right-hand man."}]},"s06e14":{"title":"Valentine's Day 4: Twisted Sister","lede":"情人節，Phil 和 Claire 再度扮演 Clive Bixby 和 Juliana，但 Phil 好像比較喜歡「Juliana」而不是 Claire 本人；Gloria 的妹妹 Sonia 來訪，讓 Jay 陷入尷尬處境；Mitchell 和 Cam 去拜訪他們的朋友 Anders。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"角色扮演玩得太入戲，Claire 開始吃自己分身的醋。","items":[{"p":"get into character","zh":"進入角色","scene":"兩人又進入角色了。","en":"Actors need time to get into character.","tr":"演員需要時間進入角色。","tip":"<b>用法：</b>表演或角色扮演前。","th":8,"lv":2},{"p":"keep things interesting","zh":"讓生活有趣","scene":"夫妻倆想讓感情保持新鮮。","en":"We travel a lot to keep things interesting.","tr":"我們常旅行，讓生活有趣一點。","tip":"<b>用法：</b>避免一成不變。","th":1,"lv":1},{"p":"kiss and make up","zh":"和好","scene":"吵完架就和好。","en":"They had a fight, but they kissed and made up.","tr":"他們吵了一架，但後來和好了。","tip":"<b>用法：</b>吵架後言歸於好。","th":1,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Sonia","plot":"小姨子來訪，讓 Jay 處境很尷尬。","items":[{"p":"sister-in-law","zh":"嫂嫂、小姨子、大姑等","scene":"Gloria 的妹妹來了。","en":"My sister-in-law is coming for dinner.","tr":"我嫂嫂要來吃晚餐。","tip":"<b>延伸：</b>brother-in-law 姊夫、妹夫等。","th":2,"lv":1},{"p":"family resemblance","zh":"家族長相相似","scene":"姊妹倆長得很像。","en":"I can see the family resemblance. You have your dad's eyes.","tr":"我看得出家族相似，你的眼睛像你爸。","tip":"<b>用法：</b>家人之間長得像。","th":2,"lv":1},{"p":"put someone in an awkward position","zh":"讓某人處境尷尬","scene":"Sonia 讓 Jay 很難做人。","en":"You're putting me in an awkward position.","tr":"你讓我很難做人。","tip":"<b>用法：</b>被迫在兩難中選擇。","th":4,"lv":1},{"p":"be a good host","zh":"當個好主人","scene":"Jay 努力招待客人。","en":"Be a good host and offer your guests a drink.","tr":"當個好主人，請客人喝點東西。","tip":"<b>用法：</b>招待客人。","th":2,"lv":1}]},{"id":"mitch","name":"拜訪 Anders","who":"Mitchell · Cameron · Anders","plot":"兩人去拜訪很有品味的朋友 Anders。","items":[{"p":"pretentious","zh":"做作、自命不凡","scene":"Anders 有點裝模作樣。","en":"That restaurant is so pretentious. The menu is all in French.","tr":"那家餐廳好做作，菜單全是法文。","tip":"<b>用法：</b>故作高雅、自以為了不起。","th":9,"lv":2},{"p":"posh","zh":"高級的、奢華的","scene":"Anders 家很豪華。","en":"They live in a posh neighborhood.","tr":"他們住在高級住宅區。","tip":"<b>用法：</b>英式口語，美國也常用。","th":9,"lv":2},{"p":"fine dining","zh":"高級餐飲","scene":"兩人被招待高級料理。","en":"We went fine dining for our anniversary.","tr":"我們週年紀念去吃高級餐廳。","tip":"<b>用法：</b>精緻、正式的用餐。","th":8,"lv":1}]}],"prompts":["你吃過最高級的一餐（用 fine dining、posh、pretentious）","你招待過客人嗎（用 be a good host、sister-in-law、family resemblance）","你跟另一半吵架後怎麼和好（用 kiss and make up、keep things interesting、get into character）"],"challenges":[{"id":"c1","sit":"朋友要你在兩個朋友之間選邊，你說他讓你很難做人。","uses":["put someone in an awkward position"],"ans":"You're putting me in an awkward position."},{"id":"c2","sit":"你看到朋友的爸爸，說看得出家族相似。","uses":["family resemblance"],"ans":"I can see the family resemblance."},{"id":"c3","sit":"你說那家餐廳超做作。","uses":["pretentious"],"ans":"That place is so pretentious."},{"id":"c4","sit":"你跟女朋友吵架後和好了。","uses":["kiss and make up"],"ans":"We kissed and made up."}]},"s06e15":{"title":"Fight or Flight","lede":"Phil 和 Claire 參加完 Phil 大學死黨的聚會飛回家，Claire 卻搶走了唯一的頭等艙座位；Jay 教 Manny 怎麼對付烹飪課上的霸凌者；Mitchell、Cam、Pepper 和朋友們幫 Sal 辦迎嬰派對。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"回程只剩一個頭等艙位子，Claire 毫不猶豫地坐了。","items":[{"p":"first class","zh":"頭等艙","scene":"Claire 搶走了頭等艙。","en":"I've never flown first class.","tr":"我從來沒坐過頭等艙。","tip":"<b>延伸：</b>business class 商務艙。","th":8,"lv":1},{"p":"economy class","zh":"經濟艙","scene":"Phil 只能坐經濟艙。","en":"We always fly economy class to save money.","tr":"我們總是坐經濟艙來省錢。","tip":"<b>延伸：</b>coach 也是經濟艙的口語。","th":8,"lv":1},{"p":"every man for himself","zh":"人人自危、各顧各的","scene":"這種時候就各顧各的了。","en":"When the store opened, it was every man for himself.","tr":"店一開門，大家就搶成一團各顧各的。","tip":"<b>用法：</b>混亂中只顧自己。","th":9,"lv":2},{"p":"college buddies","zh":"大學死黨","scene":"Phil 跟大學朋友聚會。","en":"I still hang out with my college buddies.","tr":"我現在還會跟大學死黨出去。","tip":"<b>延伸：</b>buddy 好朋友、哥兒們。","th":2,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Manny 在烹飪課被欺負，Jay 教他怎麼保護自己。","items":[{"p":"fight or flight","zh":"戰或逃反應","scene":"Manny 面對霸凌要選擇反擊或逃走。","en":"When I saw the snake, my fight-or-flight response kicked in.","tr":"我看到蛇的時候，戰或逃的本能就出現了。","tip":"<b>用法：</b>面對危險的本能反應。","th":4,"lv":2},{"p":"self-defense","zh":"自衛","scene":"Jay 教 Manny 防身術。","en":"I'm taking a self-defense class.","tr":"我在上防身術課程。","tip":"<b>延伸：</b>in self-defense 出於自衛。","th":8,"lv":1},{"p":"throw a punch","zh":"出拳","scene":"Jay 教 Manny 怎麼出拳。","en":"He threw a punch but missed.","tr":"他出了一拳但沒打中。","tip":"<b>用法：</b>打架的動作。","th":5,"lv":1}]},{"id":"mitch","name":"Sal 的迎嬰派對","who":"Mitchell · Cameron · Pepper · Sal","plot":"大家幫即將當媽媽的 Sal 辦派對。","items":[{"p":"baby shower","zh":"迎嬰派對","scene":"大家為準媽媽慶祝。","en":"We threw a baby shower for my cousin.","tr":"我們幫表姊辦了迎嬰派對。","tip":"<b>文化：</b>寶寶出生前送禮的聚會。","th":8,"lv":1},{"p":"mom-to-be","zh":"準媽媽","scene":"Sal 快當媽媽了。","en":"The mom-to-be opened her gifts.","tr":"準媽媽打開了她的禮物。","tip":"<b>延伸：</b>dad-to-be 準爸爸。","th":2,"lv":1},{"p":"due date","zh":"預產期、截止日","scene":"Sal 的預產期快到了。","en":"Her due date is next week.","tr":"她的預產期在下週。","tip":"<b>延伸：</b>作業的截止日也叫 due date。","th":2,"lv":1}]}],"prompts":["你坐過最好的機位（用 first class、economy class、every man for himself）","你學過防身術嗎（用 self-defense、throw a punch、fight or flight）","你參加過迎嬰派對或滿月酒嗎（用 baby shower、mom-to-be、due date）"],"challenges":[{"id":"c1","sit":"你跟朋友說你從來沒坐過頭等艙。","uses":["first class"],"ans":"I've never flown first class."},{"id":"c2","sit":"搶福利社限量商品時，你說大家各顧各的。","uses":["every man for himself"],"ans":"It's every man for himself."},{"id":"c3","sit":"你說報告的截止日是下週五。","uses":["due date"],"ans":"The due date is next Friday."},{"id":"c4","sit":"你說你下班後想去學防身術。","uses":["self-defense"],"ans":"I want to take a self-defense class."}]},"s06e16":{"title":"Connection Lost","lede":"這集整集都在 Claire 的電腦螢幕上進行：她跟 Haley 吵架後被困在機場，用電腦視訊聯絡全家人找 Haley，結果越滑越多，全家都被捲入一場網路風波。","stories":[{"id":"dunphy","name":"Claire 的筆電","who":"Claire · 全家","plot":"Claire 透過視訊和訊息，一個一個聯絡家人。","items":[{"p":"video chat","zh":"視訊聊天","scene":"Claire 一直開視訊找人。","en":"We video chat every Sunday night.","tr":"我們每週日晚上視訊聊天。","tip":"<b>用法：</b>名詞或動詞都可以。","th":8,"lv":1},{"p":"FaceTime","zh":"用 FaceTime 視訊","scene":"Claire 打給每個家人。","en":"I'll FaceTime you when I get home.","tr":"我到家後打 FaceTime 給你。","tip":"<b>用法：</b>品牌名當動詞用。","th":8,"lv":1},{"p":"lose connection","zh":"斷線","scene":"視訊一直斷。","en":"Sorry, I lost connection for a minute.","tr":"抱歉，我斷線了一下。","tip":"<b>延伸：</b>bad signal 訊號不好。","th":8,"lv":1},{"p":"you're on mute","zh":"你靜音了","scene":"有人講了半天都沒聲音。","en":"Hey, you're on mute! We can't hear you.","tr":"嘿，你靜音了！我們聽不到你。","tip":"<b>用法：</b>視訊會議的經典台詞。","th":7,"lv":1},{"p":"the screen froze","zh":"畫面卡住了","scene":"視訊畫面突然不動。","en":"The screen froze in the middle of my presentation.","tr":"我報告到一半畫面卡住了。","tip":"<b>延伸：</b>freeze 凍結、當機。","th":8,"lv":1},{"p":"can you hear me now","zh":"你聽得到嗎","scene":"訊號不好，一直確認聲音。","en":"Can you hear me now? Is this better?","tr":"你現在聽得到嗎？這樣有好一點嗎？","tip":"<b>用法：</b>通話不清楚時。","th":7,"lv":1},{"p":"screen share","zh":"分享螢幕","scene":"Claire 分享螢幕給大家看。","en":"Let me screen share so you can see the file.","tr":"我分享螢幕讓你們看檔案。","tip":"<b>用法：</b>線上會議功能。","th":3,"lv":1},{"p":"log in","zh":"登入","scene":"Claire 登入各種帳號查資料。","en":"I forgot my password and can't log in.","tr":"我忘了密碼，登不進去。","tip":"<b>反義：</b>log out 登出。","th":8,"lv":1},{"p":"my battery is dying","zh":"我手機快沒電了","scene":"電腦電量也是個問題。","en":"I have to go. My battery is dying.","tr":"我得掛了，我手機快沒電了。","tip":"<b>用法：</b>結束通話的好理由。","th":7,"lv":1},{"p":"social media stalking","zh":"在社群上偷看別人動態","scene":"Claire 開始在網路上查 Haley 的動態。","en":"I spent an hour social media stalking my ex.","tr":"我花了一小時在社群上偷看前任的動態。","tip":"<b>延伸：</b>stalk 跟蹤，網路上的偷看。","th":1,"lv":2}]}],"prompts":["你最常跟誰視訊（用 video chat、FaceTime、lose connection）","你在線上會議遇過什麼尷尬事（用 you're on mute、the screen froze、screen share）","你會在社群上偷看別人嗎（用 social media stalking、log in、my battery is dying）"],"challenges":[{"id":"c1","sit":"跟家人視訊時你媽靜音了，你提醒她。","uses":["you're on mute"],"ans":"Mom, you're on mute!"},{"id":"c2","sit":"你說你到營區後再打 FaceTime 給女朋友。","uses":["FaceTime"],"ans":"I'll FaceTime you later."},{"id":"c3","sit":"你要掛電話，說手機快沒電了。","uses":["my battery is dying"],"ans":"I have to go. My battery is dying."},{"id":"c4","sit":"視訊時畫面卡住了。","uses":["the screen froze"],"ans":"Sorry, the screen froze."}]},"s06e17":{"title":"Closet? You'll Love It!","lede":"Claire 和 Jay 一起演出公司的衣櫃廣告；Phil、Luke 和 Manny 幫 Gloria 保護隱私；Lily 的音樂發表會快到了，Cam 卻發現她唱歌走音而緊張不已；Andy 突然得了盲腸炎。","stories":[{"id":"jay","name":"衣櫃廣告","who":"Claire · Jay","plot":"父女倆為了公司拍廣告，一起想台詞和廣告歌。","items":[{"p":"shoot a commercial","zh":"拍廣告","scene":"兩人要上鏡頭拍廣告。","en":"They're shooting a commercial at the beach today.","tr":"他們今天在海邊拍廣告。","tip":"<b>延伸：</b>commercial 電視廣告。","th":3,"lv":1},{"p":"catchphrase","zh":"口號、口頭禪","scene":"廣告需要一句好記的口號。","en":"\"Just do it\" is Nike's famous catchphrase.","tr":"「Just do it」是 Nike 有名的口號。","tip":"<b>用法：</b>品牌標語或人的口頭禪。","th":9,"lv":1},{"p":"jingle","zh":"廣告歌","scene":"廣告要有洗腦的旋律。","en":"I can't get that jingle out of my head.","tr":"那首廣告歌一直在我腦中揮之不去。","tip":"<b>用法：</b>短又好記的廣告曲。","th":3,"lv":2}]},{"id":"dunphy","name":"Gloria 的隱私","who":"Gloria · Phil · Luke · Manny","plot":"男生們聯手幫 Gloria 保護她的隱私。","items":[{"p":"invasion of privacy","zh":"侵犯隱私","scene":"Gloria 不想被打擾。","en":"Reading my messages is an invasion of privacy.","tr":"看我的訊息是侵犯隱私。","tip":"<b>用法：</b>被偷看、偷拍時。","th":5,"lv":1},{"p":"off the record","zh":"私下說、不公開","scene":"有些話不能公開。","en":"Off the record, I think he's going to quit.","tr":"私下說，我覺得他要辭職了。","tip":"<b>用法：</b>記者採訪或私下聊天。","th":10,"lv":2}]},{"id":"mitch","name":"Lily 的發表會","who":"Cameron · Mitchell · Lily · Andy","plot":"Lily 唱歌走音，Cam 很焦慮；Andy 突然肚子痛到被送醫。","items":[{"p":"off-key","zh":"走音","scene":"Lily 唱歌走音。","en":"He sings off-key, but he loves karaoke.","tr":"他唱歌會走音，但很愛唱 KTV。","tip":"<b>對比：</b>tone-deaf 是五音不全；off-key 是當下唱走音。","th":8,"lv":2},{"p":"recital","zh":"發表會","scene":"Lily 要上台表演。","en":"My piano recital is this Saturday.","tr":"我的鋼琴發表會在這週六。","tip":"<b>用法：</b>音樂、舞蹈的成果發表。","th":8,"lv":1},{"p":"carry a tune","zh":"唱歌在調上","scene":"Lily 唱不太準。","en":"I can't carry a tune to save my life.","tr":"我唱歌怎樣都唱不準。","tip":"<b>用法：</b>常用否定句。","th":8,"lv":2},{"p":"doubled over in pain","zh":"痛到彎下腰","scene":"Andy 肚子痛到站不直。","en":"He was doubled over in pain after eating that street food.","tr":"他吃了那個路邊攤之後痛到彎下腰。","tip":"<b>用法：</b>形容劇烈疼痛。","th":8,"lv":2},{"p":"emergency surgery","zh":"緊急手術","scene":"Andy 得馬上開刀。","en":"My uncle had emergency surgery last night.","tr":"我叔叔昨晚做了緊急手術。","tip":"<b>延伸：</b>ER 急診室。","th":8,"lv":1}]}],"prompts":["你最難忘的廣告歌或口號（用 jingle、catchphrase、shoot a commercial）","你很在意隱私嗎（用 invasion of privacy、off the record、doubled over in pain）","你唱歌會走音嗎（用 off-key、carry a tune、recital）"],"challenges":[{"id":"c1","sit":"你說那首超商廣告歌一直在你腦中。","uses":["jingle"],"ans":"I can't get that jingle out of my head."},{"id":"c2","sit":"你跟同事說私下講，主管下個月要離職了。","uses":["off the record"],"ans":"Off the record, he's leaving next month."},{"id":"c3","sit":"你說你唱歌怎樣都唱不準。","uses":["carry a tune"],"ans":"I can't carry a tune."},{"id":"c4","sit":"室友偷看你手機，你說那是侵犯隱私。","uses":["invasion of privacy"],"ans":"That's an invasion of privacy."}]},"s06e18":{"title":"Spring Break","lede":"Luke 在幾乎每件事上都開始贏過 Phil；Claire 瘋狂大掃除；Haley 帶 Alex 去參加音樂祭；Jay 和 Gloria 約好要戒掉一個壞習慣，但 Mitchell 和 Cam 的出現讓計畫變得更難。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Claire · Haley · Alex","plot":"Luke 開始勝過爸爸；Claire 狂打掃；兩姊妹去音樂祭。","items":[{"p":"the student becomes the master","zh":"青出於藍","scene":"Luke 開始贏過 Phil。","en":"My son beat me at chess. The student becomes the master.","tr":"我兒子下棋贏了我，青出於藍。","tip":"<b>用法：</b>學生超越老師。","th":7,"lv":2},{"p":"neat freak","zh":"潔癖、愛乾淨的人","scene":"Claire 打掃到停不下來。","en":"My roommate is a neat freak. Everything has to be perfect.","tr":"我室友有潔癖，一切都要完美。","tip":"<b>用法：</b>形容很愛整潔的人。","th":9,"lv":2},{"p":"spring cleaning","zh":"春季大掃除","scene":"Claire 趁春假大掃除。","en":"We do spring cleaning every year before Chinese New Year.","tr":"我們每年過年前都會大掃除。","tip":"<b>用法：</b>年度大掃除。","th":8,"lv":1},{"p":"spring break","zh":"春假","scene":"大家都在放春假。","en":"We went to Cancún for spring break.","tr":"我們春假去了坎昆。","tip":"<b>文化：</b>美國大學生的狂歡假期。","th":3,"lv":1},{"p":"music festival","zh":"音樂祭","scene":"姊妹倆去音樂祭。","en":"I've always wanted to go to a music festival.","tr":"我一直很想去音樂祭。","tip":"<b>例如：</b>台灣的大港開唱、春浪。","th":8,"lv":1},{"p":"mosh pit","zh":"搖滾區（推擠衝撞區）","scene":"音樂祭最瘋狂的地方。","en":"I lost my shoe in the mosh pit.","tr":"我在搖滾區掉了一隻鞋。","tip":"<b>用法：</b>舞台前跳上跳下推擠的區域。","th":8,"lv":2},{"p":"front row","zh":"第一排","scene":"大家都想擠到最前面。","en":"We got front-row seats at the concert!","tr":"我們拿到演唱會第一排的位子！","tip":"<b>用法：</b>當形容詞時加連字號。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家和 Mitchell 家","who":"Jay · Gloria · Mitchell · Cameron","plot":"兩人約好戒掉壞習慣，偏偏有人在旁邊誘惑。","items":[{"p":"resist temptation","zh":"抵抗誘惑","scene":"Jay 和 Gloria 努力忍住。","en":"I'm trying to resist the temptation to eat dessert.","tr":"我在努力抵抗吃甜點的誘惑。","tip":"<b>延伸：</b>temptation 誘惑。","th":10,"lv":1},{"p":"cave in","zh":"屈服、讓步","scene":"撐不住就會投降。","en":"I said no, but after an hour I caved in.","tr":"我說不要，但一個小時後我就屈服了。","tip":"<b>對比：</b>give in 是讓步；cave in 帶有「撐不住而垮掉」的意思。","th":10,"lv":2},{"p":"one more won't hurt","zh":"再一個沒關係","scene":"最危險的一句話。","en":"I know I'm on a diet, but one more won't hurt.","tr":"我知道我在減肥，但再一個沒關係吧。","tip":"<b>用法：</b>自我安慰的藉口。","th":7,"lv":1}]}],"prompts":["你參加過音樂祭或演唱會嗎（用 music festival、mosh pit、front row）","你有被學生或晚輩超越過嗎（用 the student becomes the master、neat freak、spring cleaning）","你最難抵抗的誘惑（用 resist temptation、cave in、one more won't hurt）"],"challenges":[{"id":"c1","sit":"你在減肥，但又想吃一塊雞排，你說再一個沒關係。","uses":["one more won't hurt"],"ans":"One more won't hurt."},{"id":"c2","sit":"學弟打靶比你準，你笑說青出於藍。","uses":["the student becomes the master"],"ans":"The student becomes the master."},{"id":"c3","sit":"你說過年前全家都要大掃除。","uses":["spring cleaning"],"ans":"We do spring cleaning before New Year."},{"id":"c4","sit":"你本來不想去 KTV，被朋友說服後屈服了。","uses":["cave in"],"ans":"I caved in."}]},"s06e19":{"title":"Grill, Interrupted","lede":"Jay 的生日快到了，Phil 想送他一台高科技烤肉架；Mitchell 和 Claire 也想出了一個禮物點子；Gloria 給 Luke 和 Manny 上了一堂關於酒精的課；Haley 交了新男友，讓 Andy 很不是滋味。","stories":[{"id":"jay","name":"Jay 的生日","who":"Jay · Phil · Mitchell · Claire","plot":"Phil 送上超高級的烤肉架，Mitchell 和 Claire 也在想怎麼送爸爸最好的禮物。","items":[{"p":"fire up the grill","zh":"開始烤肉","scene":"Phil 迫不及待想點火。","en":"It's a sunny day. Let's fire up the grill!","tr":"天氣很好，我們來烤肉吧！","tip":"<b>用法：</b>美式烤肉的開場白。","th":8,"lv":2},{"p":"bells and whistles","zh":"花俏的附加功能","scene":"烤肉架功能多到誇張。","en":"I don't need all the bells and whistles. I just want a simple phone.","tr":"我不需要那些花俏的功能，只要一支簡單的手機。","tip":"<b>用法：</b>額外、不一定需要的功能。","th":9,"lv":2},{"p":"grill master","zh":"烤肉高手","scene":"Jay 自認是烤肉大師。","en":"My uncle is the grill master at every family party.","tr":"我舅舅是每次家庭聚會的烤肉高手。","tip":"<b>用法：</b>負責烤肉的人。","th":8,"lv":1},{"p":"chip in","zh":"一起出錢","scene":"兄妹倆一起出錢買禮物。","en":"Let's all chip in and buy her a gift.","tr":"我們大家一起出錢買禮物給她。","tip":"<b>對比：</b>pitch in 偏出力；chip in 偏出錢。","th":3,"lv":1},{"p":"gift card","zh":"禮物卡","scene":"不知道送什麼時的選擇。","en":"When in doubt, give a gift card.","tr":"不知道送什麼的時候，就送禮物卡。","tip":"<b>用法：</b>商店、餐廳的禮券。","th":8,"lv":1}]},{"id":"dunphy","name":"Gloria 的酒精課","who":"Gloria · Luke · Manny","plot":"Gloria 想讓兩個男孩知道喝酒的後果。","items":[{"p":"teach someone a lesson","zh":"給某人一個教訓","scene":"Gloria 要給他們上一課。","en":"He was rude, so I taught him a lesson.","tr":"他很沒禮貌，所以我給了他一個教訓。","tip":"<b>用法：</b>懲罰讓人學乖。","th":5,"lv":1},{"p":"drink responsibly","zh":"理性飲酒","scene":"喝酒要節制。","en":"Have fun tonight, but drink responsibly.","tr":"今晚玩得開心，但要理性飲酒。","tip":"<b>用法：</b>酒類廣告的標語。","th":8,"lv":1},{"p":"lightweight","zh":"酒量很差的人","scene":"有人一喝就倒。","en":"I'm a lightweight. One beer and I'm done.","tr":"我酒量很差，一瓶啤酒就倒了。","tip":"<b>用法：</b>也可以指份量很輕的東西。","th":9,"lv":2}]},{"id":"mitch","name":"Haley 和 Andy","who":"Haley · Andy","plot":"Haley 有了新男友，Andy 心裡很不舒服。","items":[{"p":"rub someone the wrong way","zh":"讓人不爽、惹人反感","scene":"Haley 的新男友讓 Andy 看不順眼。","en":"Something about him rubs me the wrong way.","tr":"他有某個地方讓我很不爽。","tip":"<b>畫面：</b>逆著毛摸貓。","th":4,"lv":2},{"p":"the green-eyed monster","zh":"嫉妒心","scene":"Andy 被嫉妒吞噬。","en":"Watch out for the green-eyed monster.","tr":"小心嫉妒心作祟。","tip":"<b>來源：</b>莎士比亞《奧賽羅》。","th":4,"lv":2}]}],"prompts":["你家烤肉都是誰負責（用 fire up the grill、grill master、bells and whistles）","你酒量好嗎（用 lightweight、drink responsibly、teach someone a lesson）","你曾經看誰不順眼嗎（用 rub someone the wrong way、the green-eyed monster、chip in）"],"challenges":[{"id":"c1","sit":"同梯要幫班長買生日禮物，你說大家一起出錢。","uses":["chip in"],"ans":"Let's all chip in."},{"id":"c2","sit":"你說你酒量很差，一杯就倒。","uses":["lightweight"],"ans":"I'm a lightweight."},{"id":"c3","sit":"你說新來的室友有某個地方讓你不太舒服。","uses":["rub someone the wrong way"],"ans":"He rubs me the wrong way."},{"id":"c4","sit":"中秋節烤肉，你說要開始點火了。","uses":["fire up the grill"],"ans":"Let's fire up the grill!"}]},"s06e20":{"title":"Knock 'Em Down","lede":"Jay 代替 Cam 的保齡球隊打決賽，卻發現這是全同志聯盟，處境有點尷尬；Phil 和 Claire 跟死對頭鄰居 Ronnie 和 Amber 一起吃晚餐；Gloria 和 Mitchell 陪 Haley 去夜店，想證明自己還很會玩，結果續攤前的暖場就失控了。","stories":[{"id":"mitch","name":"Cam 的保齡球隊","who":"Cameron · Jay","plot":"Jay 被找來當秘密武器，替 Cam 的隊伍打決賽。","items":[{"p":"be a ringer","zh":"當秘密高手、找來的外援","scene":"Jay 是 Cam 找來的強援。","en":"He's not a beginner. He's a ringer!","tr":"他不是新手，他是找來的高手！","tip":"<b>用法：</b>比賽中偷偷請來的高手。","th":8,"lv":2},{"p":"gutter ball","zh":"洗溝球","scene":"保齡球最怕洗溝。","en":"I bowled three gutter balls in a row.","tr":"我連續洗溝三球。","tip":"<b>用法：</b>球滾進溝裡沒打到瓶。","th":8,"lv":2},{"p":"ally","zh":"盟友、支持者","scene":"Jay 在隊上成了支持者。","en":"Thank you for being such a great ally.","tr":"謝謝你這麼支持我們。","tip":"<b>用法：</b>支持某個群體的人。","th":6,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Ronnie · Amber","plot":"兩家人終於坐下來一起吃飯，關係有點微妙。","items":[{"p":"frenemies","zh":"亦敵亦友","scene":"兩家人的關係很複雜。","en":"Those two are frenemies. They compete at everything.","tr":"他們兩個亦敵亦友，什麼都要比。","tip":"<b>字源：</b>friend + enemy。","th":2,"lv":2},{"p":"make peace with","zh":"與某人和解、接受某事","scene":"兩家人試著和平相處。","en":"I've made peace with my past.","tr":"我已經跟自己的過去和解了。","tip":"<b>用法：</b>和人或和事情和解。","th":6,"lv":1}]},{"id":"jay","name":"Gloria、Mitchell 和 Haley","who":"Gloria · Mitchell · Haley","plot":"兩個大人想證明自己還很會玩，結果暖場就玩過頭。","items":[{"p":"pregame","zh":"暖場（出門前先喝）","scene":"去夜店前先在家喝一輪。","en":"We pregamed at my place before the party.","tr":"我們派對前先在我家喝一輪。","tip":"<b>用法：</b>年輕人的派對用語。","th":8,"lv":2},{"p":"party hard","zh":"盡情狂歡","scene":"兩人想證明自己還很能玩。","en":"We partied hard on New Year's Eve.","tr":"我們跨年夜盡情狂歡。","tip":"<b>延伸：</b>work hard, play hard 認真工作也認真玩。","th":8,"lv":1},{"p":"hit the dance floor","zh":"上舞池跳舞","scene":"大家衝進舞池。","en":"When my favorite song came on, I hit the dance floor.","tr":"我最愛的歌一放，我就衝上舞池。","tip":"<b>用法：</b>去跳舞。","th":8,"lv":2},{"p":"outlast","zh":"撐得比某人久","scene":"兩個大人想撐得比年輕人久。","en":"I outlasted everyone and was the last one awake.","tr":"我撐得比大家都久，是最後一個醒著的。","tip":"<b>用法：</b>比耐力。","th":10,"lv":2},{"p":"dance like nobody's watching","zh":"盡情跳舞，別在意別人","scene":"盡情享受就對了。","en":"Just dance like nobody's watching.","tr":"盡情跳吧，別在意別人眼光。","tip":"<b>用法：</b>鼓勵人放開自己。","th":6,"lv":2}]}],"prompts":["你打保齡球或玩過什麼運動很糗嗎（用 gutter ball、be a ringer、outlast）","你有亦敵亦友的朋友嗎（用 frenemies、make peace with、ally）","你去過夜店或派對狂歡嗎（用 pregame、party hard、hit the dance floor）"],"challenges":[{"id":"c1","sit":"你連續打了兩個洗溝球，朋友笑你。","uses":["gutter ball"],"ans":"Another gutter ball!"},{"id":"c2","sit":"你說你跟大學室友是亦敵亦友，什麼都要比。","uses":["frenemies"],"ans":"We're frenemies."},{"id":"c3","sit":"你最愛的歌放出來，你衝上舞池。","uses":["hit the dance floor"],"ans":"Time to hit the dance floor!"},{"id":"c4","sit":"朋友在聚會上很害羞，你叫他盡情跳別在意。","uses":["dance like nobody's watching"],"ans":"Dance like nobody's watching!"}]},"s06e21":{"title":"Integrity","lede":"Jay 和 Phil 都在生老婆的氣，一起去把 Lily 的舊公主城堡搬來給 Joe；Mitchell 和 Cam 幫忙顧 Joe；Gloria 幫 Haley 在職場上替自己發聲；Claire 想賄賂 Luke 的校長，讓他得獎。","stories":[{"id":"jay","name":"Jay 和 Phil","who":"Jay · Phil","plot":"兩個男人都在生老婆的氣，一邊搬東西一邊互吐苦水。","items":[{"p":"vent","zh":"發洩、吐苦水","scene":"兩人互相抱怨。","en":"Sorry, I just need to vent for a minute.","tr":"抱歉，我只是需要發洩一下。","tip":"<b>用法：</b>vent to someone 跟某人抱怨。","th":4,"lv":1},{"p":"blow off steam","zh":"發洩情緒、紓壓","scene":"兩人藉著做事發洩。","en":"I go running to blow off steam.","tr":"我去跑步來紓壓。","tip":"<b>畫面：</b>讓蒸汽洩出來，避免爆炸。","th":4,"lv":2},{"p":"man to man","zh":"男人對男人地說","scene":"兩人坦誠地聊。","en":"Let's talk man to man.","tr":"我們男人對男人好好談談。","tip":"<b>用法：</b>坦白、直接的談話。","th":2,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Joe","plot":"兩人幫忙顧 Joe，得先把家裡做好防護。","items":[{"p":"toddler-proof","zh":"做好幼兒防護","scene":"家裡要防止小孩亂碰。","en":"We need to toddler-proof the living room.","tr":"我們得把客廳做好幼兒防護。","tip":"<b>延伸：</b>childproof 兒童防護。","th":2,"lv":2}]},{"id":"dunphy","name":"Dunphy 家和 Gloria","who":"Claire · Luke · Gloria · Haley","plot":"Claire 想用不正當手段讓 Luke 得獎；Gloria 教 Haley 在職場上替自己說話。","items":[{"p":"have integrity","zh":"有正直的品格","scene":"Claire 的做法有違誠信。","en":"I trust him because he has integrity.","tr":"我信任他，因為他很正直。","tip":"<b>用法：</b>品德、操守。","th":9,"lv":1},{"p":"bribe","zh":"賄賂","scene":"Claire 想收買校長。","en":"He tried to bribe the officer, but it didn't work.","tr":"他想賄賂警察，但沒用。","tip":"<b>用法：</b>名詞和動詞都可以。","th":10,"lv":1},{"p":"under the table","zh":"私底下、檯面下","scene":"用不光彩的方式交易。","en":"He was paid under the table.","tr":"他是私下領錢的。","tip":"<b>用法：</b>不合法、不公開的交易。","th":3,"lv":2},{"p":"speak one's mind","zh":"說出想法","scene":"Gloria 鼓勵 Haley 直說。","en":"Don't be afraid to speak your mind at work.","tr":"在工作上別怕說出你的想法。","tip":"<b>用法：</b>坦率表達意見。","th":10,"lv":1},{"p":"push around","zh":"欺負、任意使喚","scene":"Haley 不想再被人使喚。","en":"Don't let your boss push you around.","tr":"別讓你老闆欺負你。","tip":"<b>用法：</b>被人強勢對待。","th":5,"lv":1},{"p":"earn it","zh":"靠自己贏得","scene":"獎就要自己贏。","en":"You have to earn it. Nobody will hand it to you.","tr":"你得靠自己贏得，沒人會送給你。","tip":"<b>用法：</b>強調努力。","th":10,"lv":1}]}],"prompts":["你心情不好時怎麼發洩（用 vent、blow off steam、man to man）","你在團體裡會說出自己的想法嗎（用 speak one's mind、push around、earn it）","你覺得什麼是正直（用 have integrity、bribe、under the table）"],"challenges":[{"id":"c1","sit":"你跟朋友說你只是需要發洩一下。","uses":["vent"],"ans":"I just need to vent."},{"id":"c2","sit":"你說你都去健身房紓壓。","uses":["blow off steam"],"ans":"I go to the gym to blow off steam."},{"id":"c3","sit":"新進同事一直被前輩使喚，你叫他別讓人欺負。","uses":["push around"],"ans":"Don't let them push you around."},{"id":"c4","sit":"你跟隊友說先發位置要靠自己贏得。","uses":["earn it"],"ans":"You have to earn it."}]},"s06e22":{"title":"Patriot Games","lede":"Phil 和 Claire 跟 Sanjay 的爸媽較勁，想幫 Alex 拿到畢業生代表；Javier 想阻止 Gloria 成為美國公民；Mitchell 和 Cam 參加抗議一家當地餐廳的活動。","stories":[{"id":"dunphy","name":"畢業生代表之爭","who":"Phil · Claire · Alex · Sanjay 的爸媽","plot":"兩家父母為了孩子的名次正面對決。","items":[{"p":"class rank","zh":"班級排名","scene":"Alex 和 Sanjay 爭第一名。","en":"She's number one in her class rank.","tr":"她是班上排名第一。","tip":"<b>用法：</b>成績排名。","th":3,"lv":1},{"p":"head-to-head","zh":"正面交鋒、一對一","scene":"兩家人正面對決。","en":"The two candidates went head-to-head in the debate.","tr":"兩位候選人在辯論中正面交鋒。","tip":"<b>用法：</b>直接競爭。","th":5,"lv":2},{"p":"it's a tie","zh":"平手","scene":"兩人成績不相上下。","en":"We both got 90. It's a tie!","tr":"我們都拿 90 分，平手！","tip":"<b>延伸：</b>tie 也可當動詞，tie with someone。","th":7,"lv":1},{"p":"sore winner","zh":"贏了還很囂張的人","scene":"有人贏了很得意。","en":"Don't be a sore winner. It's rude.","tr":"贏了別那麼囂張，很沒禮貌。","tip":"<b>對比：</b>sore loser 輸不起的人。","th":9,"lv":2}]},{"id":"jay","name":"Gloria 的公民考試","who":"Gloria · Jay · Javier","plot":"Gloria 準備公民考試，前夫 Javier 卻想阻止她。","items":[{"p":"citizenship test","zh":"公民考試","scene":"Gloria 要考公民資格。","en":"She studied hard for her citizenship test.","tr":"她很努力準備公民考試。","tip":"<b>文化：</b>歸化美國需考美國歷史與公民知識。","th":3,"lv":1},{"p":"the American dream","zh":"美國夢","scene":"Gloria 追求她的美國夢。","en":"He moved to New York to chase the American dream.","tr":"他搬到紐約追求美國夢。","tip":"<b>用法：</b>靠努力過上好生活的理想。","th":3,"lv":2},{"p":"pledge allegiance","zh":"宣誓效忠","scene":"成為公民要宣誓。","en":"Students pledge allegiance to the flag every morning.","tr":"學生每天早上都會向國旗宣誓效忠。","tip":"<b>文化：</b>美國學校每天的效忠宣誓。","th":3,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人加入抗議餐廳的行列。","items":[{"p":"boycott","zh":"抵制","scene":"兩人呼籲大家抵制那家餐廳。","en":"People are boycotting that brand.","tr":"大家在抵制那個品牌。","tip":"<b>用法：</b>拒買、拒用以表達抗議。","th":5,"lv":1},{"p":"cross a picket line","zh":"越過罷工糾察線","scene":"抗議時有人不顧一切進去。","en":"I won't cross a picket line.","tr":"我不會越過罷工糾察線。","tip":"<b>用法：</b>不支持罷工、抗議的行為。","th":3,"lv":2},{"p":"stand for something","zh":"有所堅持、有立場","scene":"兩人想表達自己的立場。","en":"If you don't stand for something, you'll fall for anything.","tr":"如果你沒有任何堅持，就會被任何事左右。","tip":"<b>用法：</b>堅持某種價值。","th":9,"lv":2}]}],"prompts":["你在學校曾經跟誰競爭過名次嗎（用 class rank、head-to-head、it's a tie）","你心中的「夢想生活」是什麼（用 the American dream、stand for something、pledge allegiance）","你抵制過什麼品牌或店嗎（用 boycott、sore winner、cross a picket line）"],"challenges":[{"id":"c1","sit":"你和朋友打保齡球分數一樣，說平手。","uses":["it's a tie"],"ans":"It's a tie!"},{"id":"c2","sit":"朋友贏了比賽一直炫耀，你叫他別那麼囂張。","uses":["sore winner"],"ans":"Don't be a sore winner."},{"id":"c3","sit":"你說你在抵制那家黑心店。","uses":["boycott"],"ans":"I'm boycotting that shop."},{"id":"c4","sit":"你說人要有所堅持。","uses":["stand for something"],"ans":"You have to stand for something."}]},"s06e23":{"title":"Crying Out Loud","lede":"一家飯店要挖角 Claire，她擔心 Jay 知道她要離開公司會很受傷；Manny 拔了智齒，Gloria 卻毀了他的感性時刻；Phil、Haley 和 Luke 想說服 Alex 參加畢業生翹課日；Mitchell 和 Cam 擔心 Lily 對什麼都提不起勁。","stories":[{"id":"jay","name":"Claire 的工作機會","who":"Claire · Jay","plot":"有人來挖角 Claire，她不知道怎麼跟爸爸開口。","items":[{"p":"get headhunted","zh":"被挖角","scene":"飯店想挖 Claire 過去。","en":"She got headhunted by a big tech company.","tr":"她被一家大型科技公司挖角了。","tip":"<b>延伸：</b>headhunter 獵人頭公司。","th":3,"lv":2},{"p":"jump ship","zh":"跳槽、離開","scene":"Claire 考慮離開爸爸的公司。","en":"Half the team jumped ship to our competitor.","tr":"一半的團隊都跳槽到對手公司了。","tip":"<b>畫面：</b>從船上跳下去。","th":3,"lv":2}]},{"id":"dunphy","name":"Dunphy 家和 Manny","who":"Alex · Phil · Haley · Luke · Manny · Gloria","plot":"大家想讓守規矩的 Alex 放縱一天；Manny 拔完智齒整個人迷迷糊糊。","items":[{"p":"wisdom teeth","zh":"智齒","scene":"Manny 拔了智齒。","en":"I had my wisdom teeth pulled last week.","tr":"我上週拔了智齒。","tip":"<b>用法：</b>get one's wisdom teeth out 拔智齒。","th":8,"lv":1},{"p":"loopy","zh":"迷迷糊糊、恍神","scene":"麻醉後 Manny 講話很怪。","en":"The medicine made me a little loopy.","tr":"那個藥讓我有點恍神。","tip":"<b>用法：</b>因為藥物或疲累而神智不清。","th":8,"lv":2},{"p":"senior skip day","zh":"畢業班翹課日","scene":"大家想帶 Alex 翹一天課。","en":"Did you go to school on senior skip day?","tr":"畢業生翹課日你有去學校嗎？","tip":"<b>文化：</b>美國高中畢業生的非官方傳統。","th":3,"lv":2},{"p":"rule follower","zh":"守規矩的人","scene":"Alex 從不違規。","en":"I'm a rule follower. I never cross on red.","tr":"我很守規矩，從不闖紅燈。","tip":"<b>反義：</b>rule breaker 愛破壞規矩的人。","th":9,"lv":1},{"p":"live a little","zh":"放縱一下、享受人生","scene":"家人希望 Alex 偶爾放鬆。","en":"Come on, live a little! Have some cake.","tr":"拜託，放縱一下嘛！吃塊蛋糕。","tip":"<b>用法：</b>勸人別太拘謹。","th":6,"lv":2},{"p":"cry one's eyes out","zh":"哭得很慘","scene":"這集有很多讓人想哭的時刻。","en":"I cried my eyes out at the end of the movie.","tr":"電影結局我哭得很慘。","tip":"<b>用法：</b>大哭特哭。","th":4,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 對什麼都說「隨便」，兩個爸爸很擔心。","items":[{"p":"couldn't care less","zh":"一點都不在乎","scene":"Lily 對什麼都沒興趣。","en":"I couldn't care less what he thinks.","tr":"我一點都不在乎他怎麼想。","tip":"<b>注意：</b>美國人有時會說成 could care less，意思一樣。","th":7,"lv":1},{"p":"whatever","zh":"隨便啦","scene":"Lily 的口頭禪。","en":"\"Do you want pizza or pasta?\" \"Whatever.\"","tr":"「你想吃披薩還是義大利麵？」「隨便。」","tip":"<b>語氣：</b>冷淡、不耐煩。","th":7,"lv":1}]}],"prompts":["你會考慮被挖角或跳槽嗎（用 get headhunted、jump ship、rule follower）","你拔過智齒嗎（用 wisdom teeth、loopy、cry one's eyes out）","你曾經對什麼事一點都不在乎嗎（用 couldn't care less、whatever、live a little）"],"challenges":[{"id":"c1","sit":"朋友在減肥不敢吃宵夜，你叫他放縱一下。","uses":["live a little"],"ans":"Come on, live a little!"},{"id":"c2","sit":"你拔完智齒，跟媽媽說臉腫起來了。","uses":["wisdom teeth"],"ans":"I just got my wisdom teeth out."},{"id":"c3","sit":"你說你一點都不在乎別人怎麼看你的髮型。","uses":["couldn't care less"],"ans":"I couldn't care less."},{"id":"c4","sit":"你說你看那部電影哭得很慘。","uses":["cry one's eyes out"],"ans":"I cried my eyes out."}]},"s06e24":{"title":"American Skyper","lede":"第六季最後一集，Phil 因為耳朵發炎困在西雅圖，只好用很有創意的方式「參加」Alex 的畢業典禮；Gloria 的表親讓 Jay 很頭痛；Andy 得在 Haley 和女友 Beth 之間做選擇；Jay 送了 Alex 歐洲旅行，Claire 想找更好的禮物；Mitchell 又被開除了卻不敢告訴 Cam，Cam 還以為他外遇；最後 Phil 發現 Andy 和 Haley 其實彼此相愛。","stories":[{"id":"dunphy","name":"Alex 的畢業典禮","who":"Phil · Claire · Alex","plot":"Phil 人在外地，只能透過螢幕參加女兒的畢業典禮；Claire 想送一份比 Jay 更好的禮物。","items":[{"p":"be there in spirit","zh":"心與你同在","scene":"Phil 人不能到，但心在現場。","en":"I can't make it to your wedding, but I'll be there in spirit.","tr":"我不能參加你的婚禮，但我的心與你同在。","tip":"<b>用法：</b>無法出席時的溫暖說法。","th":6,"lv":1},{"p":"ear infection","zh":"中耳炎、耳朵發炎","scene":"Phil 因為耳朵發炎不能搭飛機。","en":"My son has an ear infection, so he can't swim.","tr":"我兒子耳朵發炎，不能游泳。","tip":"<b>延伸：</b>infection 感染。","th":8,"lv":1},{"p":"commencement","zh":"畢業典禮","scene":"Alex 的畢業典禮。","en":"The commencement speech was really inspiring.","tr":"畢業典禮的演講很激勵人心。","tip":"<b>用法：</b>比 graduation 更正式。","th":3,"lv":2},{"p":"toss one's cap","zh":"拋帽子","scene":"畢業生一起拋帽慶祝。","en":"We all tossed our caps in the air.","tr":"我們一起把帽子拋向天空。","tip":"<b>文化：</b>畢業典禮的經典畫面。","th":3,"lv":2},{"p":"a tough act to follow","zh":"很難超越","scene":"Jay 的禮物很難被比下去。","en":"His speech was amazing. That's a tough act to follow.","tr":"他的演講太精彩了，很難超越。","tip":"<b>用法：</b>前一個表現太好，後面的人壓力很大。","th":9,"lv":2},{"p":"top that","zh":"超越那個","scene":"Claire 想送更好的禮物。","en":"He bought her a car? How can I top that?","tr":"他買車給她？我要怎麼超越？","tip":"<b>用法：</b>Can you top that? 你能更厲害嗎？","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 又丟了工作，不敢跟 Cam 說，Cam 還以為他另有隱情。","items":[{"p":"get fired","zh":"被開除","scene":"Mitchell 又被開除了。","en":"He got fired for being late too many times.","tr":"他因為遲到太多次被開除了。","tip":"<b>對比：</b>let someone go 是委婉的說法；get fired 比較直接。","th":3,"lv":1},{"p":"the secret's out","zh":"秘密曝光了","scene":"事情終究藏不住。","en":"The secret's out. Everyone knows about the party.","tr":"秘密曝光了，大家都知道派對的事了。","tip":"<b>用法：</b>秘密被大家知道了。","th":10,"lv":1}]},{"id":"jay","name":"Jay 家和 Andy","who":"Jay · Gloria · Andy · Haley","plot":"Gloria 的表親讓 Jay 很頭痛；Andy 夾在兩個女生之間。","items":[{"p":"distant relative","zh":"遠房親戚","scene":"Gloria 的表親來作客。","en":"A distant relative showed up at our wedding.","tr":"一個遠房親戚出現在我們的婚禮上。","tip":"<b>用法：</b>關係比較遠的親戚。","th":2,"lv":1},{"p":"love triangle","zh":"三角戀","scene":"Andy、Haley 和 Beth 的三角關係。","en":"The drama is all about a love triangle.","tr":"這部劇就是在講三角戀。","tip":"<b>用法：</b>三個人的感情糾葛。","th":1,"lv":1}]}],"prompts":["你錯過過重要的場合嗎（用 be there in spirit、commencement、toss one's cap）","你被開除過或看過別人被開除嗎（用 get fired、the secret's out、a tough act to follow）","你看過最狗血的三角戀劇（用 love triangle、distant relative、top that）"],"challenges":[{"id":"c1","sit":"你不能參加朋友的婚禮，說心與他同在。","uses":["be there in spirit"],"ans":"I'll be there in spirit."},{"id":"c2","sit":"學長的退伍致詞太精彩了，你說很難超越。","uses":["a tough act to follow"],"ans":"That's a tough act to follow."},{"id":"c3","sit":"你說連上的驚喜派對秘密曝光了。","uses":["the secret's out"],"ans":"The secret's out."},{"id":"c4","sit":"你說你過年都會遇到不認識的遠房親戚。","uses":["distant relative"],"ans":"I always meet distant relatives at New Year."}]},"s07e01":{"title":"Summer Lovin'","lede":"第七季開場，Haley 知道 Andy 對她有感覺，卻沒阻止他向女友 Beth 求婚，自己則跟 Dylan 復合；Alex 跟一個關係複雜的大學男友糾纏不清；Mitchell 被裁員後開始畫畫，Cam 很不安，急著幫他找工作；Jay 和 Gloria 帶 Joe 參觀幼兒園。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Haley · Andy · Alex","plot":"Haley 和 Andy 互有好感卻錯過時機；Alex 跟男友分分合合。","items":[{"p":"have feelings for","zh":"對某人有感情","scene":"Andy 對 Haley 有感覺。","en":"I think I have feelings for my best friend.","tr":"我覺得我對我最好的朋友有感覺。","tip":"<b>用法：</b>比 like 更深一點的喜歡。","th":1,"lv":1},{"p":"summer fling","zh":"夏日戀情","scene":"夏天的短暫戀愛。","en":"It was just a summer fling.","tr":"那只是一段夏日戀情。","tip":"<b>用法：</b>短暫、不認真的戀情。","th":1,"lv":2},{"p":"get back together","zh":"復合","scene":"Haley 和 Dylan 又在一起了。","en":"They broke up last year, but they got back together.","tr":"他們去年分手，但後來復合了。","tip":"<b>用法：</b>情侶分手後再交往。","th":1,"lv":1},{"p":"on-again, off-again","zh":"分分合合","scene":"Alex 和男友時好時壞。","en":"They have an on-again, off-again relationship.","tr":"他們的感情分分合合。","tip":"<b>用法：</b>形容不穩定的關係。","th":1,"lv":2},{"p":"can't let go","zh":"放不下","scene":"Alex 明知不好卻放不下。","en":"It's been two years, but he still can't let go.","tr":"已經兩年了，他還是放不下。","tip":"<b>用法：</b>對人、對過去放不下。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 被裁員後開始畫畫，Cam 擔心他一蹶不振。","items":[{"p":"laid off","zh":"被裁員","scene":"Mitchell 丟了工作。","en":"Fifty people got laid off last month.","tr":"上個月有五十個人被裁員。","tip":"<b>對比：</b>get fired 是因為表現被開除；laid off 是公司裁員。","th":3,"lv":1},{"p":"between jobs","zh":"待業中","scene":"Mitchell 現在沒工作。","en":"I'm between jobs right now.","tr":"我現在正在待業中。","tip":"<b>用法：</b>比 unemployed 委婉。","th":3,"lv":2},{"p":"take up","zh":"開始（新的興趣）","scene":"Mitchell 開始學畫畫。","en":"I took up running during the pandemic.","tr":"我在疫情期間開始跑步。","tip":"<b>用法：</b>take up + 新嗜好。","th":8,"lv":1},{"p":"find one's calling","zh":"找到天職","scene":"Mitchell 在想自己真正想做什麼。","en":"She found her calling as a nurse.","tr":"她找到了當護理師的天職。","tip":"<b>用法：</b>真正適合自己的工作。","th":3,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"兩人到處參觀幼兒園，想讓 Joe 贏在起跑點。","items":[{"p":"a head start","zh":"領先起步","scene":"兩人想讓 Joe 一開始就領先。","en":"Learning English early gives kids a head start.","tr":"早點學英文能讓孩子領先起步。","tip":"<b>用法：</b>比別人早開始的優勢。","th":10,"lv":2}]}],"prompts":["你有過分分合合的感情嗎（用 on-again, off-again、get back together、can't let go）","退伍後如果暫時沒工作，你會做什麼（用 between jobs、take up、find one's calling）","你覺得小孩需要贏在起跑點嗎（用 a head start、summer fling、have feelings for）"],"challenges":[{"id":"c1","sit":"你說你離職後還在找下一份工作。","uses":["between jobs"],"ans":"I'm between jobs right now."},{"id":"c2","sit":"你說你去年開始學吉他。","uses":["take up"],"ans":"I took up guitar last year."},{"id":"c3","sit":"朋友跟前女友復合了。","uses":["get back together"],"ans":"They got back together."},{"id":"c4","sit":"你說你覺得自己對同學有感覺。","uses":["have feelings for"],"ans":"I think I have feelings for her."}]},"s07e02":{"title":"The Day Alex Left for College","lede":"Alex 比預期提早去上大學，留下 Haley 給她建議；Luke 不情願地陪 Phil 去辦看屋活動，沒辦法跟朋友出去；Claire、Jay、Gloria 他們編藉口不去看 Lily 的足球賽；Mitchell 在 Cam 的幫忙下當上女兒球隊的教練。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Alex · Haley · Phil · Luke","plot":"Alex 離家上大學，Haley 當起大學生活顧問；Luke 被抓去幫爸爸工作。","items":[{"p":"leave the nest","zh":"離家獨立","scene":"Alex 要離開家了。","en":"Most kids leave the nest at eighteen in the US.","tr":"美國大部分孩子十八歲就離家獨立。","tip":"<b>對比：</b>empty nest 是父母那邊的空巢。","th":2,"lv":2},{"p":"homesick","zh":"想家","scene":"Alex 擔心自己會想家。","en":"I was so homesick during my first week in the army.","tr":"我當兵第一週超想家。","tip":"<b>用法：</b>離家在外時的心情。","th":4,"lv":1},{"p":"dorm life","zh":"宿舍生活","scene":"Haley 教 Alex 宿舍生存法則。","en":"Dorm life is fun, but there's no privacy.","tr":"宿舍生活很好玩，但沒隱私。","tip":"<b>延伸：</b>dorm 是 dormitory 的簡稱。","th":3,"lv":1},{"p":"take my advice","zh":"聽我的建議","scene":"Haley 給妹妹大學建議。","en":"Take my advice. Don't sign up for 8 a.m. classes.","tr":"聽我的，別選早上八點的課。","tip":"<b>用法：</b>給人建議時的開頭。","th":6,"lv":1},{"p":"help out","zh":"幫忙","scene":"Luke 去幫爸爸工作。","en":"Can you help out at the shop this weekend?","tr":"你這週末可以來店裡幫忙嗎？","tip":"<b>用法：</b>比 help 更口語、隨性。","th":10,"lv":1}]},{"id":"jay","name":"大人們","who":"Claire · Jay · Gloria · Manny","plot":"大家都不想去看 Lily 的比賽，紛紛編藉口。","items":[{"p":"a lame excuse","zh":"爛藉口","scene":"大人們的藉口很爛。","en":"\"My dog ate my homework\" is such a lame excuse.","tr":"「我的狗吃了我的作業」是很爛的藉口。","tip":"<b>用法：</b>lame 指爛、遜。","th":9,"lv":1},{"p":"soccer mom","zh":"足球媽媽（接送孩子的郊區媽媽）","scene":"典型的美國媽媽形象。","en":"She drives a minivan like a typical soccer mom.","tr":"她開休旅車，像典型的足球媽媽。","tip":"<b>文化：</b>忙著接送小孩參加活動的媽媽。","th":2,"lv":2}]},{"id":"mitch","name":"Mitchell 的球隊","who":"Mitchell · Cameron · Lily","plot":"Mitchell 當上女兒球隊的教練。","items":[{"p":"on the sidelines","zh":"在場邊","scene":"家長們在場邊加油。","en":"I watched the game from the sidelines.","tr":"我在場邊看比賽。","tip":"<b>用法：</b>也比喻「沒參與、旁觀」。","th":8,"lv":2},{"p":"participation trophy","zh":"參加獎","scene":"小朋友比賽人人有獎。","en":"Everyone got a participation trophy, even the losing team.","tr":"每個人都拿到參加獎，連輸的隊也有。","tip":"<b>用法：</b>有時被批評太寵小孩。","th":8,"lv":2},{"p":"everyone's a winner","zh":"人人都是贏家","scene":"兒童比賽的精神。","en":"At this age, everyone's a winner.","tr":"這個年紀，每個人都是贏家。","tip":"<b>語氣：</b>有時帶點諷刺。","th":6,"lv":1}]}],"prompts":["你第一次離家時想家嗎（用 leave the nest、homesick、dorm life）","你編過最爛的藉口（用 a lame excuse、help out、take my advice）","你小時候參加比賽拿過什麼獎（用 participation trophy、everyone's a winner、on the sidelines）"],"challenges":[{"id":"c1","sit":"你跟家人說新訓第一週很想家。","uses":["homesick"],"ans":"I was so homesick."},{"id":"c2","sit":"朋友說他遲到是因為捷運誤點，但你知道他根本睡過頭，你說爛藉口。","uses":["a lame excuse"],"ans":"That's such a lame excuse."},{"id":"c3","sit":"你給剛搬出去住的表弟建議：房租別超過薪水的三分之一。","uses":["take my advice"],"ans":"Take my advice. Don't spend more than a third of your salary on rent."},{"id":"c4","sit":"你說你這週末要去爸爸店裡幫忙。","uses":["help out"],"ans":"I'm helping out at my dad's shop."}]},"s07e03":{"title":"The Closet Case","lede":"Phil 幫 Haley 說服 Claire 讓 Dylan 暫住家裡，結果看到大家擠在一起有多不方便就後悔了；Mitchell 接下 Jay 衣櫃公司對手的顧問工作；Gloria 和 Cam 對於怎麼處理 Manny 的感情問題意見不同。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Dylan","plot":"Dylan 住進來後，家裡變得擁擠不堪。","items":[{"p":"a full house","zh":"客滿、一屋子人","scene":"家裡住滿了人。","en":"With my cousins visiting, we have a full house.","tr":"表兄弟姊妹來住，我們家客滿了。","tip":"<b>延伸：</b>美國經典影集《歡樂滿屋》。","th":2,"lv":1},{"p":"a tight squeeze","zh":"很擠","scene":"一家人擠在一起。","en":"Five of us in a small car was a tight squeeze.","tr":"我們五個人擠一台小車很擠。","tip":"<b>用法：</b>空間不夠時。","th":9,"lv":2},{"p":"personal space","zh":"個人空間","scene":"每個人都沒有自己的空間。","en":"Please give me some personal space.","tr":"請給我一點個人空間。","tip":"<b>用法：</b>身體距離或私人時間。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 的新工作","who":"Mitchell · Jay","plot":"Mitchell 替 Jay 的競爭對手工作，處境很尷尬。","items":[{"p":"conflict of interest","zh":"利益衝突","scene":"幫爸爸的對手工作，難免利益衝突。","en":"The judge stepped down because of a conflict of interest.","tr":"法官因為利益衝突而迴避。","tip":"<b>用法：</b>工作或法律上的立場衝突。","th":3,"lv":2},{"p":"work for the competition","zh":"為競爭對手工作","scene":"Mitchell 幫對手做事。","en":"My best friend works for the competition.","tr":"我最好的朋友在對手公司工作。","tip":"<b>延伸：</b>competitor 競爭者。","th":3,"lv":1},{"p":"traitor","zh":"叛徒","scene":"Jay 可能覺得兒子背叛他。","en":"You switched teams? Traitor!","tr":"你換隊了？叛徒！","tip":"<b>用法：</b>開玩笑也很常用。","th":5,"lv":1}]},{"id":"jay","name":"Manny 的感情問題","who":"Gloria · Cameron · Manny","plot":"Manny 在感情上碰到煩惱，兩個大人給了完全不同的建議。","items":[{"p":"girl trouble","zh":"感情煩惱（跟女生有關）","scene":"Manny 在跟女生相處上卡關。","en":"He's quiet today. Girl trouble?","tr":"他今天很安靜，感情問題嗎？","tip":"<b>延伸：</b>boy trouble 跟男生有關的煩惱。","th":1,"lv":1},{"p":"play the field","zh":"多方交往、不定下來","scene":"Cam 建議 Manny 多看看。","en":"He's not ready to settle down. He wants to play the field.","tr":"他還沒準備好安定，想多交往看看。","tip":"<b>用法：</b>同時跟幾個人約會。","th":1,"lv":2},{"p":"plenty of fish in the sea","zh":"天涯何處無芳草","scene":"安慰失戀的經典台詞。","en":"Don't be sad. There are plenty of fish in the sea.","tr":"別難過，天涯何處無芳草。","tip":"<b>用法：</b>安慰被拒絕或失戀的人。","th":6,"lv":2},{"p":"give it time","zh":"給它一點時間","scene":"有些事情需要時間。","en":"You'll feel better. Just give it time.","tr":"你會好起來的，給自己一點時間。","tip":"<b>用法：</b>安慰或建議耐心等待。","th":6,"lv":1}]}],"prompts":["你家住過一大群人嗎（用 a full house、a tight squeeze、personal space）","你會為競爭對手工作嗎（用 work for the competition、conflict of interest、traitor）","你怎麼安慰失戀的朋友（用 plenty of fish in the sea、give it time、play the field）"],"challenges":[{"id":"c1","sit":"你們六個人擠一台車去墾丁，你說好擠。","uses":["a tight squeeze"],"ans":"It's a tight squeeze in here."},{"id":"c2","sit":"你跟朋友說你需要一點個人空間。","uses":["personal space"],"ans":"I need some personal space."},{"id":"c3","sit":"朋友被拒絕了，你說天涯何處無芳草。","uses":["plenty of fish in the sea"],"ans":"There are plenty of fish in the sea."},{"id":"c4","sit":"排球隊的隊友跑去對手的隊伍，你開玩笑說他是叛徒。","uses":["traitor"],"ans":"Traitor!"}]},"s07e04":{"title":"She Crazy","lede":"Phil 和 Lily 一起蓋鴨子的小屋，培養感情；Claire 要向 Jay 提案衣櫃生意的新點子，緊張得要命；Manny 和 Gloria 各自有暗戀的人，卻都不敢好好跟對方說話；Cam 跟租樓上公寓的兄弟會男生們打成一片。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Lily · Claire","plot":"Phil 和 Lily 一起蓋鴨屋；Claire 準備向爸爸提案。","items":[{"p":"a labor of love","zh":"出於熱愛的工作","scene":"蓋鴨屋是 Phil 用心的作品。","en":"Restoring this old car was a labor of love.","tr":"修復這台老車完全是出於熱愛。","tip":"<b>用法：</b>不為錢、因為喜歡而做的事。","th":9,"lv":2},{"p":"get one's ducks in a row","zh":"把事情安排妥當","scene":"Claire 提案前要先準備好。","en":"Get your ducks in a row before the meeting.","tr":"開會前先把事情準備妥當。","tip":"<b>畫面：</b>把小鴨排成一排。","th":10,"lv":2},{"p":"pitch an idea","zh":"提案","scene":"Claire 要提出她的點子。","en":"I pitched an idea to my boss, and he loved it.","tr":"我向老闆提了一個點子，他很喜歡。","tip":"<b>延伸：</b>pitch 推銷、提案。","th":3,"lv":1},{"p":"brainstorm","zh":"腦力激盪","scene":"大家一起想點子。","en":"Let's brainstorm some ideas for the party.","tr":"我們來為派對腦力激盪一些點子。","tip":"<b>用法：</b>名詞和動詞都可以。","th":3,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Manny · Gloria","plot":"兩人各自有心儀的對象，一開口就結巴。","items":[{"p":"tongue-tied","zh":"說不出話、結巴","scene":"Manny 面對喜歡的人說不出話。","en":"I get tongue-tied around my crush.","tr":"我在喜歡的人面前會說不出話。","tip":"<b>畫面：</b>舌頭被綁住了。","th":4,"lv":2},{"p":"weak in the knees","zh":"腿軟、心動","scene":"Gloria 也被迷得暈頭轉向。","en":"His smile makes me weak in the knees.","tr":"他的笑容讓我腿軟。","tip":"<b>用法：</b>因為心動而緊張。","th":1,"lv":2}]},{"id":"mitch","name":"Cam 和兄弟會","who":"Cameron · Mitchell","plot":"樓上租給大學兄弟會，Cam 跟他們混得很好。","items":[{"p":"frat boys","zh":"兄弟會男生","scene":"樓上住了一群大學男生。","en":"The frat boys next door party every weekend.","tr":"隔壁的兄弟會男生每個週末都開派對。","tip":"<b>文化：</b>美國大學的男生社團。","th":3,"lv":2},{"p":"landlord","zh":"房東","scene":"Cam 和 Mitchell 當起房東。","en":"My landlord raised the rent again.","tr":"我房東又漲房租了。","tip":"<b>延伸：</b>tenant 房客。","th":8,"lv":1},{"p":"one of the guys","zh":"跟大家打成一片","scene":"Cam 被大學生當成自己人。","en":"She's one of the guys. She plays basketball with us.","tr":"她跟我們打成一片，一起打籃球。","tip":"<b>用法：</b>融入一群男生。","th":2,"lv":2},{"p":"relive one's youth","zh":"重溫青春","scene":"Cam 好像回到了大學時光。","en":"My dad bought a skateboard to relive his youth.","tr":"我爸買了滑板想重溫青春。","tip":"<b>用法：</b>做年輕時做的事。","th":8,"lv":2}]}],"prompts":["你做過最用心、出於熱愛的事（用 a labor of love、brainstorm、pitch an idea）","你在喜歡的人面前會說不出話嗎（用 tongue-tied、weak in the knees、one of the guys）","你想重溫哪一段青春（用 relive one's youth、frat boys、landlord）"],"challenges":[{"id":"c1","sit":"你說你在喜歡的女生面前會結巴。","uses":["tongue-tied"],"ans":"I get tongue-tied around her."},{"id":"c2","sit":"簡報前主管叫你先把資料都準備好。","uses":["get one's ducks in a row"],"ans":"Get your ducks in a row first."},{"id":"c3","sit":"你說社團迎新活動的點子是大家一起腦力激盪的。","uses":["brainstorm"],"ans":"We brainstormed together."},{"id":"c4","sit":"你說你房東又漲房租了。","uses":["landlord"],"ans":"My landlord raised the rent again."}]},"s07e05":{"title":"The Verdict","lede":"Gloria 很期待去當陪審員；Jay 去幫 Joe 的幼兒園老師；Phil 參加 Manny 和 Luke 班上的社區服務日；Claire 在「帶女兒上班日」帶著兩個女兒去公司；Mitchell 和 Cam 都想辦派對，各自找 Gloria 幫忙。","stories":[{"id":"jay","name":"Gloria 當陪審員","who":"Gloria · Jay","plot":"Gloria 第一次當陪審員，超級投入。","items":[{"p":"jury duty","zh":"陪審義務","scene":"Gloria 被選去當陪審員。","en":"I got called for jury duty next week.","tr":"我下週被叫去當陪審員。","tip":"<b>文化：</b>美國公民的義務。","th":3,"lv":2},{"p":"hung jury","zh":"陪審團無法達成共識","scene":"陪審團意見分歧。","en":"The trial ended in a hung jury.","tr":"審判因陪審團無法達成共識而結束。","tip":"<b>用法：</b>法律用語。","th":3,"lv":2},{"p":"beyond a reasonable doubt","zh":"無合理懷疑","scene":"定罪的標準。","en":"You have to prove it beyond a reasonable doubt.","tr":"你必須證明到無合理懷疑的程度。","tip":"<b>用法：</b>法庭的定罪標準。","th":3,"lv":2},{"p":"the verdict is in","zh":"判決出爐了","scene":"結果終於出來了。","en":"The verdict is in: the pizza is delicious!","tr":"判決出爐：這披薩很好吃！","tip":"<b>用法：</b>日常中玩笑地宣布結果。","th":7,"lv":2},{"p":"guilty as charged","zh":"我認罪","scene":"被抓包時的幽默說法。","en":"Did you eat my cookies? Guilty as charged.","tr":"你吃了我的餅乾？我認罪。","tip":"<b>用法：</b>承認做了某事的玩笑話。","th":7,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke · Manny","plot":"Phil 帶孩子們做社區服務；Claire 帶女兒們去上班。","items":[{"p":"community service","zh":"社區服務","scene":"孩子們要去做公益。","en":"Our school requires 20 hours of community service.","tr":"我們學校規定要做二十小時的社區服務。","tip":"<b>用法：</b>也指法院判的社會勞動。","th":3,"lv":1},{"p":"bring your kid to work","zh":"帶孩子上班","scene":"Claire 帶女兒們去公司參觀。","en":"Today is \"bring your kid to work\" day.","tr":"今天是帶孩子上班日。","tip":"<b>文化：</b>美國公司的活動日。","th":3,"lv":1},{"p":"a fly on the wall","zh":"隱形的旁觀者","scene":"女兒們終於看到媽媽工作的樣子。","en":"I'd love to be a fly on the wall at that meeting.","tr":"我好想偷偷旁聽那場會議。","tip":"<b>用法：</b>想偷看別人在做什麼。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Gloria","plot":"兩人都想辦派對，都找 Gloria 幫忙。","items":[{"p":"host a party","zh":"主辦派對","scene":"兩人都想當主人。","en":"We're hosting a party for my brother's birthday.","tr":"我們要幫我哥辦生日派對。","tip":"<b>延伸：</b>host 主人、主持人。","th":8,"lv":1},{"p":"too many cooks in the kitchen","zh":"人多手雜","scene":"太多人想主導反而亂。","en":"Let one person plan it. Too many cooks in the kitchen.","tr":"讓一個人規劃就好，人多手雜。","tip":"<b>全句：</b>Too many cooks spoil the broth.","th":10,"lv":2}]}],"prompts":["你想當陪審員嗎（用 jury duty、beyond a reasonable doubt、the verdict is in）","你做過社區服務或志工嗎（用 community service、a fly on the wall、bring your kid to work）","你辦活動時有遇過人多手雜嗎（用 too many cooks in the kitchen、host a party、guilty as charged）"],"challenges":[{"id":"c1","sit":"同梯問誰吃了他的泡麵，你說我認罪。","uses":["guilty as charged"],"ans":"Guilty as charged."},{"id":"c2","sit":"你說你很想偷偷聽女朋友跟她閨蜜在聊什麼。","uses":["a fly on the wall"],"ans":"I'd love to be a fly on the wall."},{"id":"c3","sit":"大家都在搶著規劃晚會，你說人多手雜。","uses":["too many cooks in the kitchen"],"ans":"Too many cooks in the kitchen."},{"id":"c4","sit":"你試吃完媽媽的新菜，宣布判決出爐。","uses":["the verdict is in"],"ans":"The verdict is in: it's not bad!"}]},"s07e06":{"title":"The More You Ignore Me","lede":"Cam 幫 Gloria 重現她家鄉的辣醬配方，準備拿去賣；Mitchell 幫 Jay 拍一支領獎用的影片；Haley 和 Dylan 在電影院撞見 Andy 和 Beth 之後分手了；Mitchell 開始計畫開自己的律師事務所。","stories":[{"id":"jay","name":"辣醬事業","who":"Gloria · Cameron · Jay · Mitchell","plot":"Gloria 想把家傳辣醬做成生意，Cam 幫忙；Mitchell 幫 Jay 準備得獎影片。","items":[{"p":"start a business","zh":"創業","scene":"Gloria 想開始做生意。","en":"I want to start a business after the army.","tr":"我退伍後想創業。","tip":"<b>延伸：</b>entrepreneur 創業家。","th":3,"lv":1},{"p":"family recipe","zh":"家傳食譜","scene":"辣醬是 Gloria 家的秘方。","en":"This dumpling recipe is a family recipe.","tr":"這個水餃食譜是家傳的。","tip":"<b>用法：</b>代代相傳的料理方式。","th":8,"lv":1},{"p":"secret ingredient","zh":"秘密配方","scene":"好吃的關鍵。","en":"My grandma never tells anyone her secret ingredient.","tr":"我奶奶從不告訴別人她的秘密配方。","tip":"<b>用法：</b>料理或成功的關鍵。","th":8,"lv":1},{"p":"acceptance speech","zh":"得獎感言","scene":"Jay 要準備得獎致詞。","en":"She cried during her acceptance speech.","tr":"她在得獎感言時哭了。","tip":"<b>用法：</b>頒獎典禮上的致詞。","th":8,"lv":1},{"p":"lifetime achievement award","zh":"終身成就獎","scene":"Jay 獲得了業界的肯定。","en":"The director received a lifetime achievement award.","tr":"那位導演獲頒終身成就獎。","tip":"<b>用法：</b>表彰一生貢獻的獎項。","th":3,"lv":2}]},{"id":"mitch","name":"Mitchell 的新計畫","who":"Mitchell · Cameron","plot":"Mitchell 想自己開律師事務所。","items":[{"p":"be one's own boss","zh":"自己當老闆","scene":"Mitchell 想自己作主。","en":"I want to be my own boss someday.","tr":"我希望有一天能自己當老闆。","tip":"<b>用法：</b>創業、自由工作。","th":3,"lv":1},{"p":"hang out one's shingle","zh":"自己開業","scene":"Mitchell 要開自己的事務所。","en":"After ten years, he hung out his shingle as a lawyer.","tr":"十年後，他自己開了律師事務所。","tip":"<b>由來：</b>shingle 是以前掛在門口的招牌。","th":3,"lv":2}]},{"id":"dunphy","name":"Haley 的感情","who":"Haley · Dylan · Andy","plot":"在電影院撞見 Andy 和 Beth，Haley 和 Dylan 的感情也走到盡頭。","items":[{"p":"call it quits","zh":"結束、分手","scene":"Haley 和 Dylan 決定分手。","en":"After five years, they decided to call it quits.","tr":"五年後，他們決定分手。","tip":"<b>用法：</b>結束關係或停止做某事。","th":10,"lv":2},{"p":"give someone the cold shoulder","zh":"冷落某人","scene":"有人在這段關係裡被冷落。","en":"She's been giving me the cold shoulder since the party.","tr":"派對之後她一直冷落我。","tip":"<b>畫面：</b>只給對方冷冷的肩膀。","th":5,"lv":2},{"p":"out of sight, out of mind","zh":"眼不見為淨、久不見就淡忘","scene":"不見面就不會想。","en":"I deleted his number. Out of sight, out of mind.","tr":"我刪了他的號碼，眼不見為淨。","tip":"<b>用法：</b>遠離就會忘記。","th":9,"lv":2}]}],"prompts":["你家有什麼家傳的料理（用 family recipe、secret ingredient、start a business）","你想自己當老闆嗎（用 be one's own boss、hang out one's shingle、lifetime achievement award）","你被冷落過嗎（用 give someone the cold shoulder、call it quits、out of sight, out of mind）"],"challenges":[{"id":"c1","sit":"你說你家的滷肉有秘密配方。","uses":["secret ingredient"],"ans":"It has a secret ingredient."},{"id":"c2","sit":"你說你以後想自己當老闆。","uses":["be one's own boss"],"ans":"I want to be my own boss."},{"id":"c3","sit":"你和朋友吵架後，他一直冷落你。","uses":["give someone the cold shoulder"],"ans":"He's been giving me the cold shoulder."},{"id":"c4","sit":"你把前女友的照片刪了，說眼不見為淨。","uses":["out of sight, out of mind"],"ans":"Out of sight, out of mind."}]},"s07e07":{"title":"Phil's Sexy, Sexy House","lede":"Phil 幫 Mitchell 和 Cam 的朋友賣一棟超時尚的房子，結果好幾個家人在同一天同一時間偷偷溜進去，場面大亂；Jay 和 Gloria 的家庭驚喜計畫也泡湯了；Haley 和 Andy 終於忍不住親了下去。","stories":[{"id":"dunphy","name":"Phil 的物件","who":"Phil · 全家","plot":"一棟超酷的房子，結果家人一個個偷溜進來。","items":[{"p":"dream house","zh":"夢想中的房子","scene":"每個人都愛上這間房子。","en":"We finally found our dream house.","tr":"我們終於找到夢想中的房子了。","tip":"<b>用法：</b>理想的家。","th":8,"lv":1},{"p":"state-of-the-art","zh":"最先進的","scene":"房子裡的設備超先進。","en":"The hospital has state-of-the-art equipment.","tr":"那間醫院有最先進的設備。","tip":"<b>用法：</b>形容科技、設備很新。","th":9,"lv":2},{"p":"smart home","zh":"智慧家庭","scene":"房子什麼都能用手機控制。","en":"In a smart home, you can turn on the lights with your phone.","tr":"在智慧家庭裡，你可以用手機開燈。","tip":"<b>延伸：</b>smart TV、smart watch。","th":8,"lv":1},{"p":"a hot listing","zh":"熱門物件","scene":"這間房子很搶手。","en":"That apartment is a hot listing. It'll sell fast.","tr":"那間公寓是熱門物件，很快就會賣掉。","tip":"<b>用法：</b>房地產用語。","th":3,"lv":2},{"p":"open floor plan","zh":"開放式格局","scene":"房子的設計很開闊。","en":"I love the open floor plan. It feels so spacious.","tr":"我很喜歡開放式格局，感覺好寬敞。","tip":"<b>用法：</b>客廳、廚房相連沒有隔間。","th":8,"lv":2},{"p":"sneak in","zh":"偷溜進去","scene":"大家都偷偷跑進房子裡。","en":"We sneaked in through the back door.","tr":"我們從後門偷溜進去。","tip":"<b>對比：</b>sneak out 是偷溜出去。","th":10,"lv":1},{"p":"hide-and-seek","zh":"捉迷藏","scene":"大家在房子裡躲來躲去。","en":"The kids are playing hide-and-seek.","tr":"孩子們在玩捉迷藏。","tip":"<b>用法：</b>遊戲名稱。","th":2,"lv":1},{"p":"wrong place at the wrong time","zh":"在錯的時間出現在錯的地方","scene":"有人剛好撞見不該看的。","en":"I didn't do anything. I was just in the wrong place at the wrong time.","tr":"我什麼都沒做，只是剛好在錯的時間出現在錯的地方。","tip":"<b>用法：</b>倒楣被牽連時。","th":9,"lv":1}]},{"id":"jay","name":"Jay 家和 Haley","who":"Jay · Gloria · Haley · Andy","plot":"兩人的驚喜泡湯；Haley 和 Andy 終於越過了那條線。","items":[{"p":"caught off guard","zh":"措手不及","scene":"驚喜反而讓自己措手不及。","en":"His question caught me off guard.","tr":"他的問題讓我措手不及。","tip":"<b>用法：</b>沒預料到而反應不過來。","th":4,"lv":2},{"p":"steal a kiss","zh":"偷親一下","scene":"Haley 和 Andy 終於親了。","en":"He stole a kiss before she got on the train.","tr":"她上火車前他偷親了她一下。","tip":"<b>用法：</b>浪漫的小動作。","th":1,"lv":2}]}],"prompts":["你的夢想之家長什麼樣子（用 dream house、open floor plan、smart home）","你曾經偷溜進某個地方嗎（用 sneak in、hide-and-seek、wrong place at the wrong time）","你被問過讓你措手不及的問題嗎（用 caught off guard、steal a kiss、a hot listing）"],"challenges":[{"id":"c1","sit":"面試官突然問你很難的問題，你說你措手不及。","uses":["caught off guard"],"ans":"He caught me off guard."},{"id":"c2","sit":"你說你想要開放式格局的房子。","uses":["open floor plan"],"ans":"I want an open floor plan."},{"id":"c3","sit":"你被叫去問話，說你只是剛好在那裡。","uses":["wrong place at the wrong time"],"ans":"I was just in the wrong place at the wrong time."},{"id":"c4","sit":"你們小時候在阿嬤家玩捉迷藏。","uses":["hide-and-seek"],"ans":"We used to play hide-and-seek at Grandma's."}]},"s07e08":{"title":"Clean Out Your Junk Drawer","lede":"Gloria 抽中一場自我成長大師的講座，Jay、Claire 和 Mitchell 不情願地跟著 Gloria、Phil 和 Cam 一起去清理「情緒包袱」，三對夫妻還把它變成比賽；Haley 則向 Alex 坦白她和 Andy 之間發生的事。","stories":[{"id":"jay","name":"自我成長講座","who":"Gloria · Jay · Claire · Phil · Mitchell · Cameron","plot":"三對夫妻參加講座，被要求敞開心房。","items":[{"p":"self-help book","zh":"自我成長書","scene":"講師是一位暢銷作家。","en":"My mom reads a lot of self-help books.","tr":"我媽讀很多自我成長書。","tip":"<b>用法：</b>教人改善生活的書。","th":8,"lv":1},{"p":"junk drawer","zh":"雜物抽屜","scene":"每個人心裡都有個雜物抽屜。","en":"I found my old phone in the junk drawer.","tr":"我在雜物抽屜裡找到我的舊手機。","tip":"<b>文化：<
