的好方法。","th":10,"lv":2},{"p":"security blanket","zh":"讓人有安全感的東西","scene":"兔子娃娃是 Lily 的安全感來源。","en":"My phone is my security blanket.","tr":"我的手機是我的安全感來源。","tip":"<b>由來：</b>小孩離不開的小毯子。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"三人要去 Jay 的高中同學會，路上狀況不斷。","items":[{"p":"class reunion","zh":"同學會","scene":"Jay 要參加高中同學會。","en":"Our ten-year class reunion is next month.","tr":"我們十週年同學會在下個月。","tip":"<b>延伸：</b>reunion 重聚。","th":8,"lv":1},{"p":"fashionably late","zh":"故意晚點到（比較有型）","scene":"遲到的 Jay 只好說自己是故意的。","en":"Don't worry. We're just fashionably late.","tr":"別擔心，我們只是晚到比較有型。","tip":"<b>語氣：</b>遲到時的自我解嘲。","th":8,"lv":2},{"p":"car trouble","zh":"車子出問題","scene":"開車去同學會的路上不太順。","en":"Sorry I'm late. I had car trouble.","tr":"抱歉我遲到了，車子出了點問題。","tip":"<b>用法：</b>遲到的經典理由。","th":8,"lv":1}]}],"prompts":["你被人說服做過什麼事（用 talk someone into、midlife crisis、take it for a spin）","你弄丟過重要的東西嗎（用 lost and found、retrace one's steps、security blanket）","你參加過同學會嗎（用 class reunion、fashionably late、ride shotgun）"],"challenges":[{"id":"c1","sit":"朋友說服你一起報名馬拉松。","uses":["talk someone into"],"ans":"He talked me into signing up."},{"id":"c2","sit":"上車前你大喊要坐副駕。","uses":["ride shotgun"],"ans":"I call shotgun!"},{"id":"c3","sit":"你錢包不見，決定沿原路找回去。","uses":["retrace one's steps"],"ans":"I'm going to retrace my steps."},{"id":"c4","sit":"你參加聚會遲到二十分鐘，笑說是有型的遲到。","uses":["fashionably late"],"ans":"I'm just fashionably late."}]},"s03e22":{"title":"Disneyland","lede":"全家到迪士尼樂園，Phil 被精力旺盛的 Luke 拖到快累垮；Claire 想撮合 Haley 跟朋友的姪子 Ethan，結果竟然遇到 Dylan；Mitchell 和 Cam 則想改掉 Lily 一直亂跑的新習慣。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Claire · Haley · Dylan","plot":"Phil 陪 Luke 玩到體力透支；Claire 想幫 Haley 牽線，前男友 Dylan 卻突然冒出來。","items":[{"p":"the happiest place on earth","zh":"世界上最快樂的地方","scene":"迪士尼的經典口號。","en":"Welcome to the happiest place on earth!","tr":"歡迎來到世界上最快樂的地方！","tip":"<b>用法：</b>常被拿來調侃排隊排很久的樂園。","th":8,"lv":2},{"p":"fast pass","zh":"快速通關","scene":"不想排隊就要有快速通關。","en":"We got fast passes so we skipped the long line.","tr":"我們有快速通關，跳過了長長的隊伍。","tip":"<b>延伸：</b>日常也比喻「特權通道」。","th":8,"lv":2},{"p":"run out of steam","zh":"沒力了、體力耗盡","scene":"Phil 玩到一半就沒力了。","en":"I ran out of steam after the third ride.","tr":"玩到第三個設施我就沒力了。","tip":"<b>畫面：</b>蒸汽火車沒蒸汽就跑不動。","th":8,"lv":2},{"p":"worn out","zh":"累垮了","scene":"一整天下來大家都累壞了。","en":"The kids were worn out after the trip.","tr":"旅行結束孩子們都累垮了。","tip":"<b>延伸：</b>worn-out shoes 穿到很舊的鞋。","th":8,"lv":1},{"p":"set someone up","zh":"撮合某人","scene":"Claire 想幫 Haley 牽紅線。","en":"My friend set me up with her cousin.","tr":"我朋友幫我跟她表哥牽線。","tip":"<b>延伸：</b>set up 也有「陷害」的意思，要看上下文。","th":1,"lv":1},{"p":"blind date","zh":"相親、盲約","scene":"這次見面算是一場盲約。","en":"I went on a blind date last weekend.","tr":"我上週末去了一場盲約。","tip":"<b>用法：</b>go on a blind date。","th":1,"lv":1},{"p":"sparks fly","zh":"擦出火花","scene":"Claire 希望兩人能擦出火花。","en":"When they met, sparks flew.","tr":"他們一見面就擦出了火花。","tip":"<b>用法：</b>可以是愛情的火花，也可以是吵架的火花。","th":1,"lv":2},{"p":"speak of the devil","zh":"說曹操曹操就到","scene":"剛提到 Dylan，他就出現了。","en":"Speak of the devil! We were just talking about you.","tr":"說曹操曹操就到！我們剛剛還在聊你。","tip":"<b>用法：</b>正在聊某人時那人出現了。","th":7,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 一有機會就亂跑，兩個爸爸追到快崩潰。","items":[{"p":"run off","zh":"跑掉","scene":"Lily 一不注意就跑走了。","en":"My dog ran off when I opened the door.","tr":"我一開門我的狗就跑了。","tip":"<b>延伸：</b>run off with 帶著某物跑掉。","th":10,"lv":1},{"p":"rein in","zh":"控制、約束","scene":"兩人想辦法管住 Lily。","en":"We need to rein in our spending this month.","tr":"這個月我們得控制一下開銷。","tip":"<b>畫面：</b>拉緊馬的韁繩。","th":10,"lv":2}]}],"prompts":["你去遊樂園的經驗（用 the happiest place on earth、fast pass、run out of steam）","你被人撮合過嗎（用 set someone up、blind date、sparks fly）","你最近需要控制什麼（用 rein in、worn out、speak of the devil）"],"challenges":[{"id":"c1","sit":"爬玉山爬到一半你跟朋友說你沒力了。","uses":["run out of steam"],"ans":"I'm running out of steam."},{"id":"c2","sit":"朋友說要幫你介紹女生，你問是不是要幫你牽線。","uses":["set someone up"],"ans":"Are you trying to set me up?"},{"id":"c3","sit":"你們剛在聊班長，他就走進來了。","uses":["speak of the devil"],"ans":"Speak of the devil."},{"id":"c4","sit":"你跟媽媽說這個月要控制一下花費。","uses":["rein in"],"ans":"I need to rein in my spending."}]},"s03e23":{"title":"Tableau Vivant","lede":"Jay 和 Gloria 在餐廳點餐時吵個不停；Claire 和 Cam 對管教小孩意見不同；Luke 用不正當的方式領了一個獎；Phil 得開除在他那裡打工的 Mitchell，卻開不了口；最後全家一起參加 Alex 的活人畫，重現 Norman Rockwell 的感恩節名畫。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"兩人在餐廳點餐時一直拌嘴。","items":[{"p":"bicker","zh":"拌嘴、為小事爭吵","scene":"點個餐也能吵起來。","en":"My parents bicker about everything.","tr":"我爸媽什麼小事都能拌嘴。","tip":"<b>對比：</b>argue 比較嚴肅；bicker 是小事吵不停。","th":5,"lv":2},{"p":"make up one's mind","zh":"下定決心、做決定","scene":"Gloria 一直決定不了要吃什麼。","en":"Make up your mind! We've been here for twenty minutes.","tr":"快決定！我們已經在這裡二十分鐘了。","tip":"<b>用法：</b>I can't make up my mind. 我決定不了。","th":10,"lv":1},{"p":"on the side","zh":"另外放、附在旁邊","scene":"點餐時要求醬料另外放。","en":"Can I get the dressing on the side?","tr":"沙拉醬可以另外放嗎？","tip":"<b>用法：</b>點餐必學。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Cameron · Luke · Phil · Mitchell","plot":"Claire 和 Cam 管小孩的方法不同；Luke 拿了一個不該拿的獎；Phil 得開除 Mitchell。","items":[{"p":"time-out","zh":"暫停、罰小孩靜坐","scene":"Claire 和 Cam 對要不要罰暫停意見不同。","en":"If you hit your sister again, you're getting a time-out.","tr":"你再打妹妹，就去罰坐。","tip":"<b>延伸：</b>運動比賽的 timeout 是暫停。","th":2,"lv":1},{"p":"under false pretenses","zh":"用不實的理由","scene":"Luke 拿獎的理由根本不對。","en":"He got the job under false pretenses.","tr":"他是用不實的理由得到這份工作的。","tip":"<b>用法：</b>騙取某樣東西時用。","th":10,"lv":2},{"p":"guilty conscience","zh":"良心不安","scene":"Luke 拿了獎心裡卻不舒服。","en":"I couldn't sleep because of my guilty conscience.","tr":"我良心不安睡不著。","tip":"<b>反義：</b>clear conscience 問心無愧。","th":4,"lv":2},{"p":"let someone go","zh":"開除、讓某人離開","scene":"Phil 得開口請 Mitchell 走人。","en":"The company had to let fifty people go.","tr":"公司不得不裁掉五十個人。","tip":"<b>語氣：</b>比 fire 委婉。","th":3,"lv":1},{"p":"it's not you, it's me","zh":"不是你的問題，是我的問題","scene":"Phil 想用最委婉的方式開口。","en":"It's not you, it's me. I just need some time.","tr":"不是你的問題，是我的問題，我需要一點時間。","tip":"<b>用法：</b>分手經典台詞，常被拿來開玩笑。","th":1,"lv":1}]},{"id":"mitch","name":"活人畫","who":"全家 · Alex","plot":"全家要一動不動地重現一幅名畫。","items":[{"p":"hold still","zh":"別動","scene":"擺好姿勢後誰都不能動。","en":"Hold still. I'm taking the picture.","tr":"別動，我要拍了。","tip":"<b>用法：</b>拍照、剪頭髮、打針時常聽到。","th":7,"lv":1},{"p":"strike a pose","zh":"擺姿勢","scene":"每個人都要擺出畫中的姿勢。","en":"Strike a pose for the camera!","tr":"對著鏡頭擺個姿勢！","tip":"<b>延伸：</b>瑪丹娜歌曲 Vogue 的經典歌詞。","th":8,"lv":1}]}],"prompts":["你跟誰最常拌嘴（用 bicker、make up one's mind、on the side）","你曾經良心不安嗎（用 guilty conscience、under false pretenses、time-out）","你最難開口的一件事（用 let someone go、it's not you, it's me、hold still）"],"challenges":[{"id":"c1","sit":"女朋友一直決定不了要吃什麼，你叫她快決定。","uses":["make up one's mind"],"ans":"Make up your mind, babe."},{"id":"c2","sit":"點滷肉飯時你要求醬汁另外放。","uses":["on the side"],"ans":"Can I get the sauce on the side?"},{"id":"c3","sit":"剪頭髮時理髮師叫你別動。","uses":["hold still"],"ans":"Hold still, please."},{"id":"c4","sit":"畢業典禮拍團體照時朋友叫大家擺姿勢。","uses":["strike a pose"],"ans":"Everybody strike a pose!"}]},"s03e24":{"title":"Baby on Board","lede":"第三季最後一集，Gloria 陪 Mitchell 和 Cam 去爭取一個領養機會；Jay 和 Manny 在家顧 Lily；Alex 第一次參加畢業舞會；Haley 宣布她對未來的計畫；最後 Gloria 宣布了一個超大的驚喜。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Gloria","plot":"一位生母要生了，兩人帶著 Gloria 趕過去，緊張等待結果。","items":[{"p":"go into labor","zh":"開始陣痛、要生了","scene":"生母開始陣痛了。","en":"My sister went into labor at two in the morning.","tr":"我姊凌晨兩點開始陣痛。","tip":"<b>延伸：</b>labor 是分娩。","th":8,"lv":1},{"p":"the moment of truth","zh":"關鍵時刻、揭曉的時刻","scene":"到底能不能領養，就看這一刻。","en":"Here are the test results. It's the moment of truth.","tr":"考試成績出來了，揭曉的時刻到了。","tip":"<b>用法：</b>結果即將揭曉時。","th":10,"lv":2}]},{"id":"jay","name":"Jay 和 Manny","who":"Jay · Manny · Lily · Gloria","plot":"兩人負責在家顧 Lily；最後 Gloria 宣布自己懷孕了。","items":[{"p":"hold down the fort","zh":"看家、留守","scene":"Jay 和 Manny 負責看家。","en":"You go ahead. I'll hold down the fort.","tr":"你先去，我留守。","tip":"<b>用法：</b>別人出門時你負責顧著。","th":10,"lv":2},{"p":"big news","zh":"大消息","scene":"Gloria 有一個大消息要宣布。","en":"I have big news. I got the job!","tr":"我有大消息，我錄取了！","tip":"<b>用法：</b>Guess what? I have big news.","th":7,"lv":1},{"p":"expecting","zh":"懷孕了","scene":"Gloria 宣布她懷孕了。","en":"My cousin is expecting her second child.","tr":"我表姊懷了第二胎。","tip":"<b>用法：</b>We're expecting. 我們有寶寶了。","th":2,"lv":1},{"p":"bun in the oven","zh":"懷孕了（俏皮說法）","scene":"家裡要多一個新成員。","en":"I heard she has a bun in the oven.","tr":"我聽說她懷孕了。","tip":"<b>畫面：</b>烤箱裡有個麵包正在烤。","th":2,"lv":2},{"p":"speechless","zh":"說不出話來","scene":"消息一出，大家都愣住了。","en":"I was speechless when I saw the surprise.","tr":"我看到驚喜時說不出話來。","tip":"<b>用法：</b>太驚訝、太感動時用。","th":4,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Alex · Haley · Claire · Phil","plot":"Alex 第一次參加舞會；Haley 說出自己對未來的打算。","items":[{"p":"prom date","zh":"舞會舞伴","scene":"Alex 要跟舞伴去畢業舞會。","en":"Who's your prom date?","tr":"你的舞會舞伴是誰？","tip":"<b>文化：</b>美國高中畢業舞會 prom 是大事。","th":1,"lv":1},{"p":"wallflower","zh":"害羞不敢參與的人、壁花","scene":"Alex 不想在舞會上當壁花。","en":"I was a wallflower at parties in high school.","tr":"我高中參加派對都是壁花。","tip":"<b>畫面：</b>像牆上的花一樣站在旁邊。","th":9,"lv":2},{"p":"get into college","zh":"考上大學","scene":"Haley 宣布她的升學結果和計畫。","en":"She got into her dream college!","tr":"她考上了夢想中的大學！","tip":"<b>用法：</b>get into + 學校。","th":3,"lv":1}]}],"prompts":["你最驚訝的一個大消息（用 big news、speechless、the moment of truth）","你參加舞會或聚會時是焦點還是壁花（用 wallflower、prom date、hold down the fort）","你考上學校或通過考試的經驗（用 get into college、the moment of truth、expecting）"],"challenges":[{"id":"c1","sit":"家人週末去花蓮玩，你說你留下來顧家。","uses":["hold down the fort"],"ans":"You guys go. I'll hold down the fort."},{"id":"c2","sit":"你跟家人說你有一個大消息：你考上研究所了。","uses":["big news","get into college"],"ans":"I have big news. I got into grad school!"},{"id":"c3","sit":"女朋友幫你準備生日驚喜影片，你感動到說不出話。","uses":["speechless"],"ans":"I'm speechless."},{"id":"c4","sit":"成績要公布了，你說揭曉的時刻到了。","uses":["the moment of truth"],"ans":"This is the moment of truth."}]},"s04e01":{"title":"Bringing Up Baby","lede":"第四季開場，Jay 滿 65 歲，Phil 把他「綁架」去體驗一個很特別的生日活動；Mitchell 和 Cam 的領養計畫卡關，心情很低落；Gloria 則煩惱該怎麼告訴大家她懷孕了。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Phil · Gloria","plot":"Phil 給 Jay 準備了一個很另類的生日驚喜；Gloria 一直找不到時機宣布懷孕。","items":[{"p":"golden years","zh":"晚年、黃金歲月","scene":"Jay 正式邁入人生的晚年。","en":"My grandparents are enjoying their golden years in Hualien.","tr":"我爺爺奶奶在花蓮享受退休生活。","tip":"<b>用法：</b>委婉地說老年、退休後的生活。","th":9,"lv":2},{"p":"be a good sport","zh":"有雅量、玩得起","scene":"Jay 再不情願也只好配合。","en":"Be a good sport and try it once.","tr":"有點雅量，試一次嘛。","tip":"<b>反義：</b>sore loser 輸不起的人。","th":6,"lv":2},{"p":"think outside the box","zh":"跳脫框架思考","scene":"Phil 的生日禮物很另類。","en":"We need to think outside the box to solve this.","tr":"我們得跳脫框架來解決這個問題。","tip":"<b>用法：</b>職場、創意發想超常用。","th":10,"lv":1},{"p":"wait for the right time","zh":"等待適當時機","scene":"Gloria 想等對的時機再說。","en":"I'm waiting for the right time to tell my parents.","tr":"我在等適當的時機告訴爸媽。","tip":"<b>用法：</b>大消息、壞消息都適用。","th":10,"lv":1},{"p":"find the words","zh":"找到適當的話","scene":"Gloria 不知道該怎麼開口。","en":"I can't find the words to thank you.","tr":"我找不到話來感謝你。","tip":"<b>用法：</b>I don't know how to put it into words. 也很常用。","th":6,"lv":1},{"p":"spill the beans","zh":"洩漏秘密","scene":"消息還是被說出來了。","en":"Who spilled the beans about the party?","tr":"是誰把派對的事說出去的？","tip":"<b>對比：</b>let it slip 是不小心說溜；spill the beans 是把秘密說出去。","th":10,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"領養一再碰壁，兩人很灰心。","items":[{"p":"hit a wall","zh":"碰壁、卡關","scene":"領養的事情一直沒進展。","en":"I hit a wall with my thesis last month.","tr":"我上個月論文卡關了。","tip":"<b>用法：</b>做事情遇到瓶頸。","th":10,"lv":2},{"p":"back to square one","zh":"回到原點","scene":"努力了很久，又要從頭開始。","en":"The deal fell through. We're back to square one.","tr":"交易破局了，我們回到原點。","tip":"<b>畫面：</b>遊戲回到第一格。","th":10,"lv":2},{"p":"lose hope","zh":"失去希望","scene":"兩人開始有點灰心。","en":"Don't lose hope. Something will come up.","tr":"別失去希望，總會有轉機的。","tip":"<b>用法：</b>常用否定句來鼓勵人。","th":4,"lv":1},{"p":"surprise, surprise","zh":"果然不意外（反諷）","scene":"事情的發展有時真的不意外。","en":"He's late again. Surprise, surprise.","tr":"他又遲到了，一點都不意外。","tip":"<b>語氣：</b>反諷，表示早就料到。","th":7,"lv":2}]}],"prompts":["你送過或收過最特別的生日禮物（用 think outside the box、be a good sport、golden years）","你曾經做事卡關的經驗（用 hit a wall、back to square one、lose hope）","你等時機說出口的一件事（用 wait for the right time、find the words、spill the beans）"],"challenges":[{"id":"c1","sit":"你準備了好久的報名資料被退件，只能從頭來過。","uses":["back to square one"],"ans":"We're back to square one."},{"id":"c2","sit":"你跟朋友說你在等適當的時機跟爸媽說要出國。","uses":["wait for the right time"],"ans":"I'm waiting for the right time."},{"id":"c3","sit":"室友又睡過頭錯過早八的課，你說一點都不意外。","uses":["surprise, surprise"],"ans":"He overslept and missed his 8 a.m. class again. Surprise, surprise."},{"id":"c4","sit":"你問是誰把大家要幫同事辦歡送會的事說出去的。","uses":["spill the beans"],"ans":"Who spilled the beans about the farewell party?"}]},"s04e02":{"title":"Schooled","lede":"Phil 和 Claire 送 Haley 去上大學，卻讓她在新同學面前超丟臉；Manny 幫 Jay 和 Gloria 報名了育嬰課；Lily 上幼稚園第一天就跟同學打架，Mitchell 和 Cam 跟對方家長起衝突，校長還要求兩家小孩約玩。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley","plot":"送 Haley 去宿舍的那天，爸媽捨不得又太熱情，讓她很想挖洞躲起來。","items":[{"p":"move-in day","zh":"搬進宿舍的那天","scene":"大學開學的搬宿舍日。","en":"Move-in day was chaos. Everyone's parents were there.","tr":"搬宿舍那天一團亂，大家的爸媽都在。","tip":"<b>文化：</b>美國大學開學前的大日子。","th":3,"lv":1},{"p":"cramp someone's style","zh":"礙手礙腳、讓人放不開","scene":"爸媽在旁邊讓 Haley 很不自在。","en":"Mom, you're cramping my style.","tr":"媽，你讓我很放不開。","tip":"<b>用法：</b>青少年對爸媽的經典抱怨。","th":2,"lv":2},{"p":"cut the cord","zh":"剪斷臍帶、放手讓孩子獨立","scene":"爸媽得學著放手。","en":"It's time to cut the cord and let her live on her own.","tr":"該放手讓她自己生活了。","tip":"<b>延伸：</b>cord 是臍帶。","th":2,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Manny 幫要再當爸媽的兩人報了育嬰課，Jay 覺得自己早就會了。","items":[{"p":"a refresher course","zh":"複習課程","scene":"Jay 很久沒照顧嬰兒了。","en":"I took a refresher course before driving again.","tr":"我重新開車前上了一堂複習課。","tip":"<b>用法：</b>很久沒做的事重新學一次。","th":3,"lv":1},{"p":"rusty","zh":"生疏了","scene":"Jay 照顧寶寶的技能早就生疏了。","en":"My English is a little rusty.","tr":"我的英文有點生疏了。","tip":"<b>畫面：</b>生鏽的工具不好用。","th":9,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 上學第一天就跟同學打架，兩個爸爸跟對方家長吵起來，校長要兩家小孩一起玩。","items":[{"p":"first-day jitters","zh":"第一天的緊張","scene":"上學第一天大家都很緊張。","en":"It's normal to have first-day jitters at a new job.","tr":"新工作第一天緊張是正常的。","tip":"<b>延伸：</b>jitters 緊張不安。","th":4,"lv":2},{"p":"get off on the wrong foot","zh":"一開始就不順、第一印象不好","scene":"兩家人一見面就不愉快。","en":"We got off on the wrong foot, but now we're friends.","tr":"我們一開始處得不好，但現在是朋友了。","tip":"<b>反義：</b>get off on the right foot。","th":2,"lv":2},{"p":"be the bigger person","zh":"當比較成熟的那一方","scene":"總要有人先讓步。","en":"Just apologize. Be the bigger person.","tr":"就道歉吧，當比較成熟的那一方。","tip":"<b>用法：</b>勸人別計較、先讓步。","th":6,"lv":1},{"p":"playdate","zh":"小孩約玩","scene":"校長要兩個小孩一起玩。","en":"My niece has a playdate with her classmate on Saturday.","tr":"我姪女星期六跟同學約好一起玩。","tip":"<b>文化：</b>美國父母幫小孩安排的玩伴時間。","th":2,"lv":1},{"p":"sent to the principal's office","zh":"被叫去校長室","scene":"打架的結果就是去校長室。","en":"I got sent to the principal's office for talking in class.","tr":"我上課講話被叫去校長室。","tip":"<b>用法：</b>學生被處罰的經典場景。","th":3,"lv":1}]}],"prompts":["你第一天上學或新訓的經驗（用 first-day jitters、move-in day、get off on the wrong foot）","你的爸媽會讓你在朋友面前很不自在嗎（用 cramp someone's style、cut the cord、sent to the principal's office）","你最近生疏的一個技能（用 rusty、a refresher course、be the bigger person）"],"challenges":[{"id":"c1","sit":"你很久沒彈吉他，跟朋友說你有點生疏了。","uses":["rusty"],"ans":"I'm a little rusty."},{"id":"c2","sit":"你跟新室友一開始處得不好，後來變成好朋友。","uses":["get off on the wrong foot"],"ans":"We got off on the wrong foot, but now we're good friends."},{"id":"c3","sit":"你跟朋友在逛夜市，你媽一直打電話問你在哪，你說她讓你很不自在。","uses":["cramp someone's style"],"ans":"Mom, you're cramping my style."},{"id":"c4","sit":"朋友吵架都不肯道歉，你勸他當成熟的那一方。","uses":["be the bigger person"],"ans":"Just be the bigger person."}]},"s04e03":{"title":"Snip","lede":"Phil 考慮去做結紮手術，越想越害怕；懷孕的 Gloria 很在意自己的體重；Mitchell 則一直催 Cam 去找份兼職工作。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Phil 答應去做手術，卻一直在猶豫。","items":[{"p":"go under the knife","zh":"動手術","scene":"Phil 很怕要開刀。","en":"My dad is going under the knife next week.","tr":"我爸下週要動手術。","tip":"<b>語氣：</b>口語、帶點緊張感的說法。","th":8,"lv":2},{"p":"second-guess","zh":"事後懷疑、再三猶豫","scene":"Phil 開始懷疑自己的決定。","en":"Stop second-guessing yourself. You made the right choice.","tr":"別再懷疑自己了，你做了對的選擇。","tip":"<b>用法：</b>對自己或別人的決定沒信心。","th":10,"lv":2},{"p":"hold off on","zh":"延後、暫緩","scene":"Phil 想先緩一緩。","en":"Let's hold off on buying a car until next year.","tr":"我們明年再買車吧。","tip":"<b>用法：</b>hold off on + 事情／V-ing。","th":10,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay","plot":"懷孕讓 Gloria 胖了不少，她很在意，Jay 說什麼都不對。","items":[{"p":"eating for two","zh":"一人吃兩人補","scene":"Gloria 懷孕後食量變大。","en":"I'm not eating too much. I'm eating for two!","tr":"我沒有吃太多，我是一人吃兩人補！","tip":"<b>用法：</b>孕婦的幽默說法。","th":8,"lv":2},{"p":"glow","zh":"容光煥發","scene":"Jay 說 Gloria 懷孕後很漂亮。","en":"You have that pregnancy glow.","tr":"你有懷孕時的好氣色。","tip":"<b>用法：</b>當名詞或動詞，形容氣色很好。","th":9,"lv":1},{"p":"the elephant in the room","zh":"大家都知道卻不說的事","scene":"體重這件事誰都不敢提。","en":"Let's talk about the elephant in the room: the budget.","tr":"我們來談那件大家都避而不談的事：預算。","tip":"<b>畫面：</b>房間裡有一頭大象，大家卻假裝沒看到。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 希望 Cam 去找兼職，分擔家計。","items":[{"p":"bring home the bacon","zh":"賺錢養家","scene":"誰負責賺錢養家？","en":"My mom brings home the bacon in our family.","tr":"在我們家是我媽賺錢養家。","tip":"<b>由來：</b>以前比賽贏了可以把豬肉帶回家。","th":3,"lv":2},{"p":"job hunting","zh":"找工作","scene":"Cam 開始找工作。","en":"I'm going to start job hunting after I get out of the army.","tr":"我退伍後要開始找工作。","tip":"<b>延伸：</b>job hunt 找工作。","th":3,"lv":1},{"p":"make ends meet","zh":"收支平衡、勉強維持生活","scene":"一個人賺錢有點吃緊。","en":"Many students work two jobs to make ends meet.","tr":"很多學生打兩份工來維持生活。","tip":"<b>用法：</b>形容經濟有點吃緊。","th":3,"lv":2},{"p":"pull one's weight","zh":"盡自己的本分","scene":"Mitchell 希望 Cam 也出一份力。","en":"Everyone on the team needs to pull their weight.","tr":"團隊裡每個人都要盡自己的本分。","tip":"<b>畫面：</b>划船時每個人都要出力。","th":3,"lv":2}]}],"prompts":["你做重大決定後會再三猶豫嗎（用 second-guess、hold off on、go under the knife）","退伍後你打算怎麼找工作（用 job hunting、bring home the bacon、make ends meet）","你身邊有大家都不敢提的事嗎（用 the elephant in the room、pull one's weight、glow）"],"challenges":[{"id":"c1","sit":"你跟家人說畢業後要開始找工作。","uses":["job hunting"],"ans":"I'll start job hunting after I graduate."},{"id":"c2","sit":"打掃時有人一直偷懶，你說大家都要盡本分。","uses":["pull one's weight"],"ans":"Everyone needs to pull their weight."},{"id":"c3","sit":"你想買新手機，但決定先緩一緩。","uses":["hold off on"],"ans":"I'm going to hold off on buying it."},{"id":"c4","sit":"你選了一間學校之後一直懷疑自己，朋友叫你別再猶豫了。","uses":["second-guess"],"ans":"Stop second-guessing yourself."}]},"s04e04":{"title":"The Butler's Escape","lede":"Luke 想放棄魔術，Phil 完全無法接受；Gloria 懷孕後打呼超大聲，Jay、Manny 和 Stella 都睡不著；Cam 開始當音樂老師，換他忙工作；Haley 去上大學後，Alex 第一次當起家裡的大姊。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Alex","plot":"Luke 對魔術沒興趣了，Phil 很難過；Alex 則要學著當大姊。","items":[{"p":"lose interest","zh":"失去興趣","scene":"Luke 對魔術沒那麼熱衷了。","en":"I lost interest in the show after season two.","tr":"那部劇第二季之後我就沒興趣了。","tip":"<b>用法：</b>lose interest in + 事物。","th":4,"lv":1},{"p":"grow out of","zh":"長大後不再（做某事）","scene":"Luke 長大了，不玩魔術了。","en":"She grew out of her shyness.","tr":"她長大後就不再那麼害羞了。","tip":"<b>延伸：</b>也可以指衣服穿不下了。","th":2,"lv":1},{"p":"pass the torch","zh":"傳承、交棒","scene":"Phil 本來希望 Luke 接下魔術的棒子。","en":"The old coach passed the torch to his assistant.","tr":"老教練把棒子交給了他的助理。","tip":"<b>畫面：</b>奧運傳遞聖火。","th":3,"lv":2},{"p":"step up","zh":"挺身而出、承擔責任","scene":"Alex 必須扛起大姊的責任。","en":"When my dad got sick, my brother stepped up.","tr":"我爸生病時，我哥挺身而出。","tip":"<b>用法：</b>在需要時主動負責。","th":10,"lv":1},{"p":"fill someone's shoes","zh":"接替某人的位置","scene":"Alex 要接替 Haley 的位置。","en":"Nobody can fill her shoes.","tr":"沒有人能取代她的位置。","tip":"<b>畫面：</b>穿上前人的鞋子。","th":3,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Gloria 每晚打呼像打雷，全家沒人睡得好。","items":[{"p":"light sleeper","zh":"淺眠的人","scene":"Jay 一點聲音就醒。","en":"I'm a light sleeper, so I wear earplugs in the barracks.","tr":"我很淺眠，所以在寢室都戴耳塞。","tip":"<b>反義：</b>heavy sleeper 睡很熟的人。","th":8,"lv":1},{"p":"keep someone up","zh":"讓某人睡不著","scene":"打呼聲讓大家整夜沒睡。","en":"The noise kept me up all night.","tr":"那個噪音讓我整夜睡不著。","tip":"<b>用法：</b>keep someone up at night 讓人煩惱到睡不著。","th":8,"lv":1},{"p":"saw logs","zh":"打呼","scene":"Gloria 睡覺時呼聲震天。","en":"Listen to Dad. He's sawing logs on the couch.","tr":"你聽，爸在沙發上打呼。","tip":"<b>畫面：</b>鋸木頭的聲音像打呼。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 當上音樂老師，換 Mitchell 在家等他回來。","items":[{"p":"the new normal","zh":"新常態","scene":"兩人得適應新的生活方式。","en":"Working from home is the new normal.","tr":"在家工作已經是新常態。","tip":"<b>用法：</b>生活模式改變後常說。","th":9,"lv":1},{"p":"bring work home","zh":"把工作帶回家","scene":"Cam 下班回家還在想學校的事。","en":"Try not to bring work home.","tr":"盡量不要把工作帶回家。","tip":"<b>用法：</b>抱怨工作和生活分不開。","th":3,"lv":1}]}],"prompts":["你小時候很喜歡、後來沒興趣的東西（用 lose interest、grow out of、pass the torch）","你睡覺很淺眠嗎（用 light sleeper、keep someone up、saw logs）","你曾經需要挺身而出的時候（用 step up、fill someone's shoes、the new normal）"],"challenges":[{"id":"c1","sit":"你跟同梯說你很淺眠，寢室的打呼聲讓你整晚睡不著。","uses":["light sleeper","keep someone up"],"ans":"I'm a light sleeper. The snoring kept me up all night."},{"id":"c2","sit":"公司最資深的工程師離職了，你跟同事說沒人能取代他。","uses":["fill someone's shoes"],"ans":"Nobody can fill his shoes."},{"id":"c3","sit":"排球隊隊長受傷，你主動扛起帶隊的責任。","uses":["step up"],"ans":"Our captain got hurt, so I had to step up."},{"id":"c4","sit":"你跟朋友說你國中很愛打籃球，後來沒興趣了。","uses":["lose interest"],"ans":"I lost interest in high school."}]},"s04e05":{"title":"Open House of Horrors","lede":"萬聖節，Claire 想把活動弄得適合小朋友；Phil 偏偏選在同一晚辦房屋開放參觀；Mitchell 和 Cam 開變裝派對；懷孕的 Gloria 荷爾蒙作祟，脾氣一點就爆；Manny 意外受傷後，被受歡迎的同學圈邀請，開始懷疑自己的選擇。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 想讓萬聖節別太嚇人；Phil 要在鬼節當晚辦看屋活動。","items":[{"p":"family-friendly","zh":"適合闔家觀賞的","scene":"Claire 希望活動老少咸宜。","en":"Is this restaurant family-friendly?","tr":"這家餐廳適合帶小孩去嗎？","tip":"<b>用法：</b>餐廳、電影、活動都可以用。","th":9,"lv":1},{"p":"tone it down","zh":"收斂一點","scene":"Claire 叫大家別太誇張。","en":"Your music is too loud. Tone it down a little.","tr":"你的音樂太大聲了，收斂一點。","tip":"<b>用法：</b>聲音、打扮、態度都可以。","th":7,"lv":1},{"p":"open house","zh":"開放參觀日","scene":"Phil 要辦看屋活動。","en":"The school is having an open house this weekend.","tr":"學校這週末有開放參觀日。","tip":"<b>用法：</b>房屋、學校、公司的參觀日。","th":8,"lv":1},{"p":"curb appeal","zh":"房子外觀的吸引力","scene":"萬聖節裝飾可能嚇跑買家。","en":"Painting the front door adds curb appeal.","tr":"把前門漆一漆會讓房子更有吸引力。","tip":"<b>用法：</b>房地產術語，也可以開玩笑形容人。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人辦變裝派對，大家都精心打扮。","items":[{"p":"costume party","zh":"變裝派對","scene":"每個人都要穿戲服來。","en":"We're having a costume party. Come as your favorite movie character.","tr":"我們要辦變裝派對，扮成你最愛的電影角色來。","tip":"<b>延伸：</b>costume 戲服。","th":8,"lv":1},{"p":"scare the daylights out of","zh":"把某人嚇得半死","scene":"萬聖節大家互相嚇。","en":"You scared the daylights out of me!","tr":"你把我嚇死了！","tip":"<b>同義：</b>scare the hell out of me。","th":4,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay · Manny","plot":"Gloria 荷爾蒙作祟，脾氣很差；Manny 被受歡迎的同學邀請，開始猶豫要不要改變自己。","items":[{"p":"hormonal","zh":"荷爾蒙作祟、情緒不穩","scene":"Gloria 最近脾氣很大。","en":"Sorry I cried. I'm just hormonal.","tr":"抱歉我哭了，只是荷爾蒙作祟。","tip":"<b>用法：</b>注意場合，對別人說可能失禮。","th":4,"lv":2},{"p":"bite someone's head off","zh":"對某人大發脾氣","scene":"Gloria 一點小事就兇人。","en":"I just asked a question. You don't have to bite my head off.","tr":"我只是問個問題，你不用那麼兇吧。","tip":"<b>畫面：</b>兇到像要把頭咬下來。","th":5,"lv":2},{"p":"the cool kids","zh":"受歡迎的同學","scene":"Manny 被受歡迎的團體邀請了。","en":"In high school, I always wanted to sit with the cool kids.","tr":"高中時我一直想跟受歡迎的同學坐一起。","tip":"<b>用法：</b>學校裡的風雲人物。","th":3,"lv":1},{"p":"peer pressure","zh":"同儕壓力","scene":"Manny 面對要不要合群的壓力。","en":"I started smoking because of peer pressure.","tr":"我是因為同儕壓力才開始抽菸的。","tip":"<b>用法：</b>被朋友影響做不想做的事。","th":2,"lv":1}]}],"prompts":["你參加過的變裝派對或萬聖節活動（用 costume party、scare the daylights out of、family-friendly）","你受過同儕壓力嗎（用 peer pressure、the cool kids、tone it down）","你最近有被人兇過嗎（用 bite someone's head off、hormonal、curb appeal）"],"challenges":[{"id":"c1","sit":"弟弟躲在門後嚇你，你說他把你嚇死了。","uses":["scare the daylights out of"],"ans":"You scared the daylights out of me!"},{"id":"c2","sit":"你只是問學長一個問題，他就很兇，你私下說他不用那麼兇。","uses":["bite someone's head off"],"ans":"He didn't have to bite my head off."},{"id":"c3","sit":"朋友想帶小孩去餐廳，你說那家很適合帶小孩。","uses":["family-friendly"],"ans":"That place is really family-friendly."},{"id":"c4","sit":"寢室音樂太大聲，你請大家收斂一點。","uses":["tone it down"],"ans":"Can you guys tone it down?"}]},"s04e06":{"title":"Yard Sale","lede":"Jay 和 Gloria 辦二手拍賣替學校募款；Manny 和 Luke 翻出一個 Gloria 不想讓人知道的舊箱子；Mitchell 和 Cam 幫 Claire 審核 Alex 的新男友；Phil 則在拍賣會上又想買又想賣，壓力很大。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny · Luke","plot":"二手拍賣上什麼都有，Gloria 卻有一個箱子死都不讓人打開。","items":[{"p":"yard sale","zh":"院子二手拍賣","scene":"大家把家裡的舊東西拿出來賣。","en":"We sold my old bike at the yard sale.","tr":"我們在院子拍賣會上賣掉了我的舊腳踏車。","tip":"<b>文化：</b>美國家庭常在自家院子賣舊物。","th":8,"lv":1},{"p":"declutter","zh":"斷捨離、清掉雜物","scene":"剛好藉機整理家裡。","en":"I need to declutter my room before I move.","tr":"搬家前我得把房間清一清。","tip":"<b>用法：</b>整理雜物的流行說法。","th":8,"lv":1},{"p":"haggle","zh":"討價還價","scene":"買家都在殺價。","en":"My mom loves to haggle at the night market.","tr":"我媽很愛在夜市殺價。","tip":"<b>同義：</b>bargain。","th":3,"lv":1},{"p":"a steal","zh":"超便宜、撿到便宜","scene":"有些東西便宜到不可思議。","en":"Only 100 dollars for this jacket? It's a steal!","tr":"這件外套才一百塊？太划算了！","tip":"<b>對比：</b>a good deal 是划算；a steal 是便宜到像用偷的。","th":3,"lv":2},{"p":"one man's trash is another man's treasure","zh":"你的垃圾可能是別人的寶","scene":"舊東西也有人搶著要。","en":"Someone bought my old comics. One man's trash is another man's treasure.","tr":"有人買了我的舊漫畫，你的垃圾是別人的寶。","tip":"<b>用法：</b>二手交易時常說。","th":9,"lv":2},{"p":"off-limits","zh":"禁止進入、碰不得","scene":"那個箱子誰都不准碰。","en":"My dad's office is off-limits.","tr":"我爸的書房禁止進入。","tip":"<b>用法：</b>地方、話題、東西都可以。","th":9,"lv":1},{"p":"curiosity killed the cat","zh":"好奇心會害死人","scene":"兩個男孩越不准看越想看。","en":"Don't open it. Curiosity killed the cat.","tr":"別打開，好奇心會害死人。","tip":"<b>用法：</b>勸人別太好奇。","th":7,"lv":2}]},{"id":"mitch","name":"Mitchell、Cam 和 Claire","who":"Mitchell · Cameron · Claire · Alex","plot":"三個大人一起審問 Alex 的新男友。","items":[{"p":"grill someone","zh":"盤問某人","scene":"大人們把男友問到冒汗。","en":"My girlfriend's dad grilled me for an hour.","tr":"我女朋友的爸爸盤問了我一小時。","tip":"<b>畫面：</b>像放在烤架上烤。","th":5,"lv":2},{"p":"meet the parents","zh":"見家長","scene":"男友第一次見 Alex 的家人。","en":"I'm so nervous about meeting the parents.","tr":"我好緊張要見家長。","tip":"<b>延伸：</b>同名電影《門當父不對》。","th":1,"lv":1},{"p":"cheat day","zh":"欺騙餐日（節食中的放縱日）","scene":"Cam 在節食，也想偶爾放縱一下。","en":"Sunday is my cheat day. I eat whatever I want.","tr":"星期天是我的放縱日，想吃什麼就吃什麼。","tip":"<b>用法：</b>健身、減肥的人常說。","th":8,"lv":1}]}],"prompts":["你家有什麼該斷捨離的東西（用 declutter、yard sale、one man's trash is another man's treasure）","你殺價的經驗（用 haggle、a steal、curiosity killed the cat）","你見過女朋友的家長嗎（用 meet the parents、grill someone、off-limits）"],"challenges":[{"id":"c1","sit":"你在網拍用超低價買到一台二手相機。","uses":["a steal"],"ans":"It was a steal."},{"id":"c2","sit":"你跟朋友說星期天是你的放縱日。","uses":["cheat day"],"ans":"Sunday is my cheat day."},{"id":"c3","sit":"你跟好友說第一次見女朋友爸媽被盤問很久。","uses":["grill someone","meet the parents"],"ans":"I met the parents, and her dad grilled me."},{"id":"c4","sit":"你媽在菜市場跟老闆殺價。","uses":["haggle"],"ans":"My mom loves to haggle."}]},"s04e07":{"title":"Arrested","lede":"Haley 因為未成年喝酒被捕，Phil 和 Claire 帶著律師 Mitchell 去處理；Cam 幫忙顧 Alex 和 Luke，自己也惹了麻煩；Jay 想躲掉陪 Gloria 買嬰兒用品，結果 DeDe 突然來訪。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Mitchell","plot":"Haley 喝酒被抓，爸媽和舅舅一起去警局處理。","items":[{"p":"get arrested","zh":"被逮捕","scene":"Haley 被警察抓了。","en":"He got arrested for drunk driving.","tr":"他因為酒駕被逮捕了。","tip":"<b>延伸：</b>arrest 逮捕。","th":5,"lv":1},{"p":"underage drinking","zh":"未成年喝酒","scene":"Haley 被抓的原因。","en":"Underage drinking is a big problem at some colleges.","tr":"未成年喝酒在某些大學是個大問題。","tip":"<b>文化：</b>美國法定喝酒年齡是 21 歲。","th":8,"lv":1},{"p":"bail someone out","zh":"保釋某人；幫某人解圍","scene":"家人趕來救 Haley。","en":"My brother always bails me out when I'm broke.","tr":"我沒錢時我哥總是幫我解圍。","tip":"<b>延伸：</b>bail 是保釋金。","th":6,"lv":2},{"p":"a slap on the wrist","zh":"輕微的懲罰","scene":"大家希望 Haley 只被輕罰。","en":"He only got a slap on the wrist for cheating.","tr":"他作弊只被輕輕處罰了一下。","tip":"<b>畫面：</b>只是打一下手腕。","th":5,"lv":2},{"p":"make an example of","zh":"殺雞儆猴","scene":"學校可能拿 Haley 當例子。","en":"The coach made an example of him by benching him.","tr":"教練讓他坐冷板凳殺雞儆猴。","tip":"<b>用法：</b>懲罰某人來警告其他人。","th":5,"lv":2},{"p":"learn one's lesson","zh":"學到教訓","scene":"爸媽希望 Haley 記取教訓。","en":"I learned my lesson. I'll never do that again.","tr":"我學到教訓了，再也不會這樣做了。","tip":"<b>用法：</b>犯錯後的反省。","th":5,"lv":1}]},{"id":"mitch","name":"Cam 顧小孩","who":"Cameron · Alex · Luke","plot":"Cam 自告奮勇顧兩個孩子，結果自己反而惹上麻煩。","items":[{"p":"in over one's head","zh":"能力不及、陷入困境","scene":"Cam 很快就發現自己搞不定。","en":"I took the job, but I'm in over my head.","tr":"我接了那份工作，但完全應付不來。","tip":"<b>畫面：</b>水深到淹過頭。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · DeDe","plot":"Jay 想偷懶不去買嬰兒用品，前妻卻突然出現。","items":[{"p":"weasel out of","zh":"找藉口逃避","scene":"Jay 想溜掉不去逛街。","en":"He always weasels out of doing the dishes.","tr":"他總是找藉口不洗碗。","tip":"<b>用法：</b>帶貶義，形容狡猾地逃避。","th":10,"lv":2},{"p":"dodge a bullet","zh":"逃過一劫","scene":"Jay 以為自己逃過了，結果沒有。","en":"I almost married him. I really dodged a bullet.","tr":"我差點嫁給他，真是逃過一劫。","tip":"<b>畫面：</b>躲過子彈。","th":10,"lv":2},{"p":"unexpected guest","zh":"不速之客","scene":"DeDe 突然來訪。","en":"We had an unexpected guest for dinner.","tr":"晚餐時來了一位不速之客。","tip":"<b>用法：</b>沒預約就出現的客人。","th":2,"lv":1}]}],"prompts":["你學到教訓的一次經驗（用 learn one's lesson、a slap on the wrist、make an example of）","你接過應付不來的任務嗎（用 in over one's head、bail someone out、weasel out of）","你逃過一劫的經驗（用 dodge a bullet、unexpected guest、get arrested）"],"challenges":[{"id":"c1","sit":"你出國旅行忘了帶充電器，你說你學到教訓了。","uses":["learn one's lesson"],"ans":"I forgot my charger on the trip. I learned my lesson."},{"id":"c2","sit":"室友總是找藉口不去倒垃圾。","uses":["weasel out of"],"ans":"He always weasels out of taking out the trash."},{"id":"c3","sit":"你本來要買那支手機，後來發現有瑕疵，你說逃過一劫。","uses":["dodge a bullet"],"ans":"I dodged a bullet."},{"id":"c4","sit":"你第一次帶連上的活動，覺得能力不及。","uses":["in over one's head"],"ans":"I'm in over my head."}]},"s04e08":{"title":"Misery Date","lede":"Claire 帶 Manny 和 Luke 去看 Alex 的學術十項全能比賽，Alex 壓力超大；Phil 辦男生之夜，邀請在健身房認識的大學校友；Manny 和 Luke 在飯店到處找 Manny 遇見的女生；Mitchell 和 Cam 則準備給 Jay 和 Gloria 一個驚喜的寶寶禮物。","stories":[{"id":"dunphy","name":"Alex 的比賽","who":"Alex · Claire · Manny · Luke","plot":"Alex 參加學術比賽，緊張到快撐不住；Manny 和 Luke 在飯店大海撈針找一個女生。","items":[{"p":"hit the books","zh":"用功讀書","scene":"Alex 為了比賽拼命讀書。","en":"I have a test tomorrow. Time to hit the books.","tr":"我明天要考試，該用功讀書了。","tip":"<b>用法：</b>很口語的「念書」。","th":3,"lv":2},{"p":"choke","zh":"關鍵時刻失常","scene":"Alex 很怕自己在台上失常。","en":"He choked in the final and missed the shot.","tr":"他在決賽失常，投籃沒進。","tip":"<b>對比：</b>crack under pressure 是被壓力壓垮；choke 是關鍵時刻失手。","th":10,"lv":2},{"p":"psych someone out","zh":"讓對手心理動搖","scene":"對手想打亂 Alex 的心態。","en":"Don't let them psych you out.","tr":"別讓他們動搖你的心態。","tip":"<b>用法：</b>比賽前的心理戰。","th":5,"lv":2},{"p":"a needle in a haystack","zh":"大海撈針","scene":"在大飯店找一個人超難。","en":"Finding my keys in this mess is like finding a needle in a haystack.","tr":"在這團亂裡找鑰匙簡直是大海撈針。","tip":"<b>畫面：</b>在稻草堆裡找一根針。","th":9,"lv":2},{"p":"the one","zh":"真命天子／天女","scene":"Manny 覺得那個女生就是他的真命天女。","en":"When I met her, I knew she was the one.","tr":"我遇到她就知道她是對的人。","tip":"<b>用法：</b>感情中的命中注定。","th":1,"lv":1}]},{"id":"jay","name":"Phil 的男生之夜","who":"Phil · 校友","plot":"Phil 在家辦男生之夜，跟新認識的朋友一見如故。","items":[{"p":"bromance","zh":"兄弟情","scene":"Phil 和新朋友很快變成好兄弟。","en":"Those two have a total bromance.","tr":"他們兩個根本是好兄弟情。","tip":"<b>字源：</b>brother + romance。","th":2,"lv":2},{"p":"man cave","zh":"男人的私人空間","scene":"男生之夜的最佳場所。","en":"My dad turned the garage into a man cave.","tr":"我爸把車庫改成他的男人窩。","tip":"<b>用法：</b>家裡專屬於男人放鬆的空間。","th":8,"lv":2},{"p":"nerd out","zh":"熱烈討論喜歡的東西","scene":"兩個男人聊起共同興趣停不下來。","en":"We nerded out about Star Wars all night.","tr":"我們整晚狂聊星際大戰。","tip":"<b>用法：</b>對某事很宅、很投入。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人想給即將出生的寶寶一份很特別的禮物。","items":[{"p":"go the extra mile","zh":"多付出一點、更用心","scene":"兩人想把禮物做得更特別。","en":"She always goes the extra mile for her customers.","tr":"她總是為顧客多付出一點。","tip":"<b>用法：</b>稱讚很用心的人。","th":10,"lv":2},{"p":"over the top","zh":"太誇張、過頭","scene":"禮物有點太誇張了。","en":"The decorations were a bit over the top.","tr":"裝飾有點太誇張了。","tip":"<b>用法：</b>形容做得太過火。","th":9,"lv":2}]}],"prompts":["你考試或比賽失常的經驗（用 choke、psych someone out、hit the books）","你有很要好的兄弟嗎（用 bromance、man cave、nerd out）","你找人或找東西像大海撈針的經驗（用 a needle in a haystack、the one、go the extra mile）"],"challenges":[{"id":"c1","sit":"明天考專長測驗，你說今晚要用功讀書。","uses":["hit the books"],"ans":"I need to hit the books tonight."},{"id":"c2","sit":"你跟網友整晚聊鋼彈聊不停。","uses":["nerd out"],"ans":"We nerded out about Gundam all night."},{"id":"c3","sit":"朋友準備的告白太誇張了。","uses":["over the top"],"ans":"That's a little over the top."},{"id":"c4","sit":"你在人山人海的跨年場找朋友，說像大海撈針。","uses":["a needle in a haystack"],"ans":"It's like finding a needle in a haystack."}]},"s04e09":{"title":"When a Tree Falls","lede":"Cam 發起拯救一棵老樹的行動，Mitchell 被拖下水；Jay 和 Phil 在小孩的派對上互相較勁；Gloria 和 Claire 則經歷了一場超痛苦的購物之旅。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 為了一棵老樹發起抗議，Mitchell 只好跟著。","items":[{"p":"tree hugger","zh":"環保人士（抱樹的人）","scene":"Cam 化身熱血環保人士。","en":"My sister is a total tree hugger. She recycles everything.","tr":"我姊是超級環保人士，什麼都回收。","tip":"<b>語氣：</b>有時帶點調侃。","th":9,"lv":2},{"p":"drag someone into","zh":"把某人拖下水","scene":"Mitchell 被硬拉進來。","en":"Don't drag me into your argument.","tr":"別把我拖進你們的爭吵。","tip":"<b>用法：</b>被迫參與某事。","th":5,"lv":1},{"p":"take a stand","zh":"表明立場、挺身反對","scene":"Cam 決定為這棵樹站出來。","en":"Sometimes you have to take a stand.","tr":"有時候你得表明立場。","tip":"<b>用法：</b>take a stand against + 事情。","th":10,"lv":1},{"p":"chain oneself to","zh":"把自己鎖在某物上","scene":"抗議時有人把自己綁在樹上。","en":"The protesters chained themselves to the gate.","tr":"抗議者把自己鎖在大門上。","tip":"<b>用法：</b>抗議行動常見手法。","th":10,"lv":2}]},{"id":"jay","name":"Jay 和 Phil","who":"Jay · Phil","plot":"在孩子們的派對上，兩個大人玩遊戲比小孩還認真。","items":[{"p":"friendly competition","zh":"友誼賽、良性競爭","scene":"兩人說是友誼賽，其實很認真。","en":"It's just a friendly competition. No need to get angry.","tr":"只是友誼賽，不用生氣。","tip":"<b>用法：</b>強調不是真的在較勁。","th":5,"lv":1},{"p":"a kid at heart","zh":"童心未泯","scene":"兩個大人玩得比孩子還開心。","en":"My grandpa is still a kid at heart.","tr":"我爺爺依然童心未泯。","tip":"<b>用法：</b>稱讚人保有童心。","th":9,"lv":2}]},{"id":"dunphy","name":"Claire 和 Gloria 購物","who":"Claire · Gloria","plot":"兩人一起去逛街，結果一路都在受折磨。","items":[{"p":"retail therapy","zh":"購物療法","scene":"逛街本來是想紓壓。","en":"I had a bad week, so I need some retail therapy.","tr":"我這週很糟，需要買東西療傷。","tip":"<b>用法：</b>用購物來讓心情變好。","th":8,"lv":2},{"p":"shop till you drop","zh":"逛到腳軟","scene":"兩人逛到快累倒。","en":"We shopped till we dropped in Tokyo.","tr":"我們在東京逛到腳軟。","tip":"<b>用法：</b>形容瘋狂購物。","th":8,"lv":2},{"p":"try on","zh":"試穿","scene":"試衣間成了這趟購物的災難現場。","en":"Can I try this on?","tr":"這件我可以試穿嗎？","tip":"<b>用法：</b>買衣服必學的一句。","th":8,"lv":1},{"p":"bargain hunter","zh":"很會找便宜的人","scene":"有人只想挖寶找特價。","en":"My mom is a bargain hunter. She only buys things on sale.","tr":"我媽是撿便宜高手，只買特價品。","tip":"<b>延伸：</b>bargain 便宜貨。","th":9,"lv":2}]}],"prompts":["你曾經為了什麼事表明立場嗎（用 take a stand、tree hugger、drag someone into）","你身邊誰童心未泯（用 a kid at heart、friendly competition、chain oneself to）","你逛街的習慣（用 retail therapy、shop till you drop、bargain hunter）"],"challenges":[{"id":"c1","sit":"店員問你要不要試穿這件外套，你說好。","uses":["try on"],"ans":"Yes, can I try it on?"},{"id":"c2","sit":"兩個朋友在群組裡吵架，你叫他們別把你拖下水。","uses":["drag someone into"],"ans":"Don't drag me into this."},{"id":"c3","sit":"期末考結束你去逛街紓壓，跟朋友說需要購物療法。","uses":["retail therapy"],"ans":"I need some retail therapy."},{"id":"c4","sit":"你跟朋友說你爸是撿便宜高手。","uses":["bargain hunter"],"ans":"My dad is a bargain hunter."}]},"s04e10":{"title":"Diamond in the Rough","lede":"Manny 和 Luke 的少棒隊竟然打進季後賽；Claire 和 Cam 趕著整修破舊的球場，還一起投資翻修房子；Phil 和 Mitchell 爭論誰要當說「不」的壞人；Gloria 對著肚子裡的寶寶唱歌，惹毛了 Jay。","stories":[{"id":"kids","name":"少棒隊","who":"Manny · Luke · Jay","plot":"一支不被看好的球隊竟然一路打進季後賽。","items":[{"p":"diamond in the rough","zh":"未經雕琢的鑽石","scene":"破舊的球場和不被看好的隊伍都有潛力。","en":"The new guy is a diamond in the rough.","tr":"那個新人是塊未經雕琢的璞玉。","tip":"<b>用法：</b>有潛力但還沒發光的人或物。","th":9,"lv":2},{"p":"underdog","zh":"不被看好的一方","scene":"這支球隊是黑馬。","en":"Everyone loves rooting for the underdog.","tr":"大家都喜歡替不被看好的一方加油。","tip":"<b>延伸：</b>underdog story 以弱勝強的故事。","th":9,"lv":2},{"p":"make the playoffs","zh":"打進季後賽","scene":"球隊奇蹟般打進季後賽。","en":"Our team finally made the playoffs.","tr":"我們的隊伍終於打進季後賽。","tip":"<b>用法：</b>運動賽事用語。","th":8,"lv":1},{"p":"step up to the plate","zh":"挺身而出、承擔責任","scene":"關鍵時刻要有人站出來。","en":"When the boss quit, she stepped up to the plate.","tr":"老闆離職時，她挺身而出。","tip":"<b>來源：</b>棒球打者站上本壘板。","th":10,"lv":2}]},{"id":"dunphy","name":"Claire 和 Cam","who":"Claire · Cameron · Phil · Mitchell","plot":"兩人一起整修球場、翻修房子；兩個另一半爭論誰要當黑臉。","items":[{"p":"fixer-upper","zh":"待整修的房子","scene":"他們買的房子需要大整修。","en":"We bought a fixer-upper and renovated it ourselves.","tr":"我們買了一間老房子，自己整修。","tip":"<b>用法：</b>房地產用語。","th":8,"lv":2},{"p":"flip a house","zh":"買屋翻修再轉賣","scene":"Claire 和 Cam 想靠翻修房子賺錢。","en":"They flip houses for a living.","tr":"他們靠翻修房子轉賣維生。","tip":"<b>延伸：</b>house flipping 房屋翻修轉賣。","th":3,"lv":2},{"p":"spruce up","zh":"整理一下、打扮得煥然一新","scene":"球場需要好好整理一番。","en":"Let's spruce up the living room before the guests come.","tr":"客人來之前把客廳整理一下吧。","tip":"<b>用法：</b>也可以說人打扮一下。","th":8,"lv":2},{"p":"draw the short straw","zh":"抽到下下籤","scene":"誰要當壞人？兩人都不想。","en":"I drew the short straw, so I have to clean the toilets.","tr":"我抽到下下籤，得去刷廁所。","tip":"<b>由來：</b>抽籤時抽到最短的那根。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Gloria 每天對著肚子唱歌，Jay 有點受不了。","items":[{"p":"sing one's heart out","zh":"盡情高歌","scene":"Gloria 每天對著肚子唱個不停。","en":"She sang her heart out at the karaoke bar.","tr":"她在 KTV 盡情高歌。","tip":"<b>用法：</b>唱得很投入、很用力。","th":8,"lv":2},{"p":"put one's foot down","zh":"堅決表態、下定決心","scene":"Jay 決定表達自己的立場。","en":"My mom put her foot down: no more video games.","tr":"我媽堅決表態：不准再打電動了。","tip":"<b>畫面：</b>用力把腳踩下去。","th":10,"lv":2}]}],"prompts":["一個被低估、後來表現很好的人（用 diamond in the rough、underdog、step up to the plate）","你最近整理或改造過什麼（用 spruce up、fixer-upper、flip a house）","你抽到下下籤的經驗（用 draw the short straw、put one's foot down、make the playoffs）"],"challenges":[{"id":"c1","sit":"你抽到要站凌晨三點的哨，跟朋友說抽到下下籤。","uses":["draw the short straw"],"ans":"I drew the short straw."},{"id":"c2","sit":"你們連在比賽中不被看好，你說大家都愛替黑馬加油。","uses":["underdog"],"ans":"Everyone loves the underdog."},{"id":"c3","sit":"你媽說不准再晚回家，你說她已經堅決表態了。","uses":["put one's foot down"],"ans":"My mom put her foot down."},{"id":"c4","sit":"女朋友要來之前你把房間整理得煥然一新。","uses":["spruce up"],"ans":"I spruced up my room before she came over."}]},"s04e11":{"title":"New Year's Eve","lede":"Jay 想帶全家去棕櫚泉跨年，計畫卻一點都不順；Alex 和 Haley 留在家顧小孩，也是手忙腳亂。滿滿的跨年和新年新希望說法。","stories":[{"id":"jay","name":"棕櫚泉之旅","who":"Jay · Gloria · 大人們","plot":"Jay 精心安排的跨年之旅，結果什麼都不照計畫走。","items":[{"p":"ring in the new year","zh":"迎接新年","scene":"大家想一起跨年。","en":"Where are you ringing in the new year?","tr":"你要在哪裡跨年？","tip":"<b>由來：</b>以前用鐘聲迎接新年。","th":8,"lv":2},{"p":"countdown","zh":"倒數","scene":"跨年就是要一起倒數。","en":"We watched the countdown at Taipei 101.","tr":"我們在 101 看跨年倒數。","tip":"<b>延伸：</b>count down 是動詞。","th":8,"lv":1},{"p":"go according to plan","zh":"照計畫進行","scene":"Jay 的計畫完全沒照預期走。","en":"Nothing went according to plan.","tr":"沒有一件事照計畫進行。","tip":"<b>用法：</b>常用否定句。","th":10,"lv":1},{"p":"New Year's resolution","zh":"新年新希望","scene":"每個人都在想今年要做什麼改變。","en":"My New Year's resolution is to read more.","tr":"我的新年新希望是多讀書。","tip":"<b>用法：</b>make a New Year's resolution。","th":8,"lv":1},{"p":"fresh start","zh":"全新開始","scene":"新的一年代表新的開始。","en":"Moving to a new city was a fresh start for me.","tr":"搬到新城市對我來說是全新的開始。","tip":"<b>同義：</b>a clean slate。","th":10,"lv":1},{"p":"out with the old, in with the new","zh":"除舊佈新","scene":"新年就是要除舊佈新。","en":"I threw away my old shoes. Out with the old, in with the new!","tr":"我丟掉舊鞋了，除舊佈新！","tip":"<b>用法：</b>換新東西時的口號。","th":8,"lv":2},{"p":"stay in","zh":"待在家不出門","scene":"有時候在家跨年也不錯。","en":"It's raining. Let's stay in tonight.","tr":"下雨了，今晚待在家吧。","tip":"<b>反義：</b>go out 出門。","th":8,"lv":1}]},{"id":"dunphy","name":"姊妹顧小孩","who":"Alex · Haley · Luke · Manny · Lily","plot":"兩姊妹在家顧弟弟妹妹，場面失控。","items":[{"p":"be in charge","zh":"負責、當家","scene":"Alex 和 Haley 今晚負責管小孩。","en":"Who's in charge while your parents are away?","tr":"你爸媽不在時誰負責？","tip":"<b>用法：</b>I'm in charge here. 這裡我說了算。","th":10,"lv":1},{"p":"total chaos","zh":"一團混亂","scene":"家裡亂成一團。","en":"The kitchen was total chaos after the party.","tr":"派對後廚房一團混亂。","tip":"<b>用法：</b>誇張形容很亂。","th":9,"lv":1},{"p":"a long night","zh":"漫長的一夜","scene":"這一晚對姊妹倆來說很漫長。","en":"It's going to be a long night. Let's get some coffee.","tr":"今晚會很漫長，我們買杯咖啡吧。","tip":"<b>用法：</b>預告接下來很辛苦。","th":9,"lv":1}]}],"prompts":["你最難忘的一次跨年（用 ring in the new year、countdown、stay in）","你的新年新希望（用 New Year's resolution、fresh start、out with the old, in with the new）","你曾經負責管一群人嗎（用 be in charge、total chaos、a long night）"],"challenges":[{"id":"c1","sit":"朋友問你今年在哪跨年。","uses":["ring in the new year"],"ans":"Where are you ringing in the new year?"},{"id":"c2","sit":"你跟朋友說你的新年新希望是年底前考到多益 800。","uses":["New Year's resolution"],"ans":"My New Year's resolution is to get 800 on the TOEIC."},{"id":"c3","sit":"寢室在搬家，一團混亂。","uses":["total chaos"],"ans":"It's total chaos in here."},{"id":"c4","sit":"今晚要夜間演習，你說會是漫長的一夜。","uses":["a long night"],"ans":"It's going to be a long night."}]},"s04e12":{"title":"Party Crasher","lede":"Jay 和 Gloria 為 Manny 的十四歲生日準備驚喜派對；Cam 擔心自己太忙忽略了 Lily；Mitchell 以為自己工作出了問題；Haley 跟一個年紀比她大的男生約會；最後 Gloria 生了！","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"驚喜派對準備到一半，Gloria 竟然要生了。","items":[{"p":"surprise party","zh":"驚喜派對","scene":"大家偷偷幫 Manny 準備派對。","en":"We threw a surprise party for my mom's 50th.","tr":"我們幫媽媽辦了五十歲驚喜派對。","tip":"<b>用法：</b>throw a surprise party。","th":8,"lv":1},{"p":"act surprised","zh":"假裝驚訝","scene":"就算猜到了也要裝驚訝。","en":"He knew about the party, but he acted surprised.","tr":"他早就知道派對的事，但還是假裝驚訝。","tip":"<b>用法：</b>演技大考驗。","th":10,"lv":1},{"p":"give it away","zh":"洩露、露餡","scene":"一個小動作就可能穿幫。","en":"Don't smile so much. You'll give it away.","tr":"別一直笑，會露餡的。","tip":"<b>延伸：</b>giveaway 也指「贈品」。","th":10,"lv":1},{"p":"my water broke","zh":"我羊水破了","scene":"Gloria 派對上要生了。","en":"Call a taxi! My water broke!","tr":"叫計程車！我羊水破了！","tip":"<b>用法：</b>電影裡要生小孩的經典台詞。","th":8,"lv":1},{"p":"rush to the hospital","zh":"趕去醫院","scene":"全家急忙送 Gloria 去醫院。","en":"We rushed my grandpa to the hospital last night.","tr":"我們昨晚急忙送爺爺去醫院。","tip":"<b>用法：</b>rush someone to the hospital。","th":8,"lv":1},{"p":"welcome to the world","zh":"歡迎來到這個世界","scene":"新生兒誕生了。","en":"Welcome to the world, little one.","tr":"歡迎來到這個世界，小傢伙。","tip":"<b>用法：</b>迎接新生兒的溫暖說法。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · Lily","plot":"Cam 覺得自己太忙沒陪 Lily；Mitchell 則一直覺得工作要出事了。","items":[{"p":"spread oneself too thin","zh":"同時做太多事、分身乏術","scene":"Cam 身兼太多角色。","en":"Don't take on another project. You're spreading yourself too thin.","tr":"別再接新案子了，你分身乏術了。","tip":"<b>畫面：</b>奶油抹太薄，每處都不夠。","th":10,"lv":2},{"p":"read too much into","zh":"過度解讀","scene":"Mitchell 把小事想得太嚴重。","en":"He didn't text back. Don't read too much into it.","tr":"他沒回訊息，別過度解讀。","tip":"<b>用法：</b>勸人別想太多。","th":6,"lv":1}]},{"id":"dunphy","name":"Haley 的約會","who":"Haley · Phil · Claire","plot":"Haley 跟一個年紀比她大的男生交往，爸媽很擔心。","items":[{"p":"age gap","zh":"年齡差距","scene":"兩人之間差了不少歲。","en":"There's a ten-year age gap between my parents.","tr":"我爸媽差了十歲。","tip":"<b>延伸：</b>generation gap 代溝。","th":1,"lv":1},{"p":"too old for someone","zh":"對某人來說太老","scene":"爸媽覺得那男生年紀太大。","en":"He's way too old for you.","tr":"他對你來說年紀太大了。","tip":"<b>語氣：</b>父母常說的反對理由。","th":1,"lv":1}]}],"prompts":["你辦過或參加過驚喜派對嗎（用 surprise party、act surprised、give it away）","你曾經同時做太多事嗎（用 spread oneself too thin、read too much into、rush to the hospital）","你能接受多大的年齡差距（用 age gap、too old for someone、welcome to the world）"],"challenges":[{"id":"c1","sit":"你們要幫朋友辦驚喜派對，你叫另一個朋友別一直偷笑，不然會露餡。","uses":["give it away"],"ans":"Stop smiling. You'll give it away."},{"id":"c2","sit":"女朋友回訊息只回「嗯」，朋友叫你別過度解讀。","uses":["read too much into"],"ans":"Don't read too much into it."},{"id":"c3","sit":"你同時準備考試、打工和健身，朋友說你分身乏術。","uses":["spread oneself too thin"],"ans":"You're spreading yourself too thin."},{"id":"c4","sit":"你早就知道生日驚喜，但還是假裝很驚訝。","uses":["act surprised"],"ans":"I knew, but I acted surprised."}]},"s04e13":{"title":"Fulgencio","lede":"Gloria 的媽媽和妹妹來訪，帶來家鄉傳統、寶寶取名大戰和一堆陳年舊帳；Phil 忙著幫孩子們解決煩惱；Mitchell 和 Cam 則想改掉 Lily 的壞習慣。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · 媽媽 · 妹妹","plot":"娘家人一來，大家為了寶寶要叫什麼名字吵翻天，舊帳也一起翻出來。","items":[{"p":"in-laws","zh":"姻親（岳父母、公婆）","scene":"Jay 要面對 Gloria 的娘家人。","en":"Spending the holidays with my in-laws is stressful.","tr":"跟姻親一起過節壓力很大。","tip":"<b>延伸：</b>mother-in-law 岳母或婆婆。","th":2,"lv":1},{"p":"family baggage","zh":"家庭包袱、舊帳","scene":"娘家人來，舊恩怨也跟著來。","en":"Everyone brings some family baggage into a marriage.","tr":"每個人都帶著一些家庭包袱進入婚姻。","tip":"<b>延伸：</b>baggage 原意是行李。","th":2,"lv":2},{"p":"name after","zh":"以某人命名","scene":"寶寶要不要用長輩的名字？","en":"He was named after his grandfather.","tr":"他的名字是照他爺爺取的。","tip":"<b>用法：</b>be named after + 人。","th":2,"lv":1},{"p":"carry on the tradition","zh":"延續傳統","scene":"娘家人希望延續家族傳統。","en":"We carry on the tradition of eating dumplings every New Year.","tr":"我們延續每年過年吃水餃的傳統。","tip":"<b>用法：</b>家族習俗、節日活動都可以。","th":2,"lv":1},{"p":"it runs in the family","zh":"家族遺傳","scene":"某些個性是家族遺傳。","en":"My dad is stubborn too. It runs in the family.","tr":"我爸也很固執，家族遺傳的。","tip":"<b>用法：</b>外表、個性、疾病都可以說。","th":2,"lv":1},{"p":"bite one's tongue","zh":"忍住不說","scene":"Jay 很多話只能吞回去。","en":"I wanted to argue, but I bit my tongue.","tr":"我很想反駁，但還是忍住了。","tip":"<b>畫面：</b>咬住舌頭不讓話跑出來。","th":5,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · 孩子們","plot":"Phil 當起孩子們的心靈導師。","items":[{"p":"a shoulder to cry on","zh":"可以依靠的肩膀","scene":"Phil 想當孩子們的依靠。","en":"If you need a shoulder to cry on, call me.","tr":"如果你需要人陪，打給我。","tip":"<b>用法：</b>安慰別人時說。","th":6,"lv":2},{"p":"pep talk","zh":"打氣的話","scene":"Phil 給孩子們加油打氣。","en":"The coach gave us a pep talk before the game.","tr":"教練在比賽前給我們打氣。","tip":"<b>用法：</b>give someone a pep talk。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人想改掉 Lily 的壞習慣。","items":[{"p":"kick the habit","zh":"戒掉壞習慣","scene":"Lily 得改掉壞習慣。","en":"He finally kicked the habit after ten years of smoking.","tr":"他抽了十年菸，終於戒掉了。","tip":"<b>用法：</b>多用在戒菸、戒酒等。","th":8,"lv":2},{"p":"positive reinforcement","zh":"正向鼓勵","scene":"兩人試著用獎勵來改變 Lily。","en":"Dogs learn faster with positive reinforcement.","tr":"狗用正向鼓勵學得比較快。","tip":"<b>用法：</b>教育、訓練的方法。","th":6,"lv":2}]}],"prompts":["你家延續的傳統（用 carry on the tradition、it runs in the family、name after）","你曾經忍住不說的話（用 bite one's tongue、family baggage、in-laws）","你想戒掉的一個壞習慣（用 kick the habit、positive reinforcement、pep talk）"],"challenges":[{"id":"c1","sit":"你說你家每年中秋都烤肉，是傳統。","uses":["carry on the tradition"],"ans":"We carry on the tradition every year."},{"id":"c2","sit":"你跟朋友說你家每個人都很會唱歌，是家族遺傳。","uses":["it runs in the family"],"ans":"It runs in the family."},{"id":"c3","sit":"學長講話很難聽，你很想回嘴但忍住了。","uses":["bite one's tongue"],"ans":"I just bit my tongue."},{"id":"c4","sit":"比賽前教練給全隊精神喊話。","uses":["pep talk"],"ans":"Coach gave us a pep talk before the game."}]},"s04e14":{"title":"A Slight at the Opera","lede":"Cam 導演學校的《歌劇魅影》，主角生病了，Manny 卯起來爭取主角，不惜跟 Luke 競爭；Jay 教 Phil 打高爾夫，最後跟 Pepper 和 Mitchell 來場對決；Gloria 帶 Alex 去辦事，還順路去算命；Claire 幫忙顧 Joe 和 Lily，結果一團糟。","stories":[{"id":"mitch","name":"學校音樂劇","who":"Cameron · Manny · Luke","plot":"主角病倒，Manny 和 Luke 都想搶下這個角色。","items":[{"p":"understudy","zh":"替補演員","scene":"主角生病，就輪到替補上場。","en":"The understudy went on stage when the lead got sick.","tr":"主角生病時替補演員上台了。","tip":"<b>用法：</b>戲劇用語，也可指職場的接班人。","th":3,"lv":2},{"p":"land the role","zh":"拿下角色","scene":"Manny 想拿下主角。","en":"She landed the role after three auditions.","tr":"她試鏡三次後拿下了那個角色。","tip":"<b>延伸：</b>land a job 拿到工作。","th":3,"lv":2},{"p":"the show must go on","zh":"演出必須繼續","scene":"再多意外也要硬著頭皮演下去。","en":"The singer was sick, but the show must go on.","tr":"歌手生病了，但演出還是得繼續。","tip":"<b>用法：</b>遇到困難也要繼續。","th":10,"lv":2},{"p":"cutthroat","zh":"競爭激烈、不擇手段","scene":"爭奪主角的過程很激烈。","en":"The competition for the scholarship is cutthroat.","tr":"獎學金的競爭非常激烈。","tip":"<b>畫面：</b>割喉，形容競爭殘酷。","th":9,"lv":2}]},{"id":"jay","name":"Jay 和 Phil 打高爾夫","who":"Jay · Phil · Mitchell","plot":"Jay 教 Phil 打球，兩人最後跟別人一決勝負。","items":[{"p":"tee off","zh":"開球","scene":"高爾夫比賽要開始了。","en":"We tee off at seven tomorrow morning.","tr":"我們明天早上七點開球。","tip":"<b>用法：</b>高爾夫第一桿。","th":8,"lv":2},{"p":"par for the course","zh":"意料中的事、家常便飯","scene":"有些出包根本是常態。","en":"Delays are par for the course at this airport.","tr":"這個機場誤點是家常便飯。","tip":"<b>來源：</b>高爾夫的標準桿。","th":9,"lv":2}]},{"id":"dunphy","name":"Gloria、Alex 和 Claire","who":"Gloria · Alex · Claire · Joe · Lily","plot":"Gloria 帶 Alex 去算命；Claire 在家顧兩個小孩手忙腳亂。","items":[{"p":"run errands","zh":"跑腿、辦雜事","scene":"Gloria 帶 Alex 去處理一堆事。","en":"I need to run some errands before dinner.","tr":"晚餐前我得去辦點事。","tip":"<b>用法：</b>寄信、買東西、繳費都算 errands。","th":8,"lv":1},{"p":"fortune teller","zh":"算命師","scene":"兩人去找算命師。","en":"My mom visits a fortune teller every New Year.","tr":"我媽每年過年都去算命。","tip":"<b>延伸：</b>tell fortunes 算命。","th":8,"lv":1},{"p":"skeptic","zh":"懷疑論者","scene":"Alex 一點都不相信算命。","en":"I'm a skeptic. I don't believe in ghosts.","tr":"我是懷疑論者，我不相信有鬼。","tip":"<b>形容詞：</b>skeptical 懷疑的。","th":9,"lv":1},{"p":"have one's hands full","zh":"忙得不可開交","scene":"Claire 顧兩個小孩忙到不行。","en":"I'd love to help, but I have my hands full right now.","tr":"我很想幫忙，但我現在忙得不可開交。","tip":"<b>用法：</b>婉拒時也很好用。","th":10,"lv":2}]}],"prompts":["你參加過的表演或比賽（用 land the role、understudy、the show must go on）","你去算過命嗎（用 fortune teller、skeptic、run errands）","你遇過競爭很激烈的事嗎（用 cutthroat、par for the course、have one's hands full）"],"challenges":[{"id":"c1","sit":"同事請你幫忙，你說現在忙得不可開交。","uses":["have one's hands full"],"ans":"Sorry, I have my hands full right now."},{"id":"c2","sit":"週六一早你要先去辦一堆事。","uses":["run errands"],"ans":"I have to run some errands first."},{"id":"c3","sit":"火車又誤點，你說這是家常便飯。","uses":["par for the course"],"ans":"That's par for the course."},{"id":"c4","sit":"連上晚會主持人生病，你說演出還是得繼續。","uses":["the show must go on"],"ans":"The show must go on."}]},"s04e15":{"title":"Heart Broken","lede":"情人節，Phil 和 Claire 的分身 Clive Bixby 和 Juliana 又登場，結果一路玩到醫院，Claire 還得到一個不太想聽的診斷；Jay 和 Gloria 的浪漫計畫一直被孩子們打斷；Mitchell 和 Cam 辦了一場瘋狂的單身派對，宿醉醒來發現 Dylan 住進了他們家。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"情人節的角色扮演出了意外，兩人最後跑進醫院。","items":[{"p":"health scare","zh":"健康警訊、虛驚","scene":"一次就醫讓兩人都嚇了一跳。","en":"My dad had a health scare last year, so he quit drinking.","tr":"我爸去年健康亮紅燈，所以戒酒了。","tip":"<b>用法：</b>以為生大病的驚嚇經驗。","th":8,"lv":1},{"p":"false alarm","zh":"虛驚一場","scene":"結果可能沒那麼嚴重。","en":"The fire alarm went off, but it was a false alarm.","tr":"火警響了，但只是虛驚一場。","tip":"<b>用法：</b>以為出事但其實沒事。","th":7,"lv":1},{"p":"take it easy","zh":"放輕鬆、別太累","scene":"醫生要 Claire 別太操勞。","en":"You just got out of the hospital. Take it easy.","tr":"你剛出院，別太累。","tip":"<b>延伸：</b>Take it easy! 也是道別語「保重」。","th":6,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny · Joe","plot":"好不容易想浪漫一下，孩子們卻一直來打擾。","items":[{"p":"bad timing","zh":"時機不對","scene":"孩子們總是挑最糟的時候出現。","en":"Sorry, bad timing. I'll call you later.","tr":"抱歉，時機不對，我晚點打給你。","tip":"<b>用法：</b>打擾別人時道歉用。","th":7,"lv":1},{"p":"a moment alone","zh":"獨處的片刻","scene":"兩人只想有點兩人時光。","en":"Can we have a moment alone?","tr":"可以讓我們單獨聊一下嗎？","tip":"<b>用法：</b>想跟某人私下談話時。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Dylan","plot":"兩人辦了一場單身派對，隔天醒來什麼都不記得，還多了一個室友 Dylan。","items":[{"p":"lonely hearts","zh":"單身寂寞的人","scene":"派對是給情人節沒伴的人參加的。","en":"We threw a lonely hearts party for our single friends.","tr":"我們幫單身朋友辦了一場寂寞芳心派對。","tip":"<b>延伸：</b>Lonely Hearts Club 寂寞芳心俱樂部。","th":1,"lv":2},{"p":"party animal","zh":"派對動物","scene":"平常拘謹的人也玩瘋了。","en":"My cousin is a party animal. He goes out every weekend.","tr":"我表哥是派對動物，每個週末都出去玩。","tip":"<b>用法：</b>形容很愛玩的人。","th":9,"lv":2},{"p":"can't remember a thing","zh":"什麼都不記得","scene":"宿醉醒來一片空白。","en":"I was so tired I can't remember a thing from the meeting.","tr":"我累到完全不記得會議內容。","tip":"<b>用法：</b>喝醉、太累、太緊張時。","th":7,"lv":1},{"p":"the morning after","zh":"隔天早上（狂歡後）","scene":"派對隔天才是真正的考驗。","en":"The morning after the party, the house was a disaster.","tr":"派對隔天早上，家裡一片狼藉。","tip":"<b>用法：</b>形容狂歡後的後果。","th":8,"lv":1},{"p":"move in","zh":"搬進來住","scene":"Dylan 竟然住進了他們家。","en":"My girlfriend and I are moving in together.","tr":"我和女朋友要搬去一起住了。","tip":"<b>搭配：</b>move in with + 人。","th":1,"lv":1}]}],"prompts":["你遇過虛驚一場的事嗎（用 health scare、false alarm、take it easy）","你被人打擾過的尷尬時刻（用 bad timing、a moment alone、the morning after）","你身邊誰是派對動物（用 party animal、lonely hearts、can't remember a thing）"],"challenges":[{"id":"c1","sit":"半夜警報響了，結果只是誤報。","uses":["false alarm"],"ans":"It was just a false alarm."},{"id":"c2","sit":"你打給朋友，他說在忙，你說抱歉時機不對。","uses":["bad timing"],"ans":"Sorry, bad timing."},{"id":"c3","sit":"朋友剛扭傷腳，你叫他這幾天別太累。","uses":["take it easy"],"ans":"Take it easy for a few days."},{"id":"c4","sit":"你表哥換工作到台北，要搬進你家住一陣子。","uses":["move in"],"ans":"My cousin is moving in for a while."}]},"s04e16":{"title":"Bad Hair Day","lede":"Claire 一個人去參加大學同學會，遇到以前的教授，Phil 一出現場面變得很尷尬；Jay 對保齡球比賽走火入魔；Gloria 照顧寶寶累壞了卻不肯承認；Mitchell 幫忙顧 Joe，Cam 卻拿 Joe 去拍照，還出了假髮意外，沒人敢告訴 Gloria。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · 教授","plot":"Claire 在同學會遇到以前的教授，Phil 的出現讓氣氛更尷尬。","items":[{"p":"old flame","zh":"舊情人","scene":"老教授是 Claire 的一段過去。","en":"She ran into an old flame at the reunion.","tr":"她在同學會上遇到舊情人。","tip":"<b>用法：</b>比 ex 更有回憶、浪漫的感覺。","th":1,"lv":2},{"p":"make it awkward","zh":"讓場面變尷尬","scene":"Phil 一來氣氛就不對了。","en":"Don't make it awkward. Just say hi.","tr":"別搞得很尷尬，打個招呼就好。","tip":"<b>用法：</b>Why are you making it awkward? 你幹嘛搞得這麼尷尬？","th":4,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"Jay 一心只想贏保齡球賽；Gloria 帶寶寶累壞了卻硬撐。","items":[{"p":"bowl a strike","zh":"打出全倒","scene":"Jay 每一球都想全倒。","en":"I bowled a strike on my first try!","tr":"我第一球就打出全倒！","tip":"<b>延伸：</b>spare 是補中。","th":8,"lv":1},{"p":"in the zone","zh":"狀態絕佳、渾然忘我","scene":"Jay 打球時進入狀態。","en":"Don't talk to him. He's in the zone.","tr":"別跟他說話，他正在狀態中。","tip":"<b>用法：</b>運動、讀書、工作都可以。","th":4,"lv":2},{"p":"running on empty","zh":"精疲力盡、快沒力了","scene":"Gloria 累到快撐不下去。","en":"I've been running on empty since the baby was born.","tr":"寶寶出生後我一直處於精疲力盡的狀態。","tip":"<b>畫面：</b>油箱快見底了。","th":8,"lv":2},{"p":"admit defeat","zh":"認輸","scene":"Gloria 就是不肯承認自己累了。","en":"I couldn't fix it, so I admitted defeat and called a plumber.","tr":"我修不好，只好認輸叫水電工。","tip":"<b>用法：</b>承認自己做不到。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Joe","plot":"Cam 把 Joe 帶去拍照，結果出了假髮意外，兩人想瞞著 Gloria。","items":[{"p":"bad hair day","zh":"頭髮很亂的一天、諸事不順","scene":"這集標題，頭髮出事了。","en":"I'm having a bad hair day. Don't take my picture.","tr":"我今天頭髮很亂，別拍我。","tip":"<b>延伸：</b>也可以形容整天都不順。","th":8,"lv":2},{"p":"photo shoot","zh":"拍照工作、攝影","scene":"Cam 幫 Joe 拍照。","en":"We have a photo shoot for the wedding tomorrow.","tr":"我們明天要拍婚紗照。","tip":"<b>用法：</b>比較正式的拍攝活動。","th":8,"lv":1},{"p":"work the camera","zh":"很會面對鏡頭","scene":"小寶寶上鏡很有天分。","en":"She knows how to work the camera.","tr":"她很會面對鏡頭。","tip":"<b>用法：</b>形容很會擺姿勢、很上鏡。","th":8,"lv":2},{"p":"no one has to know","zh":"沒人需要知道","scene":"兩人打算隱瞞假髮的事。","en":"I broke your mug, but no one has to know.","tr":"我打破了你的杯子，但沒人需要知道。","tip":"<b>語氣：</b>準備隱瞞時的經典台詞。","th":10,"lv":1}]}],"prompts":["你遇過頭髮或外表出包的一天嗎（用 bad hair day、photo shoot、work the camera）","你曾經累到快撐不下去嗎（用 running on empty、admit defeat、in the zone）","你參加同學會遇過尷尬的人嗎（用 old flame、make it awkward、no one has to know）"],"challenges":[{"id":"c1","sit":"你跟朋友說你今天頭髮超亂，別拍你。","uses":["bad hair day"],"ans":"I'm having a bad hair day."},{"id":"c2","sit":"連續三天站夜哨，你說你快沒力了。","uses":["running on empty"],"ans":"I'm running on empty."},{"id":"c3","sit":"同梯打靶打得很準，你叫大家別吵他，他在狀態中。","uses":["in the zone"],"ans":"He's in the zone."},{"id":"c4","sit":"你跟朋友說在同學會遇到舊情人。","uses":["old flame"],"ans":"I ran into an old flame."}]},"s04e17":{"title":"Best Men","lede":"好友 Sal 隔天就要結婚，Mitchell 和 Cam 被請去當伴郎，卻懷疑她根本還沒準備好定下來，考慮要不要介入；Gloria 不信任新保母 Dalia；Manny 對裸體藝術產生興趣；Claire 和 Haley 培養母女感情；Phil 幫 Luke 透過 Facebook 約 Simone 出去。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Sal","plot":"兩人當伴郎，卻擔心愛玩的 Sal 不適合結婚。","items":[{"p":"best man","zh":"伴郎","scene":"兩人要當 Sal 的伴郎。","en":"My brother asked me to be his best man.","tr":"我哥請我當他的伴郎。","tip":"<b>延伸：</b>maid of honor 伴娘。","th":1,"lv":1},{"p":"tie the knot","zh":"結婚","scene":"Sal 要結婚了。","en":"They're tying the knot next spring.","tr":"他們明年春天要結婚。","tip":"<b>畫面：</b>把兩條繩子綁在一起。","th":1,"lv":2},{"p":"settle down","zh":"安定下來","scene":"大家懷疑 Sal 能不能安定下來。","en":"He wants to settle down and have kids.","tr":"他想安定下來生小孩。","tip":"<b>用法：</b>結婚、定居、穩定的生活。","th":1,"lv":1},{"p":"stage an intervention","zh":"介入勸說","scene":"兩人想勸 Sal 三思。","en":"His friends staged an intervention to stop him from gambling.","tr":"他的朋友們介入勸他別再賭博。","tip":"<b>用法：</b>親友一起勸人改變。","th":2,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay · Manny · Dalia","plot":"Gloria 總覺得新保母不可靠，一直盯著她。","items":[{"p":"trust issues","zh":"信任問題","scene":"Gloria 很難相信別人。","en":"She has trust issues after her last relationship.","tr":"她上段感情之後就很難相信別人。","tip":"<b>用法：</b>心理上的不信任。","th":1,"lv":1},{"p":"keep tabs on","zh":"密切注意","scene":"Gloria 一直盯著保母。","en":"My mom keeps tabs on me through Instagram.","tr":"我媽都透過 IG 注意我的動態。","tip":"<b>同義：</b>keep an eye on。","th":2,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Haley · Phil · Luke","plot":"Claire 和 Haley 聊起女生的心事；Phil 幫 Luke 在 Facebook 上約女生。","items":[{"p":"girl talk","zh":"女生之間的話題","scene":"母女倆聊起心事。","en":"We stayed up late for some girl talk.","tr":"我們熬夜聊女生的話題。","tip":"<b>對比：</b>guy talk 男生話題。","th":2,"lv":1},{"p":"friend request","zh":"好友邀請","scene":"Luke 要先加對方好友。","en":"She accepted my friend request!","tr":"她接受我的好友邀請了！","tip":"<b>延伸：</b>follow request 追蹤請求。","th":2,"lv":1},{"p":"slide into someone's DMs","zh":"私訊搭訕","scene":"Phil 教 Luke 怎麼傳訊息。","en":"He slid into her DMs with a cheesy joke.","tr":"他用一個很俗的笑話私訊搭訕她。","tip":"<b>用法：</b>現代社群媒體用語，DM 是私訊。","th":1,"lv":2},{"p":"the real deal","zh":"貨真價實","scene":"Luke 想確定這段感情是認真的。","en":"This beef noodle place is the real deal.","tr":"這家牛肉麵是貨真價實的好吃。","tip":"<b>用法：</b>真的、正宗的。","th":9,"lv":2}]}],"prompts":["你參加過婚禮或當過伴郎嗎（用 best man、tie the knot、settle down）","你會在社群上主動私訊人嗎（用 slide into someone's DMs、friend request、the real deal）","你身邊有人需要被介入勸說嗎（用 stage an intervention、trust issues、keep tabs on）"],"challenges":[{"id":"c1","sit":"你跟同事說你表哥下個月要結婚，你是伴郎。","uses":["best man","tie the knot"],"ans":"My cousin is tying the knot, and I'm the best man."},{"id":"c2","sit":"你跟朋友說那家滷肉飯是正宗好吃。","uses":["the real deal"],"ans":"That place is the real deal."},{"id":"c3","sit":"朋友想私訊喜歡的女生，你笑他要私訊搭訕。","uses":["slide into someone's DMs"],"ans":"You're going to slide into her DMs?"},{"id":"c4","sit":"你媽都透過 FB 在關注你。","uses":["keep tabs on"],"ans":"My mom keeps tabs on me on Facebook."}]},"s04e18":{"title":"The Wow Factor","lede":"Mitchell 想幫 Lily 對付遊樂場的小霸王，卻做過頭了；Jay 在跟 Joe 培養父子感情的時間偷溜去看電影，被 Gloria 抓包；Cam 和 Claire 為了後院整修意見不合，還要想辦法說服 Pam；Phil 想讓兩個女兒體會修繕的樂趣，卻碰到瓶頸。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Lily","plot":"Mitchell 為了保護女兒，對遊樂場的小霸王出手太重。","items":[{"p":"mama bear","zh":"護子心切的人","scene":"Mitchell 的保護欲大爆發。","en":"When someone criticized her son, she went full mama bear.","tr":"有人批評她兒子，她立刻護子心切。","tip":"<b>畫面：</b>保護小熊的母熊。","th":2,"lv":2},{"p":"go too far","zh":"太過分、做過頭","scene":"Mitchell 的反應有點過頭了。","en":"Teasing is fine, but don't go too far.","tr":"開玩笑可以，但別太過分。","tip":"<b>對比：</b>go overboard 是熱情過頭；go too far 是越線。","th":5,"lv":1},{"p":"overstep","zh":"越界、超出分寸","scene":"Mitchell 管了不該管的事。","en":"I don't want to overstep, but can I give you some advice?","tr":"我不想越界，但可以給你一點建議嗎？","tip":"<b>延伸：</b>overstep the line 越過界線。","th":5,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"Jay 說好要陪 Joe，卻偷偷溜去看電影，被 Gloria 抓個正著。","items":[{"p":"slip away","zh":"偷偷溜走","scene":"Jay 偷溜出去。","en":"I slipped away from the party early.","tr":"我提早從派對溜走了。","tip":"<b>用法：</b>不被發現地離開。","th":10,"lv":1},{"p":"father-son time","zh":"父子時光","scene":"Jay 本來應該好好陪 Joe。","en":"Saturday is father-son time. We go fishing.","tr":"星期六是父子時光，我們會去釣魚。","tip":"<b>延伸：</b>mother-daughter time 母女時光。","th":2,"lv":1},{"p":"busted","zh":"被抓包了","scene":"Jay 被 Gloria 逮到。","en":"Busted! I saw you eating my chips.","tr":"抓到了！我看到你偷吃我的洋芋片。","tip":"<b>用法：</b>被抓到做壞事時說。","th":7,"lv":1}]},{"id":"dunphy","name":"Claire、Cam 和 Phil","who":"Claire · Cameron · Phil · Alex · Haley","plot":"Cam 和 Claire 對後院設計各有意見；Phil 想帶女兒們修房子，計畫卻卡關。","items":[{"p":"wow factor","zh":"驚豔感","scene":"Cam 想讓後院讓人驚艷。","en":"The view from the rooftop has a real wow factor.","tr":"屋頂的景觀真的讓人驚豔。","tip":"<b>用法：</b>讓人眼睛一亮的特色。","th":9,"lv":2},{"p":"butt heads","zh":"意見衝突、槓上","scene":"Cam 和 Claire 一直意見不合。","en":"My dad and I always butt heads about politics.","tr":"我跟我爸總是為了政治槓上。","tip":"<b>畫面：</b>兩隻山羊用頭互撞。","th":5,"lv":2},{"p":"win someone over","zh":"說服、贏得某人的支持","scene":"兩人要想辦法說服 Pam。","en":"She didn't like me at first, but I won her over.","tr":"她一開始不喜歡我，但我贏得了她的好感。","tip":"<b>用法：</b>贏得某人的心或支持。","th":10,"lv":1},{"p":"hit a roadblock","zh":"遇到障礙","scene":"Phil 的計畫卡住了。","en":"The project hit a roadblock when we ran out of money.","tr":"這個計畫在沒錢時卡住了。","tip":"<b>對比：</b>hit a wall 是卡關；hit a roadblock 是遇到具體阻礙。","th":10,"lv":1}]}],"prompts":["你為了保護家人做過什麼（用 mama bear、go too far、overstep）","你偷溜被抓包過嗎（用 slip away、busted、hit a roadblock）","你跟誰最常意見不合（用 butt heads、win someone over、wow factor）"],"challenges":[{"id":"c1","sit":"你偷吃室友冰箱裡的布丁被抓包。","uses":["busted"],"ans":"Busted!"},{"id":"c2","sit":"你提早從聚餐溜走。","uses":["slip away"],"ans":"I slipped away early."},{"id":"c3","sit":"你跟你哥常常為了小事槓上。","uses":["butt heads"],"ans":"We always butt heads."},{"id":"c4","sit":"你想給剛分手的朋友建議，但怕越界。","uses":["overstep"],"ans":"I don't want to overstep, but can I say something?"}]},"s04e19":{"title":"The Future Dunphys","lede":"在醫院做檢查時，Claire 和 Phil 瞥見一個像是未來的自己的家庭；Cam、Mitchell 和 Gloria 帶 Lily 去越南餐廳，想讓她認識自己的文化根源；Jay 陪 Manny 參觀一所頂尖私校，勾起自己想被認同的渴望，結果害 Manny 的面試一塌糊塗。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"兩人在醫院看到一個家庭，像極了未來的自己。","items":[{"p":"a glimpse of the future","zh":"一窺未來","scene":"兩人好像看到了未來。","en":"Visiting my grandparents is like getting a glimpse of the future.","tr":"去看爺爺奶奶就像一窺未來的自己。","tip":"<b>延伸：</b>catch a glimpse of 瞥見。","th":9,"lv":2},{"p":"grow old together","zh":"白頭偕老","scene":"兩人想像一起變老的樣子。","en":"I want to grow old together with you.","tr":"我想跟你白頭偕老。","tip":"<b>用法：</b>浪漫的承諾。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 家和 Gloria","who":"Mitchell · Cameron · Gloria · Lily","plot":"他們帶 Lily 去越南餐廳，希望她認識自己的根。","items":[{"p":"get back to one's roots","zh":"回歸根源","scene":"讓 Lily 認識她的出身。","en":"He moved back to his hometown to get back to his roots.","tr":"他搬回老家，回歸自己的根。","tip":"<b>延伸：</b>roots 根源、出身。","th":2,"lv":2},{"p":"heritage","zh":"傳承、文化遺產","scene":"Lily 的越南血統是她的一部分。","en":"I'm proud of my Hakka heritage.","tr":"我以我的客家血統為傲。","tip":"<b>用法：</b>文化、血統、傳統。","th":2,"lv":1},{"p":"culture shock","zh":"文化衝擊","scene":"大家在餐廳都有點不習慣。","en":"I had a lot of culture shock when I moved to the US.","tr":"我搬到美國時遇到很多文化衝擊。","tip":"<b>用法：</b>到陌生文化環境的不適應。","th":8,"lv":1}]},{"id":"jay","name":"Jay 和 Manny","who":"Jay · Manny","plot":"Jay 陪 Manny 參觀名校，自己比 Manny 還想被接納，結果搞砸了面試。","items":[{"p":"prep school","zh":"私立預校","scene":"Manny 想進一所頂尖私校。","en":"He went to a fancy prep school in New England.","tr":"他讀了新英格蘭一所高級預校。","tip":"<b>文化：</b>美國為升大學做準備的私立學校。","th":3,"lv":2},{"p":"old money","zh":"世代豪門","scene":"名校裡都是有錢人家的孩子。","en":"Their family is old money. They've been rich for generations.","tr":"他們家是世代豪門，富了好幾代。","tip":"<b>對比：</b>new money 暴發戶。","th":9,"lv":2},{"p":"live vicariously through","zh":"透過別人來實現自己的夢想","scene":"Jay 好像在透過 Manny 圓自己的夢。","en":"My mom lives vicariously through my travel photos.","tr":"我媽透過我的旅遊照片過乾癮。","tip":"<b>用法：</b>自己做不到，透過別人體驗。","th":9,"lv":2},{"p":"put your best foot forward","zh":"拿出最好的表現","scene":"面試就要表現出最好的一面。","en":"It's your first day. Put your best foot forward.","tr":"今天是你第一天，拿出最好的表現。","tip":"<b>用法：</b>面試、見面前的鼓勵。","th":6,"lv":2},{"p":"blow it","zh":"搞砸","scene":"面試最後被搞砸了。","en":"I had one chance, and I blew it.","tr":"我只有一次機會，結果搞砸了。","tip":"<b>用法：</b>Don't blow it! 別搞砸了！","th":10,"lv":1}]}],"prompts":["你想像中未來的自己（用 a glimpse of the future、grow old together、put your best foot forward）","你家的文化根源（用 heritage、get back to one's roots、culture shock）","你曾經搞砸一個重要機會嗎（用 blow it、live vicariously through、prep school）"],"challenges":[{"id":"c1","sit":"你跟朋友說你以客家文化為傲。","uses":["heritage"],"ans":"I'm proud of my Hakka heritage."},{"id":"c2","sit":"你錯過了一個很棒的實習機會，你說你搞砸了。","uses":["blow it"],"ans":"I blew it."},{"id":"c3","sit":"你第一次出國去歐洲，遇到很多文化衝擊。","uses":["culture shock"],"ans":"I had so much culture shock."},{"id":"c4","sit":"好朋友明天要面試，你叫他拿出最好的表現。","uses":["put your best foot forward"],"ans":"Put your best foot forward."}]},"s04e20":{"title":"Flip Flop","lede":"Claire 和 Cam 合作翻修的房子遲遲賣不出去，之前還拒絕了 Phil 的對手 Gil 的出價；Haley 幫忙佈置房子吸引買家，卻因為一個小插曲把買家嚇跑；最後 Gil 跑來看笑話，兩人只好跟他重新談判。","stories":[{"id":"dunphy","name":"Claire 和 Cam 的翻修屋","who":"Claire · Cameron · Haley · Gil","plot":"房子掛在市場上很久都賣不掉，兩人開始後悔當初拒絕了出價。","items":[{"p":"on the market","zh":"在市場上出售","scene":"房子已經上市一段時間。","en":"Their house has been on the market for six months.","tr":"他們的房子已經掛牌賣半年了。","tip":"<b>延伸：</b>也可以說人「單身中」。","th":3,"lv":1},{"p":"lowball offer","zh":"很低的出價","scene":"Gil 一開始的出價很低。","en":"He made a lowball offer on my car.","tr":"他對我的車開了一個很低的價。","tip":"<b>用法：</b>故意壓低價格的出價。","th":3,"lv":2},{"p":"buyer's market","zh":"買方市場","scene":"現在是買家說了算。","en":"It's a buyer's market, so prices are dropping.","tr":"現在是買方市場，價格在下跌。","tip":"<b>反義：</b>seller's market 賣方市場。","th":3,"lv":2},{"p":"home staging","zh":"房屋佈置","scene":"Haley 幫忙佈置房子吸引買家。","en":"Good home staging helps houses sell faster.","tr":"好的房屋佈置能讓房子更快賣出。","tip":"<b>用法：</b>賣房前的佈置技巧。","th":3,"lv":2},{"p":"deal breaker","zh":"決定性的缺點","scene":"一個小插曲讓買家打退堂鼓。","en":"He smokes? That's a deal breaker for me.","tr":"他抽菸？那對我來說不行。","tip":"<b>用法：</b>感情、交易中無法接受的條件。","th":1,"lv":1},{"p":"gloat","zh":"幸災樂禍、得意洋洋","scene":"Gil 跑來看笑話。","en":"He won and wouldn't stop gloating.","tr":"他贏了就一直在得意。","tip":"<b>用法：</b>在別人失敗時得意。","th":5,"lv":2},{"p":"eat one's words","zh":"收回說過的話、被打臉","scene":"Claire 和 Cam 可能得收回之前的話。","en":"He said I'd never pass. Now he has to eat his words.","tr":"他說我一定不會過，現在他被打臉了。","tip":"<b>用法：</b>被證明自己說錯了。","th":5,"lv":2},{"p":"back to the drawing board","zh":"重新來過、從頭規劃","scene":"計畫失敗只好重新想辦法。","en":"The design didn't work. Back to the drawing board.","tr":"這個設計行不通，從頭來過。","tip":"<b>對比：</b>back to square one 是回到原點；back to the drawing board 是重新規劃。","th":10,"lv":2},{"p":"play hardball","zh":"強硬談判","scene":"雙方都不肯讓步。","en":"If they won't lower the price, we'll play hardball.","tr":"如果他們不降價，我們就強硬一點。","tip":"<b>用法：</b>談判時的強硬態度。","th":3,"lv":2},{"p":"call someone's bluff","zh":"揭穿某人的虛張聲勢","scene":"兩人假裝有興趣，看 Gil 怎麼反應。","en":"He said he'd quit, so I called his bluff.","tr":"他說要辭職，我就叫他辭看看。","tip":"<b>來源：</b>撲克牌遊戲。","th":5,"lv":2}]}],"prompts":["你賣過或買過二手東西嗎（用 lowball offer、on the market、play hardball）","你的另一半有什麼是你無法接受的（用 deal breaker、eat one's words、gloat）","你曾經整個計畫重來嗎（用 back to the drawing board、call someone's bluff、buyer's market）"],"challenges":[{"id":"c1","sit":"有人出很低的價要買你的機車，你拒絕了。","uses":["lowball offer"],"ans":"That's a lowball offer. No thanks."},{"id":"c2","sit":"你跟朋友說另一半抽菸對你來說是不行的。","uses":["deal breaker"],"ans":"Smoking is a deal breaker for me."},{"id":"c3","sit":"朋友說你一定考不過駕照，結果你過了，他被打臉。","uses":["eat one's words"],"ans":"Now he has to eat his words."},{"id":"c4","sit":"你們的社團活動企劃被學校否決，只好從頭規劃。","uses":["back to the drawing board"],"ans":"Back to the drawing board."}]},"s04e21":{"title":"Career Day","lede":"Gloria 鼓勵 Jay 把擱置多年的驚悚小說寫完，結果是 Manny 幫他寫；Phil 在 Luke 的職業日被對手 Gil 搶盡鋒頭；Mitchell 和 Cam 不小心給了 Lily 一百元當牙仙子的禮物，想討回來卻失敗，最後 Haley 用「壞孩子名單」才讓 Lily 乖乖還錢。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 的小說卡關，最後變成 Manny 在代筆。","items":[{"p":"writer's block","zh":"寫作瓶頸","scene":"Jay 寫不下去了。","en":"I've had writer's block for weeks.","tr":"我已經好幾週寫不出東西了。","tip":"<b>用法：</b>寫報告、寫歌也可以。","th":3,"lv":1},{"p":"dust off","zh":"重新拿出來（撣掉灰塵）","scene":"Jay 把多年前的小說重新拿出來。","en":"I dusted off my old guitar and started playing again.","tr":"我把舊吉他翻出來重新彈。","tip":"<b>畫面：</b>把灰塵撣掉。","th":8,"lv":2},{"p":"ghostwrite","zh":"代筆","scene":"Manny 偷偷幫 Jay 寫。","en":"Many celebrities have their books ghostwritten.","tr":"很多名人的書都是別人代筆的。","tip":"<b>名詞：</b>ghostwriter 代筆作家。","th":3,"lv":2},{"p":"page-turner","zh":"讓人一頁接一頁停不下來的書","scene":"Jay 希望寫出引人入勝的小說。","en":"This novel is a real page-turner.","tr":"這本小說讓人欲罷不能。","tip":"<b>用法：</b>稱讚好看的書。","th":9,"lv":2}]},{"id":"dunphy","name":"Luke 的職業日","who":"Phil · Luke · Gil","plot":"Phil 去學校介紹自己的工作，卻被 Gil 搶盡鋒頭。","items":[{"p":"upstage","zh":"搶走風采","scene":"Gil 搶了 Phil 的光彩。","en":"The puppy upstaged the bride at the wedding.","tr":"那隻小狗在婚禮上搶走了新娘的風采。","tip":"<b>對比：</b>steal someone's thunder 意思很像。","th":5,"lv":2},{"p":"show and tell","zh":"展示與分享","scene":"職業日有點像小學的分享活動。","en":"My son brought our cat to show and tell.","tr":"我兒子帶我們的貓去學校分享。","tip":"<b>文化：</b>美國小學常見的上台分享活動。","th":3,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily · Haley","plot":"牙仙子給太多錢了，Lily 怎樣都不肯還。","items":[{"p":"tooth fairy","zh":"牙仙子","scene":"Lily 掉牙，牙仙子來了。","en":"The tooth fairy gave me a dollar for my tooth.","tr":"牙仙子給我一塊錢換我的牙。","tip":"<b>文化：</b>西方小孩掉牙放枕頭下，牙仙子會留錢。","th":2,"lv":2},{"p":"finders keepers","zh":"誰撿到就是誰的","scene":"Lily 覺得錢是她的了。","en":"Finders keepers! This coin is mine now.","tr":"誰撿到就是誰的，這枚硬幣現在是我的了。","tip":"<b>全句：</b>Finders keepers, losers weepers.","th":7,"lv":2},{"p":"drive a hard bargain","zh":"很會討價還價","scene":"Lily 小小年紀很會談條件。","en":"You drive a hard bargain, but okay, deal.","tr":"你真會談條件，但好吧，成交。","tip":"<b>用法：</b>稱讚或抱怨對方很難說服。","th":3,"lv":2},{"p":"naughty list","zh":"壞孩子名單","scene":"Haley 用聖誕老人的名單嚇唬 Lily。","en":"If you don't share, you'll be on the naughty list.","tr":"你不分享的話，會上壞孩子名單喔。","tip":"<b>文化：</b>聖誕老人的好孩子和壞孩子名單。","th":2,"lv":2}]}],"prompts":["你寫東西卡關過嗎（用 writer's block、dust off、ghostwrite）","你被人搶過風采嗎（用 upstage、show and tell、page-turner）","你小時候有牙仙子或聖誕老人的回憶嗎（用 tooth fairy、naughty list、finders keepers）"],"challenges":[{"id":"c1","sit":"你寫心得報告寫不出來，說遇到寫作瓶頸。","uses":["writer's block"],"ans":"I've got writer's block."},{"id":"c2","sit":"朋友撿到你掉在地上的十元硬幣，說是他的了。","uses":["finders keepers"],"ans":"He said, \"Finders keepers.\""},{"id":"c3","sit":"二手買家一直跟你殺價，你說他真會談條件。","uses":["drive a hard bargain"],"ans":"You drive a hard bargain."},{"id":"c4","sit":"你把高中的滑板翻出來重新玩。","uses":["dust off"],"ans":"I dusted off my old skateboard."}]},"s04e22":{"title":"My Hero","lede":"Mitchell 的前男友 Teddy 邀請全家參加溜冰場的募款活動，家人對 Teddy 太熱情，讓 Cam 很吃味；Jay 想請 Claire 回自家公司上班，但 Claire 想起以前替爸爸工作的經驗，一直迴避；Phil 教 Gloria 溜冰；Haley 教 Alex 怎麼放電；Manny 和 Luke 寫「我的英雄」作文。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Teddy","plot":"家人對 Mitchell 的前任很熱情，Cam 覺得受到威脅。","items":[{"p":"feel threatened","zh":"感到威脅","scene":"Cam 覺得前任的存在讓他不安。","en":"He felt threatened by her new coworker.","tr":"他覺得她的新同事對他是個威脅。","tip":"<b>用法：</b>感情、職場中的不安全感。","th":4,"lv":1},{"p":"hold on tight","zh":"抓緊","scene":"溜冰場上大家都要抓緊。","en":"Hold on tight. This ride is fast.","tr":"抓緊，這個設施很快。","tip":"<b>用法：</b>坐雲霄飛車、騎車載人時。","th":7,"lv":1}]},{"id":"dunphy","name":"Claire 和 Jay","who":"Claire · Jay","plot":"Jay 想請 Claire 回公司，Claire 擔心工作和家庭混在一起。","items":[{"p":"job offer","zh":"工作邀約","scene":"Jay 給 Claire 一個工作機會。","en":"I got a job offer from a company in Taichung.","tr":"我收到台中一家公司的工作邀約。","tip":"<b>用法：</b>get a job offer、accept a job offer。","th":3,"lv":1},{"p":"the family business","zh":"家族企業","scene":"Jay 的公司是家族事業。","en":"He took over the family business after college.","tr":"他大學畢業後接手了家族企業。","tip":"<b>用法：</b>家裡經營的生意。","th":3,"lv":1},{"p":"mix business with pleasure","zh":"公私不分","scene":"Claire 擔心跟爸爸一起工作會公私不分。","en":"I never mix business with pleasure.","tr":"我從不公私混在一起。","tip":"<b>用法：</b>工作和私人生活分開。","th":3,"lv":2}]},{"id":"jay","name":"溜冰場和作文","who":"Phil · Gloria · Haley · Alex · Manny · Luke","plot":"Phil 教 Gloria 溜冰；Haley 教 Alex 放電；兩個男孩寫自己的英雄。","items":[{"p":"find one's feet","zh":"站穩腳步、適應新環境","scene":"Gloria 慢慢在溜冰場上站穩。","en":"It took me a few weeks to find my feet in the new unit.","tr":"我花了幾週才在新單位站穩腳步。","tip":"<b>用法：</b>適應新工作、新環境。","th":10,"lv":2},{"p":"take someone under one's wing","zh":"照顧、提攜某人","scene":"Phil 和 Haley 各自當起老師。","en":"My senior took me under his wing when I first arrived.","tr":"我剛到的時候學長很照顧我。","tip":"<b>畫面：</b>母雞用翅膀保護小雞。","th":6,"lv":2},{"p":"make eye contact","zh":"眼神交流","scene":"Haley 教 Alex 放電要先看對方。","en":"Make eye contact when you talk to people.","tr":"跟人說話時要有眼神交流。","tip":"<b>用法：</b>面試、社交的基本技巧。","th":8,"lv":1},{"p":"role model","zh":"榜樣","scene":"兩個男孩寫自己心中的榜樣。","en":"My grandpa is my role model.","tr":"我爺爺是我的榜樣。","tip":"<b>用法：</b>值得學習的對象。","th":9,"lv":1},{"p":"unsung hero","zh":"無名英雄","scene":"有時候真正的英雄是默默付出的人。","en":"Nurses are the unsung heroes of the hospital.","tr":"護理師是醫院裡的無名英雄。","tip":"<b>用法：</b>默默付出沒被讚揚的人。","th":9,"lv":2}]}],"prompts":["你心目中的英雄或榜樣（用 role model、unsung hero、take someone under one's wing）","你剛到新單位時怎麼適應（用 find one's feet、make eye contact、hold on tight）","你會想在家族企業工作嗎（用 the family business、job offer、mix business with pleasure）"],"challenges":[{"id":"c1","sit":"你跟家人說剛進公司時主管很照顧你。","uses":["take someone under one's wing"],"ans":"My manager took me under his wing."},{"id":"c2","sit":"你跟朋友說你收到一家公司的工作邀約。","uses":["job offer"],"ans":"I got a job offer."},{"id":"c3","sit":"你寫作文說你媽是你的榜樣。","uses":["role model"],"ans":"My mom is my role model."},{"id":"c4","sit":"你教表弟上台報告時要跟台下有眼神交流。","uses":["make eye contact"],"ans":"Make eye contact with the audience."}]},"s04e23":{"title":"Games People Play","lede":"Phil 買了一台露營車，計畫暑假去黃石公園，先帶全家沿著海岸試開；Claire 卻故意挑起孩子們吵架，想讓旅行泡湯；Jay 和 Gloria 為了找 Manny 的書包，到兩家人的家裡亂翻，才發現大家辦了遊戲之夜卻沒找他們，原來是 Manny 忘了送邀請；Lily 體操表現很好，但兩個爸爸太好勝，惹毛了其他家長。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 孩子們","plot":"Phil 很期待露營車之旅，Claire 卻暗中搞破壞。","items":[{"p":"test drive","zh":"試駕、試用","scene":"全家先開出去試試。","en":"Can I take the car for a test drive?","tr":"我可以試駕這台車嗎？","tip":"<b>用法：</b>買車、試用新東西。","th":8,"lv":1},{"p":"hit the road","zh":"上路、出發","scene":"Phil 迫不及待想出發。","en":"It's getting late. Let's hit the road.","tr":"時間晚了，我們出發吧。","tip":"<b>用法：</b>也可以說「該走了」。","th":8,"lv":1},{"p":"sabotage","zh":"暗中破壞","scene":"Claire 想讓旅行泡湯。","en":"Someone sabotaged my bike. The chain is broken.","tr":"有人搞破壞，我的腳踏車鏈子斷了。","tip":"<b>發音：</b>SAB-uh-tahzh。","th":5,"lv":2},{"p":"throw a wrench in","zh":"打亂計畫","scene":"Claire 想打亂 Phil 的計畫。","en":"The typhoon threw a wrench in our travel plans.","tr":"颱風打亂了我們的旅行計畫。","tip":"<b>畫面：</b>把扳手丟進機器裡。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"兩人翻遍家人的房子，發現自己被排除在遊戲之夜之外。","items":[{"p":"snoop around","zh":"到處翻找、窺探","scene":"兩人在別人家亂翻。","en":"Don't snoop around in my room.","tr":"別在我房間亂翻。","tip":"<b>名詞：</b>snoop 愛窺探的人。","th":10,"lv":2},{"p":"game night","zh":"遊戲之夜","scene":"大家辦了遊戲之夜。","en":"We have game night every Friday.","tr":"我們每週五有遊戲之夜。","tip":"<b>文化：</b>美國家庭常玩桌遊的夜晚。","th":8,"lv":1},{"p":"out of the loop","zh":"狀況外、沒被通知","scene":"兩人完全不知道有這回事。","en":"I was out of the loop. Nobody told me about the meeting.","tr":"我完全狀況外，沒人告訴我要開會。","tip":"<b>反義：</b>in the loop 知道最新消息。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 體操很厲害，兩個爸爸卻好勝過頭，惹得其他家長不高興。","items":[{"p":"stage parents","zh":"過度熱衷的家長","scene":"兩人在場邊太投入了。","en":"The stage parents were yelling at the judges.","tr":"那些過度熱衷的家長對裁判大吼。","tip":"<b>用法：</b>逼孩子表演、比賽的家長。","th":2,"lv":2},{"p":"cheer on","zh":"加油打氣","scene":"家長們在場邊加油。","en":"We went to the stadium to cheer on our team.","tr":"我們去球場替我們的隊伍加油。","tip":"<b>用法：</b>cheer on + 人。","th":6,"lv":1},{"p":"go for gold","zh":"拼金牌、全力以赴","scene":"兩個爸爸只想要第一名。","en":"This is the final. Go for gold!","tr":"這是決賽，拼金牌吧！","tip":"<b>用法：</b>鼓勵人追求最好。","th":6,"lv":2}]}],"prompts":["你最難忘的一次公路旅行（用 hit the road、test drive、throw a wrench in）","你曾經狀況外沒被通知嗎（用 out of the loop、game night、snoop around）","你的爸媽會在場邊幫你加油嗎（用 cheer on、stage parents、go for gold）"],"challenges":[{"id":"c1","sit":"颱風打亂了你去墾丁玩的計畫。","uses":["throw a wrench in"],"ans":"The typhoon threw a wrench in my plans."},{"id":"c2","sit":"你完全不知道今天要大掃除，說自己狀況外。","uses":["out of the loop"],"ans":"I was totally out of the loop."},{"id":"c3","sit":"室友亂翻你的櫃子，你叫他別亂翻。","uses":["snoop around"],"ans":"Stop snooping around."},{"id":"c4","sit":"收假時間到了，你說該出發了。","uses":["hit the road"],"ans":"Time to hit the road."}]},"s04e24":{"title":"Goodnight Gracie","lede":"第四季最後一集，全家飛到佛羅里達參加 Phil 媽媽的葬禮；她的遺願是要 Phil 幫喪偶的爸爸 Frank 找個新伴，Phil 和 Claire 對此意見分歧；Cam 跟退休社區的長輩們聊八卦聊得超開心；Jay 遇到年輕時認識的一位女士，對方卻完全不記得他。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Frank","plot":"Phil 一邊面對媽媽的離開，一邊想完成她的遺願。","items":[{"p":"pay one's respects","zh":"致哀、致敬","scene":"全家來參加葬禮致哀。","en":"We went to the funeral to pay our respects.","tr":"我們去參加葬禮致哀。","tip":"<b>用法：</b>葬禮、紀念活動的用語。","th":8,"lv":2},{"p":"eulogy","zh":"悼詞","scene":"Phil 要在葬禮上致詞。","en":"He gave a beautiful eulogy for his grandmother.","tr":"他為奶奶發表了一篇動人的悼詞。","tip":"<b>發音：</b>YOO-luh-jee。","th":8,"lv":2},{"p":"in loving memory","zh":"永懷紀念","scene":"大家懷念 Phil 的媽媽。","en":"This bench is in loving memory of my grandfather.","tr":"這張長椅是為了紀念我爺爺。","tip":"<b>用法：</b>紀念逝者的常見寫法。","th":8,"lv":2},{"p":"last wish","zh":"遺願","scene":"媽媽的最後心願。","en":"Her last wish was to see the ocean one more time.","tr":"她的遺願是再看一次大海。","tip":"<b>延伸：</b>dying wish 臨終心願。","th":2,"lv":1},{"p":"it's what she would have wanted","zh":"這是她會希望的","scene":"Phil 覺得完成遺願是媽媽想要的。","en":"Let's have a party. It's what she would have wanted.","tr":"我們辦個派對吧，這是她會希望的。","tip":"<b>用法：</b>替逝者做決定時說。","th":6,"lv":1},{"p":"move on","zh":"往前走、放下","scene":"Frank 能不能開始新生活？","en":"It's been a year. It's time to move on.","tr":"已經一年了，該往前走了。","tip":"<b>用法：</b>分手、失去、失敗後。","th":6,"lv":1},{"p":"matchmaker","zh":"媒人","scene":"Phil 得當爸爸的媒人。","en":"My aunt loves playing matchmaker.","tr":"我阿姨很愛當媒人。","tip":"<b>用法：</b>play matchmaker 當媒人。","th":1,"lv":1}]},{"id":"mitch","name":"Cam 和長輩們","who":"Cameron · 退休社區的居民","plot":"Cam 跟社區的爺爺奶奶們很合，一起聊八卦。","items":[{"p":"spill the tea","zh":"爆料、聊八卦","scene":"長輩們跟 Cam 分享社區八卦。","en":"Come on, spill the tea. What happened at the party?","tr":"快啦，爆料一下，派對上發生了什麼事？","tip":"<b>用法：</b>網路流行語，tea 指八卦。","th":7,"lv":2},{"p":"old stomping ground","zh":"以前常去的地方","scene":"佛羅里達是長輩們的地盤。","en":"We went back to our old stomping ground near the university.","tr":"我們回到以前常去的大學附近。","tip":"<b>用法：</b>以前生活、常出沒的地方。","th":8,"lv":2}]},{"id":"jay","name":"Jay 的往事","who":"Jay · 舊識","plot":"Jay 遇到年輕時記憶深刻的女士，對方卻對他毫無印象。","items":[{"p":"ring a bell","zh":"有點印象","scene"
