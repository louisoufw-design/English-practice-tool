:"Jay 的名字對她來說一點印象都沒有。","en":"His name rings a bell, but I can't remember his face.","tr":"他的名字有點耳熟，但我想不起他的臉。","tip":"<b>用法：</b>常用否定，Doesn't ring a bell. 沒印象。","th":7,"lv":1}]}],"prompts":["你最懷念的一位家人（用 in loving memory、pay one's respects、it's what she would have wanted）","你以前常去的地方（用 old stomping ground、ring a bell、move on）","你當過媒人或被介紹過對象嗎（用 matchmaker、spill the tea、last wish）"],"challenges":[{"id":"c1","sit":"有人提到一個高中同學的名字，你說有點耳熟。","uses":["ring a bell"],"ans":"That name rings a bell."},{"id":"c2","sit":"朋友在聊連上的八卦，你叫他快爆料。","uses":["spill the tea"],"ans":"Come on, spill the tea."},{"id":"c3","sit":"你跟朋友說你阿姨很愛當媒人。","uses":["matchmaker"],"ans":"My aunt loves playing matchmaker."},{"id":"c4","sit":"朋友分手半年了，你說該往前走了。","uses":["move on"],"ans":"It's time to move on."}]},"s05e01":{"title":"Suddenly, Last Summer","lede":"第五季開場，Mitchell 和 Cam 各自偷偷計畫向對方求婚，完全不知道對方也在準備；Cam 找 Jay 和 Gloria 幫忙，Mitchell 找 Claire 和 Phil。Phil 和 Claire 則想把孩子們的夏令營排在同一週，好換來一週沒有小孩的假期。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Jay · Gloria · Claire · Phil","plot":"兩人同時計畫求婚，家人們夾在中間，誰都不能說破。","items":[{"p":"pop the question","zh":"求婚","scene":"兩人都想開口求婚。","en":"He finally popped the question on their trip to Japan.","tr":"他終於在日本旅行時求婚了。","tip":"<b>用法：</b>很口語的「求婚」。","th":1,"lv":2},{"p":"get down on one knee","zh":"單膝下跪","scene":"求婚的經典動作。","en":"He got down on one knee in the middle of the restaurant.","tr":"他在餐廳正中間單膝下跪。","tip":"<b>文化：</b>西方求婚的標準姿勢。","th":1,"lv":1},{"p":"great minds think alike","zh":"英雄所見略同","scene":"兩人竟然想到一樣的事。","en":"You bought the same gift? Great minds think alike!","tr":"你也買了一樣的禮物？英雄所見略同！","tip":"<b>用法：</b>想法相同時的玩笑話。","th":7,"lv":1},{"p":"it's now or never","zh":"機不可失","scene":"再不說就沒機會了。","en":"It's now or never. Ask her out!","tr":"機不可失，快約她！","tip":"<b>用法：</b>催人把握機會。","th":6,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 孩子們","plot":"兩人費盡心思安排孩子們的夏令營，只為了換一週清靜。","items":[{"p":"kid-free","zh":"沒有小孩的","scene":"兩人夢想一週沒有孩子的生活。","en":"We had a kid-free weekend in Taitung.","tr":"我們在台東過了一個沒有小孩的週末。","tip":"<b>用法：</b>餐廳、飯店也會標 kid-free。","th":2,"lv":1},{"p":"line up","zh":"安排好、排好","scene":"他們把每個孩子的行程都排好。","en":"I've lined up three interviews for next week.","tr":"我下週已經排好三場面試。","tip":"<b>延伸：</b>line up 也是排隊。","th":10,"lv":1},{"p":"summer camp","zh":"夏令營","scene":"三個孩子要去不同的營隊。","en":"I went to a science summer camp when I was ten.","tr":"我十歲時去過科學夏令營。","tip":"<b>文化：</b>美國小孩暑假的經典活動。","th":8,"lv":1},{"p":"peace and quiet","zh":"清靜","scene":"兩人只想要一點清靜。","en":"I just want some peace and quiet after work.","tr":"下班後我只想要一點清靜。","tip":"<b>用法：</b>常一起出現的固定組合。","th":8,"lv":1},{"p":"staycation","zh":"在家度假","scene":"不出遠門也能放假。","en":"We didn't travel this year. We had a staycation.","tr":"我們今年沒出國，在家度假。","tip":"<b>字源：</b>stay + vacation。","th":8,"lv":2},{"p":"work like a charm","zh":"效果超好","scene":"他們的安排一開始很成功。","en":"I tried your trick, and it worked like a charm.","tr":"我試了你的方法，效果超好。","tip":"<b>用法：</b>方法很有效時說。","th":10,"lv":1}]}],"prompts":["你想像中的求婚方式（用 pop the question、get down on one knee、it's now or never）","你理想的假期怎麼過（用 staycation、peace and quiet、kid-free）","你曾經跟朋友想到一樣的事嗎（用 great minds think alike、work like a charm、line up）"],"challenges":[{"id":"c1","sit":"你跟朋友想送好友同一個生日禮物，你說英雄所見略同。","uses":["great minds think alike"],"ans":"Great minds think alike!"},{"id":"c2","sit":"連假你只想在家休息，跟朋友說今年在家度假。","uses":["staycation"],"ans":"I'm having a staycation."},{"id":"c3","sit":"你教室友一個去除衣服油漬的方法，他說效果超好。","uses":["work like a charm"],"ans":"It worked like a charm."},{"id":"c4","sit":"朋友在猶豫要不要告白，你說機不可失。","uses":["it's now or never"],"ans":"It's now or never."}]},"s05e02":{"title":"First Days","lede":"Luke 和 Manny 升上高中，Phil 和 Gloria 比孩子還焦慮，結果誤打誤撞當上廣告臨時演員；Claire 進入 Jay 的公司，為了贏得同事認同刻意跟爸爸保持距離；Cam 到 Alex 的學校當歷史代課老師，兩人都很不適應。","stories":[{"id":"dunphy","name":"Phil、Gloria 和兩個男孩","who":"Phil · Gloria · Luke · Manny","plot":"兩個大人送孩子上高中，自己反而緊張得不得了。","items":[{"p":"freshman year","zh":"高一（新生年）","scene":"Luke 和 Manny 成了高中新生。","en":"Freshman year was the hardest year of high school for me.","tr":"高一是我高中最難熬的一年。","tip":"<b>延伸：</b>sophomore 高二，junior 高三，senior 高四。","th":3,"lv":1},{"p":"new kid on the block","zh":"新來的人","scene":"兩人在新學校都是新面孔。","en":"I'm the new kid on the block at work.","tr":"我是公司裡的新人。","tip":"<b>用法：</b>剛加入團體的人。","th":9,"lv":2},{"p":"a big fish in a small pond","zh":"小池塘裡的大魚","scene":"在國中很厲害，到高中就不一定了。","en":"He was a big fish in a small pond in his hometown.","tr":"他在家鄉是小池塘裡的大魚。","tip":"<b>用法：</b>在小地方很突出的人。","th":9,"lv":2},{"p":"be an extra","zh":"當臨時演員","scene":"Phil 和 Gloria 誤入廣告拍攝。","en":"I was an extra in a movie once.","tr":"我當過一次電影臨時演員。","tip":"<b>延伸：</b>extra 是臨演、群眾演員。","th":3,"lv":2}]},{"id":"jay","name":"Claire 進公司","who":"Claire · Jay","plot":"Claire 剛進爸爸的公司，想證明自己不是靠關係。","items":[{"p":"nepotism","zh":"裙帶關係","scene":"Claire 很怕被說是靠爸。","en":"He only got the job because of nepotism.","tr":"他能拿到這份工作只是因為裙帶關係。","tip":"<b>用法：</b>靠親戚關係得到好處。","th":3,"lv":2},{"p":"earn someone's respect","zh":"贏得某人的尊重","scene":"Claire 想靠實力讓同事服氣。","en":"You have to earn their respect.","tr":"你得靠自己贏得他們的尊重。","tip":"<b>用法：</b>尊重要靠自己爭取。","th":3,"lv":1},{"p":"the boss's daughter","zh":"老闆的女兒","scene":"同事們都知道她的身份。","en":"It's not easy being the boss's daughter.","tr":"當老闆的女兒不容易。","tip":"<b>用法：</b>在公司裡身份特殊的人。","th":3,"lv":1}]},{"id":"mitch","name":"Cam 代課","who":"Cameron · Alex","plot":"Cam 到 Alex 的學校當代課老師，兩人都很尷尬。","items":[{"p":"substitute teacher","zh":"代課老師","scene":"Cam 成了 Alex 的代課老師。","en":"We had a substitute teacher who let us watch movies.","tr":"我們有一個代課老師讓我們看電影。","tip":"<b>延伸：</b>簡稱 sub。","th":3,"lv":1},{"p":"teacher's pet","zh":"老師的寵兒","scene":"Alex 不想被說是老師的寵兒。","en":"Everyone called her the teacher's pet.","tr":"大家都叫她老師的寵兒。","tip":"<b>語氣：</b>同學間略帶嘲諷。","th":3,"lv":2},{"p":"draw the line","zh":"劃清界線","scene":"Cam 和 Alex 要劃清在學校的界線。","en":"I'm happy to help, but I draw the line at lying.","tr":"我很樂意幫忙，但說謊我不幹。","tip":"<b>用法：</b>表明底線。","th":10,"lv":2}]}],"prompts":["你高一或新訓的第一天（用 freshman year、new kid on the block、a big fish in a small pond）","你在團體裡怎麼贏得別人的尊重（用 earn someone's respect、nepotism、the boss's daughter）","你的底線是什麼（用 draw the line、teacher's pet、be an extra）"],"challenges":[{"id":"c1","sit":"你剛到新單位，跟家人說你是新來的。","uses":["new kid on the block"],"ans":"I'm the new kid on the block."},{"id":"c2","sit":"你剛升主管，前輩跟你說尊重要自己爭取。","uses":["earn someone's respect"],"ans":"You have to earn their respect."},{"id":"c3","sit":"你願意幫同梯，但不幫他翹哨。","uses":["draw the line"],"ans":"I draw the line at skipping duty."},{"id":"c4","sit":"有人說新同事是靠關係進來的。","uses":["nepotism"],"ans":"People say it's nepotism."}]},"s05e03":{"title":"Larry's Wife","lede":"Mitchell 和 Cam 開始籌備婚禮；Lily 的貓 Larry 不見了；Phil 專找剛離婚的女性當客戶；Gloria 擔心 Joe 變成壞小孩；Jay 和 Manny 為了 Jay 的壞脾氣吵起來。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人忙著籌備婚禮，Lily 的貓卻在這時不見了。","items":[{"p":"save the date","zh":"預留日期（婚禮通知）","scene":"婚禮籌備的第一步。","en":"We sent out save-the-date cards six months before the wedding.","tr":"我們在婚禮前六個月寄出預留日期卡。","tip":"<b>文化：</b>喜帖前先寄的日期通知。","th":8,"lv":2},{"p":"pick out","zh":"挑選","scene":"兩人在挑婚禮場地和細節。","en":"Help me pick out a tie for the interview.","tr":"幫我挑一條面試要用的領帶。","tip":"<b>用法：</b>從很多選項中挑一個。","th":8,"lv":1},{"p":"on a budget","zh":"預算有限","scene":"婚禮要控制預算。","en":"We're traveling on a budget this time.","tr":"我們這次是小資旅行。","tip":"<b>用法：</b>省錢的生活、旅行。","th":3,"lv":1},{"p":"go missing","zh":"失蹤、不見","scene":"Lily 的貓不見了。","en":"My cat went missing for three days.","tr":"我的貓不見了三天。","tip":"<b>用法：</b>人、寵物、東西不見都可以。","th":8,"lv":1},{"p":"put up flyers","zh":"張貼傳單","scene":"他們貼尋貓啟事。","en":"We put up flyers all over the neighborhood.","tr":"我們在社區到處貼傳單。","tip":"<b>用法：</b>尋寵物、宣傳活動。","th":10,"lv":1}]},{"id":"dunphy","name":"Phil 的客戶","who":"Phil · Claire","plot":"Phil 專挑剛離婚的女性當客戶，Claire 覺得怪怪的。","items":[{"p":"on the rebound","zh":"剛分手、在情傷期","scene":"這些客戶剛離婚，情緒還沒走出來。","en":"She's on the rebound, so be careful.","tr":"她剛分手，你要小心。","tip":"<b>用法：</b>剛分手就急著找下一段。","th":1,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny · Joe","plot":"Gloria 覺得 Joe 越來越皮；Manny 受不了 Jay 的臭臉。","items":[{"p":"a bad seed","zh":"壞胚子","scene":"Gloria 擔心 Joe 是天生壞小孩。","en":"Don't worry. He's not a bad seed. He's just a kid.","tr":"別擔心，他不是壞胚子，只是小孩而已。","tip":"<b>語氣：</b>常帶點誇張的玩笑。","th":9,"lv":2},{"p":"grumpy","zh":"脾氣差、愛發牢騷","scene":"Jay 最近總是臭臉。","en":"Grandpa gets grumpy when he's hungry.","tr":"爺爺肚子餓就會臭臉。","tip":"<b>延伸：</b>Grumpy 是白雪公主裡的愛生氣小矮人。","th":4,"lv":1},{"p":"get up on the wrong side of the bed","zh":"起床氣、一早就心情差","scene":"Manny 覺得 Jay 每天都有起床氣。","en":"Did you get up on the wrong side of the bed today?","tr":"你今天是有起床氣嗎？","tip":"<b>用法：</b>問人為什麼心情不好。","th":4,"lv":2},{"p":"pet peeve","zh":"最受不了的小事","scene":"每個人都有自己的地雷。","en":"My biggest pet peeve is people who chew loudly.","tr":"我最受不了吃東西很大聲的人。","tip":"<b>用法：</b>令人煩躁的小習慣。","th":4,"lv":2}]}],"prompts":["你理想中的婚禮（用 save the date、pick out、on a budget）","你最受不了的小事（用 pet peeve、grumpy、get up on the wrong side of the bed）","你養過的寵物走失過嗎（用 go missing、put up flyers、a bad seed）"],"challenges":[{"id":"c1","sit":"室友一早就很兇，你問他是不是有起床氣。","uses":["get up on the wrong side of the bed"],"ans":"Did you get up on the wrong side of the bed?"},{"id":"c2","sit":"你跟朋友說你最受不了別人插隊。","uses":["pet peeve"],"ans":"My biggest pet peeve is people cutting in line."},{"id":"c3","sit":"你請女朋友幫你挑一件襯衫。","uses":["pick out"],"ans":"Can you help me pick out a shirt?"},{"id":"c4","sit":"你跟朋友說這次去日本是小資旅行。","uses":["on a budget"],"ans":"We're traveling on a budget."}]},"s05e04":{"title":"Farm Strong","lede":"Cam 的姊姊 Pam 來訪，兩個男人不知道怎麼告訴她要結婚了，結果她也藏著自己訂婚的秘密，對象還是 Cam 以前暗戀的人；Claire 勸 Phil 別去看 Luke 的足球賽，自己去了才發現 Luke 表現超好，很內疚；Gloria 死都不肯承認自己需要老花眼鏡。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Pam","plot":"兩邊都藏著結婚的消息，誰都不知道怎麼開口。","items":[{"p":"keep under wraps","zh":"保密","scene":"Pam 也有秘密沒說。","en":"They kept the wedding under wraps until the last minute.","tr":"他們把婚禮保密到最後一刻。","tip":"<b>畫面：</b>用布包起來不讓人看到。","th":10,"lv":2},{"p":"it's complicated","zh":"說來複雜","scene":"事情的關係有點複雜。","en":"Are you two dating? It's complicated.","tr":"你們在交往嗎？說來複雜。","tip":"<b>用法：</b>感情狀態的經典回答。","th":7,"lv":1},{"p":"awkward silence","zh":"尷尬的沉默","scene":"消息一說出口，大家都沉默了。","en":"There was an awkward silence after his joke.","tr":"他講完笑話後一陣尷尬的沉默。","tip":"<b>用法：</b>沒人知道該說什麼的時刻。","th":4,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Luke","plot":"Claire 說服 Phil 別去比賽，結果 Luke 打出生涯最佳表現。","items":[{"p":"talk someone out of","zh":"勸某人別做","scene":"Claire 勸 Phil 不用去。","en":"My mom talked me out of getting a tattoo.","tr":"我媽勸我別去刺青。","tip":"<b>反義：</b>talk someone into 說服某人去做。","th":10,"lv":1},{"p":"miss out","zh":"錯過好事","scene":"Phil 錯過了 Luke 的精彩表現。","en":"Come with us! You'll miss out on all the fun.","tr":"跟我們來！不然你會錯過好玩的。","tip":"<b>對比：</b>lose out on 是輸給別人而失去；miss out 是沒參與到。","th":10,"lv":1},{"p":"play one's heart out","zh":"全力以赴地比賽","scene":"Luke 在場上拼盡全力。","en":"The team played their hearts out but still lost.","tr":"球隊拼盡全力，但還是輸了。","tip":"<b>用法：</b>比賽、表演很投入。","th":8,"lv":2},{"p":"beat oneself up","zh":"自責","scene":"Claire 很自責。","en":"Don't beat yourself up. It wasn't your fault.","tr":"別自責了，不是你的錯。","tip":"<b>用法：</b>安慰人別太苛責自己。","th":6,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay","plot":"Gloria 看不清楚字，卻堅持自己不需要老花眼鏡。","items":[{"p":"reading glasses","zh":"老花眼鏡","scene":"Gloria 不想戴老花眼鏡。","en":"My dad started wearing reading glasses at 45.","tr":"我爸 45 歲開始戴老花眼鏡。","tip":"<b>延伸：</b>sunglasses 太陽眼鏡。","th":8,"lv":1},{"p":"vanity","zh":"虛榮心、愛面子","scene":"Gloria 的面子問題。","en":"It's just vanity. She doesn't want to look old.","tr":"她只是愛面子，不想看起來老。","tip":"<b>形容詞：</b>vain 虛榮的。","th":9,"lv":2},{"p":"can't see a thing","zh":"什麼都看不到","scene":"Gloria 其實已經看不清楚了。","en":"It's so dark in here. I can't see a thing.","tr":"這裡好暗，我什麼都看不到。","tip":"<b>用法：</b>暗、近視、有東西擋住時。","th":7,"lv":1}]}],"prompts":["你曾經錯過一件很重要的事嗎（用 miss out、beat oneself up、play one's heart out）","你曾經被勸退做某件事嗎（用 talk someone out of、keep under wraps、it's complicated）","你最愛面子的時候（用 vanity、reading glasses、awkward silence）"],"challenges":[{"id":"c1","sit":"朋友問你跟女生是不是在交往，你說說來複雜。","uses":["it's complicated"],"ans":"It's complicated."},{"id":"c2","sit":"隊友在賽末點發球失誤很自責，你叫他別這樣。","uses":["beat oneself up"],"ans":"Don't beat yourself up."},{"id":"c3","sit":"你媽勸你別辭職去環島。","uses":["talk someone out of"],"ans":"My mom talked me out of it."},{"id":"c4","sit":"夜間演習燈全關，你說什麼都看不到。","uses":["can't see a thing"],"ans":"I can't see a thing."}]},"s05e05":{"title":"The Late Show","lede":"Jay 好不容易訂到一家超難訂的餐廳，全家卻一個接一個遲到：Gloria 打扮打了一輩子，Claire 擔心讓 Luke 一個人在家，Mitchell 和 Cam 穿了一樣的衣服吵起來；Alex 在家顧 Lily，Haley 則陪 Manny 和 Joe 過夜。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 準時到了餐廳，其他人卻遲遲不來，餐廳快不留位了。","items":[{"p":"the clock is ticking","zh":"時間緊迫","scene":"Jay 看著時間越來越急。","en":"The clock is ticking. We have ten minutes left.","tr":"時間緊迫，我們只剩十分鐘。","tip":"<b>用法：</b>催促別人時常說。","th":10,"lv":1},{"p":"punctual","zh":"準時的","scene":"Jay 是很準時的人。","en":"Japanese trains are always punctual.","tr":"日本的火車總是很準時。","tip":"<b>名詞：</b>punctuality 守時。","th":9,"lv":1},{"p":"lose patience","zh":"失去耐心","scene":"Jay 等到快沒耐心了。","en":"After an hour of waiting, I lost my patience.","tr":"等了一小時，我失去耐心了。","tip":"<b>延伸：</b>run out of patience 耐心用完。","th":4,"lv":1},{"p":"hold the table","zh":"保留位子","scene":"Jay 拜託餐廳別放掉位子。","en":"Can you hold the table for ten more minutes?","tr":"可以再幫我們保留位子十分鐘嗎？","tip":"<b>用法：</b>餐廳訂位遲到時用。","th":8,"lv":1},{"p":"get dolled up","zh":"盛裝打扮（女生）","scene":"Gloria 打扮了好久。","en":"She got all dolled up for the party.","tr":"她為了派對盛裝打扮。","tip":"<b>畫面：</b>打扮得像洋娃娃。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人穿了一模一樣的衣服，誰都不肯換。","items":[{"p":"twinning","zh":"撞衫、穿得一樣","scene":"兩人穿成雙胞胎。","en":"We're twinning today! Same shirt!","tr":"我們今天撞衫了！一樣的襯衫！","tip":"<b>用法：</b>網路流行語，有時是故意的。","th":8,"lv":2},{"p":"fashion faux pas","zh":"穿搭失誤","scene":"撞衫是一場時尚災難。","en":"Wearing socks with sandals is a fashion faux pas.","tr":"襪子配涼鞋是穿搭大忌。","tip":"<b>發音：</b>faux pas 唸 foh-PAH，法文借字。","th":8,"lv":2},{"p":"dressed to the nines","zh":"打扮得非常體面","scene":"為了高級餐廳，大家都盛裝出席。","en":"Everyone was dressed to the nines at the gala.","tr":"晚會上每個人都穿得超正式。","tip":"<b>用法：</b>形容穿得很隆重。","th":8,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Luke · Alex · Haley","plot":"Claire 第一次讓 Luke 一個人在家，擔心得不得了。","items":[{"p":"home alone","zh":"一個人在家","scene":"Luke 第一次自己顧家。","en":"It's my first time home alone for a whole weekend.","tr":"這是我第一次一整個週末自己在家。","tip":"<b>延伸：</b>同名電影《小鬼當家》。","th":8,"lv":1},{"p":"worrywart","zh":"愛操心的人","scene":"Claire 太愛擔心了。","en":"Don't be such a worrywart. He'll be fine.","tr":"別那麼愛操心，他會沒事的。","tip":"<b>用法：</b>帶點可愛的調侃。","th":9,"lv":2}]}],"prompts":["你是準時的人嗎（用 punctual、the clock is ticking、lose patience）","你撞衫過嗎（用 twinning、fashion faux pas、dressed to the nines）","你第一次一個人在家的經驗（用 home alone、worrywart、hold the table）"],"challenges":[{"id":"c1","sit":"你跟好朋友穿了一樣的衣服出門，你說撞衫了。","uses":["twinning"],"ans":"We're twinning!"},{"id":"c2","sit":"媽媽一直傳訊息問你吃飯了沒，你說她太愛操心。","uses":["worrywart"],"ans":"Mom, don't be such a worrywart."},{"id":"c3","sit":"還有五分鐘就要集合，你催同梯說時間緊迫。","uses":["the clock is ticking"],"ans":"The clock is ticking!"},{"id":"c4","sit":"你訂了燒肉要遲到，打電話請店家幫忙保留位子。","uses":["hold the table"],"ans":"Could you hold the table for us?"}]},"s05e06":{"title":"The Help","lede":"Gloria 幫 Joe 請了一位男保母 Andy，Jay 和 Manny 都不太喜歡；Frank 跟女友分手後住進 Dunphy 家；Mitchell 和 Cam 請好友 Pepper 幫忙籌備婚禮，結果規模越來越大。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny · Andy","plot":"新來的男保母什麼都會，Jay 和 Manny 覺得自己被比下去。","items":[{"p":"manny","zh":"男保母","scene":"Andy 是 Joe 的男保母。","en":"They hired a manny to take care of their twins.","tr":"他們請了一位男保母照顧雙胞胎。","tip":"<b>字源：</b>man + nanny，剛好跟 Manny 同名。","th":2,"lv":2},{"p":"feel replaced","zh":"覺得被取代","scene":"Manny 覺得自己被取代了。","en":"When my mom got a new dog, I felt replaced.","tr":"我媽養了新狗之後，我覺得自己被取代了。","tip":"<b>用法：</b>表達不安全感。","th":4,"lv":1},{"p":"a breath of fresh air","zh":"讓人耳目一新","scene":"Gloria 覺得 Andy 很新鮮。","en":"Our new manager is a breath of fresh air.","tr":"我們的新經理讓人耳目一新。","tip":"<b>用法：</b>形容新的人或事讓人感到清新。","th":9,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Frank · Phil · Claire","plot":"Frank 分手後住進兒子家，整天悶悶不樂。","items":[{"p":"houseguest","zh":"住家裡的客人","scene":"Frank 成了 Dunphy 家的房客。","en":"We have a houseguest this week, so the guest room is full.","tr":"我們這週有客人住，客房滿了。","tip":"<b>用法：</b>來家裡住幾天的客人。","th":2,"lv":1},{"p":"mope around","zh":"悶悶不樂地晃來晃去","scene":"Frank 在家裡無精打采。","en":"Stop moping around and go outside.","tr":"別再悶悶不樂了，出去走走。","tip":"<b>用法：</b>形容心情差、什麼都不想做。","th":4,"lv":2},{"p":"get back out there","zh":"重新出發（尤其是約會）","scene":"Phil 鼓勵爸爸重新開始。","en":"It's been a year since the breakup. Time to get back out there.","tr":"分手一年了，該重新開始約會了。","tip":"<b>用法：</b>分手、失敗後重新嘗試。","th":1,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Pepper","plot":"Pepper 接手婚禮後，規模越來越誇張。","items":[{"p":"wedding planner","zh":"婚禮顧問","scene":"Pepper 當起兩人的婚禮顧問。","en":"The wedding planner took care of everything.","tr":"婚禮顧問處理了所有事情。","tip":"<b>延伸：</b>event planner 活動企劃。","th":8,"lv":1},{"p":"have expensive taste","zh":"品味很貴","scene":"Pepper 選的東西都很貴。","en":"She has expensive taste. She only buys designer bags.","tr":"她品味很貴，只買名牌包。","tip":"<b>用法：</b>形容喜歡高檔東西。","th":9,"lv":1},{"p":"go big or go home","zh":"要做就做大","scene":"Pepper 的哲學就是要辦就辦大。","en":"It's your 30th birthday. Go big or go home!","tr":"這是你的 30 歲生日，要辦就辦大！","tip":"<b>用法：</b>鼓勵人放手去做。","th":10,"lv":2},{"p":"over budget","zh":"超出預算","scene":"婚禮開銷越來越多。","en":"The project is way over budget.","tr":"這個計畫嚴重超出預算。","tip":"<b>反義：</b>under budget 低於預算。","th":3,"lv":1}]}],"prompts":["你曾經覺得被取代嗎（用 feel replaced、a breath of fresh air、manny）","你失戀或失敗後怎麼重新出發（用 get back out there、mope around、houseguest）","你辦活動會超出預算嗎（用 over budget、have expensive taste、go big or go home）"],"challenges":[{"id":"c1","sit":"新來的同事很有活力，你說他讓人耳目一新。","uses":["a breath of fresh air"],"ans":"He's a breath of fresh air."},{"id":"c2","sit":"朋友失戀一直窩在家，你叫他別再悶悶不樂。","uses":["mope around"],"ans":"Stop moping around."},{"id":"c3","sit":"畢業旅行的花費超出預算了。","uses":["over budget"],"ans":"We're way over budget."},{"id":"c4","sit":"朋友說他生日要包下整間 KTV，你說要辦就辦大。","uses":["go big or go home"],"ans":"Go big or go home!"}]},"s05e07":{"title":"A Fair to Remember","lede":"除了 Haley 之外，全家都去了學校園遊會，攤位遊戲和比賽讓大家又愛又恨；Haley 留在家想獨享 Jay 和 Gloria 的泳池，卻被 Andy 打擾，兩人之間有點火花。","stories":[{"id":"dunphy","name":"園遊會","who":"全家","plot":"大家在園遊會上玩遊戲、爭獎品。","items":[{"p":"county fair","zh":"郡市集、園遊會","scene":"全家去逛園遊會。","en":"We went to the county fair and ate way too much.","tr":"我們去逛市集吃太多了。","tip":"<b>文化：</b>美國地方性的大型市集活動。","th":8,"lv":2},{"p":"carnival games","zh":"園遊會遊戲","scene":"大家都在攤位前挑戰。","en":"I spent fifty dollars on carnival games and won nothing.","tr":"我在遊戲攤位花了五十塊，什麼都沒贏到。","tip":"<b>例如：</b>丟圈圈、射氣球。","th":8,"lv":1},{"p":"rigged","zh":"被動過手腳的","scene":"有人懷疑遊戲不公平。","en":"That game is rigged. Nobody ever wins.","tr":"那個遊戲被動過手腳，從來沒人贏過。","tip":"<b>用法：</b>比賽、選舉、遊戲不公平。","th":9,"lv":2},{"p":"win a prize","zh":"贏得獎品","scene":"大家都想抱個大獎回家。","en":"I won a prize at the night market game stall.","tr":"我在夜市遊戲攤贏到獎品。","tip":"<b>延伸：</b>first prize 頭獎。","th":8,"lv":1},{"p":"ride the Ferris wheel","zh":"坐摩天輪","scene":"園遊會的經典設施。","en":"Let's ride the Ferris wheel before it gets dark.","tr":"天黑前我們去坐摩天輪吧。","tip":"<b>延伸：</b>Ferris wheel 以發明人 Ferris 命名。","th":8,"lv":1}]},{"id":"jay","name":"Haley 和 Andy","who":"Haley · Andy","plot":"Haley 本來想一個人享受泳池，Andy 的出現讓她又氣又有點心動。","items":[{"p":"have the place to oneself","zh":"獨享一個地方","scene":"Haley 以為整個家都是她的。","en":"My roommates are away, so I have the place to myself.","tr":"我室友不在，整個地方都是我的。","tip":"<b>用法：</b>享受獨處的時候。","th":8,"lv":1},{"p":"do not disturb","zh":"請勿打擾","scene":"Haley 只想要一個人。","en":"I put up a \"do not disturb\" sign on my door.","tr":"我在門上掛了「請勿打擾」的牌子。","tip":"<b>用法：</b>飯店房門常見的牌子。","th":8,"lv":1},{"p":"chill out","zh":"放鬆、冷靜","scene":"Haley 想在泳池邊耍廢。","en":"We just chilled out by the pool all day.","tr":"我們整天都在泳池邊放鬆。","tip":"<b>延伸：</b>Chill out! 也可以是「冷靜點！」","th":7,"lv":1},{"p":"chemistry","zh":"來電、化學反應","scene":"兩人之間好像有點來電。","en":"You two have great chemistry.","tr":"你們兩個超有化學反應。","tip":"<b>用法：</b>感情或合作很對味。","th":1,"lv":1},{"p":"a sight for sore eyes","zh":"讓人眼睛一亮、很高興見到","scene":"有人覺得對方的出現很養眼。","en":"You're a sight for sore eyes! I missed you.","tr":"見到你真開心！我好想你。","tip":"<b>用法：</b>見到久違的人時的開心說法。","th":7,"lv":2}]}],"prompts":["你最喜歡的園遊會或夜市遊戲（用 carnival games、rigged、win a prize）","你獨處時都做什麼（用 have the place to oneself、chill out、do not disturb）","你跟誰很有化學反應（用 chemistry、a sight for sore eyes、ride the Ferris wheel）"],"challenges":[{"id":"c1","sit":"你在夜市套圈圈都套不中，說那根本被動過手腳。","uses":["rigged"],"ans":"That game is rigged."},{"id":"c2","sit":"室友都回老家了，你說整間公寓都是你的。","uses":["have the place to oneself"],"ans":"I have the place to myself."},{"id":"c3","sit":"你出國兩週回家看到你的狗，說見到牠真開心。","uses":["a sight for sore eyes"],"ans":"You're a sight for sore eyes!"},{"id":"c4","sit":"你跟朋友說你們整天在海邊放鬆。","uses":["chill out"],"ans":"We just chilled out at the beach."}]},"s05e08":{"title":"ClosetCon '13","lede":"Claire 去參加衣櫃展，懷疑 Jay 有外遇，結果挖出他過去的一個秘密；Phil 發現 Jay 藏在秘密衣櫃裡的東西；Mitchell 和 Cam 回到 Cam 的家鄉；Alex 和 Haley 為了一個送披薩的男生吵起來，還越弄越亂。","stories":[{"id":"jay","name":"Claire 和 Jay","who":"Claire · Jay · Phil","plot":"Claire 在展覽上越想越不對，懷疑爸爸有事瞞著大家。","items":[{"p":"trade show","zh":"商展","scene":"Claire 去參加衣櫃商展。","en":"Our company has a booth at the trade show.","tr":"我們公司在商展有攤位。","tip":"<b>延伸：</b>booth 攤位。","th":3,"lv":1},{"p":"two-timing","zh":"劈腿","scene":"Claire 以為爸爸劈腿。","en":"I found out he was two-timing me.","tr":"我發現他劈腿了。","tip":"<b>用法：</b>同時跟兩個人交往。","th":1,"lv":2},{"p":"a secret stash","zh":"秘密藏起來的東西","scene":"Phil 發現 Jay 的秘密寶藏。","en":"My brother has a secret stash of snacks under his bed.","tr":"我弟床底下藏了一堆零食。","tip":"<b>延伸：</b>stash 是藏匿的東西。","th":10,"lv":2},{"p":"rub elbows with","zh":"跟某人打交道、交際","scene":"在商展上要跟很多人交際。","en":"At the conference, I rubbed elbows with some big names.","tr":"在研討會上我跟一些大人物打交道。","tip":"<b>畫面：</b>手肘碰手肘，形容很近。","th":3,"lv":2}]},{"id":"mitch","name":"Cam 的家鄉","who":"Cameron · Mitchell","plot":"兩人回到 Cam 的農場老家，Cam 是當地的大明星。","items":[{"p":"hometown hero","zh":"家鄉英雄","scene":"Cam 在家鄉很有名。","en":"The Olympic medalist is a hometown hero.","tr":"那位奧運獎牌得主是家鄉英雄。","tip":"<b>用法：</b>在故鄉很受愛戴的人。","th":9,"lv":2},{"p":"small-town","zh":"小鎮的","scene":"Cam 的家鄉是個小鎮。","en":"I love the small-town feeling of Yilan.","tr":"我很愛宜蘭的小鎮氛圍。","tip":"<b>用法：</b>當形容詞，small-town life。","th":9,"lv":1},{"p":"you can take the boy out of the country","zh":"鄉下孩子走到哪都還是鄉下孩子","scene":"Cam 一回家鄉就變回農場男孩。","en":"He moved to Taipei, but he still loves farm life. You can take the boy out of the country…","tr":"他搬到台北，但還是愛農場生活，鄉下孩子就是鄉下孩子。","tip":"<b>全句：</b>…but you can't take the country out of the boy。","th":9,"lv":2}]},{"id":"dunphy","name":"兩姊妹","who":"Alex · Haley","plot":"兩姊妹都看上同一個送披薩的男生，吵了起來。","items":[{"p":"fight over","zh":"為了某物爭吵","scene":"姊妹倆為了一個男生吵架。","en":"The kids fought over the last cookie.","tr":"孩子們為了最後一塊餅乾吵架。","tip":"<b>用法：</b>fight over + 人或東西。","th":5,"lv":1},{"p":"call dibs","zh":"先說先贏、我先預約","scene":"誰先說就是誰的。","en":"I call dibs on the front seat!","tr":"前座是我的！","tip":"<b>用法：</b>搶東西時的口語。","th":7,"lv":2},{"p":"fair and square","zh":"光明正大","scene":"兩人都說自己是公平競爭。","en":"I won fair and square.","tr":"我是光明正大贏的。","tip":"<b>用法：</b>強調沒有作弊。","th":9,"lv":2}]}],"prompts":["你有藏東西的秘密基地嗎（用 a secret stash、two-timing、trade show）","你的家鄉是什麼樣子（用 small-town、hometown hero、you can take the boy out of the country）","你跟兄弟姊妹搶過什麼（用 fight over、call dibs、fair and square）"],"challenges":[{"id":"c1","sit":"你跟同梯搶下鋪，大喊你先說的。","uses":["call dibs"],"ans":"I call dibs on the bottom bunk!"},{"id":"c2","sit":"你下棋贏了爸爸，說你是光明正大贏的。","uses":["fair and square"],"ans":"I won fair and square."},{"id":"c3","sit":"你發現室友在櫃子裡藏了一堆泡麵。","uses":["a secret stash"],"ans":"He has a secret stash of instant noodles."},{"id":"c4","sit":"你跟朋友說你很喜歡家鄉的小鎮生活。","uses":["small-town"],"ans":"I love small-town life."}]},"s05e09":{"title":"The Big Game","lede":"Cam 當球隊教練太投入，完全沒注意到對手根本處於劣勢，還想一路刷紀錄；Mitchell 想辭職；Phil 的房子賣不掉；Claire 拒絕爸爸在工作上幫忙；Haley 則想幫 Alex 在學校變得更受注目。","stories":[{"id":"mitch","name":"Cam 的球隊","who":"Cameron · Mitchell","plot":"Cam 一心想贏球破紀錄，對手卻弱到不行；Mitchell 則想辭掉工作。","items":[{"p":"run up the score","zh":"大比分痛宰對手","scene":"Cam 想把比分拉到最大。","en":"It's rude to run up the score against a weak team.","tr":"對弱隊大比分痛宰很沒禮貌。","tip":"<b>用法：</b>運動精神的爭議。","th":8,"lv":2},{"p":"show no mercy","zh":"毫不留情","scene":"Cam 對對手毫不手軟。","en":"The boss showed no mercy in the meeting.","tr":"老闆在會議上毫不留情。","tip":"<b>用法：</b>比賽、批評都可以用。","th":5,"lv":2},{"p":"win at all costs","zh":"不惜一切代價取勝","scene":"Cam 只想贏。","en":"Some coaches want to win at all costs.","tr":"有些教練不惜一切代價想贏。","tip":"<b>用法：</b>帶負面意味。","th":10,"lv":2},{"p":"two weeks' notice","zh":"兩週前提出辭呈","scene":"Mitchell 想辭職。","en":"I'm putting in my two weeks' notice tomorrow.","tr":"我明天要提辭呈。","tip":"<b>文化：</b>美國辭職的一般慣例。","th":3,"lv":2},{"p":"burn bridges","zh":"斷了後路、把關係搞僵","scene":"Mitchell 想辭職，但不想鬧翻。","en":"Leave on good terms. Don't burn bridges.","tr":"好聚好散，別斷了後路。","tip":"<b>畫面：</b>過河後把橋燒掉。","th":5,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Jay · Haley · Alex","plot":"Phil 的房子賣不掉；Claire 堅持靠自己；Haley 幫 Alex 改造形象。","items":[{"p":"sweeten the deal","zh":"加碼讓交易更吸引人","scene":"Phil 想辦法讓買家心動。","en":"If you buy two, I'll sweeten the deal with a free bag.","tr":"如果你買兩個，我再送你一個包包。","tip":"<b>用法：</b>談判、促銷時的加碼。","th":3,"lv":2},{"p":"stand on one's own two feet","zh":"自立","scene":"Claire 不想靠爸爸。","en":"I want to stand on my own two feet after the army.","tr":"退伍後我想自己獨立。","tip":"<b>用法：</b>經濟或生活上的獨立。","th":10,"lv":2},{"p":"get noticed","zh":"被注意到","scene":"Haley 想讓 Alex 被同學注意。","en":"Post more on social media if you want to get noticed.","tr":"如果你想被注意，就多在社群發文。","tip":"<b>用法：</b>被看見、引人注目。","th":10,"lv":1},{"p":"glow up","zh":"華麗變身","scene":"Alex 經過改造後判若兩人。","en":"Did you see her glow up? She looks amazing!","tr":"你看到她的華麗變身了嗎？她超美的！","tip":"<b>用法：</b>網路流行語，指外表大進化。","th":9,"lv":2},{"p":"turn heads","zh":"吸引目光","scene":"改造後的 Alex 讓人回頭。","en":"Her red dress turned heads at the party.","tr":"她的紅洋裝在派對上吸引了所有目光。","tip":"<b>用法：</b>外表很吸睛。","th":9,"lv":2}]}],"prompts":["你會為了贏不擇手段嗎（用 win at all costs、show no mercy、run up the score）","你未來想怎麼獨立生活（用 stand on one's own two feet、two weeks' notice、burn bridges）","你有過華麗變身嗎（用 glow up、turn heads、get noticed）"],"challenges":[{"id":"c1","sit":"你出社會後想自立，不想靠爸媽。","uses":["stand on one's own two feet"],"ans":"I want to stand on my own two feet."},{"id":"c2","sit":"朋友想辭職跟老闆吵架，你勸他別斷了後路。","uses":["burn bridges"],"ans":"Don't burn bridges."},{"id":"c3","sit":"你高中同學減肥成功，大家說他華麗變身。","uses":["glow up"],"ans":"What a glow up!"},{"id":"c4","sit":"你賣二手吉他，說買的話再送一組弦。","uses":["sweeten the deal"],"ans":"I'll sweeten the deal with free strings."}]},"s05e10":{"title":"The Old Man & the Tree","lede":"Jay 和 Manny 去山上親手砍聖誕樹；Gloria 的媽媽來訪，看到媽媽和 Claire 很合，Gloria 才放下心；Mitchell 送錯 Lily 的禮物，只好趕快去補買；Cam 帶 Lily 去參加慈善活動。","stories":[{"id":"jay","name":"Jay 和 Manny","who":"Jay · Manny","plot":"Jay 堅持要用傳統方式自己砍樹。","items":[{"p":"chop down","zh":"砍倒","scene":"兩人去砍一棵聖誕樹。","en":"They chopped down the old tree in the backyard.","tr":"他們把後院那棵老樹砍了。","tip":"<b>延伸：</b>chop 是用刀斧砍。","th":8,"lv":1},{"p":"old-fashioned","zh":"老派的、傳統的","scene":"Jay 喜歡老派的過節方式。","en":"My dad is old-fashioned. He still writes letters.","tr":"我爸很老派，還在寫信。","tip":"<b>用法：</b>可以是正面（有傳統味），也可以是負面（落伍）。","th":9,"lv":1}]},{"id":"dunphy","name":"Gloria 的媽媽和 Claire","who":"Gloria · 媽媽 · Claire","plot":"Gloria 本來擔心媽媽來，結果媽媽跟 Claire 一拍即合。","items":[{"p":"get along like a house on fire","zh":"一見如故、處得超好","scene":"兩人很快變成好朋友。","en":"My mom and my girlfriend get along like a house on fire.","tr":"我媽跟我女朋友處得超好。","tip":"<b>畫面：</b>像房子著火一樣快速熱絡。","th":2,"lv":2},{"p":"ease the tension","zh":"緩和緊張氣氛","scene":"兩人的友誼讓氣氛變輕鬆。","en":"He told a joke to ease the tension.","tr":"他講了個笑話緩和氣氛。","tip":"<b>用法：</b>讓緊繃的場面放鬆。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 發現禮物買錯了，聖誕前到處補買。","items":[{"p":"wish list","zh":"願望清單","scene":"Lily 的禮物清單。","en":"I made a Christmas wish list for my parents.","tr":"我給爸媽寫了一份聖誕願望清單。","tip":"<b>用法：</b>想要的東西清單。","th":8,"lv":1},{"p":"out of stock","zh":"缺貨","scene":"Mitchell 想買的東西都沒貨了。","en":"Sorry, that size is out of stock.","tr":"抱歉，那個尺寸沒貨了。","tip":"<b>反義：</b>in stock 有貨。","th":8,"lv":1},{"p":"regift","zh":"把收到的禮物轉送","scene":"有人想把禮物轉送。","en":"I regifted the candle my coworker gave me.","tr":"我把同事送的蠟燭轉送了。","tip":"<b>用法：</b>有點尷尬但很常見。","th":8,"lv":2},{"p":"stocking stuffer","zh":"聖誕襪小禮物","scene":"Mitchell 只好買些小東西補上。","en":"Chocolate makes a great stocking stuffer.","tr":"巧克力是很棒的聖誕襪小禮物。","tip":"<b>文化：</b>放進聖誕襪的小禮物。","th":8,"lv":2},{"p":"the season of giving","zh":"分享的季節","scene":"Cam 帶 Lily 去做慈善。","en":"Christmas is the season of giving.","tr":"聖誕節是分享的季節。","tip":"<b>用法：</b>節日的溫暖說法。","th":8,"lv":2},{"p":"cheer up","zh":"打起精神","scene":"慈善活動讓大家心情變好。","en":"Cheer up! It's almost Christmas.","tr":"打起精神！快要聖誕節了。","tip":"<b>用法：</b>安慰心情不好的人。","th":6,"lv":1}]}],"prompts":["你家過節的老派傳統（用 old-fashioned、chop down、the season of giving）","你送過或收過轉送的禮物嗎（用 regift、wish list、stocking stuffer）","你的家人和朋友處得好嗎（用 get along like a house on fire、ease the tension、cheer up）"],"challenges":[{"id":"c1","sit":"你想買的球鞋缺貨了。","uses":["out of stock"],"ans":"They're out of stock."},{"id":"c2","sit":"你跟朋友說你奶奶跟你女朋友超合。","uses":["get along like a house on fire"],"ans":"They get along like a house on fire."},{"id":"c3","sit":"朋友面試沒上很沮喪，你叫他打起精神。","uses":["cheer up"],"ans":"Cheer up, man."},{"id":"c4","sit":"你承認你把收到的香氛蠟燭轉送給別人了。","uses":["regift"],"ans":"I regifted it."}]},"s05e11":{"title":"And One to Grow On","lede":"Phil 騙 Luke 去上舞蹈課，謊言越滾越大，Phil 還被警察抓了；Jay 和 Gloria 幫 Manny 和 Joe 辦生日派對，擔心 Manny 追的女生太高攀；Mitchell 和 Cam 發現搶婚禮場地競爭超激烈；Haley 教 Alex 開車。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Haley · Alex","plot":"Phil 騙兒子去上課，謊言一發不可收拾；Haley 教 Alex 開車。","items":[{"p":"trick someone into","zh":"騙某人去做","scene":"Phil 騙 Luke 去上舞蹈課。","en":"My friends tricked me into singing on stage.","tr":"我朋友騙我上台唱歌。","tip":"<b>用法：</b>trick someone into + V-ing。","th":10,"lv":1},{"p":"snowball","zh":"越滾越大","scene":"一個小謊越滾越大。","en":"One small lie snowballed into a huge mess.","tr":"一個小謊言越滾越大，變成大麻煩。","tip":"<b>畫面：</b>雪球越滾越大。","th":9,"lv":2},{"p":"learner's permit","zh":"學習駕照","scene":"Alex 正在練習開車。","en":"You need a learner's permit before you take the driving test.","tr":"考駕照前你需要學習駕照。","tip":"<b>文化：</b>美國先拿學習駕照才能上路練習。","th":8,"lv":2},{"p":"check your mirrors","zh":"看後照鏡","scene":"Haley 提醒 Alex 注意後方。","en":"Always check your mirrors before changing lanes.","tr":"變換車道前一定要看後照鏡。","tip":"<b>用法：</b>開車的基本提醒。","th":8,"lv":1},{"p":"backseat driver","zh":"愛在旁邊指揮開車的人","scene":"Haley 一直在旁邊指揮。","en":"My mom is such a backseat driver.","tr":"我媽超愛在旁邊指揮我開車。","tip":"<b>用法：</b>也可以比喻愛插手別人事的人。","th":9,"lv":2},{"p":"hit the brakes","zh":"踩煞車","scene":"Alex 一緊張就猛踩煞車。","en":"I hit the brakes when a cat ran into the road.","tr":"有隻貓衝到路上，我趕快踩煞車。","tip":"<b>延伸：</b>也比喻「停下來、暫緩」。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Manny 喜歡的女生好像太難追了。","items":[{"p":"out of one's league","zh":"高攀不起","scene":"Jay 和 Gloria 覺得對方太難追。","en":"She's way out of my league.","tr":"她對我來說太高攀不起了。","tip":"<b>用法：</b>對方條件遠超過自己。","th":1,"lv":2},{"p":"aim high","zh":"目標遠大","scene":"Manny 總是把目標設很高。","en":"Aim high, and you'll go far.","tr":"目標遠大，你就會走得遠。","tip":"<b>用法：</b>鼓勵人有企圖心。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人才發現婚禮場地競爭這麼激烈。","items":[{"p":"book a venue","zh":"訂場地","scene":"好場地一下就被訂走了。","en":"We need to book a venue for the wedding a year in advance.","tr":"我們要提前一年訂婚禮場地。","tip":"<b>延伸：</b>venue 場地、會場。","th":8,"lv":1},{"p":"first come, first served","zh":"先到先得","scene":"場地是先搶先贏。","en":"The free tickets are first come, first served.","tr":"免費票先到先得。","tip":"<b>用法：</b>活動、優惠的規則。","th":8,"lv":1}]}],"prompts":["你被騙去做過什麼事嗎（用 trick someone into、snowball、aim high）","你學開車的經驗（用 learner's permit、check your mirrors、backseat driver）","你曾經追過高攀不起的人嗎（用 out of one's league、first come, first served、hit the brakes）"],"challenges":[{"id":"c1","sit":"你媽坐副駕一直指揮你，你說她是愛指揮的乘客。","uses":["backseat driver"],"ans":"Mom, you're such a backseat driver."},{"id":"c2","sit":"你跟朋友說那個女生你高攀不起。","uses":["out of one's league"],"ans":"She's way out of my league."},{"id":"c3","sit":"學校的免費講座是先到先得。","uses":["first come, first served"],"ans":"It's first come, first served."},{"id":"c4","sit":"朋友騙你去參加聯誼。","uses":["trick someone into"],"ans":"He tricked me into going."}]},"s05e12":{"title":"Under Pressure","lede":"Claire 在 Alex 高中的開放參觀日壓力超大；Jay 教 Phil 怎麼翹班；Gloria 跟另一位媽媽槓上；Luke 和 Manny 跟一對雙胞胎姊妹約會；Mitchell 認識了一位很環保的鄰居；Alex 在生日當天崩潰，去看心理師。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Alex · Claire · Phil · Jay","plot":"Alex 壓力大到在生日當天崩潰；Jay 則教 Phil 偶爾也要給自己放個假。","items":[{"p":"call in sick","zh":"打電話請病假","scene":"Jay 教 Phil 請病假翹班。","en":"I called in sick and went to the beach.","tr":"我請了病假去海邊。","tip":"<b>用法：</b>上班族的經典技倆。","th":3,"lv":1},{"p":"take a mental health day","zh":"請心理健康假","scene":"有時候只是需要休息一天。","en":"I'm taking a mental health day. I need to rest.","tr":"我要請一天心理健康假，我需要休息。","tip":"<b>用法：</b>因為壓力大而請假。","th":3,"lv":2},{"p":"burnout","zh":"倦怠、精疲力竭","scene":"Alex 讀到快燃燒殆盡。","en":"Working seventy hours a week leads to burnout.","tr":"一週工作七十小時會導致倦怠。","tip":"<b>延伸：</b>burned out 形容詞。","th":4,"lv":1},{"p":"have a breakdown","zh":"崩潰","scene":"Alex 終於撐不住了。","en":"She had a breakdown after the exam.","tr":"她考完試後崩潰了。","tip":"<b>延伸：</b>nervous breakdown 精神崩潰。","th":4,"lv":1},{"p":"cut oneself some slack","zh":"對自己寬容一點","scene":"心理師要 Alex 別那麼逼自己。","en":"You've been working so hard. Cut yourself some slack.","tr":"你一直很努力，對自己寬容一點。","tip":"<b>用法：</b>勸人別太苛責自己。","th":6,"lv":2},{"p":"pressure cooker","zh":"高壓環境","scene":"學校就像一個快爆炸的壓力鍋。","en":"That office is a pressure cooker.","tr":"那間辦公室是個高壓環境。","tip":"<b>畫面：</b>壓力鍋。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Manny · Luke","plot":"Gloria 跟另一位媽媽起衝突；Manny 和 Luke 跟雙胞胎約會。","items":[{"p":"clash with","zh":"跟某人起衝突","scene":"Gloria 跟另一位媽媽槓上。","en":"My opinions often clash with my dad's.","tr":"我的看法常常跟我爸衝突。","tip":"<b>延伸：</b>colors clash 顏色不搭。","th":5,"lv":1},{"p":"double date","zh":"兩對情侶一起約會","scene":"兩個男孩跟雙胞胎一起約會。","en":"Let's go on a double date this weekend.","tr":"我們這週末來個四人約會吧。","tip":"<b>用法：</b>兩對情侶一起出去。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 和鄰居","who":"Mitchell · 新鄰居","plot":"Mitchell 認識了一位很注重環保的新鄰居。","items":[{"p":"eco-friendly","zh":"環保的","scene":"鄰居什麼都講究環保。","en":"We switched to eco-friendly bags.","tr":"我們改用環保袋了。","tip":"<b>同義：</b>environmentally friendly。","th":9,"lv":1},{"p":"carbon footprint","zh":"碳足跡","scene":"鄰居很在意自己的碳排放。","en":"Taking the train reduces your carbon footprint.","tr":"搭火車能減少你的碳足跡。","tip":"<b>用法：</b>環保議題常見的詞。","th":8,"lv":2}]}],"prompts":["你曾經壓力大到崩潰嗎（用 have a breakdown、burnout、cut oneself some slack）","你請過病假或心理健康假嗎（用 call in sick、take a mental health day、pressure cooker）","你在生活中做過什麼環保的事（用 eco-friendly、carbon footprint、clash with）"],"challenges":[{"id":"c1","sit":"朋友工作太累，你勸他請一天假休息。","uses":["take a mental health day"],"ans":"Take a mental health day."},{"id":"c2","sit":"弟弟學測沒考好很自責，你叫他對自己寬容一點。","uses":["cut oneself some slack"],"ans":"Cut yourself some slack."},{"id":"c3","sit":"你跟女朋友說這週末跟另一對情侶一起出去。","uses":["double date"],"ans":"Let's go on a double date."},{"id":"c4","sit":"你跟朋友說你在努力減少碳足跡。","uses":["carbon footprint"],"ans":"I'm trying to reduce my carbon footprint."}]},"s05e13":{"title":"Three Dinners","lede":"三場晚餐三種尷尬：Phil 和 Claire 帶 Haley 吃飯想談她的未來，結果被她反將一軍；Jay 的老朋友 Shorty 和太太 Darlene 來訪，帶來 Jay 不想聽的消息；Mitchell 和 Cam 的浪漫晚餐因為兩人刻意避開婚禮和 Lily 的話題而變得很怪，還跟隔壁桌交上朋友。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley","plot":"爸媽想跟 Haley 好好談未來，結果話題被她整個扭轉。","items":[{"p":"turn the tables","zh":"扭轉局勢、反將一軍","scene":"Haley 把問題丟回給爸媽。","en":"He criticized me, so I turned the tables and asked about his grades.","tr":"他批評我，我就反過來問他的成績。","tip":"<b>畫面：</b>把桌子轉過來，攻守互換。","th":5,"lv":2},{"p":"give a lecture","zh":"說教","scene":"爸媽本來想好好說教一番。","en":"I asked one question and he gave me a lecture.","tr":"我只問一個問題，他就開始說教。","tip":"<b>延伸：</b>Don't lecture me. 別對我說教。","th":5,"lv":1},{"p":"find oneself","zh":"找到自我","scene":"Haley 還在摸索自己想要什麼。","en":"She traveled to India to find herself.","tr":"她去印度旅行，想找到自我。","tip":"<b>語氣：</b>有時帶點調侃。","th":10,"lv":2},{"p":"take a gap year","zh":"休學一年（空檔年）","scene":"Haley 不確定要不要繼續讀書。","en":"I took a gap year to work in Australia.","tr":"我休了一年去澳洲打工。","tip":"<b>文化：</b>高中畢業或大學期間的空檔年。","th":3,"lv":1},{"p":"what's next","zh":"下一步是什麼","scene":"爸媽想知道 Haley 接下來的計畫。","en":"You graduated! So, what's next?","tr":"你畢業了！所以下一步是什麼？","tip":"<b>用法：</b>問未來計畫的常用句。","th":7,"lv":1}]},{"id":"jay","name":"Jay 和老朋友","who":"Jay · Shorty · Darlene","plot":"老朋友帶來一個讓 Jay 心裡不太舒服的消息。","items":[{"p":"not what I wanted to hear","zh":"不是我想聽的","scene":"Jay 對這個消息很不滿意。","en":"The doctor said I need surgery. Not what I wanted to hear.","tr":"醫生說我要開刀，這不是我想聽的。","tip":"<b>用法：</b>聽到壞消息的反應。","th":7,"lv":1},{"p":"move away","zh":"搬走","scene":"老朋友的生活要有大改變。","en":"My best friend is moving away to Kaohsiung.","tr":"我最好的朋友要搬去高雄了。","tip":"<b>用法：</b>搬到別的城市。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人約好不談婚禮和孩子，結果整頓飯都很怪，最後跟隔壁桌聊了起來。","items":[{"p":"change the subject","zh":"轉移話題","scene":"兩人一直刻意換話題。","en":"Whenever I ask about her ex, she changes the subject.","tr":"每次我問她前任的事，她就轉移話題。","tip":"<b>用法：</b>避開不想聊的事。","th":10,"lv":1},{"p":"strike up a conversation","zh":"主動搭話","scene":"兩人跟隔壁桌聊了起來。","en":"I struck up a conversation with the guy next to me on the train.","tr":"我在火車上跟隔壁的人聊了起來。","tip":"<b>用法：</b>跟陌生人開啟對話。","th":10,"lv":2},{"p":"talk shop","zh":"聊工作上的事","scene":"約會時本來應該不聊工作。","en":"No talking shop at dinner, please.","tr":"吃飯時拜託別聊工作。","tip":"<b>用法：</b>工作以外的場合談公事。","th":3,"lv":2}]}],"prompts":["你對未來的計畫（用 what's next、take a gap year、find oneself）","你曾經被人反將一軍嗎（用 turn the tables、give a lecture、change the subject）","你會主動跟陌生人聊天嗎（用 strike up a conversation、talk shop、move away）"],"challenges":[{"id":"c1","sit":"朋友問你畢業後的計畫，你說還在想下一步。","uses":["what's next"],"ans":"I'm still figuring out what's next."},{"id":"c2","sit":"下班和同事吃飯，你說拜託別再聊工作的事。","uses":["talk shop"],"ans":"No talking shop, please."},{"id":"c3","sit":"媽媽一直問你有沒有女朋友，你趕快轉移話題。","uses":["change the subject"],"ans":"I changed the subject."},{"id":"c4","sit":"你跟朋友說你想休一年去打工度假。","uses":["take a gap year"],"ans":"I want to take a gap year."}]},"s05e14":{"title":"iSpy","lede":"Claire 和 Phil 懷疑孩子們有事瞞著他們，叫 Alex 去監視 Haley，結果意外發現 Haley 辦了攝影展；Mitchell 想對 Cam 隱瞞一個八卦，卻怎麼也藏不住；Gloria 覺得 Jay 夢到了別的女人。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Alex · Haley","plot":"爸媽派 Alex 當間諜，結果發現 Haley 的秘密才華。","items":[{"p":"spy on","zh":"監視、偷看","scene":"Alex 被派去監視姊姊。","en":"My little brother always spies on me.","tr":"我弟總是偷看我在做什麼。","tip":"<b>用法：</b>spy on + 人。","th":10,"lv":1},{"p":"double agent","zh":"雙面間諜","scene":"Alex 夾在爸媽和姊姊之間。","en":"Are you on my side or are you a double agent?","tr":"你是站我這邊，還是雙面間諜？","tip":"<b>用法：</b>玩笑地說兩邊討好的人。","th":9,"lv":2},{"p":"a hidden talent","zh":"隱藏的才華","scene":"Haley 原來很會拍照。","en":"Wow, you can sing! That's a hidden talent.","tr":"哇，你會唱歌！這是隱藏的才華。","tip":"<b>用法：</b>大家不知道的能力。","th":9,"lv":1},{"p":"photo exhibition","zh":"攝影展","scene":"Haley 偷偷辦了攝影展。","en":"My friend is having a photo exhibition next month.","tr":"我朋友下個月要辦攝影展。","tip":"<b>延伸：</b>exhibition 展覽。","th":8,"lv":1},{"p":"suspicious","zh":"可疑的","scene":"爸媽覺得孩子們的行為很可疑。","en":"He's acting suspicious. What's he hiding?","tr":"他的行為很可疑，他在藏什麼？","tip":"<b>用法：</b>形容人或事讓人起疑。","th":9,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 聽到一個八卦，答應不說，卻忍得很痛苦。","items":[{"p":"juicy gossip","zh":"勁爆八卦","scene":"Mitchell 知道了一個超勁爆的消息。","en":"I've got some juicy gossip about our boss.","tr":"我有一個關於老闆的勁爆八卦。","tip":"<b>用法：</b>juicy 多汁的，形容很精彩。","th":2,"lv":2},{"p":"can't keep a secret","zh":"守不住秘密","scene":"Mitchell 實在藏不住。","en":"Don't tell him. He can't keep a secret.","tr":"別跟他說，他守不住秘密。","tip":"<b>用法：</b>形容大嘴巴的人。","th":10,"lv":1},{"p":"be dying to tell","zh":"很想說出來","scene":"Mitchell 憋得好難受。","en":"I'm dying to tell you, but I promised.","tr":"我超想告訴你，但我答應過了。","tip":"<b>用法：</b>be dying to + V，非常想做。","th":4,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Gloria 懷疑 Jay 夢裡有別的女人，越想越吃醋。","items":[{"p":"dream about","zh":"夢到","scene":"Gloria 很在意 Jay 夢到誰。","en":"I dreamed about my old school last night.","tr":"我昨晚夢到以前的學校。","tip":"<b>延伸：</b>dream of 嚮往。","th":8,"lv":1},{"p":"in your dreams","zh":"你做夢吧","scene":"有人只能在夢裡想想。","en":"You think I'll do your laundry? In your dreams!","tr":"你以為我會幫你洗衣服？你做夢吧！","tip":"<b>語氣：</b>拒絕不切實際的要求。","th":7,"lv":2}]}],"prompts":["你有什麼隱藏的才華（用 a hidden talent、photo exhibition、spy on）","你守得住秘密嗎（用 can't keep a secret、be dying to tell、juicy gossip）","你最近做了什麼奇怪的夢（用 dream about、in your dreams、suspicious）"],"challenges":[{"id":"c1","sit":"同梯叫你幫他打掃一週，你說你做夢吧。","uses":["in your dreams"],"ans":"In your dreams!"},{"id":"c2","sit":"你跟朋友說有一個勁爆八卦。","uses":["juicy gossip"],"ans":"I've got some juicy gossip."},{"id":"c3","sit":"你發現室友會畫畫，說那是他隱藏的才華。","uses":["a hidden talent"],"ans":"That's a hidden talent!"},{"id":"c4","sit":"你跟朋友說別告訴阿明，他守不住秘密。","uses":["can't keep a secret"],"ans":"He can't keep a secret."}]},"s05e15":{"title":"The Feud","lede":"在 Luke 的摔角比賽上，Jay、Phil 和 Luke 發現自己生活中幾個討人厭的傢伙原來是一家人；Claire 被 Lily 傳染了頭蝨，因為 Mitchell 和 Cam 沒提醒她；Haley 和 Alex 跟一隻負鼠大戰；Manny 在博物館校外教學被 Gloria 弄得很尷尬。","stories":[{"id":"jay","name":"Jay、Phil 和 Luke","who":"Jay · Phil · Luke","plot":"三代男人發現他們各自的死對頭竟然是同一家人。","items":[{"p":"family feud","zh":"家族恩怨","scene":"兩家之間結下了樑子。","en":"The two families have had a feud for years.","tr":"兩家之間的恩怨已經好幾年了。","tip":"<b>延伸：</b>同名美國益智節目。","th":5,"lv":2},{"p":"bad blood","zh":"宿怨、仇恨","scene":"兩邊的人互看不順眼。","en":"There's bad blood between those two teams.","tr":"那兩隊之間有宿怨。","tip":"<b>延伸：</b>Taylor Swift 的歌名。","th":5,"lv":2},{"p":"bury the hatchet","zh":"和解、言歸於好","scene":"也許兩家該化敵為友。","en":"It's been years. Let's bury the hatchet.","tr":"都好幾年了，我們和解吧。","tip":"<b>畫面：</b>把斧頭埋起來，不再開戰。","th":6,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Haley · Alex · Mitchell · Cameron","plot":"Claire 被傳染頭蝨，兩個弟弟沒先通知她；姊妹倆在家跟負鼠大戰。","items":[{"p":"give someone a heads-up","zh":"先提醒某人","scene":"Mitchell 和 Cam 忘了先說。","en":"Thanks for the heads-up about the traffic.","tr":"謝謝你先提醒我塞車的事。","tip":"<b>用法：</b>Just a heads-up, … 先跟你說一聲。","th":7,"lv":1},{"p":"itchy","zh":"癢的","scene":"頭蝨讓人癢得受不了。","en":"My head is so itchy.","tr":"我的頭好癢。","tip":"<b>延伸：</b>itch 癢（名詞、動詞）。","th":8,"lv":1},{"p":"nitpick","zh":"吹毛求疵","scene":"有頭蝨的人得一根一根抓蝨卵。","en":"Stop nitpicking my essay. It's fine.","tr":"別再挑我作文的毛病了，寫得很好啊。","tip":"<b>字源：</b>nit 是蝨卵，抓蝨卵引申為挑小毛病。","th":5,"lv":2},{"p":"play possum","zh":"裝死","scene":"負鼠遇到危險會裝死。","en":"When my mom called me, I played possum and didn't answer.","tr":"我媽打給我時，我裝死不接。","tip":"<b>由來：</b>負鼠遇到危險會假死。","th":10,"lv":2},{"p":"critter","zh":"小動物（口語）","scene":"姊妹倆跟小動物纏鬥。","en":"There's a critter living in our garage.","tr":"有隻小動物住在我們的車庫。","tip":"<b>用法：</b>creature 的口語、可愛說法。","th":8,"lv":2}]},{"id":"mitch","name":"Manny 的校外教學","who":"Manny · Gloria","plot":"Gloria 跟著去當陪同家長，讓 Manny 在同學面前超尷尬。","items":[{"p":"chaperone","zh":"陪同的家長或監護人","scene":"Gloria 是校外教學的陪同家長。","en":"My mom was a chaperone on our school trip.","tr":"我媽是我們校外教學的陪同家長。","tip":"<b>用法：</b>學校活動的隨行大人。","th":2,"lv":2},{"p":"cringe","zh":"尷尬到起雞皮疙瘩","scene":"Manny 尷尬到想躲起來。","en":"I cringe when I see my old photos.","tr":"看到我以前的照片我就尷尬到不行。","tip":"<b>用法：</b>形容詞 cringey 很尷尬的。","th":4,"lv":1}]}],"prompts":["你遇過有宿怨的人嗎（用 bad blood、family feud、bury the hatchet）","你看過最尷尬的家長行為（用 cringe、chaperone、give someone a heads-up）","你在家遇過小動物闖入嗎（用 critter、play possum、itchy）"],"challenges":[{"id":"c1","sit":"你媽傳訊息叫你回電，你裝死沒回。","uses":["play possum"],"ans":"I just played possum."},{"id":"c2","sit":"你提醒隊友明天練球要提早到。","uses":["give someone a heads-up"],"ans":"Just a heads-up, practice starts early tomorrow."},{"id":"c3","sit":"你看到自己國中的大頭照，說尷尬到不行。","uses":["cringe"],"ans":"I cringe every time I see it."},{"id":"c4","sit":"兩個好朋友冷戰了好久，你勸他們和解。","uses":["bury the hatchet"],"ans":"Just bury the hatchet, guys."}]},"s05e16":{"title":"Spring-a-Ding-Fling","lede":"Haley 不情不願地陪 Phil 去參加房仲頒獎晚宴；一位很受歡迎的西班牙文老師回來後，Cam 覺得自己被冷落，只好找 Claire 幫忙；Luke 和 Alex 各自去約會；Mitchell 誤解了新老闆的暗示；Gloria 和 Jay 幫忙顧 Lily。","stories":[{"id":"dunphy","name":"Phil 和 Haley","who":"Phil · Haley","plot":"Haley 陪爸爸參加頒獎晚宴，父女倆意外成了好搭檔。","items":[{"p":"awards banquet","zh":"頒獎晚宴","scene":"Phil 要參加房仲業的晚宴。","en":"The company holds an awards banquet every year.","tr":"公司每年都會舉辦頒獎晚宴。","tip":"<b>延伸：</b>banquet 正式的宴會。","th":8,"lv":2},{"p":"tag-team","zh":"搭檔合作","scene":"父女倆在晚宴上合作無間。","en":"My sister and I tag-teamed to convince our parents.","tr":"我和我姊聯手說服爸媽。","tip":"<b>來源：</b>摔角的雙人搭檔。","th":10,"lv":2}]},{"id":"mitch","name":"Cam 和 Claire","who":"Cameron · Claire","plot":"新老師一回來，Cam 就被冷落了，只好求助 Claire。","items":[{"p":"feel like an outsider","zh":"覺得自己是外人","scene":"Cam 覺得在學校被排擠。","en":"At my first family dinner with her, I felt like an outsider.","tr":"第一次跟她家人吃飯，我覺得自己像外人。","tip":"<b>用法：</b>融不進團體時。","th":4,"lv":1},{"p":"a little help from my friends","zh":"朋友的一點幫忙","scene":"Cam 需要朋友拉一把。","en":"I got through it with a little help from my friends.","tr":"靠著朋友們的幫忙，我撐過去了。","tip":"<b>延伸：</b>披頭四的歌名。","th":2,"lv":2}]},{"id":"kids","name":"孩子們的約會","who":"Luke · Alex","plot":"兩個孩子都去參加學校舞會。","items":[{"p":"school dance","zh":"學校舞會","scene":"兩人各自有約會。","en":"Are you going to the school dance on Friday?","tr":"你星期五要去學校舞會嗎？","tip":"<b>文化：</b>美國高中常見的舞會活動。","th":3,"lv":1},{"p":"corsage","zh":"手腕花","scene":"舞會的經典配件。","en":"He gave his date a corsage before the dance.","tr":"他在舞會前送舞伴一朵手腕花。","tip":"<b>文化：</b>男生送女伴戴在手腕上的花。","th":8,"lv":2}]},{"id":"jay","name":"Mitchell 的新老闆","who":"Mitchell · 新老闆","plot":"Mitchell 誤解了老闆的暗示，搞得很尷尬。","items":[{"p":"misread the situation","zh":"誤判情勢","scene":"Mitchell 會錯意了。","en":"I misread the situation and said the wrong thing.","tr":"我誤判了情勢，說錯了話。","tip":"<b>用法：</b>搞錯氣氛或意思。","th":10,"lv":1},{"p":"pick up on","zh":"察覺到（暗示）","scene":"Mitchell 沒有察覺到真正的意思。","en":"She didn't pick up on my hints.","tr":"她沒察覺到我的暗示。","tip":"<b>用法：</b>注意到細微的訊號。","th":10,"lv":1},{"p":"take a hint","zh":"聽懂暗示","scene":"有人就是不懂暗示。","en":"I yawned five times, but he didn't take the hint.","tr":"我打了五次哈欠，他還是沒聽懂暗示。","tip":"<b>用法：</b>Take a hint! 你懂我意思吧！","th":7,"lv":1},{"p":"be all ears","zh":"洗耳恭聽","scene":"Mitchell 很認真聽老闆說話。","en":"You have a plan? I'm all ears.","tr":"你有計畫？我洗耳恭聽。","tip":"<b>用法：</b>表示很想聽。","th":7,"lv":1}]}],"prompts":["你曾經覺得自己是外人嗎（用 feel like an outsider、a little help from my friends、tag-team）","你參加過舞會或晚宴嗎（用 school dance、corsage、awards banquet）","你曾經誤解過別人的暗示嗎（用 misread the situation、pick up on、take a hint）"],"challenges":[{"id":"c1","sit":"朋友說他有一個去日本自助旅行的計畫，你說洗耳恭聽。","uses":["be all ears"],"ans":"I'm all ears."},{"id":"c2","sit":"你一直看手錶，朋友還是不懂你想走。","uses":["take a hint"],"ans":"He didn't take the hint."},{"id":"c3","sit":"你和弟弟聯手說服爸媽讓你們養狗。","uses":["tag-team"],"ans":"We tag-teamed our parents."},{"id":"c4","sit":"你第一次參加女朋友家的聚會，覺得自己像外人。","uses":["feel like an outsider"],"ans":"I felt like an outsider."}]},"s05e17":{"title":"Other People's Children","lede":"Jay 開始教 Luke 做木工；Claire 和 Gloria 陪 Lily 挑婚禮花童的禮服；Cam、Mitchell 帶 Alex 和 Manny 去博物館過一個文化日；Phil 幫 Andy 拍一支給女朋友的紀念日影片。","stories":[{"id":"jay","name":"Jay 和 Luke","who":"Jay · Luke","plot":"Jay 把自己的木工手藝傳給 Luke。","items":[{"p":"work with one's hands","zh":"動手做事","scene":"Jay 喜歡用手做東西。","en":"I like jobs where I can work with my hands.","tr":"我喜歡可以動手做的工作。","tip":"<b>用法：</b>手工、勞力的工作。","th":3,"lv":1},{"p":"pass down","zh":"傳承下去","scene":"Jay 把手藝傳給孫子。","en":"This recipe was passed down from my grandmother.","tr":"這道食譜是我奶奶傳下來的。","tip":"<b>用法：</b>家族技藝、物品的傳承。","th":2,"lv":1},{"p":"patience is a virtue","zh":"耐心是美德","scene":"做木工需要耐心。","en":"Wait for your turn. Patience is a virtue.","tr":"等你的順序，耐心是美德。","tip":"<b>用法：</b>勸人耐心等待。","th":6,"lv":2}]},{"id":"dunphy","name":"挑禮服","who":"Claire · Gloria · Lily","plot":"兩個大人帶 Lily 挑花童禮服，選擇多到挑不完。","items":[{"p":"say yes to the dress","zh":"選定禮服","scene":"Lily 要挑到完美的那件。","en":"She tried on twenty dresses before she said yes to the dress.","tr":"她試了二十件才選定禮服。","tip":"<b>延伸：</b>美國婚紗節目的名字。","th":8,"lv":2},{"p":"one of a kind","zh":"獨一無二","scene":"每件禮服都想要很特別。","en":"This necklace is one of a kind.","tr":"這條項鍊是獨一無二的。","tip":"<b>用法：</b>形容很特別的人或物。","th":9,"lv":1},{"p":"spoiled for choice","zh":"選擇多到難以決定","scene":"選擇太多反而很難挑。","en":"There are so many restaurants here. I'm spoiled for choice.","tr":"這裡餐廳太多了，我不知道選哪家。","tip":"<b>用法：</b>選擇多的「幸福煩惱」。","th":9,"lv":2}]},{"id":"mitch","name":"博物館之旅","who":"Cameron · Mitchell · Alex · Manny","plot":"兩個大人帶兩個孩子去博物館，想陶冶藝術氣息。","items":[{"p":"culture vulture","zh":"熱愛藝文活動的人","scene":"Manny 和 Alex 很愛藝術文化。","en":"My aunt is a culture vulture. She goes to every museum.","tr":"我阿姨熱愛藝文活動，每間博物館都去。","tip":"<b>字面：</b>文化禿鷹，帶點幽默。","th":9,"lv":2},{"p":"go over someone's head","zh":"太深奧聽不懂","scene":"有些藝術品大家看不懂。","en":"The lecture went over my head.","tr":"那場演講我完全聽不懂。","tip":"<b>用法：</b>內容超出理解範圍。","th":9,"lv":2}]},{"id":"kids","name":"Phil 和 Andy","who":"Phil · Andy","plot":"Phil 幫 Andy 拍一支浪漫影片送女朋友。","items":[{"p":"from the heart","zh":"發自內心","scene":"影片要真心誠意。","en":"Your speech was from the heart. Everyone loved it.","tr":"你的致詞發自內心，大家都很喜歡。","tip":"<b>用法：</b>真誠的話或禮物。","th":6,"lv":1},{"p":"sappy","zh":"肉麻的、太煽情","scene":"影片可能有點太肉麻。","en":"The movie was a little sappy, but I cried.","tr":"那部電影有點太煽情，但我哭了。","tip":"<b>同義：</b>cheesy，但更偏感傷。","th":9,"lv":2}]}],"prompts":["你家傳下來的東西或手藝（用 pass down、work with one's hands、patience is a virtue）","你逛街時會選擇困難嗎（用 spoiled for choice、one of a kind、say yes to the dress）","你看過讓你看不懂的藝術作品嗎（用 go over someone's head、culture vulture、from the heart）"],"challenges":[{"id":"c1","sit":"長官講的戰術太深奧，你說完全聽不懂。","uses":["go over someone's head"],"ans":"It went over my head."},{"id":"c2","sit":"你在夜市不知道要吃什麼，說選擇太多了。","uses":["spoiled for choice"],"ans":"I'm spoiled for choice."},{"id":"c3","sit":"你跟朋友說你家的滷肉配方是阿嬤傳下來的。","uses":["pass down"],"ans":"It was passed down from my grandma."},{"id":"c4","sit":"朋友拍的告白影片太肉麻了。","uses":["sappy"],"ans":"It's a little sappy."}]},"s05e18":{"title":"Las Vegas","lede":"大人們一起去拉斯維加斯，Jay 一心想拿到最好的房間；Cam 參加了 Mitchell 前任的單身派對；Gloria 偷偷藏著一座女版的狗管家雕像；Phil 則努力想加入一個神秘又高級的魔術協會。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 想升級房間；Gloria 藏了一個 Jay 絕對不會喜歡的東西。","items":[{"p":"what happens in Vegas stays in Vegas","zh":"在拉斯維加斯發生的事就留在那裡","scene":"這趟旅行的潛規則。","en":"Don't tell anyone. What happens in Vegas stays in Vegas.","tr":"別告訴別人，在維加斯發生的事就留在那裡。","tip":"<b>用法：</b>旅行時的玩笑話。","th":10,"lv":2},{"p":"upgrade","zh":"升等","scene":"Jay 想要升級到最好的房間。","en":"We got a free upgrade to a suite.","tr":"我們免費升等到套房。","tip":"<b>用法：</b>飯店、機位、手機方案。","th":8,"lv":1},{"p":"hit the jackpot","zh":"中大獎、走大運","scene":"大家都想在賭城中頭獎。","en":"I hit the jackpot with this apartment. It's cheap and big.","tr":"我找到這間公寓真是走大運，又便宜又大。","tip":"<b>用法：</b>也可比喻運氣超好。","th":10,"lv":2},{"p":"high roller","zh":"豪賭客、出手闊綽的人","scene":"賭場最歡迎大手筆的客人。","en":"The casino gave the high rollers free rooms.","tr":"賭場給豪賭客免費房間。","tip":"<b>用法：</b>花錢很大方的人。","th":9,"lv":2},{"p":"roll the dice","zh":"冒險一試","scene":"有時候就要賭一把。","en":"I don't know if it'll work, but let's roll the dice.","tr":"我不知道行不行，但我們賭一把吧。","tip":"<b>用法：</b>冒險做決定。","th":10,"lv":2},{"p":"lose one's shirt","zh":"輸到脫褲子、賠光","scene":"賭城最怕輸光。","en":"He lost his shirt in the stock market.","tr":"他在股市賠光了。","tip":"<b>用法：</b>輸掉很多錢。","th":3,"lv":2}]},{"id":"mitch","name":"Cam 和單身派對","who":"Cameron · Mitchell","plot":"Cam 去參加 Mitchell 前任的單身派對。","items":[{"p":"bachelor party","zh":"單身派對","scene":"婚前的最後狂歡。","en":"We're throwing him a bachelor party in Kenting.","tr":"我們要在墾丁幫他辦單身派對。","tip":"<b>延伸：</b>bachelorette party 女生的單身派對。","th":8,"lv":1}]},{"id":"dunphy","name":"Phil 和魔術協會","who":"Phil","plot":"Phil 一心想加入一個只限受邀者的神秘魔術協會。","items":[{"p":"invitation-only","zh":"僅限受邀者","scene":"這個協會不是誰都能進。","en":"The party is invitation-only.","tr":"這場派對僅限受邀者參加。","tip":"<b>用法：</b>高級、私密的活動。","th":8,"lv":1},{"p":"secret handshake","zh":"秘密握手","scene":"神秘組織都有自己的暗號。","en":"My friends and I have a secret handshake.","tr":"我和朋友有個秘密的握手方式。","tip":"<b>用法：</b>小團體的專屬暗號。","th":2,"lv":2},{"p":"beat the odds","zh":"克服困難、打敗機率","scene":"Phil 想克服萬難加入。","en":"She beat the odds and recovered fully.","tr":"她克服困難，完全康復了。","tip":"<b>延伸：</b>odds 機率。","th":10,"lv":2}]}],"prompts":["你最想去的旅行地點（用 what happens in Vegas stays in Vegas、upgrade、bachelor party）","你曾經冒險賭一把嗎（用 roll the dice、hit the jackpot、lose one's shirt）","你曾經克服很大的困難嗎（用 beat the odds、invitation-only、secret handshake）"],"challenges":[{"id":"c1","sit":"你訂的飯店免費升等，跟朋友炫耀。","uses":["upgrade"],"ans":"We got a free upgrade!"},{"id":"c2","sit":"你跟朋友說你租到便宜又大的房子，走大運了。","uses":["hit the jackpot"],"ans":"I hit the jackpot."},{"id":"c3","sit":"你不確定辭職創業會不會成功，但想賭一把。","uses":["roll the dice"],"ans":"I'll just roll the dice."},{"id":"c4","sit":"你跟快結婚的好友說大家要幫他辦單身派對。","uses":["bachelor party"],"ans":"We're throwing you a bachelor party."}]},"s05e19":{"title":"A Hard Jay's Night","lede":"Cam 的爸爸親手做了婚禮蛋糕上的人偶，醜得不得了，Mitchell 不敢說出真心話；Phil 幫 Gloria 賣她的舊公寓，兩人卻在美髮沙龍被耽擱了；Jay 只想跟家人好好過一個溫馨的晚上。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Cam 的爸爸","plot":"婚禮蛋糕人偶醜到不行，Mitchell 只能硬撐著笑。","items":[{"p":"cake topper","zh":"蛋糕頂端的裝飾人偶","scene":"Cam 的爸爸親手做了蛋糕人偶。","en":"The cake topper looked nothing like us.","tr":"那個蛋糕人偶一點都不像我們。","tip":"<b>文化：</b>婚禮蛋糕上的新人小人偶。","th":8,"lv":2},{"p":"grin and bear it","zh":"苦笑著忍受","scene":"Mitchell 只能忍著。","en":"I hate the uniform, but I just have to grin and bear it.","tr":"我討厭這套制服，但只能忍著。","tip":"<b>用法：</b>沒辦法只好接受。","th":6,"lv":2},{"p":"put on a brave face","zh":"強顏歡笑","scene":"Mitchell 假裝很喜歡。","en":"She put on a brave face at the funeral.","tr":"她在葬禮上強忍悲傷。","tip":"<b>用法：</b>裝作沒事、很堅強。","th":4,"lv":2}]},{"id":"dunphy","name":"Phil 和 Gloria","who":"Phil · Gloria","plot":"Phil 幫 Gloria 賣舊公寓，兩人中途跑去做頭髮，整個行程大亂。","items":[{"p":"get sidetracked","zh":"分心、偏離正題","scene":"兩人一下就被別的事吸引了。","en":"I was studying but got sidetracked by my phone.","tr":"我本來在讀書，結果被手機分心了。","tip":"<b>用法：</b>做事時被其他事情打斷。","th":10,"lv":1},{"p":"get one's hair done","zh":"去做頭髮","scene":"兩人跑去美髮沙龍。","en":"I'm getting my hair done before the wedding.","tr":"婚禮前我要去做頭髮。","tip":"<b>用法：</b>由別人幫你剪燙染。","th":8,"lv":1},{"p":"market value","zh":"市場價值、行情價","scene":"Phil 要評估公寓的行情。","en":"What's the market value of your car?","tr":"你的車行情價多少？","tip":"<b>用法：</b>房子、車子、二手物品。","th":3,"lv":1},{"p":"drag one's feet","zh":"拖拖拉拉","scene":"Gloria 其實不太想賣。","en":"Stop dragging your feet and sign the contract.","tr":"別再拖拖拉拉，快簽合約。","tip":"<b>畫面：</b>拖著腳走路，不情願。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · 全家","plot":"Jay 只想全家安安靜靜吃頓好飯。","items":[{"p":"a quiet night in","zh":"在家安靜的夜晚","scene":"Jay 想要平靜的家庭時光。","en":"I'm too tired to go out. Let's have a quiet night in.","tr":"我太累了不想出門，在家安靜過一晚吧。","tip":"<b>對比：</b>a night out 出去玩的夜晚。","th":8,"lv":1},{"p":"home-cooked meal","zh":"家常菜","scene":"Jay 想吃一頓家常飯。","en":"I miss my mom's home-cooked meals.","tr":"我好想念我媽煮的家常菜。","tip":"<b>用法：</b>相對於外食。","th":8,"lv":1},{"p":"it's the little things","zh":"幸福來自小事","scene":"Jay 珍惜簡單的時光。","en":"He made me coffee every morning. It's the little things.","tr":"他每天早上幫我泡咖啡，幸福就是這些小事。","tip":"<b>用法：</b>感謝生活中的小細節。","th":1,"lv":1}]}],"prompts":["你曾經強顏歡笑過嗎（用 put on a brave face、grin and bear it、cake topper）","你做事會容易分心嗎（用 get sidetracked、drag one's feet、get one's hair done）","你理想中的週末夜晚（用 a quiet night in、home-cooked meal、it's the little things）"],"challenges":[{"id":"c1","sit":"你跟朋友說你好想念媽媽煮的菜。","uses":["home-cooked meal"],"ans":"I miss my mom's home-cooked meals."},{"id":"c2","sit":"你讀書讀到一半被 IG 分心了。","uses":["get sidetracked"],"ans":"I got sidetracked by Instagram."},{"id":"c3","sit":"每天站哨很累，但你說只能忍著。","uses":["grin and bear it"],"ans":"I just have to grin and bear it."},{"id":"c4","sit":"朋友一直拖著不去報名，你叫他別拖了。","uses":["drag one's feet"],"ans":"Stop dragging your feet."}]},"s05e20":{"title":"Australia","lede":"全家去澳洲旅行，Phil 要完成媽媽的遺願，去看看自己是在哪裡「開始」的，卻一路被拒絕；Jay 和 Claire 讓工作吃掉了假期；Mitchell 和 Cam 跟一位老朋友重逢。","stories":[{"id":"dunphy","name":"Phil 的任務","who":"Phil · Claire","plot":"Phil 一心要完成媽媽的心願，到處找地方卻四處碰壁。","items":[{"p":"down under","zh":"澳洲（口語）","scene":"全家飛到地球另一端的澳洲。","en":"We're going down under for Christmas!","tr":"我們要去澳洲過聖誕節！","tip":"<b>由來：</b>澳洲在地球的南半球「下面」。","th":8,"lv":2},{"p":"G'day","zh":"你好（澳洲口語）","scene":"澳洲人的招呼語。","en":"G'day, mate! How are you going?","tr":"你好啊老兄！最近怎樣？","tip":"<b>用法：</b>澳洲口音的 Good day。","th":7,"lv":2},{"p":"a wild goose chase","zh":"白忙一場、徒勞無功","scene":"Phil 到處找，卻一直撲空。","en":"The address was wrong. It was a wild goose chase.","tr":"地址是錯的，害我們白忙一場。","tip":"<b>畫面：</b>追一隻野鵝，怎麼追都追不到。","th":10,"lv":2},{"p":"no luck","zh":"沒成功、運氣不好","scene":"Phil 一次又一次碰壁。","en":"I tried to get tickets, but no luck.","tr":"我試著買票，但沒買到。","tip":"<b>用法：</b>簡短回答「沒成功」。","th":7,"lv":1},{"p":"off the beaten path","zh":"人煙罕至、冷門的地方","scene":"Phil 要去的地方很偏僻。","en":"We stayed in a village off the beaten path.","tr":"我們住在一個很冷門的小村莊。","tip":"<b>用法：</b>旅行時找不熱門的景點。","th":8,"lv":2}]},{"id":"jay","name":"Jay 和 Claire","who":"Jay · Claire","plot":"父女倆度假還一直在工作。","items":[{"p":"jet lag","zh":"時差","scene":"長途飛行後大家都有時差。","en":"I had terrible jet lag after flying to New York.","tr":"飛到紐約後我時差很嚴重。","tip":"<b>形容詞：</b>jet-lagged 有時差的。","th":8,"lv":1},{"p":"all work and no play","zh":"只工作不玩樂","scene":"兩人連度假都在工作。","en":"All work and no play makes Jack a dull boy.","tr":"只工作不玩樂，聰明孩子也會變傻。","tip":"<b>用法：</b>勸人要放鬆。","th":3,"lv":2},{"p":"work-life balance","zh":"工作與生活的平衡","scene":"兩人都需要學會平衡。","en":"This company has a great work-life balance.","tr":"這家公司的工作生活平衡很好。","tip":"<b>用法：</b>找工作時的重要考量。","th":3,"lv":1},{"p":"out of office","zh":"不在辦公室、休假中","scene":"他們應該要設定休假模式。","en":"I'm out of office until Monday.","tr":"我星期一之前都在休假。","tip":"<b>延伸：</b>Email 的自動回覆通知。","th":3,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · 老朋友","plot":"兩人在澳洲遇到多年不見的老朋友。","items":[{"p":"long time no see","zh":"好久不見","scene":"老朋友重逢。","en":"Hey! Long time no see!","tr":"嘿！好久不見！","tip":"<b>用法：</b>其實來自中文「好久不見」的直譯。","th":7,"lv":1}]}],"prompts":["你最想去的國外旅行地點（用 down under、jet lag、off the beaten path）","你曾經白忙一場嗎（用 a wild goose chase、no luck、G'day）","你理想中的工作與生活平衡（用 work-life balance、all work and no play、out of office）"],"challenges":[{"id":"c1","sit":"你在路上遇到國中同學，說好久不見。","uses":["long time no see"],"ans":"Long time no see!"},{"id":"c2","sit":"你從日本回來時差很嚴重。","uses":["jet lag"],"ans":"I've got terrible jet lag."},{"id":"c3","sit":"你們找一家網路推薦的小吃，結果店早就關了，白忙一場。","uses":["a wild goose chase"],"ans":"It was a wild goose chase."},{"id":"c4","sit":"你說你找工作很重視工作生活平衡。","uses":["work-life balance"],"ans":"Work-life balance matters to me."}]},"s05e21":{"title":"Sleeper","lede":"Phil 唯一的任務是待在家等修理工，結果沒做到，只好編出一個超複雜的謊來瞞 Claire，壓力大到身體都出狀況；Gloria 為了全家福照片走火入魔；Claire 指責 Cam 太高傲，不肯用她女兒們的舊衣服；Jay 偷偷幫 Stella 報名狗狗選美。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Phil 搞砸了一件小事，為了掩飾越陷越深，壓力大到睡著了都不安穩。","items":[{"p":"cover story","zh":"掩飾的說法","scene":"Phil 編了一套說詞。","en":"He came up with a cover story to explain where he was.","tr":"他編了一套說詞來解釋他去了哪裡。","tip":"<b>用法：</b>用來掩蓋真相的故事。","th":10,"lv":2},{"p":"dig oneself into a hole","zh":"越陷越深","scene":"謊言越說越難圓。","en":"Stop talking. You're digging yourself into a hole.","tr":"別說了，你越說越糟。","tip":"<b>畫面：</b>自己挖洞越挖越深。","th":10,"lv":2},{"p":"stress out","zh":"壓力很大、焦慮","scene":"Phil 緊張到不行。","en":"Don't stress out about the exam.","tr":"別為了考試壓力那麼大。","tip":"<b>形容詞：</b>stressed out 壓力很大的。","th":4,"lv":1},{"p":"sleepwalk","zh":"夢遊","scene":"壓力太大讓 Phil 睡不好。","en":"My brother used to sleepwalk when he was little.","tr":"我弟小時候會夢遊。","tip":"<b>用法：</b>也比喻「渾渾噩噩地過」。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay · Stella","plot":"Gloria 對全家福要求完美；Jay 偷偷讓 Stella 去參加狗展。","items":[{"p":"perfectionist","zh":"完美主義者","scene":"Gloria 什麼都要完美。","en":"I'm a bit of a perfectionist. I check everything twice.","tr":"我有點完美主義，什麼都要檢查兩次。","tip":"<b>用法：</b>面試時常被拿來當「缺點」。","th":9,"lv":1},{"p":"best in show","zh":"全場最佳","scene":"Jay 想讓 Stella 拿冠軍。","en":"Our dog won best in show!","tr":"我們的狗拿了全場最佳！","tip":"<b>來源：</b>狗展的最高獎項。","th":9,"lv":2},{"p":"a dog person","zh":"愛狗的人","scene":"Jay 是標準的狗派。","en":"Are you a dog person or a cat person?","tr":"你是狗派還是貓派？","tip":"<b>延伸：</b>cat person 貓派。","th":9,"lv":1}]},{"id":"mitch","name":"Claire 和 Cam","who":"Claire · Cameron · Lily","plot":"Claire 想把舊衣服給 Lily，Cam 卻嫌不夠好。","items":[{"p":"hand-me-downs","zh":"別人穿過的舊衣服","scene":"Claire 想把女兒的舊衣服給 Lily。","en":"I grew up wearing my brother's hand-me-downs.","tr":"我從小穿我哥的舊衣服長大。","tip":"<b>用法：</b>兄姊傳給弟妹的東西。","th":2,"lv":1},{"p":"snob","zh":"勢利眼、自視甚高的人","scene":"Claire 覺得 Cam 太挑剔。","en":"Don't be a snob. Cheap food can be delicious.","tr":"別那麼勢利，便宜的食物也可以很好吃。","tip":"<b>延伸：</b>food snob 對食物很挑剔的人。","th":9,"lv":2},{"p":"secondhand","zh":"二手的","scene":"Cam 不太想用二手的東西。","en":"I bought a secondhand bike for 500 dollars.","tr":"我花五百塊買了一台二手腳踏車。","tip":"<b>延伸：</b>secondhand smoke 二手菸。","th":8,"lv":1}]}],"prompts":["你說過最難圓的謊（用 cover story、dig oneself into a hole、stress out）","你是完美主義者嗎（用 perfectionist、best in show、sleepwalk）","你會買二手的東西嗎（用 secondhand、hand-me-downs、snob）"],"challenges":[{"id":"c1","sit":"朋友問你是狗派還是貓派。","uses":["a dog person"],"ans":"Are you a dog person or a cat person?"},{"id":"c2","sit":"朋友在女朋友面前越解釋越糟，你叫他別說了。","uses":["dig oneself into a hole"],"ans":"Stop talking. You're digging yourself into a hole."},{"id":"c3","sit":"你跟朋友說你小時候都穿表哥的舊衣服。","uses":["hand-me-downs"],"ans":"I wore my cousin's hand-me-downs."},{"id":"c4","sit":"你叫表妹別為了期末考壓力那麼大。","uses":["stress out"],"ans":"Don't stress out."}]},"s05e22":{"title":"Message Received","lede":"Jay、Gloria 和 Manny 互相挑戰對方跳出舒適圈；Mitchell 和 Cam 的婚禮越辦越大、越來越貴，只好忍痛賣掉珍藏的東西；孩子們則聯手整了 Phil 和 Claire 一把。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"三個人互相挑戰，做平常絕對不會做的事。","items":[{"p":"I dare you","zh":"我敢說你不敢","scene":"三人互相下戰帖。","en":"I dare you to eat that ghost pepper.","tr":"我賭你不敢吃那根鬼椒。","tip":"<b>延伸：</b>Truth or dare 真心話大冒險。","th":7,"lv":1},{"p":"push one's limits","zh":"挑戰極限","scene":"每個人都被逼著突破自己。","en":"Running a marathon really pushed my limits.","tr":"跑馬拉松真的挑戰了我的極限。","tip":"<b>用法：</b>運動、學習、工作都可以。","th":10,"lv":1},{"p":"out of character","zh":"不像平常的自己","scene":"大家都做了很不像自己的事。","en":"It's out of character for him to be late.","tr":"他會遲到很不像他。","tip":"<b>對比：</b>stay in character 是維持角色。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"婚禮預算爆了，兩人得忍痛割捨珍藏品。","items":[{"p":"cut back","zh":"減少、縮減","scene":"兩人要開始省錢。","en":"I'm trying to cut back on sugar.","tr":"我在努力減少吃糖。","tip":"<b>用法：</b>cut back on + 東西。","th":8,"lv":1},{"p":"tighten one's belt","zh":"勒緊褲帶、節省開支","scene":"婚禮費用逼兩人過苦日子。","en":"We need to tighten our belts this month.","tr":"我們這個月得勒緊褲帶。","tip":"<b>畫面：</b>吃少了，皮帶要拉緊。","th":3,"lv":2},{"p":"sell off","zh":"賣掉、出清","scene":"兩人賣掉珍藏的東西。","en":"He sold off his comic collection to pay for the trip.","tr":"他賣掉漫畫收藏來付旅費。","tip":"<b>用法：</b>大量賣掉東西。","th":3,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"孩子們 · Phil · Claire","plot":"三個孩子聯手整爸媽。","items":[{"p":"play a prank on","zh":"惡作劇","scene":"孩子們設計整爸媽。","en":"We played a prank on our teacher on April Fools' Day.","tr":"我們愚人節整了老師。","tip":"<b>名詞：</b>prank 惡作劇。","th":2,"lv":1},{"p":"practical joke","zh":"惡作劇","scene":"孩子們的整人計畫。","en":"He loves practical jokes. Be careful.","tr":"他很愛惡作劇，你小心點。","tip":"<b>用法：</b>真的動手做的玩笑。","th":2,"lv":2},{"p":"get someone back","zh":"報復、扳回一城","scene":"爸媽會不會反擊？","en":"He pranked me, so I'm going to get him back.","tr":"他整我，所以我要報復回去。","tip":"<b>用法：</b>以牙還牙。","th":5,"lv":1},{"p":"touché","zh":"說得好、被你說中了","scene":"被反將一軍時只能認了。","en":"Touché. You got me there.","tr":"說得好，被你說中了。","tip":"<b>來源：</b>法文，西洋劍「被刺中了」。","th":7,"lv":2}]}],"prompts":["你做過最挑戰極限的事（用 push one's limits、I dare you、out of character）","你需要省錢的時候怎麼做（用 cut back、tighten one's belt、sell off）","你整過人或被整過嗎（用 play a prank on、practical joke、get someone back）"],"challenges":[{"id":"c1","sit":"朋友說你不敢吃臭豆腐，你接受挑戰。","uses":["I dare you"],"ans":"He said, \"I dare you.\" So I ate it."},{"id":"c2","sit":"你跟朋友說這個月要勒緊褲帶。","uses":["tighten one's belt"],"ans":"I need to tighten my belt this month."},{"id":"c3","sit":"室友整你，你說你一定會報復回去。","uses":["get someone back"],"ans":"I'll get him back."},{"id":"c4","sit":"朋友吐槽你，你只能說被你說中了。","uses":["touché"],"ans":"Touché."}]},"s05e23":{"title":"The Wedding (Part 1)","lede":"Mitchell 和 Cam 的婚禮當天終於到了，偏偏狀況百出；Jay 和 Gloria 給 Cam 的爸媽感情建議，事情卻往意想不到的方向發展；Phil 和 Claire 跟孩子們更認識彼此；Haley 則被捲入一對情侶的分手風波。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"大日子來了，所有能出錯的事情好像都出錯了。","items":[{"p":"something old, something new","zh":"新娘的好運傳統","scene":"婚禮的經典傳統。","en":"Something old, something new, something borrowed, something blue.","tr":"舊的、新的、借的、藍色的東西各一件。","tip":"<b>文化：</b>西方新娘婚禮當天的祝福傳統。","th":1,"lv":2},{"p":"go off without a hitch","zh":"順利進行","scene":"兩人只希望婚禮順順利利。","en":"The ceremony went off without a hitch.","tr":"典禮順利完成。","tip":"<b>延伸：</b>hitch 是小障礙。","th":10,"lv":2},{"p":"Murphy's law","zh":"莫非定律","scene":"會出錯的事就一定會出錯。","en":"It's Murphy's law. It always rains on my day off.","tr":"這就是莫非定律，我放假就下雨。","tip":"<b>用法：</b>凡是可能出錯的事就會出錯。","th":9,"lv":2},{"p":"hope for the best, prepare for the worst","zh":"抱最好的希望，做最壞的打算","scene":"婚禮當天大家都很緊張。","en":"We hope for the best but prepare for the worst.","tr":"我們抱最好的希望，做最壞的打算。","tip":"<b>用法：</b>面對不確定時的態度。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家和 Cam 的爸媽","who":"Jay · Gloria · Cam 的爸媽","plot":"Jay 和 Gloria 想給 Cam 的爸媽一點婚姻建議。","items":[{"p":"the secret to a happy marriage","zh":"幸福婚姻的秘訣","scene":"Jay 和 Gloria 分享自己的經驗。","en":"My grandma says the secret to a happy marriage is laughing together.","tr":"我奶奶說幸福婚姻的秘訣是一起笑。","tip":"<b>用法：</b>婚禮致詞常見主題。","th":1,"lv":1},{"p":"work at it","zh":"用心經營","scene":"婚姻需要經營。","en":"Relationships are hard. You have to work at it.","tr":"感情很難，你得用心經營。","tip":"<b>用法：</b>需要持續努力的事。","th":1,"lv":1},{"p":"a rough patch","zh":"一段低潮期","scene":"Cam 的爸媽感情正處於低潮。","en":"Every couple goes through a rough patch.","tr":"每對情侶都會經歷低潮期。","tip":"<b>用法：</b>感情、工作的困難時期。","th":1,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · 孩子們","plot":"婚禮混亂中，Haley 被一對吵著要分手的情侶夾在中間。","items":[{"p":"caught in the middle","zh":"夾在中間","scene":"Haley 被捲進別人的感情問題。","en":"When my parents fight, I'm always caught in the middle.","tr":"我爸媽吵架時，我總是夾在中間。","tip":"<b>用法：</b>兩邊都不好得罪的處境。","th":5,"lv":1},{"p":"get to know","zh":"認識、了解","scene":"Phil 和 Claire 趁機更了解孩子們。","en":"I'd love to get to know your family better.","tr":"我很想多認識你的家人。","tip":"<b>用法：</b>get to know + 人，慢慢了解。","th":2,"lv":1},{"p":"fall apart","zh":"崩潰、瓦解","scene":"有人的感情在婚禮上瓦解了。","en":"Their plan fell apart at the last minute.","tr":"他們的計畫在最後一刻瓦解了。","tip":"<b>延伸：</b>I'm falling apart. 我快崩潰了。","th":10,"lv":1}]}],"prompts":["你參加過最順利或最混亂的婚禮（用 go off without a hitch、Murphy's law、something old, something new）","你覺得幸福婚姻的秘訣是什麼（用 the secret to a happy marriage、work at it、a rough patch）","你曾經被夾在兩個人之間嗎（用 caught in the middle、fall apart、hope for the best, prepare for the worst）"],"challenges":[{"id":"c1","sit":"你去海邊玩那天剛好下大雨，你說這就是莫非定律。","uses":["Murphy's law"],"ans":"It's Murphy's law."},{"id":"c2","sit":"連上晚會順利結束，你說一切順利。","uses":["go off without a hitch"],"ans":"It went off without a hitch."},{"id":"c3","sit":"兩個朋友吵架都找你抱怨，你說你夾在中間。","uses":["caught in the middle"],"ans":"I'm caught in the middle."},{"id":"c4","sit":"朋友跟女朋友最近感情不好，你說每對情侶都會有低潮。","uses":["a rough patch"],"ans":"Every couple goes through a rough patch."}]},"s05e24":{"title":"The Wedding (Part 2)","lede":"第五季最後一集，婚禮一路出狀況，Pepper 臨時找到新場地，把整場婚禮和賓客搬過去；Jay 和 Gloria 成功說服 Cam 的爸媽不要分開；Mitchell 和 Cam 終於說出「我願意」。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Pepper","plot":"場地出了問題，Pepper 救援成功，兩人終於完成婚禮。","items":[{"p":"change of venue","zh":"換場地","scene":"婚禮臨時換地方。","en":"Due to the rain, there's a change of venue.","tr":"因為下雨，活動換場地了。","tip":"<b>用法：</b>活動通知的常見說法。","th":8,"lv":1},{"p":"save the day","zh":"力挽狂瀾","scene":"Pepper 救了這場婚禮。","en":"The goalkeeper saved the day.","tr":"守門員力挽狂瀾。","tip":"<b>用法：</b>在關鍵時刻解決問題。","th":10,"lv":2},{"p":"walk down the aisle","zh":"走紅毯、結婚","scene":"兩人終於走上紅毯。","en":"She walked down the aisle with her father.","tr":"她挽著爸爸的手走紅毯。","tip":"<b>用法：</b>也直接比喻「結婚」。","th":1,"lv":2},{"p":"exchange vows","zh":"交換誓詞","scene":"婚禮最感人的時刻。","en":"They exchanged vows on the beach.","tr":"他們在海邊交換誓詞。","tip":"<b>延伸：</b>wedding vows 結婚誓詞。","th":1,"lv":1},{"p":"I do","zh":"我願意","scene":"婚禮的關鍵一句。","en":"When the priest asked, he said, \"I do.\"","tr":"牧師問他時，他說「我願意」。","tip":"<b>用法：</b>婚禮誓詞的回答。","th":1,"lv":1},{"p":"happily ever after","zh":"從此過著幸福快樂的日子","scene":"童話般的結局。","en":"And they lived happily ever after.","tr":"從此他們過著幸福快樂的日子。","tip":"<b>用法：</b>童話故事的結尾。","th":1,"lv":1},{"p":"better late than never","zh":"遲到總比不到好","scene":"婚禮雖然延誤，但終於完成了。","en":"You finally got your license? Better late than never!","tr":"你終於考到駕照了？遲到總比沒到好！","tip":"<b>用法：</b>事情晚了但還是做到了。","th":7,"lv":1}]},{"id":"jay","name":"Jay 家和 Cam 的爸媽","who":"Jay · Gloria · Cam 的爸媽","plot":"Jay 和 Gloria 勸 Cam 的爸媽不要放棄彼此。","items":[{"p":"give it another shot","zh":"再試一次","scene":"Jay 和 Gloria 勸兩人再給彼此一次機會。","en":"It didn't work last time, but let's give it another shot.","tr":"上次沒成功，但我們再試一次吧。","tip":"<b>對比：</b>give it a shot 是試試看；another shot 是再試一次。","th":6,"lv":1},{"p":"stick together","zh":"團結在一起","scene":"家人要互相扶持。","en":"No matter what happens, we stick together.","tr":"不管發生什麼事，我們都要團結。","tip":"<b>用法：</b>家人、朋友、團隊之間。","th":2,"lv":1},{"p":"through thick and thin","zh":"不論順境逆境","scene":"婚姻就是要同甘共苦。","en":"My best friend has been there through thick and thin.","tr":"我最好的朋友不論好壞都一直在我身邊。","tip":"<b>用法：</b>形容長久的支持。","th":2,"lv":2}]}],"prompts":["你參加婚禮最感動的時刻（用 walk down the aisle、exchange vows、I do）","一個關鍵時刻救援成功的經驗（用 save the day、change of venue、better late than never）","一個不論好壞都在你身邊的人（用 through thick and thin、stick together、happily ever after）"],"challenges":[{"id":"c1","sit":"你終於考過駕照，朋友說遲到總比不到好。","uses":["better late than never"],"ans":"Better late than never!"},{"id":"c2","sit":"學長在演習中力挽狂瀾。","uses":["save the day"],"ans":"He saved the day."},{"id":"c3","sit":"你跟大學死黨說畢業後也要團結在一起。","uses":["stick together"],"ans":"Let's stick together after graduation."},{"id":"c4","sit":"你說你最好的朋友不論順境逆境都挺你。","uses":["through thick and thin"],"ans":"He's been there through thick and thin."}]},"s06e01":{"title":"The Long Honeymoon","lede":"第六季開場，新婚的 Cam 拼命想維持浪漫，不想讓蜜月期結束；Gloria 和 Jay 討論改造造型；Dunphy 家迎接暑假尾聲，Alex 從人道志工之旅回來後，家裡又熱鬧起來。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 不想讓新婚的甜蜜感消失，費盡心思維持浪漫。","items":[{"p":"honeymoon phase","zh":"蜜月期","scene":"Cam 想讓蜜月期永遠不結束。","en":"They're still in the honeymoon phase. They do everything together.","tr":"他們還在蜜月期，什麼都一起做。","tip":"<b>用法：</b>感情、新工作的美好初期。","th":1,"lv":2},{"p":"keep the spark alive","zh":"保持火花、維持熱情","scene":"Cam 努力維持兩人的浪漫。","en":"Date nights help keep the spark alive.","tr":"約會之夜有助於保持感情的火花。","tip":"<b>用法：</b>長期感情的經營。","th":1,"lv":2},{"p":"newlyweds","zh":"新婚夫妻","scene":"兩人剛結婚。","en":"The newlyweds went to Bali for their honeymoon.","tr":"這對新婚夫妻去峇里島度蜜月。","tip":"<b>延伸：</b>newly 剛剛 + wed 結婚。","th":1,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"兩人討論要不要來個全新造型。","items":[{"p":"makeover","zh":"大改造","scene":"造型大改造。","en":"She got a total makeover before the wedding.","tr":"她在婚禮前來了一次大改造。","tip":"<b>用法：</b>外表、房間都可以改造。","th":8,"lv":1},{"p":"a new look","zh":"新造型","scene":"換個新樣子試試。","en":"I'm trying a new look. What do you think?","tr":"我在嘗試新造型，你覺得怎樣？","tip":"<b>用法：</b>髮型、穿著、裝潢。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Alex","plot":"暑假快結束了，Alex 帶著滿滿的改變世界熱情回家。","items":[{"p":"back to reality","zh":"回到現實","scene":"假期結束，生活回到正軌。","en":"Vacation is over. Back to reality.","tr":"假期結束了，回到現實。","tip":"<b>用法：</b>放完假、收假時說。","th":7,"lv":1},{"p":"the calm before the storm","zh":"暴風雨前的寧靜","scene":"平靜的日子即將結束。","en":"The office is quiet today. It's the calm before the storm.","tr":"辦公室今天很安靜，是暴風雨前的寧靜。","tip":"<b>用法：</b>大事來臨前的平靜。","th":9,"lv":2},{"p":"volunteer abroad","zh":"出國當志工","scene":"Alex 剛結束海外志工之旅。","en":"She volunteered abroad in Cambodia last summer.","tr":"她去年夏天去柬埔寨當志工。","tip":"<b>延伸：</b>volunteer 志工、自願。","th":8,"lv":1},{"p":"make a difference","zh":"帶來改變、有所貢獻","scene":"Alex 想改變世界。","en":"I want to do a job that makes a difference.","tr":"我想做一份能帶來改變的工作。","tip":"<b>用法：</b>對社會、對他人有影響。","th":10,"lv":1},{"p":"self-righteous","zh":"自以為是正義的","scene":"Alex 回家後有點說教。","en":"Don't be so self-righteous. You're not perfect either.","tr":"別那麼自以為正義，你也不完美。","tip":"<b>用法：</b>形容愛說教、覺得自己道德高尚的人。","th":9,"lv":2}]}],"prompts":["你理想中的感情怎麼保持新鮮感（用 honeymoon phase、keep the spark alive、newlyweds）","你最近想換的新造型（用 makeover、a new look、back to reality）","你想做什麼能帶來改變的事（用 make a difference、volunteer abroad、self-righteous）"],"challenges":[{"id":"c1","sit":"收假回營區，你跟同梯說回到現實了。","uses":["back to reality"],"ans":"Back to reality."},{"id":"c2","sit":"你剪了新髮型，問朋友覺得怎樣。","uses":["a new look"],"ans":"I'm trying a new look. What do you think?"},{"id":"c3","sit":"你說畢業後想做一份能帶來改變的工作。","uses":["make a difference"],"ans":"I want to make a difference."},{"id":"c4","sit":"演習前一天營區很安靜，你說是暴風雨前的寧靜。","uses":["the calm before the storm"],"ans":"It's the calm before the storm."}]},"s06e02":{"title":"Do Not Push","lede":"Gloria 和 Jay 在糾結週年禮物要送有紀念價值的還是昂貴的；Dunphy 一家參觀加州理工學院，Alex 開始重新思考要讀哪間大學；Mitchell 和 Cam 想拍一張新的全家福。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"週年紀念禮物到底要走心還是走金？","items":[{"p":"price tag","zh":"價格","scene":"禮物的價格不是重點？","en":"I love this jacket, but look at the price tag!","tr":"我很愛這件外套，但你看看價格！","tip":"<b>用法：</b>東西的價錢。","th":3,"lv":1},{"p":"splurge","zh":"揮霍、大手筆花一次","scene":"Jay 想乾脆大手筆一點。","en":"I splurged on a nice dinner for her birthday.","tr":"她生日時我大手筆請了一頓好的。","tip":"<b>用法：</b>偶爾花大錢犒賞。","th":3,"lv":2},{"p":"money can't buy","zh":"錢買不到的","scene":"最珍貴的禮物錢買不到。","en":"Money can't buy happiness.","tr":"錢買不到快樂。","tip":"<b>用法：</b>Money can't buy love. 也很常見。","th":9,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Alex · Phil · Claire","plot":"參觀了頂尖理工學院，Alex 開始懷疑自己的選擇。","items":[{"p":"dream school","zh":"夢想中的學校","scene":"Alex 在想哪裡才是她的夢想學校。","en":"My dream school is NTU.","tr":"我的夢想學校是台大。","tip":"<b>用法：</b>最想讀的學校。","th":3,"lv":1},{"p":"a perfect fit","zh":"完全適合","scene":"什麼學校最適合 Alex？","en":"This job is a perfect fit for you.","tr":"這份工作完全適合你。","tip":"<b>用法：</b>人與工作、學校、衣服的契合。","th":9,"lv":1},{"p":"brainy","zh":"很聰明、腦袋很好","scene":"校園裡都是聰明人。","en":"Everyone at that school is so brainy.","tr":"那所學校的每個人都好聰明。","tip":"<b>用法：</b>比 smart 更口語。","th":9,"lv":1},{"p":"rethink","zh":"重新思考","scene":"Alex 開始重新考慮。","en":"I need to rethink my plans after the army.","tr":"我得重新思考退伍後的計畫。","tip":"<b>用法：</b>改變想法前的思考。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人想拍一張完美的新全家福。","items":[{"p":"photoshop","zh":"修圖","scene":"照片可能需要修一下。","en":"Did you photoshop this picture? You look so tall!","tr":"這張照片你有修圖嗎？你看起來好高！","tip":"<b>用法：</b>品牌名變成動詞。","th":8,"lv":1},{"p":"candid","zh":"自然的、偷拍的（照片）","scene":"自然的照片反而更好看。","en":"I prefer candid photos to posed ones.","tr":"我比較喜歡自然的照片，不喜歡擺拍。","tip":"<b>用法：</b>candid shot 抓拍。","th":8,"lv":2},{"p":"matching outfits","zh":"同款服裝","scene":"全家穿一樣的衣服拍照。","en":"My family wore matching outfits for the photo.","tr":"我們全家穿同款衣服拍照。","tip":"<b>用法：</b>情侶裝、親子裝。","th":8,"lv":1}]}],"prompts":["你送禮物會重心意還是重價格（用 price tag、splurge、money can't buy）","你的夢想學校或工作（用 dream school、a perfect fit、rethink）","你喜歡擺拍還是自然的照片（用 candid、photoshop、matching outfits）"],"challenges":[{"id":"c1","sit":"你看到一雙很貴的球鞋，說看看這價格。","uses":["price tag"],"ans":"Look at the price tag!"},{"id":"c2","sit":"你說領到第一筆年終獎金要大手筆吃一頓好的。","uses":["splurge"],"ans":"I'm going to splurge on a nice dinner."},{"id":"c3","sit":"朋友的 IG 照片太完美，你問他有沒有修圖。","uses":["photoshop"],"ans":"Did you photoshop this?"},{"id":"c4","sit":"你覺得某個工作很適合你的朋友。","uses":["a perfect fit"],"ans":"It's a perfect fit for you."}]},"s06e03":{"title":"The Cold","lede":"Phil 感冒了，差點毀了他幫兩個小舅子拍的婚禮影片計畫；Jay、Gloria 和 Cam 對 Manny 進高中美式足球隊意見分歧；Mitchell 跟 Lily 的天才朋友 Sydney 結下了樑子。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Phil 感冒了，還想硬撐著把事情做完。","items":[{"p":"catch a cold","zh":"感冒","scene":"Phil 感冒了。","en":"I caught a cold from my roommate.","tr":"我被室友傳染感冒了。","tip":"<b>用法：</b>get a cold 也可以。","th":8,"lv":1},{"p":"runny nose","zh":"流鼻水","scene":"Phil 鼻水流不停。","en":"I have a runny nose and a sore throat.","tr":"我流鼻水又喉嚨痛。","tip":"<b>延伸：</b>stuffy nose 鼻塞。","th":8,"lv":1},{"p":"germaphobe","zh":"潔癖、怕細菌的人","scene":"有人超怕被傳染。","en":"My roommate is a germaphobe. He cleans his desk every hour.","tr":"我室友超怕細菌，每小時都擦桌子。","tip":"<b>用法：</b>形容很怕髒、怕細菌的人。","th":9,"lv":2},{"p":"power through","zh":"硬撐過去","scene":"Phil 決定帶病撐過去。","en":"I was tired, but I powered through and finished the run.","tr":"我很累，但還是撐完全程。","tip":"<b>用法：</b>不舒服或很累時繼續做。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家和 Cam","who":"Jay · Gloria · Cameron · Manny","plot":"Manny 進了美式足球隊，三個大人對他該不該上場吵翻天。","items":[{"p":"make the team","zh":"入選球隊","scene":"Manny 進了球隊。","en":"I made the basketball team in high school.","tr":"我高中時入選了籃球隊。","tip":"<b>用法：</b>通過選拔。","th":8,"lv":1},{"p":"benchwarmer","zh":"坐板凳的人、候補","scene":"Manny 可能只能坐板凳。","en":"I was a benchwarmer for my whole high school career.","tr":"我整個高中都在坐板凳。","tip":"<b>對比：</b>be benched 是被叫下場；benchwarmer 是常坐板凳的人。","th":8,"lv":2},{"p":"playing time","zh":"上場時間","scene":"大家在爭 Manny 的上場時間。","en":"He's not getting much playing time this season.","tr":"他這季上場時間不多。","tip":"<b>用法：</b>運動比賽用語。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 和 Sydney","who":"Mitchell · Lily · Sydney","plot":"Mitchell 碰上 Lily 的天才朋友，處處被比下去。","items":[{"p":"child prodigy","zh":"神童","scene":"Sydney 是個小天才。","en":"Mozart was a child prodigy.","tr":"莫札特是神童。","tip":"<b>用法：</b>很小就展現驚人天分的孩子。","th":9,"lv":2},{"p":"outsmart","zh":"比某人聰明、智取","scene":"Mitchell 想智取小天才。","en":"The fox outsmarted the hunters.","tr":"狐狸智取了獵人。","tip":"<b>用法：</b>用聰明打敗對方。","th":10,"lv":1},{"p":"meet one's match","zh":"遇到對手","scene":"Mitchell 終於遇到勁敵了。","en":"He's never lost at chess, but he met his match today.","tr":"他下棋從沒輸過，但今天遇到對手了。","tip":"<b>用法：</b>遇到旗鼓相當的人。","th":5,"lv":2}]}],"prompts":["你生病時會硬撐嗎（用 catch a cold、power through、runny nose）","你有參加過校隊嗎（用 make the team、benchwarmer、playing time）","你遇過比你還聰明的小孩嗎（用 child prodigy、outsmart、meet one's match）"],"challenges":[{"id":"c1","sit":"你跟主管說你感冒了，一直流鼻水。","uses":["catch a cold","runny nose"],"ans":"I caught a cold. I have a runny nose."},{"id":"c2","sit":"行軍很累，你說要硬撐過去。","uses":["power through"],"ans":"I'll just power through."},{"id":"c3","sit":"你下棋輸給一個國小生，說遇到對手了。","uses":["meet one's match"],"ans":"I met my match."},{"id":"c4","sit":"你室友超怕細菌，每天消毒。","uses":["germaphobe"],"ans":"He's such a germaphobe."}]},"s06e04":{"title":"Marco Polo","lede":"Dunphy 一家暫時搬進飯店住；Manny 跟一個比他大又很受歡迎的女生約會；Cam 擔心 Mitchell 出現會破壞他球隊的連勝紀錄。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 孩子們","plot":"一家人暫住飯店，一開始很興奮，後來越住越悶。","items":[{"p":"room service","zh":"客房服務","scene":"住飯店就是要叫客房服務。","en":"Let's order room service and watch movies.","tr":"我們叫客房服務來看電影吧。","tip":"<b>用法：</b>飯店的送餐服務。","th":8,"lv":1},{"p":"live out of a suitcase","zh":"住在行李箱裡（長期在外）","scene":"全家都靠一個行李箱過日子。","en":"I've been living out of a suitcase for a month.","tr":"我已經靠一個行李箱過一個月了。","tip":"<b>用法：</b>長時間出差、旅行。","th":8,"lv":2},{"p":"cabin fever","zh":"悶在室內太久的煩躁","scene":"一家人關在房間裡快悶壞了。","en":"After three rainy days at home, I have cabin fever.","tr":"在家三天下雨，我快悶壞了。","tip":"<b>用法：</b>被困在室內太久。","th":4,"lv":2},{"p":"check in","zh":"入住、報到","scene":"全家去飯店報到。","en":"We can check in after 3 p.m.","tr":"我們下午三點後可以入住。","tip":"<b>延伸：</b>check out 退房。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Manny · Jay · Gloria","plot":"Manny 竟然跟一位比他大的風雲人物約會。","items":[{"p":"punch above one's weight","zh":"追到條件比自己好的對象","scene":"大家都覺得 Manny 高攀了。","en":"His girlfriend is amazing. He's really punching abov
