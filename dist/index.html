uke 鑽進房子底下的爬行空間；Haley 第三次考駕照，Claire 在旁邊緊張得要命。","items":[{"p":"creepy","zh":"毛毛的、令人發毛","scene":"房子底下又暗又窄，超陰森。","en":"This hallway is so creepy at night.","tr":"這條走廊晚上好陰森。","tip":"<b>延伸：</b>creep 當名詞是「怪人、噁男」。","th":9,"lv":1},{"p":"scared to death","zh":"嚇得半死","scene":"父子倆在底下都嚇得要命。","en":"I was scared to death when the lights went out.","tr":"燈熄掉的時候我嚇得半死。","tip":"<b>延伸：</b>scare the hell out of me 把我嚇壞了（比較粗）。","th":4,"lv":1},{"p":"third time's the charm","zh":"第三次一定成功","scene":"Haley 考了第三次終於過了。","en":"I failed twice, but third time's the charm.","tr":"我失敗兩次了，但第三次一定會成功。","tip":"<b>用法：</b>失敗兩次後自我打氣，或成功時說。","th":6,"lv":2},{"p":"behind the wheel","zh":"開車、坐在駕駛座","scene":"Haley 終於可以自己開車了。","en":"I get nervous when my dad is behind the wheel.","tr":"我爸開車的時候我會緊張。","tip":"<b>畫面：</b>wheel 指方向盤。","th":8,"lv":2},{"p":"nerve-racking","zh":"讓人很緊張的","scene":"坐在考駕照的車上真的很緊張。","en":"Waiting for the test results was so nerve-racking.","tr":"等考試結果真的超緊張。","tip":"<b>拼法：</b>也常寫成 nerve-wracking。","th":4,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Manny 怕坐雲霄飛車，Jay 帶他去面對恐懼。","items":[{"p":"face your fears","zh":"面對你的恐懼","scene":"Manny 想試著挑戰雲霄飛車。","en":"Sometimes you just have to face your fears.","tr":"有時候你就是得面對恐懼。","tip":"<b>延伸：</b>face the music 面對後果。","th":6,"lv":1},{"p":"chicken out","zh":"臨陣退縮、俗辣","scene":"排到一半，Manny 很想退出。","en":"I was going to bungee jump, but I chickened out.","tr":"我本來要高空彈跳，結果臨陣退縮了。","tip":"<b>語氣：</b>chicken 是「膽小鬼」，帶點嘲笑。","th":10,"lv":2},{"p":"suck it up","zh":"忍一下、硬撐過去","scene":"Jay 的作風就是叫人忍著點。","en":"It's only two more days. Just suck it up.","tr":"只剩兩天了，忍一下吧。","tip":"<b>語氣：</b>有點粗魯但很常用，朋友間 OK。","th":6,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 說的第一個字是「Mommy」，兩個爸爸心裡五味雜陳。","items":[{"p":"take it personally","zh":"往心裡去、覺得是針對自己","scene":"Mitchell 和 Cam 忍不住覺得很受傷。","en":"He's rude to everyone. Don't take it personally.","tr":"他對每個人都很沒禮貌，別往心裡去。","tip":"<b>用法：</b>Don't take it personally. 常用來安慰人。","th":6,"lv":1},{"p":"a milestone","zh":"里程碑、重要時刻","scene":"寶寶說出第一個字是人生里程碑。","en":"Getting my driver's license was a big milestone.","tr":"考到駕照是我人生的一個重要里程碑。","tip":"<b>用法：</b>寶寶第一次走路、畢業、退伍都可以說。","th":9,"lv":1}]}],"prompts":["一件讓你很害怕、但你最後面對了的事（用 face your fears、chicken out、scared to death）","你考駕照或考試的緊張經驗（用 nerve-racking、third time's the charm、behind the wheel）","你人生中的一個重要里程碑（用 a milestone、take it personally、suck it up）"],"challenges":[{"id":"c1","sit":"朋友約你去六福村玩大怒神，你說你應該會臨陣退縮。","uses":["chicken out"],"ans":"I'll probably chicken out at the last second."},{"id":"c2","sit":"你第三次考體能測驗前替自己打氣。","uses":["third time's the charm"],"ans":"Third time's the charm. I've got this."},{"id":"c3","sit":"客人心情不好對你很兇，打工的同事叫你別往心裡去。","uses":["take it personally"],"ans":"She's just in a bad mood. Don't take it personally."},{"id":"c4","sit":"行軍還有十公里，你跟同梯說忍一下就過了。","uses":["suck it up"],"ans":"Ten more kilometers. Just suck it up."}]},"s01e17":{"title":"Truth Be Told","lede":"Phil 的前女友 Denise 來家裡作客，Alex 還騙 Luke 說她是來把他帶走的；Jay 不小心害死了 Manny 的烏龜，想辦法掩飾；Mitchell 則決定在工作上說實話。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Alex · Luke · Denise","plot":"Phil 邀前女友 Denise 來家裡，她卻一直對 Phil 放電；Alex 趁機整 Luke，說 Denise 要把他帶走。","items":[{"p":"my ex","zh":"我的前任","scene":"Denise 是 Phil 的前女友。","en":"I ran into my ex at the supermarket.","tr":"我在超市遇到前任。","tip":"<b>延伸：</b>ex-boyfriend、ex-girlfriend 的口語簡稱。","th":1,"lv":1},{"p":"hit on","zh":"搭訕、對某人放電","scene":"Denise 一直對 Phil 示好。","en":"Was that guy hitting on you?","tr":"那個男的是不是在搭訕你？","tip":"<b>對比：</b>flirt with 是調情，hit on 比較直接。","th":1,"lv":1},{"p":"cross the line","zh":"越界、太過分","scene":"Denise 的行為已經超過了。","en":"Teasing is fine, but that crossed the line.","tr":"開玩笑沒關係，但那太過分了。","tip":"<b>用法：</b>You crossed the line. 你太過分了。","th":5,"lv":1},{"p":"mess with","zh":"捉弄、整人","scene":"Alex 故意整 Luke。","en":"Stop messing with me. Is it true or not?","tr":"別再整我了，到底是不是真的？","tip":"<b>延伸：</b>Don't mess with me. 別惹我。","th":5,"lv":1},{"p":"fall for it","zh":"上當、被騙","scene":"Luke 完全上當了。","en":"I told him it was a holiday, and he fell for it.","tr":"我跟他說今天放假，他就信了。","tip":"<b>延伸：</b>fall for someone 是愛上某人。","th":10,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny · Gloria","plot":"Jay 不小心害死了 Manny 的烏龜，不知道該怎麼開口。","items":[{"p":"cover up","zh":"掩蓋、隱瞞","scene":"Jay 想偷偷把事情蓋過去。","en":"He tried to cover up his mistake.","tr":"他想掩蓋自己的錯誤。","tip":"<b>名詞：</b>a cover-up 掩飾真相的行為。","th":10,"lv":1},{"p":"feel guilty","zh":"感到內疚","scene":"Jay 心裡很過意不去。","en":"I feel guilty for not calling my grandma more.","tr":"我很內疚沒有多打電話給奶奶。","tip":"<b>用法：</b>feel guilty about/for + 事情。","th":4,"lv":1},{"p":"keep it to yourself","zh":"別說出去","scene":"Jay 希望知道的人先保密。","en":"I'll tell you, but keep it to yourself.","tr":"我跟你說，但你別說出去。","tip":"<b>延伸：</b>Keep it between us. 這是我們之間的秘密。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 決定在工作上把真相說出來，不再忍氣吞聲。","items":[{"p":"honesty is the best policy","zh":"誠實為上策","scene":"Mitchell 最後選擇誠實。","en":"I told him I broke it. Honesty is the best policy.","tr":"我跟他說是我弄壞的，誠實為上策。","tip":"<b>用法：</b>諺語，日常也很常直接引用。","th":6,"lv":1},{"p":"speak up","zh":"說出來、大聲一點","scene":"Mitchell 終於鼓起勇氣說出自己的想法。","en":"If you disagree, speak up.","tr":"如果你不同意，就說出來。","tip":"<b>延伸：</b>Speak up, please. 也可以是「請大聲一點」。","th":10,"lv":1}]}],"prompts":["你被別人整、或你整過別人的經驗（用 mess with、fall for it、cross the line）","一件讓你很內疚的事（用 feel guilty、cover up、honesty is the best policy）","你曾經在團體裡說出不同意見嗎（用 speak up、keep it to yourself、hit on）"],"challenges":[{"id":"c1","sit":"室友騙你說明天整棟停水停電，你差點信了，跟他說別再整你了。","uses":["mess with","fall for it"],"ans":"Stop messing with me. I almost fell for it."},{"id":"c2","sit":"你告訴朋友一個秘密，叫他別說出去。","uses":["keep it to yourself"],"ans":"I'll tell you, but keep it to yourself."},{"id":"c3","sit":"朋友開玩笑開過頭，拿你家人來講，你說他太過分了。","uses":["cross the line"],"ans":"Okay, that crossed the line."},{"id":"c4","sit":"開會時主管的做法你不同意，朋友勸你直接說出來。","uses":["speak up"],"ans":"If you don't agree, you should speak up."}]},"s01e18":{"title":"Starry Night","lede":"Haley 和 Luke 的作業隔天要交，Claire 和 Phil 處理方式完全相反；Jay 帶 Mitchell 和 Manny 去看星星，Manny 一直嗆 Mitchell；Cam 則跟 Gloria 回她以前住的社區，想打破兩人之間的尷尬。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Haley · Luke","plot":"兩個孩子的作業都拖到最後一刻，Claire 和 Phil 各用自己的方法救火。","items":[{"p":"last minute","zh":"最後一刻","scene":"作業拖到前一天晚上才在趕。","en":"He always does his homework at the last minute.","tr":"他總是拖到最後一刻才寫作業。","tip":"<b>用法：</b>at the last minute；也可當形容詞 last-minute changes。","th":10,"lv":1},{"p":"pull an all-nighter","zh":"熬通宵","scene":"為了趕作業，可能要熬一整晚。","en":"I pulled an all-nighter to finish the report.","tr":"我熬通宵把報告做完。","tip":"<b>對比：</b>up all night 是整晚醒著；pull an all-nighter 是熬夜「做事」。","th":3,"lv":2},{"p":"cut corners","zh":"偷工減料、抄捷徑","scene":"為了趕快做完，難免想偷懶。","en":"Don't cut corners on safety.","tr":"安全的事不要偷工減料。","tip":"<b>畫面：</b>轉彎時抄內線，省了路但不按規矩。","th":3,"lv":2},{"p":"under pressure","zh":"有壓力、在壓力下","scene":"時間一緊，大家都很有壓力。","en":"I work better under pressure.","tr":"我在壓力下表現比較好。","tip":"<b>延伸：</b>Don't put pressure on me. 別給我壓力。","th":4,"lv":1}]},{"id":"jay","name":"Jay 的看星星之旅","who":"Jay · Mitchell · Manny","plot":"Jay 帶兩個人去看星星，Manny 一直嘴 Mitchell，三個人之間氣氛微妙。","items":[{"p":"make fun of","zh":"取笑","scene":"Manny 一路取笑 Mitchell。","en":"Stop making fun of my accent.","tr":"別再取笑我的口音了。","tip":"<b>對比：</b>tease 是逗弄；make fun of 比較偏嘲笑。","th":5,"lv":1},{"p":"get under someone's skin","zh":"惹惱某人","scene":"Manny 的話真的惹到 Mitchell 了。","en":"Don't let him get under your skin. He's just jealous.","tr":"別被他惹毛，他只是在嫉妒。","tip":"<b>畫面：</b>像刺鑽到皮膚底下，一直讓人不舒服。","th":4,"lv":2},{"p":"bond with","zh":"培養感情","scene":"Jay 想藉這趟旅程跟兒子們培養感情。","en":"Camping is a great way to bond with your kids.","tr":"露營是跟孩子培養感情的好方法。","tip":"<b>名詞：</b>father-son bonding 父子情誼時光。","th":2,"lv":1}]},{"id":"mitch","name":"Cam 和 Gloria","who":"Cameron · Gloria","plot":"Cam 想跟 Gloria 好好相處，兩人一起去她以前住的社區玩了一晚。","items":[{"p":"break the ice","zh":"打破僵局、破冰","scene":"Cam 想打破他和 Gloria 之間的尷尬。","en":"He told a joke to break the ice.","tr":"他講了個笑話來破冰。","tip":"<b>延伸：</b>icebreaker 破冰活動。","th":2,"lv":2},{"p":"get along","zh":"相處融洽","scene":"兩人想試著好好相處。","en":"Do you get along with your roommates?","tr":"你跟室友處得好嗎？","tip":"<b>搭配：</b>get along with + 人。","th":2,"lv":1},{"p":"a night out","zh":"出去玩的一晚","scene":"Cam 和 Gloria 一起出去玩了一整晚。","en":"We deserve a night out after this week.","tr":"這週這麼累，我們值得出去玩一晚。","tip":"<b>延伸：</b>girls' night out 姊妹夜。","th":8,"lv":1}]}],"prompts":["你拖到最後一刻才做的一件事（用 last minute、pull an all-nighter、under pressure）","你跟一個原本不熟的人變熟的過程（用 break the ice、get along、bond with）","有人一直惹你生氣時你怎麼辦（用 get under someone's skin、make fun of、a night out）"],"challenges":[{"id":"c1","sit":"你跟同學說期末報告你熬通宵才做完。","uses":["pull an all-nighter"],"ans":"I pulled an all-nighter to finish it."},{"id":"c2","sit":"第一次參加系上聯誼，大家都很安靜，你講了個笑話想破冰。","uses":["break the ice"],"ans":"I told a joke just to break the ice."},{"id":"c3","sit":"有人一直嘴你的身高，朋友叫你別被他惹毛。","uses":["get under someone's skin"],"ans":"Don't let him get under your skin."},{"id":"c4","sit":"你媽問你跟寢室的人處得好不好，你說很好。","uses":["get along"],"ans":"Yeah, we get along really well."}]},"s01e19":{"title":"Game Changer","lede":"Claire 在 iPad 上市當天搶著買給 Phil 當生日禮物；Gloria 和 Manny 為了不讓輸不起的 Jay 生氣，下棋時故意放水；Mitchell 懷疑自己保護不了家人；Cam 透過嬰兒監視器聽到鄰居夫妻的感情問題，忍不住插手。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Phil 超想要上市當天的 iPad，Claire 想給他驚喜，卻發現早就搶購一空。","items":[{"p":"sell out","zh":"賣完、搶購一空","scene":"上市第一天，店裡早就賣光了。","en":"The concert tickets sold out in five minutes.","tr":"演唱會門票五分鐘就賣光了。","tip":"<b>延伸：</b>sold out 售完；也可以指「出賣理想」。","th":3,"lv":1},{"p":"game changer","zh":"改變局面的東西","scene":"對 Phil 來說，iPad 是劃時代的發明。","en":"Online shopping was a game changer for small shops.","tr":"網購徹底改變了小商店的生態。","tip":"<b>用法：</b>形容改變遊戲規則的新東西或新做法。","th":9,"lv":2},{"p":"early adopter","zh":"搶先嘗鮮的人","scene":"Phil 就是那種新產品一出就要買的人。","en":"My dad is an early adopter. He has every new gadget.","tr":"我爸很愛嘗鮮，每種新產品他都有。","tip":"<b>延伸：</b>adopt 是採用，形容很早接受新科技的人。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 下棋輸不起，Gloria 和 Manny 只好偷偷讓他贏。","items":[{"p":"sore loser","zh":"輸不起的人","scene":"Jay 一輸就不高興。","en":"Don't be a sore loser. It's just a game.","tr":"別輸不起，只是遊戲而已。","tip":"<b>反義：</b>a good sport 有運動家精神的人。","th":9,"lv":2},{"p":"let someone win","zh":"故意讓某人贏","scene":"Gloria 和 Manny 故意放水。","en":"I always let my little brother win at video games.","tr":"我打電動時總是讓我弟贏。","tip":"<b>延伸：</b>Did you let me win? 你是不是故意讓我？","th":2,"lv":1},{"p":"go easy on","zh":"對某人手下留情","scene":"大家都決定對 Jay 手下留情。","en":"Go easy on him. It's his first day.","tr":"對他手下留情，今天是他第一天。","tip":"<b>用法：</b>Go easy on me. 也可以是「別對我太嚴」。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 懷疑自己能不能保護家人；Cam 從嬰兒監視器偷聽到鄰居吵架，忍不住插手管人家的感情事。","items":[{"p":"mind your own business","zh":"少管閒事","scene":"Mitchell 叫 Cam 不要管鄰居的事。","en":"Mind your own business. This has nothing to do with you.","tr":"少管閒事，這跟你沒關係。","tip":"<b>語氣：</b>直接說很不客氣，自我提醒時可以說 I'll mind my own business。","th":5,"lv":1},{"p":"eavesdrop","zh":"偷聽","scene":"Cam 透過監視器聽到鄰居的對話。","en":"I wasn't trying to eavesdrop, but they were so loud.","tr":"我不是故意偷聽，但他們太大聲了。","tip":"<b>用法：</b>eavesdrop on + 人。","th":10,"lv":2},{"p":"nosy","zh":"愛管閒事、好奇心太重","scene":"Cam 實在太愛管別人的事了。","en":"Our neighbor is so nosy. She asks about everything.","tr":"我們鄰居超八卦，什麼都要問。","tip":"<b>延伸：</b>Don't be nosy. 別那麼八卦。","th":9,"lv":1},{"p":"man of the house","zh":"一家之主","scene":"Mitchell 想當個能保護家人的一家之主。","en":"While Dad's away, you're the man of the house.","tr":"爸爸不在的時候，你就是家裡的男人。","tip":"<b>用法：</b>常帶點玩笑，對小男生說也很常見。","th":2,"lv":2}]}],"prompts":["你搶購過什麼東西嗎（用 sell out、early adopter、game changer）","你身邊有輸不起的人嗎（用 sore loser、let someone win、go easy on）","你遇過很愛管閒事的人嗎（用 nosy、eavesdrop、mind your own business）"],"challenges":[{"id":"c1","sit":"你想買的球鞋一上架就賣光了，跟朋友抱怨。","uses":["sell out"],"ans":"They sold out in two minutes."},{"id":"c2","sit":"打電動輸了的朋友在摔手把，你叫他別輸不起。","uses":["sore loser"],"ans":"Come on, don't be a sore loser."},{"id":"c3","sit":"學弟第一天下部隊，你跟學長說對他手下留情一點。","uses":["go easy on"],"ans":"Go easy on him. It's his first day."},{"id":"c4","sit":"鄰居一直問你女朋友的事，你跟朋友說他好八卦。","uses":["nosy"],"ans":"My neighbor is so nosy."}]},"s01e20":{"title":"Benched","lede":"Phil 和 Jay 為了籃球隊誰說了算槓上；Mitchell 見到新老闆，結果和 Cam 不小心刮傷了老闆的法拉利；兩家的孩子也開始反抗爸媽的過度保護。","stories":[{"id":"dunphy","name":"Phil 和 Jay","who":"Phil · Jay · Luke","plot":"在籃球場上，Phil 和 Jay 都想當那個說了算的人。","items":[{"p":"call the shots","zh":"做決定、說了算","scene":"Phil 和 Jay 都想當老大。","en":"It's my party, so I call the shots.","tr":"這是我的派對，所以我說了算。","tip":"<b>用法：</b>Who calls the shots here? 這裡誰說了算？","th":10,"lv":2},{"p":"be benched","zh":"被換下場、坐冷板凳","scene":"這集標題就是「坐冷板凳」。","en":"He was benched for missing practice.","tr":"他因為缺席練習被叫去坐冷板凳。","tip":"<b>延伸：</b>bench 是場邊的長椅。","th":8,"lv":2},{"p":"step on someone's toes","zh":"踩到別人的地盤、冒犯別人","scene":"Phil 覺得 Jay 在搶他的位置。","en":"I don't want to step on anyone's toes, but I have an idea.","tr":"我不想越權，但我有個想法。","tip":"<b>用法：</b>提意見前先說，表示禮貌。","th":5,"lv":2},{"p":"team player","zh":"有團隊精神的人","scene":"大家都要學著當個好隊友。","en":"We need team players, not superstars.","tr":"我們需要的是有團隊精神的人，不是巨星。","tip":"<b>用法：</b>面試、職場超常用。","th":3,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 想討好新老闆，卻和 Cam 不小心把老闆的法拉利弄出刮痕。","items":[{"p":"suck up to","zh":"拍馬屁","scene":"Mitchell 很努力想討老闆歡心。","en":"He's always sucking up to the teacher.","tr":"他老是在拍老師馬屁。","tip":"<b>名詞：</b>a suck-up 馬屁精。","th":3,"lv":2},{"p":"my bad","zh":"我的錯（很口語）","scene":"闖了禍只能先認錯。","en":"Oops, my bad. I thought this was my seat.","tr":"啊，我的錯，我以為這是我的位子。","tip":"<b>對比：</b>my fault 比較正式；my bad 很隨性，小事用。","th":7,"lv":1},{"p":"pay for it","zh":"付出代價","scene":"弄壞老闆的車，一定要付出代價。","en":"If you skip leg day, you'll pay for it later.","tr":"如果你不練腿，之後就會付出代價。","tip":"<b>延伸：</b>You'll pay for this! 你會付出代價的！","th":5,"lv":1}]},{"id":"kids","name":"孩子們","who":"Haley · Alex · Luke · Manny","plot":"孩子們受夠了爸媽的過度保護，想要更多自由。","items":[{"p":"overprotective","zh":"過度保護的","scene":"孩子們覺得爸媽管太多了。","en":"My mom is so overprotective. She calls me every hour.","tr":"我媽超保護我的，每小時都打給我。","tip":"<b>用法：</b>overprotective parents 過度保護的父母。","th":2,"lv":1},{"p":"baby someone","zh":"把某人當小孩寵","scene":"孩子們不想再被當成小寶寶。","en":"Stop babying me. I'm 16.","tr":"別再把我當小孩了，我 16 歲了。","tip":"<b>用法：</b>baby 當動詞，意思是過度照顧。","th":2,"lv":2},{"p":"give someone space","zh":"給某人空間","scene":"孩子們只想要一點空間。","en":"I think she needs some time. Give her space.","tr":"我覺得她需要一點時間，給她空間吧。","tip":"<b>延伸：</b>I need some space. 我需要一點空間。","th":6,"lv":1}]}],"prompts":["你遇過很愛當老大的人嗎（用 call the shots、step on someone's toes、team player）","你闖過最大的禍（用 my bad、pay for it、suck up to）","你爸媽會過度保護你嗎（用 overprotective、baby someone、give someone space）"],"challenges":[{"id":"c1","sit":"你在電影院不小心坐到別人的位子，跟他說我的錯。","uses":["my bad"],"ans":"Oh, my bad. Is this your seat?"},{"id":"c2","sit":"你媽每天打給你三次，你跟朋友說她太保護你了。","uses":["overprotective"],"ans":"My mom is so overprotective."},{"id":"c3","sit":"朋友跟女朋友吵架，你建議他給對方一點空間。","uses":["give someone space"],"ans":"Give her some space for a few days."},{"id":"c4","sit":"你剛進公司想提建議但又怕越權，先跟資深同事說一聲。","uses":["step on someone's toes"],"ans":"I don't want to step on your toes, but can I suggest something?"}]},"s01e21":{"title":"Travels with Scout","lede":"Phil 的爸爸 Frank 突然來訪，Claire 懷疑他另有目的；Manny 看了恐怖片被嚇到睡不著；Cam 臨時代打，成了 Dylan 樂團的鼓手。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Frank","plot":"Frank 突然來家裡，Claire 總覺得事情沒那麼單純，父子倆的個性卻一模一樣。","items":[{"p":"drop by","zh":"順道拜訪","scene":"Frank 說來就來。","en":"Feel free to drop by anytime.","tr":"隨時歡迎來坐坐。","tip":"<b>對比：</b>drop by 比 visit 更隨性，通常是臨時的。","th":2,"lv":1},{"p":"up to something","zh":"在打什麼主意","scene":"Claire 覺得 Frank 一定有事。","en":"The kids are too quiet. They're up to something.","tr":"孩子們太安靜了，一定在搞什麼。","tip":"<b>用法：</b>What are you up to? 你在幹嘛／打什麼主意？","th":10,"lv":2},{"p":"what's the catch","zh":"有什麼陷阱、代價是什麼","scene":"突然來訪？Claire 想知道背後的原因。","en":"A free phone? What's the catch?","tr":"免費手機？背後有什麼條件？","tip":"<b>用法：</b>好到不像真的時，就問 What's the catch?","th":7,"lv":2},{"p":"like father, like son","zh":"有其父必有其子","scene":"Phil 和爸爸真的很像。","en":"He loves fishing too. Like father, like son.","tr":"他也愛釣魚，真是有其父必有其子。","tip":"<b>延伸：</b>like mother, like daughter。","th":2,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Manny · Jay · Gloria","plot":"Manny 看了一部恐怖片，嚇到晚上不敢睡。","items":[{"p":"give someone nightmares","zh":"讓某人做惡夢","scene":"那部片讓 Manny 一直做惡夢。","en":"Don't tell me ghost stories. They give me nightmares.","tr":"別跟我講鬼故事，我會做惡夢。","tip":"<b>延伸：</b>It was a nightmare. 那簡直是場惡夢（很糟）。","th":4,"lv":1},{"p":"can't unsee it","zh":"看了忘不掉","scene":"恐怖的畫面一直在 Manny 腦中。","en":"I saw that photo and now I can't unsee it.","tr":"我看了那張照片，現在忘都忘不掉。","tip":"<b>語氣：</b>網路用語變成日常口語，常帶點搞笑。","th":7,"lv":2},{"p":"sleep with the lights on","zh":"開燈睡覺","scene":"Manny 嚇到只敢開著燈睡。","en":"After that movie, I slept with the lights on.","tr":"看完那部電影，我開著燈睡覺。","tip":"<b>用法：</b>形容被嚇到的經典說法。","th":8,"lv":1}]},{"id":"mitch","name":"Cam 和樂團","who":"Cameron · Dylan · Mitchell","plot":"Dylan 的樂團缺鼓手，Cam 自告奮勇，想重溫自己當年的搖滾魂。","items":[{"p":"fill in for","zh":"代替某人","scene":"Cam 代替原本的鼓手上場。","en":"Can you fill in for me at work tomorrow?","tr":"你明天可以幫我代班嗎？","tip":"<b>用法：</b>代班、代課都可以用。","th":3,"lv":1},{"p":"rock out","zh":"盡情搖滾、嗨起來","scene":"Cam 打起鼓來超嗨。","en":"He was rocking out to his favorite song.","tr":"他跟著最愛的歌嗨起來。","tip":"<b>延伸：</b>也可以說聽音樂聽得很投入。","th":8,"lv":2},{"p":"still got it","zh":"寶刀未老","scene":"Cam 證明自己還是很厲害。","en":"I haven't played in years, but I've still got it.","tr":"我好幾年沒打了，但還是寶刀未老。","tip":"<b>用法：</b>常說 You've still got it! 你還是很厲害！","th":7,"lv":2}]}],"prompts":["你看過最恐怖的電影（用 give someone nightmares、sleep with the lights on、can't unsee it）","你曾經幫人代班或代打嗎（用 fill in for、still got it、rock out）","你跟爸媽哪裡最像（用 like father, like son、drop by、up to something）"],"challenges":[{"id":"c1","sit":"同梯明天放假，問你能不能幫他代一班哨。","uses":["fill in for"],"ans":"Can you fill in for me tomorrow night?"},{"id":"c2","sit":"弟弟突然主動幫你洗碗，你懷疑他在打什麼主意。","uses":["up to something","what's the catch"],"ans":"Why is he being so nice? He's up to something. What's the catch?"},{"id":"c3","sit":"你很久沒打球了，一上場還是很準，朋友稱讚你。","uses":["still got it"],"ans":"You've still got it!"},{"id":"c4","sit":"朋友要跟你講鬼故事，你說不要，你會做惡夢。","uses":["give someone nightmares"],"ans":"Please don't. Ghost stories give me nightmares."}]},"s01e22":{"title":"Airport 2010","lede":"Gloria 送 Jay 一趟夏威夷之旅當生日禮物，Jay 卻發現全家都要跟去；到了機場，證件不見、安檢出狀況、還有人怕坐飛機，一整集都是出國必備英文。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 以為是兩人的浪漫旅行，結果全家都要跟去；Gloria 的證件還出了問題。","items":[{"p":"the more the merrier","zh":"人越多越好玩","scene":"Gloria 覺得全家一起去才熱鬧。","en":"Sure, bring your friends. The more the merrier!","tr":"好啊，帶朋友來，人越多越好玩！","tip":"<b>用法：</b>歡迎別人加入時很常說。","th":7,"lv":1},{"p":"of all days","zh":"偏偏在這天","scene":"偏偏在出國這天出狀況。","en":"Of all days, my alarm didn't go off today.","tr":"偏偏今天鬧鐘沒響。","tip":"<b>延伸：</b>of all people 偏偏是他。","th":7,"lv":2},{"p":"have something on you","zh":"身上帶著某物","scene":"證件到底有沒有帶在身上？","en":"Do you have your ID on you?","tr":"你身上有帶證件嗎？","tip":"<b>用法：</b>I don't have any cash on me. 我身上沒現金。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"一家五口趕飛機，一路手忙腳亂。","items":[{"p":"run late","zh":"快遲到了","scene":"出門晚了，大家都在趕。","en":"Sorry, I'm running a little late. I'll be there in ten.","tr":"抱歉，我會晚一點，十分鐘後到。","tip":"<b>用法：</b>I'm running late. 是傳訊息說會遲到的標準句。","th":8,"lv":1},{"p":"pack light","zh":"輕裝出遊","scene":"有人行李多到誇張。","en":"We're only going for two days, so pack light.","tr":"我們只去兩天，行李帶少一點。","tip":"<b>反義：</b>overpack 帶太多行李。","th":8,"lv":1},{"p":"carry-on","zh":"手提行李","scene":"行李到底要託運還是隨身帶？","en":"Can I bring this as a carry-on?","tr":"這個可以當手提行李嗎？","tip":"<b>對比：</b>checked bag 是託運行李。","th":8,"lv":1},{"p":"go through security","zh":"過安檢","scene":"過安檢時又出了狀況。","en":"We need two hours to go through security.","tr":"我們需要兩小時過安檢。","tip":"<b>延伸：</b>security check 安全檢查。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 很怕坐飛機，一到機場就開始緊張。","items":[{"p":"nervous flyer","zh":"怕坐飛機的人","scene":"Mitchell 是個不折不扣的飛行恐懼症。","en":"I'm a nervous flyer, so I always take the aisle seat.","tr":"我很怕坐飛機，所以總是坐走道。","tip":"<b>延伸：</b>fear of flying 飛行恐懼。","th":8,"lv":2},{"p":"miss the flight","zh":"沒趕上飛機","scene":"再拖下去就要錯過班機了。","en":"Hurry up or we'll miss the flight!","tr":"快點，不然要錯過班機了！","tip":"<b>延伸：</b>miss the bus、miss the train 同樣用法。","th":8,"lv":1},{"p":"last call","zh":"最後登機廣播","scene":"廣播已經在喊最後登機了。","en":"That's the last call for our flight. Run!","tr":"那是我們班機的最後登機廣播，快跑！","tip":"<b>延伸：</b>酒吧的 last call 是最後點餐。","th":8,"lv":1}]}],"prompts":["你最難忘的一次出國或旅行出包經驗（用 run late、miss the flight、of all days）","你出門會帶很多東西還是輕裝（用 pack light、carry-on、have something on you）","你喜歡一個人還是一群人出去玩（用 the more the merrier、nervous flyer、go through security）"],"challenges":[{"id":"c1","sit":"你傳訊息給女朋友說你會晚十分鐘到。","uses":["run late"],"ans":"Sorry, I'm running late. I'll be there in ten."},{"id":"c2","sit":"室友問可不可以帶朋友一起去烤肉，你說當然，人越多越好玩。","uses":["the more the merrier"],"ans":"Of course! The more the merrier."},{"id":"c3","sit":"快到演唱會入口了，你問朋友票有沒有帶在身上。","uses":["have something on you"],"ans":"Do you have the tickets on you?"},{"id":"c4","sit":"偏偏在要面試這天捷運故障，你跟朋友抱怨。","uses":["of all days"],"ans":"Of all days, the MRT breaks down today."}]},"s01e23":{"title":"Hawaii","lede":"全家到了夏威夷，Jay 只想好好放鬆，卻被現實狠狠提醒自己的年紀；Phil 拼命想給 Claire 浪漫的假期；Mitchell 和 Cam 為了要不要去觀光吵起來；孩子們也惹了麻煩。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 只想在海邊躺著放空，結果被一件小事提醒自己真的老了。","items":[{"p":"kick back","zh":"放鬆、休息","scene":"Jay 只想躺著什麼都不做。","en":"This weekend I just want to kick back and watch TV.","tr":"這週末我只想放鬆看電視。","tip":"<b>用法：</b>kick back and relax 很常一起出現。","th":8,"lv":1},{"p":"unwind","zh":"放鬆、紓壓","scene":"度假就是要好好放鬆。","en":"A hot bath helps me unwind after work.","tr":"下班後泡個熱水澡能讓我放鬆。","tip":"<b>對比：</b>relax 很一般；unwind 有「把繃緊的東西鬆開」的感覺。","th":8,"lv":1},{"p":"feel one's age","zh":"感覺到自己老了","scene":"Jay 被現實提醒，自己年紀不小了。","en":"After playing basketball with the kids, I'm really feeling my age.","tr":"跟小朋友打完籃球，我真的覺得自己老了。","tip":"<b>用法：</b>常說 I'm feeling my age.","th":8,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"Phil 想給 Claire 一個浪漫的夏威夷之旅；孩子們卻趁機到處惹麻煩。","items":[{"p":"sweep someone off their feet","zh":"讓某人神魂顛倒","scene":"Phil 想讓 Claire 重新愛上他。","en":"He swept her off her feet on their first date.","tr":"他第一次約會就讓她神魂顛倒。","tip":"<b>畫面：</b>把人從地上抱起來，形容讓人瞬間愛上。","th":1,"lv":2},{"p":"romantic getaway","zh":"浪漫小旅行","scene":"Phil 心中的完美假期。","en":"We're planning a romantic getaway for our anniversary.","tr":"我們計畫紀念日來趟浪漫小旅行。","tip":"<b>延伸：</b>weekend getaway 週末小旅行。","th":1,"lv":1},{"p":"sneak out","zh":"偷溜出去","scene":"孩子們趁大人不注意溜出去。","en":"I used to sneak out at night to play video games.","tr":"我以前會半夜偷溜出去打電動。","tip":"<b>對比：</b>sneak in 是偷溜進來。","th":10,"lv":1},{"p":"get sunburned","zh":"曬傷","scene":"在夏威夷不擦防曬就會曬傷。","en":"I forgot sunscreen and got sunburned.","tr":"我忘了擦防曬，結果曬傷了。","tip":"<b>延伸：</b>sunburn 曬傷；suntan 曬黑。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 想到處觀光，Cam 只想好好放假，兩人意見不合。","items":[{"p":"see the sights","zh":"觀光、看景點","scene":"Mitchell 想把景點都走一遍。","en":"We only have one day to see the sights.","tr":"我們只有一天可以觀光。","tip":"<b>延伸：</b>sightseeing 觀光。","th":8,"lv":1},{"p":"tourist trap","zh":"觀光陷阱（又貴又不值得的景點）","scene":"有些景點根本是騙觀光客的。","en":"That restaurant is a tourist trap. Let's eat somewhere else.","tr":"那家餐廳是觀光客陷阱，我們去別家吃。","tip":"<b>用法：</b>形容又貴又普通、專賺觀光客的地方。","th":8,"lv":2},{"p":"laid-back","zh":"悠閒的、隨性的","scene":"Cam 想要悠閒的假期。","en":"I love the laid-back vibe in Taitung.","tr":"我很喜歡台東悠閒的氛圍。","tip":"<b>用法：</b>也可以形容人個性隨和。","th":9,"lv":1}]}],"prompts":["你理想中的假期（用 kick back、unwind、laid-back）","你去過最失望的景點（用 tourist trap、see the sights、get sunburned）","你小時候有偷溜出去過嗎（用 sneak out、feel one's age、romantic getaway）"],"challenges":[{"id":"c1","sit":"連假有三天，朋友問你要做什麼，你說只想在家放鬆。","uses":["kick back"],"ans":"I just want to kick back at home."},{"id":"c2","sit":"朋友推薦一間很貴的觀光餐廳，你說那是觀光客陷阱。","uses":["tourist trap"],"ans":"That place is a tourist trap."},{"id":"c3","sit":"跟小朋友玩了一下午，你跟同事說你覺得自己老了。","uses":["feel one's age"],"ans":"I'm really feeling my age today."},{"id":"c4","sit":"你去墾丁沒擦防曬，跟朋友說你曬傷了。","uses":["get sunburned"],"ans":"I forgot sunscreen and got sunburned."}]},"s01e24":{"title":"Family Portrait","lede":"第一季最後一集，Claire 想拍一張完美的全家福，偏偏沒人配合；Gloria、Manny、Phil 和 Alex 去看湖人隊比賽，Gloria 和 Manny 被親吻鏡頭拍到、還上了大螢幕；Cam 去婚禮駐唱，Mitchell 在家顧 Lily 和一隻跑進來的鴿子；Luke 則為了學校作業訪問 Jay。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Luke · Jay","plot":"Claire 堅持要拍一張完美的全家福，大家卻狀況不斷；Luke 為了作業訪問爺爺。","items":[{"p":"work with me","zh":"配合我一下","scene":"Claire 拜託大家配合。","en":"Come on, work with me here. Just smile once.","tr":"拜託配合一下，笑一次就好。","tip":"<b>語氣：</b>帶點無奈的請求。","th":7,"lv":1},{"p":"for once","zh":"就這麼一次","scene":"Claire 只希望這次能順利。","en":"For once, can we just be on time?","tr":"就這一次，我們能不能準時？","tip":"<b>用法：</b>抱怨對方平常都做不到時用。","th":7,"lv":1},{"p":"picture-perfect","zh":"完美得像照片一樣","scene":"Claire 心目中的全家福。","en":"The sunset was picture-perfect.","tr":"夕陽美得像照片一樣。","tip":"<b>用法：</b>形容很完美的畫面或場合。","th":9,"lv":1},{"p":"look back on","zh":"回顧","scene":"Jay 回答 Luke 時，回想起自己的人生。","en":"When I look back on high school, I miss my friends.","tr":"回想高中，我很想念我的朋友。","tip":"<b>用法：</b>look back on + 過去的時期或事情。","th":10,"lv":1}]},{"id":"jay","name":"湖人隊比賽","who":"Gloria · Manny · Phil · Alex","plot":"四個人去看球賽，Gloria 和 Manny 被親吻鏡頭拍到，還上了大螢幕和電視。","items":[{"p":"kiss cam","zh":"親吻鏡頭","scene":"球場的大螢幕突然拍到 Gloria 和 Manny。","en":"They got caught on the kiss cam at the game.","tr":"他們在球賽上被親吻鏡頭拍到。","tip":"<b>文化：</b>美國球賽中場常見的互動環節。","th":1,"lv":2},{"p":"caught on camera","zh":"被拍到","scene":"整個畫面都被拍下來，還上了電視。","en":"The whole thing was caught on camera.","tr":"整件事都被拍下來了。","tip":"<b>延伸：</b>caught on tape 也是被錄下來。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · Lily","plot":"Cam 接了一場婚禮駐唱；Mitchell 在家顧 Lily，還要處理一隻跑進家裡的鴿子。","items":[{"p":"gig","zh":"表演工作、臨時差事","scene":"Cam 接到一場婚禮駐唱。","en":"My band has a gig at a bar this Friday.","tr":"我的樂團這週五在酒吧有表演。","tip":"<b>延伸：</b>side gig 副業。","th":3,"lv":2},{"p":"nail it","zh":"表現超好、完美達成","scene":"Cam 想在婚禮上唱得完美。","en":"You nailed it! That was perfect.","tr":"你表現超好！太完美了。","tip":"<b>用法：</b>考試、表演、面試成功都可以說。","th":7,"lv":1},{"p":"deal with it","zh":"處理、面對","scene":"Mitchell 只能自己想辦法處理那隻鴿子。","en":"There's a bug in my room, and I don't know how to deal with it.","tr":"我房間有蟲，我不知道怎麼處理。","tip":"<b>語氣：</b>Deal with it. 單獨說是「自己想辦法、接受吧」，很嗆。","th":10,"lv":1},{"p":"in a nutshell","zh":"簡單來說","scene":"Luke 要把爺爺的一生寫成報告。","en":"In a nutshell, the trip was a disaster.","tr":"簡單來說，這趟旅行是場災難。","tip":"<b>畫面：</b>nutshell 是堅果殼，小到只裝得下重點。","th":7,"lv":1}]}],"prompts":["你家拍全家福的經驗（用 work with me、picture-perfect、for once）","回顧你當兵到現在的日子（用 look back on、in a nutshell、nail it）","你曾經被拍到或上過鏡頭嗎（用 caught on camera、kiss cam、deal with it）"],"challenges":[{"id":"c1","sit":"幫爸媽拍照時爸爸一直亂動，你叫他配合一下。","uses":["work with me"],"ans":"Work with me here, Dad. Just one photo."},{"id":"c2","sit":"你考過了專長測驗，朋友稱讚你表現超好。","uses":["nail it"],"ans":"You nailed it!"},{"id":"c3","sit":"朋友問你這週過得怎樣，你說簡單來說就是很累。","uses":["in a nutshell"],"ans":"In a nutshell, it was exhausting."},{"id":"c4","sit":"你搬家後又遇到一堆鳥事，媽媽叫你自己想辦法面對。","uses":["deal with it"],"ans":"You'll just have to deal with it."}]},"s02e01":{"title":"The Old Wagon","lede":"第二季開場，Phil 終於答應把家裡的老旅行車賣掉，全家來一趟最後的懷舊之旅；Mitchell 為了證明自己很有男子氣概，堅持親手幫 Lily 蓋一座真人大小的公主城堡，Cam 只好偷偷找 Jay 幫忙。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"Phil 捨不得那台載著全家回憶的老車，決定賣掉前再開一趟。","items":[{"p":"part with","zh":"割捨、捨得放手","scene":"Phil 很難跟老車說再見。","en":"I can't part with my old guitar.","tr":"我捨不得丟掉我的舊吉他。","tip":"<b>搭配：</b>part with + 東西，常是有感情的物品。","th":8,"lv":2},{"p":"for old times' sake","zh":"為了懷念過去","scene":"全家為了回憶，最後再開一趟。","en":"Let's go to our old school for old times' sake.","tr":"我們為了懷舊回母校看看吧。","tip":"<b>用法：</b>做一件以前常做的事時說。","th":2,"lv":2},{"p":"sentimental","zh":"念舊的、有感情的","scene":"那台車對 Phil 來說很有紀念價值。","en":"This watch has sentimental value. It was my grandpa's.","tr":"這支錶有紀念價值，是我爺爺的。","tip":"<b>延伸：</b>sentimental value 紀念價值。","th":9,"lv":1},{"p":"on its last legs","zh":"快不行了、快壞了","scene":"那台老車其實已經撐不太久了。","en":"My laptop is on its last legs.","tr":"我的筆電快掛了。","tip":"<b>畫面：</b>像老動物站不太穩，可以形容東西也可以形容人很累。","th":9,"lv":2},{"p":"road trip","zh":"開車長途旅行","scene":"這是全家最後一次的公路旅行。","en":"We're taking a road trip around the east coast.","tr":"我們要開車環東海岸。","tip":"<b>延伸：</b>road trip 是美國人最愛的旅行方式之一。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 和 Jay","who":"Mitchell · Cameron · Jay","plot":"Mitchell 想證明自己什麼都會做，從零開始蓋公主城堡，結果越蓋越慘。","items":[{"p":"handy","zh":"手很巧、很會修東西","scene":"Mitchell 不是那種很會動手做的人。","en":"My dad is really handy. He fixed the roof himself.","tr":"我爸手很巧，屋頂是他自己修的。","tip":"<b>延伸：</b>come in handy 派得上用場。","th":9,"lv":1},{"p":"prove oneself","zh":"證明自己","scene":"Mitchell 想證明自己也很 man。","en":"I just want to prove myself to my new boss.","tr":"我只是想在新老闆面前證明自己。","tip":"<b>搭配：</b>prove yourself to + 人。","th":3,"lv":1},{"p":"from scratch","zh":"從零開始","scene":"他堅持從頭開始自己做。","en":"She made the cake from scratch.","tr":"她的蛋糕是從頭自己做的。","tip":"<b>對比：</b>用現成的材料包就不是 from scratch。","th":10,"lv":1},{"p":"bite off more than you can chew","zh":"貪多嚼不爛、自不量力","scene":"一座城堡的工程遠超過 Mitchell 的能力。","en":"Don't take three classes at once. You'll bite off more than you can chew.","tr":"別一次修三門課，你會負荷不了。","tip":"<b>畫面：</b>一口咬太多，嚼不動。","th":10,"lv":2},{"p":"end up","zh":"結果、最後變成","scene":"最後城堡的下場出乎大家意料。","en":"We wanted to go hiking, but we ended up staying home.","tr":"我們本來想去爬山，結果待在家。","tip":"<b>搭配：</b>end up + V-ing，講出乎預料的結果。","th":10,"lv":1}]}],"prompts":["一樣你捨不得丟的東西（用 part with、sentimental、for old times' sake）","你曾經做了一件超出能力的事（用 bite off more than you can chew、prove oneself、end up）","你最難忘的一趟旅行（用 road trip、on its last legs、from scratch）"],"challenges":[{"id":"c1","sit":"媽媽要把你國中的舊籃球丟掉，你說你捨不得。","uses":["part with"],"ans":"I can't part with that ball, Mom."},{"id":"c2","sit":"你想一邊上班一邊準備三張證照，朋友說你會負荷不了。","uses":["bite off more than you can chew"],"ans":"Don't bite off more than you can chew."},{"id":"c3","sit":"你跟朋友說你本來要去看電影，結果在家睡了一整天。","uses":["end up"],"ans":"I was going to see a movie, but I ended up sleeping all day."},{"id":"c4","sit":"你的機車老到常常發不動，跟朋友說它快掛了。","uses":["on its last legs"],"ans":"My scooter is on its last legs."}]},"s02e02":{"title":"The Kiss","lede":"Claire 在 Alex 的手機看到男生傳來的曖昧訊息，教她大膽回擊，結果害對方在朋友面前出糗；Mitchell 很不習慣在公共場合跟 Cam 親吻；Phil 幫 Jay 修印表機，Jay 也在學著適應 Gloria 的文化習慣。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Alex","plot":"Claire 發現有男生在跟 Alex 曖昧，忍不住當起女兒的戀愛軍師。","items":[{"p":"have a crush on","zh":"暗戀、對某人有好感","scene":"那個男生似乎對 Alex 有意思。","en":"I had a crush on my English teacher in high school.","tr":"我高中時暗戀我的英文老師。","tip":"<b>延伸：</b>crush 也可以當名詞，my crush 我暗戀的人。","th":1,"lv":1},{"p":"flirt with","zh":"調情、搞曖昧","scene":"男生傳來一些曖昧的訊息。","en":"Is he flirting with you or just being nice?","tr":"他是在跟你調情，還是只是人很好？","tip":"<b>延伸：</b>He's such a flirt. 他很愛放電。","th":1,"lv":1},{"p":"mixed signals","zh":"曖昧不明的訊號","scene":"男生的訊息讓人摸不清意思。","en":"She keeps sending me mixed signals.","tr":"她一直給我很混亂的訊號。","tip":"<b>用法：</b>感情中讓人捉摸不透時很常用。","th":1,"lv":2},{"p":"play hard to get","zh":"欲擒故縱","scene":"Claire 教 Alex 不要太快表態。","en":"She's not ignoring you. She's playing hard to get.","tr":"她不是不理你，是在欲擒故縱。","tip":"<b>用法：</b>假裝不在乎，讓對方更想追。","th":1,"lv":2},{"p":"make a fool of","zh":"讓某人出糗","scene":"Alex 的回擊讓男生在朋友面前很丟臉。","en":"I don't want to make a fool of myself on stage.","tr":"我不想在台上出糗。","tip":"<b>用法：</b>make a fool of yourself 自己出糗。","th":4,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Cam 想在大家面前親一下，Mitchell 卻渾身不自在。","items":[{"p":"PDA","zh":"公開放閃（公開示愛）","scene":"Mitchell 很不習慣在公共場合親熱。","en":"They kissed in the middle of the meeting. Too much PDA.","tr":"他們在開會中間親起來，太放閃了。","tip":"<b>全稱：</b>public display of affection。","th":1,"lv":2},{"p":"self-conscious","zh":"很在意別人眼光","scene":"Mitchell 很怕別人在看。","en":"I get self-conscious when people watch me eat.","tr":"有人看我吃東西時我會很不自在。","tip":"<b>對比：</b>confident 有自信；self-conscious 怕被注意。","th":4,"lv":1},{"p":"loosen up","zh":"放開一點、別那麼拘謹","scene":"Cam 希望 Mitchell 放開一點。","en":"Loosen up and dance with us!","tr":"放開一點，來跟我們跳舞！","tip":"<b>對比：</b>lighten up 是別太嚴肅；loosen up 是別太拘束。","th":6,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Phil","plot":"Jay 努力適應 Gloria 的家鄉習慣，還得忍受 Phil 來家裡修印表機。","items":[{"p":"comfort zone","zh":"舒適圈","scene":"這些新習慣讓 Jay 很不自在。","en":"Living abroad pushed me out of my comfort zone.","tr":"出國生活讓我走出舒適圈。","tip":"<b>搭配：</b>step out of your comfort zone 走出舒適圈。","th":10,"lv":1},{"p":"when in Rome","zh":"入境隨俗","scene":"Jay 只好試著照 Gloria 的方式來。","en":"Everyone eats with their hands here. When in Rome!","tr":"這裡大家都用手吃，入境隨俗嘛！","tip":"<b>全句：</b>When in Rome, do as the Romans do.","th":8,"lv":2}]}],"prompts":["你暗戀過的人（用 have a crush on、mixed signals、play hard to get）","一次讓你走出舒適圈的經驗（用 comfort zone、when in Rome、loosen up）","你很在意別人眼光的時候（用 self-conscious、make a fool of、PDA）"],"challenges":[{"id":"c1","sit":"朋友說他喜歡的女生忽冷忽熱，你說她在給他混亂的訊號。","uses":["mixed signals"],"ans":"She's giving you mixed signals."},{"id":"c2","sit":"同梯在連上晚會很害羞不敢跳，你叫他放開一點。","uses":["loosen up"],"ans":"Come on, loosen up a little!"},{"id":"c3","sit":"你去朋友家，他們吃飯前要禱告，你也跟著做，跟朋友說入境隨俗。","uses":["when in Rome"],"ans":"When in Rome, right?"},{"id":"c4","sit":"你跟朋友說你不想上台唱歌出糗。","uses":["make a fool of"],"ans":"I don't want to make a fool of myself up there."}]},"s02e03":{"title":"Earthquake","lede":"一場地震讓 Claire 跟水電工一起被困在浴室，Phil 則急著藏起他沒固定好的層架闖的禍；Mitchell 和 Cam 假裝受傷想逃掉派對，結果弄巧成拙；Jay 本來要翹掉教會帶 Manny 去打高爾夫，Manny 卻臨時改變主意。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 被困在浴室，只能跟水電工尬聊；Phil 想把自己闖的禍偷偷藏起來。","items":[{"p":"make small talk","zh":"寒暄、閒聊","scene":"Claire 被困著，只好跟水電工聊天。","en":"I'm bad at making small talk with strangers.","tr":"我不太會跟陌生人閒聊。","tip":"<b>用法：</b>聊天氣、交通這類輕鬆話題就是 small talk。","th":2,"lv":1},{"p":"sweep under the rug","zh":"把問題藏起來、掩蓋","scene":"Phil 想把壞掉的層架偷偷處理掉。","en":"You can't just sweep this problem under the rug.","tr":"你不能就這樣把問題藏起來。","tip":"<b>畫面：</b>把灰塵掃到地毯底下，看不到但還在。","th":10,"lv":2},{"p":"I told you so","zh":"我早就跟你說了","scene":"Claire 一定會說她早就提醒過了。","en":"I told you so. You should have brought an umbrella.","tr":"我早就跟你說了，你應該帶傘的。","tip":"<b>語氣：</b>有點欠揍的一句話，用的時候要小心。","th":7,"lv":1},{"p":"shaken up","zh":"嚇到、心有餘悸","scene":"地震之後大家都還驚魂未定。","en":"She's okay, just a little shaken up.","tr":"她沒事，只是有點嚇到。","tip":"<b>用法：</b>被車禍、地震、壞消息嚇到都能用。","th":4,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人不想去朋友的派對，乾脆假裝地震讓他們受傷、家裡也壞了。","items":[{"p":"get out of","zh":"逃避、找藉口不做","scene":"他們想找理由不去派對。","en":"How can I get out of this meeting?","tr":"我要怎麼逃掉這場會議？","tip":"<b>用法：</b>get out of + 事情／V-ing。","th":10,"lv":1},{"p":"make up an excuse","zh":"編藉口","scene":"兩人編了一個地震的藉口。","en":"He made up an excuse to leave early.","tr":"他編了個藉口提早離開。","tip":"<b>延伸：</b>make up a story 編故事。","th":10,"lv":1},{"p":"play along","zh":"配合演出、順著演","scene":"一個人說謊，另一個只好配合。","en":"I didn't know what was going on, so I just played along.","tr":"我不知道發生什麼事，所以就順著演。","tip":"<b>用法：</b>配合別人的玩笑或計畫。","th":10,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny · Gloria","plot":"Jay 想翹掉教會去打高爾夫，Manny 卻臨時決定還是要去教會，讓 Jay 心裡有點過意不去。","items":[{"p":"play hooky","zh":"翹課、翹班","scene":"Jay 想偷懶不去教會。","en":"Let's play hooky and go to the beach.","tr":"我們翹班去海邊吧。","tip":"<b>用法：</b>比 skip school 更口語、更俏皮。","th":3,"lv":2},{"p":"guilt trip","zh":"讓人產生罪惡感（情緒勒索）","scene":"Manny 的決定讓 Jay 有點罪惡感。","en":"Don't guilt-trip me. I said I'm busy.","tr":"別讓我有罪惡感，我說了我很忙。","tip":"<b>用法：</b>名詞和動詞都可以，guilt-trip someone。","th":5,"lv":2},{"p":"have a change of heart","zh":"改變心意","scene":"Manny 臨時改變主意，Jay 也開始反省。","en":"He was going to quit, but he had a change of heart.","tr":"他本來要辭職，後來改變心意了。","tip":"<b>對比：</b>change your mind 比較一般；change of heart 多指態度、感情上的轉變。","th":10,"lv":1}]}],"prompts":["你最會跟什麼人閒聊（用 make small talk、shaken up、I told you so）","你曾經編藉口逃掉某個活動嗎（用 get out of、make up an excuse、play along）","你翹過課或翹過班嗎（用 play hooky、guilt trip、have a change of heart）"],"challenges":[{"id":"c1","sit":"主管問你昨天怎麼沒交報告，同事在旁邊幫你圓。你事後跟他說謝謝你配合演出。","uses":["play along"],"ans":"Thanks for playing along."},{"id":"c2","sit":"你跟朋友說你很不會跟陌生人尬聊。","uses":["make small talk"],"ans":"I'm terrible at making small talk."},{"id":"c3","sit":"你媽一直說你都不回家，你叫她別讓你有罪惡感。","uses":["guilt trip"],"ans":"Mom, don't guilt-trip me."},{"id":"c4","sit":"朋友不帶傘出門結果淋濕了，你笑著說我早就跟你說了。","uses":["I told you so"],"ans":"I told you so!"}]},"s02e04":{"title":"Strangers on a Treadmill","lede":"Claire 和 Mitchell 想保護另一半不要出糗：Claire 太誠實地評論 Cam 的緊身車褲，害他哭出來；Mitchell 則不敢告訴 Phil 他的笑話很冷。Phil 的演講稿被 Claire 藏起來，只好即興上台，結果大成功；Haley 則想教 Alex 怎麼變酷。","stories":[{"id":"mitch","name":"Claire 和 Cam","who":"Claire · Cameron · Mitchell","plot":"Claire 毫不留情地評論 Cam 的騎車裝，Cam 當場哭了。","items":[{"p":"brutally honest","zh":"誠實到殘酷","scene":"Claire 講話直到傷人。","en":"To be brutally honest, your song isn't very good.","tr":"老實說，你的歌不太好聽。","tip":"<b>用法：</b>To be brutally honest, … 先打預防針。","th":9,"lv":1},{"p":"sugarcoat","zh":"粉飾、說得好聽一點","scene":"Claire 完全沒有修飾。","en":"Don't sugarcoat it. Just tell me what's wrong.","tr":"別修飾了，直接告訴我哪裡有問題。","tip":"<b>畫面：</b>在藥丸外面裹一層糖。","th":7,"lv":2},{"p":"spare someone's feelings","zh":"顧及某人的感受","scene":"Mitchell 想顧及 Phil 的感受。","en":"I lied to spare her feelings.","tr":"我說謊是為了不傷她的心。","tip":"<b>用法：</b>spare 有「免除」的意思。","th":6,"lv":2},{"p":"burst into tears","zh":"突然大哭","scene":"Cam 聽完 Claire 的話直接哭出來。","en":"When she heard the news, she burst into tears.","tr":"她聽到消息就突然大哭。","tip":"<b>延伸：</b>burst out laughing 突然大笑。","th":4,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex","plot":"Phil 的笑話一直很冷，演講稿又被藏起來，只好即興上台；Haley 試著教 Alex 怎麼變酷、怎麼交朋友。","items":[{"p":"fall flat","zh":"冷場、沒效果","scene":"Phil 的笑話完全沒人笑。","en":"His joke fell flat. Nobody laughed.","tr":"他的笑話冷場了，沒人笑。","tip":"<b>用法：</b>笑話、計畫、表演沒效果都能用。","th":9,"lv":2},{"p":"a tough crowd","zh":"難搞的觀眾","scene":"台下觀眾很不賞臉。","en":"Wow, nobody laughed. Tough crowd.","tr":"哇，都沒人笑，好難搞的觀眾。","tip":"<b>語氣：</b>講冷笑話沒人笑時的自嘲句。","th":7,"lv":2},{"p":"wing it","zh":"臨場發揮、即興","scene":"Phil 沒有稿子，只好即興演講。","en":"I didn't prepare. I'll just wing it.","tr":"我沒準備，就臨場發揮吧。","tip":"<b>延伸：</b>Let's wing it. 我們隨機應變吧。","th":10,"lv":2},{"p":"off the top of one's head","zh":"不假思索、臨時想到","scene":"Phil 的演講全都是現場想到的。","en":"Off the top of my head, I'd say about fifty people.","tr":"我臨時想的話，大概五十個人吧。","tip":"<b>用法：</b>用在沒查資料、憑印象回答時。","th":7,"lv":2},{"p":"fake it till you make it","zh":"先假裝，直到真的做到","scene":"Haley 教 Alex 先裝酷再說。","en":"I wasn't confident at first. I just faked it till I made it.","tr":"我一開始沒自信，就先裝到真的做到為止。","tip":"<b>用法：</b>鼓勵人先表現得有自信。","th":6,"lv":2},{"p":"social life","zh":"社交生活","scene":"Haley 覺得 Alex 需要有點社交生活。","en":"Since I joined the army, I have no social life.","tr":"我當兵之後就沒有社交生活了。","tip":"<b>延伸：</b>get a life 去過點自己的生活吧。","th":2,"lv":1}]}],"prompts":["你遇過講話很直的人嗎（用 brutally honest、sugarcoat、spare someone's feelings）","你上台說話或報告的經驗（用 wing it、fall flat、a tough crowd）","當兵之後你的社交生活（用 social life、fake it till you make it、off the top of one's head）"],"challenges":[{"id":"c1","sit":"朋友問你他的新髮型好不好看，還叫你老實講，你說老實說不太好看。","uses":["brutally honest"],"ans":"To be brutally honest, it doesn't look great."},{"id":"c2","sit":"班長臨時叫你上台講話，你說你沒準備，只能臨場發揮。","uses":["wing it"],"ans":"I didn't prepare, so I'll just wing it."},{"id":"c3","sit":"你講了一個笑話沒人笑，你自嘲說觀眾好難搞。","uses":["a tough crowd"],"ans":"Wow. Tough crowd."},{"id":"c4","sit":"朋友問你們公司有多少人，你說臨時想的話大概三百個。","uses":["off the top of one's head"],"ans":"Off the top of my head, about three hundred."}]},"s02e05":{"title":"Unplugged","lede":"Dunphy 一家決定全面戒掉手機和電腦一週，看誰撐最久；Gloria 被鄰居家狂吠的狗搞到快崩潰；Mitchell 和 Cam 開始幫 Lily 找幼兒園。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"全家約定戒掉 3C 產品，看誰能撐到最後。","items":[{"p":"unplug","zh":"拔插頭；暫時遠離 3C","scene":"全家要來一場數位排毒。","en":"I unplug on weekends. No phone, no laptop.","tr":"我週末不碰 3C，不用手機也不用電腦。","tip":"<b>延伸：</b>unplugged 也指不插電的音樂演出。","th":8,"lv":1},{"p":"screen time","zh":"看螢幕的時間","scene":"爸媽想減少大家看螢幕的時間。","en":"My screen time was nine hours yesterday.","tr":"我昨天螢幕使用時間九小時。","tip":"<b>用法：</b>手機設定裡的「螢幕使用時間」就是這個。","th":8,"lv":1},{"p":"quit cold turkey","zh":"一下子完全戒掉","scene":"全家決定說戒就戒。","en":"He quit smoking cold turkey.","tr":"他說戒菸就戒菸，一下子完全不碰。","tip":"<b>用法：</b>戒菸、戒手機、戒咖啡都可以。","th":8,"lv":2},{"p":"addicted to","zh":"對某物上癮","scene":"大家都發現自己對手機有多上癮。","en":"I'm addicted to this game.","tr":"我對這個遊戲上癮了。","tip":"<b>延伸：</b>addictive 讓人上癮的。","th":8,"lv":1},{"p":"can't live without","zh":"沒有某物就活不下去","scene":"有些人真的離不開網路。","en":"I can't live without coffee in the morning.","tr":"我早上沒咖啡會活不下去。","tip":"<b>語氣：</b>誇張說法，日常超常用。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay","plot":"鄰居的狗整晚亂叫，Gloria 睡不著，決定自己出手解決。","items":[{"p":"drive someone crazy","zh":"把某人逼瘋","scene":"狗叫聲快把 Gloria 逼瘋了。","en":"The construction noise is driving me crazy.","tr":"施工的噪音快把我逼瘋了。","tip":"<b>延伸：</b>drive me nuts、drive me up the wall 意思一樣。","th":4,"lv":1},{"p":"lose sleep over","zh":"為某事睡不著、煩惱","scene":"Gloria 真的為了狗吵睡不著。","en":"It's just one bad grade. Don't lose sleep over it.","tr":"只是一次考差，別為了這個睡不著。","tip":"<b>用法：</b>常用在否定句，安慰別人別太擔心。","th":4,"lv":2},{"p":"take matters into one's own hands","zh":"自己動手解決","scene":"Gloria 決定不等別人，自己處理。","en":"Nobody fixed the light, so I took matters into my own hands.","tr":"沒人修燈，所以我自己動手了。","tip":"<b>用法：</b>別人不做時，自己出手。","th":10,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人四處參觀幼兒園，想幫 Lily 找到最好的學校。","items":[{"p":"shop around","zh":"貨比三家","scene":"他們到處參觀比較各家幼兒園。","en":"Shop around before you buy a new phone.","tr":"買新手機之前先貨比三家。","tip":"<b>用法：</b>買東西、找學校、找保險都適用。","th":8,"lv":1},{"p":"waiting list","zh":"候補名單","scene":"熱門的幼兒園都要排候補。","en":"The restaurant is so popular there's a waiting list.","tr":"那家餐廳太紅了，要排候補。","tip":"<b>延伸：</b>put someone on the waiting list 把某人排進候補。","th":8,"lv":1}]}],"prompts":["你能接受一整天不碰手機嗎（用 unplug、screen time、can't live without）","有什麼聲音或事情會把你逼瘋（用 drive someone crazy、lose sleep over、take matters into one's own hands）","你有戒掉過什麼習慣嗎（用 quit cold turkey、addicted to、shop around）"],"challenges":[{"id":"c1","sit":"你跟朋友說你昨天手機螢幕時間超過八小時。","uses":["screen time"],"ans":"My screen time was over eight hours yesterday."},{"id":"c2","sit":"寢室有人打呼打整晚，你說快把你逼瘋了。","uses":["drive someone crazy"],"ans":"His snoring is driving me crazy."},{"id":"c3","sit":"朋友擔心明天的測驗，你叫他別為了這個睡不著。","uses":["lose sleep over"],"ans":"Don't lose sleep over it."},{"id":"c4","sit":"你想買新耳機，朋友建議你先貨比三家。","uses":["shop around"],"ans":"You should shop around first."}]},"s02e06":{"title":"Halloween","lede":"萬聖節到了，Claire 把整個家變成鬼屋，還幫每個人分配角色；Phil 因為鄰居離婚，開始擔心自己的婚姻；Cam 因為小時候的陰影很怕萬聖節；Mitchell 心情超差，穿著蜘蛛人裝去上班；Gloria 被 Jay 和 Manny 笑口音之後，開始怪怪的。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · 孩子們","plot":"Claire 對萬聖節超級認真，把家裡布置成鬼屋；Phil 擔心自己的婚姻也會出問題。","items":[{"p":"go all out","zh":"全力以赴、卯起來","scene":"Claire 每年萬聖節都卯起來布置。","en":"They went all out for the wedding.","tr":"他們的婚禮辦得超盛大。","tip":"<b>用法：</b>花很多錢、很多心力去做一件事。","th":10,"lv":1},{"p":"trick-or-treat","zh":"萬聖節要糖","scene":"孩子們要出門挨家挨戶要糖果。","en":"The kids are going trick-or-treating tonight.","tr":"孩子們今晚要去要糖果。","tip":"<b>字面：</b>不給糖就搗蛋。","th":8,"lv":1},{"p":"haunted house","zh":"鬼屋","scene":"Claire 把家裡變成鬼屋。","en":"I screamed the whole time in the haunted house.","tr":"我在鬼屋裡從頭叫到尾。","tip":"<b>延伸：</b>haunted 鬧鬼的。","th":8,"lv":1},{"p":"on the rocks","zh":"出問題、快破裂（感情）","scene":"鄰居離婚讓 Phil 擔心自己的婚姻。","en":"I heard their marriage is on the rocks.","tr":"我聽說他們的婚姻出問題了。","tip":"<b>延伸：</b>點酒時 on the rocks 是加冰塊。","th":1,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Cam 小時候萬聖節有陰影；Mitchell 心情很差，穿著蜘蛛人裝去上班，在辦公室格格不入。","items":[{"p":"have a rough day","zh":"過了很糟的一天","scene":"Mitchell 這天真的很不順。","en":"I had a rough day. Can we just order pizza?","tr":"我今天很不順，我們可以叫披薩就好嗎？","tip":"<b>對比：</b>rough 是粗糙，這裡指「辛苦、不順」。","th":4,"lv":1},{"p":"dress code","zh":"服裝規定","scene":"公司可沒有允許穿蜘蛛人裝。","en":"The dress code for the party is all black.","tr":"派對的服裝規定是全黑。","tip":"<b>延伸：</b>casual dress code 便服即可。","th":8,"lv":1},{"p":"stick out like a sore thumb","zh":"非常顯眼、格格不入","scene":"Mitchell 穿著戲服在辦公室超突兀。","en":"In my uniform, I stuck out like a sore thumb at the party.","tr":"我穿制服去派對，整個超突兀。","tip":"<b>畫面：</b>腫起來的拇指特別明顯。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 和 Manny 拿 Gloria 的口音開玩笑，Gloria 嘴上不說，心裡很受傷。","items":[{"p":"poke fun at","zh":"開玩笑、揶揄","scene":"父子倆拿 Gloria 的發音開玩笑。","en":"They always poke fun at my Taiwanese accent.","tr":"他們老是拿我的台灣口音開玩笑。","tip":"<b>對比：</b>make fun of 比較重；poke fun at 比較輕。","th":5,"lv":2},{"p":"hurt someone's feelings","zh":"傷某人的心","scene":"玩笑話其實傷到了 Gloria。","en":"I didn't mean to hurt your feelings.","tr":"我不是故意要傷你的心。","tip":"<b>用法：</b>道歉時很常用。","th":4,"lv":1},{"p":"lost in translation","zh":"翻譯後意思跑掉","scene":"有些話翻成英文就不對勁了。","en":"The joke was lost in translation.","tr":"這個笑話翻譯之後就不好笑了。","tip":"<b>延伸：</b>同名電影《愛情，不用翻譯》。","th":9,"lv":2}]}],"prompts":["你最喜歡的節日，你會怎麼卯起來過（用 go all out、trick-or-treat、haunted house）","你很不順的一天（用 have a rough day、stick out like a sore thumb、dress code）","你說英文被笑過嗎（用 poke fun at、hurt someone's feelings、lost in translation）"],"challenges":[{"id":"c1","sit":"你跟媽媽說你今天很不順，只想早點睡。","uses":["have a rough day"],"ans":"I had a rough day. I just want to sleep."},{"id":"c2","sit":"你穿短褲拖鞋去參加朋友的婚禮，跟朋友說你超突兀。","uses":["stick out like a sore thumb"],"ans":"I stuck out like a sore thumb."},{"id":"c3","sit":"新同事一直拿你的口音開玩笑，你私下跟他說那樣有點傷人。","uses":["hurt someone's feelings"],"ans":"That kind of hurt my feelings."},{"id":"c4","sit":"朋友問派對要穿什麼，你說服裝規定是全白。","uses":["dress code"],"ans":"The dress code is all white."}]},"s02e07":{"title":"Chirp","lede":"Claire 和 Haley 生病在家，Phil 到處找那個一直嗶嗶叫的煙霧偵測器；一段肥皂劇的台詞讓大家誤會一場；Gloria 和 Manny 去 Jay 的公司，父子倆吵了起來；Cam 不顧 Mitchell 反對，帶 Lily 去拍廣告。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Haley · Phil","plot":"Claire 和 Haley 生病在家看肥皂劇；Phil 為了找出嗶嗶叫的來源，把家裡翻遍了。","items":[{"p":"come down with","zh":"染上（病）","scene":"Claire 和 Haley 都生病了。","en":"I think I'm coming down with a cold.","tr":"我覺得我快感冒了。","tip":"<b>用法：</b>come down with + 病名，表示剛開始生病。","th":8,"lv":1},{"p":"track down","zh":"追查、找出","scene":"Phil 到處追查聲音從哪來。","en":"It took me a week to track down the right charger.","tr":"我花了一週才找到對的充電器。","tip":"<b>用法：</b>找人、找東西、找原因都可以。","th":10,"lv":1},{"p":"a pain in the neck","zh":"很煩人的人或事","scene":"那個嗶嗶聲煩死人了。","en":"Doing taxes is a pain in the neck.","tr":"報稅真的很煩。","tip":"<b>延伸：</b>He's a pain in the neck. 他很煩人。","th":9,"lv":2},{"p":"soap opera","zh":"肥皂劇","scene":"一段肥皂劇台詞讓人誤會。","en":"My grandma watches soap operas every afternoon.","tr":"我奶奶每天下午都看八點檔。","tip":"<b>延伸：</b>形容生活像肥皂劇，表示很多狗血情節。","th":8,"lv":1},{"p":"mix-up","zh":"搞混、誤會","scene":"一場因為電視台詞引起的誤會。","en":"Sorry about the mix-up. I gave you the wrong address.","tr":"抱歉搞混了，我給錯地址了。","tip":"<b>用法：</b>小錯誤、小誤會都可以用。","th":9,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Gloria 和 Manny 去 Jay 的公司，Manny 卻在員工面前跟 Jay 頂嘴。","items":[{"p":"boss around","zh":"對人發號施令、使喚人","scene":"Manny 不喜歡被 Jay 命令來命令去。","en":"Stop bossing me around. I'm not your assistant.","tr":"別再使喚我了，我不是你助理。","tip":"<b>延伸：</b>bossy 愛使喚人的。","th":5,"lv":1},{"p":"talk back","zh":"頂嘴","scene":"Manny 在員工面前頂撞 Jay。","en":"Don't talk back to your mother.","tr":"別跟你媽頂嘴。","tip":"<b>用法：</b>多用在小孩對父母、下屬對上司。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · Lily","plot":"Cam 覺得這是 Lily 的大好機會，不顧 Mitchell 的反對帶她去拍廣告。","items":[{"p":"against someone's wishes","zh":"違背某人的意願","scene":"Mitchell 明明說不要，Cam 還是去了。","en":"He moved abroad against his parents' wishes.","tr":"他不顧爸媽反對搬去國外。","tip":"<b>延伸：</b>respect someone's wishes 尊重某人的意願。","th":2,"lv":2},{"p":"big break","zh":"成名的大好機會","scene":"Cam 覺得這是 Lily 的大好機會。","en":"Her big break came when she was 25.","tr":"她 25 歲時迎來事業的大突破。","tip":"<b>用法：</b>演藝圈、職場的轉捩點。","th":3,"lv":2},{"p":"audition","zh":"試鏡、甄選","scene":"Lily 要去拍廣告的試鏡。","en":"I have an audition for a musical tomorrow.","tr":"我明天有一場音樂劇的試鏡。","tip":"<b>用法：</b>名詞和動詞都可以。","th":3,"lv":1}]}],"prompts":["你最近一次生病的經驗（用 come down with、a pain in the neck、soap opera）","你小時候會跟爸媽頂嘴嗎（用 talk back、boss around、against someone's wishes）","你覺得自己的大好機會是什麼（用 big break、audition、track down）"],"challenges":[{"id":"c1","sit":"你喉嚨痛，跟主管說你好像要感冒了。","uses":["come down with"],"ans":"I think I'm coming down with a cold."},{"id":"c2","sit":"你哥一直使喚你做家事，你私下跟朋友抱怨。","uses":["boss around"],"ans":"He keeps bossing me around."},{"id":"c3","sit":"你訂錯餐廳日期，跟女朋友說抱歉搞混了。","uses":["mix-up"],"ans":"Sorry about the mix-up."},{"id":"c4","sit":"你跟朋友說每天打掃廁所很煩。","uses":["a pain in the neck"],"ans":"Cleaning the bathroom is a pain in the neck."}]},"s02e08":{"title":"Manny Get Your Gun","lede":"全家約在餐廳幫 Manny 慶生，Manny 卻煩惱自己又老了一歲；Phil 和 Claire 開車比賽誰先到；Mitchell 和 Cam 在商場找禮物找到迷路。","stories":[{"id":"jay","name":"Jay 家","who":"Manny · Jay · Gloria","plot":"Manny 過生日卻很感傷，覺得自己長大得太快。","items":[{"p":"act one's age","zh":"表現得符合年紀","scene":"Manny 總是表現得比實際年齡老成。","en":"You're 30. Act your age!","tr":"你都 30 歲了，成熟點！","tip":"<b>用法：</b>常用來叫人別幼稚。","th":9,"lv":1},{"p":"grow up too fast","zh":"長大得太快","scene":"Manny 覺得自己長太快了。","en":"Kids grow up too fast these days.","tr":"現在的小孩長大得太快了。","tip":"<b>用法：</b>長輩看著孩子常說的感嘆。","th":2,"lv":1},{"p":"over the hill","zh":"過了巔峰、老了","scene":"Manny 才十一歲就覺得自己老了。","en":"I'm turning 40. I'm officially over the hill.","tr":"我要 40 了，正式步入中年了。","tip":"<b>畫面：</b>翻過山頭開始走下坡。","th":9,"lv":2},{"p":"make a wish","zh":"許願","scene":"吹蠟燭前要許願。","en":"Close your eyes and make a wish.","tr":"閉上眼睛許個願。","tip":"<b>延伸：</b>Did your wish come true? 你的願望實現了嗎？","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"兩人分頭出發，暗中較勁看誰先到餐廳。","items":[{"p":"competitive streak","zh":"好勝心","scene":"兩人的好勝心都上來了。","en":"My sister has a real competitive streak.","tr":"我姊好勝心很強。","tip":"<b>延伸：</b>competitive 好勝的。","th":9,"lv":2},{"p":"beat someone to it","zh":"搶先一步","scene":"兩人都想比對方先到。","en":"I wanted to buy that bag, but she beat me to it.","tr":"我想買那個包，結果被她搶先了。","tip":"<b>用法：</b>beat me to it 被搶先。","th":10,"lv":1},{"p":"take a shortcut","zh":"抄捷徑","scene":"Phil 想抄近路先到。","en":"Let's take a shortcut through the park.","tr":"我們從公園抄捷徑吧。","tip":"<b>延伸：</b>There are no shortcuts to success. 成功沒有捷徑。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人在商場找生日禮物，越逛越亂，最後困在裡面出不來。","items":[{"p":"go around in circles","zh":"繞圈圈、原地打轉","scene":"兩人在商場裡繞來繞去。","en":"We've been going around in circles for an hour.","tr":"我們已經原地繞了一個小時了。","tip":"<b>用法：</b>迷路或討論沒進展都可以用。","th":10,"lv":2},{"p":"lose track of time","zh":"忘了時間","scene":"逛著逛著就忘了時間。","en":"Sorry I'm late. I lost track of time.","tr":"抱歉我遲到了，我忘了時間。","tip":"<b>用法：</b>遲到時很好用的解釋。","th":8,"lv":1},{"p":"empty-handed","zh":"兩手空空","scene":"他們差點兩手空空去慶生。","en":"I can't show up empty-handed. Let's buy some fruit.","tr":"我不能空手去，我們買點水果吧。","tip":"<b>用法：</b>拜訪別人家時很常說。","th":8,"lv":1}]}],"prompts":["你覺得自己長大了的那一刻（用 grow up too fast、act one's age、over the hill）","你跟家人或朋友暗中較勁的經驗（用 competitive streak、beat someone to it、take a shortcut）","你逛街逛到迷路或忘了時間的經驗（用 go around in circles、lose track of time、empty-handed）"],"challenges":[{"id":"c1","sit":"朋友都快 25 了還在跟弟弟搶玩具，你叫他成熟點。","uses":["act one's age"],"ans":"Dude, act your age."},{"id":"c2","sit":"你想報名的課程被朋友搶先報滿了。","uses":["beat someone to it"],"ans":"I wanted to sign up, but he beat me to it."},{"id":"c3","sit":"你去女朋友家拜訪，說不能空手去。","uses":["empty-handed"],"ans":"I can't go empty-handed."},{"id":"c4","sit":"你打電動打到忘了時間，跟朋友道歉。","uses":["lose track of time"],"ans":"Sorry, I lost track of time."}]},"s02e09":{"title":"Mother Tucker","lede":"Mitchell 終於坦白，Cam 的媽媽 Barb 讓他很不自在；Haley 跟 Dylan 分手，最難過的竟然是 Phil；Jay 肚子痛，跟 Manny 上網查完之後越想越嚴重。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Barb","plot":"Cam 的媽媽來作客，熱情到讓 Mitchell 有點吃不消。","items":[{"p":"can't stand","zh":"受不了","scene":"Mitchell 有點受不了 Barb 的熱情。","en":"I can't stand people who chew loudly.","tr":"我受不了吃東西很大聲的人。","tip":"<b>用法：</b>can't stand + 人／V-ing。","th":4,"lv":1},{"p":"overbearing","zh":"強勢、讓人有壓力的","scene":"Barb 的個性讓人有點喘不過氣。","en":"My boss is so overbearing. He checks everything I do.","tr":"我老闆很強勢，什麼都要管。","tip":"<b>用法：</b>形容控制慾強的人。","th":9,"lv":2},{"p":"get used to","zh":"習慣","scene":"Mitchell 努力想適應 Cam 的家人。","en":"I'm still getting used to waking up at five.","tr":"我還在習慣五點起床。","tip":"<b>注意：</b>get used to + V-ing，to 後面接名詞或動名詞。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Haley · Phil · Dylan","plot":"Haley 跟 Dylan 分手，Phil 比 Haley 還難過。","items":[{"p":"break up with","zh":"跟某人分手","scene":"Haley 跟男友分手了。","en":"She broke up with her boyfriend last week.","tr":"她上週跟男友分手了。","tip":"<b>名詞：</b>breakup 分手。","th":1,"lv":1},{"p":"dump","zh":"甩掉（某人）","scene":"這次到底是誰甩了誰？","en":"He got dumped by text.","tr":"他被傳訊息分手。","tip":"<b>語氣：</b>比 break up 更直接、更痛。","th":1,"lv":1},{"p":"heartbroken","zh":"心碎的","scene":"Phil 難過得好像自己失戀。","en":"He was heartbroken when his dog died.","tr":"他的狗死掉時他心都碎了。","tip":"<b>延伸：</b>heartbreak 心碎（名詞）。","th":4,"lv":1},{"p":"take it hard","zh":"很難接受、很受打擊","scene":"Phil 對這件事反應特別大。","en":"He took the news really hard.","tr":"他聽到這個消息很受打擊。","tip":"<b>對比：</b>take it easy 是放輕鬆。","th":4,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Jay 肚子痛，Manny 幫他上網查，越查越嚇人。","items":[{"p":"look it up","zh":"查一下","scene":"兩人上網查症狀。","en":"I don't know what it means. Let me look it up.","tr":"我不知道那是什麼意思，我查一下。","tip":"<b>用法：</b>look up + 字／資料。","th":8,"lv":1},{"p":"hypochondriac","zh":"疑病症患者（老是覺得自己生病）","scene":"上網查完，Jay 開始懷疑自己得了重病。","en":"He's such a hypochondriac. Every headache is a brain tumor to him.","tr":"他超愛自己嚇自己，每次頭痛都以為是腦瘤。","tip":"<b>用法：</b>口語中常用來調侃愛擔心生病的人。","th":9,"lv":2},{"p":"it's probably nothing","zh":"應該沒什麼啦","scene":"大家一開始都說應該沒事。","en":"It's probably nothing, but you should see a doctor.","tr":"應該沒什麼啦，不過你還是去看一下醫生。","tip":"<b>語氣：</b>安撫人的常用句。","th":6,"lv":1}]}],"prompts":["你最受不了別人的什麼習慣（用 can't stand、overbearing、get used to）","你身邊有人分手過嗎，他怎麼面對（用 break up with、heartbroken、take it hard）","你會上網查自己的症狀嗎（用 look it up、hypochondriac、it's probably nothing）"],"challenges":[{"id":"c1","sit":"你跟朋友說你受不了寢室有人半夜講電話。","uses":["can't stand"],"ans":"I can't stand people talking on the phone at night."},{"id":"c2","sit":"你剛下部隊，跟家人說你還在習慣早起。","uses":["get used to"],"ans":"I'm still getting used to getting up early."},{"id":"c3","sit":"大學好友被女友傳訊息分手，你跟其他人說他很受打擊。","uses":["dump","take it hard"],"ans":"He got dumped by text. He's taking it hard."},{"id":"c4","sit":"朋友手腕有點痛很擔心，你安慰他。","uses":["it's probably nothing"],"ans":"It's probably nothing, but get it checked."}]},"s02e10":{"title":"Dance Dance Revelation","lede":"Luke 和 Manny 第一次參加學校舞會，Jay 和 Phil 帶他們去商場準備，結果一團亂；Gloria 加入舞會委員會，讓 Claire 很吃醋；Mitchell 和 Cam 發現 Lily 在遊樂場咬其他小朋友。","stories":[{"id":"jay","name":"Jay、Phil 和兩個孩子","who":"Jay · Phil · Luke · Manny","plot":"兩個大人帶兩個小男生去準備人生第一次舞會。","items":[{"p":"ask someone out","zh":"約某人出去","scene":"Manny 和 Luke 都在想要約誰。","en":"He finally asked her out after six months.","tr":"他過了六個月終於約她出去了。","tip":"<b>用法：</b>ask someone out on a date。","th":1,"lv":1},{"p":"slow dance","zh":"慢舞","scene":"舞會上最讓人緊張的就是慢舞。","en":"I've never slow-danced with anyone.","tr":"我從來沒跟人跳過慢舞。","tip":"<b>延伸：</b>舞會最後通常會放一首慢歌。","th":1,"lv":1},{"p":"wingman","zh":"僚機（幫忙追人的朋友）","scene":"大人們想當孩子的戀愛僚機。","en":"Can you be my wingman tonight?","tr":"你今晚可以當我的僚機嗎？","tip":"<b>字面：</b>戰鬥機旁邊掩護的僚機。","th":1,"lv":2},{"p":"nervous wreck","zh":"緊張到不行的人","scene":"兩個男生緊張到快崩潰。","en":"I was a nervous wreck before my interview.","tr":"我面試前緊張到不行。","tip":"<b>用法：</b>I'm a nervous wreck. 我緊張死了。","th":4,"lv":2}]},{"id":"dunphy","name":"Claire 和 Gloria","who":"Claire · Gloria","plot":"Gloria 一加入舞會委員會就大受歡迎，Claire 覺得風頭被搶了。","items":[{"p":"take over","zh":"接管、主導","scene":"Gloria 一來就主導了整個委員會。","en":"When the manager left, she took over the team.","tr":"經理離開後，她接管了整個團隊。","tip":"<b>名詞：</b>takeover 接管。","th":3,"lv":1},{"p":"steal someone's thunder","zh":"搶別人的鋒頭","scene":"Claire 覺得 Gloria 搶了她的光彩。","en":"I didn't want to steal her thunder on her birthday.","tr":"我不想在她生日那天搶她鋒頭。","tip":"<b>對比：</b>steal the show 是成為焦點；steal someone's thunder 是搶走別人的光彩。","th":5,"lv":2},{"p":"queen bee","zh":"女王蜂（群體中的大姐頭）","scene":"Claire 一直是委員會裡的大姐頭。","en":"She's the queen bee of her office.","tr":"她是辦公室裡的大姐頭。","tip":"<b>用法：</b>多半帶點調侃。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人驚訝地發現 Lily 會咬其他小朋友，覺得超丟臉。","items":[{"p":"it's just a phase","zh":"只是一個階段","scene":"兩人希望咬人只是暫時的。","en":"Don't worry. It's just a phase. He'll grow out of it.","tr":"別擔心，只是一個階段，他長大就好了。","tip":"<b>延伸：</b>grow out of 長大後就不再做某事。","th":6,"lv":1},{"p":"mortified","zh":"丟臉死了、羞愧","scene":"兩個爸爸在其他家長面前糗到不行。","en":"I was mortified when my phone rang during the ceremony.","tr":"典禮中我手機響了，我丟臉死了。","tip":"<b>語氣：</b>比 embarrassed 更強烈。","th":4,"lv":2},{"p":"set an example","zh":"以身作則","scene":"他們得想辦法當 Lily 的好榜樣。","en":"As the oldest, you need to set an example.","tr":"你是老大，要以身作則。","tip":"<b>延伸：</b>set a good example 樹立好榜樣。","th":2,"lv":1}]}],"prompts":["你第一次約別人出去的經驗（用 ask someone out、nervous wreck、wingman）","你被搶過鋒頭嗎（用 steal someone's thunder、take over、queen bee）","你最丟臉的一刻（用 mortified、it's just a phase、set an example）"],"challenges":[{"id":"c1","sit":"朋友要去聯誼，請你當他的僚機。","uses":["wingman"],"ans":"Will you be my wingman tonight?"},{"id":"c2","sit":"你跟朋友說你國防部測驗前緊張到不行。","uses":["nervous wreck"],"ans":"I was a nervous wreck before the test."},{"id":"c3","sit":"新來的店長一來就接管了整個廚房。","uses":["take over"],"ans":"He took over the whole kitchen."},{"id":"c4","sit":"你是打工店裡最資深的，店長叫你以身作則。","uses":["set an example"],"ans":"You need to set an example."}]},"s02e11":{"title":"Slow Down Your Neighbors","lede":"社區有台車一直飆車，Claire 化身正義魔人要抓到人；Phil 努力搞定一位很難搞的客戶；Jay 教 Manny 和 Gloria 騎腳踏車；Mitchell 和 Cam 認識了一位迷人又神秘的新鄰居。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 一心要抓到社區的飆車族；Phil 想拿下一個很難搞的客戶。","items":[{"p":"on a mission","zh":"有使命、一心一意要做某事","scene":"Claire 抓飆車族抓到很投入。","en":"I'm on a mission to find the best beef noodles in Taipei.","tr":"我立志要找到台北最好吃的牛肉麵。","tip":"<b>語氣：</b>帶點幽默，形容很執著。","th":10,"lv":1},{"p":"catch someone red-handed","zh":"當場抓到","scene":"Claire 想當場逮到那個駕駛。","en":"My mom caught me red-handed eating cake at midnight.","tr":"我媽半夜當場抓到我偷吃蛋糕。","tip":"<b>畫面：</b>手上還沾著紅色（血跡），人贓俱獲。","th":10,"lv":2},{"p":"watch out","zh":"小心","scene":"路上的人都得小心那台車。","en":"Watch out! There's a car coming.","tr":"小心！有車來了。","tip":"<b>延伸：</b>watch out for + 東西，小心某物。","th":7,"lv":1},{"p":"close the deal","zh":"談成生意、成交","scene":"Phil 想把這筆生意談下來。","en":"He bought me lunch to help close the deal.","tr":"他請我吃午餐，想把生意談成。","tip":"<b>用法：</b>業務、房仲超常用。","th":3,"lv":1},{"p":"a tough cookie","zh":"很強悍、很難搞的人","scene":"Phil 的客戶不好對付。","en":"My grandma is a tough cookie. Nothing scares her.","tr":"我奶奶很強悍，什麼都不怕。","tip":"<b>用法：</b>正面時是「堅強」，負面時是「難搞」。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny · Gloria","plot":"Jay 教 Manny 和 Gloria 騎腳踏車，兩人都騎得歪歪斜斜。","items":[{"p":"like riding a bike","zh":"像騎腳踏車一樣，學會就不會忘","scene":"Jay 說騎車這種事學會就忘不了。","en":"Don't worry about swimming again. It's like riding a bike.","tr":"別擔心再游泳，學會就不會忘。","tip":"<b>用法：</b>形容技能一旦學會就不會忘。","th":6,"lv":2},{"p":"keep your balance","zh":"保持平衡","scene":"兩人一直抓不到平衡。","en":"It's hard to keep your balance on this boat.","tr":"在這艘船上很難保持平衡。","tip":"<b>反義：</b>lose your balance 失去平衡。","th":8,"lv":1},{"p":"fall off","zh":"跌下來","scene":"一不小心就摔車。","en":"I fell off my bike and scraped my knee.","tr":"我從腳踏車上摔下來，膝蓋擦傷了。","tip":"<b>延伸：</b>fall off the wagon 也指「破戒」。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"新鄰居帥氣、迷人又神秘，兩人對他越來越好奇。","items":[{"p":"too good to be true","zh":"好到不像真的","scene":"新鄰居完美到讓人起疑。","en":"A free trip to Japan? Sounds too good to be true.","tr":"免費去日本？聽起來好到不像真的。","tip":"<b>用法：</b>懷疑詐騙時也很常說。","th":7,"lv":1},{"p":"full of surprises","zh":"充滿驚喜","scene":"這位鄰居身上總有新發現。","en":"My little brother is full of surprises.","tr":"我弟總是讓人很意外。","tip":"<b>延伸：</b>Life is full of surprises. 人生充滿驚喜。","th":9,"lv":1}]}],"prompts":["你曾經很執著要完成的一件事（用 on a mission、catch someone red-handed、watch out）","一個學會就忘不了的技能（用 like riding a bike、keep your balance、fall off）","你收過好到不像真的訊息或優惠嗎（用 too good to be true、a tough cookie、close the deal）"],"challenges":[{"id":"c1","sit":"你立志連假要吃遍台南小吃，跟朋友說。","uses":["on a mission"],"ans":"I'm on a mission to try every snack in Tainan."},{"id":"c2","sit":"同梯偷吃你的泡麵被你當場抓到。","uses":["catch someone red-handed"],"ans":"I caught him red-handed."},{"id":"c3","sit":"你收到中獎簡訊，朋友說好到不像真的，小心詐騙。","uses":["too good to be true"],"ans":"That sounds too good to be true."},{"id":"c4","sit":"你很久沒游泳，但一下水就會了，跟朋友說就像騎腳踏車一樣。","uses":["like riding a bike"],"ans":"It's like riding a bike."}]},"s02e12":{"title":"Our Children, Ourselves","lede":"Alex 對學習的拼勁讓 Phil 和 Claire 懷疑：女兒這麼優秀，到底是遺傳到誰？Gloria 想交新朋友，卻有點融不進去；Mitchell 和 Cam 出門時，Mitchell 巧遇以前的女朋友。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Alex","plot":"Alex 太優秀了，爸媽開始反省自己到底做對了什麼。","items":[{"p":"overachiever","zh":"超級資優、什麼都要做到最好的人","scene":"Alex 是標準的學霸。","en":"My sister is an overachiever. She has three degrees.","tr":"我姊超級資優，有三個學位。","tip":"<b>用法：</b>有時帶點「太拼了」的意思。","th":9,"lv":1},{"p":"hard work pays off","zh":"努力會有回報","scene":"Alex 的成績都是苦讀來的。","en":"You got the job! Hard work pays off.","tr":"你錄取了！努力有回報了。","tip":"<b>延伸：</b>It paid off. 有回報了。","th":6,"lv":1},{"p":"take after","zh":"長得像、個性像（長輩）","scene":"爸媽在想 Alex 到底像誰。","en":"You really take after your dad.","tr":"你真的很像你爸。","tip":"<b>注意：</b>只能用在像家族中的長輩。","th":2,"lv":1},{"p":"follow in someone's footsteps","zh":"步上某人的後塵、跟著某人的腳步","scene":"爸媽好奇 Alex 會不會走上跟他們一樣的路。","en":"He followed in his father's footsteps and became a doctor.","tr":"他跟隨爸爸的腳步當了醫生。","tip":"<b>用法：</b>多指職業或人生道路。","th":2,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay","plot":"Gloria 想在新環境交朋友，但總覺得自己格格不入。","items":[{"p":"hang out","zh":"一起出去玩、混在一起","scene":"Gloria 想找人一起出去。","en":"Do you want to hang out this weekend?","tr":"你這週末要不要一起出去？","tip":"<b>名詞：</b>hangout 常去的地方。","th":2,"lv":1},{"p":"click with","zh":"一拍即合","scene":"Gloria 想找個能跟她合得來的人。","en":"I really clicked with my new roommate.","tr":"我跟新室友超合得來。","tip":"<b>對比：</b>hit it off 是第一次見面就合；click 也可以用在一般相處。","th":2,"lv":2},{"p":"fish out of water","zh":"離水的魚、格格不入","scene":"Gloria 在新圈子裡很不自在。","en":"At my first army camp, I felt like a fish out of water.","tr":"第一次到新訓中心，我覺得自己格格不入。","tip":"<b>畫面：</b>魚離開水很不舒服。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 巧遇大學時的前女友，Cam 好奇得不得了。","items":[{"p":"run into","zh":"巧遇","scene":"Mitchell 偶然碰到前女友。","en":"I ran into my old teacher at the train station.","tr":"我在火車站巧遇以前的老師。","tip":"<b>對比：</b>meet 是約好見；run into 是不期而遇。","th":8,"lv":1},{"p":"small world","zh":"世界真小","scene":"竟然在這裡遇到老朋友。","en":"You know my cousin? It's a small world!","tr":"你認識我表哥？世界真小！","tip":"<b>用法：</b>遇到意外的交集時說。","th":7,"lv":1},{"p":"blast from the past","zh":"勾起回憶的人或事","scene":"前女友的出現讓人想起過去。","en":"Seeing my old Game Boy was a blast from the past.","tr":"看到我的舊 Game Boy 讓我好懷念。","tip":"<b>用法：</b>老歌、老朋友、舊東西都可以。","th":7,"lv":2}]}],"prompts":["你像爸爸還是媽媽（用 take after、follow in someone's footsteps、overachiever）","你在哪裡巧遇過熟人（用 run into、small world、blast from the past）","你在新環境覺得格格不入的經驗（用 fish out of water、click with、hang out）"],"challenges":[{"id":"c1","sit":"親戚說你跟你爸好像，你回答你個性也像他。","uses":["take after"],"ans":"Yeah, I really take after my dad."},{"id":"c2","sit":"你週末在高鐵站巧遇國小同學。","uses":["run into","small world"],"ans":"I ran into my old classmate at the station. Small world!"},{"id":"c3","sit":"你跟新來的同事很合得來，跟家人說。","uses":["click with"],"ans":"I really clicked with the new guy."},{"id":"c4","sit":"朋友考上研究所，你恭喜他說努力有回報。","uses":["hard work pays off"],"ans":"Congrats! Hard work pays off."}]},"s02e13":{"title":"Caught in the Act","lede":"Manny 去找親生爸爸的這天，Jay 和 Gloria 不小心把罵 Claire 的郵件寄給了她本人，只好上門道歉，卻撞見更尷尬的事：孩子們剛剛撞見了 Phil 和 Claire 的親密時刻；Mitchell 和 Cam 則想討好熱門餐廳的老闆來訂位，結果搞砸。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"兩人不小心把一封抱怨 Claire 的信寄出去，急著去補救。","items":[{"p":"hit send","zh":"按下傳送","scene":"信一按出去就收不回來了。","en":"I hit send before I noticed the typo.","tr":"我按下傳送後才發現有錯字。","tip":"<b>延伸：</b>hit reply all 不小心按了全部回覆。","th":8,"lv":1},{"p":"take it back","zh":"收回（說過的話）","scene":"Jay 和 Gloria 很想收回那封信。","en":"I'm sorry I said that. I take it back.","tr":"抱歉我說了那些話，我收回。","tip":"<b>延伸：</b>You can't take it back. 說出口就收不回來了。","th":6,"lv":1},{"p":"beat around the bush","zh":"拐彎抹角","scene":"兩人道歉時一直不敢直說。","en":"Stop beating around the bush. What happened?","tr":"別拐彎抹角了，到底發生什麼事？","tip":"<b>畫面：</b>在灌木叢周圍打轉，不直接進去。","th":7,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"孩子們不小心撞見爸媽在房間的親密時刻，全家陷入超級尷尬。","items":[{"p":"walk in on","zh":"撞見（不該看到的場面）","scene":"孩子們開門撞見爸媽。","en":"I walked in on my roommate singing in the shower.","tr":"我撞見室友在浴室唱歌。","tip":"<b>用法：</b>walk in on + 人 + V-ing。","th":8,"lv":2},{"p":"scarred for life","zh":"留下一輩子的陰影","scene":"孩子們覺得自己被嚇到一輩子忘不了。","en":"I watched that horror movie at age eight. Scarred for life.","tr":"我八歲看了那部恐怖片，陰影一輩子。","tip":"<b>語氣：</b>誇張的玩笑話，很常用。","th":4,"lv":2},{"p":"ever heard of knocking","zh":"不會敲門嗎","scene":"這家人最需要學的就是先敲門。","en":"Hey! Ever heard of knocking?","tr":"喂！你不會敲門喔？","tip":"<b>語氣：</b>被人突然闖進房間時的經典台詞。","th":7,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"為了訂到超難訂的餐廳，兩人努力討好老闆，結果用力過頭。","items":[{"p":"book a table","zh":"訂位","scene":"那家餐廳超難訂。","en":"Can you book a table for four at seven?","tr":"你可以幫我訂七點四個人的位子嗎？","tip":"<b>延伸：</b>make a reservation 比較正式。","th":8,"lv":1},{"p":"pull some strings","zh":"動用關係、走後門","scene":"兩人想靠關係拿到位子。","en":"My uncle pulled some strings to get me the tickets.","tr":"我叔叔動用關係幫我拿到票。","tip":"<b>畫面：</b>拉操縱木偶的線。","th":10,"lv":2},{"p":"butter up","zh":"拍馬屁、討好","scene":"他們拼命討好餐廳老闆。","en":"He's buttering up the boss before asking for a raise.","tr":"他要求加薪之前先拍老闆馬屁。","tip":"<b>對比：</b>suck up to 比較負面；butter up 是為了達到目的而討好。","th":3,"lv":2},{"p":"go overboard","zh":"做過頭","scene":"討好得太誇張，反而出事。","en":"Don't go overboard with the decorations.","tr":"裝飾不要做過頭。","tip":"<b>畫面：</b>熱情到掉出船外。","th":9,"lv":1}]}],"prompts":["你按錯傳送鍵或傳錯人的經驗（用 hit send、take it back、beat around the bush）","你撞見過什麼尷尬的場面（用 walk in on、scarred for life、ever heard of knocking）","你用過關係或拍過馬屁嗎（用 pull some strings、butter up、go overboard）"],"challenges":[{"id":"c1","sit":"你把抱怨主管的訊息傳到公司群組，跟朋友說你按下傳送才發現。","uses":["hit send"],"ans":"I hit send and then realized it was the wrong chat."},{"id":"c2","sit":"室友沒敲門就闖進你房間，你說你不會敲門喔。","uses":["ever heard of knocking"],"ans":"Hey, ever heard of knocking?"},{"id":"c3","sit":"朋友講話一直繞圈子，你叫他直說。","uses":["beat around the bush"],"ans":"Stop beating around the bush."},{"id":"c4","sit":"你叫女朋友幫忙訂一家燒肉店兩個人的位子。","uses":["book a table"],"ans":"Can you book a table for two?"}]},"s02e14":{"title":"Bixby's Back","lede":"情人節又到了，Phil 和 Claire 再次在飯店玩起角色扮演，Phil 化身神秘的 Clive Bixby，結果狀況百出；Jay 精心準備給 Gloria 的情人節驚喜一直延誤；一位愛慕者讓 Mitchell 和 Cam 之間起了波瀾。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Phil 再次化身另一個人格 Clive Bixby，兩人的浪漫計畫卻被意外打斷。","items":[{"p":"alter ego","zh":"另一個自我、分身","scene":"Clive Bixby 是 Phil 的浪漫分身。","en":"On stage, she becomes her confident alter ego.","tr":"她一上台就變成自信的另一個自己。","tip":"<b>延伸：</b>Fizbo 就是 Cam 的 alter ego。","th":9,"lv":2},{"p":"in the mood","zh":"有心情、有興致","scene":"兩人努力醞釀浪漫氣氛。","en":"I'm not in the mood for pizza tonight.","tr":"我今晚沒心情吃披薩。","tip":"<b>用法：</b>in the mood for + 東西。","th":4,"lv":1},{"p":"ruin the moment","zh":"破壞氣氛","scene":"每次快成功就有東西來破壞。","en":"His phone rang and ruined the moment.","tr":"他的手機響了，破壞了氣氛。","tip":"<b>延伸：</b>Way to ruin the moment. 很會破壞氣氛喔。","th":1,"lv":1},{"p":"on cloud nine","zh":"開心得飛上天","scene":"情人節就是要讓人飄飄然。","en":"She's been on cloud nine since she got engaged.","tr":"她訂婚後一直開心得飛上天。","tip":"<b>同義：</b>over the moon。","th":4,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 準備了一份大驚喜要給 Gloria，卻一直拖到不行。","items":[{"p":"plan B","zh":"備案","scene":"驚喜出狀況，Jay 得想別的辦法。","en":"If it rains, what's plan B?","tr":"如果下雨，備案是什麼？","tip":"<b>延伸：</b>Always have a plan B. 永遠要有備案。","th":10,"lv":1},{"p":"take forever","zh":"花超久時間","scene":"Jay 的驚喜等了好久都還沒來。","en":"The line at the post office is taking forever.","tr":"郵局排隊排超久。","tip":"<b>語氣：</b>誇張說法，抱怨很慢。","th":8,"lv":1},{"p":"worth the wait","zh":"值得等待","scene":"驚喜最後到底值不值得等？","en":"The food took an hour, but it was worth the wait.","tr":"菜等了一小時，但值得。","tip":"<b>延伸：</b>Good things come to those who wait.","th":7,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"有人對 Mitchell 或 Cam 表示好感，另一半心裡有點不是滋味。","items":[{"p":"secret admirer","zh":"神秘的愛慕者","scene":"有個人一直在示好。","en":"I got flowers from a secret admirer.","tr":"我收到一位神秘愛慕者送的花。","tip":"<b>用法：</b>情人節卡片常見的署名。","th":1,"lv":1},{"p":"flattered","zh":"受寵若驚","scene":"被人欣賞的感覺還不錯。","en":"I'm flattered, but I have a girlfriend.","tr":"我很受寵若驚，但我有女朋友了。","tip":"<b>用法：</b>委婉拒絕追求時的標準句。","th":4,"lv":1},{"p":"be taken","zh":"名草有主","scene":"對方要知道，這個人已經有伴了。","en":"Sorry, he's taken.","tr":"抱歉，他已經有對象了。","tip":"<b>反義：</b>be single 單身。","th":1,"lv":1}]}],"prompts":["你理想中的情人節（用 in the mood、on cloud nine、ruin the moment）","一件你等了很久但很值得的事（用 take forever、worth the wait、plan B）","你被人示好過嗎，你怎麼回應（用 secret admirer、flattered、be taken）"],"challenges":[{"id":"c1","sit":"朋友問烤肉遇到下雨怎麼辦，你問他備案是什麼。","uses":["plan B"],"ans":"What's plan B if it rains?"},{"id":"c2","sit":"你等鹽酥雞等了半小時，跟朋友說值得。","uses":["worth the wait"],"ans":"It took forever, but it was worth the wait."},{"id":"c3","sit":"有人跟你要 IG，你說你很受寵若驚，但你有女朋友了。","uses":["flattered","be taken"],"ans":"I'm flattered, but I'm taken."},{"id":"c4","sit":"室友告白成功後一直傻笑，你說他開心到飛上天。","uses":["on cloud nine"],"ans":"He's been on cloud nine all day."}]},"s02e15":{"title":"Princess Party","lede":"Lily 的生日派對賓客名單越來越失控：Mitchell 邀了媽媽 Dede，惹 Claire 不高興；又取消了 Fizbo 的演出，惹 Cam 不高興；結果 Dede 還帶著 Claire 以前的男朋友出現，Jay 和 Gloria 也各有各的應對方式。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Dede","plot":"Mitchell 改來改去的賓客名單，同時得罪了姊姊和另一半。","items":[{"p":"guest list","zh":"賓客名單","scene":"派對名單一改再改。","en":"Is your ex on the guest list?","tr":"你前任在賓客名單上嗎？","tip":"<b>延伸：</b>Are you on the list? 你有在名單上嗎？","th":8,"lv":1},{"p":"uninvite","zh":"取消邀請","scene":"Mitchell 把 Fizbo 從名單上拿掉了。","en":"She uninvited me from her wedding.","tr":"她取消了邀請我參加她婚禮。","tip":"<b>語氣：</b>很傷人的一件事。","th":8,"lv":2},{"p":"in the doghouse","zh":"惹另一半生氣、被打入冷宮","scene":"Mitchell 把 Cam 惹毛了。","en":"I forgot our anniversary, so I'm in the doghouse.","tr":"我忘了紀念日，現在被打入冷宮。","tip":"<b>畫面：</b>被趕去睡狗屋。","th":1,"lv":2},{"p":"keep the peace","zh":"維持和平","scene":"Mitchell 想讓每個人都滿意。","en":"I didn't say anything to keep the peace.","tr":"我為了維持和平什麼都沒說。","tip":"<b>用法：</b>家庭、團體裡避免衝突。","th":5,"lv":1}]},{"id":"dunphy","name":"Claire 和 Dede","who":"Claire · Dede · Phil","plot":"媽媽來就算了，竟然還帶著 Claire 的初戀男友一起出現。","items":[{"p":"open a can of worms","zh":"引發一連串麻煩","scene":"邀請 Dede 就是打開了麻煩的開關。","en":"Asking about her salary would open a can of worms.","tr":"問她薪水會引起一堆麻煩。","tip":"<b>畫面：</b>打開一罐蟲，到處亂爬收不回去。","th":10,"lv":2},{"p":"first love","zh":"初戀","scene":"這位前男友是 Claire 的初戀。","en":"My first love was a girl in my cram school.","tr":"我的初戀是補習班的女生。","tip":"<b>延伸：</b>puppy love 小時候的純純的愛。","th":1,"lv":1},{"p":"the last straw","zh":"壓垮駱駝的最後一根稻草","scene":"帶前男友來，對 Claire 來說是忍耐的極限。","en":"He was late again. That was the last straw.","tr":"他又遲到了，我真的受夠了。","tip":"<b>全句：</b>the straw that broke the camel's back。","th":5,"lv":2},{"p":"rub it in","zh":"落井下石、一直提","scene":"Dede 好像故意要刺激 Claire。","en":"I know I lost. You don't have to rub it in.","tr":"我知道我輸了，你不用一直提。","tip":"<b>用法：</b>別人已經很難過時還一直講。","th":5,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"前妻帶人出現在派對上，Jay 和 Gloria 處理的方式完全不同。","items":[{"p":"plus-one","zh":"攜伴（帶來的伴）","scene":"Dede 的「攜伴」讓大家傻眼。","en":"Can I bring a plus-one to your wedding?","tr":"我可以帶伴參加你的婚禮嗎？","tip":"<b>用法：</b>喜帖上的「可攜伴」。","th":8,"lv":1},{"p":"rain on someone's parade","zh":"掃某人的興","scene":"大家都怕掃了 Lily 生日的興。","en":"I hate to rain on your parade, but the beach is closed.","tr":"我不想掃你的興，但海灘關閉了。","tip":"<b>用法：</b>I don't want to rain on your parade, but…","th":7,"lv":2}]}],"prompts":["你辦過或參加過賓客名單很麻煩的活動嗎（用 guest list、plus-one、uninvite）","你最後一次說「我受夠了」是什麼時候（用 the last straw、rub it in、in the doghouse）","你的初戀故事（用 first love、open a can of worms、keep the peace）"],"challenges":[{"id":"c1","sit":"朋友問你婚禮可不可以帶女朋友，你說可以攜伴。","uses":["plus-one"],"ans":"Sure, you can bring a plus-one."},{"id":"c2","sit":"你忘了女朋友生日，跟朋友說你現在被打入冷宮。","uses":["in the doghouse"],"ans":"I forgot her birthday. I'm in the doghouse."},{"id":"c3","sit":"你輸了打賭，朋友一直講，你叫他別再落井下石。","uses":["rub it in"],"ans":"Okay, I lost. Don't rub it in."},{"id":"c4","sit":"樓上鄰居又在半夜拖家具，你說這次真的受夠了。","uses":["the last straw"],"ans":"Moving furniture at 2 a.m. again? That's the last straw."}]},"s02e16":{"title":"Regrets Only","lede":"Phil 和 Claire 大吵一架，Phil 卻完全不知道自己做錯了什麼；Gloria 開導 Phil，Jay 帶 Claire 出去散心；Jay 很後悔送 Gloria 卡拉 OK 機；Cam 在 Mitchell 和 Luke 的幫忙下準備募款活動。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Gloria · Jay","plot":"Claire 氣到不想說話，Phil 一頭霧水，只好去請教 Gloria。","items":[{"p":"the silent treatment","zh":"冷戰、不講話","scene":"Claire 對 Phil 冷處理。","en":"My girlfriend is giving me the silent treatment.","tr":"我女朋友在跟我冷戰。","tip":"<b>用法：</b>give someone the silent treatment。","th":5,"lv":1},{"p":"read between the lines","zh":"讀出言外之意","scene":"Phil 聽不懂 Claire 的弦外之音。","en":"She said she's fine, but read between the lines.","tr":"她說她沒事，但你要聽懂言外之意。","tip":"<b>畫面：</b>讀字裡行間沒寫出來的部分。","th":10,"lv":2},{"p":"clueless","zh":"一無所知、狀況外","scene":"Phil 完全搞不清楚狀況。","en":"He's totally clueless about why she's mad.","tr":"他完全不知道她為什麼生氣。","tip":"<b>延伸：</b>I'm clueless. 我完全沒頭緒。","th":9,"lv":1},{"p":"sleep on the couch","zh":"睡沙發（被老婆趕出房間）","scene":"Phil 擔心今晚得睡沙發。","en":"Say that again and you'll be sleeping on the couch.","tr":"你再說一次就去睡沙發。","tip":"<b>文化：</b>美劇夫妻吵架的經典懲罰。","th":1,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 送了卡拉 OK 機，Gloria 每天唱個不停，他後悔得要命。","items":[{"p":"buyer's remorse","zh":"買了就後悔","scene":"Jay 對這份禮物後悔莫及。","en":"I got buyer's remorse right after I bought that jacket.","tr":"那件外套一買我就後悔了。","tip":"<b>用法：</b>大筆消費後的後悔。","th":3,"lv":2},{"p":"belt out","zh":"大聲唱","scene":"Gloria 用力高歌。","en":"She belted out the song at the top of her lungs.","tr":"她用盡全力大聲唱那首歌。","tip":"<b>延伸：</b>at the top of one's lungs 用盡肺活量。","th":8,"lv":2},{"p":"tone-deaf","zh":"五音不全","scene":"唱得好不好，見仁見智。","en":"I love karaoke, but I'm totally tone-deaf.","tr":"我很愛唱 KTV，但我五音不全。","tip":"<b>延伸：</b>也可以形容人「白目、不會看場合」。","th":9,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · Luke","plot":"Cam 為了公益辦募款活動，大家都被拉來幫忙。","items":[{"p":"for a good cause","zh":"為了做好事","scene":"募款是為了幫助別人。","en":"It's a charity run for a good cause.","tr":"這是為了公益的慈善路跑。","tip":"<b>用法：</b>說服別人參與時很常用。","th":8,"lv":1},{"p":"pitch in","zh":"出一份力、幫忙","scene":"每個人都出點力。","en":"If everyone pitches in, we'll finish by noon.","tr":"如果大家都幫忙，我們中午就能做完。","tip":"<b>用法：</b>出錢出力都可以用。","th":10,"lv":1},{"p":"raise money","zh":"募款","scene":"Cam 想為活動募到很多錢。","en":"We're selling cookies to raise money for the school.","tr":"我們賣餅乾幫學校募款。","tip":"<b>延伸：</b>fundraiser 募款活動。","th":3,"lv":1}]}],"prompts":["你跟人冷戰過嗎（用 the silent treatment、clueless、read between the lines）","你買過什麼讓你很後悔的東西（用 buyer's remorse、belt out、tone-deaf）","你參加過的公益活動（用 for a good cause、pitch in、raise money）"],"challenges":[{"id":"c1","sit":"女朋友說她沒事，朋友提醒你要聽懂她的言外之意。","uses":["read between the lines"],"ans":"She said she's fine. Read between the lines."},{"id":"c2","sit":"你跟朋友說你雖然五音不全，但還是很愛唱歌。","uses":["tone-deaf"],"ans":"I'm tone-deaf, but I love singing."},{"id":"c3","sit":"打掃營區時你跟大家說，每個人都幫忙一下很快就好了。","uses":["pitch in"],"ans":"If everyone pitches in, we'll be done fast."},{"id":"c4","sit":"你衝動買了很貴的耳機，隔天就後悔了。","uses":["buyer's remorse"],"ans":"I've got buyer's remorse."}]},"s02e17":{"title":"Two Monkeys and a Panda","lede":"Claire 想調解 Haley 和 Alex 的姊妹戰爭，Phil 卻偷溜去做 SPA；Jay 想買家族墓穴，把 Gloria 嚇壞了；Cam 想寫一本關於 Lily 領養過程的書，卻挖出一些讓人不安的往事。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Haley · Alex · Phil","plot":"姊妹倆吵得不可開交，Claire 忙著當和事佬，Phil 則偷偷去享受 SPA。","items":[{"p":"sibling rivalry","zh":"手足競爭","scene":"Haley 和 Alex 一直在互相較勁。","en":"There's a lot of sibling rivalry between my brother and me.","tr":"我跟我哥之間的競爭很激烈。","tip":"<b>延伸：</b>sibling 是兄弟姊妹的統稱。","th":2,"lv":1},{"p":"at each other's throats","zh":"吵得不可開交","scene":"兩姊妹快打起來了。","en":"My roommates are always at each other's throats.","tr":"我的室友們老是吵得不可開交。","tip":"<b>畫面：</b>互相掐住對方的喉嚨。","th":5,"lv":2},{"p":"treat yourself","zh":"犒賞自己","scene":"Phil 決定好好犒賞自己。","en":"You worked hard this month. Treat yourself!","tr":"你這個月很努力，犒賞一下自己吧！","tip":"<b>延伸：</b>treat 也可以是「請客」，It's my treat.","th":8,"lv":1},{"p":"guilty pleasure","zh":"罪惡的小確幸","scene":"做 SPA 是 Phil 的秘密享受。","en":"Reality shows are my guilty pleasure.","tr":"實境秀是我的罪惡小確幸。","tip":"<b>用法：</b>明知道有點丟臉，還是很喜歡的東西。","th":8,"lv":1},{"p":"pamper","zh":"寵愛、好好照顧","scene":"Phil 在 SPA 被照顧得很舒服。","en":"Let's pamper Mom on Mother's Day.","tr":"母親節我們好好寵一下媽媽吧。","tip":"<b>延伸：</b>pamper yourself 寵愛自己。","th":2,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 想先把家族墓穴買好，Gloria 覺得太觸霉頭了。","items":[{"p":"morbid","zh":"病態的、太愛想死亡","scene":"Gloria 覺得這件事很觸霉頭。","en":"Talking about funerals at dinner is a bit morbid.","tr":"吃飯時聊葬禮有點太陰沉了。","tip":"<b>用法：</b>形容話題或興趣很陰暗。","th":9,"lv":2},{"p":"plan ahead","zh":"事先計畫","scene":"Jay 覺得這只是未雨綢繆。","en":"If you want to visit Japan in spring, plan ahead.","tr":"如果你想春天去日本，要提早規劃。","tip":"<b>延伸：</b>Plan ahead! 早點計畫。","th":10,"lv":1},{"p":"give someone the creeps","zh":"讓人毛骨悚然","scene":"墓穴的事讓 Gloria 渾身發毛。","en":"That old doll gives me the creeps.","tr":"那個舊娃娃讓我毛骨悚然。","tip":"<b>延伸：</b>creepy 是形容詞。","th":4,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · Lily","plot":"Cam 為了寫書翻出領養的資料，結果看到不想知道的內容。","items":[{"p":"dig up","zh":"挖出（舊事、資料）","scene":"Cam 翻出領養時的往事。","en":"The reporter dug up some old photos.","tr":"記者挖出一些舊照片。","tip":"<b>延伸：</b>dig up dirt on someone 挖某人的黑料。","th":10,"lv":1},{"p":"open old wounds","zh":"揭開舊傷疤","scene":"這些過去讓兩人心裡又不舒服了。","en":"Talking about the breakup opened old wounds.","tr":"聊起分手的事揭開了舊傷疤。","tip":"<b>用法：</b>提起痛苦往事時用。","th":4,"lv":2}]}],"prompts":["你跟兄弟姊妹會互相較勁嗎（用 sibling rivalry、at each other's throats、pamper）","你最近怎麼犒賞自己（用 treat yourself、guilty pleasure、plan ahead）","一件讓你毛骨悚然的事（用 give someone the creeps、morbid、dig up）"],"challenges":[{"id":"c1","sit":"你領到第一份薪水就去吃了一頓很貴的燒肉，跟朋友說要犒賞自己。","uses":["treat yourself"],"ans":"I had to treat myself."},{"id":"c2","sit":"你跟朋友坦承你很愛看八點檔，是你的罪惡小確幸。","uses":["guilty pleasure"],"ans":"Soap operas are my guilty pleasure."},{"id":"c3","sit":"你哥跟你姊一見面就吵，你跟朋友抱怨。","uses":["at each other's throats"],"ans":"They're always at each other's throats."},{"id":"c4","sit":"你家附近那條小巷晚上沒燈，讓你毛毛的。","uses":["give someone the creeps"],"ans":"That alley gives me the creeps at night."}]},"s02e18":{"title":"Boys' Night","lede":"Phil 和 Claire 發現 Luke 跟以前的老鄰居 Kleezak 先生成了好朋友，開始有點擔心；Jay 為了躲掉交響樂會，誤打誤撞跑進 Mitchell 和 Cam 跟朋友聚會的酒吧，還成了全場焦點；Haley 則負責幫忙顧 Lily。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Luke","plot":"Luke 和一位老先生成了好朋友，爸媽有點不放心。","items":[{"p":"odd couple","zh":"不搭的一對","scene":"小孩和老先生的組合很奇特。","en":"My grandpa and my little sister are such an odd couple.","tr":"我爺爺和我妹真是奇妙的組合。","tip":"<b>延伸：</b>來自同名電影《天生冤家》。","th":9,"lv":2},{"p":"keep an eye on","zh":"留意、盯著","scene":"爸媽決定好好注意這段友誼。","en":"Can you keep an eye on my bag for a minute?","tr":"你可以幫我顧一下包包嗎？","tip":"<b>用法：</b>顧東西、顧小孩都能用。","th":10,"lv":1},{"p":"stranger danger","zh":"小心陌生人","scene":"爸媽想起從小教孩子的那句話。","en":"We teach kids about stranger danger at school.","tr":"學校會教孩子小心陌生人。","tip":"<b>語氣：</b>美國對小孩的安全教育口號。","th":2,"lv":2}]},{"id":"jay
