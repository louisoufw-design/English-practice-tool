/b>家裡放各種雜物的抽屜。","th":8,"lv":2},{"p":"let go of the past","zh":"放下過去","scene":"講師要大家放下過去。","en":"You can't move forward until you let go of the past.","tr":"你得放下過去才能往前走。","tip":"<b>用法：</b>心靈成長常見的話。","th":6,"lv":1},{"p":"open up","zh":"敞開心胸","scene":"大家被要求說出內心話。","en":"It took him a long time to open up to me.","tr":"他花了很久才對我敞開心房。","tip":"<b>用法：</b>open up to + 人。","th":6,"lv":1},{"p":"touchy-feely","zh":"很愛表達情感、肢體接觸的","scene":"Jay 很不習慣這種活動。","en":"My dad hates touchy-feely stuff like group hugs.","tr":"我爸很討厭團體擁抱這種肉麻的事。","tip":"<b>語氣：</b>略帶不屑。","th":9,"lv":2},{"p":"trust exercise","zh":"信任練習","scene":"講座有一些互動練習。","en":"We did a trust exercise where you fall backward.","tr":"我們做了一個往後倒的信任練習。","tip":"<b>用法：</b>團隊建立活動。","th":3,"lv":2},{"p":"make it a competition","zh":"把它變成比賽","scene":"三對夫妻什麼都要比。","en":"Why do you make everything a competition?","tr":"你為什麼什麼都要比？","tip":"<b>用法：</b>好勝心強的人。","th":5,"lv":1},{"p":"work through","zh":"處理、解決（問題）","scene":"大家要面對自己的問題。","en":"We need to work through our problems together.","tr":"我們要一起解決問題。","tip":"<b>用法：</b>情緒、感情問題。","th":10,"lv":1}]},{"id":"dunphy","name":"姊妹談心","who":"Haley · Alex","plot":"Haley 終於把她和 Andy 的事告訴 Alex。","items":[{"p":"get something off one's chest","zh":"把心事說出來","scene":"Haley 想把秘密說出來。","en":"I need to get this off my chest. I broke your mug.","tr":"我得把這件事說出來，我打破了你的杯子。","tip":"<b>畫面：</b>把壓在胸口的東西拿開。","th":4,"lv":2},{"p":"fess up","zh":"坦白承認","scene":"Haley 終於招了。","en":"Come on, fess up. Who ate the cake?","tr":"快招吧，誰吃了蛋糕？","tip":"<b>用法：</b>confess 的口語版。","th":10,"lv":2}]}],"prompts":["你有讀過自我成長書嗎（用 self-help book、let go of the past、work through）","你有什麼想說出來的心事（用 get something off one's chest、open up、fess up）","你參加過團康或信任練習嗎（用 trust exercise、touchy-feely、make it a competition）"],"challenges":[{"id":"c1","sit":"你跟朋友說你要把一件事說出來。","uses":["get something off one's chest"],"ans":"I need to get this off my chest."},{"id":"c2","sit":"你問誰把冷氣遙控器藏起來，叫他快招。","uses":["fess up"],"ans":"Come on, fess up."},{"id":"c3","sit":"室友連洗碗都要比誰快，你問他為什麼什麼都要比。","uses":["make it a competition"],"ans":"Why do you make everything a competition?"},{"id":"c4","sit":"你說你家有一個什麼都塞的雜物抽屜。","uses":["junk drawer"],"ans":"We have a junk drawer for everything."}]},"s07e09":{"title":"White Christmas","lede":"Gloria 租了一間山上的小木屋讓全家過聖誕，卻碰上一堆意外；Mitchell 和 Cam 想挽回去年唱聖誕歌的糗表現；Haley 和 Andy 偷偷在一起，忍不住一直卿卿我我；Jay 宣布了一個大決定，讓 Claire 措手不及。","stories":[{"id":"jay","name":"山中小木屋","who":"Gloria · Jay · Claire · 全家","plot":"全家被大雪困在小木屋；Jay 宣布要退休，由 Claire 接手公司。","items":[{"p":"snowed in","zh":"被大雪困住","scene":"全家被困在山上。","en":"We were snowed in for three days.","tr":"我們被大雪困了三天。","tip":"<b>用法：</b>因為雪太大出不了門。","th":8,"lv":2},{"p":"cozy","zh":"舒適溫暖的","scene":"小木屋本來應該很溫馨。","en":"The café is small but cozy.","tr":"那家咖啡店很小但很溫馨。","tip":"<b>用法：</b>形容空間或氣氛溫暖。","th":9,"lv":1},{"p":"winter wonderland","zh":"冬季仙境","scene":"山上一片白雪。","en":"The mountain turned into a winter wonderland.","tr":"山上變成了冬季仙境。","tip":"<b>延伸：</b>也是一首經典聖誕歌。","th":8,"lv":2},{"p":"step down","zh":"卸任、下台","scene":"Jay 決定退下來。","en":"The CEO is stepping down next month.","tr":"執行長下個月要卸任。","tip":"<b>用法：</b>辭去重要職位。","th":3,"lv":1},{"p":"take the reins","zh":"接手掌控","scene":"Claire 要接手公司。","en":"She took the reins of the family business.","tr":"她接手了家族企業。","tip":"<b>畫面：</b>拿起馬的韁繩。","th":10,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人去年唱聖誕歌唱得很糟，今年想扳回一城。","items":[{"p":"go caroling","zh":"挨家挨戶唱聖誕歌","scene":"兩人去鄰居家門口唱歌。","en":"We went caroling around the neighborhood.","tr":"我們在社區挨家挨戶唱聖誕歌。","tip":"<b>文化：</b>西方聖誕節的傳統。","th":8,"lv":2},{"p":"redeem oneself","zh":"挽回名聲、雪恥","scene":"兩人想挽回去年的失敗。","en":"He scored the winning goal to redeem himself.","tr":"他踢進致勝球，一雪前恥。","tip":"<b>用法：</b>犯錯後彌補。","th":10,"lv":2},{"p":"hit the right note","zh":"恰到好處、唱對音","scene":"這次要唱準。","en":"His speech hit the right note. Everyone loved it.","tr":"他的演講恰到好處，大家都很喜歡。","tip":"<b>用法：</b>也比喻言行得體。","th":9,"lv":2}]},{"id":"dunphy","name":"Haley 和 Andy","who":"Haley · Andy","plot":"兩人偷偷交往，在大家面前很難藏住。","items":[{"p":"can't keep one's hands off","zh":"忍不住一直碰對方","scene":"兩人一直黏在一起。","en":"They can't keep their hands off each other.","tr":"他們一直忍不住黏在一起。","tip":"<b>用法：</b>情侶非常親密。","th":1,"lv":2},{"p":"sneak around","zh":"偷偷摸摸","scene":"兩人瞞著大家約會。","en":"They've been sneaking around behind everyone's back.","tr":"他們一直瞞著大家偷偷交往。","tip":"<b>用法：</b>偷偷做某事。","th":10,"lv":1}]}],"prompts":["你理想中的冬天假期（用 cozy、winter wonderland、snowed in）","你曾經想一雪前恥嗎（用 redeem oneself、hit the right note、go caroling）","如果你要接手家裡的事業（用 take the reins、step down、sneak around）"],"challenges":[{"id":"c1","sit":"寒流來大家都在寢室，你說好溫暖。","uses":["cozy"],"ans":"It's so cozy in here."},{"id":"c2","sit":"上次打靶沒過，這次你想雪恥。","uses":["redeem oneself"],"ans":"I want to redeem myself."},{"id":"c3","sit":"你說你爸退休後由你哥接手。","uses":["take the reins"],"ans":"My brother is taking the reins."},{"id":"c4","sit":"你說你們的社長下個月要卸任。","uses":["step down"],"ans":"Our president is stepping down next month."}]},"s07e10":{"title":"Playdates","lede":"Claire 叫 Phil 讓那對從不付錢的朋友這次買單；Jay 驚訝地發現 Joe 玩伴的爸媽跟他和 Gloria 好像，連年齡差都一樣；Mitchell 拿出孩子們送他的生日兌換券，三個孩子只好臨時帶他去參觀明星豪宅；Lily 也有了第一個暗戀對象。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"每次吃飯都是 Phil 和 Claire 付錢，這次 Claire 決定讓對方買單。","items":[{"p":"pick up the check","zh":"買單","scene":"誰要付這頓飯錢？","en":"Let me pick up the check this time.","tr":"這次讓我買單吧。","tip":"<b>延伸：</b>check 是帳單（美式）。","th":8,"lv":1},{"p":"split the bill","zh":"分攤帳單","scene":"大家各付各的。","en":"Let's split the bill.","tr":"我們分攤帳單吧。","tip":"<b>同義：</b>go Dutch 各付各的。","th":8,"lv":1},{"p":"freeloader","zh":"白吃白喝的人","scene":"那對朋友總是占便宜。","en":"Don't be a freeloader. Bring something to the party.","tr":"別白吃白喝，帶點東西去派對。","tip":"<b>用法：</b>老是讓別人付錢的人。","th":9,"lv":2},{"p":"mooch off","zh":"揩油、靠別人過活","scene":"朋友一直揩油。","en":"He's been mooching off his parents for years.","tr":"他靠爸媽過活好幾年了。","tip":"<b>用法：</b>mooch off + 人。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"Joe 玩伴的爸媽跟 Jay 和 Gloria 好像，Jay 很意外。","items":[{"p":"kindred spirits","zh":"心靈相通的人","scene":"兩家人很合得來。","en":"We're kindred spirits. We like the same things.","tr":"我們心靈相通，喜歡一樣的東西。","tip":"<b>用法：</b>志同道合的人。","th":2,"lv":2},{"p":"two peas in a pod","zh":"非常相像、形影不離","scene":"兩家人簡直一模一樣。","en":"My sister and I are like two peas in a pod.","tr":"我和我姊就像一個豆莢裡的兩顆豆子。","tip":"<b>畫面：</b>同一個豆莢的豌豆。","th":2,"lv":2}]},{"id":"mitch","name":"Mitchell 和孩子們","who":"Mitchell · Haley · Alex · Luke · Lily","plot":"Mitchell 用生日兌換券要孩子們陪他，三個人臨時想出明星豪宅之旅。","items":[{"p":"cash in","zh":"兌現、兌換","scene":"Mitchell 兌換他的生日禮物券。","en":"I'm cashing in my birthday coupon for a free massage.","tr":"我要用生日券兌換一次免費按摩。","tip":"<b>用法：</b>兌換點數、獎勵。","th":3,"lv":2},{"p":"IOU","zh":"借據、欠條","scene":"孩子們的禮物其實是欠條。","en":"I don't have cash. Can I give you an IOU?","tr":"我沒現金，可以先欠著嗎？","tip":"<b>字源：</b>I owe you 我欠你。","th":3,"lv":2},{"p":"celebrity sighting","zh":"看到名人","scene":"豪宅之旅想看到明星。","en":"We had a celebrity sighting at the airport!","tr":"我們在機場看到明星！","tip":"<b>用法：</b>偶遇名人。","th":8,"lv":2},{"p":"puppy love","zh":"純純的愛","scene":"Lily 第一次心動。","en":"It's just puppy love. She's only eight.","tr":"那只是純純的愛，她才八歲。","tip":"<b>用法：</b>小孩或青少年的初戀。","th":1,"lv":2}]}],"prompts":["你跟朋友吃飯會怎麼付錢（用 pick up the check、split the bill、freeloader）","你有跟你很像的朋友嗎（用 kindred spirits、two peas in a pod、puppy love）","你在路上看過明星嗎（用 celebrity sighting、cash in、IOU）"],"challenges":[{"id":"c1","sit":"吃完燒肉，你說這次你買單。","uses":["pick up the check"],"ans":"I'll pick up the check this time."},{"id":"c2","sit":"室友每次都吃你的零食又不出錢，你說他白吃白喝。","uses":["freeloader"],"ans":"Don't be a freeloader."},{"id":"c3","sit":"你沒零錢，跟朋友說先欠著。","uses":["IOU"],"ans":"Can I give you an IOU?"},{"id":"c4","sit":"你跟朋友說你在高鐵站看到明星。","uses":["celebrity sighting"],"ans":"I had a celebrity sighting at the station!"}]},"s07e11":{"title":"Spread Your Wings","lede":"Claire、Luke 和 Haley 想把家裡的鴨子放生，Phil 則去加州理工學院探望 Alex；Jay 和 Mitchell 照顧第一次參加過夜派對的 Lily；Manny 幫 Gloria 和 Cam 的辣醬事業。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Luke · Haley · Phil · Alex","plot":"鴨子長大了該放生；Phil 去大學探望女兒。","items":[{"p":"spread one's wings","zh":"展翅高飛、獨立闖蕩","scene":"鴨子和孩子都要獨立。","en":"It's time for you to spread your wings and travel.","tr":"你該展翅高飛去旅行了。","tip":"<b>用法：</b>開始獨立探索世界。","th":2,"lv":2},{"p":"fly the coop","zh":"離巢、離家","scene":"鴨子要飛走了。","en":"My little brother finally flew the coop.","tr":"我弟終於搬出去住了。","tip":"<b>畫面：</b>從雞籠飛出去。","th":2,"lv":2},{"p":"set free","zh":"放生、釋放","scene":"大家要把鴨子放走。","en":"We set the bird free after it healed.","tr":"那隻鳥傷好之後我們把牠放走了。","tip":"<b>用法：</b>放動物或比喻放手。","th":10,"lv":1},{"p":"surprise visit","zh":"突然拜訪","scene":"Phil 去看 Alex。","en":"My mom paid me a surprise visit at camp.","tr":"我媽突然來營區看我。","tip":"<b>用法：</b>pay someone a surprise visit。","th":2,"lv":1},{"p":"college life","zh":"大學生活","scene":"Phil 看到 Alex 的大學生活。","en":"I miss college life.","tr":"我好懷念大學生活。","tip":"<b>用法：</b>大學時期的生活。","th":3,"lv":1}]},{"id":"jay","name":"Jay 和 Mitchell 顧 Lily","who":"Jay · Mitchell · Lily","plot":"Lily 第一次去過夜，兩個大人比她還緊張。","items":[{"p":"sleepover","zh":"過夜派對","scene":"Lily 第一次在外面過夜。","en":"My daughter is having a sleepover with her friends.","tr":"我女兒要跟朋友們過夜。","tip":"<b>文化：</b>小朋友到朋友家過夜。","th":2,"lv":1},{"p":"separation anxiety","zh":"分離焦慮","scene":"大人們捨不得 Lily。","en":"My dog has separation anxiety. He cries when I leave.","tr":"我的狗有分離焦慮，我一走牠就哭。","tip":"<b>用法：</b>小孩、寵物、甚至大人都會。","th":4,"lv":2}]},{"id":"mitch","name":"辣醬事業","who":"Manny · Gloria · Cameron","plot":"Manny 幫忙辣醬生意，做市場調查。","items":[{"p":"taste test","zh":"試吃","scene":"大家試吃辣醬。","en":"We did a taste test to choose the best recipe.","tr":"我們做了試吃來挑最好的配方。","tip":"<b>用法：</b>比較味道的測試。","th":8,"lv":1},{"p":"market research","zh":"市場調查","scene":"Manny 幫忙做市調。","en":"We need to do some market research before we launch.","tr":"上市前我們要做一些市場調查。","tip":"<b>用法：</b>商業用語。","th":3,"lv":1},{"p":"too hot to handle","zh":"太辣、太難應付","scene":"辣醬辣到受不了。","en":"This sauce is too hot to handle!","tr":"這醬辣到受不了！","tip":"<b>用法：</b>也比喻人或事太難搞。","th":9,"lv":2}]}],"prompts":["你第一次離家獨立的經驗（用 spread one's wings、fly the coop、college life）","你小時候去朋友家過夜過嗎（用 sleepover、separation anxiety、surprise visit）","你能吃辣嗎（用 too hot to handle、taste test、market research）"],"challenges":[{"id":"c1","sit":"你媽突然來營區懇親。","uses":["surprise visit"],"ans":"My mom paid me a surprise visit."},{"id":"c2","sit":"你吃到超辣的麻辣鍋，說辣到受不了。","uses":["too hot to handle"],"ans":"It's too hot to handle!"},{"id":"c3","sit":"你說你好懷念大學生活。","uses":["college life"],"ans":"I miss college life."},{"id":"c4","sit":"你說你的狗有分離焦慮。","uses":["separation anxiety"],"ans":"My dog has separation anxiety."}]},"s07e12":{"title":"Clean for a Day","lede":"Claire 接手 Jay 的衣櫃公司前，要全家把用不到的東西清掉，Alex 翻到 Sanjay 的運動衫，情緒湧上來；Jay 開始學開飛機當嗜好，讓 Cam 很擔心；Mitchell 教 Gloria 打高爾夫，讓她能跟 Jay 有共同話題。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Alex · 全家","plot":"Claire 要大家丟掉沒在用的東西，每件舊物都勾起回憶。","items":[{"p":"spark joy","zh":"帶來心動感","scene":"留下讓你心動的東西。","en":"If it doesn't spark joy, throw it away.","tr":"如果它不能讓你心動，就丟掉。","tip":"<b>來源：</b>整理達人近藤麻理惠的名言。","th":8,"lv":2},{"p":"toss out","zh":"丟掉","scene":"大家要把不用的東西丟掉。","en":"I tossed out all my old magazines.","tr":"我把舊雜誌全丟了。","tip":"<b>同義：</b>throw out。","th":8,"lv":1},{"p":"pack rat","zh":"愛囤東西的人","scene":"有人什麼都捨不得丟。","en":"My dad is a pack rat. He keeps every receipt.","tr":"我爸很愛囤東西，每張收據都留著。","tip":"<b>畫面：</b>會把東西拖回窩裡的老鼠。","th":9,"lv":2},{"p":"keepsake","zh":"紀念品","scene":"有些東西是珍貴的紀念品。","en":"I kept her letter as a keepsake.","tr":"我把她的信留下來當紀念。","tip":"<b>用法：</b>有紀念意義的小東西。","th":8,"lv":2},{"p":"bring back memories","zh":"勾起回憶","scene":"一件舊衣服勾起 Alex 的回憶。","en":"This song brings back memories of high school.","tr":"這首歌勾起我高中的回憶。","tip":"<b>用法：</b>舊東西、老歌、地方。","th":4,"lv":1}]},{"id":"jay","name":"Jay 的新嗜好","who":"Jay · Cameron","plot":"Jay 開始學開飛機，Cam 在旁邊嚇到不行。","items":[{"p":"take to the skies","zh":"飛上天空","scene":"Jay 要開飛機上天了。","en":"After years of training, she finally took to the skies.","tr":"經過多年訓練，她終於飛上天空。","tip":"<b>用法：</b>搭飛機或開飛機。","th":8,"lv":2},{"p":"white-knuckle","zh":"緊張到手抓得發白","scene":"Cam 坐在旁邊抓緊扶手。","en":"It was a white-knuckle ride. I was so scared.","tr":"那趟路緊張刺激，我超怕的。","tip":"<b>畫面：</b>緊握到指節發白。","th":4,"lv":2}]},{"id":"mitch","name":"Mitchell 和 Gloria","who":"Mitchell · Gloria","plot":"Mitchell 教 Gloria 打高爾夫，讓她能跟 Jay 有共同興趣。","items":[{"p":"common ground","zh":"共同點","scene":"Gloria 想跟 Jay 有共同話題。","en":"We don't agree on much, but we found some common ground.","tr":"我們意見常不同，但找到了一些共同點。","tip":"<b>用法：</b>find common ground 找到共識。","th":6,"lv":2},{"p":"learning curve","zh":"學習曲線","scene":"學新運動需要時間。","en":"There's a steep learning curve with this software.","tr":"這個軟體的學習曲線很陡。","tip":"<b>用法：</b>steep learning curve 很難上手。","th":3,"lv":2},{"p":"keep your eye on the ball","zh":"專注目標","scene":"打球要盯著球。","en":"Keep your eye on the ball and you'll pass the exam.","tr":"專注目標，你就會通過考試。","tip":"<b>用法：</b>運動或比喻保持專注。","th":6,"lv":2}]}],"prompts":["你是愛囤東西的人嗎（用 pack rat、toss out、spark joy）","你收藏過什麼紀念品（用 keepsake、bring back memories、white-knuckle）","你學過最難上手的東西（用 learning curve、keep your eye on the ball、common ground）"],"challenges":[{"id":"c1","sit":"你說你哥很愛囤東西，什麼都不丟。","uses":["pack rat"],"ans":"My brother is a pack rat."},{"id":"c2","sit":"你聽到國中流行的歌，說勾起回憶。","uses":["bring back memories"],"ans":"This song brings back memories."},{"id":"c3","sit":"你學新的剪片軟體，說學習曲線很陡。","uses":["learning curve"],"ans":"There's a steep learning curve."},{"id":"c4","sit":"你跟爸爸政治立場不同，但找到共同點。","uses":["common ground"],"ans":"We found some common ground."}]},"s07e13":{"title":"Thunk in the Trunk","lede":"Claire 的新工作讓 Phil 覺得自己變成了家庭主夫；Gloria 拍了一支很性感的辣醬廣告，讓 Jay 很吃醋；Mitchell 和 Cam 把樓上公寓租出去，結果忍不住偷看房客在做什麼。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Claire 忙著上班，Phil 在家負責接送和家事。","items":[{"p":"househusband","zh":"家庭主夫","scene":"Phil 覺得自己成了家庭主夫。","en":"He's a househusband while his wife runs the company.","tr":"他當家庭主夫，太太經營公司。","tip":"<b>延伸：</b>housewife 家庭主婦。","th":2,"lv":1},{"p":"carpool","zh":"共乘、輪流接送","scene":"Phil 負責接送小孩。","en":"We carpool to work every day.","tr":"我們每天共乘去上班。","tip":"<b>用法：</b>名詞或動詞都可以。","th":8,"lv":1},{"p":"the daily grind","zh":"日常的辛苦工作","scene":"每天重複的家事和工作。","en":"I need a vacation from the daily grind.","tr":"我需要從日常的辛苦中休個假。","tip":"<b>用法：</b>單調辛苦的日常。","th":3,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay","plot":"Gloria 的辣醬廣告很火辣，Jay 看了不太開心。","items":[{"p":"racy","zh":"大膽的、帶點性感的","scene":"廣告拍得很大膽。","en":"The magazine cover was a bit racy.","tr":"那本雜誌的封面有點大膽。","tip":"<b>用法：</b>形容內容有點挑逗。","th":9,"lv":2},{"p":"sex sells","zh":"性感就能大賣","scene":"廣告的老招。","en":"Many ads follow the rule that sex sells.","tr":"很多廣告都遵循性感大賣的法則。","tip":"<b>用法：</b>行銷的常見說法。","th":3,"lv":2},{"p":"the jealous type","zh":"愛吃醋的人","scene":"Jay 其實很容易吃醋。","en":"I'm not the jealous type, but that was too much.","tr":"我不是愛吃醋的人，但那太過分了。","tip":"<b>用法：</b>形容個性。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人把樓上租出去，忍不住偷看房客。","items":[{"p":"rent out","zh":"出租","scene":"兩人把公寓租出去。","en":"We rent out our spare room to students.","tr":"我們把空房間租給學生。","tip":"<b>對比：</b>rent 是租用；rent out 是租給別人。","th":3,"lv":1},{"p":"five-star review","zh":"五星好評","scene":"兩人想拿到好評。","en":"The hotel got a five-star review online.","tr":"那家飯店在網路上得到五星好評。","tip":"<b>用法：</b>網路評價。","th":8,"lv":1},{"p":"peeping Tom","zh":"偷窺狂","scene":"兩人偷看房客像偷窺狂。","en":"We caught a peeping Tom outside the window.","tr":"我們在窗外抓到一個偷窺狂。","tip":"<b>來源：</b>英國傳說中偷看的男人 Tom。","th":9,"lv":2},{"p":"none of our business","zh":"不關我們的事","scene":"房客的事不該管。","en":"What they do is none of our business.","tr":"他們做什麼不關我們的事。","tip":"<b>用法：</b>提醒別多管閒事。","th":7,"lv":1}]}],"prompts":["你未來會想當家庭主夫嗎（用 househusband、carpool、the daily grind）","你是愛吃醋的人嗎（用 the jealous type、racy、sex sells）","你會出租房間嗎（用 rent out、five-star review、none of our business）"],"challenges":[{"id":"c1","sit":"你跟同事說你們每天共乘上班。","uses":["carpool"],"ans":"We carpool to work."},{"id":"c2","sit":"你說你不是愛吃醋的人。","uses":["the jealous type"],"ans":"I'm not the jealous type."},{"id":"c3","sit":"室友在講別人八卦，你說不關我們的事。","uses":["none of our business"],"ans":"That's none of our business."},{"id":"c4","sit":"你說你想從每天的辛苦中休個假。","uses":["the daily grind"],"ans":"I need a break from the daily grind."}]},"s07e14":{"title":"The Storm","lede":"一場大雷雨把全家困在 Jay 和 Gloria 家，Jay 卻一心想溜去酒吧跟海軍老戰友聚會；Phil 想挽回自己出糗的形象；Mitchell 和 Cam 想辦法搶救 Lily 的生日派對；Haley 和 Andy 的感情也碰上難關。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · 全家","plot":"大雨加停電，大家都被困住，Jay 還想偷溜去見老戰友。","items":[{"p":"power outage","zh":"停電","scene":"暴風雨讓整區停電。","en":"There was a power outage during the typhoon.","tr":"颱風時停電了。","tip":"<b>同義：</b>blackout。","th":8,"lv":1},{"p":"ride out the storm","zh":"熬過風暴","scene":"大家只能等風雨過去。","en":"We stayed inside to ride out the storm.","tr":"我們待在室內等暴風雨過去。","tip":"<b>用法：</b>也比喻熬過困難時期。","th":10,"lv":2},{"p":"it's raining cats and dogs","zh":"傾盆大雨","scene":"外面雨大到不行。","en":"Take an umbrella. It's raining cats and dogs.","tr":"帶把傘，外面下傾盆大雨。","tip":"<b>用法：</b>很口語、有點老派的說法。","th":8,"lv":2},{"p":"war buddies","zh":"老戰友","scene":"Jay 想去見海軍老戰友。","en":"My grandpa still meets his war buddies every year.","tr":"我爺爺每年還會跟老戰友見面。","tip":"<b>延伸：</b>army buddies 當兵的同袍。","th":2,"lv":2},{"p":"take a rain check","zh":"改天再約","scene":"有人只能改天。","en":"Can I take a rain check on dinner?","tr":"晚餐可以改天嗎？","tip":"<b>由來：</b>棒球比賽下雨延期的票。","th":7,"lv":2},{"p":"rain or shine","zh":"風雨無阻","scene":"有些約定不管天氣都要去。","en":"The market is open rain or shine.","tr":"市集風雨無阻都會開。","tip":"<b>用法：</b>不管發生什麼都照常。","th":9,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Haley · Andy","plot":"Phil 想挽回面子；Haley 和 Andy 的關係出現考驗。","items":[{"p":"save face","zh":"保住面子","scene":"Phil 想挽回形象。","en":"He apologized quickly to save face.","tr":"他很快道歉來保住面子。","tip":"<b>反義：</b>lose face 丟臉。","th":10,"lv":2},{"p":"a storm is brewing","zh":"風雨欲來、麻煩快來了","scene":"兩人之間氣氛不對。","en":"I can tell a storm is brewing between them.","tr":"我看得出他們之間快出事了。","tip":"<b>用法：</b>比喻衝突要爆發。","th":5,"lv":2}]},{"id":"mitch","name":"Lily 的生日","who":"Mitchell · Cameron · Lily","plot":"暴風雨打亂了 Lily 的生日派對，兩人想辦法搶救。","items":[{"p":"make the best of it","zh":"盡量往好處想、將就","scene":"雖然計畫被打亂，還是要開心過。","en":"The trip didn't go as planned, but we made the best of it.","tr":"旅行沒照計畫走，但我們還是盡力享受。","tip":"<b>用法：</b>在不理想的情況下盡力而為。","th":6,"lv":1},{"p":"salvage","zh":"搶救、挽救","scene":"兩人想救回派對。","en":"We managed to salvage the party.","tr":"我們設法救回了派對。","tip":"<b>用法：</b>從失敗中救回一些東西。","th":10,"lv":2}]}],"prompts":["你遇過最大的颱風或暴雨（用 power outage、ride out the storm、it's raining cats and dogs）","你曾經因為下雨改約嗎（用 take a rain check、rain or shine、war buddies）","計畫被打亂時你怎麼辦（用 make the best of it、salvage、save face）"],"challenges":[{"id":"c1","sit":"颱風天你跟朋友說外面下傾盆大雨。","uses":["it's raining cats and dogs"],"ans":"It's raining cats and dogs."},{"id":"c2","sit":"朋友約你吃飯但你要站哨，你說改天。","uses":["take a rain check"],"ans":"Can I take a rain check?"},{"id":"c3","sit":"退伍後你想跟同袍每年聚一次。","uses":["war buddies"],"ans":"I want to meet my army buddies every year."},{"id":"c4","sit":"烤肉遇到下雨，你說還是盡量開心過。","uses":["make the best of it"],"ans":"Let's make the best of it."}]},"s07e15":{"title":"I Don't Know How She Does It","lede":"Claire 工作和家庭兩頭兼顧，像個超級媽媽，大家都很佩服，Phil 卻起了疑心；Jay 和 Gloria 費盡心思隱瞞自己做了不該做的事；Mitchell 和 Cam 在朋友的婚禮上被當成次等賓客。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 什麼都搞定，好到讓 Phil 懷疑她有秘密武器。","items":[{"p":"juggle","zh":"兼顧（多件事）","scene":"Claire 同時處理工作和家庭。","en":"It's hard to juggle work and school.","tr":"要兼顧工作和學業很難。","tip":"<b>畫面：</b>像雜耍一樣同時拋很多球。","th":10,"lv":1},{"p":"supermom","zh":"超級媽媽","scene":"Claire 像個超人媽媽。","en":"My mom is a supermom. She works full-time and cooks every night.","tr":"我媽是超級媽媽，全職工作還每晚煮飯。","tip":"<b>用法：</b>稱讚能幹的媽媽。","th":2,"lv":1},{"p":"secret weapon","zh":"秘密武器","scene":"Claire 一定有什麼秘訣。","en":"Coffee is my secret weapon for early mornings.","tr":"咖啡是我早起的秘密武器。","tip":"<b>用法：</b>成功的秘訣。","th":10,"lv":1},{"p":"outsource","zh":"外包","scene":"Claire 其實把一些事交給別人做。","en":"We outsource our cleaning to save time.","tr":"我們把打掃外包出去省時間。","tip":"<b>用法：</b>把工作交給外部的人做。","th":3,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"兩人各自偷偷做了不該做的事，努力掩飾。","items":[{"p":"hide the evidence","zh":"湮滅證據","scene":"兩人忙著藏證據。","en":"He ate the cake and hid the evidence.","tr":"他吃了蛋糕還湮滅證據。","tip":"<b>用法：</b>玩笑地說藏起做壞事的痕跡。","th":10,"lv":1},{"p":"keep up appearances","zh":"維持表面形象","scene":"兩人在對方面前裝沒事。","en":"They keep up appearances, but they argue all the time.","tr":"他們表面上很好，其實一直吵架。","tip":"<b>用法：</b>維持外人眼中的樣子。","th":10,"lv":2}]},{"id":"mitch","name":"朋友的婚禮","who":"Mitchell · Cameron","plot":"兩人去參加朋友婚禮，卻被安排在很差的位子。","items":[{"p":"B-list","zh":"二線的、次要的","scene":"兩人覺得自己是次要賓客。","en":"We're on the B-list for this wedding.","tr":"我們是這場婚禮的次要賓客。","tip":"<b>對比：</b>A-list 一線、重要人物。","th":9,"lv":2},{"p":"kids' table","zh":"小孩桌","scene":"兩人被安排坐小孩桌。","en":"I always had to sit at the kids' table at family dinners.","tr":"家族聚餐時我總是坐小孩桌。","tip":"<b>文化：</b>家庭聚會讓小孩另坐一桌。","th":2,"lv":1},{"p":"snub","zh":"冷落、怠慢","scene":"兩人覺得被怠慢了。","en":"I felt snubbed when she didn't invite me.","tr":"她沒邀請我，我覺得被冷落了。","tip":"<b>用法：</b>故意忽視某人。","th":5,"lv":2},{"p":"second-class citizen","zh":"次等公民","scene":"兩人覺得自己像次等公民。","en":"I felt like a second-class citizen at that party.","tr":"我在那個派對上覺得自己像次等公民。","tip":"<b>用法：</b>被不公平地對待。","th":9,"lv":2}]}],"prompts":["你身邊有超級媽媽嗎（用 supermom、juggle、secret weapon）","你曾經被冷落或怠慢過嗎（用 snub、B-list、second-class citizen）","你會為了面子裝沒事嗎（用 keep up appearances、hide the evidence、outsource）"],"challenges":[{"id":"c1","sit":"你說你媽是超級媽媽。","uses":["supermom"],"ans":"My mom is a supermom."},{"id":"c2","sit":"你說要兼顧打工和準備研究所考試很難。","uses":["juggle"],"ans":"It's hard to juggle my part-time job and studying for grad school."},{"id":"c3","sit":"你偷吃了零食，趕快湮滅證據。","uses":["hide the evidence"],"ans":"I hid the evidence."},{"id":"c4","sit":"你說咖啡是你站夜哨的秘密武器。","uses":["secret weapon"],"ans":"Coffee is my secret weapon."}]},"s07e16":{"title":"The Cover-Up","lede":"Phil 和 Claire 各自瞞著對方一段無傷大雅的曖昧，一個是房仲客戶，一個是瑜伽老師；Jay 開了一個網路節目「Jay Talking」，卻被網路酸民批評；Mitchell 和 Cam 教 Lily 騎腳踏車，結果 Cam 摔斷手還撞到頭。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"兩人各有一段小曖昧，都在想辦法瞞著對方。","items":[{"p":"nothing happened","zh":"什麼事都沒發生","scene":"兩人都說自己很清白。","en":"I swear nothing happened. We just talked.","tr":"我發誓什麼事都沒發生，我們只是聊天。","tip":"<b>用法：</b>澄清誤會時的經典台詞。","th":1,"lv":1},{"p":"keep it from someone","zh":"瞞著某人","scene":"兩人都瞞著對方。","en":"I didn't want to keep it from you.","tr":"我不是故意要瞞著你。","tip":"<b>用法：</b>keep + 事 + from + 人。","th":10,"lv":1}]},{"id":"jay","name":"Jay 的網路節目","who":"Jay · Manny","plot":"Jay 開了自己的網路節目，卻被酸民攻擊。","items":[{"p":"web series","zh":"網路影集、網路節目","scene":"Jay 有了自己的節目。","en":"He started a web series about cooking.","tr":"他開了一個做菜的網路節目。","tip":"<b>用法：</b>在網路上播出的系列影片。","th":8,"lv":1},{"p":"internet troll","zh":"網路酸民","scene":"有人專門留言攻擊 Jay。","en":"Just ignore the internet trolls.","tr":"別理那些網路酸民。","tip":"<b>延伸：</b>troll 原是北歐傳說中的怪物。","th":9,"lv":2},{"p":"don't feed the trolls","zh":"別理酸民","scene":"越回應酸民越來勁。","en":"I know it's annoying, but don't feed the trolls.","tr":"我知道很煩，但別理酸民。","tip":"<b>用法：</b>網路生存守則。","th":7,"lv":2},{"p":"comment section","zh":"留言區","scene":"留言區吵翻了。","en":"Never read the comment section.","tr":"永遠別看留言區。","tip":"<b>用法：</b>網路影片、文章下方的留言。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人教 Lily 騎腳踏車，結果受傷的是 Cam。","items":[{"p":"training wheels","zh":"輔助輪","scene":"Lily 要拿掉輔助輪。","en":"My son just learned to ride without training wheels.","tr":"我兒子剛學會不用輔助輪騎車。","tip":"<b>用法：</b>也比喻「入門階段的輔助」。","th":2,"lv":1},{"p":"accident-prone","zh":"容易出意外的","scene":"Cam 好像特別容易受傷。","en":"I'm so accident-prone. I fall all the time.","tr":"我超容易出意外，一直跌倒。","tip":"<b>用法：</b>形容常受傷、常出包的人。","th":9,"lv":2},{"p":"break one's arm","zh":"摔斷手","scene":"Cam 手骨折了。","en":"He broke his arm playing basketball.","tr":"他打籃球時摔斷手。","tip":"<b>延伸：</b>break one's leg 摔斷腿。","th":8,"lv":1},{"p":"see stars","zh":"眼冒金星","scene":"Cam 撞到頭頭昏眼花。","en":"I hit my head on the door and saw stars.","tr":"我頭撞到門，眼冒金星。","tip":"<b>畫面：</b>卡通裡撞到頭時的星星。","th":8,"lv":2}]}],"prompts":["你曾經瞞著家人什麼事嗎（用 keep it from someone、nothing happened、comment section）","你遇過網路酸民嗎（用 internet troll、don't feed the trolls、web series）","你是容易受傷的人嗎（用 accident-prone、break one's arm、see stars）"],"challenges":[{"id":"c1","sit":"你說你超容易受傷。","uses":["accident-prone"],"ans":"I'm so accident-prone."},{"id":"c2","sit":"朋友被網路留言攻擊，你叫他別理酸民。","uses":["don't feed the trolls"],"ans":"Don't feed the trolls."},{"id":"c3","sit":"你頭撞到上鋪，說眼冒金星。","uses":["see stars"],"ans":"I hit my head and saw stars."},{"id":"c4","sit":"你跟女朋友說你不是故意要瞞她。","uses":["keep it from someone"],"ans":"I didn't mean to keep it from you."}]},"s07e17":{"title":"Express Yourself","lede":"Phil 和 Claire 一時興起計畫去巴黎，還熬夜一整晚來提前調時差；Cam 那位情傷的姊姊 Pam 搬進他們家，讓 Mitchell 很不爽；Gloria 和 Manny 不小心動到了 Jay 主臥浴室的裝修。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"兩人臨時決定去巴黎，為了調時差硬撐著不睡。","items":[{"p":"on a whim","zh":"一時興起","scene":"巴黎之旅是臨時決定的。","en":"I booked the flight on a whim.","tr":"我一時興起訂了機票。","tip":"<b>對比：</b>spur of the moment 意思很接近。","th":10,"lv":2},{"p":"time difference","zh":"時差（時區差）","scene":"兩人想先調好時差。","en":"The time difference between Taiwan and Paris is six hours.","tr":"台灣和巴黎的時差是六小時。","tip":"<b>對比：</b>jet lag 是時差造成的不適。","th":8,"lv":1},{"p":"night owl","zh":"夜貓子","scene":"有人很擅長熬夜。","en":"I'm a night owl. I do my best work after midnight.","tr":"我是夜貓子，半夜後效率最好。","tip":"<b>反義：</b>early bird 早起的人。","th":9,"lv":2},{"p":"early bird","zh":"早起的人","scene":"有人一到晚上就撐不住。","en":"My dad is an early bird. He wakes up at five.","tr":"我爸是早起的人，五點就起床。","tip":"<b>延伸：</b>The early bird catches the worm. 早起的鳥兒有蟲吃。","th":9,"lv":1},{"p":"wide awake","zh":"完全清醒","scene":"兩人要撐到天亮。","en":"It's 3 a.m. and I'm still wide awake.","tr":"凌晨三點了我還完全清醒。","tip":"<b>用法：</b>睡不著或很有精神時。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Pam","plot":"情傷的 Pam 搬來住，Mitchell 覺得家裡被佔領了。","items":[{"p":"on my turf","zh":"在我的地盤","scene":"Mitchell 覺得 Pam 侵犯了他的地盤。","en":"You're on my turf now. My rules.","tr":"你現在在我的地盤，聽我的。","tip":"<b>用法：</b>自己的領域。","th":5,"lv":2},{"p":"get underfoot","zh":"礙手礙腳","scene":"Pam 在家裡礙手礙腳。","en":"The kids keep getting underfoot in the kitchen.","tr":"孩子們一直在廚房礙手礙腳。","tip":"<b>畫面：</b>一直在腳邊擋路。","th":2,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Gloria · Manny · Jay","plot":"兩人不小心動到了 Jay 的浴室裝修。","items":[{"p":"remodel","zh":"翻修、改建","scene":"Jay 正在翻修浴室。","en":"We're remodeling the kitchen this summer.","tr":"我們今年夏天要翻修廚房。","tip":"<b>用法：</b>房屋改建。","th":8,"lv":1},{"p":"contractor","zh":"承包商、包商","scene":"裝修交給包商處理。","en":"The contractor said it will take two months.","tr":"包商說要兩個月。","tip":"<b>用法：</b>裝修、工程的承包人。","th":3,"lv":1},{"p":"do-over","zh":"重來一次","scene":"搞砸了只好重做。","en":"That didn't count. I want a do-over!","tr":"那次不算，我要重來！","tip":"<b>用法：</b>遊戲或生活中想重來。","th":7,"lv":2}]}],"prompts":["你是夜貓子還是早起的人（用 night owl、early bird、wide awake）","你一時興起做過什麼事（用 on a whim、time difference、do-over）","有人住進你家時你會覺得被侵犯嗎（用 on my turf、get underfoot、remodel）"],"challenges":[{"id":"c1","sit":"你說你是夜貓子。","uses":["night owl"],"ans":"I'm a night owl."},{"id":"c2","sit":"你跟朋友說你一時興起剪了平頭。","uses":["on a whim"],"ans":"I did it on a whim."},{"id":"c3","sit":"遊戲輸了，你說那次不算要重來。","uses":["do-over"],"ans":"I want a do-over!"},{"id":"c4","sit":"凌晨你還睡不著，說你完全清醒。","uses":["wide awake"],"ans":"I'm still wide awake."}]},"s07e18":{"title":"The Party","lede":"Manny 和 Luke 負責顧 Lily，讓大人們出去玩：Phil 和 Mitchell 去看電影，Claire 和 Gloria 去做 SPA，Jay 和 Cam 去運動酒吧看拳擊大賽；Claire 卻一直懷疑兩個男孩在家偷偷開派對。","stories":[{"id":"kids","name":"男孩們","who":"Manny · Luke · Lily","plot":"大人一出門，兩個男孩就開始計畫。","items":[{"p":"house party","zh":"家庭派對","scene":"男孩們偷偷在家開派對。","en":"My neighbor's kid threw a house party while they were away.","tr":"我鄰居的小孩趁他們不在開了家庭派對。","tip":"<b>用法：</b>在家辦的派對。","th":8,"lv":1},{"p":"the coast is clear","zh":"沒人在看、安全了","scene":"大人們都走了。","en":"Okay, the coast is clear. Let's go.","tr":"好，沒人了，我們走吧。","tip":"<b>由來：</b>海岸上沒有敵人。","th":10,"lv":2},{"p":"cover one's tracks","zh":"掩蓋行蹤","scene":"兩人要在大人回來前清乾淨。","en":"He deleted his search history to cover his tracks.","tr":"他刪了搜尋紀錄來掩蓋行蹤。","tip":"<b>畫面：</b>把腳印抹掉。","th":10,"lv":2}]},{"id":"dunphy","name":"大人們出門","who":"Claire · Gloria · Phil · Mitchell","plot":"大家難得出門放鬆，Claire 卻一直放心不下。","items":[{"p":"parents' night out","zh":"家長的放風夜","scene":"大人們出門玩。","en":"Grandma is babysitting, so it's parents' night out!","tr":"奶奶幫忙顧小孩，今晚是家長放風夜！","tip":"<b>用法：</b>父母難得的自由夜晚。","th":2,"lv":2},{"p":"spa day","zh":"SPA 日","scene":"Claire 和 Gloria 去放鬆。","en":"We booked a spa day for Mom's birthday.","tr":"我們幫媽媽生日訂了一天的 SPA。","tip":"<b>用法：</b>去做按摩、保養的一天。","th":8,"lv":1},{"p":"something smells fishy","zh":"事情有點可疑","scene":"Claire 覺得不對勁。","en":"He's being too nice. Something smells fishy.","tr":"他對我太好了，事情有點可疑。","tip":"<b>畫面：</b>聞到魚腥味。","th":7,"lv":2}]},{"id":"jay","name":"Jay 和 Cam","who":"Jay · Cameron","plot":"兩人去運動酒吧看拳擊大賽。","items":[{"p":"sports bar","zh":"運動酒吧","scene":"兩人去看比賽。","en":"Let's watch the game at a sports bar.","tr":"我們去運動酒吧看比賽吧。","tip":"<b>文化：</b>有很多螢幕播球賽的酒吧。","th":8,"lv":1},{"p":"pay-per-view","zh":"付費收看","scene":"大賽要付費才能看。","en":"The fight was only on pay-per-view.","tr":"那場拳賽只能付費收看。","tip":"<b>用法：</b>單次付費的電視節目。","th":8,"lv":2},{"p":"knockout","zh":"擊倒、超吸睛的人","scene":"比賽的高潮是擊倒。","en":"He won by knockout in the third round.","tr":"他在第三回合以擊倒獲勝。","tip":"<b>延伸：</b>She's a knockout. 她超正。","th":8,"lv":2},{"p":"ringside seat","zh":"第一排的位子","scene":"大家都想坐最好的位子。","en":"We had ringside seats for the fight.","tr":"我們坐拳賽的第一排。","tip":"<b>用法：</b>也比喻「近距離觀察」。","th":8,"lv":2}]}],"prompts":["你趁爸媽不在家做過什麼事嗎（用 house party、the coast is clear、cover one's tracks）","你理想中的放鬆夜晚（用 spa day、parents' night out、sports bar）","你看過最精彩的比賽（用 knockout、pay-per-view、ringside seat）"],"challenges":[{"id":"c1","sit":"你上班偷滑手機，同事說主管離開座位了，沒人了。","uses":["the coast is clear"],"ans":"The coast is clear."},{"id":"c2","sit":"交友軟體上的對象條件完美到不真實，你覺得事情有點可疑。","uses":["something smells fishy"],"ans":"Something smells fishy."},{"id":"c3","sit":"你約朋友去運動酒吧看世界盃。","uses":["sports bar"],"ans":"Let's watch it at a sports bar."},{"id":"c4","sit":"你刪掉訊息掩蓋證據。","uses":["cover one's tracks"],"ans":"I deleted it to cover my tracks."}]},"s07e19":{"title":"Man Shouldn't Lie","lede":"Claire 和孩子們偷偷在家藏了一隻流浪狗，不讓 Phil 知道；Jay 說他不需要新朋友，Gloria 卻邀請了一對新朋友來家裡；Cam 把樓上公寓租給一個基督教搖滾樂團。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · 孩子們 · Phil","plot":"大家撿到一隻流浪狗，偷偷養著不讓 Phil 發現。","items":[{"p":"stray dog","zh":"流浪狗","scene":"孩子們撿到一隻流浪狗。","en":"We found a stray dog near the base.","tr":"我們在營區附近發現一隻流浪狗。","tip":"<b>延伸：</b>stray cat 流浪貓。","th":8,"lv":1},{"p":"adopt, don't shop","zh":"以領養代替購買","scene":"大家想收養這隻狗。","en":"We got our dog from a shelter. Adopt, don't shop!","tr":"我們的狗是從收容所領養的，以領養代替購買！","tip":"<b>用法：</b>動物保護的口號。","th":8,"lv":2},{"p":"puppy-dog eyes","zh":"可憐兮兮的眼神","scene":"孩子們用可憐的眼神求爸媽。","en":"Don't give me those puppy-dog eyes.","tr":"別用那種可憐的眼神看我。","tip":"<b>用法：</b>裝可憐求人。","th":9,"lv":2},{"p":"fib","zh":"小謊","scene":"大家撒了個小謊。","en":"I told a little fib about my age.","tr":"我在年齡上撒了個小謊。","tip":"<b>對比：</b>fib 比 lie 輕，通常無傷大雅。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 不想交新朋友，Gloria 偏偏邀了一對新夫妻來作客。","items":[{"p":"set in one's ways","zh":"習慣固定、不想改變","scene":"Jay 不想改變自己的生活。","en":"My grandpa is set in his ways. He eats the same breakfast every day.","tr":"我爺爺很固執，每天吃一樣的早餐。","tip":"<b>用法：</b>老習慣難改。","th":9,"lv":2},{"p":"a man of habit","zh":"習慣固定的人","scene":"Jay 喜歡每天都一樣的生活。","en":"My dad is a man of habit. Same café, same coffee, every day.","tr":"我爸是習慣固定的人，每天同一家咖啡店、同一杯咖啡。","tip":"<b>延伸：</b>creature of habit 也是同樣意思。","th":9,"lv":2},{"p":"branch out","zh":"擴展、嘗試新事物","scene":"Gloria 想擴展社交圈。","en":"You should branch out and meet new people.","tr":"你應該擴展一下，認識新朋友。","tip":"<b>畫面：</b>樹枝向外長。","th":10,"lv":2}]},{"id":"mitch","name":"Cam 的房客","who":"Cameron · Mitchell · 樂團","plot":"Cam 把樓上租給一個樂團，每天都在練團。","items":[{"p":"band practice","zh":"樂團練習","scene":"樓上一直在練團。","en":"We have band practice every Tuesday.","tr":"我們每週二都有樂團練習。","tip":"<b>用法：</b>樂團排練。","th":8,"lv":1},{"p":"noise complaint","zh":"噪音投訴","scene":"鄰居可能會抗議。","en":"The neighbors filed a noise complaint.","tr":"鄰居提出了噪音投訴。","tip":"<b>用法：</b>file a noise complaint 投訴噪音。","th":8,"lv":1},{"p":"preachy","zh":"愛說教的","scene":"樂團的歌有點說教。","en":"The movie was good, but a little preachy.","tr":"電影不錯，但有點說教。","tip":"<b>用法：</b>形容內容或人愛教訓別人。","th":9,"lv":2}]}],"prompts":["你養過或撿過流浪動物嗎（用 stray dog、adopt, don't shop、puppy-dog eyes）","你是固定習慣的人嗎（用 set in one's ways、branch out、fib）","你被鄰居吵過嗎（用 noise complaint、band practice、preachy）"],"challenges":[{"id":"c1","sit":"你在公司樓下看到一隻流浪狗。","uses":["stray dog"],"ans":"There's a stray dog outside our building."},{"id":"c2","sit":"弟弟用可憐的眼神要你請他吃東西。","uses":["puppy-dog eyes"],"ans":"Don't give me those puppy-dog eyes."},{"id":"c3","sit":"你說你爺爺很固執，不想改變。","uses":["set in one's ways"],"ans":"He's set in his ways."},{"id":"c4","sit":"你鼓勵朋友多認識新朋友。","uses":["branch out"],"ans":"You should branch out."}]},"s07e20":{"title":"Promposal","lede":"學校舞會的邀約季到了，大家都在想怎麼創意邀舞伴；Claire 懷疑公司裡有內鬼；Jay 則教 Joe 怎麼當個修東西的小幫手。","stories":[{"id":"dunphy","name":"Claire 的公司","who":"Claire · Phil","plot":"Claire 懷疑公司有人在洩密，開始抓內鬼。","items":[{"p":"a mole","zh":"內鬼、臥底","scene":"Claire 覺得公司有內鬼。","en":"There's a mole in the company leaking our plans.","tr":"公司裡有內鬼在洩漏我們的計畫。","tip":"<b>字面：</b>鼴鼠，在地底偷偷挖洞。","th":10,"lv":2},{"p":"leak","zh":"洩漏","scene":"公司的資料被洩漏了。","en":"Someone leaked the news to the press.","tr":"有人把消息洩漏給媒體。","tip":"<b>用法：</b>名詞和動詞都可以。","th":10,"lv":1},{"p":"inside job","zh":"內部的人幹的","scene":"洩密一定是內部的人。","en":"The police think the robbery was an inside job.","tr":"警方認為搶案是內部人員幹的。","tip":"<b>用法：</b>犯罪或陰謀由內部人所為。","th":10,"lv":2},{"p":"rat someone out","zh":"告發某人、出賣","scene":"誰會出賣誰？","en":"He ratted me out to the teacher.","tr":"他跟老師告我的狀。","tip":"<b>用法：</b>比 tattle 更負面。","th":5,"lv":2},{"p":"copycat","zh":"模仿者、抄襲的人","scene":"有人抄襲別人的點子。","en":"She copied my outfit. Such a copycat!","tr":"她模仿我的穿搭，真是跟屁蟲！","tip":"<b>用法：</b>模仿別人的人或東西。","th":9,"lv":1}]},{"id":"kids","name":"舞會邀約","who":"Luke · Manny","plot":"孩子們想用很有創意的方式邀舞伴。","items":[{"p":"promposal","zh":"舞會邀約","scene":"高中生的浪漫邀約。","en":"He asked her to prom with a giant banner. What a promposal!","tr":"他用一個超大布條邀她去舞會，好浪漫的邀約！","tip":"<b>字源：</b>prom + proposal。","th":1,"lv":2}]},{"id":"jay","name":"Jay 和 Joe","who":"Jay · Joe","plot":"Jay 教小 Joe 用工具修東西。","items":[{"p":"handyman","zh":"修理工、萬能工","scene":"Jay 想讓 Joe 成為小修理工。","en":"We called a handyman to fix the sink.","tr":"我們找修理工來修水槽。","tip":"<b>用法：</b>什麼都會修的人。","th":8,"lv":1},{"p":"tool belt","zh":"工具腰帶","scene":"Joe 有了自己的工具帶。","en":"He wore a tool belt like a real builder.","tr":"他戴著工具腰帶，像個真正的工人。","tip":"<b>用法：</b>掛工具的腰帶。","th":8,"lv":1},{"p":"righty-tighty, lefty-loosey","zh":"右緊左鬆","scene":"轉螺絲的口訣。","en":"Remember: righty-tighty, lefty-loosey.","tr":"記住：右轉鎖緊，左轉鬆開。","tip":"<b>用法：</b>教人轉螺絲的口訣。","th":8,"lv":2},{"p":"jack of all trades","zh":"萬事通、什麼都會一點","scene":"Jay 希望 Joe 什麼都會。","en":"My uncle is a jack of all trades. He can fix anything.","tr":"我叔叔什麼都會，什麼都能修。","tip":"<b>全句：</b>Jack of all trades, master of none.","th":9,"lv":2}]}],"prompts":["你遇過在背後出賣你的人嗎（用 rat someone out、a mole、inside job）","你看過最浪漫的告白方式（用 promposal、copycat、leak）","你會自己修東西嗎（用 handyman、jack of all trades、righty-tighty, lefty-loosey）"],"challenges":[{"id":"c1","sit":"你說你叔叔什麼都會修。","uses":["jack of all trades"],"ans":"My uncle is a jack of all trades."},{"id":"c2","sit":"同梯把你偷吃宵夜的事告訴班長。","uses":["rat someone out"],"ans":"He ratted me out."},{"id":"c3","sit":"你說有人模仿你的 IG 照片。","uses":["copycat"],"ans":"What a copycat!"},{"id":"c4","sit":"你教弟弟轉螺絲的口訣。","uses":["righty-tighty, lefty-loosey"],"ans":"Righty-tighty, lefty-loosey."}]},"s07e21":{"title":"Crazy Train","lede":"Manny 說服全家搭火車去波特蘭參加 Dede 的婚禮；Claire 和 Mitchell 一起寫婚禮致詞；Phil 和 Cam 在車上發現他們最愛的作家，興奮不已；Jay 對 Dede 的批評被人聽到，差點讓婚禮泡湯。","stories":[{"id":"jay","name":"搭火車去婚禮","who":"Jay · Manny · 全家","plot":"Manny 堅持搭火車，Jay 卻在車上說錯話闖了禍。","items":[{"p":"all aboard","zh":"大家上車","scene":"火車要出發了。","en":"All aboard! The train is leaving.","tr":"大家上車！火車要開了。","tip":"<b>用法：</b>火車、船出發前的呼喊。","th":8,"lv":1},{"p":"scenic route","zh":"風景好的路線","scene":"搭火車看風景。","en":"Let's take the scenic route along the coast.","tr":"我們走沿海的風景路線吧。","tip":"<b>用法：</b>比較慢但風景好的路。","th":8,"lv":1},{"p":"it's about the journey","zh":"重點是過程","scene":"Manny 覺得旅途本身就是意義。","en":"Don't rush. It's about the journey, not the destination.","tr":"別急，重點是過程，不是目的地。","tip":"<b>用法：</b>人生哲理的常見說法。","th":6,"lv":2},{"p":"put one's foot in one's mouth","zh":"說錯話","scene":"Jay 的話被聽到了。","en":"I put my foot in my mouth when I asked if she was pregnant.","tr":"我問她是不是懷孕了，結果說錯話了。","tip":"<b>畫面：</b>把腳塞進嘴裡。","th":10,"lv":2},{"p":"word gets around","zh":"消息傳開","scene":"Jay 的話很快就傳開了。","en":"Be careful. Word gets around fast here.","tr":"小心點，這裡消息傳得很快。","tip":"<b>用法：</b>八卦傳播得很快。","th":9,"lv":2},{"p":"walk it back","zh":"收回說過的話","scene":"Jay 想收回失言。","en":"The politician tried to walk back his comments.","tr":"那位政治人物想收回他的言論。","tip":"<b>用法：</b>收回或修正說過的話。","th":10,"lv":2}]},{"id":"dunphy","name":"Claire 和 Mitchell","who":"Claire · Mitchell · Dede","plot":"姊弟倆要幫媽媽的婚禮寫致詞。","items":[{"p":"remarry","zh":"再婚","scene":"Dede 要再婚了。","en":"My aunt remarried after ten years.","tr":"我阿姨十年後再婚了。","tip":"<b>延伸：</b>second marriage 第二段婚姻。","th":1,"lv":1},{"p":"on track","zh":"在正軌上","scene":"婚禮計畫要順利進行。","en":"Is the project still on track?","tr":"計畫還在正軌上嗎？","tip":"<b>反義：</b>off track 偏離正軌。","th":10,"lv":1}]},{"id":"mitch","name":"Phil 和 Cam","who":"Phil · Cameron","plot":"兩人在車上看到最愛的作家，興奮到不行。","items":[{"p":"starstruck","zh":"看到偶像緊張到說不出話","scene":"兩人看到偶像激動不已。","en":"I was so starstruck when I met my favorite singer.","tr":"見到最愛的歌手時我緊張到說不出話。","tip":"<b>用法：</b>見到名人時的反應。","th":4,"lv":2},{"p":"fanboy","zh":"狂熱男粉絲","scene":"Phil 和 Cam 化身粉絲。","en":"He totally fanboyed when he saw the actor.","tr":"他看到那個演員時完全瘋了。","tip":"<b>用法：</b>名詞或動詞，女生是 fangirl。","th":9,"lv":2}]}],"prompts":["你最喜歡的旅行方式（用 all aboard、scenic route、it's about the journey）","你曾經說錯話嗎（用 put one's foot in one's mouth、word gets around、walk it back）","你見過偶像嗎（用 starstruck、fanboy、on track）"],"challenges":[{"id":"c1","sit":"你問女生是不是胖了，結果說錯話。","uses":["put one's foot in one's mouth"],"ans":"I really put my foot in my mouth."},{"id":"c2","sit":"你說在公司裡消息傳得很快。","uses":["word gets around"],"ans":"Word gets around fast here."},{"id":"c3","sit":"你見到喜歡的球員，緊張到說不出話。","uses":["starstruck"],"ans":"I was so starstruck."},{"id":"c4","sit":"你說旅行不要趕，重點是過程。","uses":["it's about the journey"],"ans":"It's about the journey."}]},"s07e22":{"title":"Double Click","lede":"第七季最後一集，Claire 不知道什麼時候開除一位員工最好；Phil 以為抓到 Luke 跟女生在一起；Alex 放暑假回家，大家竟然都忘了；Haley 得知 Andy 收到回猶他州的工作機會；Jay 不相信退休後要重回職場會有多難。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Alex · Haley · Andy","plot":"Claire 煩惱怎麼開除人；大家忘了 Alex 要回家；Haley 面對 Andy 可能離開。","items":[{"p":"rip off the Band-Aid","zh":"長痛不如短痛","scene":"Claire 得快刀斬亂麻。","en":"Just tell him the truth. Rip off the Band-Aid.","tr":"直接告訴他吧，長痛不如短痛。","tip":"<b>畫面：</b>一口氣撕掉 OK 繃。","th":6,"lv":2},{"p":"the hardest part of the job","zh":"工作最難的部分","scene":"開除人是最難的事。","en":"Firing people is the hardest part of the job.","tr":"開除人是工作中最難的部分。","tip":"<b>用法：</b>說明工作的難處。","th":3,"lv":1},{"p":"slip one's mind","zh":"忘記","scene":"大家都忘了 Alex 要回家。","en":"Sorry, your birthday totally slipped my mind.","tr":"抱歉，我完全忘了你的生日。","tip":"<b>用法：</b>委婉地說忘了。","th":7,"lv":2},{"p":"home for the summer","zh":"放暑假回家","scene":"Alex 回家過暑假。","en":"My sister is home for the summer.","tr":"我姊放暑假回家了。","tip":"<b>用法：</b>學生假期回家。","th":2,"lv":1},{"p":"long-distance relationship","zh":"遠距離戀愛","scene":"Haley 和 Andy 可能要分隔兩地。","en":"Long-distance relationships are really hard.","tr":"遠距離戀愛真的很難。","tip":"<b>縮寫：</b>LDR。","th":1,"lv":1}]},{"id":"jay","name":"Jay 的退休生活","who":"Jay","plot":"Jay 以為想回去工作很簡單，現實卻不是這樣。","items":[{"p":"rejoin the workforce","zh":"重回職場","scene":"Jay 想再次工作。","en":"After raising her kids, she rejoined the workforce.","tr":"她把孩子養大後重回職場。","tip":"<b>延伸：</b>workforce 勞動人口。","th":3,"lv":1},{"p":"overqualified","zh":"資歷過高","scene":"Jay 的經歷太豐富反而找不到工作。","en":"They said I'm overqualified for the job.","tr":"他們說我對這份工作來說資歷太高。","tip":"<b>用法：</b>找工作時被拒絕的理由之一。","th":3,"lv":1},{"p":"résumé gap","zh":"履歷空窗期","scene":"退休後要解釋空白期。","en":"How do I explain the résumé gap from my military service?","tr":"我要怎麼解釋當兵造成的履歷空窗？","tip":"<b>用法：</b>求職時常被問到。","th":3,"lv":2},{"p":"you can't teach an old dog new tricks","zh":"老狗學不會新把戲","scene":"Jay 覺得自己不需要改變。","en":"My dad won't use a smartphone. You can't teach an old dog new tricks.","tr":"我爸不用智慧型手機，老狗學不會新把戲。","tip":"<b>用法：</b>年紀大了很難改變。","th":9,"lv":2},{"p":"a fresh pair of eyes","zh":"新的觀點、旁觀者","scene":"新人可以帶來新的看法。","en":"Can you look at my essay? I need a fresh pair of eyes.","tr":"你可以看一下我的文章嗎？我需要新的觀點。","tip":"<b>用法：</b>請別人幫忙檢查。","th":10,"lv":2}]}],"prompts":["你覺得遠距離戀愛可行嗎（用 long-distance relationship、rip off the Band-Aid、home for the summer）","退伍後你怎麼面對求職（用 rejoin the workforce、résumé gap、overqualified）","你忘記過重要的日子嗎（用 slip one's mind、a fresh pair of eyes、the hardest part of the job）"],"challenges":[{"id":"c1","sit":"你忘了女朋友的生日，說完全忘了。","uses":["slip one's mind"],"ans":"Sorry, it totally slipped my mind."},{"id":"c2","sit":"你請朋友幫你看履歷，說需要新的觀點。","uses":["a fresh pair of eyes"],"ans":"I need a fresh pair of eyes."},{"id":"c3","sit":"你說你爸不學新東西，老狗學不會新把戲。","uses":["you can't teach an old dog new tricks"],"ans":"You can't teach an old dog new tricks."},{"id":"c4","sit":"朋友要分手，你說長痛不如短痛。","uses":["rip off the Band-Aid"],"ans":"Just rip off the Band-Aid."}]},"s08e01":{"title":"A Tale of Three Cities","lede":"第八季開場，全家分散三地：Dunphy 一家在紐約多待了幾天，而且每個人都偷偷瞞著其他人；Mitchell 在 Cam 的老家，因為對待昏迷的奶奶的方式被 Cam 的家人埋怨；Gloria 在墨西哥為了辣醬生意跟妹妹吵起來，妹妹 Sonia 還把 Manny「拐」走了。","stories":[{"id":"dunphy","name":"紐約","who":"Phil · Claire · 孩子們","plot":"全家在紐約多留幾天，每個人都偷偷有自己的行程。","items":[{"p":"the Big Apple","zh":"紐約（暱稱）","scene":"全家在大蘋果玩。","en":"I've always wanted to visit the Big Apple.","tr":"我一直很想去紐約。","tip":"<b>用法：</b>紐約市的經典暱稱。","th":8,"lv":2},{"p":"the city that never sleeps","zh":"不夜城","scene":"紐約永遠熱鬧。","en":"New York is the city that never sleeps.","tr":"紐約是不夜城。","tip":"<b>用法：</b>形容大城市夜生活。","th":8,"lv":2},{"p":"extend one's stay","zh":"延長停留","scene":"大家都想多待幾天。","en":"We extended our stay for two more nights.","tr":"我們多住了兩晚。","tip":"<b>用法：</b>飯店、旅行延長。","th":8,"lv":1},{"p":"on the sly","zh":"偷偷地","scene":"每個人都偷偷瞞著別人。","en":"He's been smoking on the sly.","tr":"他一直偷偷在抽菸。","tip":"<b>同義：</b>secretly。","th":10,"lv":2}]},{"id":"mitch","name":"Cam 的老家","who":"Mitchell · Cameron · Cam 的家人","plot":"Mitchell 在 Cam 的家族裡格格不入，還被大家埋怨。","items":[{"p":"bedside manner","zh":"對病人的態度","scene":"Mitchell 探病的方式讓人不滿。","en":"The doctor has a great bedside manner.","tr":"那位醫生對病人的態度很好。","tip":"<b>用法：</b>醫生或探病時的態度。","th":9,"lv":2},{"p":"family drama","zh":"家庭紛爭","scene":"Cam 家吵成一團。","en":"I'm staying out of the family drama.","tr":"我不想捲入家庭紛爭。","tip":"<b>用法：</b>家族間的爭吵、八卦。","th":2,"lv":1},{"p":"the black sheep of the family","zh":"家族中的異類","scene":"Mitchell 好像成了家族的異類。","en":"I'm the black sheep of the family. Everyone else is a doctor.","tr":"我是家族裡的異類，其他人都是醫生。","tip":"<b>畫面：</b>白羊群中的一隻黑羊。","th":2,"lv":2}]},{"id":"jay","name":"墨西哥","who":"Gloria · Sonia · Manny · Jay","plot":"Gloria 和妹妹為了辣醬吵架，Sonia 把 Manny 帶走了。","items":[{"p":"sibling squabble","zh":"兄弟姊妹拌嘴","scene":"姊妹倆吵個不停。","en":"It's just a sibling squabble. They'll make up.","tr":"只是兄弟姊妹拌嘴，他們會和好的。","tip":"<b>對比：</b>sibling rivalry 是長期競爭；squabble 是小吵。","th":2,"lv":2},{"p":"whisk someone away","zh":"迅速帶走某人","scene":"Sonia 一下子把 Manny 帶走了。","en":"He whisked her away to Paris for her birthday.","tr":"他在她生日時帶她飛去巴黎。","tip":"<b>用法：</b>常用在浪漫驚喜。","th":1,"lv":2},{"p":"go rogue","zh":"脫隊、自作主張","scene":"Sonia 不照計畫行動。","en":"The agent went rogue and ignored orders.","tr":"那個探員脫離掌控，不聽命令。","tip":"<b>用法：</b>不按規則行事。","th":10,"lv":2}]}],"prompts":["你最想去的大城市（用 the Big Apple、the city that never sleeps、extend one's stay）","你家有家庭紛爭嗎（用 family drama、sibling squabble、the black sheep of the family）","你曾經偷偷做過什麼事嗎（用 on the sly、go rogue、whisk someone away）"],"challenges":[{"id":"c1","sit":"你說你一直很想去紐約。","uses":["the Big Apple"],"ans":"I've always wanted to visit the Big Apple."},{"id":"c2","sit":"你說你是家裡的異類，大家都念醫科只有你不是。","uses":["the black sheep of the family"],"ans":"I'm the black sheep of the family."},{"id":"c3","sit":"組員不照報告分工自己亂改，你說他自作主張。","uses":["go rogue"],"ans":"He went rogue."},{"id":"c4","sit":"你出差去台東，決定多住一晚。","uses":["extend one's stay"],"ans":"I extended my stay one more night."}]},"s08e02":{"title":"A Stereotypical Day","lede":"一戶黑人家庭搬到對面的那天，Jay 剛好裝了監視器，他拼命想證明自己不是種族歧視；Dunphy 一家趁 Alex 生病佔她便宜，結果她決定休學一學期；Lily 說一個跨性別男孩很奇怪，讓 Mitchell 和 Cam 開始反省自己是不是真的那麼開明。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 很怕被誤會有偏見，結果越做越誇張。","items":[{"p":"security camera","zh":"監視器","scene":"Jay 剛裝了監視器。","en":"We installed a security camera at the front door.","tr":"我們在前門裝了監視器。","tip":"<b>延伸：</b>CCTV 閉路電視。","th":8,"lv":1},{"p":"stereotype","zh":"刻板印象","scene":"Jay 擔心自己被當成有偏見。","en":"Not all engineers are nerds. That's a stereotype.","tr":"不是所有工程師都是宅男，那是刻板印象。","tip":"<b>用法：</b>名詞和動詞都可以。","th":9,"lv":1},{"p":"unconscious bias","zh":"無意識的偏見","scene":"每個人都可能有自己沒察覺的偏見。","en":"We all have some unconscious bias.","tr":"我們都有一些無意識的偏見。","tip":"<b>用法：</b>職場、社會議題常見。","th":9,"lv":2},{"p":"overcompensate","zh":"矯枉過正","scene":"Jay 為了證明自己反而做過頭。","en":"He talks loudly to overcompensate for being shy.","tr":"他講話很大聲來掩飾害羞，有點矯枉過正。","tip":"<b>用法：</b>過度彌補某種不足。","th":9,"lv":2},{"p":"politically correct","zh":"政治正確","scene":"Jay 很怕講錯話。","en":"He's always trying to be politically correct.","tr":"他總是努力保持政治正確。","tip":"<b>縮寫：</b>PC。","th":9,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Alex · Phil · Claire · 全家","plot":"Alex 生病在家，家人卻一直找她幫忙。","items":[{"p":"nurse someone back to health","zh":"照顧某人直到康復","scene":"家人應該好好照顧 Alex。","en":"My mom nursed me back to health after the surgery.","tr":"手術後我媽細心照顧我直到康復。","tip":"<b>用法：</b>照顧病人。","th":8,"lv":2},{"p":"take a semester off","zh":"休學一學期","scene":"Alex 決定先休學。","en":"I'm taking a semester off to work.","tr":"我要休學一學期去工作。","tip":"<b>用法：</b>大學生暫停學業。","th":3,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 說錯話，兩人開始反省自己的教育方式。","items":[{"p":"practice what you preach","zh":"以身作則、言行一致","scene":"兩人發現自己也沒做到。","en":"You tell me to exercise, but you don't. Practice what you preach!","tr":"你叫我運動但你自己不運動，言行一致好嗎！","tip":"<b>用法：</b>批評說一套做一套的人。","th":5,"lv":2},{"p":"teachable moment","zh":"機會教育","scene":"兩人把這件事當機會教育。","en":"When my son lied, it became a teachable moment.","tr":"我兒子說謊時，正好成了機會教育。","tip":"<b>用法：</b>適合教孩子的時刻。","th":2,"lv":2},{"p":"be inclusive","zh":"有包容性","scene":"兩人希望 Lily 能接納不同的人。","en":"Our school tries to be inclusive of all students.","tr":"我們學校努力包容所有學生。","tip":"<b>名詞：</b>inclusion 包容。","th":9,"lv":1}]}],"prompts":["你遇過刻板印象嗎（用 stereotype、unconscious bias、politically correct）","你曾經休學或暫停過什麼嗎（用 take a semester off、nurse someone back to health、overcompensate）","你爸媽給過你什麼機會教育（用 teachable moment、practice what you preach、be inclusive）"],"challenges":[{"id":"c1","sit":"別人說台南人都很愛吃甜，你說那是刻板印象。","uses":["stereotype"],"ans":"That's a stereotype."},{"id":"c2","sit":"你爸叫你戒菸但他自己也抽，你叫他言行一致。","uses":["practice what you preach"],"ans":"Practice what you preach, Dad."},{"id":"c3","sit":"你跟朋友說你要休學一學期去打工。","uses":["take a semester off"],"ans":"I'm taking a semester off."},{"id":"c4","sit":"你說你家門口裝了監視器。","uses":["security camera"],"ans":"We installed a security camera."}]},"s08e03":{"title":"Blindsided","lede":"Luke 和 Manny 競選學生會長，Claire 幫 Luke 操盤，Jay 和 Gloria 挺 Manny；Haley 想開自己的公司，Phil 介紹一位怪咖行銷專家給她；Cam 沒問過 Mitchell 就讓他球隊的明星球員住進家裡。","stories":[{"id":"kids","name":"學生會選舉","who":"Luke · Manny · Claire · Jay · Gloria","plot":"兩個男孩搶當學生會長，兩邊家長都下場助選。","items":[{"p":"student council","zh":"學生會","scene":"Luke 和 Manny 要選學生會長。","en":"I was the president of the student council in high school.","tr":"我高中時是學生會長。","tip":"<b>用法：</b>學生自治組織。","th":3,"lv":1},{"p":"campaign manager","zh":"競選總幹事","scene":"Claire 負責 Luke 的選戰。","en":"My friend was my campaign manager.","tr":"我朋友是我的競選總幹事。","tip":"<b>用法：</b>選舉中負責操盤的人。","th":3,"lv":1},{"p":"smear campaign","zh":"抹黑攻擊","scene":"選戰越打越髒。","en":"The other side started a smear campaign.","tr":"對手發動了抹黑攻擊。","tip":"<b>用法：</b>散播負面消息攻擊對手。","th":5,"lv":2},{"p":"play dirty","zh":"耍手段、玩陰的","scene":"有人開始不擇手段。","en":"If they play dirty, we'll lose.","tr":"如果他們玩陰的，我們會輸。","tip":"<b>反義：</b>play fair 公平競爭。","th":5,"lv":2},{"p":"blindside","zh":"突襲、措手不及","scene":"選戰中被對方突襲。","en":"The news blindsided everyone.","tr":"這個消息讓大家措手不及。","tip":"<b>畫面：</b>從看不到的那一側被撞到。","th":4,"lv":2}]},{"id":"dunphy","name":"Haley 的創業夢","who":"Haley · Phil · 行銷專家","plot":"Haley 想開公司，Phil 介紹一位很怪的行銷專家。","items":[{"p":"personal brand","zh":"個人品牌","scene":"專家教 Haley 經營自己。","en":"Instagram is great for building your personal brand.","tr":"IG 很適合經營個人品牌。","tip":"<b>用法：</b>網紅、自媒體常說。","th":3,"lv":1},{"p":"eccentric","zh":"古怪的","scene":"行銷專家很特別。","en":"My art teacher was a little eccentric.","tr":"我的美術老師有點古怪。","tip":"<b>用法：</b>比 weird 有禮貌一點。","th":9,"lv":2},{"p":"think big","zh":"胸懷大志","scene":"專家要 Haley 想大一點。","en":"Don't just open a shop. Think big!","tr":"別只開一家店，要想大一點！","tip":"<b>用法：</b>鼓勵人目標遠大。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · 球員","plot":"Cam 沒先問 Mitchell，就讓明星球員搬進來住。","items":[{"p":"star player","zh":"明星球員","scene":"球隊的王牌住進來了。","en":"He's the star player on our basketball team.","tr":"他是我們籃球隊的明星球員。","tip":"<b>用法：</b>表現最好的隊員。","th":8,"lv":1},{"p":"it's easier to ask for forgiveness than permission","zh":"先斬後奏","scene":"Cam 先做再說。","en":"I didn't ask my boss. It's easier to ask for forgiveness than permission.","tr":"我沒問老闆，先斬後奏比較快。","tip":"<b>用法：</b>先做了再道歉。","th":10,"lv":2}]}],"prompts":["你參加過學生會或選舉嗎（用 student council、campaign manager、play dirty）","如果你要創業，你會怎麼經營（用 personal brand、think big、eccentric）","你做過先斬後奏的事嗎（用 it's easier to ask for forgiveness than permission、blindside、star player）"],"challenges":[{"id":"c1","sit":"你說你高中是學生會的。","uses":["student council"],"ans":"I was on the student council."},{"id":"c2","sit":"主管突然宣布要裁員，讓大家措手不及。","uses":["blindside"],"ans":"The news blindsided everyone."},{"id":"c3","sit":"你鼓勵朋友創業要想大一點。","uses":["think big"],"ans":"Think big!"},{"id":"c4","sit":"你沒問媽媽就把狗帶回家，說先斬後奏。","uses":["it's easier to ask for forgiveness than permission"],"ans":"It's easier to ask for forgiveness than permission."}]},"s08e04":{"title":"Weathering Heights","lede":"Phil 在地方新聞的房地產單元遇到他崇拜的氣象主播，卻後悔介紹他給 Haley 認識；Jay 幫 Manny 拍茱莉亞音樂學院的申請影片；Lily 想辦法趕走住在家裡的足球員房客。","stories":[{"id":"dunphy","name":"Phil 和氣象主播","who":"Phil · Haley · 氣象主播","plot":"Phil 見到偶像很開心，沒想到偶像對 Haley 有意思。","items":[{"p":"meet one's idol","zh":"見到偶像","scene":"Phil 終於見到崇拜的人。","en":"I finally met my idol at the fan meeting.","tr":"我終於在見面會上見到偶像。","tip":"<b>用法：</b>見到喜歡的明星。","th":8,"lv":1},{"p":"weather forecast","zh":"天氣預報","scene":"偶像是氣象主播。","en":"What's the weather forecast for tomorrow?","tr":"明天的天氣預報怎麼說？","tip":"<b>延伸：</b>forecaster 氣象播報員。","th":8,"lv":1},{"p":"a chance of rain","zh":"有下雨的機會","scene":"天氣預報常用語。","en":"There's a 70% chance of rain this afternoon.","tr":"今天下午有七成機率下雨。","tip":"<b>用法：</b>降雨機率的說法。","th":8,"lv":1},{"p":"ladies' man","zh":"很受女生歡迎的男人","scene":"主播很會撩女生。","en":"He thinks he's a ladies' man.","tr":"他自以為很受女生歡迎。","tip":"<b>用法：</b>有時帶點諷刺。","th":1,"lv":2},{"p":"should have known better","zh":"早該知道","scene":"Phil 後悔了。","en":"I should have known better than to trust him.","tr":"我早該知道不能信任他。","tip":"<b>用法：</b>事後懊悔。","th":7,"lv":1}]},{"id":"jay","name":"Manny 的申請影片","who":"Jay · Manny","plot":"Jay 幫 Manny 拍申請名校的影片。","items":[{"p":"audition tape","zh":"試鏡影片","scene":"Manny 要錄申請影片。","en":"She sent an audition tape to the TV show.","tr":"她寄了試鏡影片給那個節目。","tip":"<b>用法：</b>申請表演工作的錄影。","th":3,"lv":2},{"p":"dream big","zh":"勇敢做夢","scene":"Manny 有遠大的夢想。","en":"Dream big and work hard.","tr":"勇敢做夢，努力工作。","tip":"<b>用法：</b>鼓勵人的話。","th":6,"lv":1}]},{"id":"mitch","name":"Lily 和房客","who":"Lily · Cameron · Mitchell","plot":"Lily 不喜歡家裡多一個人，想把他趕走。","items":[{"p":"drop hints","zh":"暗示","scene":"Lily 一直暗示房客該走了。","en":"I've been dropping hints about what I want for my birthday.","tr":"我一直在暗示我生日想要什麼。","tip":"<b>用法：</b>不直接說，用暗示。","th":10,"lv":1},{"p":"get the message","zh":"懂了、意會","scene":"房客到底懂了沒？","en":"I didn't reply for three days. I think he got the message.","tr":"我三天沒回他，我想他懂了。","tip":"<b>用法：</b>理解對方的暗示。","th":7,"lv":1},{"p":"make yourself scarce","zh":"消失一下、迴避","scene":"Lily 希望房客自己離開。","en":"My parents are fighting. I'll make myself scarce.","tr":"我爸媽在吵架，我先迴避一下。","tip":"<b>用法：</b>識相地離開。","th":10,"lv":2}]}],"prompts":["你見過偶像嗎（用 meet one's idol、ladies' man、should have known better）","你的夢想是什麼（用 dream big、audition tape、weather forecast）","你會用暗示表達想法嗎（用 drop hints、get the message、make yourself scarce）"],"challenges":[{"id":"c1","sit":"週末要去爬合歡山，你問朋友明天天氣預報怎麼說。","uses":["weather forecast"],"ans":"What's the weather forecast for tomorrow?"},{"id":"c2","sit":"你一直暗示女朋友你想要新耳機。","uses":["drop hints"],"ans":"I've been dropping hints."},{"id":"c3","sit":"學長心情不好，你決定先迴避一下。","uses":["make yourself scarce"],"ans":"I'll make myself scarce."},{"id":"c4","sit":"你借錢給大學室友結果沒還，說早該知道。","uses":["should have known better"],"ans":"I should have known better."}]},"s08e05":{"title":"Halloween IV: Revenge of Rod Skyhook","lede":"Luke 的萬聖節派對眼看就要冷場，Dunphy 家只好請出 Phil 的另一個分身「Rod Skyhook」、加點宣傳，還有大人坐鎮；Cam 跟他的萬聖節宿敵正面對決；Jay 發現 Manny 要去參加死對頭的派對，便拉著 Manny 一起報復。","stories":[{"id":"dunphy","name":"Luke 的派對","who":"Luke · Phil · Claire","plot":"派對快冷場了，全家出手救援。","items":[{"p":"flop","zh":"失敗、冷場","scene":"派對差點失敗。","en":"The movie was a total flop.","tr":"那部電影徹底失敗。","tip":"<b>用法：</b>表演、商品、活動失敗。","th":9,"lv":2},{"p":"hype up","zh":"炒熱、大肆宣傳","scene":"全家幫忙宣傳派對。","en":"They hyped up the new phone for months.","tr":"他們幾個月來一直大肆宣傳新手機。","tip":"<b>延伸：</b>hype 炒作、熱度。","th":10,"lv":2},{"p":"adult supervision","zh":"大人監督","scene":"派對需要大人在場。","en":"Kids under 12 need adult supervision.","tr":"12 歲以下兒童需要大人陪同。","tip":"<b>用法：</b>活動規定常見。","th":2,"lv":1},{"p":"buzzkill","zh":"掃興的人或事","scene":"大人在場有點掃興。","en":"Don't be a buzzkill. Let's stay out late.","tr":"別掃興，我們晚點回家吧。","tip":"<b>同義：</b>party pooper。","th":9,"lv":2},{"p":"jump scare","zh":"突然的驚嚇","scene":"萬聖節派對的必備元素。","en":"That movie has so many jump scares.","tr":"那部電影有好多突然嚇人的地方。","tip":"<b>用法：</b>恐怖片的手法。","th":8,"lv":2},{"p":"costume contest","zh":"變裝比賽","scene":"派對上大家比誰扮得最好。","en":"I won first place in the costume contest.","tr":"我在變裝比賽得了第一名。","tip":"<b>用法：</b>萬聖節常見活動。","th":8,"lv":1}]},{"id":"mitch","name":"Cam 的宿敵","who":"Cameron · Mitchell","plot":"Cam 每年萬聖節都跟一個人較勁。","items":[{"p":"nemesis","zh":"宿敵","scene":"Cam 的萬聖節死對頭。","en":"Homework is my nemesis.","tr":"作業是我的宿敵。","tip":"<b>對比：</b>arch-enemy 意思接近，nemesis 更有命中注定的味道。","th":5,"lv":2}]},{"id":"jay","name":"Jay 和 Manny","who":"Jay · Manny","plot":"Jay 拉 Manny 一起去報復老對手。","items":[{"p":"get even","zh":"報復、扳平","scene":"Jay 想討回公道。","en":"He tricked me, but I'll get even.","tr":"他騙了我，但我會報復回去。","tip":"<b>對比：</b>get someone back 意思接近。","th":5,"lv":2},{"p":"petty","zh":"小心眼、計較小事","scene":"Jay 的報復有點小心眼。","en":"Don't be so petty. It was just a joke.","tr":"別那麼小心眼，只是個玩笑。","tip":"<b>用法：</b>為小事斤斤計較。","th":9,"lv":1},{"p":"sweet revenge","zh":"甜美的復仇","scene":"報復成功的快感。","en":"Beating him in the final was sweet revenge.","tr":"在決賽打敗他真是甜美的復仇。","tip":"<b>用法：</b>報仇成功的痛快。","th":5,"lv":2}]}],"prompts":["你辦過或參加過冷場的派對嗎（用 flop、buzzkill、hype up）","你最怕看什麼樣的恐怖片（用 jump scare、costume contest、adult supervision）","你曾經想報復過誰嗎（用 get even、petty、sweet revenge）"],"challenges":[{"id":"c1","sit":"你說那部電影票房慘敗。","uses":["flop"],"ans":"It was a total flop."},{"id":"c2","sit":"朋友為了一塊錢跟你計較，你說他小心眼。","uses":["petty"],"ans":"Don't be so petty."},{"id":"c3","sit":"你在比賽打敗上次贏你的人，說報仇成功。","uses":["sweet revenge"],"ans":"Sweet revenge!"},{"id":"c4","sit":"你說英文是你的宿敵。","uses":["nemesis"],"ans":"English is my nemesis."}]},"s08e06":{"title":"Grab It","lede":"Jay 最愛的鄉村俱樂部是他的避風港，Phil 卻想加入；Claire 擔心自己影響了 Alex 的選擇；Gloria 想逃離兩個兒子喘口氣；Cam 沒跟 Mitchell 說清楚他的舞台劇內容，結果讓 Mitchell 成了焦點。","stories":[{"id":"jay","name":"Jay 的俱樂部","who":"Jay · Phil","plot":"Jay 的私人天堂可能要被 Phil 入侵了。","items":[{"p":"country club","zh":"鄉村俱樂部","scene":"Jay 的私人避風港。","en":"My uncle plays golf at the country club every Sunday.","tr":"我叔叔每週日都去鄉村俱樂部打高爾夫。","tip":"<b>文化：</b>美國有會員制的高級俱樂部。","th":8,"lv":2},{"p":"members only","zh":"會員限定","scene":"不是誰都能進。","en":"Sorry, this area is members only.","tr":"抱歉，這區只限會員。","tip":"<b>用法：</b>限定會員使用。","th":8,"lv":1},{"p":"my happy place","zh":"讓我開心的地方","scene":"俱樂部是 Jay 的快樂天堂。","en":"The beach is my happy place.","tr":"海邊是讓我最快樂的地方。","tip":"<b>用法：</b>讓自己放鬆、開心的地方。","th":4,"lv":2},{"p":"tee time","zh":"開球時間","scene":"打高爾夫要預約時段。","en":"I booked a tee time for 8 a.m.","tr":"我訂了早上八點的開球時間。","tip":"<b>用法：</b>高爾夫球場的預約時間。","th":8,"lv":2}]},{"id":"dunphy","name":"Claire 和 Alex","who":"Claire · Alex","plot":"Claire 擔心 Alex 太像自己。","items":[{"p":"mini-me","zh":"縮小版的自己","scene":"Alex 越來越像 Claire。","en":"My daughter is my mini-me. She even talks like me.","tr":"我女兒是縮小版的我，連說話都像我。","tip":"<b>來源：</b>電影《王牌大賤諜》。","th":2,"lv":2},{"p":"get away from it all","zh":"遠離一切","scene":"Gloria 想好好喘口氣。","en":"I want to go to the mountains and get away from it all.","tr":"我想去山上遠離一切。","tip":"<b>用法：</b>逃離日常壓力。","th":8,"lv":2}]},{"id":"mitch","name":"Cam 的舞台劇","who":"Cameron · Mitchell","plot":"Cam 的劇讓 Mitchell 意外成了焦點。","items":[{"p":"in the spotlight","zh":"成為焦點","scene":"Mitchell 突然被大家注意。","en":"She doesn't like being in the spotlight.","tr":"她不喜歡成為焦點。","tip":"<b>畫面：</b>舞台聚光燈打在身上。","th":9,"lv":2},{"p":"stage fright","zh":"怯場","scene":"Mitchell 很怕上台。","en":"I get stage fright before every speech.","tr":"我每次演講前都會怯場。","tip":"<b>用法：</b>上台前的緊張。","th":4,"lv":2},{"p":"read the fine print","zh":"看清楚小字、細節","scene":"Mitchell 應該先問清楚。","en":"Always read the fine print before you sign.","tr":"簽名前一定要看清楚小字。","tip":"<b>用法：</b>合約、條款的細節。","th":10,"lv":2},{"p":"the whole story","zh":"事情的全貌","scene":"Cam 沒說出全部。","en":"You didn't tell me the whole story.","tr":"你沒告訴我事情的全貌。","tip":"<b>用法：</b>只聽到一部分時。","th":10,"lv":1}]}],"prompts":["你的快樂天堂是哪裡（用 my happy place、get away from it all、members only）","你會怯場嗎（用 stage fright、in the spotlight、the whole story）","你簽約前會仔細看嗎（用 read the fine print、mini-me、tee time）"],"challenges":[{"id":"c1","sit":"你說你的快樂天堂是營區的福利社。","uses":["my happy place"],"ans":"The PX is my happy place."},{"id":"c2","sit":"你說你上台前都會怯場。","uses":["stage fright"],"ans":"I get stage fright."},{"id":"c3","sit":"簽手機合約前，朋友叫你看清楚小字。","uses":["read the fine print"],"ans":"Read the fine print first."},{"id":"c4","sit":"朋友只說了一半，你說他沒講全部。","uses":["the whole story"],"ans":"You didn't tell me the whole story."}]},"s08e07":{"title":"Thanksgiving Jamboree","lede":"Cam 不惜血本辦感恩節大派對；Haley 跟 Phil 說她想跟新男友過節；Jay 努力控制自己的血壓；Alex 和 Dwight 越走越近。","stories":[{"id":"mitch","name":"Cam 的感恩節","who":"Cameron · Mitchell","plot":"Cam 把感恩節辦得超級盛大。","items":[{"p":"spare no expense","zh":"不惜花費","scene":"Cam 卯起來辦派對。","en":"They spared no expense on their wedding.","tr":"他們的婚禮不惜血本。","tip":"<b>用法：</b>花很多錢做一件事。","th":3,"lv":2},{"p":"potluck","zh":"每人帶一道菜的聚餐","scene":"大家各帶一道菜。","en":"Our unit is having a potluck this Friday.","tr":"我們連上這週五要辦百樂餐。","tip":"<b>文化：</b>美國常見的聚餐形式。","th":8,"lv":1},{"p":"say grace","zh":"飯前禱告","scene":"開動前要禱告。","en":"My grandma always says grace before dinner.","tr":"我奶奶晚餐前總會禱告。","tip":"<b>文化：</b>西方家庭的餐前感恩。","th":8,"lv":2},{"p":"thankful for","zh":"感謝、感恩","scene":"感恩節就是要說出感謝。","en":"I'm thankful for my family and friends.","tr":"我很感謝我的家人和朋友。","tip":"<b>用法：</b>表達感恩。","th":4,"lv":1},{"p":"second helping","zh":"再來一份","scene":"大家都吃了第二輪。","en":"Can I have a second helping of rice?","tr":"我可以再來一碗飯嗎？","tip":"<b>延伸：</b>helping 一份食物。","th":8,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 要控制血壓，得放輕鬆一點。","items":[{"p":"blood pressure","zh":"血壓","scene":"Jay 的血壓太高。","en":"My dad has to watch his blood pressure.","tr":"我爸得注意他的血壓。","tip":"<b>延伸：</b>high blood pressure 高血壓。","th":8,"lv":1},{"p":"doctor's orders","zh":"醫生的指示","scene":"Jay 被醫生要求放輕鬆。","en":"No more salty food. Doctor's orders.","tr":"不能再吃鹹的了，醫生交代的。","tip":"<b>用法：</b>玩笑地說「這是規定」。","th":8,"lv":1},{"p":"take it down a notch","zh":"降低一點、別那麼激動","scene":"Jay 要冷靜一點。","en":"You're yelling. Take it down a notch.","tr":"你在大吼，冷靜一點。","tip":"<b>用法：</b>叫人別太激動或太誇張。","th":5,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Haley · Phil · Alex","plot":"Haley 想跟男友過節；Alex 和 Dwight 慢慢靠近。","items":[{"p":"bring someone home","zh":"帶某人回家見家人","scene":"Haley 的新男友。","en":"She's bringing her boyfriend home for New Year.","tr":"她過年要帶男朋友回家。","tip":"<b>用法：</b>帶交往對象見家人。","th":1,"lv":1},{"p":"slowly but surely","zh":"慢慢地但確實地","scene":"兩人的感情慢慢加溫。","en":"Slowly but surely, my English is improving.","tr":"我的英文慢慢地但確實在進步。","tip":"<b>用法：</b>穩定前進。","th":10,"lv":1}]}],"prompts":["你家過節會怎麼吃（用 potluck、second helping、spare no expense）","你最感謝的人或事（用 thankful for、say grace、bring someone home）","你家人有在注意健康嗎（用 blood pressure、doctor's orders、take it down a notch）"],"challenges":[{"id":"c1","sit":"公司辦百樂餐，每人帶一道菜。","uses":["potluck"],"ans":"We're having a potluck at work."},{"id":"c2","sit":"吃中秋烤肉，你說要再來一份。","uses":["second helping"],"ans":"Can I have a second helping?"},{"id":"c3","sit":"你跟朋友說你的英文慢慢在進步。","uses":["slowly but surely"],"ans":"Slowly but surely, I'm getting better."},{"id":"c4","sit":"你爸說不能吃宵夜，這是醫生交代的。","uses":["doctor's orders"],"ans":"No late-night snacks. Doctor's orders."}]},"s08e08":{"title":"The Alliance","lede":"Phil、Cam 和 Gloria 這三位「嫁進來的人」偷偷開會，覺得自己在 Pritchett 家族裡常被排擠，決定結盟；Luke 去 Jay 的俱樂部打工；Haley 幫忙照顧一個小女孩。","stories":[{"id":"dunphy","name":"姻親聯盟","who":"Phil · Cameron · Gloria","plot":"三個姻親覺得自己被 Pritchett 家的人小看，決定聯手。","items":[{"p":"form an alliance","zh":"結盟","scene":"三人組成同盟。","en":"The two small parties formed an alliance.","tr":"兩個小黨結盟了。","tip":"<b>延伸：</b>alliance 聯盟。","th":10,"lv":2},{"p":"us versus them","zh":"我們對抗他們","scene":"姻親對抗原生家族。","en":"It always feels like us versus them at family dinners.","tr":"家庭聚餐時總覺得是我們對抗他們。","tip":"<b>用法：</b>形容兩派對立。","th":5,"lv":2},{"p":"gang up on","zh":"聯手對付某人","scene":"大家都愛聯手吐槽姻親。","en":"My brothers always gang up on me.","tr":"我兄弟們總是聯手對付我。","tip":"<b>用法：</b>多人對付一人。","th":5,"lv":2},{"p":"blood is thicker than water","zh":"血濃於水","scene":"原生家人總是團結。","en":"In the end, blood is thicker than water.","tr":"到頭來還是血濃於水。","tip":"<b>用法：</b>家人關係最重要。","th":2,"lv":2},{"p":"secret meeting","zh":"秘密會議","scene":"三人偷偷開會。","en":"They held a secret meeting in the garage.","tr":"他們在車庫開秘密會議。","tip":"<b>用法：</b>不公開的聚會。","th":10,"lv":1},{"p":"safety in numbers","zh":"人多勢眾比較安全","scene":"三人團結比較有力量。","en":"Let's walk together. There's safety in numbers.","tr":"我們一起走吧，人多比較安全。","tip":"<b>用法：</b>團體行動比較安全。","th":10,"lv":2}]},{"id":"jay","name":"Luke 打工","who":"Luke · Jay","plot":"Luke 在俱樂部從基層做起。","items":[{"p":"work one's way up","zh":"從基層一路往上爬","scene":"Luke 從最基本的工作開始。","en":"He started as a waiter and worked his way up to manager.","tr":"他從服務生做起，一路升到經理。","tip":"<b>用法：</b>靠努力升遷。","th":3,"lv":2},{"p":"earn one's keep","zh":"賺取自己的生活費、做自己該做的","scene":"Luke 得自己努力。","en":"If you live here, you have to earn your keep.","tr":"你住這裡就得出點力。","tip":"<b>用法：</b>付出勞力換取住宿或待遇。","th":3,"lv":2},{"p":"entry-level","zh":"初階的、入門的","scene":"Luke 做的是最基本的工作。","en":"I'm looking for an entry-level job in marketing.","tr":"我在找行銷的初階工作。","tip":"<b>用法：</b>新鮮人職位。","th":3,"lv":1}]},{"id":"mitch","name":"Haley 照顧小孩","who":"Haley","plot":"Haley 負責照顧一個小女孩。","items":[{"p":"be responsible for","zh":"對…負責","scene":"Haley 要對孩子負責。","en":"You're responsible for the keys tonight.","tr":"今晚鑰匙由你負責。","tip":"<b>名詞：</b>responsibility 責任。","th":10,"lv":1}]}],"prompts":["你曾經跟人結盟對抗別人嗎（用 form an alliance、gang up on、safety in numbers）","你覺得血濃於水嗎（用 blood is thicker than water、us versus them、secret meeting）","你第一份工作從哪裡開始（用 work one's way up、entry-level、earn one's keep）"],"challenges":[{"id":"c1","sit":"你說你哥和你姊總是聯手對付你。","uses":["gang up on"],"ans":"They always gang up on me."},{"id":"c2","sit":"晚上走夜路，你說大家一起走比較安全。","uses":["safety in numbers"],"ans":"There's safety in numbers."},{"id":"c3","sit":"你說畢業後想先找初階的工作。","uses":["entry-level"],"ans":"I'm looking for an entry-level job."},{"id":"c4","sit":"店長說今晚關店的鑰匙由你負責。","uses":["be responsible for"],"ans":"You're responsible for the keys tonight."}]},"s08e09":{"title":"Snow Ball","lede":"Luke 和 Manny 負責籌辦學校的冬季舞會；Claire 和 Gloria 想安撫一位情緒激動的家長會媽媽；Phil 想跟 Jay 多相處；Mitchell 則跟一個小霸王正面對質。","stories":[{"id":"kids","name":"冬季舞會","who":"Luke · Manny","plot":"兩個男孩負責舞會的大小事。","items":[{"p":"slow song","zh":"慢歌","scene":"舞會最緊張的時刻。","en":"When the slow song came on, he asked me to dance.","tr":"慢歌一放，他就邀我跳舞。","tip":"<b>對比：</b>slow dance 是慢舞。","th":8,"lv":1},{"p":"decorations committee","zh":"佈置組","scene":"舞會需要有人負責佈置。","en":"I'm on the decorations committee for the party.","tr":"我是派對佈置組的。","tip":"<b>延伸：</b>committee 委員會。","th":8,"lv":2}]},{"id":"dunphy","name":"Claire 和 Gloria","who":"Claire · Gloria · 家長會媽媽","plot":"兩人想安撫一位非常激動的家長。","items":[{"p":"PTA","zh":"家長教師會","scene":"家長會的媽媽很難搞。","en":"My mom is very active in the PTA.","tr":"我媽在家長會很活躍。","tip":"<b>全稱：</b>Parent-Teacher Association。","th":2,"lv":2},{"p":"high-strung","zh":"神經緊繃的","scene":"那位媽媽很容易激動。","en":"She's a little high-strung before exams.","tr":"她考試前有點神經緊繃。","tip":"<b>畫面：</b>弦繃得很緊。","th":9,"lv":2},{"p":"smooth things over","zh":"緩和、擺平","scene":"兩人想把事情擺平。","en":"I bought her flowers to smooth things over.","tr":"我買花給她想緩和一下。","tip":"<b>用法：</b>化解衝突。","th":6,"lv":2}]},{"id":"jay","name":"Phil 和 Jay","who":"Phil · Jay","plot":"Phil 想跟岳父培養感情。","items":[{"p":"male bonding","zh":"男人之間的情誼","scene":"Phil 想跟 Jay 培養兄弟情。","en":"Fishing trips are great for male bonding.","tr":"釣魚之旅很適合培養男人之間的感情。","tip":"<b>用法：</b>男生之間的交流時光。","th":2,"lv":2},{"p":"father-in-law","zh":"岳父、公公","scene":"Jay 是 Phil 的岳父。","en":"My father-in-law is a great cook.","tr":"我岳父很會煮菜。","tip":"<b>延伸：</b>mother-in-law 岳母、婆婆。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 和小霸王","who":"Mitchell","plot":"Mitchell 決定面對一個欺負人的傢伙。","items":[{"p":"confront","zh":"正面對質","scene":"Mitchell 決定當面說清楚。","en":"I confronted him about the money he owed me.","tr":"我當面跟他講他欠我錢的事。","tip":"<b>用法：</b>直接面對問題或人。","th":5,"lv":1},{"p":"pick on someone your own size","zh":"去欺負跟你一樣大的人","scene":"Mitchell 要霸凌者別欺負弱小。","en":"Leave him alone. Pick on someone your own size!","tr":"放過他，有種去找跟你一樣大的！","tip":"<b>用法：</b>叫霸凌者別欺負弱小。","th":5,"lv":2},{"p":"playground bully","zh":"遊樂場小霸王","scene":"經典的欺負人角色。","en":"There was a playground bully who took our lunch money.","tr":"有個遊樂場小霸王會搶我們的午餐錢。","tip":"<b>延伸：</b>bully 霸凌者。","th":5,"lv":1}]}],"prompts":["你參加過學校舞會或活動籌備嗎（用 decorations committee、slow song、PTA）","你曾經當面跟人對質嗎（用 confront、pick on someone your own size、playground bully）","你跟長輩怎麼培養感情（用 male bonding、father-in-law、smooth things over）"],"challenges":[{"id":"c1","sit":"你跟一直不還錢的朋友當面說清楚。","uses":["confront"],"ans":"I confronted him about it."},{"id":"c2","sit":"你和女朋友吵架，買宵夜想緩和一下。","uses":["smooth things over"],"ans":"I bought her snacks to smooth things over."},{"id":"c3","sit":"你說你考試前會神經緊繃。","uses":["high-strung"],"ans":"I get high-strung before exams."},{"id":"c4","sit":"你叫在球場欺負小學生的高中生去找跟他一樣大的。","uses":["pick on someone your own size"],"ans":"Pick on someone your own size!"}]},"s08e10":{"title":"Ringmaster Keifth","lede":"Cam 跟前男友 Keifth 重逢，對方以前是馬戲團主持人，現在當飯店禮賓；Phil 發現爸爸在跟他小時候的保母約會；Jay 和 Gloria 要為 Joe 選一位萬一他們出事時的監護人。","stories":[{"id":"mitch","name":"Cam 的前男友","who":"Cameron · Keifth · Mitchell","plot":"Cam 遇到前男友，過去的回憶全回來了。","items":[{"p":"run away with the circus","zh":"離家去追夢（逃家跟馬戲團走）","scene":"Cam 年輕時的瘋狂往事。","en":"When I was a kid, I wanted to run away with the circus.","tr":"我小時候很想逃家跟馬戲團走。","tip":"<b>用法：</b>比喻拋下一切去冒險。","th":10,"lv":2},{"p":"ringmaster","zh":"馬戲團主持人","scene":"Keifth 以前的工作。","en":"The ringmaster introduced each act.","tr":"馬戲團主持人介紹每個節目。","tip":"<b>用法：</b>也比喻主導全場的人。","th":8,"lv":2},{"p":"concierge","zh":"飯店禮賓人員","scene":"Keifth 現在的工作。","en":"Ask the concierge for restaurant recommendations.","tr":"問一下禮賓人員有什麼推薦的餐廳。","tip":"<b>用法：</b>飯店的服務人員。","th":8,"lv":2},{"p":"the past catches up with you","zh":"過去找上門來","scene":"舊情人出現了。","en":"You can't run forever. The past catches up with you.","tr":"你不能一直逃，過去總會找上門。","tip":"<b>用法：</b>以前的事再度出現。","th":9,"lv":2}]},{"id":"dunphy","name":"Phil 和 Frank","who":"Phil · Frank","plot":"Phil 發現爸爸的新女友竟然是自己小時候的保母。","items":[{"p":"age is just a number","zh":"年齡只是數字","scene":"Frank 談戀愛不在乎年齡。","en":"My grandma started skydiving at 70. Age is just a number!","tr":"我奶奶 70 歲開始玩跳傘，年齡只是數字！","tip":"<b>用法：</b>鼓勵人不要被年紀限制。","th":6,"lv":2},{"p":"rob the cradle","zh":"老牛吃嫩草","scene":"年齡差距讓人議論。","en":"He's dating a 20-year-old? He's robbing the cradle.","tr":"他在跟 20 歲的人交往？老牛吃嫩草。","tip":"<b>畫面：</b>從搖籃裡搶人。","th":1,"lv":2},{"p":"creep someone out","zh":"讓人毛毛的","scene":"這件事讓 Phil 有點不舒服。","en":"That doll creeps me out.","tr":"那個娃娃讓我毛毛的。","tip":"<b>對比：</b>give someone the creeps 意思相同。","th":4,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Joe","plot":"兩人要決定萬一出事，誰來照顧 Joe。","items":[{"p":"godparent","zh":"教父母、乾爹乾媽","scene":"兩人在想誰可以當 Joe 的教父母。","en":"My uncle is my godparent.","tr":"我叔叔是我的教父。","tip":"<b>延伸：</b>godfather 教父、godmother 教母。","th":2,"lv":2},{"p":"trust someone with","zh":"把…託付給某人","scene":"要選一個能託付的人。","en":"I trust you with my life.","tr":"我可以把命交給你。","tip":"<b>用法：</b>信任某人照顧某物。","th":2,"lv":1},{"p":"pros and cons","zh":"優缺點","scene":"兩人列出每個人選的優缺點。","en":"Let's make a list of pros and cons.","tr":"我們來列一張優缺點清單吧。","tip":"<b>用法：</b>做決定前的分析。","th":10,"lv":1}]}],"prompts":["你小時候有想逃家去冒險嗎（用 run away with the circus、ringmaster、the past catches up with you）","你覺得年齡只是數字嗎（用 age is just a number、rob the cradle、creep someone out）","你會把重要的東西託付給誰（用 trust someone with、godparent、pros and cons）"],"challenges":[{"id":"c1","sit":"你說你奶奶七十歲還去登山，年齡只是數字。","uses":["age is just a number"],"ans":"Age is just a number!"},{"id":"c2","sit":"你在猶豫要不要轉職，決定列出優缺點。","uses":["pros and cons"],"ans":"I'll make a list of pros and cons."},{"id":"c3","sit":"你說你可以把命交給你的好兄弟。","uses":["trust someone with"],"ans":"I trust him with my life."},{"id":"c4","sit":"你問飯店禮賓人員附近有什麼好吃的。","uses":["concierge"],"ans":"Let's ask the concierge."}]},"s08e11":{"title":"Sarge & Pea","lede":"Cam 帶著姪女們，向一位破壞 Lily 舞蹈表演的媽媽展開報復；Phil 和 Gloria 對 Luke 和 Manny 的大學計畫意見不同；Mitchell、Claire 和 Jay 在一位親戚的婚禮上遇到 Dede。","stories":[{"id":"mitch","name":"Cam 的報復行動","who":"Cameron · 姪女們 · Lily","plot":"Cam 像教官一樣帶著姪女們展開報復。","items":[{"p":"drill sergeant","zh":"教育班長、魔鬼教官","scene":"Cam 化身嚴格教官。","en":"My mom acts like a drill sergeant in the morning.","tr":"我媽早上像個魔鬼教官。","tip":"<b>用法：</b>當兵的你一定很熟悉這種人。","th":9,"lv":2},{"p":"prank war","zh":"惡作劇大戰","scene":"雙方互相整來整去。","en":"My roommates and I had a prank war all week.","tr":"我和室友惡作劇大戰了一整週。","tip":"<b>用法：</b>互相惡整。","th":5,"lv":2},{"p":"payback","zh":"報復、回敬","scene":"Cam 要討回公道。","en":"You ate my pudding? This is payback!","tr":"你吃了我的布丁？這是報應！","tip":"<b>用法：</b>Payback time! 報仇時間到！","th":5,"lv":1}]},{"id":"dunphy","name":"大學計畫","who":"Phil · Gloria · Luke · Manny","plot":"兩個家長對孩子要讀什麼大學意見分歧。","items":[{"p":"college application","zh":"大學申請","scene":"兩個男孩要申請大學了。","en":"I'm working on my college applications this month.","tr":"我這個月在準備大學申請。","tip":"<b>用法：</b>美國大學申請流程。","th":3,"lv":1},{"p":"safety school","zh":"保底學校","scene":"一定要有保底的學校。","en":"Apply to at least one safety school.","tr":"至少要申請一間保底學校。","tip":"<b>對比：</b>reach school 夢幻學校。","th":3,"lv":2},{"p":"reach school","zh":"衝刺學校、夢幻學校","scene":"想挑戰的學校。","en":"Harvard is my reach school.","tr":"哈佛是我想挑戰的學校。","tip":"<b>用法：</b>錄取機會較低的學校。","th":3,"lv":2},{"p":"keep one's options open","zh":"保留選擇的空間","scene":"別太早決定。","en":"I'm not choosing yet. I'm keeping my options open.","tr":"我還不想決定，先保留選擇。","tip":"<b>用法：</b>不急著做決定。","th":10,"lv":1}]},{"id":"jay","name":"親戚的婚禮","who":"Mitchell · Claire · Jay · Dede","plot":"三人在婚禮上遇到 Dede，氣氛微妙。","items":[{"p":"family reunion","zh":"家族聚會","scene":"婚禮變成家族大團圓。","en":"We have a big family reunion every New Year.","tr":"我們每年過年都有家族大團圓。","tip":"<b>用法：</b>親戚久別重逢。","th":2,"lv":1},{"p":"awkward family photo","zh":"尷尬的家族照","scene":"婚禮合照很尷尬。","en":"Our awkward family photo is still on the fridge.","tr":"我們那張尷尬的全家福還貼在冰箱上。","tip":"<b>用法：</b>網路上很流行分享這類照片。","th":2,"lv":1},{"p":"it's been a while","zh":"好一陣子沒見了","scene":"大家很久沒見。","en":"Hey, it's been a while! How are you?","tr":"嘿，好一陣子沒見了！你好嗎？","tip":"<b>對比：</b>long time no see 更口語。","th":7,"lv":1}]}],"prompts":["你遇過最嚴格的班長或教官（用 drill sergeant、payback、prank war）","你申請學校時怎麼選（用 safety school、reach school、keep one's options open）","你家的家族聚會（用 family reunion、awkward family photo、it's been a while）"],"challenges":[{"id":"c1","sit":"你說你的班長像魔鬼教官。","uses":["drill sergeant"],"ans":"He's like a drill sergeant."},{"id":"c2","sit":"室友整你，你說報仇時間到了。","uses":["payback"],"ans":"It's payback time!"},{"id":"c3","sit":"你還不想決定退伍後做什麼，先保留選擇。","uses":["keep one's options open"],"ans":"I'm keeping my options open."},{"id":"c4","sit":"你在路上遇到國中老師，說好一陣子沒見了。","uses":["it's been a while"],"ans":"It's been a while!"}]},"s08e12":{"title":"Do You Believe in Magic","lede":"情人節到了，Claire 請來魔術師，想讓 Phil 重新找回驚喜的感覺；Cam 和 Mitchell 鼓勵 Haley 和 Sal 在感情裡別再委屈自己；Jay 發現偏心 Joe 也是有極限的；Alex 則發現 Claire 的助理 Ben 好像對她有意思。","stories":[{"id":"dunphy","name":"情人節魔術","who":"Claire · Phil · 魔術師","plot":"Claire 請魔術師來，想給 Phil 一個充滿驚奇的情人節。","items":[{"p":"sleight of hand","zh":"手法、障眼法","scene":"魔術師的手法快到看不出破綻。","en":"It's just sleight of hand. There's no real magic.","tr":"那只是手法而已，沒有真的魔法。","tip":"<b>用法：</b>魔術手法，也可以比喻騙人的小把戲。","th":9,"lv":2},{"p":"sense of wonder","zh":"驚奇感","scene":"Claire 想讓 Phil 找回那種驚喜的感覺。","en":"Kids have a natural sense of wonder.","tr":"小孩天生就有一種驚奇感。","tip":"<b>搭配：</b>lose / regain one's sense of wonder。","th":4,"lv":2},{"p":"the magic is gone","zh":"熱情不在了","scene":"結婚久了，很怕兩人之間沒了火花。","en":"We used to talk all night. Now the magic is gone.","tr":"我們以前可以聊一整晚，現在熱情都沒了。","tip":"<b>用法：</b>感情、工作、興趣失去新鮮感都能用。","th":1,"lv":2}]},{"id":"mitch","name":"姊妹淘時間","who":"Cameron · Mitchell · Haley · Sal","plot":"兩人鼓勵 Haley 和 Sal 在男人面前硬起來。","items":[{"p":"stand your ground","zh":"堅守立場","scene":"兩人要女生們別輕易讓步。","en":"If he starts arguing, just stand your ground.","tr":"如果他開始跟你吵，你就堅持立場。","tip":"<b>同義：</b>hold your ground。","th":5,"lv":2},{"p":"wear the pants","zh":"當家做主","scene":"感情裡到底誰說了算。","en":"In our house, my mom wears the pants.","tr":"在我們家，是我媽在當家。","tip":"<b>畫面：</b>以前只有男人穿褲子，所以象徵掌權。","th":1,"lv":2},{"p":"walk all over someone","zh":"騎到某人頭上","scene":"不能一直讓對方予取予求。","en":"Don't let him walk all over you.","tr":"別讓他騎到你頭上。","tip":"<b>畫面：</b>被人踩在腳下走過去。","th":5,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Joe · Manny","plot":"Jay 一直偏心 Joe，結果發現這樣也有極限。","items":[{"p":"golden child","zh":"被偏愛的孩子","scene":"Joe 好像是家裡的寶貝。","en":"My little brother is the golden child. He can do no wrong.","tr":"我弟是家裡的寶貝，做什麼都對。","tip":"<b>用法：</b>帶點抱怨，指父母最疼的那個。","th":2,"lv":2},{"p":"have a soft spot for","zh":"對……特別心軟","scene":"Jay 對 Joe 特別寬容。","en":"I have a soft spot for dogs.","tr":"我對狗狗特別沒抵抗力。","tip":"<b>用法：</b>soft spot 心裡柔軟的地方。","th":4,"lv":2}]},{"id":"kids","name":"Alex 與 Ben","who":"Alex · Ben · Claire","plot":"Alex 發現 Claire 的助理 Ben 好像喜歡她。","items":[{"p":"carry a torch for","zh":"暗戀、默默喜歡","scene":"Ben 一直默默喜歡 Alex。","en":"He's been carrying a torch for her since high school.","tr":"他從高中就一直暗戀她。","tip":"<b>畫面：</b>一直舉著火把，心裡的火沒熄滅。","th":1,"lv":2},{"p":"smitten","zh":"神魂顛倒","scene":"Ben 看到 Alex 就整個人很害羞。","en":"He's totally smitten with his new girlfriend.","tr":"他被新女友迷得神魂顛倒。","tip":"<b>搭配：</b>be smitten with someone。","th":1,"lv":2}]}],"prompts":["你喜歡看魔術嗎（用 sleight of hand、sense of wonder、the magic is gone）","你在感情或朋友之間會堅持立場嗎（用 stand your ground、walk all over someone、wear the pants）","你家誰是被偏愛的那個（用 golden child、have a soft spot for、smitten）"],"challenges":[{"id":"c1","sit":"同事一直把工作丟給你，朋友叫你別讓他騎到你頭上。","uses":["walk all over someone"],"ans":"Don't let him walk all over you."},{"id":"c2","sit":"你說你對貓特別心軟。","uses":["have a soft spot for"],"ans":"I have a soft spot for cats."},{"id":"c3","sit":"朋友說你弟是家裡的寶貝，你同意。","uses":["golden child"],"ans":"Yeah, he's the golden child."},{"id":"c4","sit":"你看完魔術說那只是手法而已。","uses":["sleight of hand"],"ans":"It's just sleight of hand."}]},"s08e13":{"title":"Do It Yourself","lede":"Phil 說服 Jay 一起投資一間房子；Gloria 請 Joe 的棒球教練來家裡修東西，這個萬能先生好像想取代 Jay；Claire 和 Haley 去上名廚的料理課；Mitchell 和 Cam 想教 Lily 努力工作的價值，結果被一窩黃蜂攻擊，Cam 的臉腫了起來。","stories":[{"id":"jay","name":"投資與萬能教練","who":"Jay · Phil · Gloria · 教練","plot":"Jay 被 Phil 說動去投資房子，家裡卻來了一個什麼都會修的教練。","items":[{"p":"sink money into","zh":"把錢砸進……","scene":"Jay 把錢投進 Phil 推薦的房子。","en":"He sank all his savings into a restaurant.","tr":"他把所有積蓄都砸進一家餐廳。","tip":"<b>語氣：</b>sink 有「沉下去」的感覺，常暗示可能回不來。","th":3,"lv":2},{"p":"muscle in on","zh":"硬擠進來搶地盤","scene":"教練好像想取代 Jay 在家裡的位置。","en":"He's trying to muscle in on my business.","tr":"他想硬擠進來搶我的生意。","tip":"<b>畫面：</b>用肌肉把別人擠開。","th":5,"lv":2},{"p":"Mr. Fix-It","zh":"萬能修理先生","scene":"教練什麼都會修。","en":"My dad is a real Mr. Fix-It.","tr":"我爸是個什麼都會修的人。","tip":"<b>用法：</b>稱讚或調侃很會修東西的人。","th":9,"lv":2}]},{"id":"dunphy","name":"名廚料理課","who":"Claire · Haley · 名廚","plot":"母女一起去上名廚的料理課。","items":[{"p":"too many cooks spoil the broth","zh":"人多手雜反而壞事","scene":"母女倆在廚房裡互相干擾。","en":"Let me handle it. Too many cooks spoil the broth.","tr":"讓我來處理吧，人多手雜反而壞事。","tip":"<b>用法：</b>常簡化成 too many cooks。","th":10,"lv":2},{"p":"a recipe for disaster","zh":"注定出問題","scene":"兩人一起下廚好像不是好主意。","en":"Mixing work and family is a recipe for disaster.","tr":"把工作跟家人混在一起，注定出問題。","tip":"<b>畫面：</b>照著這個「食譜」做，一定做出災難。","th":9,"lv":2}]},{"id":"mitch","name":"勞動教育","who":"Mitchell · Cameron · Lily","plot":"兩人想讓 Lily 體驗努力工作，結果被黃蜂攻擊。","items":[{"p":"elbow grease","zh":"苦力、勞力","scene":"兩人要 Lily 自己動手出力。","en":"It just needs a little elbow grease.","tr":"只需要多花點力氣擦一擦就好。","tip":"<b>畫面：</b>手肘的油，用力擦東西的樣子。","th":10,"lv":2},{"p":"an honest day's work","zh":"踏實的一天工作","scene":"兩人想讓 Lily 知道認真工作的價值。","en":"There's nothing like an honest day's work.","tr":"沒有什麼比踏實工作一整天更好的了。","tip":"<b>用法：</b>老一輩愛說的話。","th":3,"lv":2},{"p":"stir up a hornet's nest","zh":"捅了馬蜂窩","scene":"兩人真的被一窩黃蜂攻擊。","en":"Asking about his salary stirred up a hornet's nest.","tr":"問他薪水的事等於捅了馬蜂窩。","tip":"<b>用法：</b>字面和比喻都能用，引起大麻煩。","th":5,"lv":2},{"p":"swell up","zh":"腫起來","scene":"Cam 被叮完臉腫起來。","en":"My ankle swelled up after I twisted it.","tr":"我扭到後腳踝腫起來。","tip":"<b>名詞：</b>swelling 腫脹。","th":8,"lv":1},{"p":"allergic reaction","zh":"過敏反應","scene":"被叮之後出現過敏。","en":"I had an allergic reaction to the shrimp.","tr":"我吃蝦子過敏了。","tip":"<b>搭配：</b>be allergic to something。","th":8,"lv":1}]}],"prompts":["你做過最累的一次體力活（用 elbow grease、an honest day's work、swell up）","你跟家人一起下廚過嗎（用 too many cooks spoil the broth、a recipe for disaster、Mr. Fix-It）","你曾經不小心惹出大麻煩嗎（用 stir up a hornet's nest、muscle in on、sink money into）"],"challenges":[{"id":"c1","sit":"去河濱烤肉被蚊子叮，你說手腫起來了。","uses":["swell up"],"ans":"My hand swelled up."},{"id":"c2","sit":"你說你吃花生會過敏。","uses":["allergic reaction"],"ans":"I have an allergic reaction to peanuts."},{"id":"c3","sit":"大家都擠進廚房幫忙，你說人多手雜反而壞事。","uses":["too many cooks spoil the broth"],"ans":"Too many cooks spoil the broth."},{"id":"c4","sit":"你說你爸是家裡的萬能修理先生。","uses":["Mr. Fix-It"],"ans":"My dad is a real Mr. Fix-It."}]},"s08e14":{"title":"Heavy is the Head","lede":"Phil 的投資失敗了；Gloria 想幫 Claire 辦豪華生日派對，偏偏 Claire 正在公司裡砍預算；Cam 因為小時候的陰影，死都不肯做 MRI。","stories":[{"id":"dunphy","name":"公司與投資","who":"Claire · Phil","plot":"Phil 投資失利，Claire 當老闆得做出艱難的決定。","items":[{"p":"money pit","zh":"錢坑","scene":"Phil 的投資變成一直燒錢的坑。","en":"That old house turned into a money pit.","tr":"那間老房子變成了一個錢坑。","tip":"<b>用法：</b>常指一直要花錢修的房子、車子。","th":3,"lv":2},{"p":"heavy is the head that wears the crown","zh":"戴皇冠的人頭最重","scene":"Claire 當老闆壓力很大。","en":"Being the boss isn't easy. Heavy is the head that wears the crown.","tr":"當老闆不容易，位子越高壓力越大。","tip":"<b>來源：</b>改寫自莎士比亞《亨利四世》。","th":3,"lv":2},{"p":"trim the fat","zh":"刪減多餘開支","scene":"Claire 必須幫公司瘦身。","en":"The company needs to trim the fat.","tr":"公司需要刪掉多餘的開支。","tip":"<b>畫面：</b>把肉上多餘的肥肉切掉。","th":3,"lv":2},{"p":"make the hard call","zh":"做艱難的決定","scene":"Claire 得決定要砍哪些東西。","en":"As a leader, you have to make the hard calls.","tr":"身為領導者，你得做艱難的決定。",
