":"Phil · Claire · Luke","plot":"Phil 和 Claire 互相較勁，Luke 去見院長。","items":[{"p":"game on","zh":"來吧、比賽開始","scene":"夫妻倆正式開戰。","en":"You think you can beat me? Game on!","tr":"你以為你贏得了我？來吧！","tip":"<b>用法：</b>接受挑戰時說。","th":7,"lv":2},{"p":"put one's best foot forward","zh":"拿出最好的表現","scene":"Luke 想在院長面前表現好。","en":"It's your first day. Put your best foot forward.","tr":"第一天上班，拿出最好的表現。","tip":"<b>用法：</b>面試、初次見面常用。","th":6,"lv":2},{"p":"sweet-talk","zh":"甜言蜜語說服","scene":"Luke 想說服院長。","en":"He sweet-talked his mom into buying him a new phone.","tr":"他用甜言蜜語說服媽媽買新手機給他。","tip":"<b>用法：</b>sweet-talk someone into something。","th":10,"lv":2},{"p":"dean's list","zh":"院長嘉獎名單","scene":"學業優秀才會上榜。","en":"She made the dean's list three semesters in a row.","tr":"她連續三學期上了院長名單。","tip":"<b>文化：</b>美國大學成績優異的榮譽。","th":3,"lv":2}]}],"prompts":["你曾經說服過別人做一件事嗎（用 make a case for、sweet-talk、seal the deal）","你被警察攔下來過嗎（用 pull someone over、lights and sirens、ride-along）","你在重要場合會怎麼表現（用 put one's best foot forward、game on、a hard sell）"],"challenges":[{"id":"c1","sit":"你說你騎車被警察攔下來。","uses":["pull someone over"],"ans":"A cop pulled me over."},{"id":"c2","sit":"朋友明天第一天上班，你叫他拿出最好的表現。","uses":["put one's best foot forward"],"ans":"Put your best foot forward."},{"id":"c3","sit":"健身房的朋友說要跟你比臥推，你說來吧。","uses":["game on"],"ans":"Game on!"},{"id":"c4","sit":"你說你用甜言蜜語說服媽媽讓你出去玩。","uses":["sweet-talk"],"ans":"I sweet-talked my mom into letting me go out."}]},"s09e20":{"title":"Mother!","lede":"DeDe 突然來訪，讓 Mitchell 和 Cam 重新思考她對他們生活的影響；Phil、Luke、Alex 和 Haley 各自有壞消息要告訴 Claire，大家搶著在她每月做完 spa、心情最放鬆的那一小段時間開口。","stories":[{"id":"mitch","name":"DeDe 來訪","who":"Mitchell · Cameron · DeDe","plot":"DeDe 突然來訪，兩人發現她的影響有多大。","items":[{"p":"drop in unannounced","zh":"不請自來","scene":"DeDe 沒說一聲就出現了。","en":"My aunt likes to drop in unannounced.","tr":"我阿姨很喜歡不打招呼就跑來。","tip":"<b>用法：</b>drop in 是順道拜訪。","th":2,"lv":1},{"p":"toxic","zh":"有毒的、負能量的","scene":"兩人覺得這段關係不太健康。","en":"I had to leave that toxic workplace.","tr":"我必須離開那個很有毒的工作環境。","tip":"<b>用法：</b>toxic relationship、toxic friend。","th":9,"lv":1},{"p":"bring out the worst in someone","zh":"讓某人變得很差勁","scene":"DeDe 一來，大家都變得很糟。","en":"Stress brings out the worst in me.","tr":"壓力會讓我變得很差勁。","tip":"<b>反義：</b>bring out the best in someone。","th":9,"lv":2},{"p":"suck the life out of","zh":"讓人精疲力盡","scene":"跟 DeDe 相處讓人好累。","en":"This job is sucking the life out of me.","tr":"這份工作快把我榨乾了。","tip":"<b>語氣：</b>很口語、很誇張。","th":4,"lv":2}]},{"id":"dunphy","name":"搶著報壞消息","who":"Phil · Luke · Alex · Haley · Claire","plot":"大家都有壞消息，搶著在 Claire 最放鬆的時候說。","items":[{"p":"window of opportunity","zh":"機會的時機窗口","scene":"Claire 做完 spa 最放鬆的那段時間。","en":"We have a small window of opportunity.","tr":"我們只有一小段機會。","tip":"<b>用法：</b>強調時機有限。","th":10,"lv":2},{"p":"soften the blow","zh":"減輕打擊","scene":"大家想讓壞消息聽起來沒那麼糟。","en":"I bought her flowers to soften the blow.","tr":"我買花給她，讓壞消息沒那麼難受。","tip":"<b>畫面：</b>讓打下來的那一拳軟一點。","th":6,"lv":2},{"p":"in a good mood","zh":"心情好","scene":"趁 Claire 心情好時說。","en":"Ask him now. He's in a good mood.","tr":"現在去問他，他心情很好。","tip":"<b>反義：</b>in a bad mood。","th":4,"lv":1},{"p":"draw straws","zh":"抽籤決定","scene":"大家搶著決定誰先說。","en":"Let's draw straws to see who goes first.","tr":"我們抽籤看誰先。","tip":"<b>用法：</b>抽到短的那根就要做。","th":10,"lv":2},{"p":"get it over with","zh":"趕快做完了事","scene":"壞消息乾脆一次說完。","en":"Let's just get it over with.","tr":"我們就趕快了結吧。","tip":"<b>用法：</b>面對不想做的事。","th":10,"lv":1},{"p":"dibs","zh":"我先、我要了","scene":"每個人都搶著先說。","en":"Dibs on the front seat!","tr":"前座是我的！","tip":"<b>用法：</b>call dibs 搶先預約。","th":7,"lv":2}]}],"prompts":["你家有人會不請自來嗎（用 drop in unannounced、toxic、suck the life out of）","你都怎麼跟爸媽說壞消息（用 soften the blow、in a good mood、window of opportunity）","你會怎麼決定誰去做大家不想做的事（用 draw straws、get it over with、dibs）"],"challenges":[{"id":"c1","sit":"要打掃廁所，你說我們抽籤決定。","uses":["draw straws"],"ans":"Let's draw straws."},{"id":"c2","sit":"你說趕快打完預防針了事。","uses":["get it over with"],"ans":"Let's just get it over with."},{"id":"c3","sit":"收假搭車，你說前座是你的。","uses":["dibs"],"ans":"Dibs on the front seat!"},{"id":"c4","sit":"你說等老闆心情好時再去問加薪的事。","uses":["in a good mood"],"ans":"Let's ask him when he's in a good mood."}]},"s09e21":{"title":"The Escape","lede":"Haley 見了 Arvin 的父母，結果很不順，讓她跑去跟所有前男友重新聯絡；全家到安養院探望 Jay 那個難搞的姊姊 Becky，想把陳年舊帳算清楚；Jay、Claire 和 Mitchell 搶著吸引 Becky 的注意，Phil、Cam 和 Gloria 則被困在安養院的地下室。","stories":[{"id":"kids","name":"Haley 與前任們","who":"Haley · Arvin","plot":"見家長不順利，Haley 跑去聯絡前男友們。","items":[{"p":"go south","zh":"變糟","scene":"見家長的過程不太順。","en":"The dinner went south when we started talking politics.","tr":"一聊到政治，晚餐就變調了。","tip":"<b>同義：</b>go downhill。","th":9,"lv":2},{"p":"rekindle","zh":"重燃","scene":"Haley 想跟前任重新聯繫。","en":"They rekindled their friendship after ten years.","tr":"他們十年後重拾友誼。","tip":"<b>搭配：</b>rekindle a romance / friendship。","th":1,"lv":2},{"p":"go back to one's ex","zh":"回頭找前任","scene":"Haley 跑去聯絡前男友們。","en":"Don't go back to your ex. He hurt you.","tr":"別回頭找前任，他傷過你。","tip":"<b>用法：</b>感情建議很常聽到。","th":1,"lv":1}]},{"id":"jay","name":"探望 Becky","who":"Jay · Claire · Mitchell · Becky","plot":"全家去安養院看 Becky，想把舊帳算清楚。","items":[{"p":"nursing home","zh":"安養院","scene":"大家去安養院探望 Becky。","en":"My grandpa lives in a nursing home.","tr":"我阿公住在安養院。","tip":"<b>延伸：</b>retirement home 退休社區。","th":2,"lv":1},{"p":"settle old scores","zh":"算舊帳","scene":"大家想把陳年舊帳了結。","en":"He came back to town to settle old scores.","tr":"他回來就是要算舊帳。","tip":"<b>用法：</b>score 在這裡是「帳」。","th":5,"lv":2},{"p":"vie for attention","zh":"爭寵","scene":"三人搶著吸引 Becky 的注意。","en":"The kids are always vying for their mom's attention.","tr":"孩子們總是搶著要媽媽注意。","tip":"<b>發音：</b>vie 唸 vai。","th":5,"lv":2},{"p":"let bygones be bygones","zh":"過去的就讓它過去","scene":"也許該放下過去了。","en":"It was years ago. Let bygones be bygones.","tr":"那是好幾年前的事了，就讓它過去吧。","tip":"<b>用法：</b>勸人放下恩怨。","th":6,"lv":2}]},{"id":"dunphy","name":"被困地下室","who":"Phil · Cameron · Gloria","plot":"三人被困在安養院的地下室。","items":[{"p":"escape room","zh":"密室逃脫","scene":"地下室像密室逃脫一樣。","en":"We did an escape room for her birthday.","tr":"我們幫她慶生去玩密室逃脫。","tip":"<b>用法：</b>近年很流行的團體遊戲。","th":8,"lv":1},{"p":"locked in","zh":"被鎖在裡面","scene":"三人出不去了。","en":"I got locked in the bathroom at the gas station.","tr":"我被鎖在加油站的廁所裡。","tip":"<b>反義：</b>locked out 被鎖在外面。","th":8,"lv":1},{"p":"a way out","zh":"出路","scene":"三人拼命找出口。","en":"We need to find a way out of here.","tr":"我們得找出路離開這裡。","tip":"<b>用法：</b>也比喻解決困境的方法。","th":10,"lv":1}]}],"prompts":["你有沒有回頭聯絡過以前的朋友（用 rekindle、go back to one's ex、go south）","你家有什麼陳年舊帳嗎（用 settle old scores、let bygones be bygones、vie for attention）","你玩過密室逃脫或被困住過嗎（用 escape room、locked in、a way out）"],"challenges":[{"id":"c1","sit":"你說你被鎖在打工餐廳的倉庫裡。","uses":["locked in"],"ans":"I got locked in the storage room."},{"id":"c2","sit":"朋友吵架很久了，你勸他們過去的就讓它過去。","uses":["let bygones be bygones"],"ans":"Let bygones be bygones."},{"id":"c3","sit":"你說你阿嬤住在安養院。","uses":["nursing home"],"ans":"My grandma lives in a nursing home."},{"id":"c4","sit":"你約大學朋友週末去玩密室逃脫。","uses":["escape room"],"ans":"Let's do an escape room."}]},"s09e22":{"title":"Clash of Swords","lede":"第九季最終集，Mitchell 偷偷跟 Phil 溜去英雄動漫展；Gloria 幫 Joe 辦了恐龍主題派對，結果隔壁的死對頭辦了更盛大的派對，把她的派對搶光風頭。","stories":[{"id":"mitch","name":"動漫展","who":"Mitchell · Phil","plot":"Mitchell 偷偷跟 Phil 跑去動漫展。","items":[{"p":"comic con","zh":"動漫展","scene":"兩人偷跑去展場。","en":"We dressed up as superheroes for Comic Con.","tr":"我們打扮成超級英雄去動漫展。","tip":"<b>文化：</b>San Diego Comic-Con 是最有名的。","th":8,"lv":2},{"p":"cosplay","zh":"角色扮演","scene":"會場一堆人在扮角色。","en":"She spent months making her cosplay costume.","tr":"她花了好幾個月做 cosplay 的服裝。","tip":"<b>來源：</b>costume + play。","th":8,"lv":1},{"p":"geek out","zh":"宅起來、超興奮地聊","scene":"兩人一到會場就超興奮。","en":"We geeked out over the new Star Wars trailer.","tr":"我們看到星際大戰新預告就超興奮。","tip":"<b>同義：</b>nerd out。","th":8,"lv":2},{"p":"inner child","zh":"內在小孩","scene":"兩人找回小時候的熱情。","en":"Going to Disneyland brings out my inner child.","tr":"去迪士尼會喚醒我的內在小孩。","tip":"<b>搭配：</b>bring out one's inner child。","th":9,"lv":2}]},{"id":"jay","name":"恐龍派對","who":"Gloria · Joe · 鄰居","plot":"Gloria 的恐龍派對被隔壁更大的派對比下去。","items":[{"p":"outshine","zh":"搶光彩、勝過","scene":"隔壁的派對更勝一籌。","en":"The younger sister outshines everyone at school.","tr":"妹妹在學校比誰都出色。","tip":"<b>畫面：</b>比別人更閃亮。","th":5,"lv":2},{"p":"outdo","zh":"超越、贏過","scene":"死對頭硬要辦得更大。","en":"She always tries to outdo her neighbors.","tr":"她總是想贏過鄰居。","tip":"<b>延伸：</b>outdo oneself 表現超越以往。","th":5,"lv":2},{"p":"go head to head","zh":"正面對決","scene":"兩個派對正面交鋒。","en":"The two teams will go head to head in the final.","tr":"兩隊將在決賽正面對決。","tip":"<b>用法：</b>比賽、商業競爭常用。","th":5,"lv":2},{"p":"it's on","zh":"開戰了","scene":"Gloria 決定要拼了。","en":"You want a fight? Oh, it's on!","tr":"你想吵架？好，開戰了！","tip":"<b>語氣：</b>準備接受挑戰時的狠話。","th":7,"lv":2},{"p":"steal the spotlight","zh":"搶走鎂光燈","scene":"隔壁的派對搶走了所有目光。","en":"The puppy stole the spotlight at the wedding.","tr":"小狗在婚禮上搶走了所有目光。","tip":"<b>同義：</b>steal the show。","th":9,"lv":2},{"p":"the bigger the better","zh":"越大越好","scene":"大家都在比誰的派對大。","en":"When it comes to pizza, the bigger the better.","tr":"說到披薩，越大越好。","tip":"<b>句型：</b>the + 比較級, the + 比較級。","th":7,"lv":1}]}],"prompts":["你去過動漫展或玩過 cosplay 嗎（用 comic con、cosplay、geek out）","什麼事會喚醒你的內在小孩（用 inner child、the bigger the better、steal the spotlight）","你跟誰暗中較勁過嗎（用 outdo、outshine、go head to head）"],"challenges":[{"id":"c1","sit":"你說你跟室友一看到新遊戲預告就超興奮。","uses":["geek out"],"ans":"We geeked out over the new game trailer."},{"id":"c2","sit":"隔壁連也在準備莒光日比賽，你說開戰了。","uses":["it's on"],"ans":"Oh, it's on!"},{"id":"c3","sit":"你說去遊樂園會喚醒你的內在小孩。","uses":["inner child"],"ans":"Amusement parks bring out my inner child."},{"id":"c4","sit":"你說朋友的狗在生日派對上搶走了所有目光。","uses":["steal the spotlight"],"ans":"My friend's dog stole the spotlight."}]},"s10e01":{"title":"I Love a Parade","lede":"第十季開場，全家聚在一起看國慶遊行，Jay 擔任遊行總司儀；Haley 跟 Arvin 道別時，Dylan 突然出現，場面超尷尬；Phil 和 Luke 贏了熱狗大胃王比賽；Alex 教 Claire 什麼叫「宅在家充電」；Mitchell 和 Cam 拍影片給在坐牢的 Pam，讓她看 Cal 新學會的本事。","stories":[{"id":"jay","name":"國慶遊行","who":"Jay · 全家","plot":"Jay 擔任七月四日遊行的總司儀。","items":[{"p":"grand marshal","zh":"遊行總司儀","scene":"Jay 被選為遊行領隊。","en":"The mayor was the grand marshal of the parade.","tr":"市長擔任遊行的總司儀。","tip":"<b>文化：</b>美國遊行由名人擔任的榮譽領隊。","th":8,"lv":2},{"p":"Independence Day","zh":"美國獨立紀念日","scene":"七月四日的國慶遊行。","en":"We watch fireworks every Independence Day.","tr":"我們每年國慶都看煙火。","tip":"<b>用法：</b>口語常直接說 the Fourth of July。","th":8,"lv":1}]},{"id":"dunphy","name":"大胃王與宅在家","who":"Phil · Luke · Claire · Alex","plot":"Phil 和 Luke 參加熱狗大胃王比賽；Alex 教 Claire 宅在家。","items":[{"p":"eating contest","zh":"大胃王比賽","scene":"父子挑戰吃熱狗。","en":"He won a hot dog eating contest.","tr":"他贏了熱狗大胃王比賽。","tip":"<b>延伸：</b>competitive eater 大胃王選手。","th":8,"lv":1},{"p":"stuff one's face","zh":"狂吃","scene":"兩人拼命塞熱狗。","en":"I stuffed my face at the buffet.","tr":"我在吃到飽餐廳狂吃。","tip":"<b>語氣：</b>很口語，帶點不雅的可愛感。","th":8,"lv":2},{"p":"cocooning","zh":"宅在家充電","scene":"Alex 教 Claire 躲在家裡放鬆。","en":"This weekend I'm cocooning with Netflix and snacks.","tr":"這週末我要宅在家看 Netflix 吃零食。","tip":"<b>畫面：</b>像蠶寶寶躲在繭裡。","th":8,"lv":2},{"p":"homebody","zh":"宅宅、愛待在家的人","scene":"Alex 是喜歡待在家的人。","en":"I'm a homebody. I'd rather stay in than go out.","tr":"我很宅，寧可待在家也不想出門。","tip":"<b>反義：</b>party animal 派對動物。","th":9,"lv":1}]},{"id":"kids","name":"Haley 的道別","who":"Haley · Arvin · Dylan","plot":"Haley 跟 Arvin 道別時，Dylan 回來了。","items":[{"p":"awkward goodbye","zh":"尷尬的道別","scene":"前任突然出現，道別變得很尷尬。","en":"We had an awkward goodbye at the airport.","tr":"我們在機場尷尬地道別。","tip":"<b>用法：</b>awkward 是口語超常用的「尷尬」。","th":4,"lv":1},{"p":"come back into someone's life","zh":"重新出現在某人生命中","scene":"Dylan 又回來了。","en":"My old friend came back into my life last year.","tr":"我的老朋友去年又重新出現在我生活中。","tip":"<b>用法：</b>常用在感情、友情。","th":2,"lv":1}]},{"id":"mitch","name":"給 Pam 的影片","who":"Mitchell · Cameron · Cal · Pam","plot":"兩人拍影片給坐牢的 Pam，讓她看 Cal 學會的新本事。","items":[{"p":"behind bars","zh":"在坐牢","scene":"Pam 正在監獄裡。","en":"He spent two years behind bars.","tr":"他坐了兩年牢。","tip":"<b>畫面：</b>在鐵欄杆後面。","th":5,"lv":2},{"p":"first steps","zh":"第一步","scene":"兩人拍下 Cal 的成長。","en":"We filmed the baby's first steps.","tr":"我們拍下寶寶跨出的第一步。","tip":"<b>用法：</b>也比喻新事業的開始。","th":2,"lv":1}]}],"prompts":["你喜歡宅在家還是出去玩（用 homebody、cocooning、stuff one's face）","你們家怎麼過節或看遊行（用 Independence Day、grand marshal、eating contest）","有沒有老朋友重新出現在你生命中（用 come back into someone's life、awkward goodbye、first steps）"],"challenges":[{"id":"c1","sit":"連假第一天，你說你要宅在家充電。","uses":["cocooning"],"ans":"I'm cocooning this weekend."},{"id":"c2","sit":"你說你很宅，寧可待在家。","uses":["homebody"],"ans":"I'm a homebody."},{"id":"c3","sit":"你說你在吃到飽餐廳狂吃。","uses":["stuff one's face"],"ans":"I stuffed my face at the buffet."},{"id":"c4","sit":"你說他因為詐騙坐了三年牢。","uses":["behind bars"],"ans":"He spent three years behind bars."}]},"s10e02":{"title":"Kiss and Tell","lede":"全家被叫到 Jay 家卻不知道為什麼；Phil 想用《辣妹過招》的招數惡整 Jay，反而被 Jay 整回去；Manny 回來說他有個加拿大女友，Gloria 懷疑他其實是在掩飾什麼，結果女友是真的；Haley 對親 Dylan 這件事很糾結，Dylan 告白說他一直愛著她，Haley 也發現自己有同樣的感覺。","stories":[{"id":"jay","name":"惡作劇大戰","who":"Phil · Jay","plot":"Phil 想整 Jay，結果被整回去。","items":[{"p":"pull a prank","zh":"惡作劇","scene":"Phil 想捉弄 Jay。","en":"We pulled a prank on our teacher on April Fools' Day.","tr":"我們愚人節捉弄了老師。","tip":"<b>用法：</b>pull a prank on someone。","th":8,"lv":1},{"p":"joke's on you","zh":"被整的是你","scene":"Jay 反將一軍。","en":"You thought you tricked me? Joke's on you!","tr":"你以為你整到我？被整的是你！","tip":"<b>用法：</b>反過來嘲笑想整人的人。","th":7,"lv":2}]},{"id":"kids","name":"Manny 的女友","who":"Manny · Gloria","plot":"Manny 說他有個加拿大女友，Gloria 半信半疑。","items":[{"p":"imaginary girlfriend","zh":"想像中的女友","scene":"大家懷疑女友是編的。","en":"He says she lives in Canada. Sounds like an imaginary girlfriend.","tr":"他說她住加拿大，聽起來像幻想出來的女友。","tip":"<b>語氣：</b>取笑別人的女友是編的。","th":1,"lv":2},{"p":"mother knows best","zh":"媽媽最懂","scene":"Gloria 覺得自己最了解兒子。","en":"Trust me, mother knows best.","tr":"相信我，媽媽最懂。","tip":"<b>語氣：</b>媽媽常拿來說服孩子。","th":2,"lv":1},{"p":"gut feeling","zh":"直覺","scene":"Gloria 憑感覺猜兒子的心思。","en":"I have a gut feeling something's wrong.","tr":"我直覺覺得有什麼不對勁。","tip":"<b>用法：</b>gut 是肚子，直覺從肚子裡來。","th":4,"lv":1},{"p":"keep an open mind","zh":"保持開放的心態","scene":"大家要放下成見。","en":"Try the food. Keep an open mind.","tr":"試試看這道菜，保持開放的心態。","tip":"<b>用法：</b>面對新事物時常說。","th":6,"lv":1}]},{"id":"dunphy","name":"Haley 與 Dylan","who":"Haley · Dylan","plot":"Haley 跟 Dylan 接吻後很糾結，兩人終於說出真心話。","items":[{"p":"kiss and tell","zh":"到處講感情的私事","scene":"集名，親了要不要說出去。","en":"A gentleman never kisses and tells.","tr":"紳士不會到處講自己的感情私事。","tip":"<b>用法：</b>多用在否定句。","th":1,"lv":2},{"p":"first kiss","zh":"初吻","scene":"兩人的感情回到起點。","en":"Do you remember your first kiss?","tr":"你還記得你的初吻嗎？","tip":"<b>用法：</b>也指一段關係的第一個吻。","th":1,"lv":1},{"p":"pour one's heart out","zh":"掏心掏肺說出來","scene":"Dylan 對 Haley 告白。","en":"She poured her heart out to me last night.","tr":"她昨晚對我掏心掏肺。","tip":"<b>用法：</b>pour one's heart out to someone。","th":4,"lv":2},{"p":"feel the same way","zh":"有同樣的感覺","scene":"Haley 發現自己也還愛他。","en":"I like you. Do you feel the same way?","tr":"我喜歡你，你也有同樣的感覺嗎？","tip":"<b>用法：</b>告白、討論意見時都能用。","th":1,"lv":1}]}],"prompts":["你惡作劇過別人嗎（用 pull a prank、joke's on you、gut feeling）","你媽媽總是最懂你嗎（用 mother knows best、keep an open mind、imaginary girlfriend）","你曾經對誰掏心掏肺過嗎（用 pour one's heart out、feel the same way、first kiss）"],"challenges":[{"id":"c1","sit":"愚人節同事想整你，結果被你整回去。","uses":["joke's on you"],"ans":"Joke's on you!"},{"id":"c2","sit":"你說你直覺覺得今天會緊急集合。","uses":["gut feeling"],"ans":"I have a gut feeling we'll have an emergency drill today."},{"id":"c3","sit":"你跟喜歡的人告白，問她有沒有同樣的感覺。","uses":["feel the same way"],"ans":"Do you feel the same way?"},{"id":"c4","sit":"朋友不敢吃臭豆腐，你叫他保持開放的心態。","uses":["keep an open mind"],"ans":"Keep an open mind."}]},"s10e03":{"title":"A Sketchy Area","lede":"Phil 獲邀到 Luke 的大學教書，Luke 一開始很反對，直到他進了橄欖球隊才鬆口；Claire 和 Jay 為了 EZRA Visions 的合作案起衝突；Cam 幫 Mitchell 對付一個把他畫得很醜的法庭素描畫家；Gloria 和 Alex 聊 Joe 第一天上學的事。","stories":[{"id":"dunphy","name":"爸爸來學校","who":"Phil · Luke","plot":"Phil 要來 Luke 的大學教書，Luke 很不想。","items":[{"p":"the last thing I need","zh":"我最不需要的就是……","scene":"Luke 最不想要爸爸出現在學校。","en":"The last thing I need is my dad in my class.","tr":"我最不需要的就是我爸來上我的課。","tip":"<b>用法：</b>表示「這只會讓事情更糟」。","th":7,"lv":1},{"p":"in someone's shadow","zh":"活在某人的陰影下","scene":"Luke 不想一直被當成 Phil 的兒子。","en":"He grew up in his brother's shadow.","tr":"他從小活在哥哥的陰影下。","tip":"<b>用法：</b>被比較、被掩蓋光芒。","th":2,"lv":2},{"p":"team spirit","zh":"團隊精神","scene":"Luke 進了球隊後開始投入。","en":"Our team has great team spirit.","tr":"我們隊的團隊精神很好。","tip":"<b>用法：</b>也指學校的向心力 school spirit。","th":3,"lv":1}]},{"id":"jay","name":"合作案","who":"Jay · Claire","plot":"父女倆為了公司的合作案意見不合。","items":[{"p":"silent partner","zh":"不參與經營的合夥人","scene":"Jay 和 Claire 對角色分工有不同想法。","en":"My uncle is a silent partner in the restaurant.","tr":"我叔叔是這家餐廳的隱名股東。","tip":"<b>用法：</b>只出資不管事的合夥人。","th":3,"lv":2},{"p":"see things differently","zh":"看法不同","scene":"父女倆的意見不一樣。","en":"We just see things differently. That's okay.","tr":"我們只是看法不同，那沒關係。","tip":"<b>語氣：</b>比 disagree 更溫和。","th":5,"lv":1}]},{"id":"mitch","name":"法庭素描","who":"Mitchell · Cameron · 素描畫家","plot":"法庭素描把 Mitchell 畫得很難看，Cam 幫他討回公道。","items":[{"p":"unflattering","zh":"不好看的、不討喜的","scene":"素描把 Mitchell 畫得很醜。","en":"That's a really unflattering photo of me.","tr":"那張照片把我拍得好醜。","tip":"<b>反義：</b>flattering 讓人看起來好看的。","th":9,"lv":2},{"p":"bad angle","zh":"角度不好","scene":"Mitchell 覺得是角度的問題。","en":"Don't take a picture from below. It's a bad angle.","tr":"別從下面拍，那個角度不好看。","tip":"<b>延伸：</b>my good side 我好看的那一邊。","th":8,"lv":1},{"p":"a fair shake","zh":"公平的對待","scene":"Mitchell 想被公平地呈現。","en":"Everyone deserves a fair shake.","tr":"每個人都該被公平對待。","tip":"<b>搭配：</b>get / give someone a fair shake。","th":9,"lv":2}]},{"id":"kids","name":"Joe 上學","who":"Gloria · Alex · Joe","plot":"Gloria 和 Alex 聊 Joe 第一天上學。","items":[{"p":"first day of school","zh":"開學第一天","scene":"Joe 要開始上學了。","en":"I cried on my first day of school.","tr":"我開學第一天哭了。","tip":"<b>延伸：</b>first day of work 上班第一天。","th":3,"lv":1},{"p":"big kid","zh":"大孩子","scene":"Joe 長大了要上學了。","en":"You're going to school now. You're a big kid!","tr":"你要上學了，是大孩子了！","tip":"<b>用法：</b>大人鼓勵小孩時常說。","th":2,"lv":1}]}],"prompts":["你有活在誰的陰影下過嗎（用 in someone's shadow、the last thing I need、team spirit）","你跟家人或同事看法不同時怎麼辦（用 see things differently、a fair shake、silent partner）","你有被拍得很醜的照片嗎（用 unflattering、bad angle、first day of school）"],"challenges":[{"id":"c1","sit":"你說你最不需要的就是假日被叫回營。","uses":["the last thing I need"],"ans":"The last thing I need is to get called back on my day off."},{"id":"c2","sit":"你說那張照片把你拍得好醜。","uses":["unflattering"],"ans":"That's a really unflattering photo."},{"id":"c3","sit":"你說你和爸爸只是看法不同。","uses":["see things differently"],"ans":"We just see things differently."},{"id":"c4","sit":"你說你們連的團隊精神很好。","uses":["team spirit"],"ans":"Our company has great team spirit."}]},"s10e04":{"title":"Torn Between Two Lovers","lede":"Haley 在 Arvin 和 Dylan 之間拿不定主意；Manny 回大學了，女友 Sherry 卻繼續住在 Jay 家，Jay 一直抱怨，Gloria 卻假裝沒事；Mitchell 和 Cam 跟同事 Trent 吃飯，結果 Trent 說的「孩子」是狗，Lily 和 Cal 又打破了值錢的東西，Mitchell 最後沒拿到工作；Haley 選了 Dylan。","stories":[{"id":"kids","name":"兩個男人","who":"Haley · Arvin · Dylan","plot":"Haley 在兩人之間掙扎，最後選了 Dylan。","items":[{"p":"torn between","zh":"在……之間掙扎","scene":"Haley 拿不定主意。","en":"I'm torn between two jobs.","tr":"我在兩份工作之間掙扎。","tip":"<b>用法：</b>torn between A and B。","th":10,"lv":1},{"p":"follow one's heart","zh":"跟著心走","scene":"Haley 最後選了內心想要的。","en":"Don't worry about money. Follow your heart.","tr":"別擔心錢，跟著你的心走。","tip":"<b>同義：</b>listen to your heart。","th":6,"lv":1},{"p":"go with one's gut","zh":"相信直覺","scene":"Haley 決定照感覺選。","en":"When in doubt, go with your gut.","tr":"拿不定主意時，就相信直覺。","tip":"<b>對比：</b>gut feeling 是「直覺」這個名詞。","th":6,"lv":1}]},{"id":"jay","name":"賴著不走的 Sherry","who":"Jay · Gloria · Sherry","plot":"Sherry 住在家裡不走，Jay 抱怨，Gloria 假裝沒事。","items":[{"p":"wear out one's welcome","zh":"待到讓人嫌","scene":"Sherry 住太久了。","en":"I don't want to wear out my welcome, so I'll leave tomorrow.","tr":"我不想待到讓人嫌，所以明天就走。","tip":"<b>用法：</b>客人待太久讓主人受不了。","th":2,"lv":2},{"p":"everything's fine","zh":"一切都很好（其實不好）","scene":"Gloria 嘴上說沒事。","en":"Everything's fine! Totally fine!","tr":"一切都很好！完全沒事！","tip":"<b>語氣：</b>說太快、說兩次，通常表示一點都不好。","th":7,"lv":1},{"p":"play nice","zh":"好好相處、別鬧","scene":"Jay 和 Gloria 要跟 Sherry 和平共處。","en":"Play nice with your cousin.","tr":"跟你表弟好好玩，別吵架。","tip":"<b>用法：</b>大人叮嚀小孩，也可用在大人身上。","th":2,"lv":1}]},{"id":"mitch","name":"Trent 的晚餐","who":"Mitchell · Cameron · Trent · Lily · Cal","plot":"晚餐出包，Mitchell 也沒拿到工作。","items":[{"p":"fur baby","zh":"毛小孩","scene":"Trent 的孩子其實是狗。","en":"My fur babies are waiting for me at home.","tr":"我的毛小孩在家等我。","tip":"<b>用法：</b>把寵物當孩子的說法。","th":8,"lv":1},{"p":"high-profile case","zh":"備受矚目的案子","scene":"Trent 手上有大案子。","en":"The lawyer is working on a high-profile case.","tr":"那位律師正在處理一件備受矚目的案子。","tip":"<b>用法：</b>high-profile 是「高知名度」。","th":3,"lv":2},{"p":"you break it, you buy it","zh":"打破要賠","scene":"小孩打破了貴重物品。","en":"Careful with that vase. You break it, you buy it.","tr":"小心那個花瓶，打破要賠。","tip":"<b>文化：</b>店家常見標語。","th":8,"lv":2},{"p":"pass someone over","zh":"略過某人不選","scene":"Mitchell 沒被選上。","en":"I was passed over for the promotion again.","tr":"我又沒被選上升職。","tip":"<b>用法：</b>常用被動 be passed over。","th":3,"lv":2}]}],"prompts":["你曾經在兩個選擇之間掙扎嗎（用 torn between、follow one's heart、go with one's gut）","你家有客人住太久過嗎（用 wear out one's welcome、play nice、everything's fine）","你養過寵物嗎（用 fur baby、you break it, you buy it、pass someone over）"],"challenges":[{"id":"c1","sit":"你在兩個工作機會之間掙扎。","uses":["torn between"],"ans":"I'm torn between two jobs."},{"id":"c2","sit":"你說明天就回去，不想待到讓人嫌。","uses":["wear out one's welcome"],"ans":"I don't want to wear out my welcome."},{"id":"c3","sit":"出差回來，你說你的毛小孩在家等你。","uses":["fur baby"],"ans":"My fur baby is waiting for me at home."},{"id":"c4","sit":"你又沒被選上升組長。","uses":["pass someone over"],"ans":"I got passed over for the promotion again."}]},"s10e05":{"title":"Good Grief","lede":"萬聖節這天，Jay、Mitchell 和 Claire 得知 DeDe 跟著婦女團旅行時，在睡夢中過世了；全家人一起面對這份失去，每個人的反應都不一樣。","stories":[{"id":"family","name":"面對失去","who":"Jay · Mitchell · Claire · 全家","plot":"DeDe 過世，大家用自己的方式消化這份悲傷。","items":[{"p":"in one's sleep","zh":"在睡夢中","scene":"DeDe 在睡夢中安詳離開。","en":"She passed peacefully in her sleep.","tr":"她在睡夢中安詳離世。","tip":"<b>用法：</b>說人過世時比較溫和的說法。","th":8,"lv":1},{"p":"condolences","zh":"慰問、哀悼","scene":"大家向家屬致意。","en":"Please accept my condolences.","tr":"請節哀。","tip":"<b>用法：</b>my condolences 是正式又常用的慰問語。","th":6,"lv":1},{"p":"the five stages of grief","zh":"悲傷的五個階段","scene":"每個人走在不同的階段。","en":"Denial is the first of the five stages of grief.","tr":"否認是悲傷五階段的第一個。","tip":"<b>延伸：</b>否認、憤怒、討價還價、沮喪、接受。","th":4,"lv":2},{"p":"closure","zh":"釋懷、了結","scene":"大家需要好好畫下句點。","en":"I need closure before I can move on.","tr":"我需要一個了結才能往前走。","tip":"<b>用法：</b>分手、失去之後很常用。","th":4,"lv":2},{"p":"mixed emotions","zh":"五味雜陳","scene":"Mitchell 和 Claire 的心情很複雜。","en":"I have mixed emotions about leaving.","tr":"要離開了，我心情五味雜陳。","tip":"<b>同義：</b>mixed feelings。","th":4,"lv":1},{"p":"complicated relationship","zh":"複雜的關係","scene":"兩人跟媽媽的關係本來就很複雜。","en":"I have a complicated relationship with my father.","tr":"我跟我爸的關係很複雜。","tip":"<b>用法：</b>it's complicated 也很常用。","th":2,"lv":1},{"p":"celebration of life","zh":"生命紀念會","scene":"大家用溫暖的方式紀念她。","en":"Instead of a funeral, we had a celebration of life.","tr":"我們沒有辦喪禮，而是辦了一場生命紀念會。","tip":"<b>文化：</b>美國越來越多人用這種方式送別。","th":8,"lv":2},{"p":"lean on each other","zh":"互相扶持","scene":"家人在難過時彼此依靠。","en":"We need to lean on each other right now.","tr":"這時候我們要互相扶持。","tip":"<b>用法：</b>lean on someone 依靠某人。","th":6,"lv":1},{"p":"take time to process","zh":"需要時間消化","scene":"大家都需要時間接受。","en":"It's a lot of news. I need to take time to process it.","tr":"這消息太多了，我需要時間消化。","tip":"<b>用法：</b>process 這裡是「消化情緒、資訊」。","th":4,"lv":1},{"p":"gone too soon","zh":"走得太早","scene":"大家覺得她走得太突然。","en":"He was only forty. Gone too soon.","tr":"他才四十歲，走得太早了。","tip":"<b>用法：</b>紀念文、社群貼文很常見。","th":6,"lv":2}]}],"prompts":["你怎麼面對難過的事（用 take time to process、lean on each other、closure）","你跟家裡某個人的關係複雜嗎（用 complicated relationship、mixed emotions、gone too soon）","你會怎麼安慰失去家人的朋友（用 condolences、in one's sleep、celebration of life）"],"challenges":[{"id":"c1","sit":"朋友的阿公過世，你跟他說請節哀。","uses":["condolences"],"ans":"Please accept my condolences."},{"id":"c2","sit":"你要退伍了，心情五味雜陳。","uses":["mixed emotions"],"ans":"I have mixed emotions."},{"id":"c3","sit":"朋友剛分手，你說他需要一個了結。","uses":["closure"],"ans":"He needs closure."},{"id":"c4","sit":"你說這消息太突然，你需要時間消化。","uses":["take time to process"],"ans":"I need to take time to process it."}]},"s10e06":{"title":"On the Same Paige","lede":"如果學生 Paige 退出，Phil 的房地產課就會被取消，他說服她留下來，卻擔心自己是不是誤導了她；Jay 可能在不知不覺中跟同學的媽媽調情，於是開始劃清界線；Mitchell 決定要多參與 Cam 的活動。","stories":[{"id":"dunphy","name":"Phil 的學生","who":"Phil · Paige","plot":"Phil 說服 Paige 留下來，卻擔心給了她錯誤的期待。","items":[{"p":"stick with it","zh":"堅持下去","scene":"Phil 鼓勵 Paige 別放棄。","en":"Learning English is hard, but stick with it.","tr":"學英文很難，但要堅持下去。","tip":"<b>同義：</b>hang in there、don't give up。","th":6,"lv":1},{"p":"mislead","zh":"誤導","scene":"Phil 擔心自己說得太好聽。","en":"The ad was misleading.","tr":"那個廣告有誤導性。","tip":"<b>形容詞：</b>misleading。","th":10,"lv":1},{"p":"give someone false hope","zh":"給人錯誤的希望","scene":"Phil 怕 Paige 期待太高。","en":"I don't want to give you false hope.","tr":"我不想給你錯誤的希望。","tip":"<b>用法：</b>說壞消息前常用。","th":10,"lv":1}]},{"id":"jay","name":"劃清界線","who":"Jay · 同學的媽媽","plot":"Jay 好像不小心在調情，決定保持距離。","items":[{"p":"innocent fun","zh":"無傷大雅的玩樂","scene":"Jay 以為只是普通聊天。","en":"It's just innocent fun. Nobody gets hurt.","tr":"只是無傷大雅的玩樂，沒人會受傷。","tip":"<b>用法：</b>常用來替自己辯解。","th":9,"lv":1},{"p":"lead someone on","zh":"給人錯誤暗示","scene":"Jay 怕對方誤會。","en":"If you're not interested, don't lead her on.","tr":"如果你沒興趣，就別給她錯誤的暗示。","tip":"<b>用法：</b>感情裡讓人以為有機會。","th":1,"lv":2},{"p":"set boundaries","zh":"設定界線","scene":"Jay 決定劃清界線。","en":"It's important to set boundaries with your coworkers.","tr":"跟同事設定界線很重要。","tip":"<b>用法：</b>心理、人際關係常用。","th":2,"lv":1},{"p":"keep someone at arm's length","zh":"跟某人保持距離","scene":"Jay 跟對方保持距離。","en":"She keeps everyone at arm's length.","tr":"她跟每個人都保持距離。","tip":"<b>畫面：</b>伸直手臂那麼遠的距離。","th":9,"lv":2}]},{"id":"mitch","name":"多陪 Cam","who":"Mitchell · Cameron","plot":"Mitchell 決定多參與 Cam 喜歡的事。","items":[{"p":"take an interest in","zh":"對……感興趣","scene":"Mitchell 開始關心 Cam 的活動。","en":"My dad started taking an interest in my music.","tr":"我爸開始關心我的音樂。","tip":"<b>用法：</b>表示主動關心、參與。","th":8,"lv":1},{"p":"make an effort","zh":"努力、用心","scene":"Mitchell 想多花點心思。","en":"At least he's making an effort.","tr":"至少他有在努力。","tip":"<b>用法：</b>make an effort to + 動詞。","th":10,"lv":1},{"p":"it's a two-way street","zh":"雙方都要付出","scene":"感情要兩個人一起經營。","en":"Respect is a two-way street.","tr":"尊重是互相的。","tip":"<b>畫面：</b>雙向道，兩邊都要有車流。","th":2,"lv":2}]}],"prompts":["你有什麼想放棄但堅持下來的事（用 stick with it、make an effort、give someone false hope）","你會怎麼跟不熟的人劃清界線（用 set boundaries、keep someone at arm's length、lead someone on）","你會關心另一半或朋友的興趣嗎（用 take an interest in、it's a two-way street、innocent fun）"],"challenges":[{"id":"c1","sit":"朋友說剛學吉他手指好痛想放棄，你叫他堅持下去。","uses":["stick with it"],"ans":"Stick with it."},{"id":"c2","sit":"你說尊重是互相的。","uses":["it's a two-way street"],"ans":"Respect is a two-way street."},{"id":"c3","sit":"你說至少他有在努力。","uses":["make an effort"],"ans":"At least he's making an effort."},{"id":"c4","sit":"你說跟同事設定界線很重要。","uses":["set boundaries"],"ans":"It's important to set boundaries."}]},"s10e07":{"title":"Did the Chicken Cross the Road?","lede":"Mitchell 忘了 Cam 最愛的鄉村歌歌詞，Cam 怪罪他，還養了一隻雞想找回自己的根；Alex 應徵政府工作要做家庭訪談，全家都表現過頭；Haley 跟 Dylan 約會時出了意外，發現自己懷孕了；Luke 幫忙心理學課的實驗；Jay 和 Gloria 對 Joe 的教育意見不同。","stories":[{"id":"mitch","name":"Cam 的雞","who":"Cameron · Mitchell","plot":"歌詞忘光的 Mitchell 被怪罪，Cam 養雞找回鄉下的根。","items":[{"p":"blank on","zh":"突然想不起來","scene":"Mitchell 忘了歌詞。","en":"I blanked on her name.","tr":"我突然想不起她的名字。","tip":"<b>用法：</b>go blank 腦袋一片空白。","th":8,"lv":2},{"p":"reconnect with one's roots","zh":"找回自己的根","scene":"Cam 想回到鄉下的生活。","en":"I went back to my hometown to reconnect with my roots.","tr":"我回老家找回自己的根。","tip":"<b>用法：</b>roots 是出身、文化背景。","th":2,"lv":2},{"p":"country boy","zh":"鄉下男孩","scene":"Cam 骨子裡是農村男孩。","en":"I'm a country boy at heart.","tr":"我骨子裡是個鄉下男孩。","tip":"<b>對比：</b>city boy 城市男孩。","th":9,"lv":1}]},{"id":"dunphy","name":"Alex 的政府工作","who":"Alex · 全家","plot":"政府工作要做家庭訪談，大家表現過頭。","items":[{"p":"background check","zh":"身家調查","scene":"Alex 的工作要查背景。","en":"All new employees must pass a background check.","tr":"所有新員工都要通過身家調查。","tip":"<b>用法：</b>應徵、買槍、租屋都可能要做。","th":3,"lv":1},{"p":"security clearance","zh":"安全許可","scene":"政府工作需要安全審查。","en":"You need security clearance to enter this building.","tr":"進這棟大樓需要安全許可。","tip":"<b>用法：</b>軍方、政府機關常見，當兵的你可能聽過。","th":3,"lv":2},{"p":"a deer in the headlights","zh":"嚇呆了","scene":"家人被問話時很慌。","en":"When the teacher called on me, I was like a deer in the headlights.","tr":"老師點我時，我整個嚇呆了。","tip":"<b>畫面：</b>鹿被車燈照到僵住不動。","th":4,"lv":2},{"p":"guinea pig","zh":"白老鼠","scene":"Luke 當心理學實驗的受試者。","en":"I'm not going to be your guinea pig.","tr":"我才不要當你的白老鼠。","tip":"<b>用法：</b>被拿來測試新東西的人。","th":10,"lv":2}]},{"id":"kids","name":"Haley 的意外","who":"Haley · Dylan","plot":"約會出了意外後，Haley 發現自己懷孕了。","items":[{"p":"a happy accident","zh":"美麗的意外","scene":"意外懷孕帶來新生命。","en":"Our son was a happy accident.","tr":"我們的兒子是個美麗的意外。","tip":"<b>用法：</b>沒計畫但結果很好的事。","th":9,"lv":2}]},{"id":"jay","name":"Joe 的教育","who":"Jay · Gloria · Joe","plot":"夫妻倆對 Joe 的教育有不同意見。","items":[{"p":"private school","zh":"私立學校","scene":"兩人在討論 Joe 要念哪裡。","en":"They sent their kids to private school.","tr":"他們把孩子送去念私立學校。","tip":"<b>反義：</b>public school 公立學校。","th":3,"lv":1},{"p":"nature versus nurture","zh":"先天還是後天","scene":"兩人爭論孩子是天生還是被教出來的。","en":"Is talent nature versus nurture?","tr":"天分是天生的還是後天培養的？","tip":"<b>用法：</b>心理學常討論的老問題。","th":2,"lv":2}]}],"prompts":["你有沒有回老家找回自己的根（用 reconnect with one's roots、country boy、blank on）","你被長官點名時會嚇呆嗎（用 a deer in the headlights、background check、security clearance）","你覺得才能是天生還是後天（用 nature versus nurture、private school、guinea pig）"],"challenges":[{"id":"c1","sit":"你上台報告突然想不起下一句。","uses":["blank on"],"ans":"I blanked on the next line."},{"id":"c2","sit":"你說你骨子裡是個鄉下男孩。","uses":["country boy"],"ans":"I'm a country boy at heart."},{"id":"c3","sit":"學美髮的朋友想拿你練剪頭髮，你說你才不要當白老鼠。","uses":["guinea pig"],"ans":"I'm not your guinea pig."},{"id":"c4","sit":"你說進這間辦公室需要安全許可。","uses":["security clearance"],"ans":"You need security clearance to get in."}]},"s10e08":{"title":"Kids These Days","lede":"Haley 努力適應懷孕，又擔心升職會逼她放棄夢想工作；Alex 找 Gloria 而不是 Claire 陪她去買性感衣服；Cam 的球隊說他太不敏感；Mitchell 和 Phil 去星際大戰大會的路上，誤闖一間同志酒吧，還發現了 Gil Thorpe 的秘密。","stories":[{"id":"kids","name":"Haley 與 Alex","who":"Haley · Alex · Gloria","plot":"Haley 擔心工作，Alex 找 Gloria 陪她改造造型。","items":[{"p":"kids these days","zh":"現在的年輕人喔","scene":"集名，長輩對年輕人的感嘆。","en":"Kids these days are always on their phones.","tr":"現在的小孩整天都在滑手機。","tip":"<b>語氣：</b>帶點老人家的抱怨。","th":7,"lv":1},{"p":"dream job","zh":"夢想工作","scene":"Haley 很怕失去喜歡的工作。","en":"Being a pilot is my dream job.","tr":"當機師是我的夢想工作。","tip":"<b>用法：</b>理想中的工作。","th":3,"lv":1},{"p":"move up","zh":"升遷、往上爬","scene":"升職可能改變一切。","en":"She moved up quickly in the company.","tr":"她在公司升得很快。","tip":"<b>用法：</b>move up in the world 社會地位提高。","th":3,"lv":1},{"p":"dress to impress","zh":"盛裝打扮想讓人驚豔","scene":"Alex 想換個性感造型。","en":"It's a job interview. Dress to impress.","tr":"這是面試，穿得體面一點。","tip":"<b>用法：</b>派對、面試的邀請常寫。","th":8,"lv":1},{"p":"shopping spree","zh":"瘋狂購物","scene":"Alex 跟 Gloria 去大採購。","en":"She went on a shopping spree after getting paid.","tr":"她領薪水後去瘋狂購物。","tip":"<b>搭配：</b>go on a shopping spree。","th":8,"lv":1}]},{"id":"mitch","name":"球隊與酒吧","who":"Cameron · Mitchell · Phil","plot":"Cam 被球員說不敏感；Mitchell 和 Phil 在去大會的路上發現別人的秘密。","items":[{"p":"insensitive","zh":"不顧他人感受的","scene":"球員覺得 Cam 說話不夠體貼。","en":"That joke was really insensitive.","tr":"那個笑話真的很不顧別人感受。","tip":"<b>反義：</b>sensitive、considerate。","th":9,"lv":1},{"p":"snowflake","zh":"玻璃心的人","scene":"年輕世代被說太容易受傷。","en":"Don't be such a snowflake. It was just a joke.","tr":"別那麼玻璃心，只是開玩笑。","tip":"<b>注意：</b>帶有政治或貶意，要小心使用。","th":9,"lv":2},{"p":"pit stop","zh":"中途停一下","scene":"兩人在路上停了一站。","en":"Let's make a quick pit stop for gas.","tr":"我們停一下加油吧。","tip":"<b>來源：</b>賽車進維修站。","th":8,"lv":2},{"p":"a secret life","zh":"不為人知的一面","scene":"兩人發現了別人的秘密生活。","en":"It turns out my quiet neighbor has a secret life as a DJ.","tr":"原來我那個安靜的鄰居私下是個 DJ。","tip":"<b>用法：</b>have / lead a secret life。","th":10,"lv":2},{"p":"eye-opener","zh":"讓人大開眼界的事","scene":"這趟路讓兩人看到新世界。","en":"Living abroad was a real eye-opener.","tr":"住在國外真的讓我大開眼界。","tip":"<b>用法：</b>學到意想不到的事。","th":9,"lv":2}]}],"prompts":["你的夢想工作是什麼（用 dream job、move up、kids these days）","你有過大開眼界的經驗嗎（用 eye-opener、a secret life、pit stop）","你領薪水會去瘋狂購物嗎（用 shopping spree、dress to impress、insensitive）"],"challenges":[{"id":"c1","sit":"你說當兵真的讓你大開眼界。","uses":["eye-opener"],"ans":"The army was a real eye-opener."},{"id":"c2","sit":"你們開車回家，你說停一下休息站上廁所。","uses":["pit stop"],"ans":"Let's make a quick pit stop."},{"id":"c3","sit":"你說你領到薪水後去瘋狂購物。","uses":["shopping spree"],"ans":"I went on a shopping spree."},{"id":"c4","sit":"長輩看到你一直滑手機，說現在的年輕人喔。","uses":["kids these days"],"ans":"Kids these days!"}]},"s10e09":{"title":"Putting Down Roots","lede":"DeDe 的丈夫 Jerry 來交付她的遺物：Mitchell 收到一盆裝著她骨灰的植物，Claire 拿到她的舊車；Jerry 教 Jay「永遠同意 Gloria 就對了」；Phil 開車時聽到太多 Claire 年輕時的往事；Haley 找到一個她照顧不來的舊娃娃，擔心起自己的懷孕，於是告訴了 Alex 和 Luke。","stories":[{"id":"mitch","name":"遺物","who":"Mitchell · Claire · Jerry","plot":"Jerry 帶來 DeDe 的遺物，兩人各自收到紀念品。","items":[{"p":"personal belongings","zh":"個人物品","scene":"Jerry 帶來 DeDe 的東西。","en":"Please take all your personal belongings with you.","tr":"請帶走您所有的個人物品。","tip":"<b>用法：</b>飛機、捷運廣播常聽到。","th":8,"lv":1},{"p":"inherit","zh":"繼承","scene":"兩人繼承了媽媽的東西。","en":"I inherited this watch from my grandfather.","tr":"這支錶是我從阿公那裡繼承的。","tip":"<b>用法：</b>也能說遺傳特徵。","th":2,"lv":1},{"p":"put down roots","zh":"落地生根","scene":"集名，把骨灰種在植物裡。","en":"After moving around a lot, we finally put down roots here.","tr":"搬了很多次家後，我們終於在這裡定居。","tip":"<b>畫面：</b>植物把根扎進土裡。","th":8,"lv":2}]},{"id":"jay","name":"Jerry 的建議","who":"Jay · Jerry","plot":"Jerry 教 Jay 婚姻相處的「秘訣」。","items":[{"p":"happy wife, happy life","zh":"老婆開心，生活就順心","scene":"Jerry 的婚姻哲學。","en":"Just say yes. Happy wife, happy life.","tr":"說好就對了，老婆開心生活就順。","tip":"<b>文化：</b>美國很流行的押韻俗語。","th":1,"lv":2},{"p":"yes, dear","zh":"好的，親愛的","scene":"永遠同意就對了。","en":"\"Take out the trash.\" \"Yes, dear.\"","tr":"「去倒垃圾。」「好的，親愛的。」","tip":"<b>語氣：</b>老公敷衍又乖巧的經典回答。","th":7,"lv":1}]},{"id":"dunphy","name":"Claire 的過去","who":"Phil · Claire","plot":"Phil 開車時聽到太多 Claire 的往事。","items":[{"p":"in one's wild days","zh":"年輕荒唐的時候","scene":"Claire 年輕時很瘋。","en":"In my wild days, I stayed out until sunrise.","tr":"我年輕瘋狂的時候都玩到天亮。","tip":"<b>同義：</b>in one's younger days。","th":9,"lv":2},{"p":"more than I needed to know","zh":"知道太多了","scene":"Phil 聽到不想聽的細節。","en":"Okay, that's more than I needed to know.","tr":"好了，我不需要知道那麼多。","tip":"<b>用法：</b>比 TMI 更完整的說法。","th":7,"lv":1},{"p":"the good old days","zh":"美好的往日","scene":"大家懷念以前。","en":"We talked about the good old days in high school.","tr":"我們聊起高中那段美好時光。","tip":"<b>語氣：</b>帶點懷舊。","th":9,"lv":1}]},{"id":"kids","name":"Haley 的擔心","who":"Haley · Alex · Luke","plot":"Haley 照顧不好一個娃娃，開始擔心自己能不能當媽媽。","items":[{"p":"maternal instinct","zh":"母性本能","scene":"Haley 擔心自己沒有媽媽的天性。","en":"She has a strong maternal instinct.","tr":"她有很強的母性本能。","tip":"<b>延伸：</b>paternal 父親的。","th":2,"lv":2},{"p":"baby fever","zh":"很想生小孩","scene":"寶寶的話題一直圍繞著大家。","en":"Seeing her nephew gave her baby fever.","tr":"看到姪子讓她好想生小孩。","tip":"<b>用法：</b>看到別人小孩時突然很想要。","th":2,"lv":2}]}],"prompts":["你有從長輩那裡繼承什麼東西嗎（用 inherit、personal belongings、put down roots）","你年輕瘋狂的時候做過什麼（用 in one's wild days、the good old days、more than I needed to know）","你同意「老婆開心生活就順」嗎（用 happy wife, happy life、yes, dear、maternal instinct）"],"challenges":[{"id":"c1","sit":"你說這支錶是你從阿公那裡繼承的。","uses":["inherit"],"ans":"I inherited this watch from my grandpa."},{"id":"c2","sit":"朋友講他前女友的事講太細，你說你不需要知道那麼多。","uses":["more than I needed to know"],"ans":"That's more than I needed to know."},{"id":"c3","sit":"你們聊起高中的美好時光。","uses":["the good old days"],"ans":"We talked about the good old days."},{"id":"c4","sit":"你媽叫你倒垃圾，你回好的親愛的。","uses":["yes, dear"],"ans":"Yes, dear."}]},"s10e10":{"title":"Stuck in a Moment","lede":"一份從哥倫比亞寄來的禮物，讓 Jay 和 Gloria 家爬滿蜘蛛，聖誕節只好改到 Claire 家過；Phil 借走聖誕樹去辦看屋活動，Claire 沒說就搬回來；Mitchell 和 Cam 想從購物中心聖誕老人那裡打聽 Cal 想要什麼，偏偏那個聖誕老人曾被 Mitchell 告上法庭；Haley 和 Dylan 不知道怎麼告訴 Claire 寶寶的事，Alex 壓力大到頭髮變白；消息公開後，除了 Phil 和 Claire，大家都很興奮。","stories":[{"id":"jay","name":"蜘蛛之亂","who":"Jay · Gloria","plot":"家裡爬滿蜘蛛，聖誕節只好搬去 Claire 家。","items":[{"p":"infestation","zh":"蟲害、蟲滿為患","scene":"家裡被蜘蛛佔領了。","en":"The kitchen has a cockroach infestation.","tr":"廚房蟑螂成災。","tip":"<b>搭配：</b>a(n) + 蟲名 + infestation。","th":8,"lv":2},{"p":"change of plans","zh":"計畫有變","scene":"聖誕節換地方過。","en":"Change of plans. We're meeting at my place.","tr":"計畫有變，改在我家碰面。","tip":"<b>用法：</b>口語常省略 There's a。","th":10,"lv":1},{"p":"deck the halls","zh":"布置過節","scene":"大家趕著布置聖誕節。","en":"Let's deck the halls before the guests arrive!","tr":"客人來之前趕快布置吧！","tip":"<b>來源：</b>聖誕歌 Deck the Halls。","th":8,"lv":2}]},{"id":"mitch","name":"購物中心聖誕老人","who":"Mitchell · Cameron · Cal · 聖誕老人","plot":"兩人想從聖誕老人那裡打聽 Cal 的願望。","items":[{"p":"naughty or nice","zh":"乖不乖","scene":"聖誕老人會看小孩乖不乖。","en":"Santa knows if you've been naughty or nice.","tr":"聖誕老人知道你有沒有乖。","tip":"<b>文化：</b>聖誕歌 Santa Claus Is Coming to Town 的歌詞。","th":8,"lv":2},{"p":"hold it against someone","zh":"對某人記恨","scene":"聖誕老人可能還記得 Mitchell 告他。","en":"I was rude to him once. I hope he doesn't hold it against me.","tr":"我曾經對他很沒禮貌，希望他別記恨。","tip":"<b>用法：</b>I won't hold it against you 我不會怪你。","th":5,"lv":2}]},{"id":"dunphy","name":"寶寶的消息","who":"Haley · Dylan · Alex · Phil · Claire","plot":"大家不知道怎麼告訴 Claire，Alex 壓力大到白頭髮。","items":[{"p":"drop a hint","zh":"暗示","scene":"大家想慢慢透露。","en":"I dropped a hint about what I want for my birthday.","tr":"我暗示了我生日想要什麼。","tip":"<b>用法：</b>drop hints 一直暗示。","th":10,"lv":1},{"p":"spill it","zh":"快說","scene":"大家逼對方說出秘密。","en":"I know you have news. Spill it!","tr":"我知道你有消息，快說！","tip":"<b>同義：</b>spill the beans。","th":7,"lv":2},{"p":"go gray","zh":"頭髮變白","scene":"Alex 壓力大到頭髮白了。","en":"My dad went gray in his thirties.","tr":"我爸三十幾歲頭髮就白了。","tip":"<b>用法：</b>go 在這裡是「變成」。","th":8,"lv":1},{"p":"take it well","zh":"平靜接受","scene":"Phil 和 Claire 不太能接受。","en":"I told my mom I failed, and she didn't take it well.","tr":"我告訴我媽我沒過，她不太能接受。","tip":"<b>用法：</b>常用否定 didn't take it well。","th":4,"lv":1},{"p":"stuck in the past","zh":"活在過去","scene":"有人還停在以前。","en":"Stop living in the past. You're stuck in the past.","tr":"別再活在過去了。","tip":"<b>用法：</b>比喻無法接受改變。","th":9,"lv":1}]}],"prompts":["你家裡有過蟲害嗎（用 infestation、change of plans、deck the halls）","你會怎麼跟家人說一個大消息（用 drop a hint、spill it、take it well）","你有活在過去的時候嗎（用 stuck in the past、go gray、hold it against someone）"],"challenges":[{"id":"c1","sit":"原本要去墾丁改成去台中，你說計畫有變。","uses":["change of plans"],"ans":"Change of plans."},{"id":"c2","sit":"同事好像有八卦，你叫他快說。","uses":["spill it"],"ans":"Spill it!"},{"id":"c3","sit":"你說租的套房蟑螂成災。","uses":["infestation"],"ans":"My apartment has a cockroach infestation."},{"id":"c4","sit":"你跟媽媽說抽到外島，她不太能接受。","uses":["take it well"],"ans":"She didn't take it well."}]},"s10e11":{"title":"A Moving Day","lede":"Haley 和 Dylan 搬進新公寓，Claire 和 Phil 懷疑他們能不能自己過日子；Haley 發現她懷的是雙胞胎；Pam 提早出獄，對 Mitchell 懷恨在心；Manny 的女友一直使喚他，Gloria 要 Jay 出面處理。","stories":[{"id":"dunphy","name":"搬新家","who":"Haley · Dylan · Phil · Claire","plot":"小倆口搬家，爸媽很擔心；Haley 發現懷了雙胞胎。","items":[{"p":"first apartment","zh":"第一間公寓","scene":"兩人搬進自己的家。","en":"My first apartment was tiny, but I loved it.","tr":"我的第一間公寓很小，但我很愛。","tip":"<b>用法：</b>人生里程碑之一。","th":8,"lv":1},{"p":"sink or swim","zh":"自生自滅、全靠自己","scene":"爸媽擔心他們撐不撐得住。","en":"There's no training. It's sink or swim.","tr":"沒有訓練，全靠自己。","tip":"<b>畫面：</b>被丟進水裡，不是沉就是游。","th":10,"lv":2},{"p":"have what it takes","zh":"有本事","scene":"Phil 和 Claire 懷疑他們的能力。","en":"Do you have what it takes to be a pilot?","tr":"你有本事當機師嗎？","tip":"<b>用法：</b>問能力、條件夠不夠。","th":6,"lv":1},{"p":"double trouble","zh":"雙倍麻煩","scene":"雙胞胎要來了。","en":"Twins? That's double trouble!","tr":"雙胞胎？那是雙倍麻煩！","tip":"<b>用法：</b>常用來調侃雙胞胎。","th":9,"lv":2},{"p":"run in the family","zh":"家族遺傳","scene":"雙胞胎可能是遺傳。","en":"Twins run in my family.","tr":"我家族有雙胞胎的遺傳。","tip":"<b>用法：</b>主詞是特徵，例如 Bad eyesight runs in the family。","th":2,"lv":1}]},{"id":"mitch","name":"Pam 出獄","who":"Mitchell · Cameron · Pam","plot":"Pam 提早出獄，還記恨 Mitchell。","items":[{"p":"early release","zh":"提早出獄","scene":"Pam 比預期早出來。","en":"He got an early release for good behavior.","tr":"他因為表現良好提早出獄。","tip":"<b>延伸：</b>on parole 假釋中。","th":5,"lv":2},{"p":"out for revenge","zh":"想報仇","scene":"Pam 好像要找 Mitchell 算帳。","en":"Watch out. She's out for revenge.","tr":"小心，她想報仇。","tip":"<b>搭配：</b>be out for + 目標。","th":5,"lv":1}]},{"id":"jay","name":"Manny 的女友","who":"Jay · Gloria · Manny","plot":"Manny 被女友使喚，Gloria 要 Jay 出面。","items":[{"p":"bossy","zh":"愛使喚人的","scene":"Manny 的女友很強勢。","en":"My older sister is so bossy.","tr":"我姊超愛使喚人。","tip":"<b>用法：</b>boss 當名詞是老闆，bossy 是愛管人。","th":9,"lv":1},{"p":"whipped","zh":"被女友吃得死死的","scene":"Manny 什麼都聽女友的。","en":"He does everything she says. He's so whipped.","tr":"她說什麼他都做，被吃得死死的。","tip":"<b>注意：</b>朋友間開玩笑用，不太禮貌。","th":1,"lv":2},{"p":"step in","zh":"出面介入","scene":"Gloria 要 Jay 出面處理。","en":"The teacher had to step in and stop the fight.","tr":"老師只好出面阻止打架。","tip":"<b>用法：</b>比 interfere 中性。","th":10,"lv":1}]}],"prompts":["你的第一個家或房間是什麼樣子（用 first apartment、sink or swim、have what it takes）","你家有什麼家族遺傳嗎（用 run in the family、double trouble、early release）","你身邊有很愛使喚人的人嗎（用 bossy、whipped、step in）"],"challenges":[{"id":"c1","sit":"新單位沒人教你，你說全靠自己。","uses":["sink or swim"],"ans":"It's sink or swim."},{"id":"c2","sit":"你說你家族有近視的遺傳。","uses":["run in the family"],"ans":"Bad eyesight runs in my family."},{"id":"c3","sit":"兩個客人在店裡吵起來，店長只好出面。","uses":["step in"],"ans":"The manager had to step in."},{"id":"c4","sit":"你說你姊超愛使喚人。","uses":["bossy"],"ans":"My older sister is so bossy."}]},"s10e12":{"title":"Blasts from the Past","lede":"Phil 和 Claire 見到 Dylan 的媽媽，對她那套當爺爺奶奶的想法不太認同；Jay 和 Gloria 發現兩人的叔叔當年在一場戰爭中分屬敵對陣營；Mitchell 在 Lily 房間發現一本不該出現的雜誌，後來才知道事情跟他想的不一樣。","stories":[{"id":"dunphy","name":"Dylan 的媽媽","who":"Phil · Claire · Dylan 的媽媽","plot":"兩家人第一次見面，教養觀念完全不同。","items":[{"p":"parenting style","zh":"教養方式","scene":"兩家對帶小孩的想法不一樣。","en":"My parents had a very strict parenting style.","tr":"我爸媽的教養方式很嚴格。","tip":"<b>延伸：</b>helicopter parenting、free-range parenting。","th":2,"lv":1},{"p":"hippie","zh":"嬉皮","scene":"Dylan 的媽媽很隨性自在。","en":"His mom is a total hippie. She doesn't wear shoes.","tr":"他媽媽是個十足的嬉皮，連鞋都不穿。","tip":"<b>文化：</b>六〇年代反主流文化的人。","th":9,"lv":2},{"p":"free spirit","zh":"自由奔放的人","scene":"她不受規矩拘束。","en":"She's a free spirit who travels the world alone.","tr":"她是個自由奔放的人，一個人環遊世界。","tip":"<b>語氣：</b>多半是正面評價。","th":9,"lv":1},{"p":"natural birth","zh":"自然產","scene":"她對生產有很多主張。","en":"She wants a natural birth with no painkillers.","tr":"她想自然產，不用止痛藥。","tip":"<b>對比：</b>C-section 剖腹產。","th":2,"lv":2}]},{"id":"jay","name":"敵對陣營","who":"Jay · Gloria","plot":"兩人發現雙方的叔叔當年在戰場上是敵人。","items":[{"p":"on opposite sides","zh":"站在對立的兩邊","scene":"兩個家族當年是敵人。","en":"Our grandfathers fought on opposite sides of the war.","tr":"我們的阿公在戰爭中是敵對的兩方。","tip":"<b>用法：</b>辯論、比賽、政治都能用。","th":5,"lv":1},{"p":"enemy lines","zh":"敵方陣線","scene":"叔叔們在戰場的兩端。","en":"The soldier was trapped behind enemy lines.","tr":"那名士兵被困在敵後。","tip":"<b>用法：</b>behind enemy lines 在敵後。","th":5,"lv":2},{"p":"history repeats itself","zh":"歷史會重演","scene":"兩人好像也有一點小戰爭。","en":"Look at you two arguing. History repeats itself.","tr":"看你們兩個在吵，歷史真的會重演。","tip":"<b>用法：</b>說同樣的事又發生了。","th":9,"lv":1}]},{"id":"mitch","name":"Lily 房間的雜誌","who":"Mitchell · Cameron · Lily","plot":"Mitchell 發現一本雜誌，以為是 Lily 的，結果另有隱情。","items":[{"p":"assume the worst","zh":"往最壞的方向想","scene":"Mitchell 一下子就想歪了。","en":"My mom always assumes the worst when I don't answer.","tr":"我沒接電話，我媽總是往最壞的方向想。","tip":"<b>反義：</b>give someone the benefit of the doubt。","th":4,"lv":1},{"p":"explain oneself","zh":"解釋清楚","scene":"Mitchell 要 Lily 說明。","en":"You'd better explain yourself.","tr":"你最好解釋清楚。","tip":"<b>語氣：</b>帶點質問。","th":5,"lv":1},{"p":"it's not what you think","zh":"不是你想的那樣","scene":"雜誌的來源跟他想的不同。","en":"Wait, it's not what you think!","tr":"等等，不是你想的那樣！","tip":"<b>用法：</b>被誤會時的經典台詞。","th":7,"lv":1}]}],"prompts":["你爸媽的教養方式是怎樣的（用 parenting style、free spirit、hippie）","你家有什麼歷史會重演的事嗎（用 history repeats itself、on opposite sides、enemy lines）","你被誤會過嗎（用 it's not what you think、assume the worst、explain oneself）"],"challenges":[{"id":"c1","sit":"你沒接電話，你媽就往最壞的方向想。","uses":["assume the worst"],"ans":"My mom always assumes the worst."},{"id":"c2","sit":"朋友看到你跟女生合照，你說不是你想的那樣。","uses":["it's not what you think"],"ans":"It's not what you think!"},{"id":"c3","sit":"你說你爸媽的教養方式很嚴格。","uses":["parenting style"],"ans":"My parents had a strict parenting style."},{"id":"c4","sit":"你說你們兄弟在選舉時站在對立的兩邊。","uses":["on opposite sides"],"ans":"We're on opposite sides."}]},"s10e13":{"title":"Whanex?","lede":"Jay 在公司被科技問題搞得很煩，員工又缺乏團隊合作，讓他很懷念以前；Cam 找 Alex、Manny、Haley 和 Luke 一起幫他準備對高中生演講「畢業後的人生」，但 Mitchell 的意見讓他很不安；Gloria、Phil 和 Joe 去試鏡一支「理想家庭」的購物中心廣告。","stories":[{"id":"jay","name":"公司的科技問題","who":"Jay","plot":"Jay 被科技和員工搞得很懷念以前。","items":[{"p":"tech support","zh":"技術支援","scene":"Jay 搞不定電腦系統。","en":"I called tech support three times today.","tr":"我今天打給技術支援三次了。","tip":"<b>延伸：</b>IT department 資訊部。","th":3,"lv":1},{"p":"user-friendly","zh":"好上手的","scene":"新系統一點都不好用。","en":"This app isn't very user-friendly.","tr":"這個 App 不太好上手。","tip":"<b>用法：</b>形容產品、設計很容易用。","th":9,"lv":1},{"p":"the way things used to be","zh":"以前的樣子","scene":"Jay 很懷念以前的做事方式。","en":"I miss the way things used to be.","tr":"我很懷念以前的樣子。","tip":"<b>語氣：</b>懷舊、有點感傷。","th":9,"lv":1}]},{"id":"mitch","name":"畢業後的人生","who":"Cameron · Mitchell · Alex · Manny · Haley · Luke","plot":"Cam 準備對高中生演講，年輕人們給意見。","items":[{"p":"adulting","zh":"當大人","scene":"畢業後要學著當大人。","en":"Paying bills, doing laundry... adulting is hard.","tr":"繳帳單、洗衣服……當大人好難。","tip":"<b>用法：</b>網路流行語，把 adult 當動詞。","th":8,"lv":2},{"p":"words of wisdom","zh":"人生忠告","scene":"Cam 想給學生一些智慧小語。","en":"Any words of wisdom before I start my new job?","tr":"我開始新工作前，有什麼忠告嗎？","tip":"<b>用法：</b>常用在畢業、婚禮致詞。","th":6,"lv":1},{"p":"life lessons","zh":"人生課題","scene":"大家分享自己學到的事。","en":"Failing taught me some important life lessons.","tr":"失敗教會我一些重要的人生課題。","tip":"<b>用法：</b>從經驗中學到的道理。","th":6,"lv":1},{"p":"real talk","zh":"說真的","scene":"年輕人說出真心話。","en":"Real talk, I'm worried about money.","tr":"說真的，我很擔心錢的問題。","tip":"<b>用法：</b>要開始講認真的話時放在句首。","th":7,"lv":2}]},{"id":"dunphy","name":"廣告試鏡","who":"Gloria · Phil · Joe","plot":"三人去試鏡購物中心的理想家庭廣告。","items":[{"p":"the perfect family","zh":"完美家庭","scene":"廣告要找理想的一家人。","en":"No such thing as the perfect family.","tr":"世界上沒有完美的家庭。","tip":"<b>用法：</b>常帶點諷刺。","th":2,"lv":1},{"p":"camera-ready","zh":"準備好上鏡","scene":"大家打扮得很上鏡。","en":"Give me five minutes to get camera-ready.","tr":"給我五分鐘準備上鏡。","tip":"<b>用法：</b>化妝、打扮後可以拍照的狀態。","th":8,"lv":2},{"p":"screen test","zh":"試鏡","scene":"三人去試鏡。","en":"She did a screen test for the movie.","tr":"她為那部電影試了鏡。","tip":"<b>對比：</b>audition 範圍更廣，也包含唱歌、舞蹈。","th":3,"lv":2}]}],"prompts":["你覺得當大人最難的是什麼（用 adulting、life lessons、real talk）","你會懷念以前的什麼（用 the way things used to be、tech support、user-friendly）","你有什麼人生忠告想給學弟（用 words of wisdom、the perfect family、camera-ready）"],"challenges":[{"id":"c1","sit":"你說繳帳單洗衣服，當大人好難。","uses":["adulting"],"ans":"Adulting is hard."},{"id":"c2","sit":"你問快離職的前輩有沒有什麼忠告。","uses":["words of wisdom"],"ans":"Any words of wisdom?"},{"id":"c3","sit":"你說這個 App 不太好上手。","uses":["user-friendly"],"ans":"This app isn't very user-friendly."},{"id":"c4","sit":"你跟朋友說真的，你很擔心畢業後找工作。","uses":["real talk"],"ans":"Real talk, I'm worried about finding a job."}]},"s10e14":{"title":"We Need to Talk About Lily","lede":"Cam 和 Mitchell 擔心 Lily 太內向，讓她去參加她最愛的網紅辦的派對，她卻一點都不興奮；Phil 想讓 Pepper 簽下房屋買賣合約；狗狗 Stella 要動個小手術，Jay 情緒潰堤；Bill 想找 Phil 和 Claire 談一個發明，Alex 和 Claire 卻以為他要求婚，想辦法阻止。","stories":[{"id":"mitch","name":"內向的 Lily","who":"Cameron · Mitchell · Lily","plot":"兩人想讓 Lily 開朗一點，帶她去網紅派對。","items":[{"p":"introvert","zh":"內向的人","scene":"Lily 比較安靜。","en":"I'm an introvert. Parties drain my energy.","tr":"我是內向的人，派對很耗我的能量。","tip":"<b>反義：</b>extrovert 外向的人。","th":9,"lv":1},{"p":"come out of one's shell","zh":"敞開心胸、變開朗","scene":"兩人希望 Lily 多跟人互動。","en":"She's finally coming out of her shell.","tr":"她終於開始變得開朗了。","tip":"<b>畫面：</b>從殼裡探出頭來。","th":9,"lv":2},{"p":"influencer","zh":"網紅","scene":"Lily 最愛的網紅辦派對。","en":"She's an influencer with a million followers.","tr":"她是擁有一百萬粉絲的網紅。","tip":"<b>延伸：</b>vlogger 影音部落客、YouTuber。","th":3,"lv":1},{"p":"unimpressed","zh":"不以為然","scene":"Lily 一點都不感興趣。","en":"The kids looked totally unimpressed.","tr":"孩子們看起來完全不覺得厲害。","tip":"<b>用法：</b>表情冷淡、不覺得了不起。","th":4,"lv":1}]},{"id":"dunphy","name":"合約 · 求婚？","who":"Phil · Pepper · Alex · Claire · Bill","plot":"Phil 想讓 Pepper 簽約；Alex 和 Claire 以為 Bill 要求婚。","items":[{"p":"sign on the dotted line","zh":"簽約","scene":"Phil 想讓對方正式簽字。","en":"Once you sign on the dotted line, there's no going back.","tr":"一旦簽了約，就沒有回頭路了。","tip":"<b>畫面：</b>合約上那條虛線。","th":3,"lv":2},{"p":"put a ring on it","zh":"求婚、定下來","scene":"大家以為 Bill 要求婚。","en":"If you love her, put a ring on it.","tr":"如果你愛她，就快點求婚。","tip":"<b>文化：</b>來自碧昂絲的歌 Single Ladies。","th":1,"lv":2},{"p":"nip it in the bud","zh":"及早阻止","scene":"兩人想在求婚前阻止。","en":"If he's lying, nip it in the bud.","tr":"如果他說謊，要及早制止。","tip":"<b>畫面：</b>在花苞階段就掐掉。","th":10,"lv":2}]},{"id":"jay","name":"Stella 的手術","who":"Jay · Stella","plot":"狗狗要動小手術，Jay 卻情緒很激動。","items":[{"p":"minor surgery","zh":"小手術","scene":"Stella 只是小手術。","en":"It's just minor surgery. She'll be home tomorrow.","tr":"只是小手術，她明天就能回家。","tip":"<b>反義：</b>major surgery 大手術。","th":8,"lv":1},{"p":"softie","zh":"心軟的人","scene":"硬漢 Jay 其實很心軟。","en":"He looks tough, but he's a big softie.","tr":"他看起來很兇，其實很心軟。","tip":"<b>同義：</b>softy、a big teddy bear。","th":9,"lv":2},{"p":"get choked up","zh":"哽咽","scene":"Jay 忍不住情緒激動。","en":"I got choked up during my best friend's wedding speech.","tr":"我在好朋友婚禮致詞時哽咽了。","tip":"<b>對比：</b>a lump in one's throat 偏重喉嚨卡住的感覺。","th":4,"lv":2}]}],"prompts":["你是內向還是外向的人（用 introvert、come out of one's shell、unimpressed）","你有沒有表面很兇其實很心軟的朋友（用 softie、get choked up、minor surgery）","你追蹤哪些網紅（用 influencer、sign on the dotted line、nip it in the bud）"],"challenges":[{"id":"c1","sit":"你說排球隊教練看起來很兇，其實很心軟。","uses":["softie"],"ans":"He's a big softie."},{"id":"c2","sit":"你說你是內向的人，派對很耗能量。","uses":["introvert"],"ans":"I'm an introvert."},{"id":"c3","sit":"你說阿嬤只是小手術，明天就能出院。","uses":["minor surgery"],"ans":"It's just minor surgery."},{"id":"c4","sit":"你說你在姊姊的婚禮上哽咽了。","uses":["get choked up"],"ans":"I got choked up at my sister's wedding."}]},"s10e15":{"title":"SuperShowerBabyBowl","lede":"Jay 的超級盃派對撞上了 Haley 的寶寶派對；Dylan 擔心永遠融入不了這個大家族，突然跑掉，大家只好出門找他；Cam 和 Jay 都以為對方忘了一起煮辣醬的約定；Mitchell 擔心一個提早出獄的人要找他報仇；Lily 跟朋友鬧翻；Manny 和 Phil 為了 Phil 在 Manny 電影裡的演技吵起來。","stories":[{"id":"jay","name":"撞期的派對","who":"Jay · Haley · Cameron","plot":"超級盃派對撞上寶寶派對，Cam 和 Jay 還為了辣醬鬧誤會。","items":[{"p":"Super Bowl Sunday","zh":"超級盃星期天","scene":"Jay 要辦看球派對。","en":"Everyone eats chicken wings on Super Bowl Sunday.","tr":"超級盃那天大家都吃雞翅。","tip":"<b>文化：</b>美國最大的電視運動節日。","th":8,"lv":2},{"p":"double-booked","zh":"撞期、重複預約","scene":"兩個派對同一天。","en":"Sorry, I'm double-booked that night.","tr":"抱歉，那晚我撞期了。","tip":"<b>用法：</b>行程、會議室、座位都能用。","th":10,"lv":1},{"p":"chili cook-off","zh":"辣醬比賽","scene":"Cam 和 Jay 約好要煮辣醬。","en":"He won first place at the chili cook-off.","tr":"他在辣醬比賽拿了第一。","tip":"<b>文化：</b>美國社區常見的烹飪比賽。","th":8,"lv":2}]},{"id":"kids","name":"找 Dylan","who":"Dylan · Haley · 全家","plot":"Dylan 怕融入不了這個家，突然跑掉了。","items":[{"p":"one of the family","zh":"家裡的一份子","scene":"Dylan 想被大家接納。","en":"You're one of the family now.","tr":"你現在是我們家的一份子了。","tip":"<b>用法：</b>歡迎新成員時說。","th":2,"lv":1},{"p":"falling out","zh":"鬧翻","scene":"Lily 跟朋友吵架了。","en":"They had a falling out over money.","tr":"他們因為錢的事鬧翻了。","tip":"<b>搭配：</b>have a falling out with someone。","th":5,"lv":2}]},{"id":"mitch","name":"出獄的人","who":"Mitchell · Cameron","plot":"Mitchell 擔心一個提早出獄的人要報仇。","items":[{"p":"watch one's back","zh":"小心提防","scene":"Mitchell 開始疑神疑鬼。","en":"Watch your back. He's not happy with you.","tr":"小心點，他對你不爽。","tip":"<b>用法：</b>也可以說 I've got your back 我挺你。","th":5,"lv":1},{"p":"paranoid","zh":"疑神疑鬼","scene":"Mitchell 擔心過頭了。","en":"You're being paranoid. Nobody is following you.","tr":"你想太多了，沒人在跟蹤你。","tip":"<b>用法：</b>口語指過度懷疑。","th":4,"lv":1}]},{"id":"dunphy","name":"Manny 的電影","who":"Manny · Phil","plot":"Manny 嫌 Phil 演得不好，兩人吵起來。","items":[{"p":"scene-stealer","zh":"搶戲的人","scene":"Phil 在片中太搶戲了。","en":"The dog was the real scene-stealer in that movie.","tr":"那部電影真正搶戲的是那隻狗。","tip":"<b>用法：</b>配角表現搶過主角。","th":9,"lv":2},{"p":"take direction","zh":"聽導演指示","scene":"Phil 不太聽 Manny 的指示。","en":"A good actor knows how to take direction.","tr":"好演員懂得聽導演的指示。","tip":"<b>用法：</b>也可以說工作上聽從指導。","th":3,"lv":2},{"p":"everyone's a critic","zh":"人人都是評論家","scene":"大家都有意見。","en":"Oh, everyone's a critic!","tr":"喔，每個人都是評論家呢！","tip":"<b>語氣：</b>被批評時半開玩笑地回嘴。","th":7,"lv":2}]}],"prompts":["你有遇過兩個活動撞期嗎（用 double-booked、Super Bowl Sunday、chili cook-off）","你跟朋友鬧翻過嗎（用 falling out、one of the family、paranoid）","你被批評時會怎麼回應（用 everyone's a critic、take direction、scene-stealer）"],"challenges":[{"id":"c1","sit":"朋友約你週六吃飯，你說那天撞期了。","uses":["double-booked"],"ans":"Sorry, I'm double-booked."},{"id":"c2","sit":"你跟新來的工讀生說，你現在是我們店的一份子了。","uses":["one of the family"],"ans":"You're one of the family now."},{"id":"c3","sit":"室友覺得有人在偷看他手機，你說他想太多了。","uses":["paranoid"],"ans":"You're being paranoid."},{"id":"c4","sit":"大家都在批評你煮的泡麵，你說人人都是評論家。","uses":["everyone's a critic"],"ans":"Everyone's a critic!"}]},"s10e16":{"title":"Red Alert","lede":"Haley 不把產前課當一回事，讓 Phil 很擔心，他跟 Luke 忙看屋活動時還失眠了；Claire 打算當上公司執行長，Jay 很不是滋味，最後乾脆退休，讓她接手公司；Mitchell、Cam 和 Manny 找來家族女性（Claire 除外）一起陪 Lily 度過一個人生重要的成長階段。","stories":[{"id":"dunphy","name":"產前課與失眠","who":"Haley · Phil · Luke","plot":"Haley 不認真上產前課，Phil 擔心到睡不著。","items":[{"p":"prenatal class","zh":"產前課程","scene":"Haley 要上準媽媽的課。","en":"We learned how to give a baby a bath in prenatal class.","tr":"我們在產前課學怎麼幫寶寶洗澡。","tip":"<b>延伸：</b>prenatal vitamins 孕期維他命。","th":2,"lv":2},{"p":"take something seriously","zh":"認真看待","scene":"Haley 一副無所謂的樣子。","en":"You need to take this seriously.","tr":"你必須認真看待這件事。","tip":"<b>反義：</b>take something lightly。","th":10,"lv":1},{"p":"insomnia","zh":"失眠","scene":"Phil 擔心到睡不著。","en":"I've had insomnia since I started the night shift.","tr":"我開始輪夜班後就失眠了。","tip":"<b>用法：</b>have insomnia。","th":8,"lv":1},{"p":"toss and turn","zh":"輾轉難眠","scene":"Phil 在床上翻來翻去。","en":"I tossed and turned all night.","tr":"我整晚翻來覆去睡不著。","tip":"<b>畫面：</b>在床上翻來翻去。","th":8,"lv":1},{"p":"count sheep","zh":"數羊","scene":"Phil 試了各種睡覺的方法。","en":"I counted sheep, but I still couldn't sleep.","tr":"我數羊還是睡不著。","tip":"<b>文化：</b>英文也用數羊幫助入睡。","th":8,"lv":1}]},{"id":"jay","name":"交棒","who":"Jay · Claire","plot":"Claire 想當執行長，Jay 不爽，最後乾脆退休讓她接手。","items":[{"p":"hand over the reins","zh":"交出掌控權","scene":"Jay 把公司交給 Claire。","en":"After 40 years, he handed over the reins to his son.","tr":"四十年後，他把經營權交給兒子。","tip":"<b>畫面：</b>把馬的韁繩交給別人。","th":3,"lv":2},{"p":"corner office","zh":"角落大辦公室","scene":"當上執行長就能坐最好的位置。","en":"One day I'll have the corner office.","tr":"總有一天我會坐上角落那間大辦公室。","tip":"<b>文化：</b>象徵高層主管的地位。","th":3,"lv":2},{"p":"call it a career","zh":"結束職業生涯","scene":"Jay 決定退休。","en":"After 20 seasons, the player called it a career.","tr":"打了二十季後，那名球員宣布退休。","tip":"<b>對比：</b>call it a day 是「今天收工」。","th":3,"lv":2}]},{"id":"mitch","name":"Lily 的成長","who":"Mitchell · Cameron · Manny · Lily · 家族女性","plot":"三人找來女性家人，一起陪 Lily 度過成長的重要時刻。","items":[{"p":"a rite of passage","zh":"成長的必經過程","scene":"Lily 進入人生新階段。","en":"Getting your driver's license is a rite of passage.","tr":"考到駕照是成長的必經過程。","tip":"<b>用法：</b>rite 是儀式。","th":9,"lv":2},{"p":"rally the troops","zh":"召集大家","scene":"三人把女生們都找來幫忙。","en":"Let's rally the troops and clean this place up.","tr":"我們召集大家把這裡打掃乾淨。","tip":"<b>來源：</b>軍隊集合士兵，當兵的你很熟。","th":10,"lv":2}]}],"prompts":["你失眠的時候都怎麼辦（用 insomnia、toss and turn、count sheep）","你覺得當兵是成長的必經過程嗎（用 a rite of passage、rally the troops、take something seriously）","你未來想坐上什麼位子（用 corner office、hand over the reins、call it a career）"],"challenges":[{"id":"c1","sit":"站完哨後你整晚翻來覆去睡不著。","uses":["toss and turn"],"ans":"I tossed and turned all night."},{"id":"c2","sit":"你說當兵是成長的必經過程。","uses":["a rite of passage"],"ans":"The army is a rite of passage."},{"id":"c3","sit":"社團要搬活動器材，你說去召集大家。","uses":["rally the troops"],"ans":"Let's rally the troops."},{"id":"c4","sit":"隊友對賽前練習很隨便，你叫他認真一點。","uses":["take something seriously"],"ans":"You need to take this seriously."}]},"s10e17":{"title":"The Wild","lede":"Phil、Mitchell 和 Cam 跟著 Jay 參加他每年一次的荒野健行，要找白頭海鵰，也要面對自己的恐懼；Gloria、Claire、Alex 和 Haley 則在家幫雙胞胎布置嬰兒房。","stories":[{"id":"jay","name":"荒野健行","who":"Jay · Phil · Mitchell · Cameron","plot":"男人們去找白頭海鵰，也面對各自的恐懼。","items":[{"p":"bald eagle","zh":"白頭海鵰","scene":"大家要找美國的國鳥。","en":"The bald eagle is the national bird of the US.","tr":"白頭海鵰是美國的國鳥。","tip":"<b>注意：</b>bald 是禿頭，但牠其實是白色羽毛。","th":8,"lv":2},{"p":"annual tradition","zh":"每年的傳統","scene":"Jay 每年都要去健行。","en":"Going to the beach on New Year's Day is our annual tradition.","tr":"元旦去海邊是我們每年的傳統。","tip":"<b>延伸：</b>family tradition 家族傳統。","th":8,"lv":1},{"p":"hit the trail","zh":"出發健行","scene":"一行人上山了。","en":"Let's hit the trail early before it gets hot.","tr":"趁還沒變熱，早點出發健行吧。","tip":"<b>用法：</b>hit the road 是出發上路。","th":8,"lv":2},{"p":"face one's fears","zh":"面對恐懼","scene":"每個人都要克服自己怕的東西。","en":"You have to face your fears to grow.","tr":"要成長就得面對恐懼。","tip":"<b>搭配：</b>overcome / conquer one's fears。","th":6,"lv":1},{"p":"out of one's element","zh":"不在自己的舒適圈","scene":"城市人到了荒野很不自在。","en":"I'm out of my element in the wild.","tr":"在野外我完全不自在。","tip":"<b>反義：</b>in one's element 如魚得水。","th":4,"lv":2}]},{"id":"dunphy","name":"布置嬰兒房","who":"Gloria · Claire · Alex · Haley","plot":"女生們在家布置雙胞胎的房間。","items":[{"p":"nursery","zh":"嬰兒房","scene":"大家幫寶寶準備房間。","en":"We painted the nursery light green.","tr":"我們把嬰兒房漆成淺綠色。","tip":"<b>注意：</b>nursery 也可以指托兒所或苗圃。","th":2,"lv":1},{"p":"baby-proof","zh":"做好防護讓寶寶安全","scene":"家裡要做好防撞措施。","en":"We need to baby-proof the stairs.","tr":"我們得在樓梯做好寶寶防護。","tip":"<b>延伸：</b>childproof 兒童防護。","th":2,"lv":2},{"p":"nesting","zh":"築巢期","scene":"準媽媽開始忙著布置家。","en":"She's been cleaning all week. She's nesting.","tr":"她整週都在打掃，這是築巢本能。","tip":"<b>用法：</b>孕婦生產前想整理家的本能。","th":2,"lv":2},{"p":"some assembly required","zh":"需自行組裝","scene":"嬰兒床要自己組。","en":"The box said \"some assembly required,\" but it took me five hours.","tr":"盒子上寫「需自行組裝」，結果我組了五小時。","tip":"<b>文化：</b>IKEA 家具的經典噩夢。","th":8,"lv":2},{"p":"Allen wrench","zh":"六角扳手","scene":"組家具一定會用到。","en":"All you need is an Allen wrench.","tr":"你只需要一支六角扳手。","tip":"<b>用法：</b>英式說 Allen key。","th":8,"lv":2}]}],"prompts":["你家有什麼每年的傳統嗎（用 annual tradition、hit the trail、bald eagle）","你怎麼面對害怕的事（用 face one's fears、out of one's element、nesting）","你組過家具嗎（用 some assembly required、Allen wrench、baby-proof）"],"challenges":[{"id":"c1","sit":"你說過年回外婆家是每年的傳統。","uses":["annual tradition"],"ans":"It's our annual tradition."},{"id":"c2","sit":"你約朋友早點出發爬山。","uses":["hit the trail"],"ans":"Let's hit the trail early."},{"id":"c3","sit":"你說你一到海邊就很不自在，你不會游泳。","uses":["out of one's element"],"ans":"I'm out of my element at the beach."},{"id":"c4","sit":"你說 IKEA 的櫃子要自己組。","uses":["some assembly required"],"ans":"Some assembly required."}]},"s10e18":{"title":"Stand by Your Man","lede":"Phil 邀 Luke、Dylan 和 Bill 一起看付費轉播的拳擊賽，想跟他們培養感情；Claire 和 Lily 因為都「不酷」而變親近；Mitchell 忘了結婚紀念日，只好陪 Cam 去跳排舞；Jay 買了電視購物時段推銷他的狗床生意，Gloria 很不喜歡。","stories":[{"id":"dunphy","name":"男人之夜 · 不酷聯盟","who":"Phil · Luke · Dylan · Bill · Claire · Lily","plot":"Phil 找年輕男生們看比賽；Claire 和 Lily 因為不酷而變親近。","items":[{"p":"fight night","zh":"拳賽之夜","scene":"Phil 找大家一起看拳擊。","en":"We're ordering pizza for fight night.","tr":"拳賽之夜我們要叫披薩。","tip":"<b>用法：</b>拳擊、UFC 轉播的夜晚。","th":8,"lv":2},{"p":"bonding time","zh":"培養感情的時間","scene":"Phil 想跟大家拉近距離。","en":"Camping is great bonding time for families.","tr":"露營是家人培養感情的好時光。","tip":"<b>用法：</b>father-son bonding time 父子時間。","th":2,"lv":1},{"p":"uncool","zh":"不酷、遜","scene":"Claire 和 Lily 都不太會跟流行。","en":"My mom thinks she's cool, but she's so uncool.","tr":"我媽覺得自己很酷，其實很遜。","tip":"<b>用法：</b>青少年愛用。","th":9,"lv":1},{"p":"dork","zh":"怪咖、書呆子","scene":"兩人一起承認自己很宅。","en":"I was a total dork in middle school.","tr":"我國中時是個十足的怪咖。","tip":"<b>語氣：</b>比 nerd 更可愛、自嘲。","th":9,"lv":1}]},{"id":"mitch","name":"排舞","who":"Mitchell · Cameron","plot":"Mitchell 忘了紀念日，只好陪 Cam 去跳排舞彌補。","items":[{"p":"in hot water","zh":"惹上麻煩","scene":"Mitchell 忘記紀念日，大事不妙。","en":"I'm in hot water with my girlfriend.","tr":"我惹我女友生氣了。","tip":"<b>畫面：</b>泡在熱水裡，很難受。","th":5,"lv":2},{"p":"make amends","zh":"彌補","scene":"Mitchell 想辦法補償 Cam。","en":"He bought her flowers to make amends.","tr":"他買花給她當作補償。","tip":"<b>用法：</b>比 apologize 更強調行動。","th":6,"lv":2},{"p":"line dancing","zh":"排舞","scene":"Cam 帶 Mitchell 去跳鄉村排舞。","en":"My aunt goes line dancing every Friday.","tr":"我阿姨每週五去跳排舞。","tip":"<b>文化：</b>美國鄉村音樂的團體舞。","th":8,"lv":2}]},{"id":"jay","name":"電視購物","who":"Jay · Gloria","plot":"Jay 上電視購物賣狗床，Gloria 不太喜歡。","items":[{"p":"infomercial","zh":"電視購物廣告","scene":"Jay 錄了一支電視購物。","en":"I almost bought a blender from an infomercial at 2 a.m.","tr":"我凌晨兩點差點跟電視購物買了果汁機。","tip":"<b>來源：</b>information + commercial。","th":8,"lv":2},{"p":"but wait, there's more","zh":"等等，還有更多","scene":"電視購物的經典台詞。","en":"But wait, there's more! Order now and get a second one free!","tr":"等等，還有更多！現在訂購再送一組！","tip":"<b>文化：</b>電視購物主持人的招牌句。","th":7,"lv":2},{"p":"as seen on TV","zh":"電視上看過的商品","scene":"Jay 的狗床要上電視。","en":"I bought this mop because it was \"as seen on TV.\"","tr":"我買這支拖把是因為它是電視購物的商品。","tip":"<b>文化：</b>美國商品包裝上常見標語。","th":8,"lv":2}]}],"prompts":["你跟家人怎麼培養感情（用 bonding time、fight night、line dancing）","你小時候是個怪咖嗎（用 dork、uncool、as seen on TV）","你惹別人生氣時會怎麼彌補（用 in hot water、make amends、but wait, there's more）"],"challenges":[{"id":"c1","sit":"你忘了女友生日，跟朋友說你惹上麻煩了。","uses":["in hot water"],"ans":"I'm in hot water with my girlfriend."},{"id":"c2","sit":"你說你國中時是個十足的怪咖。","uses":["dork"],"ans":"I was a total dork in middle school."},{"id":"c3","sit":"你買蛋糕給女友當作補償。","uses":["make amends"],"ans":"I bought her a cake to make amends."},{"id":"c4","sit":"朋友約你週末出去，你說週末是家庭時光。","uses":["bonding time"],"ans":"This weekend is family bonding time."}]},"s10e19":{"title":"Yes-Woman","lede":"Claire 想變得更正面，結果不小心同意了 Luke 和她的瑜伽老師 Janice 交往；Jay 和 Manny 很在意別人怎麼看他們；Phil 為 Alex 的畢業準備驚喜；Mitchell 和 Cam 努力找適合自己年紀的嗜好。","stories":[{"id":"dunphy","name":"正面的 Claire · Alex 的驚喜","who":"Claire · Luke · Phil · Alex","plot":"Claire 什麼都說好，Phil 為 Alex 準備驚喜。","items":[{"p":"positive vibes","zh":"正能量","scene":"Claire 想散發正面的感覺。","en":"Only positive vibes today!","tr":"今天只要正能量！","tip":"<b>用法：</b>vibes 是氛圍、感覺。","th":4,"lv":1},{"p":"go with the flow","zh":"順其自然","scene":"Claire 決定不再管那麼多。","en":"Don't plan everything. Just go with the flow.","tr":"別什麼都計畫，順其自然吧。","tip":"<b>同義：</b>roll with it。","th":6,"lv":1},{"p":"look on the bright side","zh":"往好處想","scene":"Claire 什麼都往好的看。","en":"Look on the bright side. At least it didn't rain.","tr":"往好處想，至少沒下雨。","tip":"<b>用法：</b>安慰別人時很常用。","th":6,"lv":1},{"p":"glass half full","zh":"樂觀看待","scene":"Claire 努力當樂觀的人。","en":"She's a glass-half-full kind of person.","tr":"她是個樂觀的人。","tip":"<b>反義：</b>glass half empty 悲觀。","th":9,"lv":2},{"p":"plan a surprise","zh":"準備驚喜","scene":"Phil 要給 Alex 畢業驚喜。","en":"We're planning a surprise for Mom's birthday.","tr":"我們在幫媽媽準備生日驚喜。","tip":"<b>用法：</b>plan a surprise party 驚喜派對。","th":10,"lv":1}]},{"id":"jay","name":"在意眼光","who":"Jay · Manny","plot":"兩人都太在乎別人的看法。","items":[{"p":"what will people think","zh":"別人會怎麼想","scene":"Jay 和 Manny 很在意眼光。","en":"You can't live your life worrying about what people think.","tr":"你不能一直擔心別人怎麼想。","tip":"<b>用法：</b>常用 worry about what people think。","th":4,"lv":1},{"p":"image-conscious","zh":"在意形象的","scene":"兩人都很注重自己的樣子。","en":"He's very image-conscious. He never posts bad photos.","tr":"他很注重形象，從不發醜照。","tip":"<b>用法：</b>conscious 是在意、意識到。","th":9,"lv":2}]},{"id":"mitch","name":"找嗜好","who":"Mitchell · Cameron","plot":"兩人想找適合自己年紀的嗜好。","items":[{"p":"take up a hobby","zh":"開始一項嗜好","scene":"兩人想找點新事做。","en":"I took up painting during the pandemic.","tr":"我在疫情期間開始畫畫。","tip":"<b>用法：</b>take up + 新活動。","th":8,"lv":1},{"p":"for one's age","zh":"以……的年紀來說","scene":"兩人在意自己的年紀。","en":"He's really fit for his age.","tr":"以他的年紀來說，他身材很好。","tip":"<b>用法：</b>稱讚時要小心，聽起來可能有點冒犯。","th":9,"lv":1},{"p":"keep busy","zh":"讓自己忙碌","scene":"兩人想找事情做。","en":"My grandpa keeps busy with gardening.","tr":"我阿公靠種菜讓自己有事做。","tip":"<b>用法：</b>keep oneself busy。","th":8,"lv":1}]}],"prompts":["你是樂觀還是悲觀的人（用 glass half full、look on the bright side、positive vibes）","你很在意別人的眼光嗎（用 what will people think、image-conscious、go with the flow）","你退伍後想開始什麼嗜好（用 take up a hobby、keep busy、plan a surprise）"],"challenges":[{"id":"c1","sit":"去墾丁玩遇到下大雨，你說往好處想至少不用曬太陽。","uses":["look on the bright side"],"ans":"Look on the bright side. At least it's not hot."},{"id":"c2","sit":"你說你去年開始學吉他當新嗜好。","uses":["take up a hobby"],"ans":"I took up the guitar last year."},{"id":"c3","sit":"你說你阿嬤以她的年紀來說很健康。","uses":["for one's age"],"ans":"She's really healthy for her age."},{"id":"c4","sit":"去台南玩沒排行程，你說就順其自然吧。","uses":["go with the flow"],"ans":"Let's just go with the flow."}]},"s10e20":{"title":"Can't Elope","lede":"Haley 和 Dylan 想在雙胞胎出生前私奔結婚；Jay 在搞一個新的 Instagram 計畫；Mitchell 和 Cam 得在一場音樂劇和 Haley 的婚禮之間做選擇；最後 Haley 和 Dylan 私下結婚，只有兩人的媽媽、Phil、Frank、Alex 和 Luke 在場。","stories":[{"id":"kids","name":"私奔結婚","who":"Haley · Dylan · 家人","plot":"兩人想在寶寶出生前偷偷結婚。","items":[{"p":"elope","zh":"私奔結婚","scene":"兩人想偷偷結婚。","en":"They eloped in Las Vegas.","tr":"他們跑去拉斯維加斯閃婚了。","tip":"<b>用法：</b>不辦婚禮、偷偷去登記或結婚。","th":1,"lv":2},{"p":"shotgun wedding","zh":"奉子成婚","scene":"寶寶快來了才結婚。","en":"It was a shotgun wedding. The baby came three months later.","tr":"那是奉子成婚，三個月後寶寶就出生了。","tip":"<b>來源：</b>以前女方父親拿獵槍逼男方娶。","th":1,"lv":2},{"p":"intimate wedding","zh":"小型婚禮","scene":"只請最親的家人。","en":"We want an intimate wedding with just close family.","tr":"我們想辦只有親人參加的小型婚禮。","tip":"<b>用法：</b>intimate 在這裡是「溫馨、私密」。","th":1,"lv":1},{"p":"say I do","zh":"說「我願意」、結婚","scene":"兩人終於說出我願意。","en":"They said \"I do\" on the beach.","tr":"他們在海邊說了「我願意」。","tip":"<b>用法：</b>I do 是婚禮誓詞的回答。","th":1,"lv":1},{"p":"something borrowed, something blue","zh":"借來的和藍色的東西","scene":"婚禮的小傳統。","en":"She wore her grandma's necklace as her something borrowed.","tr":"她戴了奶奶的項鍊當作「借來的東西」。","tip":"<b>文化：</b>新娘要有舊的、新的、借來的、藍色的東西。","th":1,"lv":2}]},{"id":"mitch","name":"兩難","who":"Mitchell · Cameron","plot":"兩人得在音樂劇和婚禮中選一個。","items":[{"p":"prior commitment","zh":"已經有約","scene":"兩人早就答應別的事了。","en":"I can't make it. I have a prior commitment.","tr":"我沒辦法去，我已經有約了。","tip":"<b>用法：</b>禮貌拒絕邀請的正式說法。","th":10,"lv":1},{"p":"a tough choice","zh":"艱難的選擇","scene":"兩邊都不想錯過。","en":"It was a tough choice, but I chose the job in Taipei.","tr":"那是個艱難的選擇，但我選了台北的工作。","tip":"<b>同義：</b>a hard decision。","th":10,"lv":1}]},{"id":"jay","name":"Jay 的 IG","who":"Jay","plot":"Jay 開始經營 Instagram 新計畫。","items":[{"p":"hashtag","zh":"主題標籤","scene":"Jay 學年輕人用標籤。","en":"Don't forget to use our wedding hashtag!","tr":"別忘了用我們的婚禮標籤！","tip":"<b>用法：</b>也可以當動詞，hashtag it。","th":8,"lv":1},{"p":"go public","zh":"公開","scene":"Jay 想把作品公開。","en":"They finally went public with their relationship.","tr":"他們終於公開戀情了。","tip":"<b>用法：</b>公司上市也是 go public。","th":1,"lv":1},{"p":"followers","zh":"追蹤者","scene":"Jay 想要更多人追蹤。","en":"She gained 10,000 followers in one week.","tr":"她一週增加了一萬個追蹤者。","tip":"<b>延伸：</b>follow back 回追。","th":8,"lv":1}]}],"prompts":["你想辦大婚禮還是小婚禮（用 intimate wedding、elope、say I do）","你做過最難的選擇是什麼（用 a tough choice、prior commitment、go public）","你有在經營社群嗎（用 followers、hashtag、shotgun wedding）"],"challenges":[{"id":"c1","sit":"朋友約你週六唱歌，你禮貌說已經有約了。","uses":["prior commitment"],"ans":"I have a prior commitment."},{"id":"c2","sit":"你說選單位是個艱難的選擇。","uses":["a tough choice"],"ans":"It was a tough choice."},{"id":"c3","sit":"你說你想辦只有家人參加的小型婚禮。","uses":["intimate wedding"],"ans":"I want an intimate wedding."},{"id":"c4","sit":"你的大學朋友終於在IG公開戀情了。","uses":["go public"],"ans":"He finally went public with his relationship."}]},"s10e21":{"title":"Commencement","lede":"Cam 有機會主持一場畢業典禮；Jay 的畢業致詞出了大包，因為大家發現他就是那個害死貓頭鷹的人；Phil 和 Claire 一直誇 Alex，讓 Luke 和 Haley 覺得自己比不上她，而 Alex 自己則很害怕踏入社會；Claire 遇到以前的死對頭；Manny 懷疑 Gloria 在用好處收買大家，好讓全家和樂。","stories":[{"id":"jay","name":"畢業致詞","who":"Jay · Cameron","plot":"Cam 主持典禮，Jay 的致詞卻出了包。","items":[{"p":"keynote speaker","zh":"主講人","scene":"Jay 受邀上台致詞。","en":"The keynote speaker gave an inspiring talk.","tr":"主講人的演講很激勵人心。","tip":"<b>用法：</b>大會、畢業典禮的主要講者。","th":3,"lv":2},{"p":"in the hot seat","zh":"被拷問、處境為難","scene":"Jay 的秘密被揭穿了。","en":"The CEO was in the hot seat at the press conference.","tr":"執行長在記者會上被追問得很狼狽。","tip":"<b>畫面：</b>坐在被質問的椅子上。","th":5,"lv":2},{"p":"the truth comes out","zh":"真相大白","scene":"大家發現 Jay 做過的事。","en":"Sooner or later, the truth comes out.","tr":"真相遲早會大白。","tip":"<b>同義：</b>the truth will out。","th":10,"lv":1}]},{"id":"dunphy","name":"比不上 Alex","who":"Luke · Haley · Alex · Phil · Claire","plot":"爸媽一直誇 Alex，Luke 和 Haley 覺得自己很遜；Alex 則對未來很焦慮；Claire 遇到老對手。","items":[{"p":"feel inferior","zh":"覺得比不上","scene":"Luke 和 Haley 很有壓力。","en":"I always feel inferior to my brother.","tr":"我總覺得自己比不上我哥。","tip":"<b>反義：</b>superior。","th":4,"lv":1},{"p":"the pride of the family","zh":"家族的驕傲","scene":"Alex 是爸媽的驕傲。","en":"My cousin is a doctor. He's the pride of the family.","tr":"我表哥是醫生，是家族的驕傲。","tip":"<b>用法：</b>帶點被比較的壓力。","th":2,"lv":1},{"p":"pat on the back","zh":"讚許、肯定","scene":"爸媽一直稱讚 Alex。","en":"Give yourself a pat on the back. You did great.","tr":"給自己一點肯定，你做得很好。","tip":"<b>畫面：</b>拍拍肩膀說做得好。","th":6,"lv":1},{"p":"quarter-life crisis","zh":"青年危機","scene":"Alex 對進入社會很焦慮。","en":"At 25, I had a quarter-life crisis about my career.","tr":"二十五歲時我對職涯有一場青年危機。","tip":"<b>對比：</b>midlife crisis 中年危機。","th":4,"lv":2},{"p":"bitter rival","zh":"死對頭","scene":"Claire 遇到以前的對手。","en":"The two companies are bitter rivals.","tr":"這兩家公司是死對頭。","tip":"<b>用法：</b>bitter 強調恩怨很深。","th":5,"lv":1}]},{"id":"mitch","name":"收買大家？","who":"Manny · Gloria","plot":"Manny 懷疑媽媽在收買家人。","items":[{"p":"grease someone's palm","zh":"塞錢、賄賂","scene":"Manny 懷疑 Gloria 在打通關係。","en":"He greased the guard's palm to get in.","tr":"他塞錢給警衛才進得去。","tip":"<b>畫面：</b>在手心抹油，讓事情「順利」。","th":3,"lv":2},{"p":"buy someone off","zh":"收買某人","scene":"Gloria 用好處讓大家開心。","en":"You can't buy me off with ice cream.","tr":"你不能用冰淇淋收買我。","tip":"<b>對比：</b>grease someone's palm 偏指塞錢；buy someone off 範圍更廣。","th":10,"lv":2}]}],"prompts":["你曾經覺得自己比不上誰嗎（用 feel inferior、the pride of the family、pat on the back）","你對退伍後的生活焦慮嗎（用 quarter-life crisis、keynote speaker、the truth comes out）","你有什麼死對頭嗎（用 bitter rival、in the hot seat、buy someone off）"],"challenges":[{"id":"c1","sit":"你說你表哥是家族的驕傲。","uses":["the pride of the family"],"ans":"My cousin is the pride of the family."},{"id":"c2","sit":"你說你總覺得自己比不上哥哥。","uses":["feel inferior"],"ans":"I always feel inferior to my brother."},{"id":"c3","sit":"同梯想用雞排收買你幫他站哨。","uses":["buy someone off"],"ans":"You can't buy me off with fried chicken."},{"id":"c4","sit":"你跟剛考完會考的弟弟說給自己一點肯定。","uses":["pat on the back"],"ans":"Give yourself a pat on the back."}]},"s10e22":{"title":"A Year of Birthdays","lede":"第十季最終集，雙胞胎快出生了，全家回顧過去一年的生日：Phil 決心學鋼琴；Claire 發現大家都覺得她很緊繃；Cam 和 Lily 的生日都被心碎的 Manny 搞砸，因為他在自己生日那天向 Sherry 求婚被拒絕；最後 Haley 生下一男一女，全家人都聚在一起。","stories":[{"id":"dunphy","name":"鋼琴與緊繃","who":"Phil · Claire","plot":"Phil 開始學鋼琴，Claire 發現自己在大家眼中很緊繃。","items":[{"p":"never too late","zh":"永遠不嫌晚","scene":"Phil 這把年紀開始學鋼琴。","en":"It's never too late to learn something new.","tr":"學新東西永遠不嫌晚。","tip":"<b>用法：</b>It's never too late to + 動詞。","th":6,"lv":1},{"p":"tightly wound","zh":"很緊繃的","scene":"大家覺得 Claire 太緊張了。","en":"She's so tightly wound. She needs a vacation.","tr":"她太緊繃了，需要休個假。","tip":"<b>畫面：</b>上得太緊的發條。","th":9,"lv":2},{"p":"blow out the candles","zh":"吹蠟燭","scene":"每個人的生日都有蠟燭。","en":"Make a wish and blow out the candles!","tr":"許個願然後吹蠟燭！","tip":"<b>用法：</b>生日必說的一句話。","th":8,"lv":1}]},{"id":"kids","name":"Manny 的求婚","who":"Manny · Sherry · Cameron · Lily","plot":"Manny 求婚被拒，心碎到搞砸別人的生日。","items":[{"p":"she said no","zh":"她拒絕了","scene":"Manny 求婚失敗。","en":"I proposed, and she said no.","tr":"我求婚了，她拒絕了。","tip":"<b>用法：</b>求婚、邀約失敗時的簡單說法。","th":1,"lv":1},{"p":"wear one's heart on one's sleeve","zh":"把感情寫在臉上","scene":"Manny 一難過大家都知道。","en":"He wears his heart on his sleeve. You always know how he feels.","tr":"他把感情都寫在臉上，你總是知道他的感受。","tip":"<b>來源：</b>中世紀騎士把心上人的絲帶綁在袖子上。","th":9,"lv":2},{"p":"a broken heart","zh":"心碎","scene":"Manny 很受傷。","en":"Time heals a broken heart.","tr":"時間會治癒心碎。","tip":"<b>延伸：</b>heartbreak 心碎、heartbroken 心碎的。","th":1,"lv":1}]},{"id":"family","name":"雙胞胎誕生","who":"Haley · Dylan · 全家","plot":"Haley 生下一男一女，大家都到齊了。","items":[{"p":"the big day","zh":"重要的日子","scene":"寶寶出生的大日子到了。","en":"Tomorrow's the big day! Are you nervous?","tr":"明天就是大日子了！你緊張嗎？","tip":"<b>用法：</b>婚禮、考試、生產等重要日子。","th":8,"lv":1},{"p":"it's a girl","zh":"是女生","scene":"雙胞胎中有一個女孩。","en":"It's a girl! She's beautiful.","tr":"是女孩！她好漂亮。","tip":"<b>對比：</b>it's a boy 是男孩。","th":2,"lv":1},{"p":"bundle of joy","zh":"小寶貝","scene":"新生兒帶來歡樂。","en":"Congratulations on your new bundle of joy!","tr":"恭喜你們迎來小寶貝！","tip":"<b>用法：</b>賀卡上很常見的說法。","th":2,"lv":2},{"p":"full circle","zh":"回到原點、圓滿","scene":"一家人走了十季，又迎來新生命。","en":"My life has come full circle. I'm back in my hometown.","tr":"我的人生繞了一圈，又回到故鄉。","tip":"<b>搭配：</b>come full circle。","th":9,"lv":2}]}],"prompts":["你有什麼想學但覺得太晚的事（用 never too late、tightly wound、blow out the candles）","你是會把感情寫在臉上的人嗎（用 wear one's heart on one's sleeve、a broken heart、she said no）","你人生中重要的大日子是哪天（用 the big day、bundle of joy、full circle）"],"challenges":[{"id":"c1","sit":"你說學英文永遠不嫌晚。","uses":["never too late"],"ans":"It's never too late to learn English."},{"id":"c2","sit":"明天要入伍了，朋友說明天就是大日子。","uses":["the big day"],"ans":"Tomorrow's the big day!"},{"id":"c3","sit":"你說你主管太緊繃了，需要休個假。","uses":["tightly wound"],"ans":"He's so tightly wound."},{"id":"c4","sit":"你說你哥把感情都寫在臉上。","uses":["wear one's heart on one's sleeve"],"ans":"He wears his heart on his sleeve."}]},"s11e01":{"title":"New Kids on the Block","lede":"最終季開場，Alex 在南極做研究；Haley 和 Dylan 搞不定雙胞胎 Poppy 和 George 的睡覺問題，Claire 和 Phil 的方法跟 Haley 的育兒書打架；Jay、Gloria 和 Manny 為狗床生意拍廣告，由 Stella 主演，Manny 的前女友 Sherry 幫狗配音，Manny 當導演還想把她追回來；Cam 找劇團學生來家裡「跟 Mitchell 培養感情」，其實是要逼 Mitchell 承認他丟了 Cam 的小丑雕像。","stories":[{"id":"dunphy","name":"雙胞胎睡覺大作戰","who":"Haley · Dylan · Phil · Claire · Alex","plot":"新手爸媽搞不定寶寶睡覺，Alex 遠在南極。","items":[{"p":"sleep training","zh":"睡眠訓練","scene":"大家在討論怎麼讓寶寶睡覺。","en":"We started sleep training when she was six months old.","tr":"她六個月大時我們開始睡眠訓練。","tip":"<b>文化：</b>美國很流行的育兒方法。","th":2,"lv":2},{"p":"sleep-deprived","zh":"睡眠不足的","scene":"新手爸媽累壞了。","en":"New parents are always sleep-deprived.","tr":"新手爸媽總是睡眠不足。","tip":"<b>用法：</b>deprived 是被剝奪的。","th":8,"lv":1},{"p":"by the book","zh":"照規矩來","scene":"Haley 堅持照書上的方法。","en":"She does everything by the book.","tr":"她做什麼事都照規矩來。","tip":"<b>用法：</b>也指嚴格守法、守規定。","th":9,"lv":1},{"p":"the middle of nowhere","zh":"鳥不生蛋的地方","scene":"Alex 在遙遠的南極。","en":"Our base is in the middle of nowhere.","tr":"我們的營區在鳥不生蛋的地方。","tip":"<b>用法：</b>抱怨地點偏僻時超好用。","th":9,"lv":1}]},{"id":"jay","name":"狗床廣告","who":"Jay · Gloria · Manny · Sherry · Stella","plot":"Manny 當導演拍廣告，還想追回 Sherry。","items":[{"p":"win someone back","zh":"把某人追回來","scene":"Manny 還想挽回前女友。","en":"He sent her flowers to win her back.","tr":"他送她花想把她追回來。","tip":"<b>用法：</b>分手後想挽回。","th":1,"lv":1},{"p":"voice-over","zh":"配音、旁白","scene":"Sherry 幫狗配音。","en":"She did the voice-over for the commercial.","tr":"她幫那支廣告配旁白。","tip":"<b>用法：</b>電影、廣告畫面外的聲音。","th":3,"lv":2},{"p":"take two","zh":"第二次、重來一次","scene":"拍廣告一直 NG。","en":"That didn't go well. Take two!","tr":"剛剛不太順，重來一次！","tip":"<b>來源：</b>拍片的第二次拍攝。","th":7,"lv":2}]},{"id":"mitch","name":"小丑雕像","who":"Cameron · Mitchell · 劇團學生","plot":"Cam 找學生來，其實是要逼 Mitchell 承認丟了雕像。","items":[{"p":"ambush","zh":"埋伏、突襲","scene":"Cam 設局讓 Mitchell 措手不及。","en":"I walked in and they ambushed me with questions.","tr":"我一進門就被他們一連串問題突襲。","tip":"<b>用法：</b>也是軍事用語「伏擊」。","th":5,"lv":2},{"p":"admit it","zh":"承認吧","scene":"大家要 Mitchell 認錯。","en":"Just admit it. You ate my pudding.","tr":"承認吧，你吃了我的布丁。","tip":"<b>用法：</b>逼人說實話時常說。","th":7,"lv":1},{"p":"a lost cause","zh":"沒救了","scene":"Mitchell 一直不肯承認。","en":"Trying to teach him to cook is a lost cause.","tr":"教他煮飯根本沒救了。","tip":"<b>用法：</b>怎麼努力都沒用的事。","th":9,"lv":2}]}],"prompts":["你最近睡眠充足嗎（用 sleep-deprived、sleep training、by the book）","你曾經想把誰追回來嗎（用 win someone back、take two、a lost cause）","你被朋友設局突襲過嗎（用 ambush、admit it、the middle of nowhere）"],"challenges":[{"id":"c1","sit":"你說你們營區在鳥不生蛋的地方。","uses":["the middle of nowhere"],"ans":"Our base is in the middle of nowhere."},{"id":"c2","sit":"你連續站兩班夜哨，說你睡眠不足。","uses":["sleep-deprived"],"ans":"I'm so sleep-deprived."},{"id":"c3","sit":"室友偷吃你的泡麵，你叫他承認吧。","uses":["admit it"],"ans":"Just admit it."},{"id":"c4","sit":"你說公司的會計做事都照規矩來。","uses":["by the book"],"ans":"She does everything by the book."}]},"s11e02":{"title":"Snapped","lede":"Cam 買了一台有語音助理的冰箱 Bridget，他跟 Mitchell 都對它很有感情；Gloria 和死對頭 Libby 搶著當 Phil 的房仲實習生，Libby 騎車摔倒，Phil 懷疑是 Gloria 搞鬼，其實是 Phil 在停車場拋球害的；Claire 裝病想逃避在家拍雜誌照片；Alex 從南極回來，她和 Haley、Luke 發現了 Claire 說謊的原因。","stories":[{"id":"mitch","name":"智慧冰箱","who":"Cameron · Mitchell","plot":"兩人愛上會說話的冰箱。","items":[{"p":"tech-savvy","zh":"懂科技的","scene":"兩人學著用新家電。","en":"My grandma is surprisingly tech-savvy.","tr":"我阿嬤意外地很懂科技產品。","tip":"<b>用法：</b>savvy 是精明、懂行。","th":9,"lv":1},{"p":"voice assistant","zh":"語音助理","scene":"冰箱會跟他們說話。","en":"I asked my voice assistant to set an alarm.","tr":"我請語音助理設鬧鐘。","tip":"<b>延伸：</b>Siri、Alexa 都是語音助理。","th":8,"lv":1}]},{"id":"dunphy","name":"實習生之爭","who":"Phil · Gloria · Libby","plot":"兩個女人搶實習機會，一場意外讓 Phil 懷疑 Gloria。","items":[{"p":"compete for","zh":"爭取","scene":"Gloria 和 Libby 搶同一個位子。","en":"Hundreds of people competed for the job.","tr":"好幾百人爭取這份工作。","tip":"<b>用法：</b>compete for + 想得到的東西。","th":3,"lv":1},{"p":"wipe out","zh":"摔車、跌倒","scene":"Libby 騎車摔了一跤。","en":"I wiped out on my bike yesterday.","tr":"我昨天騎腳踏車摔車了。","tip":"<b>用法：</b>衝浪、滑板、騎車摔倒都能用。","th":8,"lv":2},{"p":"the blame game","zh":"互相推卸責任","scene":"大家開始找誰該負責。","en":"Let's stop playing the blame game and fix the problem.","tr":"別再互相推責任了，先解決問題吧。","tip":"<b>搭配：</b>play the blame game。","th":5,"lv":2},{"p":"shift the blame","zh":"推卸責任","scene":"Phil 先懷疑別人。","en":"Don't try to shift the blame to me.","tr":"別想把責任推到我身上。","tip":"<b>用法：</b>shift the blame onto / to someone。","th":5,"lv":1},{"p":"the real culprit","zh":"真正的罪魁禍首","scene":"其實是 Phil 害的。","en":"The real culprit was the dog.","tr":"真正的罪魁禍首是那隻狗。","tip":"<b>用法：</b>culprit 是犯人、元兇。","th":5,"lv":1}]},{"id":"kids","name":"Claire 裝病","who":"Claire · Alex · Haley · Luke","plot":"Claire 裝病逃避拍照，Alex 回家後真相大白。","items":[{"p":"fake sick","zh":"裝病","scene":"Claire 假裝生病。","en":"He faked sick to skip school.","tr":"他裝病逃學。","tip":"<b>用法：</b>口語說 fake sick 或 pretend to be sick。","th":10,"lv":1},{"p":"photogenic","zh":"上相的","scene":"Claire 不想被拍。","en":"My sister is so photogenic. She looks good in every photo.","tr":"我妹很上相，每張照片都好看。","tip":"<b>反義：</b>not photogenic、camera-shy。","th":9,"lv":1},{"p":"welcome back","zh":"歡迎回來","scene":"Alex 從南極回家了。","en":"Welcome back! How was your trip?","tr":"歡迎回來！旅行怎麼樣？","tip":"<b>用法：</b>也能說 Welcome home。","th":7,"lv":1}]}],"prompts":["你家有什麼智慧家電嗎（用 tech-savvy、voice assistant、welcome back）","你有裝病過嗎（用 fake sick、photogenic、wipe out）","出事的時候你會先找誰負責（用 the blame game、shift the blame、the real culprit）"],"challenges":[{"id":"c1","sit":"同事度完蜜月回來上班，你跟他說歡迎回來。","uses":["welcome back"],"ans":"Welcome
