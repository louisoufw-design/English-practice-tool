back!"},{"id":"c2","sit":"你說你昨天騎車摔車了。","uses":["wipe out"],"ans":"I wiped out on my scooter yesterday."},{"id":"c3","sit":"你小時候裝病不去上學。","uses":["fake sick"],"ans":"I faked sick to skip school."},{"id":"c4","sit":"東西不見大家互相怪來怪去，你叫大家別再互推責任。","uses":["the blame game"],"ans":"Let's stop playing the blame game."}]},"s11e03":{"title":"Perfect Pairs","lede":"Phil、Claire、Alex 和 Luke 各自偷偷「借用」雙胞胎達成自己的目的：Phil 拿去參加魔術比賽、Claire 拿去討好客戶、Luke 帶著去買酒；Haley 和 Dylan 從嬰兒車的攝影機發現了真相；Gloria 沒問過妹妹 Sonia 就懷疑她的未婚夫是拜金男；Mitchell 和 Cam 把空著的公寓租給一對看起來完美的同志情侶。","stories":[{"id":"dunphy","name":"借用雙胞胎","who":"Phil · Claire · Alex · Luke · Haley · Dylan","plot":"大家都利用寶寶達成自己的目的，被攝影機拍到了。","items":[{"p":"ulterior motive","zh":"別有用心","scene":"每個人照顧寶寶都另有目的。","en":"He's being nice to me. I think he has an ulterior motive.","tr":"他對我很好，我覺得他別有用心。","tip":"<b>用法：</b>表面目的以外的真正動機。","th":10,"lv":2},{"p":"cute as a button","zh":"可愛得不得了","scene":"雙胞胎超可愛。","en":"Your baby is cute as a button!","tr":"你的寶寶可愛得不得了！","tip":"<b>用法：</b>誇獎小孩的固定說法。","th":9,"lv":2},{"p":"people magnet","zh":"人氣磁鐵","scene":"帶寶寶出門大家都靠過來。","en":"Babies are a total people magnet. Everyone stops to say hi.","tr":"寶寶完全是人氣磁鐵，每個人都停下來打招呼。","tip":"<b>延伸：</b>chick magnet 吸引女生的東西。","th":9,"lv":2},{"p":"nanny cam","zh":"保母監視器","scene":"Haley 從監視器發現真相。","en":"We checked the nanny cam to see what happened.","tr":"我們看了保母監視器想知道發生什麼事。","tip":"<b>用法：</b>家長用來監看保母的攝影機。","th":2,"lv":2},{"p":"caught in the act","zh":"當場被抓","scene":"大家的行為都被拍到。","en":"The thief was caught in the act.","tr":"小偷被當場抓到。","tip":"<b>同義：</b>caught red-handed。","th":10,"lv":1}]},{"id":"jay","name":"Sonia 的未婚夫","who":"Gloria · Sonia","plot":"Gloria 自己認定妹妹的未婚夫是拜金男。","items":[{"p":"gold digger","zh":"拜金的人","scene":"Gloria 懷疑對方是為了錢。","en":"People think she's a gold digger because her husband is rich.","tr":"因為她老公有錢，大家覺得她很拜金。","tip":"<b>畫面：</b>挖金礦的人。","th":1,"lv":2},{"p":"mind one's own business","zh":"少管閒事","scene":"Gloria 該少管妹妹的事。","en":"Mind your own business!","tr":"少管閒事！","tip":"<b>用法：</b>none of your business 不關你的事。","th":7,"lv":1}]},{"id":"mitch","name":"完美房客","who":"Mitchell · Cameron · 房客情侶","plot":"兩人把公寓租給一對很完美的情侶。","items":[{"p":"the perfect couple","zh":"完美情侶","scene":"房客看起來無可挑剔。","en":"Everyone thinks they're the perfect couple.","tr":"大家都覺得他們是完美情侶。","tip":"<b>用法：</b>常帶點「真的嗎」的懷疑。","th":1,"lv":1},{"p":"couple goals","zh":"理想情侶的樣子","scene":"房客讓兩人好羨慕。","en":"They travel the world together. Couple goals!","tr":"他們一起環遊世界，理想情侶啊！","tip":"<b>用法：</b>社群貼文常見。","th":1,"lv":1},{"p":"a sweet deal","zh":"划算的交易","scene":"租出去好像很划算。","en":"I got the apartment for half price. Sweet deal!","tr":"我用半價租到公寓，超划算！","tip":"<b>用法：</b>sweet 口語是「讚、划算」。","th":3,"lv":1}]}],"prompts":["你遇過別有用心的人嗎（用 ulterior motive、caught in the act、nanny cam）","你心中的理想情侶是什麼樣子（用 couple goals、the perfect couple、gold digger）","你會管別人的閒事嗎（用 mind one's own business、a sweet deal、cute as a button）"],"challenges":[{"id":"c1","sit":"平常很小氣的同事突然請你喝飲料，你覺得他別有用心。","uses":["ulterior motive"],"ans":"I think he has an ulterior motive."},{"id":"c2","sit":"你說你外甥可愛得不得了。","uses":["cute as a button"],"ans":"My nephew is cute as a button."},{"id":"c3","sit":"你弟偷吃宵夜被媽媽當場抓到。","uses":["caught in the act"],"ans":"He was caught in the act."},{"id":"c4","sit":"你用半價買到球鞋，說超划算。","uses":["a sweet deal"],"ans":"Sweet deal!"}]},"s11e04":{"title":"Pool Party","lede":"Mitchell 和 Cam 勸 Lily 在泳池派對穿泳衣，自己卻因為對身材沒自信而躲起來，最後兩人勇敢現身，告訴她每個人都該為自己驕傲；Phil 和 Gloria 要賣房子，「出售」的牌子卻一直被偷，Gloria 用 Stella 項圈上的定位器找犯人；Jay 抱怨 Gloria 很少在家，就算在家也不聽他說話；Claire 逼 Haley 回去工作、逼 Alex 去大公司上班，結果自己的工作窘境卻被她們看見。","stories":[{"id":"mitch","name":"泳池派對","who":"Mitchell · Cameron · Lily","plot":"兩人要 Lily 有自信，自己卻躲起來。","items":[{"p":"body image","zh":"身體意象","scene":"大家對自己的身材沒自信。","en":"Social media can hurt teenagers' body image.","tr":"社群媒體會影響青少年對自己身體的看法。","tip":"<b>用法：</b>對自己外表、身材的感受。","th":8,"lv":2},{"p":"body-shaming","zh":"身材羞辱","scene":"不該因為身材被取笑。","en":"Body-shaming is never okay.","tr":"身材羞辱永遠都不對。","tip":"<b>用法：</b>嘲笑別人的身材。","th":5,"lv":2},{"p":"beach body","zh":"海灘好身材","scene":"兩人覺得自己身材不夠好。","en":"I'm working out to get a beach body for summer.","tr":"我在健身，想在夏天練出好身材。","tip":"<b>用法：</b>健身廣告很愛用。","th":8,"lv":1},{"p":"own it","zh":"大方接受、做自己","scene":"兩人最後大方現身。","en":"You're not perfect, but own it!","tr":"你不完美，但就大方做自己吧！","tip":"<b>用法：</b>鼓勵人自信面對。","th":6,"lv":1}]},{"id":"jay","name":"被偷的牌子 · 沒在聽","who":"Phil · Gloria · Jay","plot":"兩人追查偷牌子的人；Jay 覺得 Gloria 都沒在聽。","items":[{"p":"stake out","zh":"埋伏監視","scene":"Gloria 要抓偷牌子的人。","en":"The cops staked out the building all night.","tr":"警察整晚在大樓外埋伏。","tip":"<b>名詞：</b>stakeout 監視行動。","th":10,"lv":2},{"p":"GPS tracker","zh":"定位器","scene":"Gloria 用狗項圈上的定位器追蹤。","en":"I put a GPS tracker on my bike.","tr":"我在腳踏車上裝了定位器。","tip":"<b>延伸：</b>AirTag 也是一種追蹤器。","th":8,"lv":1},{"p":"tune someone out","zh":"不理會、當耳邊風","scene":"Jay 覺得 Gloria 不聽他說話。","en":"My kids just tune me out when I nag.","tr":"我一嘮叨，孩子就當耳邊風。","tip":"<b>畫面：</b>把收音機頻道轉掉。","th":2,"lv":2},{"p":"in one ear and out the other","zh":"左耳進右耳出","scene":"Jay 講的話都沒被聽進去。","en":"Everything I say goes in one ear and out the other.","tr":"我說的話都左耳進右耳出。","tip":"<b>用法：</b>跟中文的說法幾乎一樣。","th":2,"lv":1}]},{"id":"dunphy","name":"工作建議","who":"Claire · Haley · Alex","plot":"Claire 逼女兒們工作，自己的困境卻被看見。","items":[{"p":"back to work","zh":"回去工作","scene":"Claire 要 Haley 回職場。","en":"She went back to work after her maternity leave.","tr":"她產假結束後回去上班了。","tip":"<b>用法：</b>休假或休息後重新開始工作。","th":3,"lv":1},{"p":"corporate job","zh":"大公司的工作","scene":"Claire 希望 Alex 去大企業。","en":"I left my corporate job to open a café.","tr":"我辭掉大公司的工作去開咖啡廳。","tip":"<b>延伸：</b>corporate world 企業界。","th":3,"lv":1}]}],"prompts":["你對自己的身材有自信嗎（用 body image、beach body、own it）","你會把別人的話當耳邊風嗎（用 tune someone out、in one ear and out the other、back to work）","退伍後你想去大公司還是小公司（用 corporate job、GPS tracker、stake out）"],"challenges":[{"id":"c1","sit":"你媽嘮叨你，你都左耳進右耳出。","uses":["in one ear and out the other"],"ans":"It goes in one ear and out the other."},{"id":"c2","sit":"你說你在練身材準備夏天去海邊。","uses":["beach body"],"ans":"I'm working on my beach body."},{"id":"c3","sit":"你說你在機車上裝了定位器。","uses":["GPS tracker"],"ans":"I put a GPS tracker on my scooter."},{"id":"c4","sit":"你說放完假要回去工作了。","uses":["back to work"],"ans":"Time to go back to work."}]},"s11e05":{"title":"The Last Halloween","lede":"Phil 想嚇 Claire，她卻堅持自己不會被嚇到；結果 Phil 自己被恐怖片嚇壞，最後他用一個籌備了十一個月的惡作劇扳回一城；Jay 替 Joe 留了一條稀有糖果，Manny 卻不小心送給來要糖的小孩，Jay 只好四處追查；Gloria 被人當成「Jay 的太太」，開始擔心自己變老；Alex 和 Luke 跟 Bill、Janice 的晚餐約會都搞砸了，姊弟倆最後一起吃晚餐。","stories":[{"id":"dunphy","name":"嚇人大戰","who":"Phil · Claire","plot":"Phil 想嚇 Claire，最後自己被嚇，還用長期計畫扳回一城。","items":[{"p":"scaredy-cat","zh":"膽小鬼","scene":"Phil 其實比誰都膽小。","en":"Don't be such a scaredy-cat. It's just a movie.","tr":"別那麼膽小，只是電影而已。","tip":"<b>用法：</b>小孩、朋友之間的取笑。","th":9,"lv":1},{"p":"scare the living daylights out of","zh":"把人嚇得半死","scene":"Phil 想把 Claire 嚇得魂飛魄散。","en":"You scared the living daylights out of me!","tr":"你把我嚇得半死！","tip":"<b>同義：</b>scare the hell out of someone。","th":4,"lv":2},{"p":"the long game","zh":"放長線的計畫","scene":"Phil 的惡作劇準備了快一年。","en":"He's playing the long game. He'll get promoted in five years.","tr":"他在放長線，五年內會升官。","tip":"<b>搭配：</b>play the long game。","th":10,"lv":2}]},{"id":"jay","name":"稀有糖果","who":"Jay · Manny · Joe","plot":"Jay 留給 Joe 的糖果被送走了，他到處去找。","items":[{"p":"a sweet tooth","zh":"愛吃甜食","scene":"Joe 很愛吃糖。","en":"I have a sweet tooth. I can't say no to cake.","tr":"我很愛吃甜食，看到蛋糕就無法拒絕。","tip":"<b>用法：</b>have a sweet tooth。","th":8,"lv":1},{"p":"limited edition","zh":"限量版","scene":"那條糖果很稀有。","en":"I waited in line for the limited-edition sneakers.","tr":"我排隊買限量版球鞋。","tip":"<b>用法：</b>名詞前面加 hyphen。","th":8,"lv":1},{"p":"hunt down","zh":"追查到底","scene":"Jay 到處找那條糖。","en":"I hunted down the last copy of the book.","tr":"我追查到了那本書的最後一本。","tip":"<b>用法：</b>找到很難找的東西或人。","th":10,"lv":1}]},{"id":"gloria","name":"擔心變老","who":"Gloria","plot":"Gloria 被當成 Jay 的老婆，開始擔心自己老了。","items":[{"p":"crow's feet","zh":"魚尾紋","scene":"Gloria 很在意自己的皺紋。","en":"I'm starting to get crow's feet.","tr":"我開始有魚尾紋了。","tip":"<b>畫面：</b>眼角紋路像烏鴉的腳。","th":8,"lv":2},{"p":"age gracefully","zh":"優雅地變老","scene":"Gloria 在學著接受歲月。","en":"My grandma aged gracefully.","tr":"我奶奶老得很優雅。","tip":"<b>用法：</b>稱讚人老了依然有魅力。","th":8,"lv":2}]},{"id":"kids","name":"災難約會","who":"Alex · Luke · Bill · Janice","plot":"姊弟倆的約會都搞砸了，最後兩人一起吃飯。","items":[{"p":"date from hell","zh":"地獄般的約會","scene":"兩人的約會都很慘。","en":"He talked about his ex the whole time. It was the date from hell.","tr":"他整晚都在聊前任，那是地獄般的約會。","tip":"<b>用法：</b>誇張形容超糟的約會。","th":1,"lv":1},{"p":"dinner for two","zh":"兩人晚餐","scene":"姊弟最後一起吃飯。","en":"I booked a dinner for two at the Italian place.","tr":"我在那家義大利餐廳訂了兩人晚餐。","tip":"<b>用法：</b>常指浪漫晚餐，這集是姊弟版。","th":1,"lv":1}]}],"prompts":["你是膽小鬼嗎（用 scaredy-cat、scare the living daylights out of、the long game）","你愛吃甜食嗎（用 a sweet tooth、limited edition、hunt down）","你經歷過很慘的約會嗎（用 date from hell、dinner for two、age gracefully）"],"challenges":[{"id":"c1","sit":"朋友在鬼屋出口躲起來嚇你，你說他把你嚇得半死。","uses":["scare the living daylights out of"],"ans":"You scared the living daylights out of me!"},{"id":"c2","sit":"你說你很愛吃甜食，看到蛋糕就沒辦法。","uses":["a sweet tooth"],"ans":"I have a sweet tooth."},{"id":"c3","sit":"你排隊買限量版球鞋。","uses":["limited edition"],"ans":"I waited in line for the limited-edition sneakers."},{"id":"c4","sit":"你笑朋友是膽小鬼，只是鬼片而已。","uses":["scaredy-cat"],"ans":"Don't be such a scaredy-cat."}]},"s11e06":{"title":"A Game of Chicken","lede":"Claire 工作過勞，辭職了；Luke 想休學跟夥伴 Scott 一起做 App，Phil 不高興 Luke 沒有先找他商量，但兩人最後還是支持他；Gloria 偷偷想幫雙胞胎受洗，Jay 反對，Haley 和 Dylan 決定之後再考慮；Cam 沒跟 Mitchell 商量就考慮去密蘇里當大學教練，比賽時有球探在場，對手的海豚吉祥物一直嘲弄他，Mitchell 出手相助。","stories":[{"id":"dunphy","name":"辭職與休學","who":"Claire · Luke · Phil","plot":"Claire 過勞辭職，Luke 想休學創業。","items":[{"p":"burned out","zh":"身心俱疲","scene":"Claire 工作到燒乾了。","en":"I've been working 70-hour weeks. I'm totally burned out.","tr":"我每週工作七十小時，完全燃燒殆盡了。","tip":"<b>名詞：</b>burnout 過勞。","th":4,"lv":1},{"p":"quit one's job","zh":"辭職","scene":"Claire 決定離開公司。","en":"She quit her job to travel the world.","tr":"她辭職去環遊世界。","tip":"<b>同義：</b>resign（較正式）。","th":3,"lv":1},{"p":"drop out of college","zh":"大學休學","scene":"Luke 想休學去創業。","en":"Bill Gates dropped out of college.","tr":"比爾蓋茲大學沒念完。","tip":"<b>用法：</b>drop out of + school。","th":3,"lv":1},{"p":"start-up","zh":"新創公司","scene":"Luke 想做 App 創業。","en":"He works at a tech start-up.","tr":"他在一家科技新創公司工作。","tip":"<b>用法：</b>也可以拼成 startup。","th":3,"lv":1},{"p":"run it by someone","zh":"先問過某人","scene":"Phil 希望 Luke 先跟他商量。","en":"Let me run it by my boss first.","tr":"讓我先問過老闆。","tip":"<b>用法：</b>做決定前先徵詢意見。","th":3,"lv":1}]},{"id":"jay","name":"受洗","who":"Gloria · Jay · Haley · Dylan","plot":"Gloria 偷偷想讓雙胞胎受洗。","items":[{"p":"christening","zh":"受洗儀式","scene":"Gloria 想幫寶寶受洗。","en":"We're going to my niece's christening on Sunday.","tr":"我們週日要去參加姪女的受洗禮。","tip":"<b>延伸：</b>baptism 洗禮。","th":8,"lv":2}]},{"id":"mitch","name":"吉祥物大戰","who":"Cameron · Mitchell · 吉祥物","plot":"比賽時吉祥物一直嘲諷 Cam，Mitchell 出手幫忙。","items":[{"p":"a game of chicken","zh":"比膽量","scene":"集名，雙方互不相讓。","en":"It's a game of chicken. Who's going to blink first?","tr":"這是一場膽量比賽，看誰先眨眼。","tip":"<b>來源：</b>兩台車對衝，誰先閃誰就是「膽小鬼」。","th":5,"lv":2},{"p":"trash talk","zh":"垃圾話","scene":"吉祥物一直嗆 Cam。","en":"The players were trash-talking before the game.","tr":"比賽前球員們一直在講垃圾話。","tip":"<b>用法：</b>比賽前挑釁對手。","th":5,"lv":2},{"p":"mascot","zh":"吉祥物","scene":"對手的海豚吉祥物很煩人。","en":"The team's mascot is a giant chicken.","tr":"這支隊伍的吉祥物是一隻大雞。","tip":"<b>延伸：</b>熊本熊也是一種 mascot。","th":8,"lv":1},{"p":"get in someone's head","zh":"影響某人的心理","scene":"吉祥物讓 Cam 分心。","en":"Don't let him get in your head.","tr":"別讓他影響你的心情。","tip":"<b>用法：</b>比賽、談判時常說。","th":4,"lv":2}]}],"prompts":["你有過身心俱疲的時候嗎（用 burned out、quit one's job、run it by someone）","你想過創業嗎（用 start-up、drop out of college、christening）","你會被別人的垃圾話影響嗎（用 trash talk、get in someone's head、a game of chicken）"],"challenges":[{"id":"c1","sit":"你連續加班好幾週，說你身心俱疲。","uses":["burned out"],"ans":"I'm totally burned out."},{"id":"c2","sit":"你想請一週假出國，說要先問過主管。","uses":["run it by someone"],"ans":"Let me run it by my manager first."},{"id":"c3","sit":"排球比賽前對手一直嗆你，隊友叫你別被影響。","uses":["get in someone's head"],"ans":"Don't let him get in your head."},{"id":"c4","sit":"你說你朋友在一家新創公司工作。","uses":["start-up"],"ans":"My friend works at a start-up."}]},"s11e07":{"title":"The Last Thanksgiving","lede":"Haley 在 Alex 和 Luke 的幫忙下，第一次為爸媽煮感恩節大餐；Alex 那個很強勢的廚師前任被 Phil 請出門，Claire 最後也謝謝 Haley；Jay、Phil 和 Dylan 一起玩遙控飛機，Jay 比較信任 Dylan 讓 Phil 很吃味；Gloria 騙 Claire 幫忙做家事，Claire 承認她很懷念當老闆的日子；一場買菜的誤會讓 Mitchell 跟朋友說他和 Cam 分手了，消息傳開，朋友們全都站在 Cam 那邊。","stories":[{"id":"dunphy","name":"Haley 的感恩節","who":"Haley · Alex · Luke · Phil · Claire","plot":"Haley 第一次主辦感恩節，還得應付 Alex 的前任。","items":[{"p":"host Thanksgiving","zh":"主辦感恩節大餐","scene":"Haley 要在家請客。","en":"This is my first year hosting Thanksgiving.","tr":"這是我第一年主辦感恩節大餐。","tip":"<b>用法：</b>host 當動詞「主辦、招待」。","th":8,"lv":1},{"p":"slave over a hot stove","zh":"在廚房忙得要死","scene":"Haley 為了大餐忙了一整天。","en":"I slaved over a hot stove all day, and you're not hungry?","tr":"我在廚房忙了一整天，你竟然說不餓？","tip":"<b>語氣：</b>抱怨煮飯很辛苦。","th":8,"lv":2},{"p":"show someone the door","zh":"請某人離開","scene":"Phil 把不受歡迎的人請出去。","en":"If he's rude again, show him the door.","tr":"如果他再沒禮貌，就請他走。","tip":"<b>用法：</b>禮貌地「趕人」。","th":5,"lv":2}]},{"id":"jay","name":"遙控飛機","who":"Jay · Phil · Dylan · Gloria · Claire","plot":"男人們玩遙控飛機；Gloria 騙 Claire 做家事。","items":[{"p":"model airplane","zh":"模型飛機","scene":"三人一起玩飛機。","en":"My dad and I built a model airplane together.","tr":"我和我爸一起做了一架模型飛機。","tip":"<b>延伸：</b>drone 無人機。","th":8,"lv":1},{"p":"domestic goddess","zh":"家事女神","scene":"Claire 被騙去做家事。","en":"She bakes, cleans, and sews. She's a real domestic goddess.","tr":"她會烤、會打掃、會縫紉，是個家事女神。","tip":"<b>語氣：</b>常帶點幽默。","th":9,"lv":2},{"p":"boss lady","zh":"女老闆","scene":"Claire 懷念當老闆的感覺。","en":"Yes, boss lady!","tr":"是的，老闆娘！","tip":"<b>用法：</b>稱呼掌控全場的女生，常帶玩笑。","th":7,"lv":2}]},{"id":"mitch","name":"分手謠言","who":"Mitchell · Cameron · 朋友們","plot":"一場誤會讓大家以為兩人分手了。","items":[{"p":"split up","zh":"分手","scene":"Mitchell 說兩人分開了。","en":"My parents split up when I was ten.","tr":"我十歲時爸媽就分開了。","tip":"<b>同義：</b>break up。","th":1,"lv":1},{"p":"the rumor mill","zh":"八卦傳播站","scene":"謠言很快傳開。","en":"The office rumor mill is working overtime.","tr":"辦公室的八卦傳得飛快。","tip":"<b>畫面：</b>謠言工廠一直在運轉。","th":3,"lv":2},{"p":"spread like wildfire","zh":"像野火一樣迅速蔓延","scene":"分手消息一下子傳遍。","en":"The news spread like wildfire.","tr":"消息一下子就傳開了。","tip":"<b>用法：</b>謠言、疾病、消息傳得很快。","th":9,"lv":2},{"p":"side with","zh":"站在……那邊","scene":"朋友們都挺 Cam。","en":"Why do you always side with your mom?","tr":"為什麼你總是站在你媽那邊？","tip":"<b>對比：</b>pick a side 是選邊，side with 是已經站到某邊。","th":5,"lv":1}]}],"prompts":["你主辦過聚會或煮過大餐嗎（用 host Thanksgiving、slave over a hot stove、domestic goddess）","你們連上的八卦傳得快嗎（用 the rumor mill、spread like wildfire、split up）","吵架時家人通常站在誰那邊（用 side with、show someone the door、boss lady）"],"challenges":[{"id":"c1","sit":"放假消息一下子傳遍全連。","uses":["spread like wildfire"],"ans":"The news spread like wildfire."},{"id":"c2","sit":"你問女友為什麼總是站在她媽那邊。","uses":["side with"],"ans":"Why do you always side with your mom?"},{"id":"c3","sit":"你在美國的表哥說，今年是他第一次主辦感恩節大餐。","uses":["host Thanksgiving"],"ans":"This is my first year hosting Thanksgiving."},{"id":"c4","sit":"你說連上的八卦傳得超快。","uses":["the rumor mill"],"ans":"The rumor mill is working overtime."}]},"s11e08":{"title":"Tree's a Crowd","lede":"Dylan 的媽媽 Farrah 來看雙胞胎，Phil 和 Claire 只希望她快點走，最好跟 Jerry 一起離開，沒想到 Jerry 看到後院那棵種著 DeDe 骨灰的樹，情緒潰堤；Manny 失戀很難過，Gloria 請 Luke 在 Sherry 的即興表演上幫 Manny 說好話，Luke 卻親了 Sherry，Manny 知道後氣到要動手，Jay 出面安撫並請 Luke 先離開；一對女同志情侶想請 Mitchell 和 Cam 捐精，兩人婉拒，卻發現對方早就找好別人了。","stories":[{"id":"dunphy","name":"不走的客人","who":"Phil · Claire · Farrah · Jerry","plot":"兩人暗示客人該走了，Jerry 卻在 DeDe 的樹前情緒激動。","items":[{"p":"take the hint","zh":"聽懂暗示","scene":"客人一直沒發現該走了。","en":"I yawned five times, but he didn't take the hint.","tr":"我打了五個呵欠，他還是沒聽懂暗示。","tip":"<b>對比：</b>drop a hint 是給暗示，take the hint 是聽懂暗示。","th":7,"lv":1},{"p":"overcome with emotion","zh":"情緒激動","scene":"Jerry 看到樹很感動。","en":"She was overcome with emotion at the funeral.","tr":"她在喪禮上情緒很激動。","tip":"<b>用法：</b>被情緒淹沒、說不出話。","th":4,"lv":1},{"p":"family tree","zh":"家族樹、族譜","scene":"集名雙關，DeDe 的樹也是家族的一部分。","en":"I traced my family tree back to the 1700s.","tr":"我把族譜追溯到十八世紀。","tip":"<b>用法：</b>字面是族譜。","th":2,"lv":1}]},{"id":"kids","name":"Luke 與 Sherry","who":"Luke · Manny · Sherry · Jay","plot":"Luke 本來要幫 Manny 說好話，卻親了 Sherry。","items":[{"p":"put in a good word","zh":"幫忙說好話","scene":"Gloria 請 Luke 幫 Manny 美言。","en":"Can you put in a good word for me with your boss?","tr":"你可以在老闆面前幫我說句好話嗎？","tip":"<b>用法：</b>put in a good word for someone。","th":3,"lv":1},{"p":"improv","zh":"即興表演","scene":"Sherry 在演即興喜劇。","en":"We went to an improv show last night.","tr":"我們昨晚去看了即興表演。","tip":"<b>來源：</b>improvisation 的縮寫。","th":8,"lv":2},{"p":"bro code","zh":"兄弟守則","scene":"Luke 違反了兄弟間的規矩。","en":"You don't date your friend's ex. That's bro code.","tr":"不能跟朋友的前任交往，這是兄弟守則。","tip":"<b>文化：</b>男生之間不成文的規矩。","th":2,"lv":2},{"p":"stab someone in the back","zh":"背後捅刀","scene":"Manny 覺得被背叛。","en":"I trusted him, and he stabbed me in the back.","tr":"我那麼信任他，他卻在背後捅我一刀。","tip":"<b>名詞：</b>backstabber 背後捅刀的人。","th":5,"lv":2},{"p":"cool off","zh":"冷靜一下","scene":"Jay 讓大家先冷靜。","en":"Go for a walk and cool off.","tr":"去散個步冷靜一下。","tip":"<b>同義：</b>calm down、cool down。","th":4,"lv":1}]},{"id":"mitch","name":"捐精請求","who":"Mitchell · Cameron · 情侶","plot":"一對情侶的請求讓兩人很猶豫，結果對方早有人選。","items":[{"p":"a big ask","zh":"很大的請求","scene":"這個請求太重大了。","en":"I know it's a big ask, but can you help me move?","tr":"我知道這要求很大，但你可以幫我搬家嗎？","tip":"<b>用法：</b>ask 當名詞「請求」。","th":7,"lv":2},{"p":"beat someone to the punch","zh":"搶先一步","scene":"早就有人捷足先登。","en":"I wanted to ask her out, but he beat me to the punch.","tr":"我想約她，結果被他搶先一步。","tip":"<b>來源：</b>拳擊時先出拳。","th":10,"lv":2}]}],"prompts":["你遇過聽不懂暗示的人嗎（用 take the hint、cool off、a big ask）","你覺得兄弟之間有什麼不能做的事（用 bro code、stab someone in the back、put in a good word）","你有被人搶先一步的經驗嗎（用 beat someone to the punch、improv、overcome with emotion）"],"challenges":[{"id":"c1","sit":"你請朋友在他公司主管面前幫你說句好話。","uses":["put in a good word"],"ans":"Can you put in a good word for me?"},{"id":"c2","sit":"你說不能跟兄弟的前任交往，這是兄弟守則。","uses":["bro code"],"ans":"That's bro code."},{"id":"c3","sit":"你本來要買夜市最後一份雞排，前面的人搶先一步。","uses":["beat someone to the punch"],"ans":"He beat me to the punch."},{"id":"c4","sit":"兩個朋友打球打到快吵起來，你叫他們冷靜一下。","uses":["cool off"],"ans":"Go cool off."}]},"s11e09":{"title":"The Last Christmas","lede":"全家到 Mitchell 和 Cam 家吃聖誕晚餐，卻沒人想坐自己被安排的位子：Gloria 偷偷去別家房仲公司面試，所以躲著 Phil；Claire 躲著 Jay，免得被他推銷工作；Haley 和 Mitchell 發現 Cam 藏了一張飛密蘇里的頭等艙機票；Luke 和 Sherry 的關係也曝光了；飯前禱告時大家吵成一團，直到 Cam 說出這可能是大家最後一次一起過聖誕，因為他要去外州面試；大家說出各自的未來計畫、互相道歉和好，最後穿著睡衣一起拍全家福。","stories":[{"id":"family","name":"最後的聖誕節","who":"全家人","plot":"大家各懷心事，最後終於說開，一起拍睡衣合照。","items":[{"p":"seating chart","zh":"座位表","scene":"每個人都不想坐自己的位子。","en":"Making the wedding seating chart was a nightmare.","tr":"排婚禮座位表簡直是噩夢。","tip":"<b>用法：</b>婚禮、宴會必備。","th":8,"lv":1},{"p":"avoid someone like the plague","zh":"對某人避之唯恐不及","scene":"每個人都在躲某個人。","en":"He's been avoiding me like the plague since I lent him money.","tr":"自從借他錢後，他就對我避之唯恐不及。","tip":"<b>畫面：</b>像躲瘟疫一樣。","th":5,"lv":2},{"p":"dodge","zh":"閃躲","scene":"Claire 想閃掉 Jay 的話題。","en":"He dodged the question.","tr":"他迴避了這個問題。","tip":"<b>用法：</b>躲球、躲問題、躲責任都能用。","th":10,"lv":1},{"p":"hidden agenda","zh":"隱藏的目的","scene":"每個人都有沒說的事。","en":"Be careful. He has a hidden agenda.","tr":"小心點，他另有目的。","tip":"<b>對比：</b>ulterior motive 也很像。","th":10,"lv":2},{"p":"say a few words","zh":"說幾句話","scene":"飯前大家輪流說話。","en":"Before we eat, I'd like to say a few words.","tr":"開動前，我想說幾句話。","tip":"<b>用法：</b>致詞、敬酒的開場白。","th":8,"lv":1},{"p":"clear the air","zh":"把話說開","scene":"大家終於坦白。","en":"Let's clear the air. I'm sorry about yesterday.","tr":"我們把話說開吧，昨天的事對不起。","tip":"<b>畫面：</b>讓悶住的空氣變清新。","th":6,"lv":2},{"p":"come together","zh":"團結在一起","scene":"全家人最後和好。","en":"The whole town came together after the typhoon.","tr":"颱風過後整個鎮的人都團結起來。","tip":"<b>用法：</b>也可以說事情順利完成。","th":6,"lv":1},{"p":"one last time","zh":"最後一次","scene":"這可能是最後一次一起過聖誕。","en":"Let's sing it together one last time.","tr":"我們最後一次一起唱吧。","tip":"<b>語氣：</b>帶點感傷。","th":10,"lv":1},{"p":"matching pajamas","zh":"情侶或全家的同款睡衣","scene":"大家穿睡衣拍照。","en":"Our family wears matching pajamas every Christmas.","tr":"我們家每年聖誕節都穿同款睡衣。","tip":"<b>文化：</b>美國聖誕節的經典照片。","th":8,"lv":1},{"p":"the whole gang","zh":"一大群人全員到齊","scene":"全家人都到齊了。","en":"The whole gang is here!","tr":"大家都到齊了！","tip":"<b>用法：</b>朋友、家人聚會時說。","th":2,"lv":1}]}],"prompts":["你家聚餐時會坐固定位置嗎（用 seating chart、the whole gang、say a few words）","你有對誰避之唯恐不及嗎（用 avoid someone like the plague、dodge、hidden agenda）","你最想跟誰把話說開（用 clear the air、come together、one last time）"],"challenges":[{"id":"c1","sit":"朋友欠你錢一直躲你，你說他對你避之唯恐不及。","uses":["avoid someone like the plague"],"ans":"He's avoiding me like the plague."},{"id":"c2","sit":"退伍前最後一次跟大家一起出操。","uses":["one last time"],"ans":"Let's do it together one last time."},{"id":"c3","sit":"你跟吵架的室友說，我們把話說開吧。","uses":["clear the air"],"ans":"Let's clear the air."},{"id":"c4","sit":"過年回家，你說大家都到齊了。","uses":["the whole gang"],"ans":"The whole gang is here!"}]},"s11e10":{"title":"The Prescott","lede":"Alex 的新工作附了一間高級公寓社區的住處，全家偷偷背下她的門禁密碼溜進去，完全無視「訪客不得單獨進入」的規定：Jay 想用放映室看電影、Gloria 玩水上滑梯、Claire 去做頭髮、Phil 試吃迷你漢堡、Mitchell 和 Cam 想巧遇名人、Luke 和 Manny 去健身房找熟女；最後大家全擠進頂樓的熱水池，Alex 收到一張天價帳單。","stories":[{"id":"kids","name":"Alex 的新家","who":"Alex","plot":"Alex 的公司給她一間超高級的住處。","items":[{"p":"the high life","zh":"奢華生活","scene":"Alex 住進高級社區。","en":"He's living the high life in his new penthouse.","tr":"他住進頂樓豪宅，過著奢華生活。","tip":"<b>搭配：</b>live the high life。","th":9,"lv":2},{"p":"perks","zh":"福利","scene":"新工作附帶很多好處。","en":"Free lunch is one of the perks of the job.","tr":"免費午餐是這份工作的福利之一。","tip":"<b>用法：</b>perk 是 perquisite 的口語。","th":3,"lv":1},{"p":"amenities","zh":"公共設施","scene":"社區有泳池、健身房、放映室。","en":"The building has great amenities, like a pool and a gym.","tr":"這棟大樓的設施很棒，有泳池和健身房。","tip":"<b>用法：</b>飯店、租屋廣告常見。","th":8,"lv":2},{"p":"rules are rules","zh":"規定就是規定","scene":"社區不准訪客單獨進入。","en":"Sorry, rules are rules. No guests after ten.","tr":"抱歉，規定就是規定，十點後不能有訪客。","tip":"<b>語氣：</b>拒絕通融時說。","th":7,"lv":1}]},{"id":"family","name":"全家溜進去","who":"全家人","plot":"大家背下門禁密碼，偷偷溜進去享受設施。","items":[{"p":"access code","zh":"門禁密碼","scene":"全家偷偷背下密碼。","en":"Don't share the access code with anyone.","tr":"不要把門禁密碼告訴任何人。","tip":"<b>延伸：</b>key card 門禁卡。","th":8,"lv":1},{"p":"VIP treatment","zh":"貴賓級待遇","scene":"大家享受得像貴賓一樣。","en":"The hotel gave us the VIP treatment.","tr":"飯店給了我們貴賓級的待遇。","tip":"<b>用法：</b>VIP 唸 V-I-P。","th":8,"lv":1},{"p":"live it up","zh":"盡情享受","scene":"每個人都玩得很開心。","en":"We're on vacation. Let's live it up!","tr":"我們在度假，盡情享受吧！","tip":"<b>用法：</b>花錢、玩樂、狂歡。","th":8,"lv":1},{"p":"pump iron","zh":"練舉重","scene":"Luke 和 Manny 去健身房。","en":"He pumps iron at the gym every morning.","tr":"他每天早上去健身房練重訓。","tip":"<b>用法：</b>口語的「練肌肉」。","th":8,"lv":2},{"p":"hot tub","zh":"熱水按摩池","scene":"最後大家全泡進頂樓的池子。","en":"Let's relax in the hot tub.","tr":"我們去熱水池放鬆一下吧。","tip":"<b>延伸：</b>Jacuzzi 是品牌名，也常被當通稱。","th":8,"lv":1},{"p":"foot the bill","zh":"買單","scene":"Alex 收到一張大帳單。","en":"My parents footed the bill for the wedding.","tr":"我爸媽幫忙出了婚禮的錢。","tip":"<b>用法：</b>負擔費用，常是幫別人付。","th":3,"lv":2}]}],"prompts":["你最想住什麼樣的地方（用 the high life、amenities、hot tub）","你的工作或軍中有什麼福利嗎（用 perks、VIP treatment、foot the bill）","你放假會怎麼盡情享受（用 live it up、pump iron、rules are rules）"],"challenges":[{"id":"c1","sit":"你說免費宵夜是當這個職務的福利之一。","uses":["perks"],"ans":"Free late-night snacks are one of the perks."},{"id":"c2","sit":"你說領到年終要去日本盡情享受。","uses":["live it up"],"ans":"Let's live it up!"},{"id":"c3","sit":"學弟想晚點收假，你說規定就是規定。","uses":["rules are rules"],"ans":"Sorry, rules are rules."},{"id":"c4","sit":"你說你爸媽幫你出了機車的錢。","uses":["foot the bill"],"ans":"My parents footed the bill for my scooter."}]},"s11e11":{"title":"Legacy","lede":"Phil 的爸爸 Frank 被發現在他以前的雜貨店附近遊蕩，可能失智了，Phil 飛去佛州看他，父子倆度過美好的一天後，Frank 因年老過世；Jay 找 Claire 和 Mitchell 幫忙清車庫，翻出當年家庭旅行被迫中斷的真相：Jay 得加班賺錢付員工薪水；Jay 用 Joe 推銷狗床，卻發現這個產品失敗了；Manny 想追十年前在購物中心遇到的女生，在做出丟臉的大告白之前被攔了下來；Cam 和 Gloria 互相幫忙對付職場上的對手。","stories":[{"id":"dunphy","name":"Phil 與 Frank","who":"Phil · Frank","plot":"Phil 陪爸爸度過美好的一天，Frank 隨後安詳離世。","items":[{"p":"memory loss","zh":"失憶、記憶衰退","scene":"Frank 好像開始記不得事情。","en":"Memory loss is common as people age.","tr":"記憶衰退在老化過程中很常見。","tip":"<b>延伸：</b>dementia 失智症。","th":8,"lv":1},{"p":"senior moment","zh":"老人家一時忘記","scene":"Frank 一下子迷路了。","en":"I forgot my glasses were on my head. Senior moment!","tr":"我忘了眼鏡就在頭上，老人時刻！","tip":"<b>語氣：</b>自嘲健忘的輕鬆說法。","th":7,"lv":2},{"p":"make every day count","zh":"把握每一天","scene":"Phil 想好好陪爸爸。","en":"Life is short. Make every day count.","tr":"人生很短，要把握每一天。","tip":"<b>同義：</b>make the most of every day。","th":6,"lv":1},{"p":"a good run","zh":"一段美好的時光","scene":"Frank 的一生很精彩。","en":"He lived to 90. He had a good run.","tr":"他活到九十歲，這一生很精彩。","tip":"<b>用法：</b>也指一段順利的時期。","th":9,"lv":2}]},{"id":"jay","name":"清車庫","who":"Jay · Claire · Mitchell · Joe","plot":"清車庫翻出往事；Jay 的狗床生意失敗了。","items":[{"p":"clean out the garage","zh":"清理車庫","scene":"三人整理舊東西。","en":"We spent Saturday cleaning out the garage.","tr":"我們花了週六清理車庫。","tip":"<b>用法：</b>clean out 把空間徹底清空。","th":8,"lv":1},{"p":"cut short","zh":"被迫中斷","scene":"小時候的旅行提早結束。","en":"Our vacation was cut short because of the typhoon.","tr":"我們的假期因為颱風提早結束。","tip":"<b>用法：</b>常用被動 be cut short。","th":10,"lv":1},{"p":"make payroll","zh":"付得出薪水","scene":"Jay 當年要加班才付得起員工薪水。","en":"Business was so bad we almost couldn't make payroll.","tr":"生意差到我們差點發不出薪水。","tip":"<b>用法：</b>payroll 是員工薪資總額。","th":3,"lv":2},{"p":"a dud","zh":"失敗品、沒用的東西","scene":"狗床生意不成功。","en":"The new phone was a dud. Nobody bought it.","tr":"那支新手機是個失敗品，沒人買。","tip":"<b>來源：</b>沒爆炸的啞彈。","th":9,"lv":2}]},{"id":"kids","name":"Manny 的大告白","who":"Manny","plot":"Manny 想追十年前的女生，差點做出丟臉的告白。","items":[{"p":"grand gesture","zh":"浪漫大舉動","scene":"Manny 想來個轟轟烈烈的告白。","en":"He made a grand gesture and sang outside her window.","tr":"他做了很浪漫的舉動，在她窗外唱歌。","tip":"<b>文化：</b>愛情喜劇的經典橋段。","th":1,"lv":1}]},{"id":"mitch","name":"職場對手","who":"Cameron · Gloria","plot":"兩人互相幫忙對付工作上的對手。","items":[{"p":"office politics","zh":"辦公室政治","scene":"兩人都遇到職場鬥爭。","en":"I hate office politics. I just want to do my job.","tr":"我討厭辦公室政治，我只想好好工作。","tip":"<b>用法：</b>職場上的勾心鬥角。","th":3,"lv":1}]}],"prompts":["你會怎麼陪伴家裡的長輩（用 make every day count、memory loss、a good run）","你家有過被迫中斷的旅行嗎（用 cut short、clean out the garage、senior moment）","你遇過辦公室政治或失敗的產品嗎（用 office politics、a dud、grand gesture）"],"challenges":[{"id":"c1","sit":"你說人生很短，要把握每一天。","uses":["make every day count"],"ans":"Make every day count."},{"id":"c2","sit":"你說你們的墾丁之旅因為颱風提早結束。","uses":["cut short"],"ans":"Our trip was cut short because of the typhoon."},{"id":"c3","sit":"你忘了手機就在手上，說老人時刻。","uses":["senior moment"],"ans":"Senior moment!"},{"id":"c4","sit":"你說你討厭辦公室政治。","uses":["office politics"],"ans":"I hate office politics."}]},"s11e12":{"title":"Dead on a Rival","lede":"Alex 雇用了 Jay 的老秘書 Margaret，卻不滿意她的表現，把她開除了，原來 Margaret 其實想退休，只是不想讓 Jay 覺得被拋下；Phil 的有錢前鄰居邀他一起上太空；Javier 邀 Manny 參加一整年的環球郵輪之旅，Jay 支持，Gloria 本來很擔心，看了 Manny 的表演後才發現自己太寵他，最後同意了；Mitchell 和 Cam 正要去搶限時特賣，房子的前屋主突然出現，說他想死在這裡，兩人鼓勵他好好活下去，他還跟附近的老朋友吵了起來。","stories":[{"id":"kids","name":"Alex 與 Margaret","who":"Alex · Margaret · Jay","plot":"Alex 開除了老秘書，才發現她其實想退休。","items":[{"p":"not a good fit","zh":"不適合","scene":"Margaret 跟 Alex 的工作合不來。","en":"He's a nice guy, but he's not a good fit for our team.","tr":"他人很好，但不適合我們團隊。","tip":"<b>用法：</b>委婉拒絕或辭退人的說法。","th":9,"lv":1},{"p":"feel abandoned","zh":"覺得被拋下","scene":"Margaret 怕 Jay 難過。","en":"When my best friend moved away, I felt abandoned.","tr":"我最好的朋友搬走時，我覺得被拋下了。","tip":"<b>用法：</b>abandon 拋棄。","th":4,"lv":1},{"p":"put out to pasture","zh":"讓……退休","scene":"Margaret 想退休了。","en":"They put the old coach out to pasture.","tr":"他們讓老教練退休了。","tip":"<b>畫面：</b>把老馬放到草地上養老。","th":3,"lv":2}]},{"id":"dunphy","name":"上太空","who":"Phil · 前鄰居","plot":"有錢的前鄰居邀 Phil 上太空。","items":[{"p":"outer space","zh":"外太空","scene":"Phil 有機會上太空。","en":"I've always wanted to go to outer space.","tr":"我一直很想去外太空。","tip":"<b>用法：</b>比 space 更強調「地球外面」。","th":8,"lv":1},{"p":"the final frontier","zh":"最後的邊疆","scene":"太空是人類的終極目標。","en":"Space: the final frontier.","tr":"太空，最後的邊疆。","tip":"<b>來源：</b>《星艦迷航記》的經典開場白。","th":9,"lv":2}]},{"id":"jay","name":"環球郵輪","who":"Manny · Javier · Gloria · Jay","plot":"Javier 邀 Manny 環遊世界，Gloria 學著放手。","items":[{"p":"see the world","zh":"看看世界","scene":"Manny 要去環遊世界。","en":"I want to see the world before I settle down.","tr":"我想在定下來之前看看世界。","tip":"<b>用法：</b>旅行、出國的常見說法。","th":8,"lv":1},{"p":"a trip of a lifetime","zh":"一生難得的旅行","scene":"一整年的郵輪之旅。","en":"Going to Iceland was the trip of a lifetime.","tr":"去冰島是我一生難得的旅行。","tip":"<b>用法：</b>常用 the trip of a lifetime。","th":8,"lv":1}]},{"id":"mitch","name":"前屋主","who":"Mitchell · Cameron · 前屋主","plot":"前屋主說想死在這間房子裡，兩人鼓勵他好好活。","items":[{"p":"flash sale","zh":"限時特賣","scene":"兩人正要去搶特價。","en":"There's a flash sale on sneakers for two hours only.","tr":"球鞋限時特賣只有兩小時。","tip":"<b>用法：</b>網購很常見。","th":8,"lv":1},{"p":"on one's deathbed","zh":"臨終時","scene":"前屋主說他想死在這裡。","en":"On his deathbed, he asked to see his son.","tr":"臨終時，他要求見兒子一面。","tip":"<b>用法：</b>比喻「快不行了」也可以。","th":8,"lv":2},{"p":"make up for lost time","zh":"把失去的時間補回來","scene":"兩人鼓勵他好好活下去。","en":"We didn't talk for years. Now we're making up for lost time.","tr":"我們好幾年沒說話，現在要把時間補回來。","tip":"<b>用法：</b>重修舊好、重拾嗜好時常說。","th":2,"lv":1}]}],"prompts":["你想去哪裡看看世界（用 see the world、a trip of a lifetime、outer space）","你有過覺得被拋下的經驗嗎（用 feel abandoned、not a good fit、put out to pasture）","退伍後你最想把什麼時間補回來（用 make up for lost time、flash sale、the final frontier）"],"challenges":[{"id":"c1","sit":"你說畢業後想先去看看世界。","uses":["see the world"],"ans":"I want to see the world."},{"id":"c2","sit":"外派半年回台灣後，你說要跟家人把時間補回來。","uses":["make up for lost time"],"ans":"I'm going to make up for lost time."},{"id":"c3","sit":"你說那個工作不適合你。","uses":["not a good fit"],"ans":"It's not a good fit for me."},{"id":"c4","sit":"你說去日本是一生難得的旅行。","uses":["a trip of a lifetime"],"ans":"It was the trip of a lifetime."}]},"s11e13":{"title":"Paris","lede":"Manny 告訴 Jay 他得到一個國際大獎，Jay 全家飛去巴黎，其實 Jay 只是要代替 Earl 上台領獎，都是 Manny 那半調子法文惹的禍；Gloria 和 Manny 想瞞住真相，Jay 還是發現了，Claire 安慰他，家人永遠以他為榮；Phil 說有工作走不開，結果卻出現在巴黎，還認識了 Claire 三十年前留學時交往過的 Guy，兩人因為魔術和機器人變成好朋友，讓 Claire 很吃味；Mitchell 換上新衣服、擺出新態度想裝成法國人；Cam 扮成 Fizbo 在街頭表演，還遇到一個名字很像的表演者。","stories":[{"id":"jay","name":"國際大獎","who":"Jay · Manny · Gloria · Claire","plot":"Jay 以為自己得獎，其實只是代人領獎。","items":[{"p":"on behalf of","zh":"代表","scene":"Jay 只是代 Earl 領獎。","en":"I'm accepting this award on behalf of my team.","tr":"我代表我的團隊領這個獎。","tip":"<b>用法：</b>on behalf of + 人或團體。","th":3,"lv":1},{"p":"accept an award","zh":"領獎","scene":"Jay 要上台領獎。","en":"She accepted the award with a short speech.","tr":"她上台領獎，講了簡短的感言。","tip":"<b>延伸：</b>acceptance speech 得獎感言。","th":3,"lv":1}]},{"id":"dunphy","name":"Phil 與 Guy","who":"Phil · Claire · Guy","plot":"Phil 跟 Claire 的前任變成好朋友，Claire 很吃醋。","items":[{"p":"the City of Light","zh":"光之城（巴黎）","scene":"全家飛到巴黎。","en":"We spent our honeymoon in the City of Light.","tr":"我們在巴黎度蜜月。","tip":"<b>文化：</b>巴黎的暱稱，法文是 la Ville Lumière。","th":8,"lv":2},{"p":"study abroad","zh":"出國留學","scene":"Claire 以前在巴黎留學。","en":"I studied abroad in London for a year.","tr":"我在倫敦留學了一年。","tip":"<b>用法：</b>study 當動詞，abroad 是副詞。","th":3,"lv":1},{"p":"a little jealous","zh":"有點吃醋","scene":"Claire 看兩人感情太好不太開心。","en":"I'm a little jealous of how close you two are.","tr":"你們兩個這麼好，我有點吃醋。","tip":"<b>語氣：</b>加 a little 比較可愛、不會太重。","th":4,"lv":1}]},{"id":"mitch","name":"巴黎街頭","who":"Mitchell · Cameron","plot":"Mitchell 想裝成法國人，Cam 在街頭當 Fizbo 表演。","items":[{"p":"blend in","zh":"融入","scene":"Mitchell 想看起來像當地人。","en":"I wore black to blend in with the locals.","tr":"我穿黑色想融入當地人。","tip":"<b>反義：</b>stand out 突出。","th":10,"lv":1},{"p":"pass for","zh":"被當成","scene":"Mitchell 想被當成法國人。","en":"With that accent, you could pass for a local.","tr":"有那個口音，你可以被當成當地人。","tip":"<b>用法：</b>pass for + 身分。","th":9,"lv":2},{"p":"je ne sais quoi","zh":"說不出的魅力","scene":"法國人那種說不上來的氣質。","en":"She has a certain je ne sais quoi.","tr":"她有一種說不出的魅力。","tip":"<b>來源：</b>法文「我不知道是什麼」，英文直接借用。","th":9,"lv":2},{"p":"street performer","zh":"街頭藝人","scene":"Cam 在街頭表演。","en":"A street performer was juggling fire in the square.","tr":"廣場上有個街頭藝人在拋火球。","tip":"<b>延伸：</b>busker 英式說法。","th":8,"lv":1},{"p":"namesake","zh":"同名的人","scene":"Cam 遇到名字很像的表演者。","en":"My son is my grandfather's namesake.","tr":"我兒子跟我阿公同名。","tip":"<b>用法：</b>以某人命名或同名的人、事物。","th":2,"lv":2}]}],"prompts":["你想出國留學嗎（用 study abroad、the City of Light、blend in）","你曾經代表誰做過什麼事嗎（用 on behalf of、accept an award、namesake）","你吃過朋友的醋嗎（用 a little jealous、je ne sais quoi、pass for）"],"challenges":[{"id":"c1","sit":"你代表連上去領獎。","uses":["on behalf of"],"ans":"I'm accepting this on behalf of my unit."},{"id":"c2","sit":"你說你想去澳洲留學。","uses":["study abroad"],"ans":"I want to study abroad in Australia."},{"id":"c3","sit":"你在國外穿得很低調，想融入當地人。","uses":["blend in"],"ans":"I'm trying to blend in with the locals."},{"id":"c4","sit":"你說你女友跟她男同事太好，你有點吃醋。","uses":["a little jealous"],"ans":"I'm a little jealous."}]},"s11e14":{"title":"Spuds","lede":"Phil 和 Claire 帶 Haley 和 Dylan 去吃飯，想讓他們安心，告訴他們不是失敗的爸媽；結果在餐廳裡，他們遇到了正在「監護」Lily 第一次約會的 Mitchell 和 Cam，還有剛看完 Joe 學校話劇的 Jay 和 Gloria。","stories":[{"id":"dunphy","name":"新手爸媽的焦慮","who":"Phil · Claire · Haley · Dylan","plot":"爸媽帶小倆口吃飯，告訴他們做得很好。","items":[{"p":"doing a great job","zh":"做得很好","scene":"Claire 和 Phil 鼓勵他們。","en":"You're doing a great job. Don't worry.","tr":"你做得很好，別擔心。","tip":"<b>用法：</b>鼓勵人最直接的一句。","th":6,"lv":1},{"p":"nobody's perfect","zh":"沒有人是完美的","scene":"當爸媽不用完美。","en":"I made a mistake. Nobody's perfect.","tr":"我犯錯了，沒有人是完美的。","tip":"<b>用法：</b>安慰別人或替自己找台階下。","th":6,"lv":1},{"p":"it takes a village","zh":"養小孩要靠大家","scene":"一家人都會幫忙。","en":"Don't do it alone. It takes a village to raise a child.","tr":"別一個人扛，養孩子需要大家一起幫忙。","tip":"<b>來源：</b>非洲諺語。","th":2,"lv":2},{"p":"mom guilt","zh":"媽媽的罪惡感","scene":"Haley 覺得自己做得不夠好。","en":"Every time I go to work, I get mom guilt.","tr":"每次我去上班都有媽媽的罪惡感。","tip":"<b>用法：</b>媽媽覺得陪孩子不夠的內疚。","th":2,"lv":2},{"p":"a bad parent","zh":"失職的爸媽","scene":"Haley 和 Dylan 擔心自己不夠好。","en":"Letting your kid play video games doesn't make you a bad parent.","tr":"讓孩子打電動不代表你是失職的爸媽。","tip":"<b>用法：</b>常用否定句安慰人。","th":2,"lv":1}]},{"id":"mitch","name":"Lily 的第一次約會","who":"Mitchell · Cameron · Lily","plot":"兩個爸爸偷偷跟著 Lily 去約會。","items":[{"p":"first date","zh":"第一次約會","scene":"Lily 第一次約會。","en":"Where should I go on a first date?","tr":"第一次約會要去哪裡？","tip":"<b>用法：</b>也可以指跟某人的第一次約會。","th":1,"lv":1},{"p":"hover","zh":"在旁邊盯著","scene":"兩個爸爸一直在附近徘徊。","en":"Stop hovering over me while I cook!","tr":"我煮飯時別一直在旁邊盯著！","tip":"<b>延伸：</b>helicopter parent 就是一直盤旋的家長。","th":2,"lv":2}]},{"id":"jay","name":"學校話劇","who":"Jay · Gloria · Joe","plot":"兩人剛看完 Joe 的學校話劇。","items":[{"p":"school play","zh":"學校話劇","scene":"Joe 在學校演戲。","en":"I played a tree in my school play.","tr":"我在學校話劇裡演一棵樹。","tip":"<b>用法：</b>小孩的經典配角就是樹。","th":3,"lv":1},{"p":"what are the odds","zh":"怎麼這麼巧","scene":"一家人在同一間餐廳遇到。","en":"We're on the same flight? What are the odds?","tr":"我們在同一班飛機？怎麼這麼巧？","tip":"<b>用法：</b>odds 是機率。","th":7,"lv":1},{"p":"dote on","zh":"溺愛、疼愛","scene":"爺爺奶奶很疼孫子。","en":"My grandparents dote on my little sister.","tr":"我阿公阿嬤超疼我妹。","tip":"<b>用法：</b>dote on someone。","th":2,"lv":2}]}],"prompts":["你覺得當爸媽最難的是什麼（用 it takes a village、nobody's perfect、a bad parent）","你第一次約會是什麼時候（用 first date、hover、what are the odds）","你家誰最被疼愛（用 dote on、doing a great job、school play）"],"challenges":[{"id":"c1","sit":"學弟第一次站哨很緊張，你說他做得很好。","uses":["doing a great job"],"ans":"You're doing a great job."},{"id":"c2","sit":"你在台北街頭遇到國小同學，說怎麼這麼巧。","uses":["what are the odds"],"ans":"What are the odds?"},{"id":"c3","sit":"你說你阿嬤超疼你弟。","uses":["dote on"],"ans":"My grandma dotes on my little brother."},{"id":"c4","sit":"你做錯事，說沒有人是完美的。","uses":["nobody's perfect"],"ans":"Nobody's perfect."}]},"s11e15":{"title":"Baby Steps","lede":"Claire 要參加一份整理收納工作的線上面試，腳卻卡進一階壞掉的樓梯，那階樓梯 Luke 之前也受過傷，Phil 還請 Jay 來修過；Jay 和 Phil 搬來她的收納架幫她打氣，面試一開始很糟，但 Claire 坦白說出自己的真心話後，反而拿到了工作；Alex 去參加加州理工的活動，Arvin 的學生批評她公司的技術，Arvin 卻說 Alex 很適合他的新計畫；Mitchell 和 Cam 在考慮領養，想問 Gloria 的意見，Gloria 正忙著辦開放看屋，直接帶他們參觀，結果兩人一時衝動就決定買房子、也決定領養寶寶。","stories":[{"id":"dunphy","name":"線上面試","who":"Claire · Phil · Jay","plot":"Claire 卡在樓梯上面試，最後靠真心話拿到工作。","items":[{"p":"video call","zh":"視訊通話","scene":"Claire 要線上面試。","en":"I have a video call with my boss at nine.","tr":"我九點跟老闆視訊。","tip":"<b>延伸：</b>Zoom call、FaceTime。","th":3,"lv":1},{"p":"freeze up","zh":"僵住、腦袋卡住","scene":"Claire 一緊張就卡住。","en":"I froze up when they asked about my weaknesses.","tr":"他們問我缺點時，我整個卡住了。","tip":"<b>用法：</b>也可以指電腦當機。","th":4,"lv":1},{"p":"confidence boost","zh":"提升自信","scene":"Jay 和 Phil 幫她打氣。","en":"Winning that game was a real confidence boost.","tr":"贏了那場比賽讓我自信大增。","tip":"<b>用法：</b>give someone a confidence boost。","th":6,"lv":1},{"p":"blow an interview","zh":"搞砸面試","scene":"一開始面試很不順。","en":"I think I blew the interview.","tr":"我覺得我面試搞砸了。","tip":"<b>用法：</b>blow 口語是「搞砸」。","th":3,"lv":1},{"p":"be real","zh":"說實話、真實一點","scene":"Claire 決定坦白。","en":"Let's be real. Nobody likes Mondays.","tr":"說實話，沒人喜歡星期一。","tip":"<b>用法：</b>句首當「說真的」。","th":7,"lv":1},{"p":"you're hired","zh":"你被錄取了","scene":"Claire 拿到了工作。","en":"Great answer. You're hired!","tr":"回答得很好，你被錄取了！","tip":"<b>反義：</b>you're fired 你被開除了。","th":3,"lv":1}]},{"id":"kids","name":"Alex 與 Arvin","who":"Alex · Arvin · 學生們","plot":"學生批評 Alex 的公司，Arvin 卻欣賞她。","items":[{"p":"pick apart","zh":"挑毛病","scene":"學生把 Alex 公司的技術批評得很慘。","en":"The teacher picked apart my essay.","tr":"老師把我的作文挑得一無是處。","tip":"<b>對比：</b>tear apart 更強烈，像撕碎一樣。","th":5,"lv":2}]},{"id":"mitch","name":"衝動買房","who":"Mitchell · Cameron · Gloria","plot":"兩人參觀房子，一時衝動決定買房又領養。","items":[{"p":"impulse buy","zh":"衝動購物","scene":"兩人突然決定買房子。","en":"This jacket was an impulse buy. I didn't need it.","tr":"這件外套是衝動購物，我根本不需要。","tip":"<b>用法：</b>impulse 是衝動。","th":8,"lv":1},{"p":"take the plunge","zh":"鼓起勇氣做決定","scene":"兩人決定買房和領養。","en":"We finally took the plunge and got married.","tr":"我們終於鼓起勇氣結婚了。","tip":"<b>畫面：</b>一口氣跳進水裡。","th":10,"lv":2},{"p":"grow the family","zh":"擴大家庭","scene":"兩人想再多一個孩子。","en":"We're thinking about growing our family.","tr":"我們在考慮再生一個孩子。","tip":"<b>用法：</b>委婉說想再生或領養。","th":2,"lv":1}]}],"prompts":["你面試或報告時會緊張到卡住嗎（用 freeze up、blow an interview、video call）","你被別人挑過毛病嗎（用 pick apart、be real、confidence boost）","你做過最衝動的決定是什麼（用 impulse buy、take the plunge、you're hired）"],"challenges":[{"id":"c1","sit":"你說你九點要跟爸媽視訊。","uses":["video call"],"ans":"I have a video call with my parents at nine."},{"id":"c2","sit":"面試官問你問題，你整個卡住了。","uses":["freeze up"],"ans":"I froze up."},{"id":"c3","sit":"你說那雙球鞋是衝動購物。","uses":["impulse buy"],"ans":"Those sneakers were an impulse buy."},{"id":"c4","sit":"你說你終於鼓起勇氣報名英文檢定。","uses":["take the plunge"],"ans":"I finally took the plunge and signed up for the English test."}]},"s11e16":{"title":"I'm Going to Miss This","lede":"Mitchell、Cam 和 Lily 搬進新家，Mitchell 很難適應，Gloria 鼓勵他好好跟舊家說再見；寶寶提早出生，讓兩人一陣慌亂，最後是 Lily 讓他們明白自己已經準備好迎接兒子；Haley、Alex 和 Luke 在 Dunphy 家開完派對，趕在爸媽發現前收拾殘局；復活節派對上，Phil 和 Claire 慢慢適應當爺爺奶奶，卻發現孩子們還是需要他們；Jay 和 Manny 爭論誰比較懂酒。","stories":[{"id":"mitch","name":"新家與新生兒","who":"Mitchell · Cameron · Lily · Gloria","plot":"搬進新家，寶寶又提早報到。","items":[{"p":"housewarming","zh":"喬遷派對","scene":"兩人搬進新房子。","en":"We're having a housewarming party on Saturday.","tr":"我們週六要辦喬遷派對。","tip":"<b>用法：</b>housewarming gift 喬遷禮物。","th":8,"lv":1},{"p":"home sweet home","zh":"甜蜜的家","scene":"新家的感覺。","en":"We're finally back. Home sweet home!","tr":"我們終於回來了，還是家裡最好！","tip":"<b>用法：</b>回到家時的感嘆。","th":7,"lv":1},{"p":"say goodbye to","zh":"跟……道別","scene":"Mitchell 要跟舊家說再見。","en":"It's time to say goodbye to my old room.","tr":"該跟我的舊房間說再見了。","tip":"<b>用法：</b>人、地方、習慣都能道別。","th":8,"lv":1},{"p":"premature","zh":"早產的、太早的","scene":"寶寶提早出生。","en":"Their son was born two weeks premature.","tr":"他們的兒子早產了兩週。","tip":"<b>用法：</b>也能說 a premature decision 太早的決定。","th":2,"lv":2},{"p":"ready or not","zh":"不管準備好沒","scene":"寶寶要來了。","en":"Ready or not, here it comes!","tr":"不管準備好沒，它來了！","tip":"<b>來源：</b>捉迷藏「準備好沒，我要來找了」。","th":7,"lv":1}]},{"id":"kids","name":"派對殘局","who":"Haley · Alex · Luke","plot":"三姊弟在爸媽回家前拼命收拾。","items":[{"p":"trash the house","zh":"把家裡搞得一團亂","scene":"派對後家裡亂七八糟。","en":"Don't trash the house while we're gone.","tr":"我們不在的時候別把家裡搞得一團亂。","tip":"<b>用法：</b>trash 當動詞是破壞、弄亂。","th":8,"lv":1},{"p":"the party's over","zh":"好日子結束了","scene":"爸媽要回來了。","en":"Mom's home. The party's over.","tr":"媽回來了，好日子結束了。","tip":"<b>用法：</b>字面和比喻都能用。","th":7,"lv":2}]},{"id":"dunphy","name":"復活節派對","who":"Phil · Claire · Jay · Manny","plot":"Phil 和 Claire 學當爺爺奶奶；Jay 和 Manny 比誰懂酒。","items":[{"p":"Easter egg hunt","zh":"尋找復活節彩蛋","scene":"復活節派對的活動。","en":"The kids loved the Easter egg hunt.","tr":"孩子們超愛找彩蛋的活動。","tip":"<b>延伸：</b>Easter egg 也指電影、遊戲裡的隱藏彩蛋。","th":8,"lv":1},{"p":"once a parent, always a parent","zh":"一日為父母，終身為父母","scene":"Phil 和 Claire 發現孩子還是需要他們。","en":"My kids are grown up, but once a parent, always a parent.","tr":"孩子都長大了，但一日為父母，終身為父母。","tip":"<b>句型：</b>once a ..., always a ...。","th":2,"lv":1},{"p":"wine snob","zh":"自以為懂酒的人","scene":"Jay 和 Manny 比誰更懂紅酒。","en":"He's such a wine snob. He won't drink anything under $50.","tr":"他是個酒痴，五十美元以下的酒都不喝。","tip":"<b>延伸：</b>coffee snob 咖啡控。","th":9,"lv":2}]}],"prompts":["你搬過家嗎（用 housewarming、home sweet home、say goodbye to）","爸媽不在家時你做過什麼（用 trash the house、the party's over、ready or not）","你覺得爸媽永遠都是爸媽嗎（用 once a parent, always a parent、premature、wine snob）"],"challenges":[{"id":"c1","sit":"去歐洲玩兩週回到家，你說還是家裡最好。","uses":["home sweet home"],"ans":"Home sweet home!"},{"id":"c2","sit":"你朋友搬新家，你問他要不要辦喬遷派對。","uses":["housewarming"],"ans":"Are you having a housewarming party?"},{"id":"c3","sit":"退伍日期到了，你說不管準備好沒，要回社會了。","uses":["ready or not"],"ans":"Ready or not, here I come!"},{"id":"c4","sit":"店長回來了，你跟其他工讀生說好日子結束了。","uses":["the party's over"],"ans":"The party's over."}]},"s11e17":{"title":"Finale (Part 1)","lede":"系列完結篇上集：家裡太擠，Phil 和 Claire 都住到露營車上了，兩人決定該讓一個孩子搬出去；Mitchell 和 Cam 幫兒子取名 Rexford，Cam 拿到密蘇里的工作機會，一直藏到喬遷派對上才說，Mitchell 也同意搬家；Haley、Dylan 和雙胞胎搬進 Mitchell 和 Cam 的舊家，Alex 的工作調到瑞士，Luke 錄取了奧勒岡大學；Gloria 發現 Jay 一直躲起來，原來他在偷學西班牙文，想暑假跟她和 Joe 一起去哥倫比亞。","stories":[{"id":"dunphy","name":"誰該搬出去","who":"Phil · Claire · Haley · Alex · Luke","plot":"家裡太擠，孩子們各自找到新方向。","items":[{"p":"cramped","zh":"擁擠的","scene":"家裡擠到爸媽睡露營車。","en":"Our apartment is so cramped. There's no room for a couch.","tr":"我們的公寓好擠，連沙發都放不下。","tip":"<b>用法：</b>形容空間又小又擠。","th":8,"lv":1},{"p":"kick someone out","zh":"把某人趕出去","scene":"爸媽要讓一個孩子搬走。","en":"My parents kicked me out when I turned 18.","tr":"我十八歲時被爸媽趕出家門。","tip":"<b>語氣：</b>有時是開玩笑的說法。","th":2,"lv":1},{"p":"relocate","zh":"調職、搬遷","scene":"Alex 的工作要搬到瑞士。","en":"The company is relocating me to Singapore.","tr":"公司要把我調到新加坡。","tip":"<b>名詞：</b>relocation。","th":3,"lv":1},{"p":"get accepted","zh":"被錄取","scene":"Luke 錄取了奧勒岡大學。","en":"I got accepted to my dream school!","tr":"我被夢想的學校錄取了！","tip":"<b>反義：</b>get rejected 被拒絕。","th":3,"lv":1},{"p":"go their separate ways","zh":"各奔前程","scene":"孩子們要往不同方向走。","en":"After graduation, we all went our separate ways.","tr":"畢業後我們各奔前程。","tip":"<b>用法：</b>也能用在分手。","th":2,"lv":1}]},{"id":"mitch","name":"密蘇里的工作","who":"Cameron · Mitchell","plot":"Cam 拿到外地工作，Mitchell 決定一起搬。","items":[{"p":"uproot","zh":"舉家搬遷、連根拔起","scene":"兩人要搬到另一個州。","en":"I don't want to uproot my kids from their school.","tr":"我不想讓孩子離開他們的學校。","tip":"<b>畫面：</b>把植物連根拔起。","th":2,"lv":2},{"p":"pack up","zh":"打包","scene":"大家開始收東西。","en":"We packed up and left the next morning.","tr":"我們隔天早上打包離開。","tip":"<b>用法：</b>也可以說收拾東西準備結束。","th":8,"lv":1},{"p":"a lot to take in","zh":"一下子很難消化","scene":"大消息一個接一個。","en":"It's a lot to take in. Give me a minute.","tr":"一下子太多了，給我一分鐘。","tip":"<b>用法：</b>消息太多、太突然時。","th":4,"lv":1}]},{"id":"jay","name":"偷學西班牙文","who":"Jay · Gloria · Joe","plot":"Jay 躲起來，原來是在偷學西班牙文。","items":[{"p":"keep to oneself","zh":"不跟人來往、獨處","scene":"Jay 最近都一個人。","en":"He keeps to himself. Nobody knows much about him.","tr":"他很少跟人來往，沒人了解他。","tip":"<b>用法：</b>形容人很低調、不社交。","th":9,"lv":1},{"p":"the next step","zh":"下一步","scene":"每個人都邁出新的一步。","en":"What's the next step after you finish the army?","tr":"你當完兵之後的下一步是什麼？","tip":"<b>用法：</b>計畫、關係、職涯都能用。","th":10,"lv":1}]}],"prompts":["你家的空間夠住嗎（用 cramped、kick someone out、pack up）","退伍後你的下一步是什麼（用 the next step、relocate、get accepted）","你跟以前的朋友各奔前程了嗎（用 go their separate ways、uproot、a lot to take in）"],"challenges":[{"id":"c1","sit":"你說你們寢室好擠。","uses":["cramped"],"ans":"Our room is so cramped."},{"id":"c2","sit":"你說你被夢想的研究所錄取了。","uses":["get accepted"],"ans":"I got accepted to my dream grad school!"},{"id":"c3","sit":"大學畢業後，室友們各奔前程。","uses":["go their separate ways"],"ans":"We all went our separate ways."},{"id":"c4","sit":"朋友問你辭職後的下一步是什麼。","uses":["the next step"],"ans":"What's the next step?"}]},"s11e18":{"title":"Finale (Part 2)","lede":"系列完結篇下集：大家趕著去機場，班機卻一延再延；Claire 和 Mitchell 偷走了 Jay 和 DeDe 當年捐出去的花式滑冰獎盃；Cam 給 Gloria 一封信，請她把感受寫在卡片上，Gloria 以為是要寫給要去旅行的 Manny；Haley 和 Alex 惡整 Luke，重拍小時候把他當「狗」的影片；最後全家在 Phil 和 Claire 家抱在一起，Jay 的旁白帶過三個家，Dunphy 家門廊的燈再次亮起。","stories":[{"id":"family","name":"最後的道別","who":"全家人","plot":"大家要各奔東西，在機場和家裡好好道別。","items":[{"p":"flight delay","zh":"班機延誤","scene":"飛機一直延誤。","en":"Our flight was delayed for five hours.","tr":"我們的班機延誤了五小時。","tip":"<b>用法：</b>動詞 be delayed。","th":8,"lv":1},{"p":"a heist","zh":"搶劫行動、偷竊計畫","scene":"Claire 和 Mitchell 去偷獎盃。","en":"They planned the heist for months.","tr":"他們計劃這次行動好幾個月了。","tip":"<b>文化：</b>《瞞天過海》這類電影叫 heist movie。","th":10,"lv":2},{"p":"put into words","zh":"用言語表達","scene":"Gloria 很難說出心裡的感受。","en":"I can't put into words how much you mean to me.","tr":"我無法用言語表達你對我有多重要。","tip":"<b>用法：</b>常用否定。","th":4,"lv":1},{"p":"group hug","zh":"大家抱在一起","scene":"全家人最後抱成一團。","en":"Come here, everyone. Group hug!","tr":"大家過來，一起抱一下！","tip":"<b>用法：</b>團體擁抱。","th":2,"lv":1},{"p":"end of the road","zh":"走到盡頭","scene":"這段旅程要結束了。","en":"This is the end of the road for our team.","tr":"這是我們隊伍的最後一程了。","tip":"<b>用法：</b>比喻結束。","th":9,"lv":2},{"p":"it's not goodbye","zh":"這不是道別","scene":"大家只是分開住，不是永別。","en":"It's not goodbye. It's see you later.","tr":"這不是道別，是之後見。","tip":"<b>用法：</b>送別時常說。","th":6,"lv":1},{"p":"till we meet again","zh":"後會有期","scene":"期待下次再見。","en":"Take care, and till we meet again!","tr":"保重，後會有期！","tip":"<b>語氣：</b>比較文雅、溫暖。","th":7,"lv":2},{"p":"leave the light on","zh":"為你留一盞燈","scene":"結尾門廊的燈亮起。","en":"Come home anytime. We'll leave the light on for you.","tr":"隨時回家，我們會為你留一盞燈。","tip":"<b>畫面：</b>家人等你回家的溫暖。","th":2,"lv":2},{"p":"family is everything","zh":"家人就是一切","scene":"整部影集的核心。","en":"No matter what happens, family is everything.","tr":"不管發生什麼事，家人就是一切。","tip":"<b>用法：</b>簡單又有力的一句話。","th":2,"lv":1},{"p":"go out with a bang","zh":"轟轟烈烈地結束","scene":"影集用盛大的方式收尾。","en":"It's our last night. Let's go out with a bang!","tr":"這是最後一晚，我們轟轟烈烈地結束吧！","tip":"<b>反義：</b>go out with a whimper 草草收場。","th":10,"lv":2}]}],"prompts":["你遇過班機延誤或交通出狀況嗎（用 flight delay、a heist、end of the road）","你會怎麼跟要分開的朋友道別（用 it's not goodbye、till we meet again、group hug）","對你來說家人代表什麼（用 family is everything、leave the light on、put into words）"],"challenges":[{"id":"c1","sit":"退伍那天跟同梯道別，你說這不是道別。","uses":["it's not goodbye"],"ans":"It's not goodbye. It's see you later."},{"id":"c2","sit":"你說你無法用言語表達你有多感謝爸媽。","uses":["put into words"],"ans":"I can't put into words how grateful I am."},{"id":"c3","sit":"離職前最後一個週五，你說要轟轟烈烈地結束。","uses":["go out with a bang"],"ans":"Let's go out with a bang!"},{"id":"c4","sit":"你說不管發生什麼事，家人就是一切。","uses":["family is everything"],"ans":"No matter what, family is everything."}]}};

/* ---------- helpers ---------- */
const LADDER=[1,3,7,14,30,60,120,240], CAP=10, NEW_BATCH=5, DAY=86400000;
const pad=n=>String(n).padStart(2,"0");
const key=(s,e)=>`s${pad(s)}e${pad(e)}`;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $=s=>document.querySelector(s);
const epLabel=k=>k.slice(0,3).toUpperCase()+" "+k.slice(3).toUpperCase();
function dayNum(dt=new Date()){return Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/DAY)}
const today=()=>dayNum();
const dkey=n=>new Date(n*DAY).toISOString().slice(0,10);
const fromKey=k=>Math.floor(Date.parse(k+"T00:00:00Z")/DAY);
const md=n=>{const d=new Date(n*DAY);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
const weekStart=d=>d-((d+3)%7);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function whenText(n){return n<=1?"明天":`${n} 天後`}

const ITEMS=[],IDX={};
Object.keys(EPISODES).sort().forEach(k=>EPISODES[k].stories.forEach(st=>st.items.forEach(it=>{const o={k,p:it.p,it,st};ITEMS.push(o);IDX[k+"|"+it.p]=o})));
/* custom phrases: saved from Claude's 「多學一個搭配」 suggestion, stored in S.eps.custom.cards[phrase] with .custom={zh,ex,from} */
const normP=p=>String(p||"").toLowerCase().replace(/[’]/g,"'").replace(/[?!.,]/g,"").replace(/\b(someone|something|somebody|one's|someone's)\b/g,"").trim().replace(/^(be|to|get) /,"").replace(/\s+/g," ").trim();
const NIDX={};ITEMS.forEach(o=>{NIDX[normP(o.p)]=o});
function itemOf(k,p){const o=IDX[k+"|"+p];if(o)return o;if(k!=="custom")return null;const c=S.eps.custom&&S.eps.custom.cards&&S.eps.custom.cards[p];if(!c||!c.custom)return null;
 const cu=c.custom,tip=[cu.note?`<b>用法：</b>${esc(cu.note)}`:"",cu.src?`<b>出處：</b>${esc(cu.src)}`:"",cu.from?`<b>來源：</b>用「${esc(cu.from)}」造句時推薦的`:""].filter(Boolean).join("<br>");
 return{k,p,custom:true,st:{id:"custom",name:"自己收的"},it:{zh:esc(cu.zh||""),scene:cu.src?"從例句裡收藏的字詞":cu.from?"造句審核時 Claude 推薦的搭配":"自己加的字詞",en:cu.ex||p,tr:"",tip}}}
const srcLabel=k=>k==="custom"?"自己收的":epLabel(k);
const srcFull=k=>k==="custom"?"我收藏的字詞":`${epLabel(k)} · ${esc(EPISODES[k].title)}`;
/* tap words in example sentences to collect them */
function tapText(en){return `<span class="tapzone" data-src="${esc(en)}">${String(en).split(/(\s+)/).map(t=>/^\s+$/.test(t)||!t?t:`<span class="w" data-act="tapw">${esc(t)}</span>`).join("")}</span>`}
const pick={zone:null,phrase:"",sentence:"",state:"idle",res:null};
const cleanSel=t=>t.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,"");
function addCustom(phrase,data){const t=today(),en=phrase.trim().slice(0,80);if(!en)return null;
 const o=NIDX[normP(en)];
 if(o){if(!card(o.k,o.p)){epDoc(o.k).cards[o.p]=newCard(t);bump("n");touch(o.k);touch("profile")}return `✓ 已搞定 · 這是 ${epLabel(o.k)} 的片語`}
 if(!card("custom",en)){epDoc("custom").cards[en]=Object.assign(newCard(t),{custom:Object.assign({zh:"",ex:"",note:"",src:"",from:""},data)});bump("n");touch("custom");touch("profile")}
 return "✓ 已收進片語本 · 明天開始複習"}

/* ---------- watch progress, spoiler guard, tags ---------- */
const EKEYS=Object.keys(EPISODES).sort();
const STORY_NAMES={dunphy:"Dunphy 家",jay:"Jay 家",mitch:"Mitchell 家",kids:"孩子們",family:"全家",gloria:"Gloria"};
const THEMES=["","感情","家人朋友","工作學校","情緒","衝突","安慰鼓勵","聊天反應","生活日常","形容人事","計畫行動"];
const LEVELS=["","基礎","進階"];
const watchedMap=()=>S.profile.watched||{};
function frontier(){const w=Object.keys(watchedMap()).filter(k=>EPISODES[k]).sort();return w.length?w[w.length-1]:""}
function nextEp(){const f=frontier(),w=watchedMap();return EKEYS.find(k=>k>f&&!w[k])||null}
const guardOn=()=>S.profile.spoil!==false;
const isSpoil=k=>guardOn()&&k>frontier();
const peeked=new Set();
function sp(k,id,html){if(!isSpoil(k)||peeked.has(id))return html;return `<span class="spoil" data-act="peek" data-id="${esc(id)}" role="button" tabindex="0" title="可能有雷，點一下顯示" aria-label="劇情先遮住了，點一下顯示">${html}</span>`}
const storyName=(k,st,i)=>isSpoil(k)?(STORY_NAMES[st.id]||`故事 ${i+1}`):st.name;
const plain=s=>String(s||"").replace(/<[^>]+>/g,"");
let pendingFocus=null;

/* ---------- state ---------- */
const LS="mf-v2";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function normProfile(p){const o=Object.assign({days:{},pause:null,pauses:[],migrated:false,watched:{},spoil:true},p||{});if(!o.watched||typeof o.watched!=="object")o.watched={};return o}
function load(){let s=null;try{s=JSON.parse(lsGet(LS)||"null")}catch(e){}if(!s||typeof s!=="object")s={};s.profile=normProfile(s.profile);s.eps=s.eps||{};return s}
let S=load();
const saveLocal=()=>lsSet(LS,JSON.stringify(S));
const epDoc=k=>S.eps[k]||(S.eps[k]={cards:{}});
const card=(k,p)=>S.eps[k]&&S.eps[k].cards&&S.eps[k].cards[p];
function allCards(){const out=[];for(const k in S.eps){const cs=(S.eps[k]&&S.eps[k].cards)||{};for(const p in cs){const o=itemOf(k,p);if(o)out.push({k,p,c:cs[p],it:o.it})}}return out}
const dayGet=n=>S.profile.days[dkey(n)]||{};
function dayLog(n=today()){const k=dkey(n);return S.profile.days[k]||(S.profile.days[k]={})}
function bump(f){const d=dayLog();d[f]=(d[f]||0)+1}
const actCount=g=>(g.r||0)+(g.n||0)+(g.x||0)+(g.w||0)+(g.ch?Object.keys(g.ch).length:0);
const active=d=>actCount(dayGet(d))>0;
const newCard=t=>({s:0,due:t+1,last:null,reps:0,lapses:0,added:t});
const isMastered=c=>c.s>=3;
const isWeak=c=>c.s<3&&(c.lapses||0)>=2;

function migrateOld(){
 if(S.profile.migrated)return;
 let old={};
 try{old=JSON.parse(lsGet("mf-learned")||"{}")||{}}catch(e){}
 try{const o1=JSON.parse(lsGet("mf-s1e1")||"null");if(o1&&!old.s01e01)old.s01e01=o1}catch(e){}
 const t=today();
 for(const k in old){if(!EPISODES[k]||!old[k])continue;for(const p in old[k]){if(old[k][p]&&IDX[k+"|"+p]&&!card(k,p))epDoc(k).cards[p]=newCard(t)}}
 S.profile.migrated=true;saveLocal();
}

/* ---------- scheduling ---------- */
function schedule(c,g,t){
 const elapsed=c.last==null?t-c.added:t-c.last;
 let s=c.s||0,interval;
 if(g===0){s=0;interval=1}
 else if(g===1){interval=Math.max(2,LADDER[s])}
 else{s=Math.min(s+1,LADDER.length-1);if(elapsed>=LADDER[s]&&s<LADDER.length-1)s++;interval=LADDER[s]}
 return {s,interval};
}
function dueList(t=today()){if(S.profile.pause)return[];return allCards().filter(x=>x.c.due<=t).sort((a,b)=>a.c.due-b.c.due||a.c.s-b.c.s)}
const todayQuota=()=>Math.max(0,CAP-(dayGet(today()).r||0));
function isPaused(d){const P=S.profile;if(P.pauses.some(p=>d>=p.from&&d<p.to))return true;return !!(P.pause&&d>=P.pause.from&&d<P.pause.from+P.pause.days)}
function streakInfo(){
 const t=today(),keys=Object.keys(S.profile.days).filter(k=>actCount(S.profile.days[k])>0);
 const prot=new Set();
 if(!keys.length)return{streak:0,protLeft:1,prot};
 const first=Math.min(...keys.map(fromKey));
 let d=active(t)?t:t-1,streak=0;const used=new Set();
 while(d>=first){
  if(active(d))streak++;
  else if(!isPaused(d)){const w=weekStart(d);if(used.has(w))break;used.add(w);prot.add(d)}
  d--;
 }
 return{streak,protLeft:used.has(weekStart(t))?0:1,prot};
}
function endPause(endDay){
 const p=S.profile.pause;if(!p)return;
 const shift=Math.max(0,Math.min(endDay,p.from+p.days)-p.from);
 if(shift>0){for(const k in S.eps){const cs=S.eps[k].cards||{};let ch=false;for(const ph in cs){cs[ph].due+=shift;ch=true}if(ch)touch(k)}S.profile.pauses.push({from:p.from,to:p.from+shift})}
 S.profile.pause=null;touch("profile");
}
function maintain(){const p=S.profile.pause;if(p&&today()>=p.from+p.days)endPause(p.from+p.days)}

/* ---------- cloud sync ---------- */
let mode="local",db=null,uid=null,syncState="connecting",syncMsg="";
const dirty=new Set(),inflight=new Set();let flushing=false,flushTimer=null,failCount=0;
const col=()=>db.collection("data/users/"+uid);
const bodyOf=id=>id==="profile"?S.profile:(S.eps[id]||{cards:{}});
function touch(id){saveLocal();if(mode!=="cloud")return;dirty.add(id);clearTimeout(flushTimer);flushTimer=setTimeout(flush,500)}
async function flush(){
 if(flushing||mode!=="cloud")return;flushing=true;setSync("saving");let ok=true;
 while(dirty.size&&mode==="cloud"){
  const id=dirty.values().next().value;dirty.delete(id);inflight.add(id);
  try{await col().doc(id).set(JSON.parse(JSON.stringify(bodyOf(id))));failCount=0}
  catch(e){ok=false;inflight.delete(id);onWriteError(e,id);break}
  inflight.delete(id);
 }
 flushing=false;if(ok&&mode==="cloud")setSync("ok");
}
function onWriteError(e,id){
 const code=e&&e.code;
 if(!code||code==="unavailable"||code==="resource_exhausted"){dirty.add(id);failCount++;if(failCount<=2)setTimeout(flush,1500+Math.random()*1500);else setSync("warn","暫時無法同步，進度先存在這台裝置")}
 else if(code==="quota_exceeded")setSync("warn","雲端空間已滿，新進度只存在這台裝置");
 else goLocal("無法寫入雲端，進度只存在這台裝置");
}
function goLocal(msg){mode="local";dirty.clear();setSync("local",msg);maintain();refresh()}
function setSync(st,msg){syncState=st;if(msg!==undefined)syncMsg=msg;const el=$("#sync");if(el){el.className="sync "+syncClass();el.title=syncText();el.innerHTML=`<span class="txt">${esc(syncText())}</span>`}const ln=$("#localnote");if(ln){const show=syncState==="local"||syncState==="warn";ln.hidden=!show;ln.textContent=show?syncText():""}}
const syncClass=()=>({ok:"ok",warn:"warn",local:"local"})[syncState]||"";
const syncText=()=>({connecting:"連線中…",saving:"同步中…",ok:"已同步到你的帳號"})[syncState]||syncMsg;

function mergeFirst(snap){
 const cloud={};snap.docs.forEach(d=>{if(d.exists)cloud[d.id]=JSON.parse(JSON.stringify(d.data()))});
 const lp=S.profile,cp=cloud.profile;
 if(cp){
  const m=normProfile(cp);
  for(const dk in lp.days){const a=lp.days[dk],b=m.days[dk]||{},o=Object.assign({},b);
   for(const f in a){if(f==="ch")o.ch=Object.assign({},a.ch||{},b.ch||{});else o[f]=Math.max(a[f]||0,b[f]||0)}
   m.days[dk]=o}
  m.migrated=!!(cp.migrated||lp.migrated);
  m.watched=Object.assign({},lp.watched||{},cp.watched||{});
  if(cp.spoil===undefined&&lp.spoil!==undefined)m.spoil=lp.spoil;
  if(JSON.stringify(m)!==JSON.stringify(cp))dirty.add("profile");
  S.profile=m;
 }else dirty.add("profile");
 const ids=new Set([...Object.keys(cloud).filter(x=>x!=="profile"),...Object.keys(S.eps)]);
 for(const id of ids){
  const c=cloud[id],l=S.eps[id];
  if(!c){if(l&&Object.keys(l.cards||{}).length)dirty.add(id);continue}
  const m={cards:Object.assign({},c.cards||{})};
  if(l)for(const p in (l.cards||{}))if(!m.cards[p])m.cards[p]=l.cards[p];
  if(JSON.stringify(m)!==JSON.stringify(c))dirty.add(id);
  S.eps[id]=m;

  if(term){const P=o.p.toLowerCase();
   if(P===term)score=0;else if(P.startsWith(term))score=1;else if(P.includes(term))score=2;
   else if(plain(it.zh).toLowerCase().includes(term))score=3;
   else if(it.en.toLowerCase().includes(term)||plain(it.tr).includes(term))score=4;
   else continue}
  res.push([score,o]);
 }
 res.sort((a,b)=>a[0]-b[0]||(a[1].k<b[1].k?-1:a[1].k>b[1].k?1:0));
 return res.map(x=>x[1]);

async function pickClick(e){

  const sfn=await samplePromise;

  pick.state="loading";drawPick();
  try{const r=await sfn.json(lookupPrompt(pick.phrase,pick.sentence),{modelTier:"quick"});pick.res=r&&typeof r==="object"?r:{base:pick.phrase};pick.state="result"}
  catch(err){pick.state="manual"}
  drawPick();return}
 if(a==="save"){
  let msg;

  else{const r=pick.res||{};msg=addCustom(String(r.base||pick.phrase),{zh:String(r.zh||"").slice(0,60),note:String(r.note||"").slice(0,120),ex:String(r.ex||"").slice(0,200),src:pick.sentence})}

 }
}

app.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,t=today();
 const ed=b.closest(".editor"),ek=ed&&ed.dataset.k,ep=ed&&ed.dataset.p;
 switch(a){
  case"say":speak(b.dataset.say);break;
  case"go":location.hash="#"+b.dataset.to;break;
  case"season":curSeason=+b.dataset.season;render(false);break;
  case"filter":epFilter=b.dataset.f;render(false);break;
  case"add":{const k=b.dataset.k,p=b.dataset.p;if(!card(k,p)){epDoc(k).cards[p]=newCard(t);bump("n");touch(k);touch("profile")}render(false);break}
  case"unadd":{const k=b.dataset.k,p=b.dataset.p,c=card(k,p);if(!c)break;
   if(!c.reps&&!c.sent)removeCard(k,p);else confirmRemove=k+"|"+p;
   render(false);break}
  case"unadd-yes":removeCard(b.dataset.k,b.dataset.p);render(false);break;
  case"unadd-no":confirmRemove=null;render(false);break;
  case"say-all":{const t=today(),cs=allCards();speakAll(cs.filter(x=>x.c.added===t).map(x=>x.it.en));break}
  case"recap-next":recapOffset++;render(false);break;
  case"ex-next":exOffset++;render(false);break;
  case"box-open":drawBox();box.state="open";box.anim=true;render(true);break;
  case"box-skip":if(box.pick)box.skipped.add(box.pick);drawBox();box.anim=true;render(false);break;
  case"box-again":drawBox();box.state="open";box.anim=true;render(true);break;
  case"box-undo":{const o=box.pick&&IDX[box.pick];if(o)removeCard(o.k,o.p);box.state="open";render(false);break}
  case"start-review":startReview();location.hash==="#review"?render(true):location.hash="#review";break;
  case"start-extra":startExtra();location.hash==="#review"?render(true):location.hash="#review";break;
  case"flip":session.flipped=true;render(false);break;
  case"rate":{
   const s=session,{k,p}=s.items[s.i],c=card(k,p);if(!c)break;
   const g=+b.dataset.g,r=schedule(c,g,t);
   c.s=r.s;c.due=t+r.interval;c.last=t;c.reps=(c.reps||0)+1;if(g===0)c.lapses=(c.lapses||0)+1;
   bump(s.type==="review"?"r":"x");s.res[g]++;s.i++;s.flipped=false;editing=null;
   touch(k);touch("profile");render(true);break}
  case"write":editing=b.dataset.k+"|"+b.dataset.p;render(false);break;
  case"cancel-edit":editing=null;lastReview=null;render(false);break;
  case"check":checkSentence(ek,ep);break;
  case"save-own":{const ta=$("#sent-input");if(ta&&ta.value.trim())saveSentence(ek,ep,ta.value,null);else{const rv=$("#rev");if(rv)rv.innerHTML=`<p class="err">先寫一句再存。</p>`}break}
  case"save-orig":if(lastReview)saveSentence(ek,ep,lastReview.text,["good","minor","wrong"].includes(lastReview.r&&lastReview.r.verdict)?lastReview.r.verdict:"minor");break;
  case"save-fixed":if(lastReview){const r=lastReview.r;saveSentence(ek,ep,(r&&r.natural)||lastReview.text,"fixed")}break;
  case"save-col":saveCol();break;
  case"tapw":tapWord(b);break;
  case"add-word":{const i=$("#addword");const v=i&&cleanSel(i.value.trim());if(!v)break;clearPick();pick.phrase=v;pick.sentence="";pick.state="sel";drawPick();break}
  case"retry-edit":{const ta=$("#sent-input");if(ta)ta.focus();break}
  case"ch-reveal":revealed[b.dataset.id]=true;render(false);break;
  case"ch-res":{
   const id=b.dataset.id,ok=b.dataset.ok==="1",d=dayLog();d.ch=d.ch||{};d.ch[id]=ok?1:0;
   if(!ok){const c=todaysChallenges().find(x=>x.id===id);if(c){c.uses.forEach(p=>{const cd=card(c.k,p);if(cd){cd.due=Math.min(cd.due,t+1);touch(c.k)}})}}
   touch("profile");render(false);break}
  case"pause-toggle":pauseOpen=!pauseOpen;render(false);break;
  case"pause-start":{const n=+($("#pause-days")||{}).value||3;S.profile.pause={from:t,days:n};pauseOpen=false;touch("profile");render(false);break}
  case"pause-end":endPause(t);render(false);break;
  case"peek":peeked.add(b.dataset.id);render(false);break;
  case"watch":S.profile.watched=Object.assign({},watchedMap(),{[b.dataset.k]:t});touch("profile");render(false);break;
  case"unwatch":{const w=Object.assign({},watchedMap());delete w[b.dataset.k];S.profile.watched=w;touch("profile");render(false);break}
  case"th":thF=+b.dataset.v;hitN=15;render(false);break;
  case"lv":lvF=+b.dataset.v;hitN=15;render(false);break;
  case"newonly":newOnly=!newOnly;hitN=15;render(false);break;
  case"adv":showAdv=!showAdv;render(false);break;
  case"clear-f":thF=0;lvF=0;newOnly=false;hitN=15;render(false);break;
  case"go-season":curSeason=+b.dataset.season;keepSeason=true;q="";thF=0;lvF=0;newOnly=false;location.hash="#episodes";break;
  case"more":hitN+=15;{const o=$("#finder-out");if(o)o.innerHTML=finderOut()}break;
  case"open-phrase":{const k=b.dataset.k;pendingFocus=k+"|"+b.dataset.p;if(location.hash==="#"+k)render(false);else location.hash="#"+k;break}
 }
});
app.addEventListener("input",e=>{
 if(e.target.id==="sent-input"&&editing)drafts[editing]=e.target.value;
 if(e.target.id==="q"){q=e.target.value;hitN=15;const o=$("#finder-out");if(o)o.innerHTML=finderOut()}
});
app.addEventListener("change",e=>{
 if(e.target.id==="hidezh"){hideZh=e.target.checked;document.body.classList.toggle("hide-zh",hideZh)}
 if(e.target.id==="spoilguard"){S.profile.spoil=e.target.checked;touch("profile");render(false)}
});
document.addEventListener("keydown",e=>{
 if(e.target&&e.target.classList&&e.target.classList.contains("spoil")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();return}
 if(view!=="review"||!session||e.metaKey||e.ctrlKey||e.altKey)return;
 const tag=(e.target.tagName||"").toLowerCase();if(tag==="textarea"||tag==="input"||tag==="select")return;
 if(session.i>=session.items.length)return;
 if(!session.flipped&&(e.key===" "||e.key==="Enter")&&app.querySelector('[data-act="flip"]')){e.preventDefault();session.flipped=true;render(false)}
 else if(["1","2","3"].includes(e.key)&&app.querySelector('[data-act="rate"]')){const btn=app.querySelector(`[data-act="rate"][data-g="${+e.key-1}"]`);if(btn)btn.click()}
});
window.addEventListener("hashchange",route);

/* ---------- boot ---------- */
migrateOld();
route();
if(window.claude&&typeof window.claude.use==="function")samplePromise=window.claude.use("sample").catch(()=>null);
connect();
</script>
