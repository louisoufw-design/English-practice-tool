"tip":"<b>用法：</b>call 在這裡是「決定」。","th":10,"lv":1}]},{"id":"jay","name":"生日派對","who":"Gloria · Claire","plot":"Gloria 想幫 Claire 辦一場超豪華的生日派對。","items":[{"p":"money is no object","zh":"錢不是問題","scene":"Gloria 辦派對完全不手軟。","en":"Order whatever you want. Money is no object.","tr":"想點什麼就點，錢不是問題。","tip":"<b>語氣：</b>有點炫富的感覺。","th":3,"lv":2},{"p":"throw a bash","zh":"辦盛大派對","scene":"Gloria 要幫 Claire 大辦一場。","en":"We're throwing a bash for his 30th.","tr":"我們要幫他辦三十歲的盛大派對。","tip":"<b>用法：</b>bash 是口語的「熱鬧派對」。","th":8,"lv":2}]},{"id":"mitch","name":"Cam 的 MRI","who":"Cameron · Mitchell","plot":"Cam 因為小時候的陰影，不肯去做 MRI。","items":[{"p":"claustrophobic","zh":"有幽閉恐懼的","scene":"Cam 很怕被關進窄小的機器裡。","en":"I get claustrophobic in elevators.","tr":"我在電梯裡會有幽閉恐懼。","tip":"<b>用法：</b>也能形容空間很擠很悶。","th":4,"lv":2},{"p":"deep-seated","zh":"根深蒂固的","scene":"小時候的陰影一直都在。","en":"He has a deep-seated fear of dogs.","tr":"他對狗有根深蒂固的恐懼。","tip":"<b>搭配：</b>deep-seated fear / belief。","th":9,"lv":2},{"p":"get something checked out","zh":"去檢查一下","scene":"Mitchell 要 Cam 去給醫生看。","en":"You should get that cough checked out.","tr":"你那個咳嗽應該去檢查一下。","tip":"<b>用法：</b>身體、車子都能用。","th":8,"lv":1},{"p":"bite the bullet","zh":"硬著頭皮做","scene":"Cam 最後還是要面對。","en":"I hate the dentist, but I just have to bite the bullet.","tr":"我很討厭看牙醫，但還是得硬著頭皮去。","tip":"<b>來源：</b>以前戰地沒有麻藥，手術時咬子彈忍痛。","th":10,"lv":2}]}],"prompts":["你有什麼害怕的事嗎（用 claustrophobic、deep-seated、bite the bullet）","你曾經花錢花到變成錢坑嗎（用 money pit、money is no object、trim the fat）","你當過小組長或幹部嗎（用 heavy is the head that wears the crown、make the hard call、throw a bash）"],"challenges":[{"id":"c1","sit":"室友咳了一個禮拜，你叫他去給醫生看一下。","uses":["get something checked out"],"ans":"You should get that checked out."},{"id":"c2","sit":"你說你在電梯裡會有幽閉恐懼。","uses":["claustrophobic"],"ans":"I get claustrophobic in elevators."},{"id":"c3","sit":"你說你那台二手機車修不完，是個錢坑。","uses":["money pit"],"ans":"My used scooter is a money pit."},{"id":"c4","sit":"要去打針了，你說只好硬著頭皮去。","uses":["bite the bullet"],"ans":"I'll just bite the bullet."}]},"s08e15":{"title":"Finding Fizbo","lede":"Phil 幫爸爸 Frank 籌辦婚前單身派對，還見到了未來的繼兄弟；Manny 寫了一齣劇，要大家給他誠實的意見；Alex 想偷溜去見 Ben；Cam 則發現了他的小丑 Fizbo 服裝到底去哪了。","stories":[{"id":"dunphy","name":"單身派對","who":"Phil · Frank · 繼兄弟","plot":"Phil 幫爸爸辦單身派對，見到了未來的繼兄弟。","items":[{"p":"stepbrother","zh":"繼兄弟","scene":"Phil 要多一個兄弟了。","en":"My stepbrother and I get along great.","tr":"我跟我的繼兄弟處得很好。","tip":"<b>延伸：</b>stepmom 繼母、stepsister 繼姊妹。","th":2,"lv":1},{"p":"bond over","zh":"因為……而拉近關係","scene":"Phil 想和新兄弟找共同話題。","en":"We bonded over our love of baseball.","tr":"我們因為都喜歡棒球而變熟。","tip":"<b>用法：</b>bond over + 共同興趣或經驗。","th":2,"lv":1},{"p":"last hurrah","zh":"最後的狂歡","scene":"單身派對是婚前最後的瘋狂。","en":"This trip is our last hurrah before college.","tr":"這趟旅行是我們上大學前最後的狂歡。","tip":"<b>用法：</b>結束某個階段前最後一次盡情玩。","th":8,"lv":2}]},{"id":"kids","name":"Manny 的劇本","who":"Manny · Haley · Alex · Claire · Gloria","plot":"Manny 要大家誠實評論他的劇本。","items":[{"p":"don't hold back","zh":"不用客氣、盡量說","scene":"Manny 叫大家直接說。","en":"Tell me what you really think. Don't hold back.","tr":"告訴我你真正的想法，不用客氣。","tip":"<b>用法：</b>hold back 是保留、克制。","th":7,"lv":1},{"p":"tear apart","zh":"批評得體無完膚","scene":"大家的意見很殘酷。","en":"The critics tore his movie apart.","tr":"影評把他的電影批評得一文不值。","tip":"<b>用法：</b>tear something apart，也有「撕碎」的字面意思。","th":5,"lv":2},{"p":"give it to me straight","zh":"直接跟我說","scene":"Manny 要大家說實話。","en":"Give it to me straight, doc. How bad is it?","tr":"醫生你直說吧，有多嚴重？","tip":"<b>用法：</b>要對方別拐彎抹角。","th":7,"lv":1},{"p":"a work in progress","zh":"還在修改中的作品","scene":"Manny 的劇本還需要改。","en":"My English is still a work in progress.","tr":"我的英文還在進步中。","tip":"<b>用法：</b>也可以自嘲自己還不夠完美。","th":9,"lv":2},{"p":"sneak off","zh":"偷溜","scene":"Alex 想偷溜去見 Ben。","en":"They snuck off to the beach after class.","tr":"他們下課後偷溜去海邊。","tip":"<b>文法：</b>過去式 snuck 比 sneaked 更口語。","th":10,"lv":1}]},{"id":"mitch","name":"Fizbo 之謎","who":"Cameron · Mitchell","plot":"Cam 終於知道他的 Fizbo 服裝發生了什麼事。","items":[{"p":"be attached to something","zh":"對……有感情、捨不得","scene":"Cam 對 Fizbo 有很深的感情。","en":"I'm really attached to this old jacket.","tr":"我對這件舊外套很有感情。","tip":"<b>用法：</b>也可以用在人身上。","th":4,"lv":1},{"p":"hang it up","zh":"收手、退休","scene":"Fizbo 是不是該退場了。","en":"After twenty years, he decided to hang it up.","tr":"二十年後，他決定退休了。","tip":"<b>來源：</b>運動員把球衣、鞋子掛起來不再用。","th":3,"lv":2}]}],"prompts":["你跟兄弟姊妹或朋友因為什麼變熟（用 bond over、stepbrother、last hurrah）","你喜歡別人給你直接的意見嗎（用 don't hold back、give it to me straight、tear apart）","你有什麼捨不得丟的東西（用 be attached to something、hang it up、sneak off）"],"challenges":[{"id":"c1","sit":"畢業旅行最後一晚，你說這是最後的狂歡。","uses":["last hurrah"],"ans":"This is our last hurrah."},{"id":"c2","sit":"你請朋友評論你的英文自我介紹，叫他不用客氣。","uses":["don't hold back"],"ans":"Don't hold back."},{"id":"c3","sit":"你說你跟室友是因為都喜歡打籃球才變熟的。","uses":["bond over"],"ans":"We bonded over basketball."},{"id":"c4","sit":"你說你對這雙舊球鞋很有感情。","uses":["be attached to something"],"ans":"I'm really attached to these old sneakers."}]},"s08e16":{"title":"Basketball","lede":"Phil 參加慈善籃球賽想一雪前恥；Claire 對 Jay 隱瞞了一個大秘密，而 Jay 擔心 Joe 不把他的權威放在眼裡；Gloria 和 Donna 的較勁又燒起來了；Mitchell 和 Cam 給 Haley 一些關於 Rainer 的建議。","stories":[{"id":"dunphy","name":"慈善籃球賽","who":"Phil · 球員們","plot":"Phil 想在慈善籃球賽上扳回一城。","items":[{"p":"shoot hoops","zh":"投籃、打籃球","scene":"Phil 要上場打球了。","en":"Want to go shoot some hoops after work?","tr":"下班要不要去投投籃？","tip":"<b>用法：</b>比較輕鬆隨意的打籃球。","th":8,"lv":2},{"p":"nothing but net","zh":"空心球","scene":"Phil 夢想投出漂亮的一球。","en":"He took the shot, and it was nothing but net!","tr":"他出手，結果是空心球！","tip":"<b>用法：</b>也比喻事情做得很完美。","th":8,"lv":2},{"p":"slam dunk","zh":"灌籃、十拿九穩的事","scene":"比賽裡的精彩畫面。","en":"This deal is a slam dunk.","tr":"這筆交易十拿九穩。","tip":"<b>用法：</b>籃球術語，也比喻穩贏的事。","th":9,"lv":2},{"p":"full-court press","zh":"全場緊迫盯人","scene":"Phil 全力投入比賽。","en":"The sales team is doing a full-court press this month.","tr":"業務團隊這個月全力衝刺。","tip":"<b>用法：</b>籃球戰術，也比喻全力施壓。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Claire · Joe · Gloria · Donna","plot":"Claire 有秘密瞞著 Jay，Jay 覺得 Joe 不聽他的話；Gloria 和 Donna 又槓上了。","items":[{"p":"break it to someone","zh":"把壞消息告訴某人","scene":"Claire 不知道怎麼跟爸爸開口。","en":"How am I going to break it to my parents?","tr":"我要怎麼跟我爸媽說這件事？","tip":"<b>搭配：</b>break it to someone gently 委婉地說。","th":10,"lv":1},{"p":"who's the boss","zh":"誰才是老大","scene":"Jay 想讓 Joe 知道誰說了算。","en":"You need to show the dog who's the boss.","tr":"你要讓狗知道誰才是老大。","tip":"<b>用法：</b>show someone who's the boss。","th":5,"lv":1},{"p":"pull rank","zh":"拿身分壓人","scene":"Jay 想用爸爸的身分壓 Joe。","en":"He pulled rank and took the best room.","tr":"他用職位壓人，搶走了最好的房間。","tip":"<b>來源：</b>軍隊裡用軍階壓人，當兵的你一定懂。","th":5,"lv":2},{"p":"frenemy","zh":"亦敵亦友","scene":"Gloria 和 Donna 表面和氣，私下較勁。","en":"She's not really a friend. She's more of a frenemy.","tr":"她不算是朋友，比較像是亦敵亦友。","tip":"<b>來源：</b>friend + enemy 合成字。","th":2,"lv":2},{"p":"catty","zh":"講話酸、愛暗諷","scene":"兩個女人互相酸來酸去。","en":"Stop being so catty about her dress.","tr":"別再酸她的衣服了。","tip":"<b>注意：</b>多半形容女生之間的冷嘲熱諷，用的時候小心。","th":9,"lv":2}]},{"id":"mitch","name":"感情顧問","who":"Mitchell · Cameron · Haley","plot":"兩人給 Haley 一些關於 Rainer 的建議。","items":[{"p":"older and wiser","zh":"年紀大了也更有智慧","scene":"兩人以過來人身分給建議。","en":"I'm older and wiser now. I won't make that mistake again.","tr":"我現在年紀大也更懂事了，不會再犯那個錯。","tip":"<b>用法：</b>常帶自嘲語氣。","th":9,"lv":1}]}],"prompts":["你喜歡打籃球嗎（用 shoot hoops、nothing but net、slam dunk）","你遇過拿身分壓人的人嗎（用 pull rank、who's the boss、full-court press）","你有亦敵亦友的朋友嗎（用 frenemy、catty、older and wiser）"],"challenges":[{"id":"c1","sit":"學長拿軍階壓人，叫你把最好的床位讓給他。","uses":["pull rank"],"ans":"He pulled rank on me."},{"id":"c2","sit":"你下班約朋友去河濱公園投籃。","uses":["shoot hoops"],"ans":"Want to shoot some hoops?"},{"id":"c3","sit":"你說這次考試十拿九穩。","uses":["slam dunk"],"ans":"This test is a slam dunk."},{"id":"c4","sit":"你在想要怎麼跟爸媽說你被當掉一科。","uses":["break it to someone"],"ans":"How am I going to break it to my parents?"}]},"s08e17":{"title":"Pig Moon Rising","lede":"Mitchell 不小心打翻了 Cam 那隻豬的骨灰，還想偷偷掩蓋；結果秘密越堆越多，全家人變成一張互相交換條件、互相欠人情的大網。","stories":[{"id":"mitch","name":"豬的骨灰","who":"Mitchell · Cameron","plot":"Mitchell 不小心打翻了 Cam 心愛的豬的骨灰。","items":[{"p":"knock over","zh":"打翻、撞倒","scene":"Mitchell 一不小心把骨灰罈打翻了。","en":"The cat knocked over my coffee.","tr":"貓把我的咖啡打翻了。","tip":"<b>用法：</b>knock something over。","th":8,"lv":1},{"p":"act natural","zh":"表現自然一點","scene":"Mitchell 要裝作什麼事都沒發生。","en":"Here he comes. Act natural!","tr":"他來了，表現自然一點！","tip":"<b>用法：</b>心虛時叫同夥別露餡。","th":10,"lv":1},{"p":"keep a lid on it","zh":"別張揚、壓下來","scene":"這件事千萬不能讓 Cam 知道。","en":"Keep a lid on it until we're sure.","tr":"在確定之前先別說出去。","tip":"<b>畫面：</b>把鍋蓋蓋好，不讓東西冒出來。","th":10,"lv":2}]},{"id":"family","name":"交換條件大網","who":"全家人","plot":"每個人都知道一點秘密，開始互相交換條件、討人情。","items":[{"p":"a web of lies","zh":"一連串謊言","scene":"秘密越滾越大。","en":"He got caught in a web of lies.","tr":"他被自己的一連串謊言困住了。","tip":"<b>畫面：</b>像蜘蛛網一樣越織越複雜。","th":10,"lv":2},{"p":"quid pro quo","zh":"交換條件","scene":"大家用秘密交換好處。","en":"It's a quid pro quo. I help you, you help me.","tr":"這是交換條件，我幫你，你幫我。","tip":"<b>來源：</b>拉丁文「以此換彼」。","th":10,"lv":2},{"p":"owe someone one","zh":"欠某人一次","scene":"幫了忙就欠了人情。","en":"Thanks for covering for me. I owe you one.","tr":"謝謝你幫我掩護，我欠你一次。","tip":"<b>用法：</b>I owe you one 是最常見的說法。","th":7,"lv":1},{"p":"call in a favor","zh":"討人情","scene":"有人開始要回欠的人情。","en":"I had to call in a favor to get tickets.","tr":"我得去討個人情才拿到票。","tip":"<b>用法：</b>要對方還你之前的人情。","th":10,"lv":2},{"p":"hush money","zh":"封口費","scene":"有人用好處換別人閉嘴。","en":"He paid her hush money to keep quiet.","tr":"他付她封口費要她別說。","tip":"<b>用法：</b>hush 是「噓，安靜」。","th":10,"lv":2},{"p":"sworn to secrecy","zh":"發誓保密","scene":"每個人都被要求守口如瓶。","en":"I can't tell you. I've been sworn to secrecy.","tr":"我不能說，我發過誓要保密。","tip":"<b>用法：</b>常用被動 be sworn to secrecy。","th":10,"lv":2},{"p":"domino effect","zh":"骨牌效應","scene":"一個秘密引發一連串事件。","en":"One mistake caused a domino effect.","tr":"一個錯誤引發了骨牌效應。","tip":"<b>畫面：</b>推倒一張骨牌，後面全倒。","th":9,"lv":2}]}],"prompts":["你曾經不小心打破或打翻什麼東西嗎（用 knock over、act natural、keep a lid on it）","你跟朋友之間會互相欠人情嗎（用 owe someone one、call in a favor、quid pro quo）","你曾經被要求保密過嗎（用 sworn to secrecy、a web of lies、domino effect）"],"challenges":[{"id":"c1","sit":"同梯幫你站了一班哨，你說欠他一次。","uses":["owe someone one"],"ans":"I owe you one."},{"id":"c2","sit":"朋友問你驚喜派對的事，你說你發誓要保密。","uses":["sworn to secrecy"],"ans":"I've been sworn to secrecy."},{"id":"c3","sit":"店長走過來了，你叫同事表現自然一點。","uses":["act natural"],"ans":"Here he comes. Act natural."},{"id":"c4","sit":"你說貓把你的手搖飲打翻了。","uses":["knock over"],"ans":"The cat knocked over my drink."}]},"s08e18":{"title":"Five Minutes","lede":"這集用「五分鐘」切開每條故事線：Mitchell 和 Cam 在飛機起飛前太早吃了安眠藥；Haley 和 Rainer 在慶生晚餐、蛋糕送來前重新思考這段感情；Phil 和 Claire 第一次見 Alex 的新男友；Manny 在找停車位，Jay 和 Gloria 在車上吵架。","stories":[{"id":"mitch","name":"安眠藥","who":"Mitchell · Cameron","plot":"兩人太早吃了安眠藥，還沒上飛機就快睡著了。","items":[{"p":"drowsy","zh":"昏昏欲睡","scene":"藥效讓兩人越來越想睡。","en":"This medicine might make you drowsy.","tr":"這個藥可能會讓你想睡覺。","tip":"<b>用法：</b>藥品說明上很常見。","th":8,"lv":1},{"p":"red-eye flight","zh":"紅眼班機","scene":"兩人要搭夜間航班。","en":"I took a red-eye flight and didn't sleep at all.","tr":"我搭紅眼班機，完全沒睡。","tip":"<b>用法：</b>常簡稱 a red-eye。","th":8,"lv":2},{"p":"kick in","zh":"開始生效","scene":"藥效提早發作了。","en":"The coffee hasn't kicked in yet.","tr":"咖啡還沒開始起作用。","tip":"<b>用法：</b>藥效、咖啡、冷氣都能用。","th":8,"lv":1},{"p":"out like a light","zh":"秒睡","scene":"兩人一下子就睡死了。","en":"I was out like a light as soon as I lay down.","tr":"我一躺下就秒睡了。","tip":"<b>畫面：</b>像關燈一樣啪一下就暗了。","th":8,"lv":2}]},{"id":"kids","name":"慶生晚餐","who":"Haley · Rainer","plot":"蛋糕送來前，兩人開始重新思考這段感情。","items":[{"p":"take stock","zh":"好好盤點、重新評估","scene":"Haley 開始思考這段關係。","en":"It's time to take stock of my life.","tr":"是時候好好檢視我的人生了。","tip":"<b>來源：</b>商店盤點庫存。","th":10,"lv":2},{"p":"where is this going","zh":"這段關係要走向哪裡","scene":"Haley 想知道兩人的未來。","en":"We've been dating for a year. Where is this going?","tr":"我們交往一年了，這段關係要走去哪？","tip":"<b>用法：</b>情侶「談判」時的經典問句。","th":1,"lv":1}]},{"id":"dunphy","name":"見男友","who":"Phil · Claire · Alex · 新男友","plot":"Phil 和 Claire 第一次見 Alex 的新男友。","items":[{"p":"make a good impression","zh":"留下好印象","scene":"男友想讓爸媽喜歡他。","en":"Wear a nice shirt. You want to make a good impression.","tr":"穿件好看的襯衫，你會想留下好印象的。","tip":"<b>對比：</b>first impression 是第一印象這個名詞。","th":10,"lv":1},{"p":"give someone the third degree","zh":"拷問某人","scene":"爸媽一直問男友問題。","en":"My dad gave my boyfriend the third degree.","tr":"我爸把我男友問了個遍。","tip":"<b>用法：</b>誇張形容連番追問。","th":5,"lv":2}]},{"id":"jay","name":"找車位","who":"Manny · Jay · Gloria","plot":"Manny 在找停車位，Jay 和 Gloria 在後面吵架。","items":[{"p":"circle the block","zh":"繞街區","scene":"Manny 一直繞圈找車位。","en":"We circled the block three times looking for parking.","tr":"我們繞了三圈找停車位。","tip":"<b>用法：</b>找車位或等人時常用。","th":8,"lv":1},{"p":"every minute counts","zh":"分秒必爭","scene":"每一條故事線都只有五分鐘。","en":"We're running late. Every minute counts.","tr":"我們快遲到了，分秒必爭。","tip":"<b>同義：</b>every second counts。","th":10,"lv":1}]}],"prompts":["你搭過紅眼班機或熬過夜嗎（用 red-eye flight、drowsy、out like a light）","你第一次見朋友或另一半的家人時怎麼樣（用 make a good impression、give someone the third degree、where is this going）","你最近有好好檢視自己的生活嗎（用 take stock、every minute counts、kick in）"],"challenges":[{"id":"c1","sit":"站完夜哨回來，你說一躺下就秒睡。","uses":["out like a light"],"ans":"I was out like a light."},{"id":"c2","sit":"你說咖啡還沒開始起作用。","uses":["kick in"],"ans":"The coffee hasn't kicked in yet."},{"id":"c3","sit":"你跟朋友說，你們繞了三圈都找不到車位。","uses":["circle the block"],"ans":"We circled the block three times."},{"id":"c4","sit":"你說感冒藥讓你很想睡。","uses":["drowsy"],"ans":"This medicine makes me drowsy."}]},"s08e19":{"title":"Frank's Wedding","lede":"Frank 的婚禮走 1920 年代主題，結果 Claire 和孩子們發現只有他們真的盛裝打扮，於是對 Phil 來了場「勸說大會」；Jay 後悔自己太會說「不」；Cam 終於對 Pam 硬起來，Pam 卻在這時候要生了，生下一個男孩。","stories":[{"id":"dunphy","name":"1920 年代婚禮","who":"Claire · 孩子們 · Phil · Frank","plot":"全家盛裝出席，卻發現只有他們穿了戲服。","items":[{"p":"themed wedding","zh":"主題婚禮","scene":"Frank 辦了一場復古主題婚禮。","en":"They had a beach-themed wedding.","tr":"他們辦了一場海灘主題的婚禮。","tip":"<b>用法：</b>X-themed 可以造很多詞，例如 Halloween-themed。","th":8,"lv":1},{"p":"the odd one out","zh":"格格不入的那個","scene":"全場只有他們打扮成這樣。","en":"Everyone wore black, and I was the odd one out in red.","tr":"大家都穿黑的，只有我穿紅的格格不入。","tip":"<b>用法：</b>在一群人裡最突兀的那個。","th":9,"lv":2},{"p":"overdressed","zh":"穿得太隆重","scene":"他們穿得比所有人都誇張。","en":"I felt overdressed in my suit.","tr":"我穿西裝覺得太正式了。","tip":"<b>反義：</b>underdressed 穿得太隨便。","th":8,"lv":1},{"p":"the bee's knees","zh":"超棒的（復古說法）","scene":"1920 年代的流行用語。","en":"This new café is the bee's knees!","tr":"這家新咖啡店超讚！","tip":"<b>文化：</b>1920 年代美國流行語，現在講有搞笑復古感。","th":9,"lv":2},{"p":"go all in","zh":"全力投入","scene":"Phil 對主題非常投入。","en":"If you're going to do it, go all in.","tr":"要做就全力以赴。","tip":"<b>來源：</b>撲克牌把籌碼全部押上。","th":10,"lv":2}]},{"id":"jay","name":"說不的男人","who":"Jay","plot":"Jay 發現自己太會拒絕別人，反而有點後悔。","items":[{"p":"people pleaser","zh":"討好型的人","scene":"Jay 剛好相反，從來不怕得罪人。","en":"I'm a people pleaser. I can't say no.","tr":"我是討好型人格，不會拒絕別人。","tip":"<b>用法：</b>形容很怕讓別人失望的人。","th":9,"lv":1},{"p":"a yes man","zh":"唯唯諾諾的人","scene":"Jay 從來不是應聲蟲。","en":"He surrounds himself with yes men.","tr":"他身邊都是只會說好的人。","tip":"<b>用法：</b>只會附和老闆的人。","th":9,"lv":2}]},{"id":"mitch","name":"Cam 與 Pam","who":"Cameron · Pam · Mitchell","plot":"Cam 終於對姊姊 Pam 硬起來，Pam 卻在這時候要生了。","items":[{"p":"push back","zh":"反對、頂回去","scene":"Cam 終於不再讓步。","en":"When my boss gave me too much work, I pushed back.","tr":"老闆給我太多工作時，我有反應回去。","tip":"<b>用法：</b>職場很常用，比 refuse 柔和。","th":5,"lv":1},{"p":"it's go time","zh":"該上場了","scene":"Pam 要生了，大家全員出動。","en":"Okay, everybody, it's go time!","tr":"好了各位，該上場了！","tip":"<b>用法：</b>準備開始行動時的口號。","th":7,"lv":2},{"p":"it's a boy","zh":"是男生","scene":"Pam 生了一個男孩。","en":"Congratulations! It's a boy!","tr":"恭喜！是男孩！","tip":"<b>延伸：</b>it's a girl；gender reveal 性別揭曉派對。","th":2,"lv":1}]}],"prompts":["你參加過什麼主題派對或婚禮嗎（用 themed wedding、overdressed、the odd one out）","你是會拒絕別人的人嗎（用 people pleaser、a yes man、push back）","你做事情會全力投入嗎（用 go all in、it's go time、the bee's knees）"],"challenges":[{"id":"c1","sit":"朋友說是輕鬆聚會，結果大家都穿正式服裝只有你穿短褲，你說你是最突兀的那個。","uses":["the odd one out"],"ans":"I was the odd one out."},{"id":"c2","sit":"你說你是討好型的人，不會拒絕別人。","uses":["people pleaser"],"ans":"I'm a people pleaser."},{"id":"c3","sit":"排球比賽要開始了，你叫隊友該上場了。","uses":["it's go time"],"ans":"Okay, it's go time!"},{"id":"c4","sit":"朋友穿西裝去吃熱炒，你說他穿得太隆重了。","uses":["overdressed"],"ans":"You're overdressed."}]},"s08e20":{"title":"All Things Being Equal","lede":"全家人各自用自己的方式支持性別平等；Jay 和 Phil 為了停車場的泊車小弟起衝突；Pam 生完孩子後很依賴 Mitchell 照顧寶寶，讓 Cam 吃醋了。","stories":[{"id":"family","name":"性別平等","who":"全家人","plot":"每個人都用自己的方式表態支持兩性平等。","items":[{"p":"all things being equal","zh":"在其他條件相同的情況下","scene":"集名本身就是這句話。","en":"All things being equal, I'd choose the cheaper one.","tr":"其他條件都一樣的話，我會選便宜的那個。","tip":"<b>用法：</b>比較兩個選項時的開場白。","th":10,"lv":2},{"p":"equal pay","zh":"同工同酬","scene":"大家討論男女薪水平等。","en":"Women should get equal pay for equal work.","tr":"女性做一樣的工作應該拿一樣的薪水。","tip":"<b>搭配：</b>equal pay for equal work。","th":3,"lv":1},{"p":"glass ceiling","zh":"玻璃天花板","scene":"女性在職場升遷的隱形障礙。","en":"She broke through the glass ceiling and became CEO.","tr":"她突破玻璃天花板，當上執行長。","tip":"<b>畫面：</b>看得到上面卻上不去的隱形天花板。","th":3,"lv":2},{"p":"level the playing field","zh":"讓競爭公平","scene":"大家想讓兩性站在同一起跑點。","en":"Free tutoring helps level the playing field.","tr":"免費家教讓大家的起點更公平。","tip":"<b>畫面：</b>把傾斜的球場整平。","th":3,"lv":2}]},{"id":"jay","name":"泊車小弟","who":"Jay · Phil","plot":"兩人為了停車場的泊車小弟吵起來。","items":[{"p":"valet parking","zh":"代客泊車","scene":"衝突就發生在泊車服務。","en":"Does the hotel have valet parking?","tr":"這間飯店有代客泊車嗎？","tip":"<b>發音：</b>valet 美式唸 va-LAY。","th":8,"lv":1},{"p":"turf war","zh":"地盤之爭","scene":"兩人為小事爭誰說了算。","en":"The two departments are in a turf war.","tr":"兩個部門在搶地盤。","tip":"<b>用法：</b>turf 是草皮，引申為勢力範圍。","th":5,"lv":2},{"p":"pick a side","zh":"選邊站","scene":"旁人被迫選邊。","en":"Don't make me pick a side.","tr":"別逼我選邊站。","tip":"<b>用法：</b>朋友吵架時很常聽到。","th":5,"lv":1}]},{"id":"mitch","name":"新手寶寶","who":"Cameron · Mitchell · Pam","plot":"Pam 一直找 Mitchell 幫忙顧寶寶，Cam 很吃味。","items":[{"p":"baby whisperer","zh":"安撫寶寶高手","scene":"Mitchell 很會哄寶寶。","en":"She can calm any baby. She's a baby whisperer.","tr":"她能安撫任何寶寶，是哄嬰兒高手。","tip":"<b>延伸：</b>dog whisperer 很會跟狗溝通的人。","th":2,"lv":2},{"p":"hog","zh":"霸佔","scene":"Cam 覺得 Mitchell 霸佔了寶寶。","en":"Stop hogging the remote!","tr":"別一直霸佔遙控器！","tip":"<b>用法：</b>原意是豬，動詞是霸佔不讓。","th":5,"lv":2},{"p":"play second fiddle","zh":"當配角","scene":"Cam 不習慣自己變成配角。","en":"I'm tired of playing second fiddle to my brother.","tr":"我受夠了一直當我哥的配角。","tip":"<b>來源：</b>樂團裡的第二小提琴手。","th":9,"lv":2}]}],"prompts":["你覺得職場上男女平等嗎（用 equal pay、glass ceiling、level the playing field）","你曾經被迫選邊站嗎（用 pick a side、turf war、all things being equal）","你曾經覺得自己只是配角嗎（用 play second fiddle、hog、baby whisperer）"],"challenges":[{"id":"c1","sit":"兩個朋友吵架都要你挺他，你叫他們別逼你選邊站。","uses":["pick a side"],"ans":"Don't make me pick a side."},{"id":"c2","sit":"室友一直霸佔客廳的電視，你叫他別霸佔遙控器。","uses":["hog"],"ans":"Stop hogging the remote!"},{"id":"c3","sit":"你問飯店有沒有代客泊車。","uses":["valet parking"],"ans":"Do you have valet parking?"},{"id":"c4","sit":"兩支手機規格差不多，你說其他條件一樣的話你選便宜的。","uses":["all things being equal"],"ans":"All things being equal, I'd choose the cheaper one."}]},"s08e21":{"title":"Alone Time","lede":"孩子們都不在家，Phil 和 Claire 試著適應空巢生活；Jay 和 Mitchell 意外參加了同一場心靈靜修營；Gloria 生病了，Cam 在一旁照顧她康復。","stories":[{"id":"dunphy","name":"空巢生活","who":"Phil · Claire","plot":"家裡突然只剩兩個人，兩人不太習慣。","items":[{"p":"rattle around","zh":"在大房子裡空蕩蕩地晃","scene":"兩個人住大房子顯得很空。","en":"We just rattle around in this big house now.","tr":"現在我們兩個在這大房子裡晃來晃去。","tip":"<b>畫面：</b>小東西在大盒子裡晃來晃去發出聲音。","th":2,"lv":2},{"p":"too quiet","zh":"安靜得過頭","scene":"家裡安靜得讓人不習慣。","en":"It's too quiet without the kids.","tr":"沒有孩子在家安靜得過頭。","tip":"<b>語氣：</b>It's quiet... too quiet. 是電影經典台詞。","th":9,"lv":1},{"p":"a breather","zh":"喘口氣的時間","scene":"兩人終於可以休息一下。","en":"Let's take a breather before the next round.","tr":"下一輪之前先喘口氣吧。","tip":"<b>搭配：</b>take a breather。","th":8,"lv":1}]},{"id":"jay","name":"靜修營","who":"Jay · Mitchell","plot":"父子意外報名了同一場靜修營。","items":[{"p":"soul-searching","zh":"自我反省、探索內心","scene":"兩人在營隊裡思考人生。","en":"After the breakup, I did a lot of soul-searching.","tr":"分手後我做了很多自我反省。","tip":"<b>搭配：</b>do some soul-searching。","th":4,"lv":2},{"p":"find inner peace","zh":"找到內心平靜","scene":"靜修營的目的就是這個。","en":"Yoga helps me find inner peace.","tr":"瑜伽幫助我找到內心的平靜。","tip":"<b>用法：</b>冥想、宗教、放鬆常說。","th":4,"lv":2},{"p":"meditation retreat","zh":"冥想靜修營","scene":"兩人跑到同一個營隊。","en":"She went on a ten-day meditation retreat.","tr":"她去參加了十天的冥想靜修營。","tip":"<b>用法：</b>retreat 是遠離日常的靜修活動。","th":8,"lv":2}]},{"id":"mitch","name":"照顧 Gloria","who":"Cameron · Gloria","plot":"Gloria 生病了，Cam 照顧她。","items":[{"p":"chicken soup","zh":"雞湯","scene":"生病時就是要喝雞湯。","en":"My mom always makes chicken soup when I'm sick.","tr":"我生病時我媽都會煮雞湯。","tip":"<b>文化：</b>美國人生病的經典安慰食物。","th":8,"lv":1},{"p":"bedridden","zh":"臥病在床","scene":"Gloria 病到起不來。","en":"He was bedridden for a week with the flu.","tr":"他得流感躺了一個禮拜起不來。","tip":"<b>用法：</b>形容病到只能躺床上。","th":8,"lv":2},{"p":"a bad patient","zh":"不乖的病人","scene":"Gloria 生病了還是很難照顧。","en":"My dad is a bad patient. He never listens to the doctor.","tr":"我爸是個不聽話的病人，從來不聽醫生的。","tip":"<b>反義：</b>a good patient。","th":9,"lv":1},{"p":"run a fever","zh":"發燒","scene":"Gloria 燒了起來。","en":"The baby is running a fever.","tr":"寶寶在發燒。","tip":"<b>用法：</b>比 have a fever 更口語。","th":8,"lv":1}]}],"prompts":["家裡只剩你一個人時你都在做什麼（用 rattle around、too quiet、a breather）","你會想參加靜修或冥想活動嗎（用 soul-searching、find inner peace、meditation retreat）","你生病的時候是什麼樣的病人（用 run a fever、bedridden、a bad patient）"],"challenges":[{"id":"c1","sit":"室友發燒了，你打電話跟他媽媽說。","uses":["run a fever"],"ans":"He's running a fever."},{"id":"c2","sit":"家人出國旅行一週，你說家裡沒人安靜得過頭。","uses":["too quiet"],"ans":"It's too quiet at home."},{"id":"c3","sit":"健身房練腿練到一半，你說大家先喘口氣吧。","uses":["a breather"],"ans":"Let's take a breather."},{"id":"c4","sit":"你說你生病時你媽都會煮雞湯。","uses":["chicken soup"],"ans":"My mom always makes chicken soup when I'm sick."}]},"s08e22":{"title":"The Graduates","lede":"第八季最終集，Luke 和 Manny 高中畢業了；Phil 和 Claire 必須接受 Luke 已經長大；Mitchell 和 Cam 則發現 Lily 好像比同齡小孩早熟。","stories":[{"id":"kids","name":"畢業典禮","who":"Luke · Manny · 全家","plot":"兩個男孩戴上方帽，從高中畢業。","items":[{"p":"cap and gown","zh":"學士帽和學士服","scene":"畢業典禮的標準打扮。","en":"We had to rent a cap and gown for graduation.","tr":"我們得租學士帽和學士服參加畢業典禮。","tip":"<b>用法：</b>畢業服的固定說法。","th":3,"lv":2},{"p":"the world is your oyster","zh":"世界任你闖","scene":"畢業後的人生充滿可能。","en":"You're young and smart. The world is your oyster.","tr":"你年輕又聰明，世界任你闖。","tip":"<b>來源：</b>莎士比亞，牡蠣裡可能有珍珠。","th":6,"lv":2},{"p":"end of an era","zh":"一個時代的結束","scene":"高中生活畫下句點。","en":"When the old shop closed, it was the end of an era.","tr":"那家老店關門時，等於一個時代結束了。","tip":"<b>用法：</b>誇張地形容某件事結束。","th":9,"lv":2},{"p":"next chapter","zh":"人生的下一章","scene":"兩人要邁向新階段。","en":"I'm excited for the next chapter of my life.","tr":"我很期待人生的下一章。","tip":"<b>用法：</b>畢業、搬家、換工作很常用。","th":10,"lv":1}]},{"id":"dunphy","name":"兒子長大了","who":"Phil · Claire · Luke","plot":"爸媽要學著接受 Luke 已經長大。","items":[{"p":"come to terms with","zh":"接受、釋懷","scene":"Phil 和 Claire 慢慢接受兒子長大。","en":"It took me a while to come to terms with the breakup.","tr":"我花了一段時間才接受分手。","tip":"<b>用法：</b>面對難以接受的事實。","th":4,"lv":2},{"p":"grow up so fast","zh":"長大得好快","scene":"爸媽感嘆時間過太快。","en":"They grow up so fast!","tr":"他們長大得好快！","tip":"<b>語氣：</b>父母、長輩最愛的感嘆句。","th":2,"lv":1},{"p":"a lump in one's throat","zh":"喉嚨哽住","scene":"典禮上爸媽忍不住感動。","en":"I had a lump in my throat during his speech.","tr":"他致詞時我喉嚨都哽住了。","tip":"<b>畫面：</b>快哭時喉嚨像卡了一塊東西。","th":4,"lv":2}]},{"id":"mitch","name":"早熟的 Lily","who":"Mitchell · Cameron · Lily","plot":"兩人發現 Lily 好像比同年紀的孩子早熟。","items":[{"p":"precocious","zh":"早熟的","scene":"Lily 的言行像個小大人。","en":"She's a precocious kid. She reads adult novels.","tr":"她是個早熟的孩子，會看大人的小說。","tip":"<b>用法：</b>多用在小孩，帶點驚訝語氣。","th":9,"lv":2},{"p":"wise beyond one's years","zh":"比實際年齡成熟","scene":"Lily 說的話很有道理。","en":"She's only ten, but she's wise beyond her years.","tr":"她才十歲，卻比實際年齡還成熟。","tip":"<b>用法：</b>稱讚年輕人很懂事。","th":9,"lv":2},{"p":"old soul","zh":"老靈魂","scene":"Lily 像個小老人。","en":"He loves jazz and old movies. He's an old soul.","tr":"他喜歡爵士樂和老電影，是個老靈魂。","tip":"<b>用法：</b>形容年輕但個性、品味很成熟的人。","th":9,"lv":2}]}],"prompts":["你畢業的時候是什麼心情（用 cap and gown、end of an era、a lump in one's throat）","退伍後你人生的下一章是什麼（用 next chapter、the world is your oyster、come to terms with）","你身邊有很早熟的人嗎（用 precocious、wise beyond one's years、old soul）"],"challenges":[{"id":"c1","sit":"退伍那天，你說這是一個時代的結束。","uses":["end of an era"],"ans":"It's the end of an era."},{"id":"c2","sit":"你剛搬到新城市工作，說很期待人生的下一章。","uses":["next chapter"],"ans":"I'm excited for the next chapter."},{"id":"c3","sit":"你看到表弟長好高，跟阿姨說小孩長大得好快。","uses":["grow up so fast"],"ans":"They grow up so fast!"},{"id":"c4","sit":"朋友喜歡聽老歌，你說他是個老靈魂。","uses":["old soul"],"ans":"He's an old soul."}]},"s09e01":{"title":"Lake Life","lede":"第九季開場，Jay 把全家聚到湖邊一起看日全蝕，順便思考自己想留下什麼；Mitchell 巧遇舊情人；Alex 開始重新思考她跟 Ben 的關係；Phil 和 Claire 努力裝年輕，孩子們找樂子卻搞砸了。","stories":[{"id":"jay","name":"湖邊看日蝕","who":"Jay · 全家","plot":"Jay 召集全家看日蝕，想著自己這一生的意義。","items":[{"p":"solar eclipse","zh":"日蝕","scene":"全家一起在湖邊等日蝕。","en":"We watched the solar eclipse with special glasses.","tr":"我們戴著特殊眼鏡看日蝕。","tip":"<b>延伸：</b>lunar eclipse 月蝕、total eclipse 全蝕。","th":8,"lv":1},{"p":"a sight to behold","zh":"壯觀的景象","scene":"日蝕的畫面讓大家看呆了。","en":"The sunrise from the mountain was a sight to behold.","tr":"山上的日出真是壯觀。","tip":"<b>語氣：</b>比 beautiful 更有讚嘆感。","th":9,"lv":2},{"p":"leave a legacy","zh":"留下傳承","scene":"Jay 想著自己能留下什麼給家人。","en":"I want to leave a legacy my kids can be proud of.","tr":"我想留下讓孩子驕傲的東西。","tip":"<b>用法：</b>legacy 可以是事業、精神、名聲。","th":10,"lv":2}]},{"id":"mitch","name":"舊情人","who":"Mitchell · Cameron · 前任","plot":"Mitchell 在湖邊巧遇舊情人。","items":[{"p":"bump into","zh":"巧遇","scene":"Mitchell 意外碰到前任。","en":"I bumped into my old teacher at the night market.","tr":"我在夜市巧遇以前的老師。","tip":"<b>同義：</b>run into。","th":8,"lv":1},{"p":"unfinished business","zh":"未了的事","scene":"兩人之間好像還有話沒說完。","en":"I feel like we have some unfinished business.","tr":"我覺得我們之間還有些事沒了結。","tip":"<b>用法：</b>感情、恩怨、工作都能用。","th":10,"lv":2}]},{"id":"dunphy","name":"Dunphy 一家","who":"Phil · Claire · Alex · 孩子們","plot":"Phil 和 Claire 想裝年輕，Alex 對感情有了疑慮，孩子們找樂子出了包。","items":[{"p":"drift apart","zh":"漸行漸遠","scene":"Alex 覺得和 Ben 越來越遠。","en":"We were best friends, but we drifted apart after high school.","tr":"我們以前是好朋友，但高中後就漸行漸遠。","tip":"<b>畫面：</b>兩艘船慢慢漂開。","th":2,"lv":1},{"p":"have doubts","zh":"心存疑慮","scene":"Alex 對這段感情開始動搖。","en":"I'm having doubts about this job.","tr":"我對這份工作開始有疑慮。","tip":"<b>搭配：</b>have second thoughts 也很像。","th":4,"lv":1},{"p":"young at heart","zh":"心態年輕","scene":"Phil 和 Claire 想證明自己還很年輕。","en":"My grandma is 80, but she's young at heart.","tr":"我奶奶八十歲了，但心態很年輕。","tip":"<b>用法：</b>稱讚長輩很有活力。","th":9,"lv":2},{"p":"cannonball","zh":"抱膝跳水","scene":"在湖邊就是要跳水。","en":"He did a cannonball into the pool and splashed everyone.","tr":"他抱膝跳進泳池，濺得大家全身濕。","tip":"<b>畫面：</b>像砲彈一樣「砰」地跳進水裡。","th":8,"lv":2},{"p":"go sideways","zh":"出差錯、走偏","scene":"孩子們的計畫失控了。","en":"The party went sideways when the police showed up.","tr":"警察一來，派對就整個走樣了。","tip":"<b>用法：</b>計畫突然出錯。","th":10,"lv":2}]}],"prompts":["你看過日蝕或特別壯觀的景象嗎（用 solar eclipse、a sight to behold、cannonball）","你有沒有跟哪個老朋友漸行漸遠（用 drift apart、bump into、unfinished business）","你想在人生留下什麼（用 leave a legacy、young at heart、have doubts）"],"challenges":[{"id":"c1","sit":"你說你逛夜市時巧遇國中同學。","uses":["bump into"],"ans":"I bumped into my old classmate at the night market."},{"id":"c2","sit":"你說你跟以前的好朋友漸行漸遠了。","uses":["drift apart"],"ans":"We drifted apart."},{"id":"c3","sit":"原本的烤肉計畫下雨泡湯，你說整個走樣了。","uses":["go sideways"],"ans":"Everything went sideways."},{"id":"c4","sit":"你說你阿公心態很年輕。","uses":["young at heart"],"ans":"My grandpa is young at heart."}]},"s09e02":{"title":"The Long Goodbye","lede":"Phil 和 Claire 發現 Alex 在大學裡比他們想像的還獨立；Manny 搬進宿舍後很怕說再見；Haley 在鄉村俱樂部的新工作裡遇到意外的機會。","stories":[{"id":"dunphy","name":"獨立的 Alex","who":"Phil · Claire · Alex","plot":"爸媽發現 Alex 已經不需要他們操心了。","items":[{"p":"cut the apron strings","zh":"讓孩子獨立","scene":"Phil 和 Claire 得學著放手。","en":"You're 25. It's time to cut the apron strings.","tr":"你都二十五歲了，該脫離爸媽獨立了。","tip":"<b>畫面：</b>剪斷媽媽圍裙的帶子。","th":2,"lv":2},{"p":"hit the ground running","zh":"一開始就進入狀況","scene":"Alex 一到學校就上手。","en":"She hit the ground running at her new job.","tr":"她一到新工作就馬上上手。","tip":"<b>來源：</b>軍人跳下直升機一落地就開始跑。","th":10,"lv":2},{"p":"do one's own thing","zh":"做自己想做的事","scene":"Alex 有自己的生活了。","en":"I like to do my own thing on weekends.","tr":"我週末喜歡做自己的事。","tip":"<b>用法：</b>表示不想被安排。","th":8,"lv":1}]},{"id":"jay","name":"Manny 的宿舍","who":"Manny · Jay · Gloria","plot":"Manny 搬進宿舍，卻一直捨不得說再見。","items":[{"p":"drag out","zh":"拖長","scene":"Manny 把道別拖得好長。","en":"Let's not drag out the goodbye.","tr":"我們別把道別拖太久。","tip":"<b>用法：</b>drag something out 讓事情拖延。","th":10,"lv":1},{"p":"linger","zh":"逗留、捨不得離開","scene":"大家在宿舍待了好久。","en":"We lingered at the café after dinner.","tr":"我們晚餐後在咖啡廳多待了一會。","tip":"<b>用法：</b>也能形容味道、感覺久久不散。","th":8,"lv":2},{"p":"a clean break","zh":"一刀兩斷、乾脆結束","scene":"也許乾脆一點說再見比較好。","en":"I think we need a clean break.","tr":"我覺得我們需要乾脆地結束。","tip":"<b>用法：</b>分手、離職、搬家都能用。","th":1,"lv":2}]},{"id":"kids","name":"鄉村俱樂部","who":"Haley","plot":"Haley 在鄉村俱樂部上班，意外遇到好機會。","items":[{"p":"get a foot in the door","zh":"先踏進門檻","scene":"Haley 想藉這份工作打開機會。","en":"An internship is a good way to get a foot in the door.","tr":"實習是踏進這行的好方法。","tip":"<b>畫面：</b>先把腳卡進門縫，門就關不上。","th":3,"lv":2},{"p":"climb the ladder","zh":"往上爬","scene":"Haley 想在職場往上爬。","en":"He climbed the ladder from intern to manager.","tr":"他從實習生一路爬到經理。","tip":"<b>搭配：</b>climb the corporate ladder。","th":3,"lv":2},{"p":"networking","zh":"建立人脈","scene":"俱樂部是認識人的好地方。","en":"Networking is the key to finding a good job.","tr":"建立人脈是找好工作的關鍵。","tip":"<b>用法：</b>動詞 network 也常用。","th":3,"lv":1},{"p":"make the most of it","zh":"好好把握","scene":"Haley 想好好利用這個機會。","en":"It's only one day off, but let's make the most of it.","tr":"只放一天假，但我們好好把握吧。","tip":"<b>用法：</b>make the most of + 機會、時間。","th":10,"lv":1}]}],"prompts":["你第一次離家是什麼時候（用 cut the apron strings、linger、drag out）","你很會說再見嗎（用 a clean break、do one's own thing、make the most of it）","退伍後你想怎麼開始工作（用 get a foot in the door、climb the ladder、networking）"],"challenges":[{"id":"c1","sit":"收假時你媽一直送你到車站不肯走，你叫她別把道別拖太久。","uses":["drag out"],"ans":"Let's not drag out the goodbye."},{"id":"c2","sit":"你說只放兩天假，但要好好把握。","uses":["make the most of it"],"ans":"Let's make the most of it."},{"id":"c3","sit":"你說新來的同事第一天就馬上上手。","uses":["hit the ground running"],"ans":"He hit the ground running."},{"id":"c4","sit":"你說實習是踏進這行的好方法。","uses":["get a foot in the door"],"ans":"It's a good way to get a foot in the door."}]},"s09e03":{"title":"Catch of the Day","lede":"Phil 因為早上一連串的小事，認定今天會很倒楣；廚房包商一直叫 Cam「老闆」，讓 Mitchell 很納悶，也讓 Cam 覺得自己像個被養的「花瓶老公」；Manny 去上大學後，Jay 少了一個對抗 Gloria 的盟友。","stories":[{"id":"dunphy","name":"倒楣的一天","who":"Phil","plot":"Phil 從早上的徵兆認定今天會很衰。","items":[{"p":"bad omen","zh":"不祥之兆","scene":"Phil 覺得早上的事是壞兆頭。","en":"A black cat crossed my path. That's a bad omen.","tr":"一隻黑貓從我面前經過，是不祥之兆。","tip":"<b>反義：</b>good omen 好兆頭。","th":9,"lv":2},{"p":"morning routine","zh":"早晨例行公事","scene":"Phil 的早晨流程被打亂了。","en":"Coffee and a run are part of my morning routine.","tr":"咖啡和跑步是我每天早上的例行公事。","tip":"<b>用法：</b>routine 是固定的習慣流程。","th":8,"lv":1},{"p":"one of those days","zh":"諸事不順的一天","scene":"Phil 的一天從早到晚都不順。","en":"I spilled my coffee and missed the bus. It's one of those days.","tr":"我打翻咖啡又錯過公車，今天真是衰。","tip":"<b>語氣：</b>常搭配嘆氣說。","th":7,"lv":1},{"p":"tempt fate","zh":"鐵齒、挑戰命運","scene":"Phil 不敢做任何冒險的事。","en":"Don't say it'll be easy. You're tempting fate.","tr":"別說會很輕鬆，你這樣是在鐵齒。","tip":"<b>用法：</b>說了可能會招來壞事。","th":10,"lv":2},{"p":"jumpy","zh":"神經緊繃","scene":"Phil 一整天都疑神疑鬼。","en":"I've been jumpy ever since I watched that horror movie.","tr":"看完那部恐怖片後我一直很容易被嚇到。","tip":"<b>用法：</b>容易被嚇到、很緊張。","th":4,"lv":2}]},{"id":"mitch","name":"誰是老闆","who":"Cameron · Mitchell · 包商","plot":"包商一直把 Cam 當老闆，Cam 卻覺得自己像花瓶。","items":[{"p":"trophy husband","zh":"花瓶老公","scene":"Cam 擔心自己被當成好看的配偶。","en":"He doesn't work. He's kind of a trophy husband.","tr":"他不工作，有點像花瓶老公。","tip":"<b>延伸：</b>trophy wife 花瓶老婆，像獎盃一樣拿來炫耀。","th":1,"lv":2},{"p":"kept man","zh":"被包養的男人","scene":"Cam 覺得自己像被 Mitchell 養著。","en":"I don't want to be a kept man. I want my own income.","tr":"我不想被人養，我想有自己的收入。","tip":"<b>語氣：</b>帶點自嘲或貶意。","th":1,"lv":2},{"p":"arm candy","zh":"帶出門好看的伴","scene":"Cam 覺得自己只是好看的陪襯。","en":"He only brought her to the party as arm candy.","tr":"他帶她去派對只是為了撐場面。","tip":"<b>畫面：</b>挽在手臂上的漂亮糖果。","th":1,"lv":2}]},{"id":"jay","name":"少了盟友","who":"Jay · Gloria","plot":"Manny 不在家，Jay 沒人幫他對付 Gloria。","items":[{"p":"outnumbered","zh":"寡不敵眾","scene":"Jay 在家裡變成少數。","en":"Three girls and one boy. I'm totally outnumbered.","tr":"三個女生一個男生，我完全寡不敵眾。","tip":"<b>用法：</b>被動 be outnumbered。","th":9,"lv":1},{"p":"in someone's corner","zh":"站在某人這邊","scene":"Jay 少了挺他的人。","en":"Don't worry. I'm in your corner.","tr":"別擔心，我挺你。","tip":"<b>來源：</b>拳擊比賽時站在選手角落的教練。","th":6,"lv":2}]}],"prompts":["你相信兆頭或運氣嗎（用 bad omen、tempt fate、one of those days）","你每天早上都怎麼開始（用 morning routine、jumpy、outnumbered）","誰是永遠挺你的人（用 in someone's corner、trophy husband、arm candy）"],"challenges":[{"id":"c1","sit":"同梯說這次演習一定很輕鬆，你叫他不要鐵齒。","uses":["tempt fate"],"ans":"Don't tempt fate."},{"id":"c2","sit":"早上鞋帶斷了又被罵，你說今天真衰。","uses":["one of those days"],"ans":"It's one of those days."},{"id":"c3","sit":"你去女朋友家吃飯，她家全是女生，你說你寡不敵眾。","uses":["outnumbered"],"ans":"I'm outnumbered."},{"id":"c4","sit":"你跟朋友說別擔心，你挺他。","uses":["in someone's corner"],"ans":"Don't worry, I'm in your corner."}]},"s09e04":{"title":"Sex, Lies and Kickball","lede":"Jay 和 Gloria 在城裡巧遇老朋友 Shorty，邀他回家住；Lionel 來找 Lily 過夜，讓 Mitchell 和 Cam 懷疑他的家教是不是限制了他；Alex 則看不下去 Claire 對 Ben 的態度，站出來替他說話。","stories":[{"id":"jay","name":"老朋友 Shorty","who":"Jay · Gloria · Shorty","plot":"老朋友 Shorty 來家裡住幾天。","items":[{"p":"old buddy","zh":"老朋友","scene":"Shorty 是 Jay 多年的好友。","en":"He's an old buddy from my army days.","tr":"他是我當兵時的老朋友。","tip":"<b>用法：</b>buddy 比 friend 更親切口語。","th":2,"lv":1},{"p":"shoot the breeze","zh":"閒聊","scene":"老朋友見面就是一直聊。","en":"We sat on the porch and shot the breeze all afternoon.","tr":"我們坐在門廊閒聊了一整個下午。","tip":"<b>同義：</b>chat、hang out and talk。","th":2,"lv":2},{"p":"crash on someone's couch","zh":"借睡別人沙發","scene":"Shorty 在家裡借住。","en":"Can I crash on your couch tonight?","tr":"我今晚可以睡你家沙發嗎？","tip":"<b>用法：</b>crash 口語是「借住、倒頭就睡」。","th":2,"lv":1}]},{"id":"mitch","name":"Lionel 的過夜","who":"Mitchell · Cameron · Lily · Lionel","plot":"Lionel 來過夜，兩人覺得他被保護得太好了。","items":[{"p":"sheltered","zh":"被保護得太好的","scene":"Lionel 很多事都沒經歷過。","en":"She had a sheltered childhood.","tr":"她的童年被保護得很好。","tip":"<b>用法：</b>帶點「不懂世事」的意思。","th":9,"lv":1},{"p":"coddle","zh":"溺愛、過度保護","scene":"兩人覺得 Lionel 被寵壞了。","en":"Stop coddling him. He can do it himself.","tr":"別再寵他了，他可以自己來。","tip":"<b>同義：</b>pamper、baby。","th":2,"lv":2},{"p":"hold someone back","zh":"阻礙某人","scene":"家教可能限制了 Lionel 的發展。","en":"Fear is holding you back.","tr":"是恐懼在阻礙你。","tip":"<b>對比：</b>hold back 不及物是「克制、保留」。","th":10,"lv":1},{"p":"street smarts","zh":"生活智慧、社會歷練","scene":"兩人覺得孩子要懂一點人情世故。","en":"He's not book smart, but he has street smarts.","tr":"他不是讀書型的，但很懂社會生存。","tip":"<b>對比：</b>book smarts 書本知識。","th":9,"lv":2}]},{"id":"dunphy","name":"Alex 挺 Ben","who":"Alex · Claire · Ben","plot":"Alex 看不下去 Claire 對待 Ben 的方式。","items":[{"p":"treat someone like dirt","zh":"把某人當垃圾一樣對待","scene":"Alex 覺得 Claire 對 Ben 太過分。","en":"He treats his employees like dirt.","tr":"他把員工當垃圾一樣看待。","tip":"<b>語氣：</b>很強烈的批評。","th":5,"lv":2},{"p":"be hard on someone","zh":"對某人很嚴厲","scene":"Claire 對 Ben 太嚴格了。","en":"Don't be so hard on yourself.","tr":"別對自己太嚴格。","tip":"<b>用法：</b>Don't be so hard on yourself 很常用來安慰人。","th":5,"lv":1},{"p":"stick up for someone","zh":"挺身維護某人","scene":"Alex 站出來替 Ben 說話。","en":"Thanks for sticking up for me in the meeting.","tr":"謝謝你在會議上替我說話。","tip":"<b>同義：</b>defend、have someone's back。","th":6,"lv":1}]}],"prompts":["你有沒有可以閒聊一整晚的老朋友（用 old buddy、shoot the breeze、crash on someone's couch）","你覺得自己小時候被保護得太好嗎（用 sheltered、coddle、street smarts）","你曾經替別人挺身而出嗎（用 stick up for someone、treat someone like dirt、be hard on someone）"],"challenges":[{"id":"c1","sit":"同事被客戶罵，你事後安慰他別對自己太嚴格。","uses":["be hard on someone"],"ans":"Don't be so hard on yourself."},{"id":"c2","sit":"你去台北看演唱會，問朋友今晚能不能睡他家沙發。","uses":["crash on someone's couch"],"ans":"Can I crash on your couch tonight?"},{"id":"c3","sit":"你謝謝朋友在大家面前替你說話。","uses":["stick up for someone"],"ans":"Thanks for sticking up for me."},{"id":"c4","sit":"你說你跟高中同學閒聊了一整晚。","uses":["shoot the breeze"],"ans":"We shot the breeze all night."}]},"s09e05":{"title":"It's the Great Pumpkin, Phil Dunphy","lede":"身邊的人對萬聖節都提不起勁，讓 Phil 和 Claire 懷疑自己是不是已經過了玩萬聖節的年紀；Mitchell 和 Cam 的廚房裝修一直拖，Mitchell 跑去找 Jay 理論；Cam 在 Gloria 家借住太自在，讓 Gloria 越來越受不了。","stories":[{"id":"dunphy","name":"萬聖節","who":"Phil · Claire","plot":"大家都不熱衷萬聖節，兩人懷疑自己是不是該長大了。","items":[{"p":"outgrow something","zh":"長大後不再適合……","scene":"兩人擔心自己已經過了玩萬聖節的年紀。","en":"I've outgrown cartoons.","tr":"我已經過了看卡通的年紀了。","tip":"<b>用法：</b>也可以說衣服穿不下了。","th":9,"lv":1},{"p":"get into the spirit","zh":"融入節日氣氛","scene":"兩人想讓大家熱血起來。","en":"Put on a hat and get into the holiday spirit!","tr":"戴上帽子，進入節慶氣氛吧！","tip":"<b>搭配：</b>get into the Christmas / Halloween spirit。","th":8,"lv":1},{"p":"kill the mood","zh":"掃興、破壞氣氛","scene":"大家的冷淡讓氣氛冷掉了。","en":"Talking about work really kills the mood.","tr":"聊工作真的很掃興。","tip":"<b>同義：</b>ruin the mood。","th":9,"lv":1}]},{"id":"mitch","name":"廚房裝修","who":"Mitchell · Cameron · Jay","plot":"廚房裝修一直拖，Mitchell 去找 Jay 理論。","items":[{"p":"behind schedule","zh":"進度落後","scene":"工程一直落後。","en":"The project is two weeks behind schedule.","tr":"這個案子進度落後兩週。","tip":"<b>反義：</b>ahead of schedule 超前進度。","th":3,"lv":1},{"p":"renovation","zh":"裝修、翻修","scene":"廚房還在整修中。","en":"The restaurant is closed for renovation.","tr":"這家餐廳整修中暫停營業。","tip":"<b>動詞：</b>renovate。","th":8,"lv":1},{"p":"drag on","zh":"拖拖拉拉","scene":"工程沒完沒了。","en":"The meeting dragged on for three hours.","tr":"這個會拖了三個小時。","tip":"<b>對比：</b>drag out 是主動拖長；drag on 是事情自己拖很久。","th":9,"lv":1},{"p":"have it out with someone","zh":"跟某人把話講開","scene":"Mitchell 直接去找 Jay 攤牌。","en":"I'm going to have it out with him once and for all.","tr":"我要跟他一次把話講清楚。","tip":"<b>語氣：</b>通常會吵起來。","th":5,"lv":2}]},{"id":"jay","name":"不客氣的客人","who":"Cameron · Gloria","plot":"Cam 住在 Gloria 家太隨性，讓她越來越受不了。","items":[{"p":"wear thin","zh":"快沒耐心了","scene":"Gloria 的好客漸漸被磨光。","en":"His jokes are starting to wear thin.","tr":"他的笑話開始讓人厭煩了。","tip":"<b>用法：</b>耐心、藉口、笑話都能 wear thin。","th":4,"lv":2},{"p":"take liberties","zh":"太過隨便、得寸進尺","scene":"Cam 住得太自在了。","en":"He took liberties with my car and drove it all weekend.","tr":"他太隨便了，整個週末都開我的車。","tip":"<b>用法：</b>未經允許隨意行事。","th":5,"lv":2},{"p":"treat the place like a hotel","zh":"把家當旅館","scene":"Gloria 覺得 Cam 把她家當成旅館。","en":"You come home only to sleep. You treat this place like a hotel!","tr":"你回家只是睡覺，把家當旅館啊！","tip":"<b>文化：</b>爸媽罵小孩的經典台詞。","th":2,"lv":2}]}],"prompts":["你覺得自己已經過了哪些東西的年紀（用 outgrow something、get into the spirit、kill the mood）","你遇過拖很久的事情嗎（用 behind schedule、drag on、renovation）","你遇過不客氣的客人或室友嗎（用 take liberties、wear thin、treat the place like a hotel）"],"challenges":[{"id":"c1","sit":"你說會議拖了兩小時。","uses":["drag on"],"ans":"The meeting dragged on for two hours."},{"id":"c2","sit":"你媽說你週末回家只會睡覺，把家當旅館。","uses":["treat the place like a hotel"],"ans":"You treat this place like a hotel!"},{"id":"c3","sit":"你說捷運新路線的工程進度落後。","uses":["behind schedule"],"ans":"The construction is behind schedule."},{"id":"c4","sit":"你說室友一直講冷笑話，大家快受不了了。","uses":["wear thin"],"ans":"His jokes are wearing thin."}]},"s09e06":{"title":"Ten Years Later","lede":"Claire 幫 Jay 和 Gloria 辦結婚十週年花園派對；Phil 的魔術把戲讓 Gloria 不高興；Cam 說服 Mitchell 上台唱歌，結果演出引發一場爭吵；Phil 也在想，如果十五年前走上魔術師這條路，人生會怎樣。","stories":[{"id":"jay","name":"十週年派對","who":"Jay · Gloria · Claire","plot":"Claire 為爸爸和 Gloria 辦結婚十週年派對。","items":[{"p":"garden party","zh":"花園派對","scene":"派對辦在戶外花園。","en":"They're having a garden party this Sunday.","tr":"他們這週日要辦花園派對。","tip":"<b>文化：</b>英式、美式戶外聚會。","th":8,"lv":1},{"p":"milestone anniversary","zh":"重要週年","scene":"十週年是重要的里程碑。","en":"Their 25th is a milestone anniversary.","tr":"他們的二十五週年是很重要的紀念日。","tip":"<b>用法：</b>milestone 是里程碑。","th":8,"lv":2},{"p":"raise a glass","zh":"舉杯祝福","scene":"大家舉杯敬這對夫妻。","en":"Let's raise a glass to the happy couple!","tr":"讓我們舉杯敬這對幸福的新人！","tip":"<b>用法：</b>致詞結尾很常用。","th":8,"lv":1}]},{"id":"dunphy","name":"Phil 的魔術","who":"Phil · Gloria","plot":"Phil 的魔術讓 Gloria 不開心，他也想起當初的魔術夢。","items":[{"p":"a party trick","zh":"派對小把戲","scene":"Phil 在派對上表演魔術。","en":"My party trick is touching my nose with my tongue.","tr":"我的派對絕活是用舌頭碰鼻子。","tip":"<b>用法：</b>用來娛樂朋友的小技能。","th":8,"lv":2},{"p":"sore spot","zh":"痛處、敏感話題","scene":"魔術碰到了 Gloria 的痛處。","en":"Don't mention his ex. It's a sore spot.","tr":"別提他前任，那是他的痛處。","tip":"<b>同義：</b>sensitive subject。","th":4,"lv":2},{"p":"the road not taken","zh":"沒走的那條路","scene":"Phil 想像另一種人生。","en":"Sometimes I think about the road not taken.","tr":"有時候我會想起當初沒走的那條路。","tip":"<b>來源：</b>Robert Frost 的名詩。","th":10,"lv":2},{"p":"what might have been","zh":"原本可能的樣子","scene":"Phil 想著自己可能成為的人。","en":"Don't waste time thinking about what might have been.","tr":"別浪費時間想「如果當初」。","tip":"<b>用法：</b>帶點遺憾的語氣。","th":10,"lv":2}]},{"id":"mitch","name":"上台唱歌","who":"Cameron · Mitchell","plot":"Cam 說服 Mitchell 唱歌，結果兩人吵起來。","items":[{"p":"rope someone into","zh":"硬拉某人參加","scene":"Cam 把 Mitchell 拉上台。","en":"My mom roped me into helping at the temple fair.","tr":"我媽硬拉我去廟會幫忙。","tip":"<b>畫面：</b>用繩子把人套過來。","th":10,"lv":2},{"p":"hit a sour note","zh":"出現不和諧","scene":"演出讓氣氛變調。","en":"The evening hit a sour note when they started arguing.","tr":"他們開始吵架後，晚上的氣氛就變調了。","tip":"<b>來源：</b>唱歌走音的那個音。","th":9,"lv":2},{"p":"crash and burn","zh":"慘敗、搞砸","scene":"這場演出好像失敗了。","en":"I tried to ask her out, but I crashed and burned.","tr":"我想約她，結果慘敗。","tip":"<b>畫面：</b>飛機墜毀燒起來。","th":10,"lv":2}]}],"prompts":["你參加過什麼重要的週年或紀念活動（用 milestone anniversary、garden party、raise a glass）","你有派對絕活嗎（用 a party trick、rope someone into、crash and burn）","你會想如果當初走另一條路嗎（用 the road not taken、what might have been、sore spot）"],"challenges":[{"id":"c1","sit":"室友被他女朋友硬拉去參加歌唱比賽。","uses":["rope someone into"],"ans":"His girlfriend roped him into the singing contest."},{"id":"c2","sit":"你提醒朋友別提他被劈腿的事，那是他的痛處。","uses":["sore spot"],"ans":"Don't mention it. It's a sore spot."},{"id":"c3","sit":"喜宴上你說讓我們舉杯敬新人。","uses":["raise a glass"],"ans":"Let's raise a glass to the happy couple!"},{"id":"c4","sit":"你鼓起勇氣去要電話，結果慘敗。","uses":["crash and burn"],"ans":"I crashed and burned."}]},"s09e07":{"title":"Winner Winner Turkey Dinner","lede":"感恩節時，Jay 大肆慶祝孩子們的成就，但 Mitchell 跟闖入者「搏鬥」和 Claire 跑贏十公里的真實經過，其實沒那麼了不起。","stories":[{"id":"jay","name":"感恩節","who":"Jay · 全家","plot":"Jay 很驕傲地炫耀孩子們的成就。","items":[{"p":"winner winner chicken dinner","zh":"大吉大利，今晚吃雞","scene":"集名就是改編這句話。","en":"We won the game! Winner winner chicken dinner!","tr":"我們贏了！大吉大利今晚吃雞！","tip":"<b>來源：</b>賭場贏錢的口號，後來因為遊戲爆紅。","th":7,"lv":2},{"p":"bragging rights","zh":"炫耀的資格","scene":"Jay 有理由炫耀孩子。","en":"The winner gets bragging rights for a whole year.","tr":"贏的人可以炫耀一整年。","tip":"<b>用法：</b>贏了比賽後的「面子」。","th":8,"lv":2},{"p":"proud papa","zh":"驕傲的老爸","scene":"Jay 一副得意的樣子。","en":"Look at him. He's such a proud papa.","tr":"你看他，真是個驕傲的老爸。","tip":"<b>用法：</b>帶點可愛調侃。","th":2,"lv":1},{"p":"toot one's own horn","zh":"自吹自擂","scene":"大家都忍不住誇自己。","en":"I don't mean to toot my own horn, but I got first place.","tr":"不是我要自誇，但我拿了第一名。","tip":"<b>同義：</b>blow one's own trumpet。","th":9,"lv":2}]},{"id":"mitch","name":"搏鬥闖入者","who":"Mitchell · Cameron","plot":"Mitchell 跟闖入者交手的經過其實很狼狽。","items":[{"p":"intruder","zh":"闖入者","scene":"家裡闖進了不速之客。","en":"The alarm went off when an intruder broke in.","tr":"闖入者一進來警報就響了。","tip":"<b>延伸：</b>burglar 竊賊。","th":8,"lv":2},{"p":"fight off","zh":"擊退","scene":"Mitchell 說自己擊退了對方。","en":"She fought off the attacker with her umbrella.","tr":"她用雨傘擊退了攻擊者。","tip":"<b>用法：</b>也可以 fight off a cold 撐過感冒。","th":10,"lv":1},{"p":"embellish","zh":"加油添醋","scene":"故事被講得比實際精彩。","en":"He likes to embellish his stories.","tr":"他很愛把故事加油添醋。","tip":"<b>用法：</b>比 lie 輕微，只是誇大。","th":10,"lv":2},{"p":"spin a yarn","zh":"編故事、講得天花亂墜","scene":"真相跟大家聽到的不一樣。","en":"My grandpa loves to spin a yarn about his army days.","tr":"我阿公很愛講他當兵時天花亂墜的故事。","tip":"<b>來源：</b>水手一邊織繩一邊講故事。","th":10,"lv":2}]},{"id":"dunphy","name":"十公里賽跑","who":"Claire","plot":"Claire 贏了十公里賽跑，但過程沒那麼光彩。","items":[{"p":"cross the finish line","zh":"衝過終點線","scene":"Claire 第一個抵達終點。","en":"I was so tired, but I crossed the finish line.","tr":"我很累，但還是衝過了終點線。","tip":"<b>用法：</b>也比喻完成一件事。","th":8,"lv":1},{"p":"not all it's cracked up to be","zh":"沒有傳說中那麼好","scene":"勝利背後的真相不如想像。","en":"The new restaurant isn't all it's cracked up to be.","tr":"那家新餐廳沒有傳說中那麼好。","tip":"<b>用法：</b>期待落空時用。","th":9,"lv":2}]}],"prompts":["你最驕傲的一次勝利是什麼（用 bragging rights、cross the finish line、toot one's own horn）","你身邊有很愛加油添醋講故事的人嗎（用 embellish、spin a yarn、not all it's cracked up to be）","你爸媽會跟別人炫耀你嗎（用 proud papa、winner winner chicken dinner、fight off）"],"challenges":[{"id":"c1","sit":"公司桌球比賽拿了第一名，你說不是要自誇但你第一名。","uses":["toot one's own horn"],"ans":"I don't mean to toot my own horn, but I got first place."},{"id":"c2","sit":"你說排隊兩小時的名店沒有傳說中那麼好。","uses":["not all it's cracked up to be"],"ans":"It's not all it's cracked up to be."},{"id":"c3","sit":"部門贏了尾牙的拔河比賽，你說可以炫耀一整年。","uses":["bragging rights"],"ans":"We get bragging rights for a whole year."},{"id":"c4","sit":"你說你喝很多水撐過了感冒。","uses":["fight off"],"ans":"I fought off the cold with lots of water."}]},"s09e08":{"title":"Brushes with Celebrity","lede":"家人們回憶自己跟名人的交集：Chris Martin 成了 Phil 的客戶，Phil 卻突然身體出狀況；Jay 當陪審員，和 Terry Bradshaw 一起審案，最後到了崩潰邊緣；Mitchell 和 Cam 希望被園藝節目主持人選中；Manny 遇到一位討厭粉絲的知名作家。","stories":[{"id":"dunphy","name":"Phil 與名人客戶","who":"Phil · Chris Martin","plot":"名人成了 Phil 的客戶，Phil 卻突然出了狀況。","items":[{"p":"brush with fame","zh":"與名人擦身而過","scene":"每個人都有跟名人接觸的故事。","en":"My brush with fame was meeting a famous singer at the airport.","tr":"我跟名人最近的一次接觸，是在機場遇到一位知名歌手。","tip":"<b>用法：</b>brush 是輕輕擦過。","th":8,"lv":2},{"p":"name-drop","zh":"刻意提名人名字","scene":"大家忍不住炫耀認識名人。","en":"He keeps name-dropping to impress people.","tr":"他一直提名人的名字想讓人刮目相看。","tip":"<b>語氣：</b>帶點貶意。","th":9,"lv":2},{"p":"medical emergency","zh":"緊急醫療狀況","scene":"Phil 突然身體出狀況。","en":"The flight landed early because of a medical emergency.","tr":"因為有人身體緊急不適，飛機提早降落。","tip":"<b>用法：</b>新聞、機上廣播常聽到。","th":8,"lv":1}]},{"id":"jay","name":"陪審團","who":"Jay · Terry Bradshaw","plot":"Jay 當陪審員，跟名人一起審案，快受不了了。","items":[{"p":"civic duty","zh":"公民義務","scene":"當陪審員是公民的責任。","en":"Voting is your civic duty.","tr":"投票是你的公民義務。","tip":"<b>用法：</b>投票、當陪審員、當兵都可以說。","th":8,"lv":2},{"p":"reach a verdict","zh":"做出裁決","scene":"陪審團遲遲無法決定。","en":"The jury couldn't reach a verdict.","tr":"陪審團無法做出裁決。","tip":"<b>用法：</b>verdict 是判決結果。","th":10,"lv":2}]},{"id":"mitch","name":"園藝節目","who":"Mitchell · Cameron","plot":"兩人希望被園藝節目主持人選中。","items":[{"p":"green thumb","zh":"很會種植物","scene":"兩人想展示自己的園藝功力。","en":"My mom has a green thumb. Everything she plants grows.","tr":"我媽很會種東西，種什麼活什麼。","tip":"<b>對比：</b>英式英文說 green fingers。","th":9,"lv":2},{"p":"a household name","zh":"家喻戶曉的人","scene":"主持人是大家都認識的名人。","en":"She became a household name after the show.","tr":"那個節目之後她變得家喻戶曉。","tip":"<b>用法：</b>品牌、名人都能用。","th":9,"lv":2}]},{"id":"kids","name":"Manny 與作家","who":"Manny · 作家","plot":"Manny 遇到偶像作家，卻發現對方討厭粉絲。","items":[{"p":"never meet your heroes","zh":"別見你的偶像","scene":"偶像本人讓 Manny 很失望。","en":"He was so rude. Never meet your heroes.","tr":"他超沒禮貌，真的別見自己的偶像。","tip":"<b>用法：</b>偶像本人常常讓人幻滅。","th":7,"lv":2},{"p":"autograph","zh":"簽名","scene":"Manny 想請作家簽名。","en":"Can I get your autograph?","tr":"可以幫我簽名嗎？","tip":"<b>對比：</b>名人簽名是 autograph；簽文件是 signature。","th":8,"lv":1},{"p":"fan mail","zh":"粉絲來信","scene":"作家對粉絲沒什麼好感。","en":"The actor gets tons of fan mail every week.","tr":"那個演員每週都收到一大堆粉絲信。","tip":"<b>延伸：</b>hate mail 黑粉的信。","th":8,"lv":2}]}],"prompts":["你遇過名人嗎（用 brush with fame、autograph、a household name）","你覺得當兵是公民義務嗎（用 civic duty、reach a verdict、name-drop）","你曾經對偶像幻滅過嗎（用 never meet your heroes、fan mail、green thumb）"],"challenges":[{"id":"c1","sit":"你跟朋友說當兵是公民義務。","uses":["civic duty"],"ans":"It's our civic duty."},{"id":"c2","sit":"你在簽書會問作者能不能幫你簽名。","uses":["autograph"],"ans":"Can I get your autograph?"},{"id":"c3","sit":"你說你阿嬤很會種菜，種什麼活什麼。","uses":["green thumb"],"ans":"My grandma has a green thumb."},{"id":"c4","sit":"你說他一直提認識哪些名人，好煩。","uses":["name-drop"],"ans":"He keeps name-dropping."}]},"s09e09":{"title":"Tough Love","lede":"Phil 為了證明自己夠硬，一個人去森林待一週；Claire 第一次開貨車送貨；Jay 和 Gloria 擔心 Manny 交了一個年紀比他大的女友；Mitchell 給 Cam 和 Lily 上的「人生課」都沒照計畫走。","stories":[{"id":"dunphy","name":"Phil 的荒野挑戰 · Claire 的貨車","who":"Phil · Claire","plot":"Phil 獨自進森林，Claire 第一次開貨車。","items":[{"p":"off the grid","zh":"遠離文明、斷網生活","scene":"Phil 一個人在森林裡沒有網路。","en":"I'm going off the grid for a week. No phone, no internet.","tr":"我要斷網一週，不用手機也不上網。","tip":"<b>來源：</b>grid 是電力網，不接電網的生活。","th":8,"lv":2},{"p":"live off the land","zh":"靠大自然過活","scene":"Phil 想靠自己在野外生存。","en":"They lived off the land, fishing and growing vegetables.","tr":"他們靠捕魚和種菜自給自足。","tip":"<b>用法：</b>野外求生、自給自足。","th":8,"lv":2},{"p":"fend for oneself","zh":"自己照顧自己","scene":"森林裡只能靠自己。","en":"You're on your own now. You have to fend for yourself.","tr":"現在只剩你了，你得自己照顧自己。","tip":"<b>同義：</b>take care of oneself。","th":10,"lv":2},{"p":"test one's limits","zh":"挑戰極限","scene":"Phil 想看看自己能撐多久。","en":"Boot camp really tested my limits.","tr":"新訓真的挑戰了我的極限。","tip":"<b>用法：</b>push one's limits 也很常見。","th":10,"lv":1},{"p":"three-point turn","zh":"三點迴轉","scene":"Claire 開大貨車很難迴轉。","en":"I failed my driving test on the three-point turn.","tr":"我考駕照時三點迴轉沒過。","tip":"<b>用法：</b>窄路迴車的駕駛技巧。","th":8,"lv":2},{"p":"blind spot","zh":"死角、盲點","scene":"貨車的死角很多。","en":"Always check your blind spot before changing lanes.","tr":"變換車道前一定要看死角。","tip":"<b>用法：</b>也比喻自己看不到的缺點。","th":8,"lv":1},{"p":"rookie mistake","zh":"菜鳥錯誤","scene":"Claire 第一次開貨車難免出錯。","en":"Forgetting your ID on day one is a rookie mistake.","tr":"第一天就忘記帶證件，是菜鳥才會犯的錯。","tip":"<b>用法：</b>rookie 是新手、菜鳥。","th":9,"lv":1}]},{"id":"jay","name":"Manny 的女友","who":"Jay · Gloria · Manny","plot":"兩人擔心 Manny 交了一個比他大的女友。","items":[{"p":"older woman","zh":"比自己年長的女人","scene":"Manny 的女友比他大。","en":"He's dating an older woman. She's 30.","tr":"他在跟一個比他大的女生交往，她三十歲。","tip":"<b>用法：</b>描述年齡差的戀愛。","th":1,"lv":1}]},{"id":"mitch","name":"人生課","who":"Mitchell · Cameron · Lily","plot":"Mitchell 想給大家上課，結果完全走樣。","items":[{"p":"for your own good","zh":"都是為你好","scene":"Mitchell 覺得他的教育是為了大家好。","en":"I'm saying this for your own good.","tr":"我說這些是為你好。","tip":"<b>語氣：</b>爸媽、長官最愛說的話。","th":6,"lv":1},{"p":"school of hard knocks","zh":"社會大學","scene":"有些事情只能吃苦才學得會。","en":"I didn't go to college. I graduated from the school of hard knocks.","tr":"我沒念大學，我是社會大學畢業的。","tip":"<b>用法：</b>從艱苦經驗中學習。","th":3,"lv":2}]}],"prompts":["你可以接受斷網一週嗎（用 off the grid、fend for oneself、live off the land）","當兵哪個時刻挑戰了你的極限（用 test one's limits、rookie mistake、school of hard knocks）","你聽過最多次的「為你好」是什麼（用 for your own good、blind spot、three-point turn）"],"challenges":[{"id":"c1","sit":"新訓結束，你說新訓真的挑戰了你的極限。","uses":["test one's limits"],"ans":"Boot camp really tested my limits."},{"id":"c2","sit":"新同事第一天就忘記帶識別證，你說那是菜鳥錯誤。","uses":["rookie mistake"],"ans":"That's a rookie mistake."},{"id":"c3","sit":"你跟朋友說你連假要去山上住小木屋，斷網兩天。","uses":["off the grid"],"ans":"I'm going off the grid for a couple of days."},{"id":"c4","sit":"你媽說她唸你都是為你好。","uses":["for your own good"],"ans":"It's for your own good."}]},"s09e10":{"title":"No Small Feet","lede":"Alex 和 Luke 合開了一個網路生意，目標客群很特別；Claire 為 Pritchett's 衣櫃公司爭取到一個大機會，卻跟 Jay 意見不合；Gloria 和 Phil 怎麼也賣不掉一間房子；Pam 的前伴侶、也就是她兒子的生父 Bo Johnson 突然出現了。","stories":[{"id":"kids","name":"姊弟創業","who":"Alex · Luke","plot":"兩人開了一個網路生意，鎖定很特別的客群。","items":[{"p":"niche market","zh":"小眾市場","scene":"姊弟鎖定很特別的客人。","en":"Handmade dog clothes are a niche market.","tr":"手工狗衣服是個小眾市場。","tip":"<b>發音：</b>niche 美式常唸 nitch。","th":3,"lv":2},{"p":"side hustle","zh":"副業","scene":"這是他們的課外副業。","en":"Driving for Uber is my side hustle.","tr":"開 Uber 是我的副業。","tip":"<b>用法：</b>正職以外賺錢的事。","th":3,"lv":2},{"p":"a gap in the market","zh":"市場缺口","scene":"兩人發現沒人做的生意。","en":"There's a gap in the market for cheap healthy lunches.","tr":"便宜又健康的午餐有市場缺口。","tip":"<b>用法：</b>創業時常說。","th":3,"lv":2}]},{"id":"jay","name":"大機會","who":"Claire · Jay","plot":"Claire 爭取到大案子，卻跟 Jay 處理方式不同。","items":[{"p":"see eye to eye","zh":"意見一致","scene":"父女倆的想法不同。","en":"My dad and I don't see eye to eye on politics.","tr":"我跟我爸對政治的看法不一樣。","tip":"<b>用法：</b>常用否定句。","th":5,"lv":2},{"p":"a golden opportunity","zh":"千載難逢的機會","scene":"Claire 覺得這是絕佳機會。","en":"This is a golden opportunity. Don't waste it.","tr":"這是千載難逢的機會，別浪費了。","tip":"<b>同義：</b>the chance of a lifetime。","th":10,"lv":1},{"p":"bottom line","zh":"底線、重點","scene":"Jay 最在乎的是結果。","en":"The bottom line is, we need more customers.","tr":"重點是我們需要更多客人。","tip":"<b>來源：</b>財報最下面一行的獲利數字。","th":3,"lv":1}]},{"id":"dunphy","name":"賣房子","who":"Gloria · Phil","plot":"兩人想把一間房子賣掉卻一直失敗。","items":[{"p":"lower the price","zh":"降價","scene":"房子賣不掉只好降價。","en":"If nobody buys it, we'll have to lower the price.","tr":"如果沒人買，我們就得降價。","tip":"<b>對比：</b>raise the price 漲價。","th":3,"lv":1}]},{"id":"mitch","name":"生父出現","who":"Cameron · Mitchell · Pam · Bo","plot":"Pam 兒子的生父突然出現了。","items":[{"p":"biological father","zh":"生父","scene":"Bo 是寶寶的親生爸爸。","en":"He never met his biological father.","tr":"他從沒見過親生父親。","tip":"<b>延伸：</b>biological mother 生母、birth parents 親生父母。","th":2,"lv":1},{"p":"come out of the woodwork","zh":"突然冒出來","scene":"Bo 突然現身了。","en":"When he won the lottery, relatives came out of the woodwork.","tr":"他中樂透後，親戚全都冒出來了。","tip":"<b>畫面：</b>蟲從木頭縫裡鑽出來。","th":9,"lv":2},{"p":"out of the blue","zh":"突然、毫無預警","scene":"沒人想到他會出現。","en":"My ex called me out of the blue.","tr":"我前任突然打電話給我。","tip":"<b>來源：</b>晴天霹靂，從藍天裡突然出現。","th":9,"lv":2}]}],"prompts":["你有想過什麼副業或生意嗎（用 side hustle、niche market、a gap in the market）","你跟家人有意見不合的時候嗎（用 see eye to eye、bottom line、a golden opportunity）","有沒有人突然聯絡你（用 out of the blue、come out of the woodwork、lower the price）"],"challenges":[{"id":"c1","sit":"國中同學突然傳訊息給你，你說他毫無預警就聯絡了。","uses":["out of the blue"],"ans":"He texted me out of the blue."},{"id":"c2","sit":"你跟你爸對未來工作的看法不一樣。","uses":["see eye to eye"],"ans":"My dad and I don't see eye to eye."},{"id":"c3","sit":"你說下班後想做點副業。","uses":["side hustle"],"ans":"I want to start a side hustle."},{"id":"c4","sit":"主管說這次派你去日本出差是千載難逢的機會。","uses":["a golden opportunity"],"ans":"This is a golden opportunity."}]},"s09e11":{"title":"He Said, She Shed","lede":"社區管委會駁回了 Claire 想在後院蓋的「She Shed」，Luke 和 Phil 想辦法瞞著她；Pameron 爆出一個家族秘密後，Cam 不情願地跟 Mitchell 去做心理諮商；Jay 幫 Joe 報名兒童高爾夫比賽。","stories":[{"id":"dunphy","name":"She Shed","who":"Phil · Luke · Claire","plot":"管委會不准蓋 Claire 的小屋，兩人想瞞住她。","items":[{"p":"she shed","zh":"女性專屬小屋","scene":"Claire 想在後院有自己的小空間。","en":"She turned the garden shed into a she shed for reading.","tr":"她把花園小屋改成自己看書的小天地。","tip":"<b>對比：</b>man cave 是男人的私人空間。","th":8,"lv":2},{"p":"homeowners association","zh":"社區管委會","scene":"管委會不准她蓋。","en":"The homeowners association won't let us paint the house purple.","tr":"管委會不讓我們把房子漆成紫色。","tip":"<b>縮寫：</b>HOA，美國郊區常見。","th":8,"lv":2},{"p":"keep it under wraps","zh":"保密","scene":"Phil 和 Luke 想把消息壓下來。","en":"We're keeping the surprise party under wraps.","tr":"驚喜派對的事我們先保密。","tip":"<b>畫面：</b>用布把東西蓋起來不給人看。","th":10,"lv":2}]},{"id":"mitch","name":"心理諮商","who":"Cameron · Mitchell · Pameron","plot":"家族秘密曝光後，Cam 被拉去做諮商。","items":[{"p":"couples therapy","zh":"伴侶諮商","scene":"Cam 不太想去。","en":"They went to couples therapy to save their marriage.","tr":"他們去做伴侶諮商想挽救婚姻。","tip":"<b>同義：</b>couples counseling。","th":1,"lv":1},{"p":"skeletons in the closet","zh":"不可告人的秘密","scene":"家族有見不得人的過去。","en":"Every family has a few skeletons in the closet.","tr":"每個家庭都有些不可告人的秘密。","tip":"<b>畫面：</b>衣櫃裡藏著骷髏。","th":10,"lv":2},{"p":"family secret","zh":"家族秘密","scene":"Pameron 爆出了大秘密。","en":"It's a family secret. Don't tell anyone.","tr":"這是家族秘密，別告訴任何人。","tip":"<b>用法：</b>常搭配 keep / reveal。","th":10,"lv":1},{"p":"drag someone to","zh":"硬拖某人去","scene":"Mitchell 硬拉 Cam 去諮商。","en":"My girlfriend dragged me to a yoga class.","tr":"我女友硬拖我去上瑜伽課。","tip":"<b>對比：</b>rope someone into 是拉人參加某件事；drag someone to 是拖人去某個地方。","th":10,"lv":1}]},{"id":"jay","name":"兒童高爾夫","who":"Jay · Joe","plot":"Jay 幫 Joe 報名高爾夫比賽。","items":[{"p":"golf swing","zh":"高爾夫揮桿","scene":"Jay 教 Joe 揮桿。","en":"He's been working on his golf swing all summer.","tr":"他整個夏天都在練揮桿。","tip":"<b>延伸：</b>swing 也用在棒球、網球。","th":8,"lv":1},{"p":"start them young","zh":"從小培養","scene":"Jay 覺得要從小訓練。","en":"Start them young and they'll be pros by twenty.","tr":"從小培養，二十歲就能變職業。","tip":"<b>用法：</b>them 指小孩。","th":2,"lv":2},{"p":"natural talent","zh":"天賦","scene":"Jay 覺得 Joe 很有天分。","en":"She has a natural talent for music.","tr":"她很有音樂天賦。","tip":"<b>搭配：</b>have a natural talent for something。","th":9,"lv":1}]}],"prompts":["你想要有自己的小空間嗎（用 she shed、keep it under wraps、homeowners association）","你家有什麼家族秘密嗎（用 family secret、skeletons in the closet、couples therapy）","你從小被培養什麼才藝嗎（用 start them young、natural talent、drag someone to）"],"challenges":[{"id":"c1","sit":"你說女友硬拖你去看展覽。","uses":["drag someone to"],"ans":"My girlfriend dragged me to an art exhibit."},{"id":"c2","sit":"你們要幫同事慶生，你說這件事先保密。","uses":["keep it under wraps"],"ans":"Let's keep it under wraps."},{"id":"c3","sit":"你說你朋友打鼓很有天分。","uses":["natural talent"],"ans":"He has a natural talent for drums."},{"id":"c4","sit":"你說這是家族秘密，別告訴任何人。","uses":["family secret"],"ans":"It's a family secret. Don't tell anyone."}]},"s09e12":{"title":"Dear Beloved Family","lede":"Phil 肚子劇痛被送進醫院，全家人趕來陪他；Claire 到處找那隻「手術熊」，想陪 Phil 撐過手術；Cam 對 Mitchell 的暗戀對象越來越吃醋；小小的 Joe 開始思考死亡。","stories":[{"id":"dunphy","name":"Phil 住院","who":"Phil · Claire · 全家","plot":"Phil 肚子痛到住院，大家都趕來，Claire 拼命找手術熊。","items":[{"p":"stomach cramps","zh":"胃抽筋、肚子絞痛","scene":"Phil 痛到受不了。","en":"I ate too fast and got stomach cramps.","tr":"我吃太快，肚子絞痛。","tip":"<b>用法：</b>cramps 也可以指生理痛、腳抽筋。","th":8,"lv":1},{"p":"burst appendix","zh":"盲腸破裂","scene":"肚子痛可能很嚴重。","en":"He had a burst appendix and needed surgery right away.","tr":"他盲腸破了，需要馬上開刀。","tip":"<b>延伸：</b>appendicitis 盲腸炎。","th":8,"lv":2},{"p":"touch and go","zh":"情況未明、很危險","scene":"大家都很擔心 Phil 的狀況。","en":"It was touch and go for a while, but he's okay now.","tr":"有一陣子情況很危險，但他現在沒事了。","tip":"<b>用法：</b>形容結果還不確定的緊張時刻。","th":9,"lv":2},{"p":"rally around","zh":"團結起來支持","scene":"全家人都趕到醫院。","en":"When my dad got sick, the whole family rallied around him.","tr":"我爸生病時，全家都團結起來支持他。","tip":"<b>用法：</b>rally around someone。","th":6,"lv":2},{"p":"for good luck","zh":"為了好運","scene":"Claire 想讓手術熊陪著 Phil。","en":"I always wear this bracelet for good luck.","tr":"我總是戴這條手鍊求好運。","tip":"<b>用法：</b>放句尾，說明做某件事的原因。","th":8,"lv":1}]},{"id":"mitch","name":"吃醋的 Cam","who":"Cameron · Mitchell","plot":"Mitchell 有個暗戀對象，Cam 越想越吃醋。","items":[{"p":"celebrity crush","zh":"喜歡的名人","scene":"Mitchell 有個欣賞的人。","en":"I have a huge celebrity crush on a K-pop singer.","tr":"我超迷一個韓團歌手。","tip":"<b>用法：</b>每個人都有，可以大方聊。","th":1,"lv":1},{"p":"jealous streak","zh":"愛吃醋的一面","scene":"Cam 的醋勁發作了。","en":"She has a jealous streak. Don't talk to other girls.","tr":"她很會吃醋，別跟其他女生聊天。","tip":"<b>用法：</b>streak 是個性裡的某種傾向。","th":9,"lv":2}]},{"id":"jay","name":"Joe 想到死亡","who":"Jay · Joe","plot":"年紀小小的 Joe 開始思考生死。","items":[{"p":"kick the bucket","zh":"翹辮子、死掉","scene":"Joe 問起人死掉的事。","en":"I want to travel the world before I kick the bucket.","tr":"我想在死掉之前環遊世界。","tip":"<b>語氣：</b>輕鬆的說法，不適合用在正式或悲傷場合。","th":8,"lv":2},{"p":"the circle of life","zh":"生命的循環","scene":"Jay 跟 Joe 解釋生老病死。","en":"Animals are born and die. It's the circle of life.","tr":"動物出生又死去，這就是生命的循環。","tip":"<b>文化：</b>因《獅子王》主題曲更出名。","th":9,"lv":2},{"p":"the meaning of life","zh":"人生的意義","scene":"Joe 開始想很大的問題。","en":"He's only seven and he's asking about the meaning of life.","tr":"他才七歲就在問人生的意義。","tip":"<b>用法：</b>常帶點幽默。","th":8,"lv":1}]}],"prompts":["你住過院或看過急診嗎（用 stomach cramps、touch and go、rally around）","你暗戀的名人是誰（用 celebrity crush、jealous streak、for good luck）","你想過人生的意義嗎（用 the meaning of life、the circle of life、kick the bucket）"],"challenges":[{"id":"c1","sit":"你說你吃太快肚子絞痛。","uses":["stomach cramps"],"ans":"I got stomach cramps."},{"id":"c2","sit":"你說你打靶前都會戴這條手鍊求好運。","uses":["for good luck"],"ans":"I always wear this bracelet for good luck."},{"id":"c3","sit":"朋友的阿嬤生病，你說全家都團結起來支持她。","uses":["rally around"],"ans":"The whole family rallied around her."},{"id":"c4","sit":"朋友問你暗戀的名人是誰。","uses":["celebrity crush"],"ans":"Who's your celebrity crush?"}]},"s09e13":{"title":"In Your Head","lede":"Luke 在一個 Gloria 覺得很危險的街區失聯了，Manny、Phil 和 Gloria 出動找人；Haley 跑去打斷 Alex 的課，請她幫忙準備面試，Fennerman 博士對她說了實話；Jay 想解開老對手留下的謎題，讓 Claire 很受不了。","stories":[{"id":"dunphy","name":"找 Luke","who":"Manny · Phil · Gloria · Luke","plot":"Luke 失聯了，大家跑到危險的街區找他。","items":[{"p":"wrong side of the tracks","zh":"城裡比較亂的那一區","scene":"Gloria 覺得那一帶不安全。","en":"She grew up on the wrong side of the tracks.","tr":"她在比較窮困混亂的地區長大。","tip":"<b>來源：</b>以前鐵路會把城鎮分成有錢區和窮區。","th":9,"lv":2},{"p":"search party","zh":"搜救隊","scene":"三人組成搜救隊。","en":"They sent out a search party to find the missing hiker.","tr":"他們派出搜救隊找失蹤的登山客。","tip":"<b>用法：</b>搞笑時也說找人的一群朋友。","th":8,"lv":2},{"p":"fall off the face of the earth","zh":"人間蒸發","scene":"Luke 完全聯絡不上。","en":"You haven't texted me in weeks. Did you fall off the face of the earth?","tr":"你好幾週都沒傳訊息，人間蒸發了嗎？","tip":"<b>用法：</b>誇張形容失聯。","th":7,"lv":2}]},{"id":"kids","name":"面試準備","who":"Haley · Alex · Fennerman 博士","plot":"Haley 闖進 Alex 的課，Fennerman 博士給她很直白的建議。","items":[{"p":"ace an interview","zh":"面試表現超好","scene":"Haley 想要面試成功。","en":"I aced the interview and got the job.","tr":"我面試表現超好，拿到工作了。","tip":"<b>用法：</b>ace 當動詞是「拿高分、表現完美」。","th":3,"lv":1},{"p":"tell it like it is","zh":"直話直說","scene":"Fennerman 博士說話不拐彎。","en":"I like my boss. She tells it like it is.","tr":"我喜歡我老闆，她有話直說。","tip":"<b>同義：</b>be straightforward。","th":9,"lv":1},{"p":"a reality check","zh":"認清現實的提醒","scene":"博士的話讓 Haley 清醒過來。","en":"Failing the test was a reality check for me.","tr":"考試沒過讓我認清現實。","tip":"<b>用法：</b>give someone a reality check。","th":9,"lv":2}]},{"id":"jay","name":"對手的謎題","who":"Jay · Claire","plot":"Jay 執意要解開老對手的謎題。","items":[{"p":"rack one's brain","zh":"絞盡腦汁","scene":"Jay 拼命想答案。","en":"I racked my brain but couldn't remember his name.","tr":"我絞盡腦汁還是想不起他的名字。","tip":"<b>畫面：</b>rack 是古代刑具，把腦袋拉到極限。","th":10,"lv":2},{"p":"archrival","zh":"頭號對手","scene":"出謎題的是 Jay 多年的死對頭。","en":"The two schools are archrivals.","tr":"這兩間學校是死對頭。","tip":"<b>用法：</b>arch- 是「首要的」。","th":5,"lv":2},{"p":"crack the code","zh":"破解密碼、找到訣竅","scene":"Jay 想解開謎題。","en":"I finally cracked the code to making good coffee.","tr":"我終於抓到煮好咖啡的訣竅。","tip":"<b>用法：</b>字面和比喻都能用。","th":10,"lv":2},{"p":"brain teaser","zh":"腦筋急轉彎、益智題","scene":"謎題讓 Jay 想破頭。","en":"Here's a brain teaser for you.","tr":"給你一個腦筋急轉彎。","tip":"<b>用法：</b>teaser 是逗弄人的東西。","th":8,"lv":2}]}],"prompts":["你有沒有失聯過讓家人擔心（用 fall off the face of the earth、search party、wrong side of the tracks）","你面試或考試前都怎麼準備（用 ace an interview、a reality check、tell it like it is）","你喜歡解謎題嗎（用 brain teaser、crack the code、rack one's brain）"],"challenges":[{"id":"c1","sit":"朋友一個月沒回訊息，你問他是不是人間蒸發了。","uses":["fall off the face of the earth"],"ans":"Did you fall off the face of the earth?"},{"id":"c2","sit":"你說你面試表現超好，拿到工作了。","uses":["ace an interview"],"ans":"I aced the interview."},{"id":"c3","sit":"你說你絞盡腦汁還是想不起那個大學同學的名字。","uses":["rack one's brain"],"ans":"I racked my brain but couldn't remember his name."},{"id":"c4","sit":"你說你喜歡新主管有話直說。","uses":["tell it like it is"],"ans":"I like that she tells it like it is."}]},"s09e14":{"title":"Written in the Stars","lede":"Jay 完全忘了情人節，Gloria 很不高興，Phil 和 Claire 拉 Jay 一起加入他們的浪漫角色扮演，結果因為一場誤會被請出餐廳；Joe 暗戀 Claire；Mitchell 和 Cam 坐在被放鴿子的 Luke 隔壁；Haley 發現自己和 Arvin 合不來；Manny 擔心這是他第一次沒送媽媽情人節卡片。","stories":[{"id":"jay","name":"被忘記的情人節","who":"Jay · Gloria · Phil · Claire","plot":"Jay 忘了情人節，四人一起過，卻因為誤會被請出去。","items":[{"p":"drop the ball","zh":"搞砸、疏忽","scene":"Jay 這次完全忘了。","en":"I dropped the ball and forgot her birthday.","tr":"我疏忽了，忘了她的生日。","tip":"<b>來源：</b>球賽中漏接。","th":10,"lv":2},{"p":"romantic gesture","zh":"浪漫的舉動","scene":"Gloria 想要一點浪漫。","en":"Flowers are a classic romantic gesture.","tr":"送花是經典的浪漫舉動。","tip":"<b>用法：</b>grand romantic gesture 大陣仗的浪漫。","th":1,"lv":1},{"p":"mistaken identity","zh":"認錯人","scene":"一場誤會讓他們被趕出去。","en":"It was a case of mistaken identity.","tr":"這是一場認錯人的誤會。","tip":"<b>用法：</b>電影、新聞很常見。","th":9,"lv":2}]},{"id":"mitch","name":"餐廳隔壁桌","who":"Mitchell · Cameron · Luke","plot":"兩人在餐廳看到 Luke 一個人被放鴿子。","items":[{"p":"stand someone up","zh":"放某人鴿子","scene":"Luke 的約會對象沒出現。","en":"She stood me up. I waited two hours.","tr":"她放我鴿子，我等了兩小時。","tip":"<b>用法：</b>被放鴿子是 get stood up。","th":1,"lv":1},{"p":"table for one","zh":"一人用餐","scene":"Luke 只好一個人坐。","en":"A table for one, please.","tr":"請給我一人的位子。","tip":"<b>用法：</b>餐廳帶位時的說法。","th":8,"lv":1}]},{"id":"kids","name":"星座與感情","who":"Haley · Arvin · Manny · Joe","plot":"Haley 發現自己跟 Arvin 不合；Joe 暗戀 Claire；Manny 擔心卡片的事。","items":[{"p":"written in the stars","zh":"命中注定","scene":"集名，Haley 在想兩人有沒有緣。","en":"Maybe it's just not written in the stars.","tr":"也許我們就是沒有緣分。","tip":"<b>用法：</b>常用否定句。","th":1,"lv":2},{"p":"zodiac sign","zh":"星座","scene":"Haley 研究兩人的星座。","en":"What's your zodiac sign?","tr":"你是什麼星座？","tip":"<b>用法：</b>也常直接說 What's your sign?","th":8,"lv":1},{"p":"compatible","zh":"合得來的","scene":"兩人好像不太合。","en":"We're just not compatible.","tr":"我們就是合不來。","tip":"<b>反義：</b>incompatible。","th":1,"lv":1},{"p":"a little crush","zh":"小小的暗戀","scene":"Joe 偷偷喜歡 Claire。","en":"I had a little crush on my English teacher.","tr":"我以前偷偷喜歡我的英文老師。","tip":"<b>用法：</b>加 little 讓語氣更輕鬆可愛。","th":1,"lv":1},{"p":"break a tradition","zh":"打破傳統","scene":"Manny 擔心這是第一次沒送卡片。","en":"We've never missed a year. I don't want to break the tradition.","tr":"我們從來沒有漏過一年，我不想打破傳統。","tip":"<b>反義：</b>keep a tradition。","th":8,"lv":1}]}],"prompts":["你被放過鴿子嗎（用 stand someone up、table for one、drop the ball）","你相信星座嗎（用 zodiac sign、compatible、written in the stars）","你做過最浪漫的事是什麼（用 romantic gesture、a little crush、break a tradition）"],"challenges":[{"id":"c1","sit":"朋友約好吃飯卻沒出現，你說他放你鴿子。","uses":["stand someone up"],"ans":"He stood me up."},{"id":"c2","sit":"你問新認識的朋友是什麼星座。","uses":["zodiac sign"],"ans":"What's your zodiac sign?"},{"id":"c3","sit":"你跟店員說一位。","uses":["table for one"],"ans":"A table for one, please."},{"id":"c4","sit":"你說你忘了媽媽生日，真的疏忽了。","uses":["drop the ball"],"ans":"I dropped the ball."}]},"s09e15":{"title":"Spanks for the Memories","lede":"Jay 擔心和 Gloria 的感情進入冷淡期，想試新招；Mitchell 換新工作，Cam 開完慶祝派對就買了一台平台鋼琴，結果 Mitchell 的老闆被抓到侵占公款，工作沒了，兩人只好偷偷把鋼琴退回去；Claire 闖進一場派對，向雜誌總編推銷自己上封面；Phil 告訴 Alex，他可能被一個年輕女生霸凌了。","stories":[{"id":"jay","name":"感情冷淡期","who":"Jay · Gloria","plot":"Jay 覺得兩人的感情有點冷，想找回熱度。","items":[{"p":"dry spell","zh":"低潮期、空窗期","scene":"Jay 覺得兩人最近有點冷淡。","en":"I've been in a dry spell. No dates in six months.","tr":"我最近很空窗，半年沒約會了。","tip":"<b>用法：</b>也能說工作、靈感的低潮。","th":1,"lv":2},{"p":"in a rut","zh":"一成不變、陷入窠臼","scene":"生活變得太規律。","en":"Every day is the same. I'm stuck in a rut.","tr":"每天都一樣，我陷入一成不變的生活。","tip":"<b>畫面：</b>車輪卡在泥地的車轍裡。","th":4,"lv":2}]},{"id":"mitch","name":"平台鋼琴","who":"Cameron · Mitchell","plot":"Cam 太早買了鋼琴，Mitchell 卻丟了工作，只好偷偷退貨。","items":[{"p":"jump the gun","zh":"太早行動、搶先","scene":"Cam 太早就花錢慶祝。","en":"Don't jump the gun. Wait until you get the offer.","tr":"別太急，等拿到錄取再說。","tip":"<b>來源：</b>賽跑時槍還沒響就起跑。","th":10,"lv":2},{"p":"count one's chickens before they hatch","zh":"打如意算盤太早","scene":"工作還沒穩就先花錢。","en":"Don't count your chickens before they hatch.","tr":"別高興得太早。","tip":"<b>用法：</b>常用否定句 Don't...。","th":10,"lv":2},{"p":"embezzle","zh":"侵占、挪用公款","scene":"Mitchell 的老闆出事了。","en":"The manager embezzled money from the company.","tr":"那個經理侵占公司的錢。","tip":"<b>名詞：</b>embezzlement。","th":3,"lv":2},{"p":"return policy","zh":"退貨規定","scene":"兩人想辦法退回鋼琴。","en":"What's your return policy?","tr":"你們的退貨規定是什麼？","tip":"<b>用法：</b>購物時常問。","th":8,"lv":1},{"p":"under the radar","zh":"低調、不引人注意","scene":"兩人偷偷把鋼琴退掉。","en":"We kept the wedding under the radar.","tr":"我們把婚禮辦得很低調。","tip":"<b>畫面：</b>飛機飛在雷達偵測範圍下面。","th":10,"lv":2}]},{"id":"dunphy","name":"推銷自己 · 被霸凌的 Phil","who":"Claire · Phil · Alex","plot":"Claire 想上雜誌封面；Phil 覺得自己被年輕女生霸凌。","items":[{"p":"pitch oneself","zh":"推銷自己","scene":"Claire 向總編推銷自己。","en":"You have two minutes to pitch yourself.","tr":"你有兩分鐘推銷自己。","tip":"<b>用法：</b>pitch 是推銷、提案。","th":3,"lv":2},{"p":"make the cover","zh":"登上封面","scene":"Claire 想登上雜誌封面。","en":"She made the cover of a fashion magazine.","tr":"她登上了時尚雜誌的封面。","tip":"<b>搭配：</b>make the cover of + 雜誌名。","th":3,"lv":2},{"p":"mean girl","zh":"壞女孩、愛欺負人的女生","scene":"有個年輕女生對 Phil 很兇。","en":"She was the mean girl in our class.","tr":"她是我們班上的壞女孩。","tip":"<b>文化：</b>電影《辣妹過招》Mean Girls。","th":9,"lv":1}]}],"prompts":["你的生活有陷入一成不變的時候嗎（用 in a rut、dry spell、under the radar）","你有太早高興的經驗嗎（用 jump the gun、count one's chickens before they hatch、return policy）","如果要推銷自己，你會怎麼說（用 pitch oneself、make the cover、mean girl）"],"challenges":[{"id":"c1","sit":"朋友說他面試一定會上，你叫他別高興得太早。","uses":["count one's chickens before they hatch"],"ans":"Don't count your chickens before they hatch."},{"id":"c2","sit":"你問店員退貨規定是什麼。","uses":["return policy"],"ans":"What's your return policy?"},{"id":"c3","sit":"你說每天都在站哨，生活一成不變。","uses":["in a rut"],"ans":"I'm stuck in a rut."},{"id":"c4","sit":"你說你想低調過生日。","uses":["under the radar"],"ans":"I want to keep my birthday under the radar."}]},"s09e16":{"title":"Wine Weekend","lede":"Haley 帶 Manny 和長輩們去老闆家參加品酒週末，還警告大家千萬別碰一頂珍貴的皇冠；Jay 和 Claire 想讓狗狗 Stella 遠離 Gloria，而 Gloria 跟 Mitchell 去參加 Oprah 的派對；Phil 和 Cam 偷偷瞞著另一半，原來他們都超愛嘻哈。","stories":[{"id":"kids","name":"品酒週末","who":"Haley · Manny · 大家","plot":"Haley 帶大家去老闆家品酒，警告大家別碰皇冠。","items":[{"p":"wine tasting","zh":"品酒會","scene":"大家參加品酒週末。","en":"We went wine tasting in Napa Valley.","tr":"我們去納帕谷品酒。","tip":"<b>用法：</b>go wine tasting。","th":8,"lv":1},{"p":"full-bodied","zh":"酒體飽滿的","scene":"大家假裝很懂酒。","en":"This red wine is very full-bodied.","tr":"這支紅酒酒體很飽滿。","tip":"<b>用法：</b>品酒、咖啡常用，也能形容聲音很厚實。","th":8,"lv":2},{"p":"fancy-schmancy","zh":"超高級的（調侃）","scene":"老闆家非常豪華。","en":"It's a fancy-schmancy restaurant with no prices on the menu.","tr":"那是一家超高級、菜單沒標價的餐廳。","tip":"<b>來源：</b>意第緒語風格的重複，用來調侃。","th":9,"lv":2},{"p":"priceless","zh":"無價的","scene":"那頂皇冠價值連城。","en":"That old photo is priceless to me.","tr":"那張舊照片對我來說是無價的。","tip":"<b>注意：</b>priceless 是「無價」，不是「沒價值」。","th":9,"lv":1}]},{"id":"jay","name":"狗與派對","who":"Jay · Claire · Gloria · Mitchell","plot":"Jay 和 Claire 想讓 Stella 遠離 Gloria，Gloria 跟 Mitchell 去參加名人派對。","items":[{"p":"keep someone away from","zh":"讓……遠離","scene":"兩人不讓狗靠近 Gloria。","en":"Keep the dog away from the cake!","tr":"別讓狗靠近蛋糕！","tip":"<b>用法：</b>keep A away from B。","th":10,"lv":1},{"p":"A-list","zh":"一線的、頂級的","scene":"Gloria 參加的是一線名人的派對。","en":"The party was full of A-list celebrities.","tr":"派對上滿滿都是一線明星。","tip":"<b>延伸：</b>B-list 二線；A-lister 一線名人。","th":9,"lv":2},{"p":"pinch me","zh":"捏我一下（是不是在做夢）","scene":"Gloria 在名人派對上不敢相信。","en":"Pinch me. Is this really happening?","tr":"捏我一下，這是真的嗎？","tip":"<b>用法：</b>好到不敢相信時說。","th":7,"lv":2}]},{"id":"dunphy","name":"秘密嘻哈迷","who":"Phil · Cameron","plot":"兩人都偷偷熱愛嘻哈，不敢讓另一半知道。","items":[{"p":"closet fan","zh":"地下粉絲","scene":"兩人都是隱藏的嘻哈迷。","en":"I'm a closet fan of boy bands.","tr":"我偷偷是男團的粉絲。","tip":"<b>用法：</b>closet 當形容詞是「不公開的」。","th":9,"lv":2},{"p":"old school","zh":"老派、復古經典","scene":"他們喜歡經典嘻哈。","en":"I love old-school hip hop from the 90s.","tr":"我很愛九零年代的老派嘻哈。","tip":"<b>用法：</b>也能形容做事方式很傳統。","th":9,"lv":1},{"p":"drop the beat","zh":"下節奏","scene":"兩人一聽到音樂就忍不住。","en":"DJ, drop the beat!","tr":"DJ，下音樂！","tip":"<b>用法：</b>派對、饒舌常聽到。","th":8,"lv":2}]}],"prompts":["你喝過或想試試品酒嗎（用 wine tasting、full-bodied、fancy-schmancy）","你有什麼不敢公開的興趣嗎（用 closet fan、old school、drop the beat）","你遇過好到不敢相信的事嗎（用 pinch me、priceless、keep someone away from）"],"challenges":[{"id":"c1","sit":"你說你偷偷是韓團的粉絲。","uses":["closet fan"],"ans":"I'm a closet fan of K-pop."},{"id":"c2","sit":"抽到夢想單位，你說捏我一下這是真的嗎。","uses":["pinch me"],"ans":"Pinch me. Is this real?"},{"id":"c3","sit":"家裡開飯，你叫弟弟別讓狗靠近烤肉。","uses":["keep someone away from"],"ans":"Keep the dog away from the barbecue!"},{"id":"c4","sit":"你說阿公送你的錶對你來說是無價的。","uses":["priceless"],"ans":"This watch is priceless to me."}]},"s09e17":{"title":"Royal Visit","lede":"Haley 帶天文物理學家 Arvin 回家見 Phil、Claire 和 Luke，Phil 和 Claire 搶著表現，結果在家裡出了包；Alex 跟消防員 Bill 約會，卻因為覺得他不夠聰明而對他很差；Jay 和 Gloria 被 Joe 朋友的父母嚇到；Cam 對 Mitchell 撒謊，偷跑去看球賽，見到他最愛的球員 George Brett。","stories":[{"id":"dunphy","name":"Arvin 來訪","who":"Phil · Claire · Haley · Arvin · Luke","plot":"爸媽搶著在天才男友面前表現，結果出了包。","items":[{"p":"pull out the good china","zh":"拿出最好的餐具","scene":"Phil 和 Claire 卯足全力招待客人。","en":"My mom pulled out the good china for my girlfriend.","tr":"我媽為了我女友拿出最好的碗盤。","tip":"<b>文化：</b>china 是瓷器，平常捨不得用。","th":8,"lv":2},{"p":"mishap","zh":"小意外、小災難","scene":"家裡出了一點狀況。","en":"There was a little mishap in the kitchen.","tr":"廚房出了一點小意外。","tip":"<b>用法：</b>比 accident 輕微。","th":8,"lv":2}]},{"id":"kids","name":"Alex 與消防員","who":"Alex · Bill","plot":"Alex 跟消防員約會，卻看不起他不夠聰明。","items":[{"p":"it's not rocket science","zh":"這又不難","scene":"Alex 覺得很簡單的事 Bill 不懂。","en":"Just turn it off and on. It's not rocket science.","tr":"關掉再打開就好，這又不難。","tip":"<b>同義：</b>it's not brain surgery。","th":7,"lv":2},{"p":"talk down to someone","zh":"用高高在上的口氣說話","scene":"Alex 對 Bill 講話很瞧不起人。","en":"Don't talk down to me. I'm not a child.","tr":"別用那種口氣跟我說話，我不是小孩。","tip":"<b>用法：</b>好像對方很笨一樣。","th":5,"lv":1},{"p":"look down on","zh":"看不起","scene":"Alex 有點看不起 Bill。","en":"Don't look down on people who didn't go to college.","tr":"別看不起沒念大學的人。","tip":"<b>反義：</b>look up to 尊敬。","th":5,"lv":1},{"p":"too good for someone","zh":"覺得自己比別人高級","scene":"Alex 覺得自己配 Bill 太浪費。","en":"She thinks she's too good for us.","tr":"她覺得自己比我們高級。","tip":"<b>語氣：</b>多半是批評。","th":9,"lv":1}]},{"id":"jay","name":"Joe 朋友的父母","who":"Jay · Gloria","plot":"兩人被 Joe 朋友的父母搞得很有壓力。","items":[{"p":"intimidated","zh":"被嚇到、感到壓力","scene":"對方父母太厲害了。","en":"I felt intimidated by all the smart people at the meeting.","tr":"會議上一堆聰明人讓我很有壓力。","tip":"<b>用法：</b>be / feel intimidated by。","th":4,"lv":1},{"p":"a big shot","zh":"大人物","scene":"對方父母好像都是很厲害的人。","en":"He acts like a big shot because his dad is rich.","tr":"他爸有錢，所以他擺出大人物的樣子。","tip":"<b>語氣：</b>有時帶點諷刺。","th":9,"lv":2}]},{"id":"mitch","name":"偷看球賽","who":"Cameron · Mitchell","plot":"Cam 撒謊偷跑去看球賽，見到偶像。","items":[{"p":"die-hard fan","zh":"死忠粉絲","scene":"Cam 是忠實球迷。","en":"He's a die-hard Yankees fan.","tr":"他是洋基隊的死忠球迷。","tip":"<b>用法：</b>die-hard 是「死都不放棄」。","th":9,"lv":2},{"p":"lie through one's teeth","zh":"睜眼說瞎話","scene":"Cam 為了看球編了一大套藉口。","en":"He lied through his teeth and said he was sick.","tr":"他睜眼說瞎話，說自己生病了。","tip":"<b>對比：</b>white lie 是善意謊言。","th":10,"lv":2}]}],"prompts":["你家有客人來時爸媽會特別招待嗎（用 pull out the good china、mishap、intimidated）","你遇過看不起人的人嗎（用 look down on、talk down to someone、too good for someone）","你是哪支球隊或哪個明星的死忠粉嗎（用 die-hard fan、lie through one's teeth、a big shot）"],"challenges":[{"id":"c1","sit":"你教爸爸用手機叫車教了三次，你說這又不難。","uses":["it's not rocket science"],"ans":"It's not rocket science."},{"id":"c2","sit":"你說你是中信兄弟的死忠球迷。","uses":["die-hard fan"],"ans":"I'm a die-hard CTBC Brothers fan."},{"id":"c3","sit":"你叫朋友別看不起做勞力工作的人。","uses":["look down on"],"ans":"Don't look down on people who do manual labor."},{"id":"c4","sit":"你說新來的經理讓你有點壓力。","uses":["intimidated"],"ans":"I feel a little intimidated by him."}]},"s09e18":{"title":"Daddy Issues","lede":"Gloria 的前任 Jorge 出現了，長得跟 Manny 一模一樣，讓 Jay 很尷尬；Luke 和 Joe 幫 Phil 找送 Claire 的結婚週年禮物；Lily 進入青春期，讓 Mitchell 和 Cam 手忙腳亂。","stories":[{"id":"jay","name":"Gloria 的前任","who":"Jay · Gloria · Jorge","plot":"長得超像 Manny 的 Jorge 出現，Jay 很不自在。","items":[{"p":"dead ringer","zh":"長得一模一樣的人","scene":"Jorge 長得跟 Manny 好像。","en":"He's a dead ringer for his father.","tr":"他跟他爸長得一模一樣。","tip":"<b>搭配：</b>be a dead ringer for someone。","th":9,"lv":2},{"p":"uncanny","zh":"神奇得詭異","scene":"相似度高得嚇人。","en":"The resemblance is uncanny.","tr":"相似度高得嚇人。","tip":"<b>用法：</b>形容像到有點不可思議。","th":9,"lv":2},{"p":"daddy issues","zh":"父親情結","scene":"集名，Jay 也有自己的父子心結。","en":"I think he has daddy issues.","tr":"我覺得他有父親情結。","tip":"<b>注意：</b>口語半開玩笑，有時帶貶意。","th":2,"lv":2}]},{"id":"dunphy","name":"週年禮物","who":"Phil · Luke · Joe","plot":"三個男生一起幫 Claire 挑禮物。","items":[{"p":"a thoughtful gift","zh":"貼心的禮物","scene":"Phil 想送有心意的禮物。","en":"Thanks for the thoughtful gift.","tr":"謝謝你這麼貼心的禮物。","tip":"<b>用法：</b>thoughtful 是「體貼、用心」。","th":8,"lv":1},{"p":"anniversary gift","zh":"週年禮物","scene":"Phil 要找結婚紀念禮物。","en":"What should I get her as an anniversary gift?","tr":"我該送她什麼週年禮物？","tip":"<b>延伸：</b>birthday gift、housewarming gift。","th":1,"lv":1},{"p":"team effort","zh":"團隊合作的成果","scene":"三個男生一起想辦法。","en":"We won the game. It was a real team effort.","tr":"我們贏了，這是大家合作的成果。","tip":"<b>用法：</b>謙虛分功勞時常說。","th":10,"lv":1}]},{"id":"mitch","name":"Lily 的青春期","who":"Mitchell · Cameron · Lily","plot":"Lily 開始進入青春期，兩個爸爸不知所措。","items":[{"p":"throw someone for a loop","zh":"讓某人措手不及","scene":"Lily 的變化讓兩人很慌。","en":"The news really threw me for a loop.","tr":"這個消息真的讓我措手不及。","tip":"<b>畫面：</b>被甩得在空中繞一圈。","th":4,"lv":2},{"p":"growing pains","zh":"成長的煩惱","scene":"Lily 長大的過程不簡單。","en":"Every new company has growing pains.","tr":"每間新公司都會有成長的陣痛。","tip":"<b>用法：</b>小孩、公司、關係都能用。","th":9,"lv":2},{"p":"hormones","zh":"荷爾蒙","scene":"Lily 的情緒起伏很大。","en":"Don't take it personally. It's just hormones.","tr":"別往心裡去，只是荷爾蒙作祟。","tip":"<b>發音：</b>HOR-mones。","th":4,"lv":1},{"p":"awkward phase","zh":"尷尬期","scene":"每個人都有青春期的尷尬階段。","en":"Everyone goes through an awkward phase in middle school.","tr":"每個人國中都會經歷一段尷尬期。","tip":"<b>用法：</b>常指外表、個性還沒長開的時期。","th":9,"lv":1}]}],"prompts":["有人說你長得像誰嗎（用 dead ringer、uncanny、daddy issues）","你送過最用心的禮物是什麼（用 a thoughtful gift、anniversary gift、team effort）","你國中時有什麼尷尬期嗎（用 awkward phase、growing pains、hormones）"],"challenges":[{"id":"c1","sit":"你看到朋友的弟弟，說他跟朋友長得一模一樣。","uses":["dead ringer"],"ans":"He's a dead ringer for you."},{"id":"c2","sit":"收到女友寄來的包裹，你謝謝她貼心的禮物。","uses":["a thoughtful gift"],"ans":"Thanks for the thoughtful gift."},{"id":"c3","sit":"打掃比賽拿第一，你說這是大家合作的成果。","uses":["team effort"],"ans":"It was a real team effort."},{"id":"c4","sit":"你說突然被調單位讓你措手不及。","uses":["throw someone for a loop"],"ans":"It really threw me for a loop."}]},"s09e19":{"title":"CHiPs and Salsa","lede":"Haley 想搞定她那個怪老闆，說服 Gloria 把辣醬賣給專做辣椒產品的公司 NERP；Mitchell 幫 Cam 安排跟警察一起出勤；Phil 和 Claire 互相較勁；Luke 去見大學的院長。","stories":[{"id":"kids","name":"辣醬生意","who":"Haley · Gloria","plot":"Haley 想說服 Gloria 把辣醬賣給公司。","items":[{"p":"seal the deal","zh":"談成交易","scene":"Haley 想把生意談成。","en":"One more meeting and we can seal the deal.","tr":"再開一次會我們就能談成了。","tip":"<b>用法：</b>也可以說感情「確定關係」。","th":3,"lv":2},{"p":"a hard sell","zh":"強力推銷","scene":"Haley 很努力說服 Gloria。","en":"I don't like the hard sell. Just give me the facts.","tr":"我不喜歡被強迫推銷，直接給我資料就好。","tip":"<b>對比：</b>a tough sell 是「很難說服」；a hard sell 是「強力推銷的手法」。","th":3,"lv":2},{"p":"make a case for","zh":"提出理由支持","scene":"Haley 拼命說明好處。","en":"Let me make a case for staying here.","tr":"讓我說說留在這裡的理由。","tip":"<b>用法：</b>make a strong case 理由很充分。","th":10,"lv":2}]},{"id":"mitch","name":"警車隨行","who":"Mitchell · Cameron · 警察","plot":"Mitchell 幫 Cam 安排跟警察出勤。","items":[{"p":"ride-along","zh":"隨警車出勤","scene":"Cam 跟警察一起出任務。","en":"The reporter went on a ride-along with the police.","tr":"記者跟著警察一起出勤。","tip":"<b>文化：</b>美國可以申請跟警察巡邏的體驗。","th":3,"lv":2},{"p":"pull someone over","zh":"把某人攔下來","scene":"警察攔車檢查。","en":"The cop pulled me over for speeding.","tr":"警察因為我超速把我攔下來。","tip":"<b>用法：</b>被攔是 get pulled over。","th":8,"lv":1},{"p":"lights and sirens","zh":"警燈和警笛","scene":"Cam 坐在警車裡超興奮。","en":"The ambulance came with lights and sirens.","tr":"救護車閃燈鳴笛開來了。","tip":"<b>用法：</b>緊急出勤的固定說法。","th":8,"lv":2}]},{"id":"dunphy","name":"夫妻較勁 · Luke 見院長","who
