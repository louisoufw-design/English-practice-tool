","name":"Jay 和 Mitchell 家","who":"Jay · Mitchell · Cameron","plot":"Jay 撐不住無聊的音樂會，跑去酒吧，意外成了 Mitchell 朋友間的萬人迷。","items":[{"p":"sit through","zh":"從頭坐到尾（忍受）","scene":"Jay 實在坐不住整場交響樂會。","en":"I had to sit through a three-hour meeting.","tr":"我得撐完一場三小時的會議。","tip":"<b>語氣：</b>通常是很無聊、不得不忍。","th":8,"lv":1},{"p":"bored to death","zh":"無聊死了","scene":"交響樂讓 Jay 無聊到不行。","en":"I was bored to death in that lecture.","tr":"那堂課我無聊得要死。","tip":"<b>延伸：</b>bored to tears 無聊到想哭。","th":4,"lv":1},{"p":"guys' night","zh":"男生之夜","scene":"一群男生的聚會。","en":"Friday is guys' night. No girlfriends allowed.","tr":"星期五是男生之夜，女朋友不准來。","tip":"<b>對比：</b>girls' night 女生之夜。","th":2,"lv":1},{"p":"buy a round","zh":"請大家喝一輪","scene":"Jay 在酒吧大方請客。","en":"It's my birthday. I'll buy a round!","tr":"今天我生日，這輪我請！","tip":"<b>用法：</b>酒吧文化，一輪是每人一杯。","th":8,"lv":1},{"p":"life of the party","zh":"派對靈魂人物","scene":"Jay 意外成了全場焦點。","en":"My uncle is always the life of the party.","tr":"我舅舅永遠是派對的靈魂人物。","tip":"<b>用法：</b>形容很會炒熱氣氛的人。","th":9,"lv":2},{"p":"big fan of","zh":"很喜歡、是某人的粉絲","scene":"大家都很喜歡 Jay。","en":"I'm a big fan of spicy food.","tr":"我很愛吃辣。","tip":"<b>用法：</b>不只用在明星，也可以用在食物、活動。","th":8,"lv":1}]},{"id":"mitch","name":"Haley 顧 Lily","who":"Haley · Lily","plot":"Haley 第一次幫舅舅們顧 Lily。","items":[{"p":"in good hands","zh":"被照顧得很好","scene":"Mitchell 和 Cam 希望 Lily 交給 Haley 沒問題。","en":"Don't worry about your dog. He's in good hands.","tr":"別擔心你的狗，牠被照顧得很好。","tip":"<b>用法：</b>讓人安心的說法。","th":6,"lv":1}]}],"prompts":["你有沒有一個年紀差很多的朋友（用 odd couple、keep an eye on、big fan of）","你撐完過最無聊的活動（用 sit through、bored to death、guys' night）","你身邊誰是派對靈魂人物（用 life of the party、buy a round、in good hands）"],"challenges":[{"id":"c1","sit":"你去上廁所，請朋友幫你顧一下包包。","uses":["keep an eye on"],"ans":"Can you keep an eye on my bag?"},{"id":"c2","sit":"你跟同梯說今天的莒光日課程無聊死了。","uses":["bored to death"],"ans":"I was bored to death."},{"id":"c3","sit":"你出國玩一週回來，媽媽說她幫你顧好了你的狗，叫你放心。","uses":["in good hands"],"ans":"Don't worry. He was in good hands."},{"id":"c4","sit":"你拿到年終獎金那天跟朋友去酒吧，說這輪你請。","uses":["buy a round"],"ans":"This round's on me. I'll buy a round!"}]},"s02e19":{"title":"The Musical Man","lede":"Cam 接手 Luke 和 Manny 學校的春季音樂劇，完全進入導演模式；Jay 的哥哥來訪，還帶來一個驚人的秘密；Phil 想讓全家演出他的房仲廣告，結果出乎意料。","stories":[{"id":"mitch","name":"Cam 的音樂劇","who":"Cameron · Luke · Manny · Mitchell","plot":"Cam 當上音樂劇導演，要求超嚴格，對每個小演員都很有意見。","items":[{"p":"diva","zh":"很難伺候的大牌","scene":"Cam 和小演員們都有點大牌。","en":"She's such a diva. She won't sing without her own mic.","tr":"她超大牌，沒有自己的麥克風就不唱。","tip":"<b>用法：</b>形容很難搞、很愛擺架子的人。","th":9,"lv":1},{"p":"run the show","zh":"主導一切","scene":"Cam 一接手就全權掌控。","en":"My mom runs the show at home.","tr":"我家是我媽當家。","tip":"<b>對比：</b>call the shots 是做決定；run the show 是整個掌控。","th":10,"lv":2},{"p":"take it from the top","zh":"從頭再來一次","scene":"Cam 一直叫大家從頭再排一次。","en":"That was close. Let's take it from the top.","tr":"差一點，我們從頭再來一次。","tip":"<b>用法：</b>排練、練歌時超常用。","th":8,"lv":2},{"p":"break a leg","zh":"祝演出順利","scene":"上台前大家互相打氣。","en":"Break a leg tonight!","tr":"祝你今晚演出順利！","tip":"<b>注意：</b>演藝圈不說 good luck，改說 break a leg。","th":6,"lv":2},{"p":"opening night","zh":"首演之夜","scene":"首演那晚大家都很緊張。","en":"Tickets for opening night sold out in an hour.","tr":"首演之夜的票一小時就賣光了。","tip":"<b>延伸：</b>電影首映是 premiere。","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · 哥哥","plot":"Jay 的哥哥突然來訪，說出一個讓大家都嚇一跳的秘密。","items":[{"p":"drop a bombshell","zh":"投下震撼彈","scene":"哥哥的秘密讓大家很震驚。","en":"She dropped a bombshell at dinner: she's moving to Canada.","tr":"她在晚餐時投下震撼彈：她要搬去加拿大。","tip":"<b>名詞：</b>bombshell 驚人的消息。","th":10,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 全家","plot":"Phil 想拍房仲廣告，硬拉著全家上鏡。","items":[{"p":"cheesy","zh":"很俗、很老套","scene":"廣告的台詞和畫面都有點俗。","en":"That pickup line is so cheesy.","tr":"那句搭訕台詞超俗。","tip":"<b>用法：</b>形容老套、刻意、有點尷尬的東西。","th":9,"lv":1},{"p":"camera-shy","zh":"怕上鏡頭","scene":"有人一看到鏡頭就僵住。","en":"My dad is camera-shy. He always hides in photos.","tr":"我爸很怕上鏡，拍照都躲起來。","tip":"<b>延伸：</b>shy 害羞。","th":9,"lv":1},{"p":"ham it up","zh":"演得很誇張","scene":"也有人一上鏡就演過頭。","en":"Stop hamming it up. Just act natural.","tr":"別演那麼誇張，自然一點。","tip":"<b>名詞：</b>a ham 愛表演的人。","th":9,"lv":2},{"p":"star in","zh":"主演","scene":"全家主演 Phil 的廣告。","en":"He's starring in a new Netflix series.","tr":"他主演了一部新的 Netflix 影集。","tip":"<b>用法：</b>star 當動詞，star in + 作品。","th":8,"lv":1}]}],"prompts":["你參加過的表演或比賽（用 break a leg、opening night、take it from the top）","你遇過很大牌或很愛掌控的人嗎（用 diva、run the show、drop a bombshell）","你拍照時是怕上鏡還是很愛演（用 camera-shy、ham it up、cheesy）"],"challenges":[{"id":"c1","sit":"朋友今晚要上台表演，你傳訊息幫他打氣。","uses":["break a leg"],"ans":"Break a leg tonight!"},{"id":"c2","sit":"連上晚會彩排出錯，你說我們從頭再來一次。","uses":["take it from the top"],"ans":"Okay, let's take it from the top."},{"id":"c3","sit":"你跟朋友說你媽才是家裡真正當家的人。","uses":["run the show"],"ans":"My mom runs the show at home."},{"id":"c4","sit":"朋友用很老套的話搭訕，你說好俗喔。","uses":["cheesy"],"ans":"That's so cheesy."}]},"s02e20":{"title":"Someone to Watch Over Lily","lede":"Mitchell 和 Cam 要決定萬一自己出事，誰來當 Lily 的監護人，於是偷偷觀察每個親戚：他們看到 Jay 對 Manny 的嚴厲管教、Claire 帶 Luke 去看兒童心理師，還有 Haley 和 Alex 在學校惹麻煩。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人列出監護人的人選，一個一個評估。","items":[{"p":"legal guardian","zh":"法定監護人","scene":"他們要為 Lily 選監護人。","en":"My aunt became my legal guardian after my parents passed away.","tr":"我爸媽過世後，我阿姨成了我的法定監護人。","tip":"<b>延伸：</b>guardian 守護者。","th":2,"lv":2},{"p":"God forbid","zh":"但願不要發生","scene":"他們只是以防萬一。","en":"God forbid anything happens, but we should have a plan.","tr":"但願什麼事都不要發生，但我們要有計畫。","tip":"<b>用法：</b>提到不好的可能時先說，表示不希望發生。","th":7,"lv":2},{"p":"size someone up","zh":"打量、評估某人","scene":"兩人默默觀察每個家人。","en":"He sized me up before shaking my hand.","tr":"他握手前先打量了我一下。","tip":"<b>用法：</b>評估對方的能力或為人。","th":10,"lv":2},{"p":"up to the task","zh":"能勝任","scene":"誰能勝任照顧 Lily 的工作？","en":"Are you sure he's up to the task?","tr":"你確定他能勝任嗎？","tip":"<b>延伸：</b>up to the job 意思一樣。","th":3,"lv":1},{"p":"cross off the list","zh":"從名單上劃掉","scene":"一個個候選人被劃掉。","en":"After that dinner, I crossed him off the list.","tr":"那頓晚餐之後，我就把他從名單上劃掉了。","tip":"<b>延伸：</b>check off the list 是完成打勾。","th":10,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Jay 用很嚴格的方式教育 Manny，兩人在旁邊看得心驚膽跳。","items":[{"p":"tough love","zh":"嚴厲的愛","scene":"Jay 的管教方式是愛之深責之切。","en":"My coach believes in tough love.","tr":"我的教練相信嚴格的愛。","tip":"<b>用法：</b>為了對方好而嚴格。","th":2,"lv":1},{"p":"on one's best behavior","zh":"表現得特別乖","scene":"大家在兩人面前都很努力表現。","en":"Be on your best behavior at Grandma's house.","tr":"在奶奶家要乖一點。","tip":"<b>用法：</b>家長出門前常叮嚀小孩。","th":2,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Luke · Haley · Alex","plot":"Claire 帶 Luke 去看兒童心理師；Haley 和 Alex 在學校也惹了麻煩。","items":[{"p":"talk it out","zh":"把話說開","scene":"心理師要 Luke 把想法說出來。","en":"Instead of fighting, let's talk it out.","tr":"與其吵架，不如把話說開。","tip":"<b>用法：</b>解決衝突的好方法。","th":6,"lv":1},{"p":"act up","zh":"調皮搗蛋、不乖","scene":"孩子們在學校不太乖。","en":"The kids always act up when they're tired.","tr":"孩子們累的時候總是很不乖。","tip":"<b>延伸：</b>My knee is acting up. 也可以是「舊傷又發作」。","th":2,"lv":1},{"p":"a handful","zh":"很難管的人","scene":"三個孩子都不好帶。","en":"My nephew is a handful. He never sits still.","tr":"我姪子很難帶，從來坐不住。","tip":"<b>用法：</b>形容小孩、寵物很難管。","th":9,"lv":1}]}],"prompts":["你覺得誰能勝任照顧你家寵物或小孩（用 up to the task、in good hands、size someone up）","你小時候是乖小孩還是很難管（用 a handful、act up、on one's best behavior）","你的家人或長官用過嚴厲的愛對待你嗎（用 tough love、talk it out、God forbid）"],"challenges":[{"id":"c1","sit":"你帶女朋友回家見爸媽，媽媽叮嚀你弟要乖一點。","uses":["on one's best behavior"],"ans":"Be on your best behavior tonight."},{"id":"c2","sit":"你跟朋友說你姪子超難帶。","uses":["a handful"],"ans":"My nephew is a handful."},{"id":"c3","sit":"兩個好朋友為了錢吵架，你建議他們把話說開。","uses":["talk it out"],"ans":"Just talk it out, guys."},{"id":"c4","sit":"你問主管新來的實習生能不能勝任這個專案。","uses":["up to the task"],"ans":"Do you think he's up to the task?"}]},"s02e21":{"title":"Mother's Day","lede":"母親節，Claire 和 Gloria 帶孩子們去戶外踏青，結果一團亂；Jay 翻到自己多年前寫給媽媽的信，跟 Phil 之間出現尷尬的一刻；Mitchell 幫 Cam 準備床上早餐，讓 Cam 開始質疑兩人之間的角色分工。","stories":[{"id":"dunphy","name":"Claire 和 Gloria 的出遊","who":"Claire · Gloria · 孩子們","plot":"兩位媽媽想在大自然裡過個溫馨母親節，結果越來越糟。","items":[{"p":"the great outdoors","zh":"大自然、戶外","scene":"兩位媽媽想帶孩子親近自然。","en":"My dad loves the great outdoors. He goes camping every month.","tr":"我爸很愛大自然，每個月都去露營。","tip":"<b>語氣：</b>帶點幽默、正式感的說法。","th":8,"lv":1},{"p":"a total disaster","zh":"徹底的災難","scene":"這趟出遊根本是場災難。","en":"The camping trip was a total disaster. It rained all day.","tr":"那次露營簡直是災難，下了一整天雨。","tip":"<b>用法：</b>誇張形容事情搞砸了。","th":9,"lv":1},{"p":"go downhill","zh":"每況愈下","scene":"情況越來越糟。","en":"The party went downhill after the music stopped.","tr":"音樂停了之後派對就越來越無聊。","tip":"<b>畫面：</b>走下坡。","th":9,"lv":1},{"p":"it's the thought that counts","zh":"心意最重要","scene":"禮物不完美也沒關係。","en":"The gift is a little weird, but it's the thought that counts.","tr":"禮物有點怪，但心意最重要。","tip":"<b>用法：</b>收到不太滿意的禮物時的貼心說法。","th":6,"lv":1}]},{"id":"jay","name":"Jay 和 Phil","who":"Jay · Phil","plot":"Jay 翻出自己小時候寫給媽媽的信，一時情緒湧上來，Phil 剛好在旁邊。","items":[{"p":"mama's boy","zh":"媽寶","scene":"這封信透露出 Jay 對媽媽的深厚感情。","en":"He calls his mom five times a day. Total mama's boy.","tr":"他一天打給他媽五次，根本是媽寶。","tip":"<b>語氣：</b>通常是調侃。","th":9,"lv":1},{"p":"choke up","zh":"哽咽","scene":"Jay 讀信時忍不住哽咽。","en":"I choked up during my speech at the wedding.","tr":"我在婚禮致詞時哽咽了。","tip":"<b>用法：</b>情緒激動到說不出話。","th":4,"lv":1},{"p":"get emotional","zh":"情緒激動、感性起來","scene":"硬漢 Jay 難得感性。","en":"I always get emotional at graduations.","tr":"我每次畢業典禮都會變得很感性。","tip":"<b>延伸：</b>Don't get emotional. 別激動。","th":4,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 準備床上早餐給 Cam，Cam 開始想：在這個家，誰才是「媽媽」？","items":[{"p":"breakfast in bed","zh":"在床上吃早餐","scene":"Mitchell 準備了床上早餐。","en":"My kids made me breakfast in bed on my birthday.","tr":"我的孩子在我生日時準備了床上早餐。","tip":"<b>文化：</b>美國母親節、生日的經典驚喜。","th":8,"lv":1},{"p":"who wears the pants","zh":"誰當家作主","scene":"Cam 開始思考兩人的角色。","en":"In their house, it's clear who wears the pants.","tr":"在他們家，很明顯是誰當家。","tip":"<b>畫面：</b>以前穿褲子的人代表一家之主。","th":1,"lv":2},{"p":"role reversal","zh":"角色互換","scene":"兩人的角色好像對調了。","en":"Taking care of my dad when he was sick felt like a role reversal.","tr":"我爸生病時換我照顧他，感覺角色互換了。","tip":"<b>用法：</b>親子、夫妻、上下屬都能用。","th":2,"lv":1}]}],"prompts":["你最難忘的一次出遊災難（用 a total disaster、go downhill、the great outdoors）","你曾經感動到哽咽嗎（用 choke up、get emotional、it's the thought that counts）","你家誰當家作主（用 who wears the pants、role reversal、mama's boy）"],"challenges":[{"id":"c1","sit":"你送媽媽自己做的卡片，跟她說心意最重要。","uses":["it's the thought that counts"],"ans":"It's not much, but it's the thought that counts."},{"id":"c2","sit":"你跟朋友說上次去爬山遇到大雨，根本是場災難。","uses":["a total disaster"],"ans":"It was a total disaster."},{"id":"c3","sit":"退伍典禮上你跟家人說你差點哽咽。","uses":["choke up"],"ans":"I almost choked up."},{"id":"c4","sit":"朋友出去玩一天跟他媽視訊三次，大家笑他是媽寶。","uses":["mama's boy"],"ans":"He's such a mama's boy."}]},"s02e22":{"title":"Good Cop Bad Dog","lede":"Jay 幫一位訓狗師出主意，想把他的事業做起來；Phil 和 Claire 交換角色，一個變嚴格、一個變好說話，讓孩子們很困擾；Cam 生病了，Mitchell 很掙扎到底要不要去看 Lady Gaga 演唱會。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 孩子們","plot":"平常嚴格的 Claire 和好說話的 Phil 交換角色，孩子們完全不適應。","items":[{"p":"good cop, bad cop","zh":"一個扮黑臉一個扮白臉","scene":"爸媽決定交換黑白臉。","en":"My parents always play good cop, bad cop.","tr":"我爸媽總是一個扮黑臉一個扮白臉。","tip":"<b>來源：</b>警匪片中偵訊犯人的技巧。","th":2,"lv":2},{"p":"be the bad guy","zh":"當壞人","scene":"這次換 Phil 當壞人。","en":"I don't want to be the bad guy, but we need to go home.","tr":"我不想當壞人，但我們得回家了。","tip":"<b>用法：</b>做不受歡迎的決定時常說。","th":2,"lv":1},{"p":"lay down the law","zh":"立下規矩、嚴格要求","scene":"Phil 試著對孩子們立規矩。","en":"Mom laid down the law: no phones at dinner.","tr":"媽媽立下規矩：吃飯不准用手機。","tip":"<b>語氣：</b>很強勢地宣布規則。","th":2,"lv":2},{"p":"push someone's buttons","zh":"故意激怒某人","scene":"孩子們很會挑戰爸媽的底線。","en":"My little brother knows how to push my buttons.","tr":"我弟很知道怎麼惹我生氣。","tip":"<b>畫面：</b>按下讓人爆炸的按鈕。","th":5,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · 訓狗師","plot":"Jay 覺得自己很會做生意，忍不住給訓狗師一堆建議。","items":[{"p":"a piece of advice","zh":"一個建議","scene":"Jay 很愛給人建議。","en":"Let me give you a piece of advice: always save money.","tr":"給你一個建議：永遠要存錢。","tip":"<b>注意：</b>advice 不可數，要說 a piece of advice。","th":6,"lv":1},{"p":"get off the ground","zh":"起步、開始運作","scene":"Jay 想幫訓狗師的事業順利起步。","en":"It took two years to get my café off the ground.","tr":"我的咖啡店花了兩年才步上軌道。","tip":"<b>畫面：</b>飛機離開地面起飛。","th":3,"lv":2},{"p":"know-it-all","zh":"自以為什麼都懂的人","scene":"Jay 有時候有點自以為是。","en":"Nobody likes a know-it-all.","tr":"沒有人喜歡自以為無所不知的人。","tip":"<b>語氣：</b>帶有負面意思。","th":9,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Cam 病得很重，Mitchell 很想去演唱會，又覺得不該丟下他。","items":[{"p":"be torn","zh":"左右為難","scene":"Mitchell 很掙扎要不要去。","en":"I'm torn between the two jobs.","tr":"我在兩份工作之間很掙扎。","tip":"<b>用法：</b>be torn between A and B。","th":4,"lv":1},{"p":"FOMO","zh":"錯失恐懼症（怕錯過好事）","scene":"Mitchell 很怕錯過演唱會。","en":"I have FOMO when my friends go out without me.","tr":"朋友沒找我出去，我就會怕錯過什麼。","tip":"<b>全稱：</b>fear of missing out。","th":4,"lv":2},{"p":"sick as a dog","zh":"病得很重","scene":"Cam 病得一塌糊塗。","en":"I was sick as a dog all weekend.","tr":"我整個週末都病得很嚴重。","tip":"<b>語氣：</b>口語誇張說法。","th":8,"lv":2}]}],"prompts":["你家誰扮黑臉、誰扮白臉（用 good cop, bad cop、lay down the law、be the bad guy）","你曾經在兩件事之間很掙扎嗎（用 be torn、FOMO、sick as a dog）","你遇過很愛給建議的人嗎（用 a piece of advice、know-it-all、push someone's buttons）"],"challenges":[{"id":"c1","sit":"你跟朋友說你在兩間研究所之間很掙扎。","uses":["be torn"],"ans":"I'm torn between the two schools."},{"id":"c2","sit":"朋友們週末去夜唱，你卻要加班，跟他們說你超怕錯過。","uses":["FOMO"],"ans":"I've got serious FOMO right now."},{"id":"c3","sit":"你跟剛進公司的新人說給他一個建議：開會時別滑手機。","uses":["a piece of advice"],"ans":"Let me give you a piece of advice: don't use your phone in meetings."},{"id":"c4","sit":"你弟老是知道怎麼惹你生氣。","uses":["push someone's buttons"],"ans":"He knows how to push my buttons."}]},"s02e23":{"title":"See You Next Fall","lede":"全家在 Jay 家集合，準備參加 Alex 的國中畢業典禮，她還要上台致詞；Jay 偷偷打了失敗的肉毒桿菌，努力不讓人發現；Cam 不滿 Mitchell 笑他；Phil 一邊體諒 Claire 捨不得孩子長大，一邊又忍不住吐槽她；車庫門打不開，夫妻倆只好用很特別的方式趕過去。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Alex · Claire · Phil","plot":"Alex 是畢業生代表要上台致詞，Claire 感嘆孩子長得太快；出門前車庫門卻打不開。","items":[{"p":"valedictorian","zh":"畢業生代表","scene":"Alex 要代表畢業生致詞。","en":"She was the valedictorian of her class.","tr":"她是班上的畢業生代表。","tip":"<b>文化：</b>通常是成績第一名的學生。","th":3,"lv":2},{"p":"proud moment","zh":"驕傲的時刻","scene":"看女兒上台是爸媽最驕傲的時刻。","en":"Seeing my brother graduate was a proud moment.","tr":"看我弟畢業是很驕傲的一刻。","tip":"<b>用法：</b>a proud moment for + 人。","th":4,"lv":1},{"p":"time flies","zh":"時間過得好快","scene":"Claire 覺得孩子一下子就長大了。","en":"Time flies! You're already graduating.","tr":"時間過得好快！你都要畢業了。","tip":"<b>延伸：</b>Time flies when you're having fun.","th":7,"lv":1},{"p":"empty nest","zh":"空巢（孩子都離家）","scene":"Claire 開始想像孩子都離開的日子。","en":"My parents have an empty nest now that we've all moved out.","tr":"我們都搬出去了，我爸媽現在是空巢期。","tip":"<b>延伸：</b>empty nester 空巢期的父母。","th":2,"lv":2},{"p":"locked out","zh":"被鎖在外面","scene":"車庫門打不開，車開不出去。","en":"I locked myself out of my apartment again.","tr":"我又把自己鎖在家門外了。","tip":"<b>用法：</b>locked out of + 地方。","th":8,"lv":1},{"p":"be there for","zh":"陪在某人身邊","scene":"Phil 想陪 Claire 度過這個階段。","en":"Whatever happens, I'll be there for you.","tr":"不管發生什麼事，我都會在你身邊。","tip":"<b>用法：</b>表示支持的溫暖說法。","th":6,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 偷偷打了肉毒，結果臉僵到做不出表情。","items":[{"p":"not a good look","zh":"看起來不太妙、形象不好","scene":"Jay 的新臉不太成功。","en":"Yelling at the waiter is not a good look.","tr":"對服務生大吼形象不太好。","tip":"<b>用法：</b>形容外表或行為讓人觀感不佳。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 看到某件事忍不住大笑，Cam 覺得很受傷。","items":[{"p":"laugh at","zh":"嘲笑","scene":"Cam 覺得 Mitchell 在笑他。","en":"Are you laughing at me or with me?","tr":"你是在嘲笑我，還是跟我一起笑？","tip":"<b>對比：</b>laugh at 是嘲笑；laugh with 是一起笑。","th":5,"lv":1},{"p":"keep a straight face","zh":"忍住不笑","scene":"Mitchell 實在忍不住笑。","en":"I couldn't keep a straight face when he started dancing.","tr":"他開始跳舞時我實在忍不住笑。","tip":"<b>用法：</b>常用否定，I couldn't keep a straight face.","th":10,"lv":2},{"p":"can't help it","zh":"忍不住","scene":"Mitchell 說他真的忍不住。","en":"Sorry, I can't help it. It's too funny.","tr":"抱歉，我忍不住，太好笑了。","tip":"<b>用法：</b>I can't help + V-ing 忍不住做某事。","th":7,"lv":1}]}],"prompts":["你畢業時最驕傲的時刻（用 proud moment、time flies、valedictorian）","你曾經忍不住在不該笑的時候笑出來嗎（用 keep a straight face、can't help it、laugh at）","你被鎖在門外過嗎（用 locked out、be there for、not a good look）"],"challenges":[{"id":"c1","sit":"你國中同學的小孩都上小學了，你感嘆時間過得好快。","uses":["time flies"],"ans":"Wow, time flies."},{"id":"c2","sit":"班長講話時同梯放屁，你完全忍不住笑。","uses":["keep a straight face"],"ans":"I couldn't keep a straight face."},{"id":"c3","sit":"你忘了帶鑰匙，跟媽媽說你被鎖在門外。","uses":["locked out"],"ans":"Mom, I'm locked out."},{"id":"c4","sit":"朋友失戀，你跟他說不管怎樣你都在。","uses":["be there for"],"ans":"Whatever happens, I'll be there for you."}]},"s02e24":{"title":"The One That Got Away","lede":"第二季最後一集，Jay 生日只想去釣魚，家人卻堅持要幫他辦派對；Claire 和 Mitchell 被困在小時候的老家院子裡；Phil 在商場遇到大學時的死對頭；Cam 在麵包店講電話教 Manny 怎麼跟六年級女生說話，結果被誤會趕出店外；Jay 的生日最後跟他預期的完全不一樣。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 生日只想清靜去釣魚，大家卻想熱熱鬧鬧幫他慶祝。","items":[{"p":"birthday boy","zh":"壽星","scene":"Jay 是今天的壽星。","en":"Let's hear it for the birthday boy!","tr":"大家為壽星歡呼！","tip":"<b>延伸：</b>birthday girl 女壽星。","th":8,"lv":1},{"p":"make a fuss","zh":"大驚小怪、大費周章","scene":"Jay 不想大家為他忙。","en":"Please don't make a fuss over my birthday.","tr":"拜託別為了我的生日大費周章。","tip":"<b>用法：</b>make a fuss over + 人／事。","th":9,"lv":1},{"p":"for a change","zh":"換換口味、難得一次","scene":"Jay 希望今年能不一樣一點。","en":"Let's eat Thai food for a change.","tr":"我們換換口味吃泰國菜吧。","tip":"<b>用法：</b>放句尾，表示做點不一樣的事。","th":8,"lv":1},{"p":"the one that got away","zh":"錯過的那條大魚（錯過的人）","scene":"這集標題：那個錯過的人或機會。","en":"She's the one that got away. I still think about her.","tr":"她是我錯過的那個人，我到現在還會想她。","tip":"<b>來源：</b>釣魚時跑掉的大魚，後來常指錯過的戀人。","th":1,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Mitchell · Phil","plot":"Claire 和 Mitchell 回到小時候的家，卻被困在院子裡；Phil 在商場遇到大學死對頭，想一雪前恥。","items":[{"p":"a trip down memory lane","zh":"回憶之旅","scene":"回到老家，滿滿都是回憶。","en":"Looking at old photos was a trip down memory lane.","tr":"看舊照片就像一趟回憶之旅。","tip":"<b>用法：</b>懷舊時常說。","th":9,"lv":2},{"p":"arch-enemy","zh":"死對頭","scene":"Phil 遇到了大學時的宿敵。","en":"Batman's arch-enemy is the Joker.","tr":"蝙蝠俠的死對頭是小丑。","tip":"<b>延伸：</b>nemesis 也是宿敵。","th":5,"lv":2},{"p":"settle the score","zh":"算帳、扳回一城","scene":"Phil 想跟死對頭一決高下。","en":"He lost last time, so he wants to settle the score.","tr":"他上次輸了，所以想扳回一城。","tip":"<b>延伸：</b>settle 解決，score 比分。","th":5,"lv":2}]},{"id":"mitch","name":"Cam 和 Manny","who":"Cameron · Manny","plot":"Cam 在麵包店講電話教 Manny 追女生，旁人斷章取義，把他趕了出去。","items":[{"p":"overhear","zh":"無意中聽到","scene":"店裡的人聽到 Cam 講電話。","en":"I overheard them talking about the party.","tr":"我無意間聽到他們在聊派對的事。","tip":"<b>對比：</b>eavesdrop 是故意偷聽；overhear 是不小心聽到。","th":10,"lv":1},{"p":"taken out of context","zh":"斷章取義","scene":"大家只聽到片段，誤會大了。","en":"My words were taken out of context.","tr":"我的話被斷章取義了。","tip":"<b>用法：</b>被誤解時的經典辯解。","th":5,"lv":2},{"p":"get kicked out","zh":"被趕出去","scene":"Cam 被趕出麵包店。","en":"We got kicked out of the library for being too loud.","tr":"我們太吵被趕出圖書館。","tip":"<b>延伸：</b>kick out 趕走。","th":5,"lv":1}]}],"prompts":["你理想中的生日怎麼過（用 birthday boy、make a fuss、for a change）","你錯過的一個人或機會（用 the one that got away、a trip down memory lane、settle the score）","你的話被誤會過嗎（用 taken out of context、overhear、get kicked out）"],"challenges":[{"id":"c1","sit":"你跟朋友說今年生日不要大費周章。","uses":["make a fuss"],"ans":"Please don't make a fuss this year."},{"id":"c2","sit":"平常都吃便當，你提議今晚換換口味吃火鍋。","uses":["for a change"],"ans":"Let's get hot pot for a change."},{"id":"c3","sit":"你跟朋友說你在茶水間不小心聽到同事在聊年終獎金。","uses":["overhear"],"ans":"I overheard them talking about the year-end bonus."},{"id":"c4","sit":"你在 IG 上的一句話被斷章取義，跟朋友解釋。","uses":["taken out of context"],"ans":"That was taken out of context."}]},"s03e01":{"title":"Dude Ranch","lede":"第三季開場，全家到懷俄明州的牧場度假，體驗趕牛、射飛靶和騎馬；Jay 跟一位叫 Hank 的牛仔較上了勁。滿滿的戶外和「硬漢」說法。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Hank","plot":"Jay 看牛仔 Hank 不順眼，兩人暗中較勁。","items":[{"p":"macho","zh":"很 man、大男人","scene":"Jay 和牛仔都想展現男子氣概。","en":"He thinks crying isn't macho.","tr":"他覺得哭不夠 man。","tip":"<b>用法：</b>有時帶點諷刺，形容刻意逞強。","th":9,"lv":2},{"p":"face off","zh":"對決、正面交鋒","scene":"Jay 和 Hank 正面槓上。","en":"The two teams face off in the final tonight.","tr":"兩隊今晚在決賽對決。","tip":"<b>名詞：</b>a face-off 一場對決。","th":5,"lv":2},{"p":"cowboy up","zh":"硬起來、別認輸","scene":"在牧場，大家都得拿出牛仔精神。","en":"It's just a little rain. Cowboy up!","tr":"只是一點雨，硬起來！","tip":"<b>語氣：</b>美式鄉村口語，帶點幽默。","th":6,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 孩子們","plot":"一家人在牧場騎馬趕牛，城市人第一次這麼貼近大自然。","items":[{"p":"saddle up","zh":"上馬、準備出發","scene":"大家要上馬出發了。","en":"Saddle up, everyone. We leave in five minutes.","tr":"大家準備好，五分鐘後出發。","tip":"<b>延伸：</b>不只騎馬，也可以是「準備出發」。","th":10,"lv":2},{"p":"city slicker","zh":"城市佬","scene":"全家都是不懂鄉下生活的城市人。","en":"The farmers laughed at us city slickers.","tr":"農夫們笑我們這些城市佬。","tip":"<b>語氣：</b>略帶嘲笑的說法。","th":9,"lv":2},{"p":"get some fresh air","zh":"呼吸新鮮空氣","scene":"離開城市，終於可以呼吸好空氣。","en":"Let's go outside and get some fresh air.","tr":"我們出去透透氣吧。","tip":"<b>用法：</b>吵架、累了想出去透氣時也常說。","th":8,"lv":1},{"p":"get back on the horse","zh":"跌倒了再爬起來","scene":"從馬上摔下來，還是要再騎上去。","en":"You failed once. Just get back on the horse.","tr":"你失敗一次而已，再站起來吧。","tip":"<b>全句：</b>get back on the horse that threw you。","th":6,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"平常文弱的 Mitchell 射飛靶竟然很準，讓 Cam 大吃一驚。","items":[{"p":"beginner's luck","zh":"新手運","scene":"Mitchell 第一次射擊就很準。","en":"I won the first round. Beginner's luck!","tr":"我第一輪就贏了，新手運啦！","tip":"<b>用法：</b>謙虛或調侃別人時都可以用。","th":7,"lv":2},{"p":"hold one's own","zh":"不落下風、表現不輸人","scene":"Mitchell 在一群硬漢裡也不輸人。","en":"She's new, but she can hold her own.","tr":"她是新人，但表現一點也不輸人。","tip":"<b>用法：</b>在不擅長的環境中撐住。","th":10,"lv":2},{"p":"rough it","zh":"過簡陋的生活、克難一下","scene":"牧場生活沒有城市的舒適。","en":"No Wi-Fi, no hot water. We're roughing it this weekend.","tr":"沒網路沒熱水，這週末要克難一下。","tip":"<b>用法：</b>露營、野外活動時常說。","th":8,"lv":2}]}],"prompts":["你最難忘的戶外經驗（用 get some fresh air、rough it、saddle up）","你第一次做某件事就很成功嗎（用 beginner's luck、hold one's own、get back on the horse）","你身邊有很愛逞強的人嗎（用 macho、face off、cowboy up）"],"challenges":[{"id":"c1","sit":"第一次打靶就打很準，你笑說是新手運。","uses":["beginner's luck"],"ans":"Just beginner's luck!"},{"id":"c2","sit":"你們要去合歡山搭帳篷過兩晚，你跟家人說要克難一下。","uses":["rough it"],"ans":"We're roughing it for two nights."},{"id":"c3","sit":"朋友機車路考沒過很沮喪，你叫他再站起來。","uses":["get back on the horse"],"ans":"You'll pass next time. Get back on the horse."},{"id":"c4","sit":"寢室很悶，你說要出去透透氣。","uses":["get some fresh air"],"ans":"I'm going out to get some fresh air."}]},"s03e02":{"title":"When Good Kids Go Bad","lede":"Mitchell 和 Cam 想宣布要再領養一個孩子，卻擔心 Lily 無法接受多一個寶寶；Claire 和 Jay 各自想證明自己的論點，誰都不肯讓步。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人想先試探 Lily 的反應，再決定怎麼跟大家說要再領養。","items":[{"p":"test the waters","zh":"先試探一下","scene":"他們想先看看 Lily 的反應。","en":"Let's test the waters before we tell everyone.","tr":"告訴大家之前先試探一下吧。","tip":"<b>畫面：</b>先用腳試水溫再下水。","th":10,"lv":2},{"p":"spring it on","zh":"突然告訴、讓人措手不及","scene":"他們不想突然把消息丟給 Lily。","en":"Don't spring it on her at dinner.","tr":"別在晚餐時突然跟她說。","tip":"<b>用法：</b>spring something on someone。","th":10,"lv":2},{"p":"a big step","zh":"一大步、重大決定","scene":"再領養一個孩子是大事。","en":"Moving in together is a big step.","tr":"同居是很重大的一步。","tip":"<b>用法：</b>人生重要決定時常說。","th":10,"lv":1},{"p":"throw a tantrum","zh":"大發脾氣、耍賴","scene":"Lily 一不開心就大鬧。","en":"My nephew threw a tantrum in the supermarket.","tr":"我姪子在超市大哭大鬧。","tip":"<b>用法：</b>多用在小孩，形容大人時更好笑。","th":2,"lv":1},{"p":"only child","zh":"獨生子女","scene":"Lily 習慣當家裡唯一的寶貝。","en":"As an only child, I never had to share my toys.","tr":"我是獨生子，從來不用跟人分玩具。","tip":"<b>延伸：</b>only child syndrome 獨生子女症候群。","th":2,"lv":1}]},{"id":"dunphy","name":"Claire 和 Jay","who":"Claire · Jay","plot":"父女倆為了一件事爭論，誰都想證明自己是對的。","items":[{"p":"prove a point","zh":"證明自己的論點","scene":"兩人都想證明自己是對的。","en":"He ran ten kilometers just to prove a point.","tr":"他跑了十公里只為了證明他說得對。","tip":"<b>用法：</b>做某事只為了讓對方服氣。","th":10,"lv":1},{"p":"stubborn","zh":"固執","scene":"父女倆一樣固執。","en":"My dad is so stubborn. He never asks for directions.","tr":"我爸超固執，從來不問路。","tip":"<b>延伸：</b>stubborn as a mule 跟驢子一樣倔。","th":9,"lv":1},{"p":"agree to disagree","zh":"求同存異、各自保留意見","scene":"最後只能各說各話。","en":"We'll never agree on politics. Let's agree to disagree.","tr":"我們政治立場永遠不會一樣，就各自保留意見吧。","tip":"<b>用法：</b>結束爭論的成熟說法。","th":7,"lv":1},{"p":"the apple doesn't fall far from the tree","zh":"有其父必有其女","scene":"Claire 的倔強根本遺傳自 Jay。","en":"She's as stubborn as her mom. The apple doesn't fall far from the tree.","tr":"她跟她媽一樣倔，真是有其母必有其女。","tip":"<b>用法：</b>孩子很像父母時說。","th":2,"lv":2},{"p":"set someone straight","zh":"糾正某人、把話說清楚","scene":"兩人都想糾正對方的想法。","en":"He thought I was rich, so I set him straight.","tr":"他以為我很有錢，所以我跟他講清楚了。","tip":"<b>用法：</b>澄清誤會時用。","th":10,"lv":2}]}],"prompts":["你做重大決定前會先試探別人的反應嗎（用 test the waters、a big step、spring it on）","你跟家人誰比較固執（用 stubborn、prove a point、agree to disagree）","你跟爸媽哪裡最像（用 the apple doesn't fall far from the tree、only child、throw a tantrum）"],"challenges":[{"id":"c1","sit":"你想跟爸媽說明年要出國打工度假，先試探一下他們的反應。","uses":["test the waters"],"ans":"I'll test the waters first."},{"id":"c2","sit":"你跟朋友爭論哪家鹽酥雞比較好吃，最後說各自保留意見。","uses":["agree to disagree"],"ans":"Let's just agree to disagree."},{"id":"c3","sit":"新同事以為你是老闆的親戚，你跟他講清楚。","uses":["set someone straight"],"ans":"I had to set him straight."},{"id":"c4","sit":"朋友跟他爸一樣愛講冷笑話，你說有其父必有其子。","uses":["the apple doesn't fall far from the tree"],"ans":"The apple doesn't fall far from the tree."}]},"s03e03":{"title":"Phil on Wire","lede":"Jay 跟愛犬 Stella 感情越來越好，讓 Gloria 很吃味；Phil 和 Luke 挑戰走鋼索；Claire 想給兩個女兒上一課人生道理；Cam 開始只喝果汁的斷食，讓他和 Mitchell 的關係變得緊繃。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Stella","plot":"Jay 對狗狗 Stella 寵愛有加，Gloria 覺得自己被比下去。","items":[{"p":"man's best friend","zh":"人類最好的朋友（狗）","scene":"Stella 已經成了 Jay 的最佳夥伴。","en":"They say a dog is man's best friend.","tr":"大家都說狗是人類最好的朋友。","tip":"<b>用法：</b>專指狗。","th":8,"lv":2},{"p":"play favorites","zh":"偏心","scene":"Gloria 覺得 Jay 偏心狗狗。","en":"Teachers shouldn't play favorites.","tr":"老師不應該偏心。","tip":"<b>用法：</b>家長、老師、主管被抱怨時常用。","th":2,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Claire · Haley · Alex","plot":"Phil 和 Luke 在後院練走鋼索；Claire 想讓兩個女兒學到教訓。","items":[{"p":"walk a fine line","zh":"走在微妙的界線上","scene":"走鋼索就像在拿捏分寸。","en":"Parents walk a fine line between strict and too strict.","tr":"父母要在嚴格和太嚴格之間拿捏分寸。","tip":"<b>畫面：</b>走在一條很細的線上。","th":10,"lv":2},{"p":"don't look down","zh":"別往下看","scene":"走鋼索最重要的就是別往下看。","en":"Keep climbing and don't look down.","tr":"繼續爬，別往下看。","tip":"<b>用法：</b>爬高、做困難的事時的鼓勵。","th":6,"lv":1},{"p":"take baby steps","zh":"一步一步慢慢來","scene":"Phil 只能一點一點前進。","en":"You don't have to run ten kilometers. Take baby steps.","tr":"你不用一下就跑十公里，慢慢來。","tip":"<b>用法：</b>學新東西、改變習慣時常說。","th":10,"lv":1},{"p":"learn the hard way","zh":"從慘痛經驗中學到","scene":"Claire 希望女兒們能學到教訓。","en":"I learned the hard way to always back up my files.","tr":"我吃過虧才學會一定要備份檔案。","tip":"<b>用法：</b>吃虧之後才學會。","th":10,"lv":2},{"p":"the real world","zh":"現實社會","scene":"Claire 想讓女兒們知道現實有多殘酷。","en":"School is easy compared to the real world.","tr":"跟現實社會比起來，學校簡單多了。","tip":"<b>延伸：</b>Welcome to the real world. 歡迎來到現實世界。","th":3,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 開始只喝果汁斷食，脾氣越來越差，Mitchell 快受不了。","items":[{"p":"on a cleanse","zh":"在進行斷食排毒","scene":"Cam 這幾天只喝果汁。","en":"I can't eat that. I'm on a cleanse.","tr":"我不能吃那個，我在排毒斷食。","tip":"<b>延伸：</b>juice cleanse 果汁斷食。","th":8,"lv":2},{"p":"hangry","zh":"餓到生氣","scene":"沒吃東西的 Cam 脾氣超差。","en":"Sorry I snapped at you. I'm just hangry.","tr":"抱歉我兇你，我只是餓到暴躁。","tip":"<b>字源：</b>hungry + angry 組成的新字。","th":4,"lv":2},{"p":"cranky","zh":"暴躁、脾氣差","scene":"斷食讓 Cam 整個人很暴躁。","en":"Babies get cranky when they're tired.","tr":"寶寶累了就會鬧脾氣。","tip":"<b>用法：</b>形容一時的壞脾氣。","th":4,"lv":1}]}],"prompts":["你家誰最受寵（用 play favorites、man's best friend、cranky）","你吃過最大的虧（用 learn the hard way、the real world、walk a fine line）","你餓到生氣過嗎（用 hangry、on a cleanse、take baby steps）"],"challenges":[{"id":"c1","sit":"餐廳等位等了一小時，你跟朋友說你已經餓到暴躁了。","uses":["hangry"],"ans":"I'm getting hangry."},{"id":"c2","sit":"你沒存檔就關電腦，跟朋友說你吃了大虧才學會。","uses":["learn the hard way"],"ans":"I learned the hard way."},{"id":"c3","sit":"你媽總是比較疼你弟，你開玩笑說她偏心。","uses":["play favorites"],"ans":"Mom, you're playing favorites."},{"id":"c4","sit":"學弟第一次爬高牆很怕，你叫他別往下看。","uses":["don't look down"],"ans":"Just keep going. Don't look down."}]},"s03e04":{"title":"Door to Door","lede":"Jay 幫 Manny 挨家挨戶賣包裝紙替學校募款；Claire 想在危險的路口爭取一個停車標誌；Phil 和 Luke 想拍爆紅影片；Gloria 則到處找走失的 Stella。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Manny · Gloria","plot":"Jay 教 Manny 怎麼推銷；Gloria 為了找走失的 Stella 翻遍整個社區。","items":[{"p":"door to door","zh":"挨家挨戶","scene":"兩人一家一家去推銷。","en":"They went door to door asking for donations.","tr":"他們挨家挨戶募捐。","tip":"<b>延伸：</b>door-to-door salesman 上門推銷員。","th":3,"lv":1},{"p":"sales pitch","zh":"推銷話術","scene":"Jay 教 Manny 怎麼開口推銷。","en":"His sales pitch was so good I bought two.","tr":"他的推銷話術太厲害，我買了兩個。","tip":"<b>用法：</b>make a sales pitch 推銷。","th":3,"lv":1},{"p":"a tough sell","zh":"很難說服、很難賣","scene":"包裝紙可不好賣。","en":"Getting my dad to try sushi is a tough sell.","tr":"要說服我爸吃壽司很難。","tip":"<b>用法：</b>東西難賣，或想法很難讓人接受。","th":10,"lv":2},{"p":"won't take no for an answer","zh":"不接受拒絕","scene":"Jay 教 Manny 不要輕易被拒絕。","en":"I tried to say no, but she wouldn't take no for an answer.","tr":"我想拒絕，但她不接受。","tip":"<b>用法：</b>形容很堅持、很難拒絕的人。","th":10,"lv":2},{"p":"search high and low","zh":"到處找、翻遍","scene":"Gloria 到處找 Stella。","en":"I searched high and low for my keys.","tr":"我到處找我的鑰匙。","tip":"<b>同義：</b>look everywhere。","th":10,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Luke","plot":"Claire 為了停車標誌跟市政府周旋；Phil 和 Luke 想拍一支爆紅影片。","items":[{"p":"red tape","zh":"繁文縟節、官僚程序","scene":"Claire 碰到一堆行政程序。","en":"It took three months of red tape to get the permit.","tr":"光是跑程序就花了三個月才拿到許可。","tip":"<b>由來：</b>以前公文用紅帶子綁起來。","th":3,"lv":2},{"p":"fight city hall","zh":"跟政府對抗","scene":"Claire 決定跟市政府槓到底。","en":"You can't fight city hall.","tr":"你鬥不過政府的。","tip":"<b>用法：</b>常用否定，表示對抗體制很難。","th":5,"lv":2},{"p":"go viral","zh":"爆紅、瘋傳","scene":"Phil 和 Luke 想拍出瘋傳的影片。","en":"Her dance video went viral overnight.","tr":"她的跳舞影片一夜爆紅。","tip":"<b>延伸：</b>viral video 爆紅影片。","th":8,"lv":1},{"p":"fifteen minutes of fame","zh":"短暫的成名","scene":"每個人都想紅一下。","en":"He got his fifteen minutes of fame on a talent show.","tr":"他在選秀節目上紅了一下。","tip":"<b>來源：</b>Andy Warhol 說每個人都有成名十五分鐘的機會。","th":9,"lv":2}]},{"id":"kids","name":"尋找 Stella","who":"Gloria · 鄰居們","plot":"Gloria 為了找 Stella 把家裡和社區整個翻過來。","items":[{"p":"turn the place upside down","zh":"把地方翻得亂七八糟","scene":"Gloria 把家裡翻了一遍。","en":"I turned the place upside down looking for my passport.","tr":"為了找護照我把家裡翻得亂七八糟。","tip":"<b>用法：</b>找東西找到抓狂時用。","th":10,"lv":2}]}],"prompts":["你推銷或說服過別人買東西嗎（用 sales pitch、a tough sell、won't take no for an answer）","你遇過最麻煩的行政程序（用 red tape、fight city hall、door to door）","你想要爆紅嗎（用 go viral、fifteen minutes of fame、search high and low）"],"challenges":[{"id":"c1","sit":"申請租屋補助要準備一堆文件，你跟朋友抱怨程序很麻煩。","uses":["red tape"],"ans":"So much red tape."},{"id":"c2","sit":"你的手機不見，你跟室友說你到處都找過了。","uses":["search high and low"],"ans":"I searched high and low."},{"id":"c3","sit":"你朋友的貓影片一夜爆紅。","uses":["go viral"],"ans":"Her cat video went viral."},{"id":"c4","sit":"要說服你爸讓你去日本打工很難。","uses":["a tough sell"],"ans":"That's going to be a tough sell."}]},"s03e05":{"title":"Hit and Run","lede":"Claire 和 Phil 跟一位很討人厭的市議員起衝突，讓 Claire 動了參選的念頭；Gloria 想幫忙，卻一直被 Jay 和 Manny 拒絕；Mitchell 和 Cam 的小車禍，讓他們跟一個一直騷擾 Haley 的男生槓上。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · 市議員","plot":"市議員的態度讓 Claire 很火大，她決定自己出來選。","items":[{"p":"run for office","zh":"參選公職","scene":"Claire 開始考慮參選。","en":"My aunt is running for office this year.","tr":"我阿姨今年要參選。","tip":"<b>延伸：</b>run for mayor 選市長。","th":3,"lv":2},{"p":"get things done","zh":"把事情做好、有執行力","scene":"Claire 覺得自己比議員更能做事。","en":"She's not friendly, but she gets things done.","tr":"她不太親切，但很有執行力。","tip":"<b>用法：</b>稱讚很會做事的人。","th":10,"lv":1},{"p":"stand one's ground","zh":"堅守立場","scene":"Claire 面對議員毫不退讓。","en":"When he yelled, she stood her ground.","tr":"他大吼的時候，她毫不退讓。","tip":"<b>畫面：</b>站穩腳步不後退。","th":5,"lv":2},{"p":"what a jerk","zh":"真是個混蛋","scene":"Claire 對議員的評價。","en":"He cut in line and laughed. What a jerk!","tr":"他插隊還在笑，真是個混蛋！","tip":"<b>語氣：</b>罵人但不算太粗。","th":7,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Gloria · Jay · Manny","plot":"Gloria 想幫兩個男人的忙，卻一直被拒絕。","items":[{"p":"lend a hand","zh":"幫忙","scene":"Gloria 想伸出援手。","en":"Can you lend me a hand with these boxes?","tr":"你可以幫我搬這些箱子嗎？","tip":"<b>同義：</b>give someone a hand。","th":6,"lv":1},{"p":"turn down","zh":"拒絕","scene":"她的好意一直被拒絕。","en":"He turned down the job offer.","tr":"他拒絕了那份工作。","tip":"<b>延伸：</b>turn down the music 是把音樂關小聲。","th":10,"lv":1},{"p":"feel useless","zh":"覺得自己沒用","scene":"Gloria 覺得自己幫不上忙。","en":"I felt useless when I couldn't help my mom.","tr":"我幫不了我媽時覺得自己很沒用。","tip":"<b>用法：</b>表達挫折感。","th":4,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Haley","plot":"一場小擦撞後，兩人跟一個騷擾 Haley 的男生正面衝突。","items":[{"p":"road rage","zh":"路怒","scene":"一場擦撞讓人火氣上來。","en":"He got out of the car and yelled. Classic road rage.","tr":"他下車大吼，標準的路怒。","tip":"<b>用法：</b>開車時的暴怒情緒。","th":8,"lv":2},{"p":"hit and run","zh":"肇事逃逸","scene":"撞了就跑，這集標題的由來。","en":"The police are looking for the hit-and-run driver.","tr":"警方正在找肇事逃逸的駕駛。","tip":"<b>用法：</b>當形容詞時加連字號。","th":8,"lv":2},{"p":"tough guy","zh":"硬漢、裝兇的人","scene":"兩人想裝出很兇的樣子。","en":"He acts like a tough guy, but he's scared of spiders.","tr":"他裝成硬漢，其實很怕蜘蛛。","tip":"<b>語氣：</b>有時是諷刺「裝兇」。","th":9,"lv":1}]}],"prompts":["如果你參選，你想改變什麼（用 run for office、get things done、stand one's ground）","你曾經想幫忙卻被拒絕嗎（用 lend a hand、turn down、feel useless）","你在路上遇過很兇的人嗎（用 road rage、what a jerk、tough guy）"],"challenges":[{"id":"c1","sit":"你搬家要把書櫃搬上五樓，請鄰居幫忙。","uses":["lend a hand"],"ans":"Can you lend me a hand?"},{"id":"c2","sit":"你跟家人說你拒絕了朋友的聯誼邀約。","uses":["turn down"],"ans":"I turned down the invitation."},{"id":"c3","sit":"有人在高速公路上狂按喇叭，你說他路怒。","uses":["road rage"],"ans":"That's road rage."},{"id":"c4","sit":"排球隊長被大家質疑，但他堅持自己的戰術。","uses":["stand one's ground"],"ans":"He stood his ground."}]},"s03e06":{"title":"Go Bullfrogs!","lede":"Phil 帶 Haley 去參觀他的母校，順便重溫自己的大學時光；Claire 加入 Mitchell 和 Cam 的男生之夜；Jay 和 Gloria 則擔心 Manny 長大得太快。","stories":[{"id":"dunphy","name":"Phil 和 Haley","who":"Phil · Haley","plot":"Phil 帶 Haley 參觀大學，比 Haley 還興奮。","items":[{"p":"alma mater","zh":"母校","scene":"Phil 帶女兒回自己的母校。","en":"My dad still wears his alma mater's sweatshirt.","tr":"我爸還在穿他母校的大學 T。","tip":"<b>發音：</b>AL-muh MAH-ter，來自拉丁文。","th":3,"lv":2},{"p":"college tour","zh":"參觀大學","scene":"Haley 要開始挑大學了。","en":"We went on a college tour last summer.","tr":"我們去年夏天去參觀大學。","tip":"<b>文化：</b>美國高中生申請大學前常做的事。","th":3,"lv":1},{"p":"glory days","zh":"輝煌時期","scene":"Phil 回憶起自己的大學全盛時期。","en":"He keeps talking about his glory days in high school.","tr":"他一直在講他高中的輝煌時期。","tip":"<b>語氣：</b>有時帶點「放不下過去」的調侃。","th":9,"lv":2},{"p":"school spirit","zh":"愛校精神","scene":"Phil 對母校依然熱情不減。","en":"Our school has a lot of school spirit on game days.","tr":"比賽日我們學校的愛校氣氛超濃。","tip":"<b>用法：</b>穿校服、為校隊加油都是 school spirit。","th":3,"lv":2},{"p":"party school","zh":"很愛開派對的學校","scene":"Haley 對學校的派對氣氛很有興趣。","en":"That university is known as a party school.","tr":"那所大學以派對多聞名。","tip":"<b>語氣：</b>略帶負面，暗示讀書風氣不好。","th":3,"lv":2}]},{"id":"mitch","name":"Claire 加入男生之夜","who":"Claire · Mitchell · Cameron","plot":"Claire 跟著 Mitchell 和 Cam 出去玩，難得放開自己。","items":[{"p":"third wheel","zh":"電燈泡","scene":"Claire 本來擔心自己是電燈泡。","en":"I don't want to be a third wheel on your date.","tr":"我不想當你們約會的電燈泡。","tip":"<b>畫面：</b>腳踏車的第三個輪子，多餘的。","th":1,"lv":2},{"p":"let one's hair down","zh":"放開來玩、放鬆","scene":"平常緊繃的 Claire 終於放鬆了。","en":"It's Friday. Let your hair down!","tr":"今天星期五，放開來玩吧！","tip":"<b>畫面：</b>把盤起來的頭髮放下來。","th":8,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Manny 開始進入青春期，Jay 和 Gloria 很不習慣。","items":[{"p":"hit puberty","zh":"進入青春期","scene":"Manny 開始轉大人了。","en":"He hit puberty and grew ten centimeters in a year.","tr":"他進入青春期，一年長了十公分。","tip":"<b>延伸：</b>puberty 青春期。","th":2,"lv":1},{"p":"voice crack","zh":"變聲、聲音破掉","scene":"Manny 講話開始破音。","en":"My voice cracked in the middle of my speech.","tr":"我演講到一半破音了。","tip":"<b>用法：</b>唱歌、緊張時破音也可以用。","th":8,"lv":2},{"p":"all grown up","zh":"完全長大了","scene":"父母看著孩子突然長大。","en":"Look at you, all grown up!","tr":"看看你，都長這麼大了！","tip":"<b>用法：</b>長輩見到久未見面的晚輩時常說。","th":2,"lv":1}]}],"prompts":["回憶你的學生時代輝煌時期（用 glory days、alma mater、school spirit）","你當過電燈泡嗎（用 third wheel、let one's hair down、party school）","你青春期時發生的趣事（用 hit puberty、voice crack、all grown up）"],"challenges":[{"id":"c1","sit":"朋友約你跟他女朋友一起看電影，你說不想當電燈泡。","uses":["third wheel"],"ans":"I don't want to be the third wheel."},{"id":"c2","sit":"期末考終於考完，你跟朋友說今晚要放開來玩。","uses":["let one's hair down"],"ans":"Tonight, we let our hair down."},{"id":"c3","sit":"親戚好久沒見你，說你都長這麼大了。","uses":["all grown up"],"ans":"Look at you, all grown up!"},{"id":"c4","sit":"你在朋友婚禮上唱歌時破音，大家笑翻。","uses":["voice crack"],"ans":"My voice cracked during the song."}]},"s03e07":{"title":"Treehouse","lede":"Gloria 終於說服 Jay 一起去學騷莎舞；Cam 打賭自己能在酒吧要到女生的電話；Phil 則想親手幫 Luke 蓋一座夢想中的樹屋。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 答應陪 Gloria 跳騷莎舞，跳起來卻手腳不協調。","items":[{"p":"two left feet","zh":"舞跳得很笨拙","scene":"Jay 完全不會跳舞。","en":"I can't dance. I have two left feet.","tr":"我不會跳舞，我四肢不協調。","tip":"<b>畫面：</b>兩隻都是左腳，當然跳不好。","th":9,"lv":2},{"p":"commit to","zh":"承諾、全心投入","scene":"Jay 終於答應要認真學。","en":"If you sign up, you have to commit to it.","tr":"如果你報名了，就要認真投入。","tip":"<b>名詞：</b>commitment 承諾。","th":10,"lv":1},{"p":"follow someone's lead","zh":"跟著某人的帶領","scene":"跳舞時要跟著對方的節奏。","en":"I don't know the steps, so I'll follow your lead.","tr":"我不會舞步，所以我跟著你。","tip":"<b>用法：</b>跳舞、工作都可以用。","th":10,"lv":1},{"p":"bust a move","zh":"跳一段舞、秀舞步","scene":"Gloria 很會跳，一上場就秀起舞步。","en":"When the music started, my grandma busted a move.","tr":"音樂一下，我奶奶就跳起來了。","tip":"<b>語氣：</b>很口語、俏皮的說法。","th":8,"lv":2}]},{"id":"mitch","name":"Cam 的賭局","who":"Cameron · Mitchell","plot":"Cam 跟朋友打賭，自己能從女生那裡要到電話號碼。","items":[{"p":"I bet you can't","zh":"我賭你做不到","scene":"朋友不相信 Cam 做得到。","en":"I bet you can't eat ten dumplings in a minute.","tr":"我賭你一分鐘吃不了十顆水餃。","tip":"<b>用法：</b>激將法，常用來挑戰朋友。","th":7,"lv":1},{"p":"get someone's number","zh":"要到某人的電話","scene":"Cam 的任務就是拿到電話。","en":"Did you get her number?","tr":"你有要到她的電話嗎？","tip":"<b>延伸：</b>現在也常說 get someone's IG。","th":1,"lv":1},{"p":"smooth talker","zh":"很會說話的人","scene":"Cam 一開口就很能聊。","en":"He's a smooth talker. Everyone likes him.","tr":"他很會說話，大家都喜歡他。","tip":"<b>語氣：</b>有時暗示「油嘴滑舌」。","th":9,"lv":1}]},{"id":"dunphy","name":"Phil 和 Luke","who":"Phil · Luke","plot":"Phil 想幫 Luke 蓋一座超完美的樹屋。","items":[{"p":"dream come true","zh":"美夢成真","scene":"樹屋是 Phil 小時候的夢想。","en":"Visiting Japan was a dream come true.","tr":"去日本玩真是美夢成真。","tip":"<b>用法：</b>It's a dream come true. 很常用。","th":9,"lv":1},{"p":"safety first","zh":"安全第一","scene":"蓋樹屋最重要的是安全。","en":"Wear a helmet. Safety first!","tr":"戴安全帽，安全第一！","tip":"<b>用法：</b>提醒別人注意安全。","th":8,"lv":1},{"p":"measure twice, cut once","zh":"三思而後行","scene":"蓋東西要先量清楚再動手。","en":"Before you quit, think about it. Measure twice, cut once.","tr":"辭職前先想清楚，三思而後行。","tip":"<b>字面：</b>木工的格言，量兩次再切一次。","th":10,"lv":2}]}],"prompts":["你會跳舞嗎（用 two left feet、bust a move、follow someone's lead）","你被人激將過嗎（用 I bet you can't、smooth talker、get someone's number）","你小時候的夢想（用 dream come true、safety first、commit to）"],"challenges":[{"id":"c1","sit":"朋友拉你上台跳舞，你說你四肢不協調。","uses":["two left feet"],"ans":"No way. I have two left feet."},{"id":"c2","sit":"健身房的朋友說你一分鐘做不了五十個伏地挺身，你接受挑戰。","uses":["I bet you can't"],"ans":"He said, \"I bet you can't.\" So I did it."},{"id":"c3","sit":"業務部的同事很會說話，客戶都喜歡他。","uses":["smooth talker"],"ans":"He's such a smooth talker."},{"id":"c4","sit":"爬高前班長提醒大家安全第一。","uses":["safety first"],"ans":"Helmets on. Safety first!"}]},"s03e08":{"title":"After the Fire","lede":"鄰居家發生火災，全家人出手幫忙，Jay 卻在搬東西時閃到腰；Cam 負責開搬家卡車；大家捐出的玩具最後卻落到不該拿的人手上。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 逞強搬東西，結果閃到腰。","items":[{"p":"throw out one's back","zh":"閃到腰","scene":"Jay 搬東西時閃到腰。","en":"I threw out my back lifting a box.","tr":"我搬箱子閃到腰了。","tip":"<b>用法：</b>throw out 不是丟掉，而是「扭傷」。","th":8,"lv":2},{"p":"lift with your legs","zh":"用腿出力抬東西","scene":"搬重物要用腿的力量。","en":"Don't bend your back. Lift with your legs.","tr":"別彎腰，用腿的力量抬。","tip":"<b>用法：</b>搬東西時的安全提醒。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · 鄰居","plot":"看到鄰居失去家園，大家開始反思自己有多幸運。","items":[{"p":"give back","zh":"回饋社會","scene":"全家人想為鄰居做點事。","en":"I volunteer on weekends to give back to the community.","tr":"我週末當志工回饋社區。","tip":"<b>用法：</b>give back to + 社會或團體。","th":8,"lv":1},{"p":"drop off","zh":"送去、放下","scene":"大家把捐贈的物品送過去。","en":"I'll drop off the clothes at the donation center.","tr":"我會把衣服送到捐贈中心。","tip":"<b>延伸：</b>drop someone off 載某人到某處。","th":8,"lv":1},{"p":"count your blessings","zh":"惜福、想想自己有多幸運","scene":"看到別人的遭遇，更該珍惜擁有的。","en":"When you feel down, count your blessings.","tr":"心情低落的時候，想想自己擁有的。","tip":"<b>用法：</b>提醒人知足。","th":6,"lv":2},{"p":"silver lining","zh":"一線希望、不幸中的大幸","scene":"火災之後，總能找到一點好事。","en":"The flight was canceled, but the silver lining is we got a free hotel.","tr":"航班取消了，但不幸中的大幸是飯店免費。","tip":"<b>全句：</b>Every cloud has a silver lining.","th":6,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 自告奮勇開大卡車；捐出去的玩具卻被不對的人拿走。","items":[{"p":"parallel park","zh":"路邊停車","scene":"Cam 開大卡車要停進窄小的位子。","en":"I failed my driving test because I couldn't parallel park.","tr":"我駕照沒考過，因為不會路邊停車。","tip":"<b>用法：</b>考駕照的大魔王。","th":8,"lv":1},{"p":"back up","zh":"倒車","scene":"Cam 小心翼翼地倒車。","en":"Can you back up a little?","tr":"你可以往後倒一點嗎？","tip":"<b>延伸：</b>back me up 是「支持我」。","th":8,"lv":1},{"p":"in the wrong hands","zh":"落入不該拿的人手中","scene":"捐出的玩具被不該拿的人拿走。","en":"This information could be dangerous in the wrong hands.","tr":"這個資訊落入壞人手中會很危險。","tip":"<b>反義：</b>in good hands 交給可靠的人。","th":9,"lv":2},{"p":"one's heart is in the right place","zh":"出發點是好的","scene":"雖然結果出包，但大家都是好意。","en":"He made a mess, but his heart was in the right place.","tr":"他搞得一團亂，但出發點是好的。","tip":"<b>用法：</b>替好心辦壞事的人說話。","th":9,"lv":2}]}],"prompts":["你閃到腰或受傷的經驗（用 throw out one's back、lift with your legs、silver lining）","你做過志工或回饋社會的事嗎（用 give back、drop off、count your blessings）","你好心卻辦壞事的經驗（用 one's heart is in the right place、in the wrong hands、back up）"],"challenges":[{"id":"c1","sit":"你幫家裡搬米閃到腰，跟媽媽說。","uses":["throw out one's back"],"ans":"I think I threw out my back."},{"id":"c2","sit":"你跟女朋友說你會把東西送去她家。","uses":["drop off"],"ans":"I'll drop it off at your place."},{"id":"c3","sit":"連假遇到颱風不能出去，但不幸中的大幸是可以在家補眠。","uses":["silver lining"],"ans":"The silver lining is I can catch up on sleep."},{"id":"c4","sit":"朋友幫你準備驚喜卻搞砸了，你說他是好意。","uses":["one's heart is in the right place"],"ans":"His heart was in the right place."}]},"s03e09":{"title":"Punkin Chunkin","lede":"一位以前的老鄰居發達了，風光回來拜訪；Jay 對 Manny 提出批評，讓 Manny 很受傷；Mitchell 則懷疑 Cam 那些多采多姿的童年故事到底是不是真的，尤其是丟南瓜比賽那一段。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · 老鄰居","plot":"以前的鄰居現在成功又有錢，大家難免暗暗比較。","items":[{"p":"make it big","zh":"發達、出名","scene":"老鄰居現在混得很好。","en":"He moved to Taipei to make it big.","tr":"他搬到台北想闖出一片天。","tip":"<b>用法：</b>在事業上大成功。","th":3,"lv":2},{"p":"rags to riches","zh":"白手起家、從窮到富","scene":"老鄰居的故事很勵志。","en":"His rags-to-riches story inspired a lot of people.","tr":"他白手起家的故事激勵了很多人。","tip":"<b>用法：</b>當形容詞時加連字號。","th":3,"lv":2},{"p":"keep up with the Joneses","zh":"跟別人比排場","scene":"看到別人過得好，難免想比較。","en":"My neighbors bought a new car just to keep up with the Joneses.","tr":"我鄰居買新車只是為了跟別人比。","tip":"<b>由來：</b>Jones 是美國很常見的姓，代表「鄰居們」。","th":9,"lv":2},{"p":"humblebrag","zh":"假謙虛真炫耀","scene":"老鄰居講話總是在暗暗炫耀。","en":"\"I'm so tired from my trip to Paris.\" That's a humblebrag.","tr":"「去巴黎好累喔。」這根本是假謙虛真炫耀。","tip":"<b>用法：</b>網路時代很常用的新字。","th":9,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Jay 對 Manny 的作品說了實話，Manny 覺得很受傷。","items":[{"p":"constructive criticism","zh":"建設性的批評","scene":"Jay 覺得自己只是在給建議。","en":"I'm open to constructive criticism.","tr":"我很願意接受建設性的批評。","tip":"<b>用法：</b>工作上給回饋時常說。","th":3,"lv":1},{"p":"thick skin","zh":"臉皮厚、不怕批評","scene":"Jay 希望 Manny 能堅強一點。","en":"You need thick skin to work in sales.","tr":"做業務要臉皮夠厚。","tip":"<b>反義：</b>thin-skinned 很敏感、玻璃心。","th":9,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Cam 一直說自己小時候在丟南瓜大賽很厲害，Mitchell 半信半疑。","items":[{"p":"tall tale","zh":"誇大的故事","scene":"Mitchell 覺得 Cam 的故事太誇張。","en":"My grandpa loves telling tall tales about the war.","tr":"我爺爺很愛講誇大的戰爭故事。","tip":"<b>用法：</b>明顯加油添醋的故事。","th":9,"lv":2},{"p":"stretch the truth","zh":"誇大事實","scene":"Cam 好像有點加油添醋。","en":"He likes to stretch the truth on his résumé.","tr":"他的履歷有點誇大其詞。","tip":"<b>語氣：</b>比 lie 溫和。","th":10,"lv":2},{"p":"I'll believe it when I see it","zh":"眼見為憑","scene":"Mitchell 要親眼看到才相信。","en":"You'll quit smoking? I'll believe it when I see it.","tr":"你要戒菸？我要親眼看到才信。","tip":"<b>語氣：</b>帶點不相信的調侃。","th":7,"lv":1},{"p":"prove someone wrong","zh":"證明某人錯了","scene":"Cam 決定證明給 Mitchell 看。","en":"They said I'd fail, but I proved them wrong.","tr":"他們說我會失敗，但我證明他們錯了。","tip":"<b>用法：</b>被看扁時的反擊。","th":10,"lv":1}]}],"prompts":["你身邊有發達的朋友嗎（用 make it big、rags to riches、keep up with the Joneses）","你被批評時會怎麼面對（用 constructive criticism、thick skin、prove someone wrong）","你聽過最誇張的故事（用 tall tale、stretch the truth、I'll believe it when I see it）"],"challenges":[{"id":"c1","sit":"室友說他明天開始要每天早起健身，你說要親眼看到才信。","uses":["I'll believe it when I see it"],"ans":"I'll believe it when I see it."},{"id":"c2","sit":"教練說你今年跳發一定練不起來，你最後證明他錯了。","uses":["prove someone wrong"],"ans":"I proved him wrong."},{"id":"c3","sit":"朋友在 IG 發文說「出差好累喔，只能住海景飯店」，你說這是假謙虛。","uses":["humblebrag"],"ans":"That's such a humblebrag."},{"id":"c4","sit":"你跟剛開始跑業務的朋友說要臉皮厚一點。","uses":["thick skin"],"ans":"You need thick skin in sales."}]},"s03e10":{"title":"Express Christmas","lede":"十二月陽光普照的一天，全家發現今年聖誕節大家都會分散各地，於是決定當天臨時提前過節：Mitchell、Alex 和 Lily 去找聖誕樹，Jay 和 Cam 包禮物，Phil 和 Manny 去採購，Gloria 和 Luke 去閣樓拿天使，Claire 和 Haley 去買最後的禮物。","stories":[{"id":"dunphy","name":"全家分工","who":"Claire · Phil · 全家","plot":"Claire 指揮全家分頭行動，要在一天之內把聖誕節辦好。","items":[{"p":"on short notice","zh":"臨時、事前沒什麼準備時間","scene":"決定得很突然，大家都很趕。","en":"Thanks for coming on such short notice.","tr":"謝謝你這麼臨時還趕來。","tip":"<b>用法：</b>on such short notice 很常用來道謝。","th":10,"lv":1},{"p":"spur of the moment","zh":"一時興起","scene":"提前過節是臨時起意。","en":"We went to the beach on the spur of the moment.","tr":"我們一時興起就去了海邊。","tip":"<b>用法：</b>當形容詞是 spur-of-the-moment decision。","th":10,"lv":2},{"p":"divide and conquer","zh":"分頭進行","scene":"全家分成好幾組。","en":"There's a lot to do. Let's divide and conquer.","tr":"事情很多，我們分頭進行吧。","tip":"<b>原意：</b>分而治之的戰略。","th":10,"lv":2},{"p":"all hands on deck","zh":"全員出動","scene":"每個人都要幫忙。","en":"We have a big order today. All hands on deck!","tr":"今天有大訂單，全員出動！","tip":"<b>來源：</b>船上需要所有水手到甲板上。","th":10,"lv":2},{"p":"race against the clock","zh":"跟時間賽跑","scene":"大家要在一天內搞定一切。","en":"Finishing the report was a race against the clock.","tr":"趕報告簡直是在跟時間賽跑。","tip":"<b>用法：</b>時間緊迫時用。","th":10,"lv":2},{"p":"in the nick of time","zh":"在最後關頭、及時","scene":"每樣東西都在最後一刻到位。","en":"We caught the train in the nick of time.","tr":"我們在最後一刻趕上火車。","tip":"<b>同義：</b>just in time。","th":10,"lv":2}]},{"id":"jay","name":"Jay 和 Cam","who":"Jay · Cameron","plot":"兩人負責包禮物，風格完全不一樣。","items":[{"p":"wrap presents","zh":"包禮物","scene":"兩人負責包一大堆禮物。","en":"I'm terrible at wrapping presents.","tr":"我超不會包禮物。","tip":"<b>延伸：</b>gift wrap 禮物包裝。","th":8,"lv":1},{"p":"make it work","zh":"想辦法搞定","scene":"東西不夠，只能將就著弄。","en":"We don't have enough chairs, but we'll make it work.","tr":"椅子不夠，但我們會想辦法。","tip":"<b>延伸：</b>時尚節目《決戰時裝伸展台》的名言。","th":10,"lv":1}]},{"id":"mitch","name":"找聖誕樹","who":"Mitchell · Alex · Lily","plot":"三人出去找聖誕樹，要在大家散開前把氣氛做足。","items":[{"p":"holiday spirit","zh":"節日氣氛","scene":"大家努力營造過節的感覺。","en":"Even the dog is wearing a hat. Now that's holiday spirit!","tr":"連狗都戴帽子了，這就是過節的氣氛！","tip":"<b>用法：</b>get into the holiday spirit 進入過節的心情。","th":8,"lv":1},{"p":"home for the holidays","zh":"回家過節","scene":"大家都希望能一起過節。","en":"I'll be home for the holidays this year.","tr":"今年我會回家過節。","tip":"<b>延伸：</b>也是一首經典的聖誕歌名。","th":8,"lv":1}]}],"prompts":["你做過最臨時起意的事（用 spur of the moment、on short notice、in the nick of time）","你們家過節怎麼分工（用 divide and conquer、all hands on deck、wrap presents）","你今年過年能回家嗎（用 home for the holidays、holiday spirit、make it work）"],"challenges":[{"id":"c1","sit":"長官臨時叫大家集合打掃，你說全員出動。","uses":["all hands on deck"],"ans":"All hands on deck!"},{"id":"c2","sit":"朋友臨時趕來幫你搬家，你謝謝他。","uses":["on short notice"],"ans":"Thanks for helping on such short notice."},{"id":"c3","sit":"你在火車門關之前最後一刻衝上車。","uses":["in the nick of time"],"ans":"I made it in the nick of time."},{"id":"c4","sit":"要準備的東西很多，你建議大家分頭進行。","uses":["divide and conquer"],"ans":"Let's divide and conquer."}]},"s03e11":{"title":"Lifetime Supply","lede":"Phil 錯過醫生的電話，開始往最壞的方向想；Javier 帶 Manny 去看賽馬；Mitchell 得了環保獎，跟 Cam 展開獎盃大戰；Gloria 幫 Haley 補西班牙文。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Gloria","plot":"Phil 一直接不到醫生的電話，越想越害怕；Gloria 幫 Haley 練西班牙文。","items":[{"p":"fear the worst","zh":"往最壞的方向想","scene":"Phil 以為自己得了重病。","en":"When she didn't call back, I feared the worst.","tr":"她沒回電時，我往最壞的地方想。","tip":"<b>用法：</b>擔心時常說。","th":4,"lv":1},{"p":"play phone tag","zh":"一直錯過對方的電話","scene":"Phil 和醫生一直互相漏接。","en":"We've been playing phone tag all week.","tr":"我們整個禮拜一直錯過對方的電話。","tip":"<b>畫面：</b>像玩鬼抓人，一直抓不到。","th":8,"lv":2},{"p":"no news is good news","zh":"沒消息就是好消息","scene":"Claire 安慰 Phil 不用太擔心。","en":"They haven't called yet, but no news is good news.","tr":"他們還沒打來，但沒消息就是好消息。","tip":"<b>用法：</b>安慰等待結果的人。","th":6,"lv":2},{"p":"bucket list","zh":"人生必做清單","scene":"Phil 開始想自己還有哪些事沒做。","en":"Skydiving is on my bucket list.","tr":"高空跳傘在我的人生清單上。","tip":"<b>由來：</b>kick the bucket 是死掉的意思。","th":8,"lv":1},{"p":"practice makes perfect","zh":"熟能生巧","scene":"Gloria 要 Haley 多練習。","en":"You'll get better at Spanish. Practice makes perfect.","tr":"你西班牙文會進步的，熟能生巧。","tip":"<b>用法：</b>鼓勵人持續練習。","th":6,"lv":1}]},{"id":"jay","name":"Javier 和 Manny","who":"Javier · Manny","plot":"Javier 帶 Manny 去賽馬場，教他怎麼下注。","items":[{"p":"bet on","zh":"下注、押寶","scene":"Javier 和 Manny 在賽馬場下注。","en":"I wouldn't bet on him winning.","tr":"我不會押他贏。","tip":"<b>延伸：</b>You bet! 當然！","th":10,"lv":1},{"p":"a sure thing","zh":"穩贏的事","scene":"Javier 說這匹馬穩贏。","en":"Don't worry. It's a sure thing.","tr":"別擔心，穩贏的。","tip":"<b>用法：</b>賭博、考試、比賽都能用。","th":9,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 得了環保獎，Cam 也想拿出自己的獎盃一較高下。","items":[{"p":"one-up","zh":"壓過、勝人一籌","scene":"兩人互相比誰的獎盃厲害。","en":"Whatever I do, my brother always tries to one-up me.","tr":"不管我做什麼，我哥都想贏過我。","tip":"<b>名詞：</b>one-upmanship 處處想勝過別人。","th":5,"lv":2},{"p":"stay humble","zh":"保持謙虛","scene":"得獎了也要保持謙虛。","en":"You're talented, but stay humble.","tr":"你很有才華，但要保持謙虛。","tip":"<b>延伸：</b>humble beginnings 卑微的出身。","th":6,"lv":1},{"p":"a lifetime supply","zh":"一輩子用不完的量","scene":"這集標題，就是大獎的意思。","en":"She won a lifetime supply of chocolate.","tr":"她贏得了一輩子吃不完的巧克力。","tip":"<b>語氣：</b>常用在抽獎、廣告。","th":8,"lv":2}]}],"prompts":["你的人生必做清單（用 bucket list、a lifetime supply、a sure thing）","你等待結果時會很緊張嗎（用 fear the worst、no news is good news、play phone tag）","你身邊有很愛比較的人嗎（用 one-up、stay humble、practice makes perfect）"],"challenges":[{"id":"c1","sit":"你跟朋友說去冰島看極光在你的人生清單上。","uses":["bucket list"],"ans":"Seeing the northern lights is on my bucket list."},{"id":"c2","sit":"你跟女朋友一直錯過對方的電話。","uses":["play phone tag"],"ans":"We've been playing phone tag all day."},{"id":"c3","sit":"你媽擔心你的體檢報告，你說沒消息就是好消息。","uses":["no news is good news"],"ans":"Mom, no news is good news."},{"id":"c4","sit":"你學吉他一直卡關，朋友說熟能生巧。","uses":["practice makes perfect"],"ans":"Keep going. Practice makes perfect."}]},"s03e12":{"title":"Egg Drop","lede":"Jay 和 Claire 接手了 Manny 和 Luke 的學校作業「雞蛋墜落實驗」，完全變成大人的比賽；Haley 和 Gloria 幫 Phil 準備房仲簡報；Mitchell 和 Cam 第一次和可能的生母見面。","stories":[{"id":"jay","name":"Jay 和 Claire 的作業之爭","who":"Jay · Claire · Manny · Luke","plot":"兩個大人比小孩還投入，搶著幫孩子做作業。","items":[{"p":"helicopter parent","zh":"直升機父母","scene":"Jay 和 Claire 管孩子管太多。","en":"My mom is a helicopter parent. She checks my homework every day.","tr":"我媽是直升機父母，每天都檢查我的作業。","tip":"<b>畫面：</b>像直升機一樣盤旋在孩子頭上。","th":2,"lv":2},{"p":"hands off","zh":"放手、不干涉","scene":"孩子的作業應該讓他們自己做。","en":"My boss is very hands-off. He lets us decide.","tr":"我老闆很放手，讓我們自己決定。","tip":"<b>反義：</b>hands-on 親力親為。","th":9,"lv":2},{"p":"trial and error","zh":"反覆試驗","scene":"做實驗就是不斷嘗試。","en":"I learned to cook through trial and error.","tr":"我是靠一直試錯學會煮菜的。","tip":"<b>用法：</b>從失敗中學習的過程。","th":10,"lv":1},{"p":"don't put all your eggs in one basket","zh":"別把雞蛋放在同一個籃子","scene":"雞蛋實驗剛好呼應這句俗語。","en":"Apply to more than one school. Don't put all your eggs in one basket.","tr":"多申請幾間學校，別把雞蛋放同一個籃子。","tip":"<b>用法：</b>分散風險的建議。","th":6,"lv":2},{"p":"crack under pressure","zh":"在壓力下崩潰","scene":"雞蛋和大人都快承受不住了。","en":"He's a great player, but he cracks under pressure.","tr":"他是很好的球員，但壓力一大就崩潰。","tip":"<b>畫面：</b>蛋殼受到壓力就裂開。","th":4,"lv":2},{"p":"overthink","zh":"想太多","scene":"大人們把簡單的作業想得太複雜。","en":"Don't overthink it. Just pick one.","tr":"別想太多，選一個就好。","tip":"<b>延伸：</b>I'm overthinking. 我想太多了。","th":4,"lv":1}]},{"id":"dunphy","name":"Phil 的簡報","who":"Phil · Haley · Gloria","plot":"Haley 和 Gloria 幫 Phil 準備重要的房仲簡報。","items":[{"p":"dress rehearsal","zh":"彩排、正式預演","scene":"簡報前先完整演練一次。","en":"Let's do a dress rehearsal before the presentation.","tr":"簡報前我們先完整預演一次。","tip":"<b>來源：</b>戲劇正式演出前穿著戲服的彩排。","th":3,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人第一次見到可能的生母，緊張到一直說錯話。","items":[{"p":"make or break","zh":"成敗關鍵","scene":"這次見面可能決定一切。","en":"This interview is make or break for my career.","tr":"這次面試是我事業的成敗關鍵。","tip":"<b>用法：</b>當形容詞是 a make-or-break moment。","th":10,"lv":2},{"p":"cross one's fingers","zh":"祈求好運","scene":"兩人只能祈禱一切順利。","en":"I'm crossing my fingers that it doesn't rain.","tr":"我祈禱不要下雨。","tip":"<b>用法：</b>Fingers crossed! 祝好運！","th":6,"lv":1},{"p":"TMI","zh":"太多資訊了（不想知道）","scene":"太緊張的人常常講太多。","en":"Okay, TMI. I didn't need to know that.","tr":"好了，資訊太多了，我不需要知道這些。","tip":"<b>全稱：</b>too much information。","th":7,"lv":2}]}],"prompts":["你爸媽是直升機父母嗎（用 helicopter parent、hands off、overthink）","一個你人生中的成敗關鍵時刻（用 make or break、cross one's fingers、crack under pressure）","你靠反覆試驗學會的一件事（用 trial and error、dress rehearsal、don't put all your eggs in one basket）"],"challenges":[{"id":"c1","sit":"你跟朋友說明天的面試你祈禱一切順利。","uses":["cross one's fingers"],"ans":"I'm crossing my fingers."},{"id":"c2","sit":"朋友在想要選哪個晚餐想了十分鐘，你叫他別想太多。","uses":["overthink"],"ans":"Don't overthink it."},{"id":"c3","sit":"朋友在吃飯時一直講他昨天拉肚子的細節，你說資訊太多了。","uses":["TMI"],"ans":"Dude, TMI."},{"id":"c4","sit":"你建議剛畢業的表弟多投幾家公司，別把雞蛋放在同一個籃子。","uses":["don't put all your eggs in one basket"],"ans":"Don't put all your eggs in one basket."}]},"s03e13":{"title":"Little Bo Bleep","lede":"Claire 準備跟議員 Duane Bailey 辯論；Lily 要當花童了，Mitchell 和 Cam 卻得先改掉她亂學的髒話；Jay 則把 Stella 的怪行為怪到 Gloria 頭上。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 為了辯論拼命準備，就怕上台腦袋一片空白。","items":[{"p":"think on one's feet","zh":"反應快、臨場應變","scene":"辯論需要臨場反應。","en":"Lawyers need to think on their feet.","tr":"律師需要很會臨場應變。","tip":"<b>用法：</b>稱讚人反應很快。","th":10,"lv":2},{"p":"talking points","zh":"談話重點","scene":"Claire 把要講的重點背得滾瓜爛熟。","en":"Here are the talking points for the meeting.","tr":"這是開會要講的重點。","tip":"<b>用法：</b>政治、商業簡報常用。","th":3,"lv":2},{"p":"get cold feet","zh":"臨陣退縮、膽怯","scene":"上台前 Claire 有點想退縮。","en":"He got cold feet the night before the wedding.","tr":"他在婚禮前一晚退縮了。","tip":"<b>對比：</b>chicken out 比較口語、嘲笑；get cold feet 多指大事前的猶豫。","th":4,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 學會了一個髒字，婚禮前兩個爸爸急著讓她改口。","items":[{"p":"watch your language","zh":"注意你的用詞","scene":"大人們開始提醒彼此講話要小心。","en":"Hey, watch your language. There are kids here.","tr":"喂，講話注意點，這裡有小孩。","tip":"<b>用法：</b>有人說髒話時的提醒。","th":7,"lv":1},{"p":"potty mouth","zh":"滿嘴髒話","scene":"小小年紀的 Lily 竟然滿嘴髒話。","en":"My little brother has a potty mouth.","tr":"我弟滿嘴髒話。","tip":"<b>字面：</b>potty 是小孩的馬桶，帶點可愛的貶義。","th":9,"lv":2},{"p":"pick up","zh":"學到、染上（習慣）","scene":"Lily 不知道從哪裡學來的。","en":"Where did you pick up that word?","tr":"你從哪裡學來那個字的？","tip":"<b>用法：</b>pick up a habit、pick up a language。","th":8,"lv":1},{"p":"slip of the tongue","zh":"口誤","scene":"大人一個不小心就說溜了。","en":"Sorry, that was a slip of the tongue.","tr":"抱歉，那是口誤。","tip":"<b>用法：</b>不小心說錯話時的解釋。","th":7,"lv":2},{"p":"flower girl","zh":"花童","scene":"Lily 要在婚禮上當花童。","en":"My niece was the flower girl at my wedding.","tr":"我姪女在我的婚禮當花童。","tip":"<b>延伸：</b>ring bearer 拿戒指的小男孩。","th":8,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Stella","plot":"Stella 最近怪怪的，Jay 認為都是 Gloria 害的。","items":[{"p":"bad influence","zh":"壞榜樣、壞影響","scene":"Jay 覺得 Gloria 帶壞了狗狗。","en":"My parents think my friend is a bad influence.","tr":"我爸媽覺得我朋友會帶壞我。","tip":"<b>用法：</b>be a bad influence on + 人。","th":2,"lv":1},{"p":"blame it on","zh":"怪罪到某人身上","scene":"Jay 把問題推給 Gloria。","en":"Don't blame it on me. I wasn't even here.","tr":"別怪到我頭上，我根本不在。","tip":"<b>延伸：</b>Blame it on the rain. 都是下雨害的。","th":5,"lv":1}]}],"prompts":["你上台前會退縮嗎（用 get cold feet、think on one's feet、talking points）","你小時候從哪裡學到不該學的話（用 pick up、potty mouth、watch your language）","你曾經被別人怪罪嗎（用 blame it on、bad influence、slip of the tongue）"],"challenges":[{"id":"c1","sit":"表弟在阿嬤面前說髒話，你提醒他注意用詞。","uses":["watch your language"],"ans":"Watch your language."},{"id":"c2","sit":"你問朋友從哪學來那個台語髒話。","uses":["pick up"],"ans":"Where did you pick that up?"},{"id":"c3","sit":"你把班長的名字叫錯，趕快說是口誤。","uses":["slip of the tongue"],"ans":"Sorry, slip of the tongue."},{"id":"c4","sit":"寢室很髒，室友想怪到你頭上。","uses":["blame it on"],"ans":"Don't blame it on me."}]},"s03e14":{"title":"Me? Jealous?","lede":"Phil 有一位新客戶對他很熱情，Claire 覺得很不妥，Phil 卻不以為意；Mitchell 和 Cam 的家要除蟲，只好暫住在 Jay 和 Gloria 家，一個屋簷下狀況不斷。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · 新客戶","plot":"Claire 看到 Phil 的女客戶一直示好，忍不住吃醋。","items":[{"p":"green with envy","zh":"嫉妒得要命","scene":"Claire 嘴上說不在意，其實很吃醋。","en":"She was green with envy when she saw my new car.","tr":"她看到我的新車嫉妒得要命。","tip":"<b>畫面：</b>英文用綠色代表嫉妒。","th":4,"lv":2},{"p":"keep it professional","zh":"保持專業","scene":"Claire 希望 Phil 跟客戶保持距離。","en":"It's a work trip. Let's keep it professional.","tr":"這是出差，我們保持專業吧。","tip":"<b>用法：</b>提醒公私分明。","th":3,"lv":1},{"p":"too close for comfort","zh":"近到讓人不安","scene":"那位客戶跟 Phil 的距離太近了。","en":"The car stopped too close for comfort.","tr":"那台車停得近到讓人害怕。","tip":"<b>用法：</b>距離、時間、情況都可以用。","th":9,"lv":2},{"p":"harmless","zh":"無害的、沒惡意的","scene":"Phil 覺得對方只是在開玩笑。","en":"Don't worry, it's just harmless flirting.","tr":"別擔心，只是沒惡意的玩笑。","tip":"<b>用法：</b>替別人的行為辯護時用。","th":9,"lv":1},{"p":"it's all in your head","zh":"都是你想太多","scene":"Phil 覺得 Claire 想太多。","en":"Nobody's laughing at you. It's all in your head.","tr":"沒人在笑你，都是你想太多。","tip":"<b>用法：</b>安慰或反駁別人的疑心。","th":6,"lv":1}]},{"id":"mitch","name":"住進 Jay 家","who":"Mitchell · Cameron · Jay · Gloria","plot":"家裡要除蟲，兩人住進 Jay 家，大家擠在同一個屋簷下。","items":[{"p":"make yourself at home","zh":"當自己家","scene":"Gloria 熱情招待兩人。","en":"Come in and make yourself at home.","tr":"進來吧，當自己家。","tip":"<b>用法：</b>招待客人的標準句。","th":2,"lv":1},{"p":"crash at","zh":"借住某處","scene":"兩人暫時借住 Jay 家。","en":"Can I crash at your place tonight?","tr":"我今晚可以借住你家嗎？","tip":"<b>延伸：</b>crash on the couch 睡沙發。","th":2,"lv":2},{"p":"house rules","zh":"家規","scene":"住別人家就要守別人的規矩。","en":"House rules: no shoes inside.","tr":"家規：室內不准穿鞋。","tip":"<b>延伸：</b>My house, my rules. 我家我說了算。","th":2,"lv":1},{"p":"under one roof","zh":"同一個屋簷下","scene":"兩個家庭擠在一起住。","en":"Three generations live under one roof.","tr":"三代同堂住在同一個屋簷下。","tip":"<b>用法：</b>強調大家住在一起。","th":2,"lv":2},{"p":"overstay one's welcome","zh":"待太久惹人嫌","scene":"住太久，主人可能就不歡迎了。","en":"Let's leave before we overstay our welcome.","tr":"我們趁還沒待太久惹人嫌之前走吧。","tip":"<b>用法：</b>當客人時的自覺。","th":2,"lv":2}]}],"prompts":["你吃過醋嗎（用 green with envy、it's all in your head、harmless）","你去別人家借住的經驗（用 crash at、make yourself at home、overstay one's welcome）","你家有什麼家規（用 house rules、under one roof、keep it professional）"],"challenges":[{"id":"c1","sit":"你錯過了末班捷運，問住附近的朋友能不能借住。","uses":["crash at"],"ans":"Can I crash at your place tonight?"},{"id":"c2","sit":"朋友第一次來你家，你叫他當自己家。","uses":["make yourself at home"],"ans":"Make yourself at home."},{"id":"c3","sit":"朋友覺得新公司大家都在笑他，你說都是他想太多。","uses":["it's all in your head"],"ans":"Nobody's laughing. It's all in your head."},{"id":"c4","sit":"你看到朋友抽到演唱會門票，嫉妒得要命。","uses":["green with envy"],"ans":"I'm green with envy."}]},"s03e15":{"title":"Aunt Mommy","lede":"Claire 和 Phil 把房子賣給 Mitchell 和 Cam 的朋友，大家喝酒慶祝，結果幾杯下肚，每個人都說了太多不該說的話，還許下了衝動的承諾。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"成交了！兩人開香檳慶祝，喝著喝著就開始口無遮攔。","items":[{"p":"pop the champagne","zh":"開香檳慶祝","scene":"成交當然要開香檳。","en":"We closed the deal. Let's pop the champagne!","tr":"我們成交了，開香檳吧！","tip":"<b>用法：</b>慶祝重要時刻。","th":8,"lv":2},{"p":"make a toast","zh":"敬酒、致詞乾杯","scene":"大家舉杯祝賀。","en":"I'd like to make a toast to the happy couple.","tr":"我想向這對新人敬酒。","tip":"<b>延伸：</b>Cheers! 乾杯！","th":8,"lv":1},{"p":"tipsy","zh":"微醺","scene":"幾杯下肚，大家都有點醉了。","en":"I'm a little tipsy after two glasses of wine.","tr":"喝了兩杯紅酒，我有點微醺了。","tip":"<b>對比：</b>tipsy 是微醺；drunk 是喝醉。","th":8,"lv":1},{"p":"liquid courage","zh":"酒後壯膽","scene":"喝了酒，說話都變大膽了。","en":"He needed some liquid courage before asking her out.","tr":"他約她之前需要喝點酒壯膽。","tip":"<b>字面：</b>液體做的勇氣。","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家和 Claire","who":"Mitchell · Cameron · Claire","plot":"酒精讓大家敞開心房，Claire 一時衝動提出了一個很大方的提議，隔天才開始後悔。","items":[{"p":"overshare","zh":"說太多私事","scene":"大家都講了不該講的事。","en":"Sorry, I'm oversharing. I just met you.","tr":"抱歉，我說太多了，我們才剛認識。","tip":"<b>延伸：</b>TMI 太多資訊。","th":9,"lv":2},{"p":"in the heat of the moment","zh":"一時衝動","scene":"Claire 的提議是一時衝動。","en":"I said things I didn't mean in the heat of the moment.","tr":"我一時衝動說了些不是真心的話。","tip":"<b>用法：</b>替衝動的言行解釋。","th":5,"lv":2},{"p":"a generous offer","zh":"很大方的提議","scene":"Claire 提出了一個很大的幫忙。","en":"Thank you for the generous offer, but I can't accept it.","tr":"謝謝你大方的提議，但我不能接受。","tip":"<b>用法：</b>婉拒或感謝時用。","th":3,"lv":1},{"p":"sleep on it","zh":"考慮一晚再決定","scene":"大家都該冷靜一晚再說。","en":"Don't decide now. Sleep on it.","tr":"現在別決定，睡一覺再說。","tip":"<b>用法：</b>重要決定前的好建議。","th":10,"lv":2},{"p":"hangover","zh":"宿醉","scene":"隔天醒來頭痛欲裂。","en":"I have a terrible hangover this morning.","tr":"我今天早上宿醉得很嚴重。","tip":"<b>延伸：</b>電影《醉後大丈夫》英文就是 The Hangover。","th":8,"lv":1},{"p":"kick oneself","zh":"懊悔、氣自己","scene":"Claire 醒來後很後悔。","en":"I could kick myself for missing that sale.","tr":"錯過那次特價我真想踢自己。","tip":"<b>用法：</b>I'm kicking myself. 我好後悔。","th":4,"lv":2}]}],"prompts":["你喝醉或微醺時做過什麼事嗎（用 tipsy、liquid courage、hangover）","你一時衝動做的決定（用 in the heat of the moment、sleep on it、kick oneself）","你最近值得慶祝的一件事（用 pop the champagne、make a toast、a generous offer）"],"challenges":[{"id":"c1","sit":"朋友問你要不要簽約買車，你說先睡一覺再決定。","uses":["sleep on it"],"ans":"Let me sleep on it."},{"id":"c2","sit":"錯過了很便宜的機票，你說好想踢自己。","uses":["kick oneself"],"ans":"I'm kicking myself."},{"id":"c3","sit":"公司尾牙上你站起來說要敬大家。","uses":["make a toast"],"ans":"I'd like to make a toast."},{"id":"c4","sit":"你跟朋友道歉說你們才認識就說了太多私事。","uses":["overshare"],"ans":"Sorry, I'm oversharing."}]},"s03e16":{"title":"Virgin Territory","lede":"Mitchell 毀了 Jay 在高爾夫球場上難得的高光時刻；Phil 偷聽到一些關於 Haley 的事，突然意識到女兒長大了；Gloria 發現了 Claire 的一個秘密；Luke 和 Manny 則想陷害 Lily，讓她惹上麻煩。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Mitchell · Gloria · Claire","plot":"Jay 難得打出好球，Mitchell 卻不小心搞砸；Gloria 意外發現 Claire 的秘密。","items":[{"p":"hole in one","zh":"一桿進洞","scene":"Jay 夢寐以求的時刻。","en":"My dad got a hole in one last year. He still talks about it.","tr":"我爸去年一桿進洞，到現在還在講。","tip":"<b>用法：</b>也可比喻一次就成功。","th":8,"lv":2},{"p":"once in a blue moon","zh":"千載難逢、很少","scene":"這種好球很少見。","en":"I only eat fast food once in a blue moon.","tr":"我很少吃速食。","tip":"<b>畫面：</b>藍月很罕見。","th":9,"lv":2},{"p":"skeleton in the closet","zh":"不可告人的秘密","scene":"Claire 也有不想被知道的過去。","en":"Everyone has a skeleton in the closet.","tr":"每個人都有不可告人的秘密。","tip":"<b>畫面：</b>衣櫃裡藏著骷髏。","th":10,"lv":2},{"p":"my lips are sealed","zh":"我會守口如瓶","scene":"Gloria 答應幫 Claire 保密。","en":"Don't worry, my lips are sealed.","tr":"別擔心，我會守口如瓶。","tip":"<b>用法：</b>答應保密時說。","th":7,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Haley · Claire","plot":"Phil 偷聽到一些事，才發現女兒已經不是小女孩了。","items":[{"p":"the birds and the bees","zh":"性教育、男女之事","scene":"Phil 想著是不是該跟女兒聊聊。","en":"My parents never talked to me about the birds and the bees.","tr":"我爸媽從來沒跟我聊過性教育。","tip":"<b>用法：</b>委婉說法，常說 have the talk。","th":2,"lv":2},{"p":"daddy's little girl","zh":"爸爸的小公主","scene":"在 Phil 眼中，Haley 永遠是小女孩。","en":"No matter how old she is, she'll always be daddy's little girl.","tr":"不管幾歲，她永遠是爸爸的小公主。","tip":"<b>用法：</b>形容很受爸爸寵愛的女兒。","th":2,"lv":2},{"p":"in denial","zh":"不願面對現實","scene":"Phil 不想承認女兒長大了。","en":"He's still in denial about the breakup.","tr":"他還不願面對分手的事實。","tip":"<b>用法：</b>be in denial about + 事情。","th":4,"lv":1}]},{"id":"kids","name":"孩子們","who":"Luke · Manny · Lily","plot":"兩個男生想讓 Lily 被大人罵，結果自己也沒好下場。","items":[{"p":"frame someone","zh":"陷害某人","scene":"Luke 和 Manny 想讓 Lily 背黑鍋。","en":"Someone framed me! I didn't take the money.","tr":"有人陷害我！我沒拿那筆錢。","tip":"<b>用法：</b>犯罪片常見，日常玩笑也會用。","th":5,"lv":2},{"p":"tattletale","zh":"愛告狀的人","scene":"小孩之間最討厭打小報告的人。","en":"Don't be a tattletale. Just tell me first.","tr":"別愛告狀，先跟我說就好。","tip":"<b>延伸：</b>tattle on someone 告某人的狀。","th":9,"lv":2},{"p":"throw someone under the bus","zh":"出賣某人、推人出去當替死鬼","scene":"出了事，兩人互相推給對方。","en":"My coworker threw me under the bus in the meeting.","tr":"我同事在會議上把我推出去當替死鬼。","tip":"<b>用法：</b>職場超常用。","th":5,"lv":2}]}],"prompts":["你很少做、但每次做都很開心的事（用 once in a blue moon、hole in one、daddy's little girl）","你幫別人保守過秘密嗎（用 my lips are sealed、skeleton in the closet、in denial）","你小時候被陷害或出賣過嗎（用 frame someone、tattletale、throw someone under the bus）"],"challenges":[{"id":"c1","sit":"朋友跟你說一個秘密，你說你會守口如瓶。","uses":["my lips are sealed"],"ans":"My lips are sealed."},{"id":"c2","sit":"同事在主管面前把錯推給你，你事後跟朋友抱怨。","uses":["throw someone under the bus"],"ans":"He threw me under the bus."},{"id":"c3","sit":"你跟朋友說你很少喝手搖飲。","uses":["once in a blue moon"],"ans":"I only drink bubble tea once in a blue moon."},{"id":"c4","sit":"朋友失戀還說自己沒事，你說他在逃避現實。","uses":["in denial"],"ans":"He's in denial."}]},"s03e17":{"title":"Leap Day","lede":"Cam 是二月二十九日出生，四年才過一次真正的生日，Mitchell 想給他一個特別的驚喜；Jay 的男子氣概被人質疑；Phil 精心安排的閏日計畫，卻碰上家裡三個女生同時心情不好。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"四年一次的生日，Mitchell 卯起來要讓 Cam 開心。","items":[{"p":"once every four years","zh":"每四年一次","scene":"Cam 的生日四年才有一次。","en":"The World Cup only happens once every four years.","tr":"世界盃每四年才一次。","tip":"<b>用法：</b>強調很難得。","th":9,"lv":1},{"p":"pull out all the stops","zh":"使出渾身解數","scene":"Mitchell 想盡辦法讓生日完美。","en":"They pulled out all the stops for their wedding.","tr":"他們的婚禮使出了渾身解數。","tip":"<b>來源：</b>管風琴拉出所有音栓，聲音最大。","th":10,"lv":2},{"p":"leap of faith","zh":"憑信念放手一搏","scene":"有些事只能相信直覺去做。","en":"Quitting my job to travel was a leap of faith.","tr":"辭職去旅行是放手一搏的決定。","tip":"<b>用法：</b>在不確定的情況下做決定。","th":10,"lv":2},{"p":"seize the day","zh":"把握今天","scene":"難得的一天，要好好把握。","en":"Life is short. Seize the day!","tr":"人生苦短，把握今天！","tip":"<b>拉丁文：</b>carpe diem。","th":6,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"有人質疑 Jay 不夠 man，他決定證明自己。","items":[{"p":"man up","zh":"拿出男子氣概","scene":"Jay 覺得自己被說得不夠勇敢。","en":"Stop complaining and man up.","tr":"別抱怨了，拿出點男子氣概。","tip":"<b>語氣：</b>有點老派、帶刻板印象的說法。","th":6,"lv":2},{"p":"real man","zh":"真正的男人","scene":"什麼才算真正的男人？","en":"A real man isn't afraid to cry.","tr":"真正的男人不怕哭。","tip":"<b>用法：</b>常用來翻轉刻板印象。","th":9,"lv":1},{"p":"tough it out","zh":"咬牙撐過去","scene":"Jay 決定硬撐到底。","en":"It's cold, but we'll tough it out.","tr":"很冷，但我們會撐過去。","tip":"<b>對比：</b>suck it up 是忍著；tough it out 強調撐到最後。","th":6,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex","plot":"Phil 想好好過閏日，家裡三個女生卻剛好同時生理期，脾氣都不太好。","items":[{"p":"moody","zh":"喜怒無常","scene":"三個女生心情都起起伏伏。","en":"Teenagers can be really moody.","tr":"青少年有時候很喜怒無常。","tip":"<b>用法：</b>形容情緒不穩定。","th":9,"lv":1},{"p":"mood swings","zh":"情緒起伏","scene":"Phil 搞不清楚大家的情緒。","en":"Lack of sleep gives me mood swings.","tr":"睡眠不足會讓我情緒起伏很大。","tip":"<b>用法：</b>名詞，常用複數。","th":4,"lv":1},{"p":"that time of the month","zh":"生理期","scene":"Phil 終於搞懂大家為什麼心情不好。","en":"Leave her alone. It's that time of the month.","tr":"讓她靜一靜，她生理期來了。","tip":"<b>用法：</b>委婉說法，注意場合。","th":8,"lv":2}]}],"prompts":["你做過最大的放手一搏（用 leap of faith、seize the day、pull out all the stops）","你覺得什麼是真正的男子氣概（用 real man、man up、tough it out）","你情緒最不穩的時候（用 moody、mood swings、once every four years）"],"challenges":[{"id":"c1","sit":"行軍很累，你跟同梯說咬牙撐過去。","uses":["tough it out"],"ans":"We'll tough it out."},{"id":"c2","sit":"朋友想辭職去澳洲打工，你說這是放手一搏。","uses":["leap of faith"],"ans":"It's a leap of faith, but go for it."},{"id":"c3","sit":"你跟朋友說睡不飽會讓你情緒起伏很大。","uses":["mood swings"],"ans":"No sleep gives me mood swings."},{"id":"c4","sit":"女朋友生日，你說要使出渾身解數。","uses":["pull out all the stops"],"ans":"I'm pulling out all the stops."}]},"s03e18":{"title":"Send Out the Clowns","lede":"Cam 以前的小丑搭檔來到鎮上，讓他想重溫小丑生涯；Phil 的物件被另一位房仲搶走；Gloria 和 Jay 對 Manny 新交的朋友起了疑心。","stories":[{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell · 小丑搭檔","plot":"老搭檔一出現，Cam 又想重回小丑舞台。","items":[{"p":"get the band back together","zh":"重組老團隊","scene":"Cam 想跟老搭檔再次合作。","en":"Let's get the band back together for one last show.","tr":"我們重組老團隊再表演最後一次吧。","tip":"<b>用法：</b>不只樂團，老朋友重聚做事都可以。","th":10,"lv":2},{"p":"clown around","zh":"胡鬧、耍寶","scene":"Cam 一扮上小丑就開始耍寶。","en":"Stop clowning around and help me.","tr":"別耍寶了，來幫我。","tip":"<b>用法：</b>形容人不正經、愛鬧。","th":9,"lv":2},{"p":"old habits die hard","zh":"積習難改","scene":"小丑魂一上身就停不下來。","en":"I still wake up at six. Old habits die hard.","tr":"我還是六點起床，積習難改。","tip":"<b>用法：</b>自嘲改不掉的習慣。","th":9,"lv":2}]},{"id":"dunphy","name":"Phil 的工作","who":"Phil · 另一位房仲","plot":"Phil 眼睜睜看著自己的物件被同行搶走。","items":[{"p":"lose out on","zh":"錯失、沒搶到","scene":"Phil 錯失了一筆生意。","en":"I lost out on the job because I applied too late.","tr":"我太晚申請，錯失了那份工作。","tip":"<b>用法：</b>lose out on + 機會。","th":10,"lv":1},{"p":"dog-eat-dog","zh":"競爭激烈、人吃人","scene":"房仲業競爭超激烈。","en":"It's a dog-eat-dog world out there.","tr":"外面的世界競爭很殘酷。","tip":"<b>用法：</b>形容殘酷的競爭環境。","th":9,"lv":2},{"p":"poach","zh":"挖角、搶客戶","scene":"對手把 Phil 的客戶搶走了。","en":"The other company poached our best engineer.","tr":"另一家公司把我們最好的工程師挖走了。","tip":"<b>字面：</b>原意是盜獵。","th":3,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Manny 交了一個新朋友，Jay 和 Gloria 總覺得那孩子怪怪的。","items":[{"p":"the wrong crowd","zh":"損友、壞朋友圈","scene":"兩人擔心 Manny 交到壞朋友。","en":"He started hanging out with the wrong crowd in high school.","tr":"他高中開始跟一群損友混在一起。","tip":"<b>用法：</b>fall in with the wrong crowd 交到壞朋友。","th":2,"lv":2},{"p":"sketchy","zh":"可疑的、怪怪的","scene":"那個新朋友讓人覺得不太對勁。","en":"That website looks sketchy. Don't put your card number in.","tr":"那個網站看起來很可疑，別輸入卡號。","tip":"<b>用法：</b>人、地方、網站都可以用。","th":9,"lv":2},{"p":"don't judge a book by its cover","zh":"不要以貌取人","scene":"也許那孩子沒有看起來那麼壞。","en":"He looks scary, but don't judge a book by its cover.","tr":"他看起來很兇，但別以貌取人。","tip":"<b>用法：</b>提醒別只看外表。","th":6,"lv":2},{"p":"trust one's gut","zh":"相信直覺","scene":"Gloria 相信自己的直覺。","en":"I don't know why, but I trust my gut on this.","tr":"我說不上來，但這件事我相信直覺。","tip":"<b>延伸：</b>gut feeling 直覺。","th":10,"lv":2}]}],"prompts":["你改不掉的一個習慣（用 old habits die hard、clown around、get the band back together）","你遇過競爭很激烈的環境嗎（用 dog-eat-dog、lose out on、poach）","你曾經看錯一個人嗎（用 don't judge a book by its cover、trust one's gut、sketchy）"],"challenges":[{"id":"c1","sit":"退伍後你還是每天六點醒，跟家人說積習難改。","uses":["old habits die hard"],"ans":"Old habits die hard."},{"id":"c2","sit":"你收到一個很奇怪的中獎連結，跟朋友說看起來很可疑。","uses":["sketchy"],"ans":"That link looks sketchy."},{"id":"c3","sit":"新搬來的鄰居看起來很兇，你跟室友說別以貌取人。","uses":["don't judge a book by its cover"],"ans":"Don't judge a book by its cover."},{"id":"c4","sit":"你太晚報名，錯過了想上的課。","uses":["lose out on"],"ans":"I lost out on that class."}]},"s03e19":{"title":"Election Day","lede":"選舉日到了，全家總動員幫 Claire 拉票；Claire 卻在接受採訪時接連遇到技術問題，選情緊張到最後一刻。","stories":[{"id":"dunphy","name":"Claire 的選戰","who":"Claire · Phil · 全家","plot":"Claire 選議員，全家出動幫忙拉票。","items":[{"p":"get out the vote","zh":"催票、動員投票","scene":"全家到處拜託大家去投票。","en":"Volunteers are calling people to get out the vote.","tr":"志工打電話催大家出來投票。","tip":"<b>用法：</b>選戰術語，也可當形容詞 get-out-the-vote。","th":10,"lv":2},{"p":"on the campaign trail","zh":"在競選路上","scene":"Claire 全力投入選戰。","en":"The candidate was on the campaign trail all month.","tr":"候選人整個月都在跑行程拉票。","tip":"<b>延伸：</b>campaign 競選活動。","th":10,"lv":2},{"p":"count on","zh":"依靠、指望","scene":"Claire 指望家人幫忙拉票。","en":"Can I count on your vote?","tr":"我可以指望你這一票嗎？","tip":"<b>用法：</b>You can count on me. 你可以靠我。","th":6,"lv":1},{"p":"every vote counts","zh":"每一票都很重要","scene":"選情很接近，每一票都關鍵。","en":"Go vote! Every vote counts.","tr":"去投票！每一票都很重要。","tip":"<b>用法：</b>鼓勵投票的標語。","th":10,"lv":1},{"p":"neck and neck","zh":"不相上下、勢均力敵","scene":"兩位候選人的票數很接近。","en":"The two runners were neck and neck until the end.","tr":"兩位跑者直到最後都不相上下。","tip":"<b>畫面：</b>賽馬時馬頸並排。","th":9,"lv":2},{"p":"too close to call","zh":"難分勝負","scene":"開票到最後都還看不出結果。","en":"The election is too close to call.","tr":"這場選舉難分勝負。","tip":"<b>用法：</b>選舉、比賽結果很接近時用。","th":9,"lv":2},{"p":"landslide","zh":"壓倒性勝利","scene":"大家都希望能大勝。","en":"She won by a landslide.","tr":"她以壓倒性勝利當選。","tip":"<b>字面：</b>山崩。","th":9,"lv":2},{"p":"concede","zh":"承認落敗","scene":"選舉最後總有人要認輸。","en":"He conceded the election late last night.","tr":"他昨晚深夜承認敗選。","tip":"<b>用法：</b>concede defeat 認輸。","th":10,"lv":2}]},{"id":"jay","name":"採訪出包","who":"Claire · 媒體","plot":"Claire 接受採訪時一直碰到技術問題。","items":[{"p":"technical difficulties","zh":"技術問題","scene":"採訪時設備一直出問題。","en":"Sorry, we're having technical difficulties.","tr":"抱歉，我們遇到了技術問題。","tip":"<b>用法：</b>直播、會議斷線時的標準說法。","th":9,"lv":1},{"p":"glitch","zh":"小故障","scene":"系統突然出了一點小狀況。","en":"There was a glitch in the app, and my order disappeared.","tr":"App 出了點小故障，我的訂單不見了。","tip":"<b>用法：</b>電子設備、系統的小問題。","th":9,"lv":1}]}],"prompts":["你有參加過選舉或投票嗎（用 every vote counts、get out the vote、count on）","一場勢均力敵的比賽（用 neck and neck、too close to call、landslide）","你遇過最糟的技術問題（用 technical difficulties、glitch、concede）"],"challenges":[{"id":"c1","sit":"視訊會議斷線，你跟大家說遇到技術問題。","uses":["technical difficulties"],"ans":"Sorry, I'm having technical difficulties."},{"id":"c2","sit":"你跟朋友說可以靠你幫忙。","uses":["count on"],"ans":"You can count on me."},{"id":"c3","sit":"連上拔河比賽兩隊不相上下。","uses":["neck and neck"],"ans":"Both teams were neck and neck."},{"id":"c4","sit":"訂票 App 出了小故障，你的票不見了。","uses":["glitch"],"ans":"There was a glitch, and my ticket disappeared."}]},"s03e20":{"title":"The Last Walt","lede":"鄰居 Walt 過世了，Claire 陪 Luke 面對失去；Phil 和 Alex 難得有父女獨處的時光；Haley 偷偷在 Jay 和 Gloria 家辦泳池派對；Cam 的爸爸來訪。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Luke · Phil · Alex","plot":"Walt 走了，Luke 很難過；Phil 則跟 Alex 度過一段難得的相處時光。","items":[{"p":"pass away","zh":"過世","scene":"鄰居 Walt 過世了。","en":"My grandpa passed away last year.","tr":"我爺爺去年過世了。","tip":"<b>語氣：</b>比 die 委婉。","th":8,"lv":1},{"p":"cope with","zh":"面對、處理（困難）","scene":"Claire 陪 Luke 面對難過。","en":"How do you cope with stress?","tr":"你怎麼處理壓力？","tip":"<b>用法：</b>cope with + 困難、情緒。","th":6,"lv":1},{"p":"grieve","zh":"哀悼、悲傷","scene":"每個人哀悼的方式不同。","en":"Everyone grieves in their own way.","tr":"每個人都用自己的方式悲傷。","tip":"<b>名詞：</b>grief 悲痛。","th":4,"lv":1},{"p":"rest in peace","zh":"安息","scene":"大家祝 Walt 安息。","en":"Rest in peace, buddy.","tr":"安息吧，老兄。","tip":"<b>縮寫：</b>RIP。","th":7,"lv":1},{"p":"quality time","zh":"好好相處的時光","scene":"Phil 和 Alex 難得有父女時光。","en":"I want to spend more quality time with my family.","tr":"我想多花點時間好好陪家人。","tip":"<b>用法：</b>強調是用心的相處，不只是在一起。","th":2,"lv":1}]},{"id":"jay","name":"Haley 的派對","who":"Haley · Jay · Gloria","plot":"Haley 趁爺爺奶奶不在，偷偷在他們家辦泳池派對。","items":[{"p":"while the cat's away","zh":"老虎不在家，猴子稱大王","scene":"大人不在，Haley 就開派對了。","en":"The boss is on vacation. While the cat's away, the mice will play.","tr":"老闆在休假，老虎不在家猴子稱大王。","tip":"<b>全句：</b>While the cat's away, the mice will play.","th":9,"lv":2},{"p":"crash a party","zh":"不請自來參加派對","scene":"一堆不認識的人跑來派對。","en":"Some strangers crashed our party last night.","tr":"昨晚有陌生人跑來我們的派對。","tip":"<b>名詞：</b>party crasher 不請自來的人。","th":8,"lv":2},{"p":"clean up after","zh":"收拾別人留下的爛攤子","scene":"派對結束後得收拾殘局。","en":"I'm tired of cleaning up after my roommates.","tr":"我受夠了幫室友收拾。","tip":"<b>用法：</b>clean up after + 人。","th":2,"lv":1}]},{"id":"mitch","name":"Cam 的爸爸","who":"Cameron · 爸爸 · Mitchell","plot":"Cam 的爸爸話不多，卻跟 Cam 有很多相似之處。","items":[{"p":"man of few words","zh":"話不多的人","scene":"Cam 的爸爸很少說話。","en":"My dad is a man of few words, but he always shows up.","tr":"我爸話不多，但他總是會出現。","tip":"<b>用法：</b>形容沉默寡言的人，通常是中性或正面。","th":9,"lv":2},{"p":"chip off the old block","zh":"跟老爸一個樣","scene":"Cam 某些地方跟他爸好像。","en":"He fixes cars just like his dad. A chip off the old block.","tr":"他跟他爸一樣會修車，簡直一個模子刻出來的。","tip":"<b>用法：</b>兒子像爸爸時說。","th":2,"lv":2}]}],"prompts":["你怎麼面對失去重要的人或寵物（用 pass away、grieve、cope with）","你最近和家人的相處時光（用 quality time、man of few words、chip off the old block）","你在爸媽不在家時做過什麼事（用 while the cat's away、crash a party、clean up after）"],"challenges":[{"id":"c1","sit":"老闆出差不在，大家都很放鬆，你笑說老虎不在家。","uses":["while the cat's away"],"ans":"While the cat's away, the mice will play."},{"id":"c2","sit":"你跟朋友說你受夠了幫寢室收拾。","uses":["clean up after"],"ans":"I'm tired of cleaning up after everyone."},{"id":"c3","sit":"你跟朋友說你爸話不多，但很可靠。","uses":["man of few words"],"ans":"My dad is a man of few words."},{"id":"c4","sit":"你問考過國考的朋友怎麼處理準備考試的壓力。","uses":["cope with"],"ans":"How did you cope with the stress?"}]},"s03e21":{"title":"Planes, Trains and Cars","lede":"Phil 的朋友 Andre 慫恿他買了一台雙人座敞篷車，Claire 的反應出乎大家意料；Mitchell 和 Cam 在地鐵上弄丟了 Lily 的兔子娃娃；Jay、Gloria 和 Manny 在去 Jay 高中同學會的路上狀況連連。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Andre","plot":"Phil 被朋友說動，買了一台只能坐兩個人的跑車。","items":[{"p":"talk someone into","zh":"說服某人做某事","scene":"Andre 說服 Phil 買車。","en":"My friend talked me into getting a tattoo.","tr":"我朋友說服我去刺青。","tip":"<b>反義：</b>talk someone out of 勸某人別做。","th":10,"lv":1},{"p":"midlife crisis","zh":"中年危機","scene":"大家都覺得 Phil 是中年危機。","en":"He bought a motorcycle at 50. Midlife crisis?","tr":"他 50 歲買了重機，中年危機嗎？","tip":"<b>用法：</b>中年人突然做出年輕人的事。","th":9,"lv":2},{"p":"take it for a spin","zh":"開出去兜一圈","scene":"Phil 迫不及待想開車兜風。","en":"Nice car! Can I take it for a spin?","tr":"好車！我可以開出去兜一圈嗎？","tip":"<b>用法：</b>試駕、試用新東西時。","th":8,"lv":2},{"p":"ride shotgun","zh":"坐副駕駛座","scene":"雙人座只剩一個副駕位子。","en":"I call shotgun!","tr":"我要坐副駕！","tip":"<b>文化：</b>美國朋友間搶副駕時大喊 Shotgun!","th":8,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 最愛的兔子娃娃掉在地鐵上，兩人急著找回來。","items":[{"p":"lost and found","zh":"失物招領","scene":"兩人去找失物招領處。","en":"Let's check the lost and found.","tr":"我們去失物招領處看看。","tip":"<b>用法：</b>車站、學校、商場都有。","th":8,"lv":1},{"p":"retrace one's steps","zh":"沿原路找回去","scene":"兩人回想一路走過的地方。","en":"I lost my phone, so I retraced my steps.","tr":"我手機不見了，所以沿原路找回去。","tip":"<b>用法：</b>找東西時
