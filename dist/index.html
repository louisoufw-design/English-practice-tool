<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>摩登家庭片語本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sitcom "episode guide" + daily study desk — nav row, today's dashboard, flashcard review, challenges, sentence notebook, progress calendar; each episode is its own page (#s01e02) */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#dde3ea;
  --accent:#1f5f8b; --accent-soft:#e3eef6; --mark:#ffd95a; --done:#2e7d5b; --warn:#a15c00; --bad:#b3261e;
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2b343e;
  --accent:#7fb6dc; --accent-soft:#1d2d3a; --mark:#b8932a; --done:#5cc196; --warn:#e0a24a; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2b343e;
  --accent:#7fb6dc; --accent-soft:#1d2d3a; --mark:#b8932a; --done:#5cc196; --warn:#e0a24a; --bad:#f08a80; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:860px;margin:0 auto}
a{color:var(--accent)}
button{font-family:var(--f-body)}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);display:flex;align-items:center;gap:4px 16px;padding-block:13px;border-bottom:1px solid var(--line);font-size:15px}
.nav .links{display:flex;flex-wrap:wrap;gap:4px 16px;min-width:0}
.nav a{text-decoration:none;color:var(--muted);padding-block:2px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.cur{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.sync{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
@media (max-width:560px){.nav{gap:4px 12px}.nav .links{gap:4px 13px}.sync .txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.localnote{font-size:13.5px;color:var(--warn);margin:0}
.chunknote{font-size:14.5px}
.w{cursor:pointer;border-radius:3px;transition:background .1s}
.w:hover{background:var(--accent-soft)}
.w.sel{background:var(--mark);color:#1b2430}
#pickbar{position:fixed;left:12px;right:12px;bottom:12px;max-width:620px;margin:0 auto;z-index:60;background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
#pickbar[hidden]{display:none}
#pickbar p{margin:0}
.pk-h{font-size:15px}.pk-h .muted{display:block;font-size:12.5px}
.pk-h .zh{color:var(--muted)}
.pk-n{font-size:14px;color:var(--muted)}
.pk-ex{font-size:14.5px;border-left:3px solid var(--mark);padding-left:10px}
.pk-in,#addword{font:inherit;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.pk-src{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0}
.exhint summary{cursor:pointer;font-size:14px;color:var(--accent)}
.exhint .ex{margin-top:8px}
.chunknote b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--warn);letter-spacing:.06em;margin-right:6px}
.colbox .en b{font-weight:700}
@media (min-width:561px){.localnote{display:none}}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.sg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:12px 4px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.sg:hover{border-color:var(--accent)}
.sg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ring{width:50px;height:50px;border-radius:50%;background:conic-gradient(var(--done) 0 var(--m),var(--accent) 0 var(--l),var(--line) 0);display:grid;place-items:center}
.ring b{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 14px var(--f-display)}
.sg .sn{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sg-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin:6px 0 12px}
.sg-leg span{display:inline-flex;align-items:center;gap:5px}
.sg-leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sg-leg i.m{background:var(--done)}.sg-leg i.l{background:var(--accent)}
.sync.ok{color:var(--done)} .sync.warn,.sync.local{color:var(--warn)}

header{padding-block:28px 20px;display:grid;gap:10px}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,3.1rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 .ep{display:inline-block;font-family:var(--f-mono);font-size:.42em;font-weight:500;vertical-align:middle;border:1.5px solid var(--ink);padding:2px 8px;border-radius:4px;margin-left:6px;letter-spacing:0}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0}
.lede{color:var(--muted);max-width:62ch;margin:0}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin:6px 0 0;max-width:62ch}

/* buttons */
.primary{font:500 15px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;cursor:pointer;white-space:nowrap}
.primary:hover{opacity:.88}
.primary:disabled{opacity:.45;cursor:default}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
a.btn{text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.done{border-color:var(--done);color:var(--done)}
.chip-btn{background:transparent;cursor:pointer;border-color:var(--done);color:var(--done);display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover{background:var(--accent-soft)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:5px 16px}
.btn.go:hover{opacity:.88;color:var(--bg)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.confirm{border:1px solid var(--bad);border-radius:8px;padding:10px 14px;display:grid;gap:8px;font-size:14.5px}
.confirm p{margin:0}

/* dashboard */
.streak-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px 6px}
.streak{display:grid;gap:8px;min-width:0}
.sline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.mini-link{display:grid;gap:6px;justify-items:end;text-decoration:none;color:var(--muted);flex:none;border-radius:8px;padding:4px}
.mini-link:hover{background:var(--accent-soft)}
.mini-cap{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.cal.mini{grid-template-columns:repeat(7,clamp(15px,4.4vw,22px));gap:3px;max-width:none}
.cal.mini .wd{font-size:10px;line-height:1.2}
.cal.mini .c{border-radius:4px}
.cal.mini .today{outline-width:1.5px}
.streak .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.streak .unit{font-family:var(--f-display);font-weight:700;font-size:1.3rem}
.streak .prot{font-size:14px;color:var(--muted)}
.dash{display:grid;gap:10px;margin-top:14px}
.task{display:grid;grid-template-columns:4.2rem 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.task.lead{border:1.5px solid var(--ink)}
.task .n{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.task .n.ok{color:var(--done)}
.task .what{min-width:0}
.task .what>b{display:block;font-weight:700}
.task .what>span{display:block;font-size:13.5px;color:var(--muted)}
.task .what>span b{color:var(--ink)}
.task-edit{grid-column:1 / -1;display:grid;gap:10px;margin-top:8px}
@media (max-width:480px){.task{grid-template-columns:3.2rem 1fr}.task>.act{grid-column:1 / -1}.task>.act .primary,.task>.act .btn{width:100%}}
.duo{display:grid;gap:12px;margin-top:22px}
@media (min-width:720px){.duo{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel .sec{font-size:1.2rem}
.panel p{margin:0}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:6px;border-bottom:1px dashed var(--line)}
.tlist li:last-child{border-bottom:0}
.tlist li>div{min-width:0}
.tlist .phrase{font-size:1.05rem}
.tlist .sent{font-size:15px}
.quote{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.35rem;line-height:1.4;text-wrap:balance;padding-left:14px;border-left:3px solid var(--mark)}
.recap .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pause{display:grid;gap:8px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;font-size:14.5px}
.pause select{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.pause.on{border-style:solid;border-color:var(--warn)}

/* home episode list */
.list-head{display:grid;gap:12px}
.eplink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;border:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.eplink:hover{border-color:var(--accent);background:var(--accent-soft)}
.eplink span:last-child{color:var(--accent);font-weight:500;white-space:nowrap}
.tr-line{font-size:14.5px;color:var(--muted)}
.seasons{display:flex;flex-wrap:wrap;gap:8px;padding-block:4px 16px;border-bottom:1px solid var(--line)}
.eps{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.epi a,.epi .soon{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline;padding:14px 16px;border-radius:10px;text-decoration:none;color:var(--ink);height:100%;box-sizing:border-box}
.epi a{background:var(--surface);border:1.5px solid var(--ink)}
.epi a:hover{background:var(--accent-soft)}
.epi .soon{border:1px dashed var(--line);color:var(--muted)}
.epi .num{font-family:var(--f-mono);font-size:13px;grid-row:span 2}
.epi .t{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.3}
.epi .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.epi a .s{color:var(--done)}
.legend{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.epi a.watched{border-color:var(--done)}
.epi a.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.nextbadge{display:inline-block;font:600 11px var(--f-mono);color:var(--surface);background:var(--accent);padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.nowwatch{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;align-items:center}
.nw-slate{align-self:stretch;background:var(--ink);color:var(--bg);border-radius:8px;width:4.8rem;padding:10px 0;display:grid;align-content:center;justify-items:center;gap:6px;line-height:1}
.nw-slate .s{font:500 12px var(--f-mono);letter-spacing:.1em;opacity:.7}
.nw-slate .e{font:800 1.85rem var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.nw-body{min-width:0;display:grid;gap:4px}
.nw-k{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);margin:0}
.nw-t{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:0;text-wrap:balance}
.nw-strip{display:flex;gap:2px;margin-top:6px;max-width:22rem}
.nw-strip i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.nw-strip i.w{background:var(--done)}
.nw-strip i.n{background:var(--accent)}
.nw-sub{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:2px 0 0;font-variant-numeric:tabular-nums}
.nw-act{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.nw-act .primary{text-decoration:none;flex:1;text-align:center}
.nw-act .btn{padding:9px 14px;font-size:14px}
.nowwatch.done .nw-slate{background:var(--done)}
@media (min-width:600px){.nowwatch{grid-template-columns:auto 1fr auto}.nw-act{grid-column:auto;flex-direction:column}}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0}
.adv-btn{border-radius:10px;padding:0 14px;font-size:14px;border-width:1.5px}
.adv-btn.on{border-color:var(--accent);color:var(--accent)}
.advbox{display:grid;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.linkish{all:unset;cursor:pointer;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* finder */
.finder{display:grid;gap:10px;margin:4px 0 14px}
.finder input[type=search]{font:inherit;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.finder input[type=search]:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .tab{font-size:13px;padding:4px 11px}
.chips .lab{font-size:12.5px;color:var(--muted);margin-right:2px}
.hitcount{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.hits{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hit{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hit.learned{border-color:var(--done)}
.hit-main{all:unset;cursor:pointer;display:grid;gap:3px;min-width:0;flex:1 1 220px}
.hit-main:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.hit-main .zh{color:var(--muted);font-size:14px}
.hit .phrase{font-size:1.05rem}
.hit .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hit-act{display:flex;gap:6px;flex-shrink:0;align-items:center}
.lvl{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
.lvl.b{border-color:var(--warn);color:var(--warn)}
/* spoiler guard */
.spoil{filter:blur(5px);cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:4px;transition:filter .15s}
.spoil:hover{filter:blur(3.5px)}
.spoil:focus-visible{outline:2px solid var(--accent);outline-offset:3px;filter:blur(3.5px)}
.spnote{font-size:13.5px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0 0;max-width:62ch}
.watchrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.card.focus{animation:focusglow 2s ease-out}
@keyframes focusglow{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.card.focus{animation:none;box-shadow:0 0 0 3px var(--accent)}}

/* episode */
.toolbar{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{font:500 14px var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.progress{font-family:var(--f-mono);font-size:13px;color:var(--done);font-variant-numeric:tabular-nums}
.story{margin-top:36px}
.story h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0 0 4px}
.story .who{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:0 0 6px}
.story .plot{margin:0 0 16px;max-width:62ch;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:10px;min-width:0}
.card.learned{border-color:var(--done)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.phrase{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;line-height:1.3;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:.24em;text-decoration-skip-ink:auto}
.zh{font-weight:500}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scene{font-size:14.5px;color:var(--muted);margin:0}
.scene b,.try b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--accent);letter-spacing:.06em;margin-right:6px}
.ex{background:var(--accent-soft);border-radius:8px;padding:10px 14px;display:grid;gap:2px;min-width:0}
.ex .en{font-size:1.05rem;margin:0}
.ex .tr{font-size:14px;color:var(--muted);margin:0}
.tip{font-size:14px;margin:0}
.tip b{color:var(--accent)}
body.hide-zh .zh,body.hide-zh .tr{filter:blur(6px);cursor:pointer;transition:filter .15s}
body.hide-zh .zh:hover,body.hide-zh .tr:hover{filter:none}
.practice{margin-top:44px;border-top:2px solid var(--ink);padding-top:20px;display:grid;gap:14px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;margin-top:2px}
.steps p{margin:0}
.steps .time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.prompts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.prompt{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px}
.prompt span{display:block;font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-bottom:2px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;font-family:var(--f-mono);font-size:14px}
.pager a{text-decoration:none}.pager a:hover{text-decoration:underline}

/* review */
.stage{max-width:620px;margin:24px auto 0;display:grid;gap:14px}
.rhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.flash{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:22px;display:grid;gap:14px;min-width:0}
.flash .meaning{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.35;margin:0;text-wrap:balance}
.try{font-size:14.5px;margin:0}
.wide{width:100%}
.hintkey{font-size:13px;color:var(--muted);margin:0;text-align:center}
.divider{border:0;border-top:1px dashed var(--line);margin:4px 0}
.answer{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.answer .phrase{font-size:1.7rem}
.mine{border:1.5px solid var(--done);border-radius:8px;padding:10px 14px;display:grid;gap:4px}
.mine p{margin:0;font-size:1.05rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{display:grid;gap:2px;padding:12px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.rate button .when{font:400 12px var(--f-mono);color:var(--muted)}
.rate .g0{border-color:var(--bad)} .rate .g1{border-color:var(--warn)} .rate .g2{border-color:var(--done)}
.rate button:hover{background:var(--accent-soft)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px;text-align:left}
.empty h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0}
.empty p{margin:0}

/* editor */
.editor{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.editor textarea{font:16px/1.5 var(--f-body);width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);resize:vertical}
.rev{display:grid;gap:10px}
.rev:empty{display:none}
.rev ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.rev s{color:var(--bad)} .rev li b{color:var(--done)}
.rev li span{display:block;font-size:13.5px;color:var(--muted)}
.rev p{margin:0}
.err{color:var(--bad);margin:0;font-size:14.5px}
.badge{font-family:var(--f-mono);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;justify-self:start}
.b-good,.b-fixed{color:var(--done)} .b-minor{color:var(--warn)} .b-wrong{color:var(--bad)} .b-none{color:var(--muted)}

/* challenge */
.chal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.chal.fin{border-color:var(--done)}
.chal .sit{font-size:1.1rem;font-weight:500;margin:0}
.chal .hint{font-size:14px;color:var(--muted);margin:0}

/* notebook */
.nlist{display:grid;gap:10px}
.nitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.nitem .head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.nitem .head .phrase{font-size:1.15rem}
.nitem .sent{margin:0;font-size:1.05rem}
.nitem .src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.weak b{color:var(--bad)} .tile.master b{color:var(--done)}
.block{margin-top:34px;display:grid;gap:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:380px}
.cal .wd{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--surface);border:1px solid var(--line);box-sizing:border-box}
.cal .l1{background:color-mix(in srgb,var(--done) 30%,var(--surface));border-color:transparent}
.cal .l2{background:color-mix(in srgb,var(--done) 62%,var(--surface));border-color:transparent}
.cal .l3{background:var(--done);border-color:transparent}
.cal .paused{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px)}
.cal .prot{border:1.5px dashed var(--done)}
.cal .today{outline:2px solid var(--ink);outline-offset:1px}
.cal .future{background:transparent;border-style:dotted}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line);box-sizing:border-box}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flist li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.flist .phrase{font-size:1.05rem}
.flist .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12.5px;color:var(--bad)}
.eprog{display:grid;gap:12px}
.eprog .r{display:grid;gap:5px}
.eprog .r div:first-child{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:14px}
.eprog .r span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ebar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.ebar i{display:block;height:100%}
.ebar .m{background:var(--done)} .ebar .l{background:var(--accent)}
.boxstage{justify-items:center;text-align:center;gap:18px;padding-block:16px}
.giftbox{width:min(210px,62vw);aspect-ratio:1;max-width:100%;border:2px solid var(--ink);border-radius:16px;cursor:pointer;display:grid;place-items:center;padding:0;
 background:linear-gradient(90deg,transparent calc(50% - 15px),var(--mark) calc(50% - 15px),var(--mark) calc(50% + 15px),transparent calc(50% + 15px)),linear-gradient(0deg,transparent calc(50% - 15px),var(--mark) calc(50% - 15px),var(--mark) calc(50% + 15px),transparent calc(50% + 15px)),var(--accent-soft);
 transition:transform .18s ease}
.giftbox:hover{transform:rotate(-3deg) scale(1.03)}
.giftbox .q{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--ink);background:var(--surface);width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink)}
.boxcap{color:var(--muted);margin:0;max-width:30ch}
.reveal{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
.got .answer .phrase{font-size:2rem}
.btn.quiet{border-color:transparent;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.reveal{animation:none}}

<script>
/* ---------- content ---------- */
const COUNTS=[24,24,24,24,24,24,22,22,22,22,18];
const S1_TITLES=["Pilot","The Bicycle Thief","Come Fly with Me","The Incident","Coal Digger","Run for Your Wife","En Garde","Great Expectations","Fizbo","Undeck the Halls","Up All Night","Not in My House","Fifteen Percent","Moon Landing","My Funky Valentine","Fears","Truth Be Told","Starry Night","Game Changer","Benched","Travels with Scout","Airport 2010","Hawaii","Family Portrait"];

const EPISODES={"s01e01":{"title":"Pilot","lede":"第一集用紀錄片手法拍三個看似無關的家庭，結尾才揭曉他們其實是同一個大家族。對白幾乎全是日常家庭吵架、撒嬌、碎念，很適合學美國人平常怎麼講話。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"Phil 一心想當孩子眼中的酷老爸，Claire 則是什麼都要管的媽媽。大女兒 Haley 帶男友回家讓 Claire 很緊張，Phil 還答應要用 BB 槍「處罰」兒子 Luke。","items":[{"p":"freak out","zh":"抓狂、嚇壞、緊張到失控","scene":"Claire 一聽到女兒要帶男友回家，整個人緊張兮兮。","en":"Don't freak out, but I think I lost your charger.","tr":"你先別抓狂，但我好像把你的充電器弄丟了。","tip":"<b>連音：</b>freak‿out 唸成「frea-kout」。開頭說 Don't freak out, but… 是美國人講壞消息的固定句型。","th":4,"lv":1},{"p":"be grounded","zh":"被禁足（小孩被罰不准出門）","scene":"Dunphy 家的父母要用處罰管教三個小孩。","en":"I got grounded for a whole month in high school.","tr":"我高中時被禁足了整整一個月。","tip":"<b>用法：</b>父母說 You're grounded! 小孩事後說 I got grounded.","th":2,"lv":1},{"p":"a deal's a deal","zh":"說好的就要算數","scene":"Phil 答應過的處罰，就算不想做也得做到。","en":"You lost the bet, so you're buying dinner. A deal's a deal.","tr":"你賭輸了，晚餐你請。說好就是說好。","tip":"<b>語氣：</b>帶點堅持但不兇，朋友之間很常用。","th":7,"lv":2},{"p":"What were you thinking?","zh":"你在想什麼啊？（責備對方做了蠢事）","scene":"孩子闖禍後，爸媽忍不住問的那句話。","en":"You went hiking without water? What were you thinking?","tr":"你去爬山沒帶水？你到底在想什麼？","tip":"<b>重音：</b>放在 thinking 上，語調往下壓才有責備感。","th":7,"lv":1},{"p":"no big deal","zh":"沒什麼大不了","scene":"Phil 常常想把緊張的場面講得很輕鬆。","en":"It's no big deal. We can just take the next train.","tr":"沒什麼大不了，我們搭下一班車就好。","tip":"<b>回應別人道歉：</b>No big deal. 比 It's OK. 更口語、更隨性。","th":7,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"年紀大的 Jay 娶了年輕熱情的 Gloria，還要適應她早熟又浪漫的兒子 Manny。Manny 在商場愛上一個比他大很多的女生，決定當眾告白。","items":[{"p":"be into someone","zh":"喜歡某人、對某人有意思","scene":"Manny 迷上一個大女生，大人們都覺得他想太多。","en":"I think she's into you. She keeps laughing at your jokes.","tr":"我覺得她對你有意思，她一直被你的笑話逗笑。","tip":"<b>也能用在興趣：</b>I'm really into hiking lately. 我最近很迷爬山。","th":1,"lv":1},{"p":"put yourself out there","zh":"勇敢踏出去、讓自己被看見","scene":"Manny 鼓起勇氣當眾告白，主動讓對方看見自己。","en":"If you want to make friends, you have to put yourself out there.","tr":"想交朋友，你就得主動一點。","tip":"<b>常見場合：</b>談戀愛、找工作、交朋友時鼓勵人。","th":6,"lv":2},{"p":"I get it","zh":"我懂、我了解","scene":"Jay 嘴上說懂，其實常常聽不太進去 Gloria 的話。","en":"I get it. You're tired, so let's talk tomorrow.","tr":"我懂，你累了，我們明天再聊。","tip":"<b>語氣差很多：</b>平穩說是體諒；很快很重地說 I get it! 是不耐煩。","th":7,"lv":1},{"p":"That's not the point","zh":"重點不是那個","scene":"Gloria 和 Jay 吵架時，兩個人常常在講不同的重點。","en":"Yes, it was cheap, but that's not the point. We don't need it.","tr":"對，是很便宜，但重點不是那個，我們根本不需要。","tip":"<b>吵架必備：</b>後面接你真正想說的重點。","th":7,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 和 Cameron 剛從越南領養了女兒 Lily，準備告訴家人。凡事都想低調的 Mitchell，碰上愛搞排場的 Cameron。","items":[{"p":"make a big deal out of it","zh":"小題大作、搞得很隆重","scene":"Mitchell 希望低調宣布，Cameron 卻想辦得很戲劇化。","en":"It's just my birthday. Please don't make a big deal out of it.","tr":"只是我生日而已，拜託別搞得那麼誇張。","tip":"<b>對比：</b>no big deal 是「沒什麼」，make a big deal out of 是「把它搞大」。","th":9,"lv":1},{"p":"overreact","zh":"反應過度","scene":"Mitchell 擔心家人的反應，Cameron 覺得他想太多。","en":"I think you're overreacting. It's just a small scratch.","tr":"我覺得你反應過度了，只是一點小刮傷。","tip":"<b>發音：</b>o-ver-re-ACT，重音在最後。","th":4,"lv":1},{"p":"break the news","zh":"宣布（通常是讓人震驚的）消息","scene":"兩人在討論要怎麼告訴家人他們領養了小孩。","en":"How should we break the news to Mom?","tr":"我們要怎麼跟媽說這件事？","tip":"<b>搭配：</b>break the news to + 人。","th":10,"lv":1},{"p":"be on the same page","zh":"想法一致、有共識","scene":"兩個人對「怎麼宣布」完全沒有共識。","en":"Before the meeting, let's make sure we're on the same page.","tr":"開會前，我們先確定彼此想法一致。","tip":"<b>職場也超常用：</b>Are we on the same page? 我們有共識了嗎？","th":10,"lv":2},{"p":"hang on a sec","zh":"等一下","scene":"家人之間講話常常被打斷，這句到處都聽得到。","en":"Hang on a sec, I need to grab my keys.","tr":"等我一下，我去拿鑰匙。","tip":"<b>連音：</b>hang‿on 唸成「hang-gon」，sec 是 second 的縮寫。","th":7,"lv":1},{"p":"keep it together","zh":"撐住、保持冷靜不崩潰","scene":"Mitchell 面對緊張場面時努力讓自己不失控。","en":"I almost cried during my speech, but I kept it together.","tr":"我演講時差點哭出來，但撐住了。","tip":"<b>鼓勵別人：</b>Just keep it together for one more hour.","th":4,"lv":2}]}],"prompts":["你小時候被爸媽處罰過最印象深刻的一次（用 grounded、What were you thinking、a deal's a deal）","你在部隊裡有沒有人很容易緊張大驚小怪（用 freak out、overreact、no big deal）","你想對某個人說但一直不敢說的事（用 put yourself out there、break the news、be on the same page）"],"challenges":[{"id":"c1","sit":"朋友手機摔壞了，一副快崩潰的樣子。你叫他冷靜，跟他說這沒什麼大不了。","uses":["freak out","no big deal"],"ans":"Don't freak out. It's no big deal. We can get it fixed."},{"id":"c2","sit":"你跟室友打賭輸的人要請宵夜，他輸了卻想耍賴。你堅持說好就要算數。","uses":["a deal's a deal"],"ans":"Come on, you lost the bet. A deal's a deal."},{"id":"c3","sit":"朋友半夜一個人騎車上陽明山，手機還沒電。你問他到底在想什麼。","uses":["What were you thinking?"],"ans":"You went up the mountain alone with a dead phone? What were you thinking?"},{"id":"c4","sit":"你覺得朋友好像喜歡常去那家咖啡店的店員，鼓勵他主動去聊天。","uses":["be into someone","put yourself out there"],"ans":"I think you're into her. You should put yourself out there and talk to her."},{"id":"c5","sit":"你和哥哥要跟爸媽說一件大事，開口前你想先確認兩人想法一致。","uses":["break the news","be on the same page"],"ans":"Before we break the news to Mom and Dad, let's make sure we're on the same page."},{"id":"c6","sit":"朋友只是被主管念了一句就很沮喪。你說他反應過度，叫他撐到下班就好。","uses":["overreact","keep it together"],"ans":"You're overreacting. Just keep it together until you get off work."}]},"s01e02":{"title":"The Bicycle Thief","lede":"這集的主題是「想當好家長，結果越弄越糟」。Phil 為了兒子的腳踏車一路出包，Jay 第一次替 Manny 收拾他生父留下的爛攤子，Mitchell 和 Cam 則擔心女兒輸在起跑點。大量「掩飾、圓謊、計畫失敗」的說法。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Luke","plot":"Jay 笑 Luke 騎女生的腳踏車，Phil 一衝動就幫他買了新車。之後 Phil 以為 Luke 把車亂丟，為了不被 Claire 念就先把車「偷」回家，結果一連串誤會讓事情越滾越大。","items":[{"p":"on impulse","zh":"一時衝動","scene":"Phil 被 Jay 一激，沒多想就買了一台新腳踏車。","en":"I bought these shoes on impulse, and now I regret it.","tr":"我一時衝動買了這雙鞋，現在後悔了。","tip":"<b>相關：</b>impulse buy 衝動購物，例如 That was an impulse buy.","th":10,"lv":2},{"p":"get away with it","zh":"做了壞事沒被抓到、逃過一劫","scene":"Phil 想偷偷把事情處理掉，不讓 Claire 發現。","en":"He was late again, and somehow he got away with it.","tr":"他又遲到了，不知道為什麼居然沒事。","tip":"<b>常見反問：</b>You think you can get away with this? 你以為你逃得掉嗎？","th":10,"lv":1},{"p":"It's not what it looks like","zh":"事情不是你看到的那樣","scene":"Phil 被看到牽著別人的腳踏車，怎麼看都很可疑。","en":"It's not what it looks like. I was just holding her bag for her.","tr":"不是你想的那樣，我只是幫她拿包包。","tip":"<b>情境喜劇經典句：</b>被抓包時一定會出現，語速快一點更像。","th":7,"lv":1},{"p":"backfire","zh":"弄巧成拙、適得其反","scene":"Phil 想把多出來的車處理掉，結果反而惹出新麻煩。","en":"I tried to surprise her, but it totally backfired.","tr":"我想給她驚喜，結果完全弄巧成拙。","tip":"<b>重音：</b>BACK-fire，重音在前面。","th":10,"lv":2},{"p":"lock up","zh":"鎖好（車、門、店）","scene":"整個誤會其實就卡在 Luke 到底有沒有把車鎖好。","en":"Don't forget to lock up your bike. It's not safe here.","tr":"記得把腳踏車鎖好，這裡不安全。","tip":"<b>也能說：</b>Can you lock up tonight? 今晚你負責鎖門好嗎？","th":8,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Jay 和 Manny 一起組電風扇，Jay 不看說明書還被電到兩次。後來 Manny 的生父臨時取消帶他去迪士尼，Jay 為了不讓 Manny 傷心，編了個善意的謊言並想辦法補償他。","items":[{"p":"figure it out","zh":"自己搞清楚、想出辦法","scene":"Jay 堅持不用看說明書，自己就能組好電風扇。","en":"I don't need a map. I'll figure it out.","tr":"我不需要地圖，我自己會搞定。","tip":"<b>連音：</b>figure‿it‿out 唸成「fig-yer-ri-dout」。","th":10,"lv":1},{"p":"bail on someone","zh":"放某人鴿子、臨時落跑","scene":"Manny 的爸爸說好要帶他去迪士尼，最後卻沒出現。","en":"He bailed on us at the last minute again.","tr":"他又在最後一刻放我們鴿子。","tip":"<b>比 cancel 更口語，</b>還帶有「不負責任」的感覺。","th":2,"lv":2},{"p":"let someone down","zh":"讓某人失望","scene":"Jay 看得出 Manny 被生父傷了心。","en":"I promised to help, and I don't want to let him down.","tr":"我答應要幫忙，不想讓他失望。","tip":"<b>自我要求：</b>I won't let you down. 我不會讓你失望。","th":2,"lv":1},{"p":"a white lie","zh":"善意的謊言","scene":"Jay 編了一個理由，讓 Manny 以為行程只是延誤。","en":"I told her the food was great. It was just a white lie.","tr":"我跟她說菜很好吃，只是善意的謊言而已。","tip":"<b>延伸：</b>tell a white lie 說善意的謊言。","th":10,"lv":1},{"p":"make it up to someone","zh":"補償某人","scene":"Jay 把原本的行程讓出來，想辦法讓 Manny 開心。","en":"Sorry I missed your party. Let me make it up to you.","tr":"抱歉錯過你的派對，讓我補償你吧。","tip":"<b>道歉後接這句，</b>通常會搭配請吃飯：I'll buy you dinner.","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Mitchell 和 Cam 帶 Lily 去上幼兒遊戲班，發現別的小朋友都比她厲害。兩人一時糊塗想把別人的作品說成 Lily 做的，聽到教室有監視器就馬上打退堂鼓。","items":[{"p":"keep up with","zh":"跟上（進度、別人）","scene":"兩人擔心 Lily 跟不上班上其他小孩。","en":"He walks so fast. I can't keep up with him.","tr":"他走好快，我跟不上他。","tip":"<b>常見：</b>keep up with the news 持續關注新聞。","th":10,"lv":1},{"p":"fall behind","zh":"落後","scene":"看到別人家的小孩那麼厲害，他們覺得 Lily 已經落後了。","en":"I was sick for a week and fell behind in class.","tr":"我病了一個禮拜，課業就落後了。","tip":"<b>反義：</b>catch up 追上進度。","th":3,"lv":1},{"p":"take credit for","zh":"把功勞攬在自己身上","scene":"他們想把別的小朋友堆好的積木說成是 Lily 做的。","en":"I did all the work, but he took credit for it.","tr":"事情都是我做的，功勞卻被他拿走。","tip":"<b>正面用法：</b>I can't take credit for this. It was her idea. 這不是我的功勞，是她的點子。","th":3,"lv":1},{"p":"have second thoughts","zh":"開始猶豫、改變心意","scene":"一聽到有監視器，兩人立刻後悔這個計畫。","en":"I signed up for the trip, but now I'm having second thoughts.","tr":"我報名了旅行，但現在開始猶豫了。","tip":"<b>注意：</b>thoughts 一定用複數。","th":10,"lv":1},{"p":"show off","zh":"炫耀、愛現","scene":"其他家長和小孩的表現讓 Mitchell 和 Cam 很有壓力。","en":"He's always showing off his new car.","tr":"他一天到晚在炫耀他的新車。","tip":"<b>名詞：</b>He's such a show-off. 他超愛現。","th":9,"lv":1}]}],"prompts":["說一次你衝動購物後悔的經驗（用 on impulse、backfire、have second thoughts）","有人放你鴿子或讓你失望的事（用 bail on、let someone down、make it up to）","你剛入伍時跟不上進度的經驗（用 keep up with、fall behind、figure it out）"],"challenges":[{"id":"c1","sit":"你一時衝動買了很貴的耳機，跟朋友說現在開始有點後悔。","uses":["on impulse","have second thoughts"],"ans":"I bought these headphones on impulse, and now I'm having second thoughts."},{"id":"c2","sit":"朋友約你週末吃飯，但你臨時要加班，只好跟他說要放他鴿子，下次補償他。","uses":["bail on someone","make it up to someone"],"ans":"Sorry, I have to bail on you this weekend. Let me make it up to you next time."},{"id":"c3","sit":"你剛下部隊，體能課快跟不上大家，跟朋友說你不想再落後了。","uses":["keep up with","fall behind"],"ans":"I can barely keep up with everyone in PT. I don't want to fall behind."},{"id":"c4","sit":"朋友想用別人的學生證買半價票。你提醒他不可能沒事的，而且只會弄巧成拙。","uses":["get away with it","backfire"],"ans":"You won't get away with it. Trust me, it's going to backfire."},{"id":"c5","sit":"你跟媽媽說在外面一個人住都有好好吃飯，其實只是不想讓她擔心。跟朋友解釋這件事。","uses":["a white lie"],"ans":"I told my mom I've been eating well. It was just a white lie so she wouldn't worry."},{"id":"c6","sit":"小組報告都是你做的，結果同學在老師面前說成是他的功勞。你跟朋友抱怨。","uses":["take credit for"],"ans":"I did all the research, and he took credit for it in front of the teacher."}]},"s01e03":{"title":"Come Fly with Me","lede":"Jay 只想安靜玩他的遙控飛機，偏偏 Phil 一直來湊熱鬧；Gloria 帶 Alex 去逛街打扮，Mitchell 則是第一次踏進 Costco。這集很多「被打擾、勉強配合、買太多」的說法。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Phil","plot":"Jay 想一個人享受玩遙控飛機的時光，Phil 卻興沖沖跟來，還想跟他當好朋友。","items":[{"p":"tag along","zh":"跟著去、跟屁蟲似地跟來","scene":"Phil 硬是要跟 Jay 一起去玩飛機。","en":"Mind if I tag along? I've never been to that night market.","tr":"我可以跟你們去嗎？我沒去過那個夜市。","tip":"<b>用法：</b>tag along with + 人，帶有「不請自來」的感覺。","th":2,"lv":1},{"p":"give it a shot","zh":"試試看","scene":"Phil 很想試著操控 Jay 的飛機。","en":"I've never surfed before, but I'll give it a shot.","tr":"我從來沒衝浪過，但我願意試試看。","tip":"<b>同義：</b>give it a try，語氣一樣輕鬆。","th":10,"lv":1},{"p":"leave someone alone","zh":"別煩某人、讓某人靜一靜","scene":"Jay 心裡只想說：拜託讓我一個人。","en":"Can you leave me alone for ten minutes? I need to think.","tr":"你可以讓我靜十分鐘嗎？我需要想一下。","tip":"<b>語氣：</b>Leave me alone! 說得又快又重就很兇，慢慢說是請求。","th":7,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Gloria · Alex","plot":"Gloria 帶 Alex 去商場，想說服很男孩子氣的她穿洋裝參加婚禮。","items":[{"p":"dress up","zh":"盛裝打扮","scene":"Gloria 想讓 Alex 為婚禮好好打扮一下。","en":"It's just dinner at home. You don't have to dress up.","tr":"只是在家吃晚餐，你不用特別打扮。","tip":"<b>對比：</b>dress up 是穿得正式；dress down 是穿得比較隨便。","th":8,"lv":1},{"p":"not my thing","zh":"不是我的菜、我不太喜歡","scene":"Alex 覺得洋裝和逛街完全不是她會喜歡的東西。","en":"Thanks, but karaoke isn't really my thing.","tr":"謝謝，但唱 KTV 不太是我的菜。","tip":"<b>用法：</b>委婉拒絕的好用說法，比 I don't like it 柔和。","th":7,"lv":1},{"p":"look good on someone","zh":"某人穿起來好看","scene":"Alex 試穿之後，Gloria 覺得這件很適合她。","en":"That jacket looks really good on you.","tr":"那件外套你穿起來很好看。","tip":"<b>注意：</b>主詞是衣服，It looks good on you。","th":8,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"一向嫌棄大賣場的 Mitchell 第一次跟 Cam 去 Costco，結果自己也愛上大量採購。","items":[{"p":"stock up on","zh":"囤貨、大量採買","scene":"兩人在 Costco 一口氣買了一大堆東西。","en":"We should stock up on water before the typhoon comes.","tr":"颱風來之前我們應該先囤一些水。","tip":"<b>搭配：</b>stock up on + 東西，常用在颱風、特價前。","th":8,"lv":1},{"p":"a good deal","zh":"划算、好價錢","scene":"大包裝的價格讓 Mitchell 越買越開心。","en":"Ten dollars for all of this? That's a good deal.","tr":"這些全部十塊？很划算耶。","tip":"<b>延伸：</b>What a deal! 好划算！","th":3,"lv":1},{"p":"get carried away","zh":"太投入而失控、玩過頭","scene":"Mitchell 一買就停不下來。","en":"I got a little carried away and bought five pairs of shoes.","tr":"我有點失控，買了五雙鞋。","tip":"<b>用法：</b>常說 I got carried away，承認自己太過頭。","th":9,"lv":1},{"p":"change one's mind","zh":"改變心意","scene":"Mitchell 原本嫌 Costco，逛完整個改觀。","en":"I was going to stay home, but I changed my mind.","tr":"我本來要待在家，但我改變主意了。","tip":"<b>對比：</b>have second thoughts 是開始猶豫；change your mind 是已經改了。","th":10,"lv":1}]}],"prompts":["你有沒有一次衝動買太多東西的經驗（用 stock up on、a good deal、get carried away）","有人硬要跟你去某個地方嗎（用 tag along、leave someone alone、give it a shot）","一件你原本不喜歡、後來改觀的事（用 not my thing、change one's mind、look good on someone）"],"challenges":[{"id":"c1","sit":"你週末要去逛 IKEA，室友問能不能跟，你答應他。","uses":["tag along"],"ans":"Sure, you can tag along. I'm just going to IKEA."},{"id":"c2","sit":"朋友約你去夜店，你委婉說那不是你的菜。","uses":["not my thing"],"ans":"Thanks, but clubbing isn't really my thing."},{"id":"c3","sit":"你在賣場一次買了一大堆泡麵，跟家人解釋說很划算，只是有點買過頭。","uses":["a good deal","get carried away"],"ans":"It was a good deal, but I guess I got a little carried away."},{"id":"c4","sit":"朋友在猶豫要不要買一件襯衫，你說他穿起來很好看，叫他試試看。","uses":["look good on someone","give it a shot"],"ans":"It looks good on you. Just give it a shot."}]},"s01e04":{"title":"The Incident","lede":"Jay 的前妻 Dede 回來了，上次她在婚禮上讓 Jay 和 Gloria 超丟臉；另一邊 Haley 的男友 Dylan 想帶她去演唱會，Phil 和 Claire 意見不合。這集是「舊帳、尷尬、場面失控」的說法大集合。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Dede · Mitchell","plot":"Mitchell 邀媽媽 Dede 來派對卻沒先告訴 Gloria，兩個女人一見面，場面立刻失控。","items":[{"p":"make a scene","zh":"當眾大吵大鬧、鬧場","scene":"大家都在擔心 Dede 又會在大家面前鬧事。","en":"Please don't make a scene. Let's talk about it at home.","tr":"拜託別在這裡鬧，我們回家再說。","tip":"<b>用法：</b>常說 Don't make a scene，叫人別在公共場合失控。","th":5,"lv":1},{"p":"get over it","zh":"釋懷、走出來、別再介意","scene":"婚禮那件事過了好幾個月，Gloria 還是很在意。","en":"It was just one bad test. You'll get over it.","tr":"只是一次考差而已，你會走出來的。","tip":"<b>語氣：</b>直接說 Get over it! 帶有「別再糾結了」的不耐煩。","th":6,"lv":1},{"p":"out of hand","zh":"失控","scene":"Dede 和 Gloria 一碰面，事情一發不可收拾。","en":"The party got out of hand and the neighbors called the police.","tr":"派對失控了，鄰居還報了警。","tip":"<b>搭配：</b>get out of hand 事情失控，常用在派對、爭吵。","th":9,"lv":1},{"p":"behind someone's back","zh":"背著某人、偷偷","scene":"Mitchell 沒先告訴 Gloria 就邀了 Dede。","en":"I can't believe you talked to my boss behind my back.","tr":"不敢相信你背著我去找我主管。","tip":"<b>畫面：</b>back 是背後，跟中文「背著」的畫面一樣。","th":5,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Dylan","plot":"Haley 想跟男友 Dylan 去演唱會，Claire 不放心，Phil 想當開明老爸；最後 Dylan 唱了一首寫給 Haley 的歌，內容讓爸媽傻眼。","items":[{"p":"be cool with","zh":"對某事沒意見、可以接受","scene":"Phil 想表現得很開明，說他對 Haley 去演唱會沒問題。","en":"Are you cool with me bringing a friend?","tr":"我帶個朋友去你 OK 嗎？","tip":"<b>用法：</b>I'm cool with that. 我沒問題，比 OK 更口語。","th":7,"lv":1},{"p":"put someone on the spot","zh":"讓人當場難堪、被點名措手不及","scene":"Dylan 當著全家人的面唱歌，大家都很尷尬。","en":"Sorry to put you on the spot, but can you say a few words?","tr":"抱歉突然點名你，可以說幾句話嗎？","tip":"<b>情境：</b>會議、聚會被突然叫起來講話時很常聽到。","th":4,"lv":2},{"p":"awkward","zh":"尷尬","scene":"Dylan 那首歌唱完，客廳一片尷尬。","en":"That was so awkward. Nobody laughed at his joke.","tr":"好尷尬，他的笑話沒人笑。","tip":"<b>發音：</b>AW-kwerd，第一音節重。也可以說 This is awkward. 來打破尷尬。","th":4,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Mitchell 夾在媽媽和繼母之間，Cam 在一旁看好戲。","items":[{"p":"stay out of it","zh":"別插手","scene":"Cam 提醒 Mitchell，媽媽和 Gloria 的事最好別管。","en":"This is between them. Just stay out of it.","tr":"這是他們之間的事，你就別插手了。","tip":"<b>對比：</b>stay out of trouble 是別惹麻煩。","th":5,"lv":1},{"p":"take sides","zh":"選邊站","scene":"Mitchell 不想在媽媽和 Gloria 之間選邊。","en":"I'm not taking sides. You're both my friends.","tr":"我不選邊，你們都是我朋友。","tip":"<b>延伸：</b>Whose side are you on? 你到底站哪邊？","th":5,"lv":1},{"p":"walk on eggshells","zh":"小心翼翼、如履薄冰","scene":"只要 Dede 在場，大家講話都得特別小心。","en":"Since the argument, everyone at home is walking on eggshells.","tr":"吵架之後，家裡每個人講話都小心翼翼。","tip":"<b>畫面：</b>走在蛋殼上，怕踩碎，形容氣氛緊繃。","th":5,"lv":2}]}],"prompts":["你遇過最尷尬的場面（用 awkward、put someone on the spot、make a scene）","朋友吵架時你會怎麼做（用 take sides、stay out of it、walk on eggshells）","一件事情慢慢失控的經驗（用 out of hand、behind someone's back、get over it）"],"challenges":[{"id":"c1","sit":"兩個室友為了誰該倒垃圾吵起來，都要你評評理，你說你不選邊，也不想插手。","uses":["take sides","stay out of it"],"ans":"I'm not taking sides. I'm staying out of it."},{"id":"c2","sit":"朋友在餐廳對店員大小聲，你叫他別在這裡鬧。","uses":["make a scene"],"ans":"Hey, don't make a scene. Let's just go."},{"id":"c3","sit":"主管開會時突然叫你上台報告，你事後跟同事說他害你超尷尬。","uses":["put someone on the spot","awkward"],"ans":"He totally put me on the spot. It was so awkward."},{"id":"c4","sit":"朋友失戀一個月了還在難過，你安慰他總會走出來的。","uses":["get over it"],"ans":"It takes time, but you'll get over it."}]},"s01e05":{"title":"Coal Digger","lede":"Manny 和 Luke 在學校打架，起因是 Manny 一直說自己是 Luke 的「舅舅」；接著 Claire 私下給 Gloria 取的難聽綽號被 Luke 說溜嘴，整個家族聚會差點翻臉，最後幾乎每個人都掉進了泳池。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Luke","plot":"Luke 不小心說出 Claire 私下給 Gloria 取的綽號，Claire 得想辦法收拾。","items":[{"p":"let it slip","zh":"說溜嘴","scene":"Luke 在大家面前把媽媽取的綽號講了出來。","en":"I didn't mean to tell her. I just let it slip.","tr":"我不是故意告訴她的，就不小心說溜嘴了。","tip":"<b>延伸：</b>It just slipped out. 不小心脫口而出。","th":10,"lv":1},{"p":"patch things up","zh":"和好、修補關係","scene":"Phil 努力當和事佬，想讓 Claire 和 Gloria 和好。","en":"They had a big fight, but they patched things up.","tr":"他們大吵一架，不過已經和好了。","tip":"<b>搭配：</b>patch things up with + 人。","th":6,"lv":2},{"p":"have a point","zh":"說得有道理","scene":"Phil 承認 Gloria 生氣其實有她的道理。","en":"Okay, you have a point. I should have called first.","tr":"好啦，你說得有道理，我應該先打電話的。","tip":"<b>用法：</b>讓步時很自然的說法。","th":7,"lv":1},{"p":"own up to","zh":"坦白承認（錯誤）","scene":"Claire 最後只能承認話是自己說的。","en":"If you broke it, just own up to it.","tr":"如果是你弄壞的，就老實承認吧。","tip":"<b>對比：</b>admit 比較正式，own up to 更口語。","th":10,"lv":2}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Gloria 一氣之下離開，Jay 夾在老婆和女兒之間；Gloria 開出條件：Claire 穿著衣服跳進泳池就原諒她。","items":[{"p":"storm off","zh":"氣沖沖地離開","scene":"Gloria 聽到綽號後轉身就走。","en":"He stormed off in the middle of the meeting.","tr":"他開會開到一半氣沖沖地走了。","tip":"<b>畫面：</b>storm 是暴風雨，形容人走得很兇。","th":5,"lv":2},{"p":"call someone names","zh":"罵人、取難聽的綽號","scene":"整件事的起點就是 Claire 給 Gloria 取了難聽的稱呼。","en":"Stop calling him names. It's not funny.","tr":"別再給他亂取綽號了，一點都不好笑。","tip":"<b>注意：</b>names 用複數，意思是難聽的稱呼。","th":5,"lv":1},{"p":"on one condition","zh":"有一個條件","scene":"Gloria 說要原諒 Claire 可以，但有一個條件。","en":"You can borrow my car on one condition: fill up the tank.","tr":"車可以借你，但有一個條件：油要加滿。","tip":"<b>用法：</b>先答應，再接 on one condition 開條件。","th":10,"lv":1}]},{"id":"kids","name":"孩子們","who":"Manny · Luke","plot":"Manny 跟 Luke 同年，卻堅持要當 Luke 的「舅舅」，兩人在學校打了起來。","items":[{"p":"pick a fight","zh":"挑釁、找人吵架","scene":"到底是誰先挑起這場架？","en":"He's always trying to pick a fight with me.","tr":"他老是想找我吵架。","tip":"<b>搭配：</b>pick a fight with + 人，吵架打架都能用。","th":5,"lv":1},{"p":"back off","zh":"退開、別逼人","scene":"Luke 受不了 Manny 一直用長輩的語氣說話。","en":"Back off, man. I said I'm not interested.","tr":"退開啦，我說了我沒興趣。","tip":"<b>語氣：</b>很直接，朋友間可以用，對陌生人會有點衝。","th":5,"lv":1},{"p":"jump in","zh":"跳進去；插話、加入","scene":"最後幾乎全家人都跳進了泳池。","en":"Can I jump in here? I have an idea.","tr":"我可以插一句嗎？我有個想法。","tip":"<b>延伸：</b>字面是跳進去，也常用在對話裡的「插話、加入」。","th":7,"lv":1}]}],"prompts":["你說溜嘴過什麼秘密（用 let it slip、own up to、patch things up）","朋友或家人吵架、有人氣沖沖離開的經驗（用 storm off、call someone names、have a point）","你答應別人但開了條件的一次（用 on one condition、back off、jump in）"],"challenges":[{"id":"c1","sit":"你不小心把同梯的退伍驚喜派對說出來了，跟其他人道歉。","uses":["let it slip"],"ans":"Sorry, guys. I let it slip. I didn't mean to."},{"id":"c2","sit":"室友弄壞你的耳機卻不承認，你叫他老實承認就好。","uses":["own up to"],"ans":"Just own up to it. I won't be mad."},{"id":"c3","sit":"弟弟要借你的機車，你說可以，但有一個條件。","uses":["on one condition"],"ans":"Okay, on one condition: bring it back with a full tank."},{"id":"c4","sit":"你跟朋友吵完架，隔天跟另一個朋友說你們已經和好了，而且他說得也有道理。","uses":["patch things up","have a point"],"ans":"We patched things up. Honestly, he had a point."}]},"s01e06":{"title":"Run for Your Wife","lede":"開學第一天，Jay 和 Gloria 為了 Manny 的穿著吵起來；Claire 只想好好喘口氣，Phil 卻一直打擾；Mitchell 和 Cam 為了 Lily 一件小事緊張得要命。這集是「早上手忙腳亂」的生活英文。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny","plot":"Manny 堅持穿得很正式去上學，Jay 擔心他被同學笑，Gloria 則支持他做自己。","items":[{"p":"fit in","zh":"融入、合群","scene":"Jay 希望 Manny 能跟其他孩子一樣，別太突兀。","en":"It took me a few months to fit in at my new job.","tr":"我在新工作花了幾個月才融入。","tip":"<b>對比：</b>stand out 是很突出，fit in 是融入大家。","th":2,"lv":1},{"p":"stand out","zh":"很突出、顯眼","scene":"Manny 的打扮在學校一定很顯眼。","en":"Wear something bright so you stand out in the photo.","tr":"穿亮一點的衣服，拍照才會顯眼。","tip":"<b>用法：</b>可以是正面（出色）也可以是負面（太突兀）。","th":9,"lv":1},{"p":"be yourself","zh":"做你自己","scene":"Gloria 覺得 Manny 不用為別人改變。","en":"Don't try so hard in the interview. Just be yourself.","tr":"面試別太刻意，做你自己就好。","tip":"<b>情境：</b>鼓勵別人時的萬用句，約會、面試都適用。","th":6,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"小孩開學了，Claire 終於有自己的時間，Phil 卻在家修東修西、一直來找她，樓梯那一階也還是沒修好。","items":[{"p":"me time","zh":"自己的時間","scene":"Claire 只想享受一點屬於自己的時間。","en":"The kids are asleep. Finally, some me time.","tr":"孩子們睡了，終於有點自己的時間了。","tip":"<b>用法：</b>口語名詞，也可以說 I need some me time.","th":8,"lv":1},{"p":"get on someone's nerves","zh":"讓人心煩","scene":"Phil 一直打擾，讓 Claire 越來越煩。","en":"His loud music is really getting on my nerves.","tr":"他的音樂很大聲，真的讓我很煩。","tip":"<b>延伸：</b>You're getting on my nerves. 你讓我很煩。","th":4,"lv":1},{"p":"put off","zh":"拖延、延後","scene":"Phil 說要修的樓梯一直拖著沒修。","en":"Stop putting off your homework. Just start it.","tr":"別再拖作業了，開始寫吧。","tip":"<b>搭配：</b>put off + V-ing，例如 put off going to the dentist。","th":10,"lv":1},{"p":"get around to","zh":"終於抽出時間去做","scene":"Phil 總說他會找時間修。","en":"I'll get around to cleaning my room this weekend.","tr":"我這週末會找時間整理房間。","tip":"<b>用法：</b>常說 I never got around to it. 一直沒空去做。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"Lily 發生一個小意外，兩個新手爸爸緊張到不行。","items":[{"p":"calm down","zh":"冷靜下來","scene":"兩人慌成一團，都在叫對方冷靜。","en":"Calm down. Let's figure out what happened first.","tr":"冷靜，我們先搞清楚發生什麼事。","tip":"<b>注意：</b>對很生氣的人說 Calm down 有時會火上加油，可以改說 Take a breath。","th":6,"lv":1},{"p":"panic","zh":"驚慌","scene":"一點小事就讓他們陷入恐慌。","en":"Don't panic. I have a spare key.","tr":"別慌，我有備用鑰匙。","tip":"<b>用法：</b>動詞和名詞都可以，I panicked. 我慌了。","th":4,"lv":1},{"p":"worst-case scenario","zh":"最壞的情況","scene":"Mitchell 腦中已經在想最壞的結果。","en":"Worst-case scenario, we just take the next bus.","tr":"最壞的情況，就搭下一班公車而已。","tip":"<b>用法：</b>放句首當開頭，很常用來安撫人。","th":10,"lv":1}]}],"prompts":["你剛入伍或剛換環境時怎麼融入（用 fit in、stand out、be yourself）","你一直拖延的一件事（用 put off、get around to、get on someone's nerves）","一次你很慌但其實沒事的經驗（用 panic、calm down、worst-case scenario）"],"challenges":[{"id":"c1","sit":"你連續加班一整週，週末只想一個人耍廢，跟家人說你需要自己的時間。","uses":["me time"],"ans":"I just need some me time today."},{"id":"c2","sit":"朋友趕高鐵快遲到了很緊張，你叫他冷靜，最壞的情況也只是改搭下一班。","uses":["calm down","worst-case scenario"],"ans":"Calm down. Worst-case scenario, you just take the next train."},{"id":"c3","sit":"表弟剛轉學，擔心自己跟新同學格格不入，你叫他做自己就好。","uses":["fit in","be yourself"],"ans":"Don't worry about fitting in. Just be yourself."},{"id":"c4","sit":"你一直拖著不去剪頭髮，跟朋友說你這週會找時間去。","uses":["put off","get around to"],"ans":"I keep putting it off, but I'll get around to it this week."}]},"s01e07":{"title":"En Garde","lede":"Manny 開始學擊劍，而且很有天分；Jay 為他驕傲的樣子，讓 Mitchell 想起小時候爸爸從沒這樣看過自己，兄妹倆也翻出了小時候的舊帳。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Manny 練擊劍表現亮眼，Jay 越看越得意。","items":[{"p":"be a natural","zh":"天生就很會","scene":"Manny 一拿起劍就展現天分。","en":"You've never played before? You're a natural!","tr":"你以前沒玩過？你根本是天生好手！","tip":"<b>用法：</b>a natural 當名詞，指天生好手。","th":9,"lv":1},{"p":"show promise","zh":"很有潛力","scene":"大家都覺得 Manny 很有前途。","en":"The new guy shows a lot of promise.","tr":"那個新人很有潛力。","tip":"<b>搭配：</b>show a lot of promise。","th":3,"lv":2},{"p":"brag about","zh":"炫耀、吹噓","scene":"Jay 忍不住到處炫耀 Manny 的表現。","en":"He always brags about his car.","tr":"他老是在炫耀他的車。","tip":"<b>對比：</b>show off 是做出來給人看；brag about 是用嘴巴講。","th":9,"lv":1},{"p":"be proud of","zh":"為某人感到驕傲","scene":"Jay 毫不掩飾他對 Manny 的驕傲。","en":"I'm so proud of you for finishing the race.","tr":"你跑完全程，我真以你為傲。","tip":"<b>用法：</b>I'm proud of you. 是最常聽到的鼓勵句。","th":6,"lv":1}]},{"id":"mitch","name":"Mitchell 和 Claire","who":"Mitchell · Claire · Jay","plot":"Mitchell 看到爸爸對 Manny 那麼驕傲，心裡很不是滋味，於是跟 Claire 算起小時候的帳。","items":[{"p":"hold a grudge","zh":"記仇","scene":"Mitchell 對小時候的事一直耿耿於懷。","en":"It was ten years ago. Don't hold a grudge.","tr":"那是十年前的事了，別再記仇了。","tip":"<b>搭配：</b>hold a grudge against + 人。","th":5,"lv":1},{"p":"bring up","zh":"提起（話題）","scene":"Mitchell 把多年前的事又拿出來講。","en":"Please don't bring up my ex at dinner.","tr":"吃飯時拜託別提我前任。","tip":"<b>延伸：</b>bring it up 提起這件事，常用在敏感話題。","th":10,"lv":1},{"p":"feel left out","zh":"覺得被冷落","scene":"Mitchell 覺得爸爸從沒這樣支持過自己。","en":"Everyone was speaking Japanese, so I felt left out.","tr":"大家都在講日文，我覺得被冷落了。","tip":"<b>延伸：</b>Don't leave me out. 別把我排除在外。","th":4,"lv":1},{"p":"jealous of","zh":"嫉妒","scene":"Mitchell 其實是有點嫉妒 Manny。","en":"Are you jealous of him?","tr":"你是在嫉妒他嗎？","tip":"<b>發音：</b>JEL-us，重音在前面。","th":4,"lv":1},{"p":"out of nowhere","zh":"突然、莫名其妙地冒出來","scene":"Claire 覺得 Mitchell 的指控來得莫名其妙。","en":"He just started yelling out of nowhere.","tr":"他莫名其妙突然大吼。","tip":"<b>用法：</b>come out of nowhere 突然出現。","th":9,"lv":1},{"p":"let it go","zh":"放下、算了","scene":"最後兄妹倆都得學著放下過去。","en":"It's not worth fighting about. Just let it go.","tr":"不值得為這個吵，算了吧。","tip":"<b>延伸：</b>《冰雪奇緣》的歌名，意思一樣是「放手」。","th":6,"lv":1}]}],"prompts":["一個你天生就很拿手的事（用 be a natural、show promise、be proud of）","你曾經覺得被冷落的經驗（用 feel left out、jealous of、hold a grudge）","一件你決定放下的事（用 let it go、bring up、out of nowhere）"],"challenges":[{"id":"c1","sit":"同梯第一次打靶就很準，你稱讚他是天生好手。","uses":["be a natural"],"ans":"You hit almost every target. You're a natural!"},{"id":"c2","sit":"朋友一直提他前女友，你叫他別再提了，放下吧。","uses":["bring up","let it go"],"ans":"Stop bringing her up. Just let it go."},{"id":"c3","sit":"大家出去玩沒找你，你跟朋友說你有點被冷落的感覺。","uses":["feel left out"],"ans":"You guys went without me. I kind of felt left out."},{"id":"c4","sit":"朋友老是在炫耀他的新手機，你問他是不是想讓大家嫉妒。","uses":["brag about","jealous of"],"ans":"Why do you keep bragging about your phone? You want us to be jealous of you?"}]},"s01e08":{"title":"Great Expectations","lede":"Phil 和 Claire 要慶祝結婚紀念日，Jay 留下來顧孫子們過夜；Mitchell 和 Cam 則和以前一起狂歡的老朋友重聚。每個人都對這一晚有很高的期待，結果都跟想像的不一樣。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"結婚紀念日到了，Phil 和 Claire 都對這晚有很高的期待。","items":[{"p":"big night","zh":"重要的一晚","scene":"紀念日晚上兩人都想好好過。","en":"Tonight's a big night. Don't be late.","tr":"今晚很重要，別遲到。","tip":"<b>用法：</b>big day 重要的日子，big night 重要的夜晚。","th":8,"lv":1},{"p":"set the mood","zh":"營造氣氛","scene":"Phil 想把這晚弄得很浪漫。","en":"I lit some candles to set the mood.","tr":"我點了蠟燭營造氣氛。","tip":"<b>搭配：</b>浪漫、派對、開會前的氣氛都可以用。","th":1,"lv":1},{"p":"high hopes","zh":"很高的期望","scene":"兩人對這晚都抱著很大的期待，結果不如預期。","en":"I had high hopes for that movie, but it was boring.","tr":"我對那部電影期望很高，結果很無聊。","tip":"<b>用法：</b>have high hopes for + 東西。","th":4,"lv":1},{"p":"live up to","zh":"達到（期望）","scene":"這一晚能不能符合大家的期待？","en":"The new phone didn't live up to the hype.","tr":"新手機沒有傳說中那麼好。","tip":"<b>搭配：</b>live up to expectations、live up to the hype。","th":10,"lv":1}]},{"id":"jay","name":"Jay 和孫子們","who":"Jay · Haley · Alex · Luke","plot":"Jay 留下來顧三個孫子過夜，想當個讓孩子們喜歡的爺爺。","items":[{"p":"babysit","zh":"照顧小孩","scene":"Jay 今晚負責顧孫子。","en":"Can you babysit my son on Saturday?","tr":"你星期六可以幫我顧兒子嗎？","tip":"<b>延伸：</b>babysitter 保母。","th":2,"lv":1},{"p":"stay up late","zh":"熬夜、晚睡","scene":"孩子們趁爺爺在，想晚點睡。","en":"Don't stay up late. You have work tomorrow.","tr":"別熬夜，你明天要上班。","tip":"<b>對比：</b>stay up 是不睡；wake up 是醒來。","th":8,"lv":1},{"p":"spoil","zh":"寵壞","scene":"爺爺當然會寵孫子。","en":"Grandparents always spoil their grandkids.","tr":"爺爺奶奶總是寵孫子。","tip":"<b>延伸：</b>spoiled kid 被寵壞的小孩。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"兩人和以前一起狂歡的老朋友見面，才發現自己的生活早就不一樣了。","items":[{"p":"catch up","zh":"敘舊、聊近況","scene":"老朋友見面，當然要好好聊聊近況。","en":"Let's grab coffee and catch up.","tr":"我們去喝杯咖啡聊聊近況吧。","tip":"<b>對比：</b>keep up with 是跟上；catch up 單用常是「敘舊」。","th":2,"lv":1},{"p":"back in the day","zh":"想當年、以前","scene":"他們回憶起以前一起玩的日子。","en":"Back in the day, we used to go out every weekend.","tr":"想當年我們每個週末都出去玩。","tip":"<b>語氣：</b>帶點懷舊感，常用來講年輕時的事。","th":7,"lv":2},{"p":"grow apart","zh":"漸行漸遠","scene":"他們發現自己和老朋友越來越不一樣了。","en":"We were best friends in high school, but we grew apart.","tr":"我們高中是最好的朋友，後來漸行漸遠。","tip":"<b>用法：</b>朋友、情侶都可以用。","th":2,"lv":1}]}],"prompts":["你最近一次跟老朋友敘舊（用 catch up、back in the day、grow apart）","一件你期望很高、結果不如預期的事（用 high hopes、live up to、big night）","小時候爺爺奶奶怎麼寵你（用 spoil、babysit、stay up late）"],"challenges":[{"id":"c1","sit":"週末在捷運上遇到國中同學，你說要找時間喝咖啡聊聊近況。","uses":["catch up"],"ans":"We should grab coffee and catch up sometime."},{"id":"c2","sit":"你排隊排很久的網紅餐廳結果很普通，跟朋友抱怨。","uses":["high hopes","live up to"],"ans":"I had high hopes, but it didn't live up to the hype."},{"id":"c3","sit":"你跟朋友說你們國中時常常熬夜打電動。","uses":["back in the day","stay up late"],"ans":"Back in the day, we used to stay up late playing video games."},{"id":"c4","sit":"表哥問你能不能幫忙顧他兒子，你說可以，但你一定會寵壞他。","uses":["babysit","spoil"],"ans":"Sure, I can babysit. But I'm going to spoil him."}]},"s01e09":{"title":"Fizbo","lede":"Luke 的生日派對一路出包，最後還摔斷手進了急診室；Cam 換上他的小丑分身 Fizbo 登場；Manny 照 Jay 的建議追女生，結果沒那麼順利。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Luke","plot":"Phil 和 Claire 為 Luke 辦生日派對，結果狀況百出，最後 Luke 摔斷手。","items":[{"p":"go wrong","zh":"出差錯","scene":"派對上什麼都不對勁。","en":"Everything that could go wrong went wrong.","tr":"能出錯的全都出錯了。","tip":"<b>用法：</b>What went wrong? 哪裡出問題了？","th":10,"lv":1},{"p":"throw a party","zh":"辦派對","scene":"爸媽幫 Luke 辦生日派對。","en":"We're throwing a party for Mom's 60th birthday.","tr":"我們要幫媽媽辦六十歲生日派對。","tip":"<b>注意：</b>辦派對用 throw，不是 do。","th":8,"lv":1},{"p":"in one piece","zh":"完好無缺、平安無事","scene":"爸媽只希望 Luke 能毫髮無傷撐過這一天。","en":"Don't worry, I'll bring your car back in one piece.","tr":"別擔心，我會把你的車完好還你。","tip":"<b>用法：</b>常說 back in one piece，強調平安。","th":9,"lv":2},{"p":"long story short","zh":"長話短說","scene":"要解釋怎麼會進急診室，得說很久。","en":"Long story short, we missed the flight.","tr":"長話短說，我們沒趕上飛機。","tip":"<b>延伸：</b>It's a long story. 說來話長。","th":7,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Cameron · Mitchell","plot":"Cam 打扮成他的小丑角色 Fizbo 來表演，Mitchell 其實不太想看到這一面。","items":[{"p":"stay in character","zh":"一直入戲","scene":"Cam 一扮成 Fizbo 就完全入戲。","en":"Even when the kids pulled his nose, he stayed in character.","tr":"就算小朋友拉他鼻子，他還是很入戲。","tip":"<b>對比：</b>break character 是出戲。","th":8,"lv":2},{"p":"steal the show","zh":"搶盡風頭","scene":"Fizbo 一出場就成了派對焦點。","en":"The little girl stole the show with her dance.","tr":"那個小女孩的舞蹈搶盡風頭。","tip":"<b>情境：</b>表演、婚禮、派對最常用。","th":9,"lv":2},{"p":"a hit","zh":"大受歡迎的東西","scene":"小丑表演大受孩子們歡迎。","en":"Your cookies were a big hit at the party.","tr":"你的餅乾在派對上超受歡迎。","tip":"<b>延伸：</b>a big hit 很紅、很受歡迎。","th":9,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Manny","plot":"Manny 想吸引一個女生，聽了 Jay 的建議，結果沒那麼順利。","items":[{"p":"play it cool","zh":"裝酷、表現得不在乎","scene":"Jay 教 Manny 別太積極，要裝得冷靜一點。","en":"If you see her, just play it cool.","tr":"如果看到她，表現得冷靜一點。","tip":"<b>用法：</b>約會、面試前常被這樣提醒。","th":10,"lv":1},{"p":"try too hard","zh":"太刻意、用力過猛","scene":"Manny 太想表現，反而有點用力過猛。","en":"He's nice, but he tries too hard to be funny.","tr":"他人很好，但太努力想搞笑了。","tip":"<b>語氣：</b>形容人刻意討好，略帶負面。","th":9,"lv":1},{"p":"make a move","zh":"主動出擊、採取行動","scene":"Manny 猶豫要不要主動接近那個女生。","en":"If you like her, you should make a move.","tr":"如果你喜歡她，就主動一點。","tip":"<b>用法：</b>約會語境中常指主動追求。","th":1,"lv":1}]}],"prompts":["你辦過或參加過最失控的派對（用 throw a party、go wrong、long story short）","你看過最搶戲的人（用 steal the show、a hit、stay in character）","追人時你會主動還是裝酷（用 make a move、play it cool、try too hard）"],"challenges":[{"id":"c1","sit":"你跟朋友說上次去墾丁發生一連串倒楣事，長話短說就是錢包掉了。","uses":["long story short"],"ans":"Long story short, I lost my wallet."},{"id":"c2","sit":"朋友想約喜歡的女生，你叫他主動一點，但別太刻意。","uses":["make a move","try too hard"],"ans":"Make a move, but don't try too hard."},{"id":"c3","sit":"大學同學借你的相機去日本旅行，你提醒他要完好地還你。","uses":["in one piece"],"ans":"Please bring it back in one piece."},{"id":"c4","sit":"連上同樂會你同梯的表演大受歡迎，搶盡了風頭。","uses":["a hit","steal the show"],"ans":"His performance was a hit. He totally stole the show."}]},"s01e10":{"title":"Undeck the Halls","lede":"沙發上出現一個菸頭燒痕，Phil 和 Claire 威脅孩子們不招就取消聖誕節；Alex 為了救聖誕節出面頂罪，但其實根本不是孩子們弄的。Mitchell 和 Cam 則第一次帶 Lily 去跟聖誕老人拍照。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire · Haley · Alex · Luke","plot":"沙發被燒了一個洞，爸媽要孩子們自首，否則今年沒有聖誕節。","items":[{"p":"come clean","zh":"坦白、說實話","scene":"爸媽要犯人自己站出來說實話。","en":"I have to come clean. I ate your cake.","tr":"我要坦白，你的蛋糕是我吃的。","tip":"<b>對比：</b>own up to 是承認錯誤；come clean 是把隱瞞的事說出來。","th":10,"lv":1},{"p":"take the blame","zh":"背黑鍋、扛下責任","scene":"Alex 為了救聖誕節，自己出來頂罪。","en":"I took the blame so my brother wouldn't get in trouble.","tr":"我幫弟弟扛下責任，讓他不被罵。","tip":"<b>對比：</b>take credit 是攬功勞，take the blame 是扛罪。","th":5,"lv":1},{"p":"get in trouble","zh":"惹上麻煩、被罵","scene":"孩子們都怕被處罰。","en":"If Mom finds out, we're going to get in trouble.","tr":"如果媽媽發現，我們就慘了。","tip":"<b>用法：</b>小孩被罵、員工被老闆念都能用。","th":5,"lv":1},{"p":"call off","zh":"取消","scene":"爸媽威脅要取消聖誕節。","en":"They called off the game because of the rain.","tr":"因為下雨，比賽取消了。","tip":"<b>對比：</b>cancel 比較正式；call off 很口語。","th":10,"lv":1},{"p":"I mean it","zh":"我是認真的","scene":"Claire 強調她不是在開玩笑。","en":"Clean your room tonight. I mean it.","tr":"今晚把房間整理好，我是認真的。","tip":"<b>語氣：</b>放在句尾，加重語氣。","th":7,"lv":1},{"p":"point fingers","zh":"互相指責、怪罪別人","scene":"孩子們開始互相推給對方。","en":"Let's stop pointing fingers and fix the problem.","tr":"別再互相怪罪了，先解決問題。","tip":"<b>搭配：</b>point fingers at + 人。","th":5,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人第一次帶 Lily 去跟聖誕老人合照，想留下完美的紀念。","items":[{"p":"once in a lifetime","zh":"一生一次、千載難逢","scene":"寶寶第一張聖誕照片，對他們來說意義重大。","en":"This trip is a once-in-a-lifetime chance.","tr":"這次旅行是千載難逢的機會。","tip":"<b>用法：</b>當形容詞時加連字號 once-in-a-lifetime。","th":9,"lv":1},{"p":"wait in line","zh":"排隊","scene":"想跟聖誕老人拍照，得排很久的隊。","en":"We waited in line for an hour for the new ramen place.","tr":"我們為了那間新拉麵店排了一個小時。","tip":"<b>對比：</b>英式英文說 queue，美式說 wait in line。","th":8,"lv":1},{"p":"say cheese","zh":"拍照時說「笑一個」","scene":"拍照時大家都要說 cheese。","en":"Okay, everyone, say cheese!","tr":"好，大家說 cheese！","tip":"<b>原因：</b>唸 cheese 時嘴角會自然上揚。","th":8,"lv":1},{"p":"worth it","zh":"值得","scene":"排了那麼久只為一張照片，到底值不值得？","en":"It was expensive, but totally worth it.","tr":"很貴，但完全值得。","tip":"<b>延伸：</b>Is it worth it? 值得嗎？","th":7,"lv":1}]}],"prompts":["你小時候幫別人背過黑鍋嗎（用 take the blame、get in trouble、come clean）","你排過最久的隊是為了什麼（用 wait in line、worth it、once in a lifetime）","一個被取消的活動（用 call off、point fingers、I mean it）"],"challenges":[{"id":"c1","sit":"寢室的燈被弄壞了，大家互相推，你叫大家別再互相指責。","uses":["point fingers"],"ans":"Let's stop pointing fingers and just report it."},{"id":"c2","sit":"你承認是你偷吃了室友的零食。","uses":["come clean"],"ans":"Okay, I'll come clean. I ate your snacks."},{"id":"c3","sit":"因為颱風，你們的綠島行程取消了，你跟朋友說。","uses":["call off"],"ans":"Our trip got called off because of the typhoon."},{"id":"c4","sit":"你排了兩小時買演唱會票，跟朋友說雖然累但很值得。","uses":["wait in line","worth it"],"ans":"I waited in line for two hours, but it was worth it."}]},"s01e11":{"title":"Up All Night","lede":"Manny 的親生爸爸 Javier 來訪，Jay 覺得自己被比下去；Phil 突然進了醫院；Mitchell 和 Cam 則為了該怎麼哄 Lily 睡覺吵了起來。整集都在熬夜和等待。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria · Manny · Javier","plot":"帥氣又愛玩的 Javier 帶 Manny 出去，Jay 在家等到半夜，心裡很不是滋味。","items":[{"p":"wait up","zh":"熬夜等某人回家","scene":"Jay 熬夜等 Manny 回家。","en":"Don't wait up. I'll be home late.","tr":"不用等我，我會很晚回家。","tip":"<b>用法：</b>Don't wait up. 是出門前很常說的一句。","th":2,"lv":1},{"p":"show up","zh":"出現、現身","scene":"Javier 一出現，Manny 就超興奮。","en":"He showed up two hours late.","tr":"他遲到兩小時才出現。","tip":"<b>對比：</b>show off 是炫耀，show up 是出現。","th":10,"lv":1},{"p":"keep someone posted","zh":"隨時告知最新狀況","scene":"Jay 希望至少有人通知他現在到哪了。","en":"I'm not sure what time I'll arrive. I'll keep you posted.","tr":"我不確定幾點到，有消息會跟你說。","tip":"<b>延伸：</b>Keep me posted. 有消息再跟我說。","th":7,"lv":1},{"p":"up all night","zh":"整晚沒睡","scene":"這集標題就是一整晚沒睡。","en":"I was up all night studying for the exam.","tr":"我整晚沒睡在準備考試。","tip":"<b>對比：</b>stay up late 是晚睡；up all night 是整晚沒睡。","th":8,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"Phil 突然身體不舒服，被送進醫院，Claire 在旁邊陪著。","items":[{"p":"under the weather","zh":"身體不太舒服","scene":"Phil 一開始只覺得有點不對勁。","en":"I'm feeling a little under the weather today.","tr":"我今天有點不太舒服。","tip":"<b>語氣：</b>比 sick 更委婉，請假時很好用。","th":8,"lv":2},{"p":"hang in there","zh":"撐下去、加油","scene":"Claire 在醫院陪 Phil，要他撐著點。","en":"Hang in there. The weekend is almost here.","tr":"撐著點，快到週末了。","tip":"<b>用法：</b>安慰正在辛苦的人。","th":6,"lv":1},{"p":"on edge","zh":"緊張、焦躁","scene":"在醫院等待讓人很緊張。","en":"Everyone was on edge before the results came out.","tr":"結果出來前大家都很緊張。","tip":"<b>延伸：</b>It puts me on edge. 讓我很緊張。","th":4,"lv":2}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron · Lily","plot":"兩人為了要不要讓 Lily 哭到自己睡著吵起來，誰都不肯讓步。","items":[{"p":"cry it out","zh":"讓寶寶哭到自己睡（育兒法）","scene":"一個想讓 Lily 自己哭，一個捨不得。","en":"Some parents let their babies cry it out.","tr":"有些父母會讓寶寶哭到自己睡著。","tip":"<b>延伸：</b>Just cry it out. 也可以是「痛快哭一場吧」。","th":2,"lv":2},{"p":"give in","zh":"讓步、屈服","scene":"最後到底是誰先受不了去抱 Lily？","en":"He kept asking until I finally gave in.","tr":"他一直求，我最後只好讓步了。","tip":"<b>搭配：</b>give in to + 人或要求。","th":10,"lv":1},{"p":"stick to","zh":"堅持（計畫、規則）","scene":"他們說好要堅持計畫。","en":"We need to stick to the plan.","tr":"我們必須照計畫來。","tip":"<b>延伸：</b>stick to your guns 堅持立場。","th":10,"lv":1}]}],"prompts":["你整晚沒睡的一次經驗（用 up all night、wait up、on edge）","你在部隊身體不舒服的時候（用 under the weather、hang in there、keep someone posted）","你最難堅持的一個習慣（用 stick to、give in、show up）"],"challenges":[{"id":"c1","sit":"你跟媽媽說今天公司聚餐會很晚到家，叫她不用等你。","uses":["wait up"],"ans":"Don't wait up, Mom. I'll be back late."},{"id":"c2","sit":"你跟班長說你今天有點不舒服。","uses":["under the weather"],"ans":"I'm feeling a little under the weather today."},{"id":"c3","sit":"朋友在準備考試很累，你叫他撐著點，有消息隨時跟你說。","uses":["hang in there","keep someone posted"],"ans":"Hang in there, and keep me posted."},{"id":"c4","sit":"你決定要少滑手機，但每次都撐不住。","uses":["stick to","give in"],"ans":"I try to stick to my plan, but I always give in."}]},"s01e12":{"title":"Not in My House","lede":"Jay 買了一座真人大小的狗管家雕像，Gloria 堅決反對擺在家裡；Claire 以為 Luke 在看不該看的照片而大驚小怪，結果那些照片其實是傳給 Phil 的；Mitchell 則不滿 Cam 太愛幫別人。","stories":[{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 很愛那座狗管家雕像，Gloria 卻覺得醜到不行，不准擺在家。","items":[{"p":"over my dead body","zh":"除非我死了（絕不同意）","scene":"Gloria 的態度就是：想擺在家裡？門都沒有。","en":"You want to sell my car? Over my dead body.","tr":"你想賣我的車？除非我死了。","tip":"<b>語氣：</b>誇張但很常用，表示強烈反對。","th":7,"lv":2},{"p":"no way","zh":"不可能、門都沒有","scene":"Gloria 一看到雕像就說絕對不行。","en":"No way! I'm not wearing that.","tr":"不可能！我才不穿那個。","tip":"<b>延伸：</b>No way! 也可以表示驚訝「不會吧！」","th":7,"lv":1},{"p":"grow on someone","zh":"越看越喜歡","scene":"Jay 覺得 Gloria 看久了就會喜歡。","en":"I didn't like the song at first, but it grew on me.","tr":"這首歌一開始我不喜歡，但越聽越喜歡。","tip":"<b>用法：</b>主詞是東西，It grows on you。","th":9,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil · Luke","plot":"Claire 發現不雅照片，以為是 Luke 在看，緊張得要命，結果真相讓她更尷尬。","items":[{"p":"jump to conclusions","zh":"太快下結論","scene":"Claire 沒問清楚就認定是 Luke。","en":"Don't jump to conclusions. Let him explain first.","tr":"別急著下結論，先讓他解釋。","tip":"<b>用法：</b>常用在勸人冷靜、別誤會。","th":10,"lv":1},{"p":"have a talk","zh":"好好談一談","scene":"Claire 決定要跟 Luke 好好談談。","en":"We need to have a talk about your grades.","tr":"我們得好好談談你的成績。","tip":"<b>語氣：</b>We need to talk. 常讓人緊張，代表有嚴肅的事。","th":2,"lv":1},{"p":"turn out","zh":"結果是、原來","scene":"結果照片根本不是 Luke 的。","en":"It turns out he was right all along.","tr":"結果他從頭到尾都是對的。","tip":"<b>用法：</b>It turns out (that)…，講意外的真相時很常用。","th":10,"lv":1}]},{"id":"mitch","name":"Mitchell 家","who":"Mitchell · Cameron","plot":"Cam 太熱心幫朋友，Mitchell 覺得他老是被別人佔便宜。","items":[{"p":"take advantage of","zh":"佔便宜、利用","scene":"Mitchell 覺得大家都在利用 Cam 的好心。","en":"Don't let them take advantage of you.","tr":"別讓他們佔你便宜。","tip":"<b>正面用法：</b>take advantage of the sale 好好利用特價。","th":5,"lv":1},{"p":"say no","zh":"拒絕","scene":"Cam 就是不懂得拒絕別人。","en":"You need to learn to say no.","tr":"你得學會拒絕。","tip":"<b>延伸：</b>I can't say no to her. 我沒辦法拒絕她。","th":10,"lv":1},{"p":"go out of one's way","zh":"特地、費心","scene":"Cam 總是特地為朋友付出。","en":"She went out of her way to help me move.","tr":"她特地來幫我搬家。","tip":"<b>用法：</b>強調對方多花了心力，常用來道謝。","th":6,"lv":2},{"p":"a pushover","zh":"好說話、容易被吃定的人","scene":"Mitchell 擔心 Cam 被大家吃得死死的。","en":"My dad is a pushover. He always says yes.","tr":"我爸很好說話，什麼都說好。","tip":"<b>延伸：</b>Don't be a pushover. 別當濫好人。","th":9,"lv":2}]}],"prompts":["你很難拒絕別人的經驗（用 say no、a pushover、take advantage of）","一件你一開始不喜歡、後來越來越喜歡的東西（用 grow on someone、no way、turn out）","你曾經誤會別人的一次（用 jump to conclusions、have a talk、go out of one's way）"],"challenges":[{"id":"c1","sit":"室友想把他的舊沙發擺進你房間，你說除非我死了。","uses":["over my dead body"],"ans":"Your old couch in my room? Over my dead body."},{"id":"c2","sit":"朋友以為你在生他的氣，你叫他別太快下結論。","uses":["jump to conclusions"],"ans":"Don't jump to conclusions. I'm just tired."},{"id":"c3","sit":"同事特地繞路載你去高鐵站，你謝謝他。","uses":["go out of one's way"],"ans":"Thanks for going out of your way to drive me."},{"id":"c4","sit":"同事老是把他的工作丟給你做，朋友叫你學會拒絕，別讓他佔便宜。","uses":["say no","take advantage of"],"ans":"You need to say no. He's taking advantage of you."}]},"s01e13":{"title":"Fifteen Percent","lede":"Jay 和 Mitchell 聊到一位朋友可能是同志，Jay 急著證明自己心胸很開放；Claire 跟家裡新的電視遙控器奮戰；Manny 則要跟女生第一次見面約會。","stories":[{"id":"jay","name":"Jay 和 Mitchell","who":"Jay · Mitchell","plot":"Jay 嘴上說自己完全不介意，Mitchell 卻覺得爸爸心裡還是有點彆扭。","items":[{"p":"open-minded","zh":"心胸開放","scene":"Jay 一直強調自己很開明。","en":"My grandma is surprisingly open-minded.","tr":"我奶奶出乎意料地開明。","tip":"<b>反義：</b>narrow-minded 心胸狹窄。","th":9,"lv":1},{"p":"be okay with","zh":"能接受、不介意","scene":"Jay 想證明他對這件事完全沒問題。","en":"Are you okay with eating spicy food?","tr":"你可以吃辣嗎？","tip":"<b>用法：</b>Is that okay with you? 你可以嗎？","th":7,"lv":1},{"p":"deep down","zh":"內心深處、其實","scene":"Mitchell 覺得爸爸內心深處還是有點不自在。","en":"He acts tough, but deep down he's really sweet.","tr":"他裝得很兇，但其實人很好。","tip":"<b>用法：</b>放句首，講一個人真正的想法。","th":4,"lv":1},{"p":"come out","zh":"出櫃；公開","scene":"這集談到有人向朋友出櫃。","en":"He came out to his family last year.","tr":"他去年向家人出櫃。","tip":"<b>延伸：</b>The truth came out. 真相大白。","th":2,"lv":2}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Phil 買了新的萬用遙控器，Claire 不服輸，決定自己學會怎麼用。","items":[{"p":"get the hang of","zh":"抓到訣竅、上手","scene":"Claire 一開始完全搞不懂遙控器。","en":"It's hard at first, but you'll get the hang of it.","tr":"一開始很難，但你會上手的。","tip":"<b>用法：</b>get the hang of it 是最常見的說法。","th":10,"lv":1},{"p":"how hard can it be","zh":"能有多難？","scene":"Claire 一開始覺得這有什麼難的。","en":"It's just a remote. How hard can it be?","tr":"只是個遙控器，能有多難？","tip":"<b>語氣：</b>常在事情變得很難之前說，有點立 flag 的感覺。","th":7,"lv":1},{"p":"give up","zh":"放棄","scene":"Claire 卡關卡到想放棄。","en":"Don't give up now. You're almost there.","tr":"現在別放棄，你快成功了。","tip":"<b>延伸：</b>I give up. 我投降了。","th":10,"lv":1}]},{"id":"manny","name":"Manny 的約會","who":"Manny · Jay","plot":"Manny 要跟女生第一次見面，緊張又期待。","items":[{"p":"hit it off","zh":"一見如故、很合得來","scene":"Manny 希望跟對方一見面就聊得來。","en":"We met at a party and hit it off right away.","tr":"我們在派對上認識，馬上就很聊得來。","tip":"<b>搭配：</b>hit it off with + 人。","th":2,"lv":2},{"p":"make a good first impression","zh":"留下好的第一印象","scene":"Manny 很在意第一次見面的表現。","en":"Wear a nice shirt. You want to make a good first impression.","tr":"穿件好看的襯衫，你會想留下好的第一印象。","tip":"<b>延伸：</b>First impressions matter. 第一印象很重要。","th":10,"lv":1},{"p":"butterflies in my stomach","zh":"心裡小鹿亂撞、緊張","scene":"見面前 Manny 緊張到胃裡像有蝴蝶在飛。","en":"I always get butterflies in my stomach before a date.","tr":"我約會前總是很緊張。","tip":"<b>畫面：</b>肚子裡有蝴蝶在飛，形容緊張又興奮。","th":4,"lv":2}]}],"prompts":["一個你身邊很開明的長輩（用 open-minded、be okay with、deep down）","你學一個新東西從不會到上手的過程（用 get the hang of、how hard can it be、give up）","你第一次跟某人見面就很聊得來的經驗（用 hit it off、make a good first impression、butterflies in my stomach）"],"challenges":[{"id":"c1","sit":"朋友第一次學滑板一直摔，很挫折，你說他很快就會上手，別放棄。","uses":["get the hang of","give up"],"ans":"Don't give up. You'll get the hang of it soon."},{"id":"c2","sit":"你跟朋友說你跟交友軟體上認識的女生第一次見面就很聊得來。","uses":["hit it off"],"ans":"We hit it off right away."},{"id":"c3","sit":"朋友問你能不能吃辣，你說可以。","uses":["be okay with"],"ans":"Yeah, I'm okay with spicy food."},{"id":"c4","sit":"要去見女朋友的爸媽，你跟朋友說你超緊張，很想留下好印象。","uses":["butterflies in my stomach","make a good first impression"],"ans":"I've got butterflies in my stomach. I really want to make a good first impression."}]},"s01e14":{"title":"Moon Landing","lede":"Jay 和 Cam 在健身房發生一段尷尬的誤會；Claire 以前的同事來訪，讓她重新想起自己放下的職場人生；Gloria 出了小車禍，Mitchell 當起她的律師。","stories":[{"id":"jay","name":"Jay 和 Cam","who":"Jay · Cameron","plot":"兩人在健身房碰面，一個誤會讓場面變得超級尷尬。","items":[{"p":"work out","zh":"健身、運動","scene":"Jay 和 Cam 在健身房碰到。","en":"I try to work out three times a week.","tr":"我盡量一週運動三次。","tip":"<b>延伸：</b>It worked out. 也可以是「事情順利解決了」。","th":8,"lv":1},{"p":"get the wrong idea","zh":"誤會","scene":"一個小動作讓旁人想歪了。","en":"Don't get the wrong idea. We're just friends.","tr":"別誤會，我們只是朋友。","tip":"<b>用法：</b>常用 Don't get the wrong idea. 先澄清。","th":7,"lv":1}]},{"id":"dunphy","name":"Dunphy 家","who":"Claire · Phil","plot":"Claire 以前的同事來家裡作客，她看著對方的事業，開始想像自己沒當全職媽媽的人生。","items":[{"p":"keep in touch","zh":"保持聯絡","scene":"Claire 和老同事多年後又聯絡上。","en":"It was great seeing you. Let's keep in touch.","tr":"很高興見到你，我們保持聯絡。","tip":"<b>延伸：</b>Stay in touch. 意思一樣。","th":2,"lv":1},{"p":"stay-at-home mom","zh":"全職媽媽","scene":"Claire 為了家庭成為全職媽媽。","en":"My mom was a stay-at-home mom until I was ten.","tr":"我媽在我十歲之前都是全職媽媽。","tip":"<b>延伸：</b>stay-at-home dad 全職爸爸。","th":2,"lv":1},{"p":"have it all","zh":"什麼都擁有（事業家庭兩得意）","scene":"Claire 好奇自己能不能事業家庭兩頭兼顧。","en":"She has a great job and a happy family. She has it all.","tr":"她工作好、家庭也幸福，什麼都有了。","tip":"<b>延伸：</b>Can you have it all? 魚與熊掌能兼得嗎？","th":9,"lv":2},{"p":"look up to","zh":"尊敬、景仰","scene":"以前的同事曾經很崇拜 Claire。","en":"I've always looked up to my older brother.","tr":"我一直很崇拜我哥。","tip":"<b>反義：</b>look down on 看不起。","th":2,"lv":1}]},{"id":"mitch","name":"Mitchell 和 Gloria","who":"Mitchell · Gloria","plot":"Gloria 出了一場小擦撞，Mitchell 自告奮勇幫她處理，努力站在她這邊。","items":[{"p":"fender bender","zh":"小擦撞","scene":"Gloria 開車發生了小車禍。","en":"I was late because of a fender bender on the highway.","tr":"我遲到是因為高速公路上有小擦撞。","tip":"<b>字面：</b>fender 是車子擋泥板，小車禍的口語說法。","th":8,"lv":2},{"p":"my fault","zh":"我的錯","scene":"到底是誰的錯，雙方各說各話。","en":"Sorry, that's my fault. I forgot to tell you.","tr":"抱歉，是我的錯，我忘了跟你說。","tip":"<b>延伸：</b>It's not your fault. 不是你的錯。","th":6,"lv":1},{"p":"have someone's back","zh":"挺某人、當某人的後盾","scene":"Mitchell 決定挺 Gloria 到底。","en":"Don't worry, I've got your back.","tr":"別擔心，我挺你。","tip":"<b>用法：</b>I've got your back. 朋友間超常用。","th":6,"lv":1},{"p":"stand up for","zh":"為某人或某事挺身而出","scene":"Mitchell 在對方面前替 Gloria 說話。","en":"You have to stand up for yourself.","tr":"你要替自己發聲。","tip":"<b>對比：</b>stand up to 是對抗某人；stand up for 是支持、捍衛。","th":6,"lv":1}]}],"prompts":["你最崇拜的人（用 look up to、have it all、keep in touch）","你遇過的小意外（用 fender bender、my fault、get the wrong idea）","一個挺你到底的朋友（用 have someone's back、stand up for、work out）"],"challenges":[{"id":"c1","sit":"同事被主管誤會，你跟他說你挺他，會幫他說話。","uses":["have someone's back","stand up for"],"ans":"I've got your back. I'll stand up for you."},{"id":"c2","sit":"你忘了幫室友簽假單，跟他道歉說是你的錯。","uses":["my fault"],"ans":"Sorry, that's my fault. I forgot."},{"id":"c3","sit":"你和女生朋友去吃飯被同學看到，你說別誤會，我們只是朋友。","uses":["get the wrong idea"],"ans":"Don't get the wrong idea. We're just friends."},{"id":"c4","sit":"退伍前跟同梯說以後要保持聯絡。","uses":["keep in touch"],"ans":"Let's keep in touch after we get out."}]},"s01e15":{"title":"My Funky Valentine","lede":"Phil 和 Claire 想讓情人節多點火花，玩起陌生人搭訕的角色扮演；Manny 在學校被欺負，Mitchell 和 Cam 出手幫忙；Jay 和 Gloria 去看單口喜劇。滿滿的約會和玩笑話。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Claire","plot":"兩人在飯店酒吧假裝成陌生人互相搭訕，結果 Claire 的風衣卡在手扶梯上。","items":[{"p":"spice things up","zh":"增加情趣、讓生活更有趣","scene":"結婚多年，兩人想讓情人節多點新鮮感。","en":"We tried a new restaurant to spice things up.","tr":"我們試了一家新餐廳，增加點新鮮感。","tip":"<b>用法：</b>感情、工作、無聊的日常都可以用。","th":1,"lv":2},{"p":"role-play","zh":"角色扮演","scene":"兩人假裝是第一次見面的陌生人。","en":"Let's role-play the job interview before tomorrow.","tr":"我們明天之前先模擬一下面試吧。","tip":"<b>延伸：</b>練習口說時也很常用 role-play。","th":8,"lv":1},{"p":"get stuck","zh":"被卡住","scene":"Claire 的風衣卡在手扶梯裡。","en":"My phone got stuck between the seats.","tr":"我的手機卡在座位中間。","tip":"<b>延伸：</b>I'm stuck. 也可以是「我卡關了」。","th":8,"lv":1},{"p":"date night","zh":"約會之夜","scene":"情人節就是他們的約會夜。","en":"Friday is our date night. No kids allowed.","tr":"星期五是我們的約會夜，小孩不准跟。","tip":"<b>用法：</b>情侶、夫妻固定約會的晚上。","th":1,"lv":1}]},{"id":"mitch","name":"Mitchell 家和 Manny","who":"Mitchell · Cameron · Manny","plot":"Manny 在學校被人找麻煩，Mitchell 和 Cam 教他怎麼面對。","items":[{"p":"pick on","zh":"欺負、找某人麻煩","scene":"學校有人一直找 Manny 麻煩。","en":"Stop picking on your little brother.","tr":"別再欺負你弟了。","tip":"<b>搭配：</b>pick on + 人，多半是比自己弱的人。","th":5,"lv":1},{"p":"stand up to","zh":"勇敢對抗","scene":"大人們鼓勵 Manny 面對欺負他的人。","en":"You have to stand up to bullies.","tr":"你要勇敢面對霸凌你的人。","tip":"<b>對比：</b>stand up for 是支持；stand up to 是對抗。","th":5,"lv":1}]},{"id":"jay","name":"Jay 家","who":"Jay · Gloria","plot":"Jay 和 Gloria 去看單口喜劇，台上的笑話讓他們的反應很不一樣。","items":[{"p":"crack someone up","zh":"讓某人笑翻","scene":"有些笑話讓觀眾笑翻。","en":"My little sister always cracks me up.","tr":"我妹總是讓我笑翻。","tip":"<b>延伸：</b>That cracks me up. 笑死我了。","th":9,"lv":2},{"p":"lighten up","zh":"放輕鬆、別那麼嚴肅","scene":"有人被笑話弄得不太高興，另一半要他放輕鬆。","en":"Lighten up. It was just a joke.","tr":"放輕鬆啦，只是開個玩笑。","tip":"<b>語氣：</b>叫人別太認真，朋友間常用。","th":7,"lv":1},{"p":"can't take a joke","zh":"開不起玩笑","scene":"被拿來開玩笑的人不見得笑得出來。","en":"Don't tease him. He can't take a joke.","tr":"別捉弄他，他開不起玩笑。","tip":"<b>用法：</b>Can't you take a joke? 你開不起玩笑喔？","th":9,"lv":1},{"p":"hopeless romantic","zh":"無可救藥的浪漫主義者","scene":"情人節最能看出誰是浪漫派。","en":"He's a hopeless romantic. He still writes love letters.","tr":"他超浪漫的，到現在還在寫情書。","tip":"<b>語氣：</b>通常是帶點欣賞的調侃。","th":1,"lv":2}]}],"prompts":["你理想中的約會夜（用 date night、spice things up、hopeless romantic）","讓你笑翻的一個人或一件事（用 crack someone up、lighten up、can't take a joke）","你看過別人被欺負時有人挺身而出嗎（用 pick on、stand up to、get stuck）"],"challenges":[{"id":"c1","sit":"朋友被大家拿新髮型開玩笑就臭臉，你叫他放輕鬆，只是玩笑。","uses":["lighten up"],"ans":"Lighten up, man. It was just a joke."},{"id":"c2","sit":"你跟朋友說你女朋友每次講話都讓你笑翻。","uses":["crack someone up"],"ans":"She always cracks me up."},{"id":"c3","sit":"弟弟在學校一直被同學欺負，你鼓勵他勇敢面對。","uses":["pick on","stand up to"],"ans":"If they keep picking on you, you have to stand up to them."},{"id":"c4","sit":"你的機車鑰匙卡在座墊裡拿不出來，跟朋友求救。","uses":["get stuck"],"ans":"My key got stuck. Can you help me?"}]},"s01e16":{"title":"Fears","lede":"Phil 和 Luke 鑽進房子底下陰森的爬行空間；Haley 考了第三次終於拿到駕照；Manny 想克服對雲霄飛車的恐懼；Lily 說出第一個字竟然是「Mommy」，讓 Mitchell 和 Cam 很受傷。","stories":[{"id":"dunphy","name":"Dunphy 家","who":"Phil · Luke · Haley · Claire","plot":"Phil 帶 L
